# Cilium values — Argo-managed (matches the live helm release
# captured 2026-05-23). Bootstrap install in
# homelab-infra/ansible/files/cilium-{values,overrides}.yaml
# produces the SAME effective config; check-values-drift.sh
# verifies they stay in sync.
#
# Chart version pinned in kustomization.yaml. Renovate watches
# both the chart version + image tags. Per network.md (Cilium
# NetPol + Hubble + Gateway API) + ADR 0021 (observability).

# Upgrade compatibility — REQUIRED by upstream when moving a minor
# version, and load-bearing here beyond the usual reasons.
#
# At 1.20 the chart's default `envoy.xdsMode` becomes `ads`; the
# chart documents that it stays on the legacy mode "when
# upgradeCompatibility is set below 1.20". The Gateway renders to a
# SINGLE Envoy listener object shared by every route (one CEC, 3
# filter chains, 18 backendServices for 4 listeners), and a rebuild
# of that object is the leading explanation for the 2026-08-16
# outage where attachedRoutes on `https` went 19 -> 0 while every
# listener still reported Accepted=True/Programmed=True. Changing
# the xDS delivery mode in the same step as the agent upgrade is
# exactly the risk we are not taking.
#
# Verified rather than assumed: rendering this layer with the key set
# omits `envoy-xds-mode` from cilium-config entirely; rendering it
# without emits `envoy-xds-mode: ads`. That one-line delta is the
# whole reason the key is here.
#
# DELIBERATE DRIFT: ansible/files/cilium-values.yaml (the cold-start
# path) must NOT carry this. That is a fresh install, where upstream
# says the flag is not required, and setting it would pin every
# rebuilt-from-zero cluster to a legacy Envoy mode for a migration it
# never went through. check-values-drift.sh will report this pair;
# it is intentional and documented in both headers.
#
# Raise to "1.20" (or drop it) as a SEPARATE, deliberate change once
# 1.20 is bedded in — not as part of the upgrade.
upgradeCompatibility: "1.19"

autoDirectNodeRoutes: true
bandwidthManager:
  bbr: true
  enabled: true
bpf:
  hostLegacyRouting: false
  masquerade: true
  # Per-endpoint policy map size. Default 16384; 65536 is the hard cap
  # (PolicyMapMax = 1 << 16 in pkg/option/config.go). Entries are
  # (identity x port x proto), so the endpoint with the widest policy
  # overflows first — here Prometheus, whose `namespaceSelector: {}`
  # over ~36 scrape ports costs 36 entries per identity, i.e. the map
  # was full at ~455 identities. It overflowed on 2026-09-09 and
  # 2026-09-11 (pressure 1.33; 4.1M "Failed to add PolicyMap key … no
  # space left on device" in one week; 15-17 scrape targets down each
  # time; prometheus-0 without a sandbox for an hour — lessons.md,
  # TODO hl-0270). This is HEADROOM ONLY: the cause is identity
  # cardinality, handled by `extraConfig.labels` below.
  #
  # A size change makes the next agent start recreate every policy map
  # EMPTY ("Removed map pin, recreating and re-pinning map") and refill
  # it during endpoint regeneration — the usual restart-time gap, not a
  # new one.
  policyMapMax: 65536
cluster:
  id: 1
  name: homelab
cni:
  binPath: /opt/cni/bin
  confPath: /etc/cni/net.d
  install: true
encryption:
  enabled: false
gatewayAPI:
  enableAlpn: true
  enabled: true
hubble:
  enabled: true
  # Hubble TLS cert management. `method: cronJob` (not the chart
  # default `helm`) is deliberate: the helm method re-mints a
  # fresh self-signed CA on EVERY chart re-render, so any Argo
  # hard-refresh / redeploy silently rotated the CA and left
  # whichever workload didn't restart (agent vs relay) on the
  # old CA — hubble-relay was dead 51 days this way
  # (x509: signed by unknown authority "Cilium CA"), see
  # 99-journal/2026-07-13. The cronJob method persists the CA
  # in hubble-ca-secret and rotates only leaf certs on a
  # schedule, so re-renders no longer touch the CA.
  tls:
    auto:
      enabled: true
      method: cronJob
      # LEAF validity, and it must stay comfortably BELOW the CA's own
      # remaining life. It was 1095 — identical to the CA's total
      # validity (notBefore 2026-07-13, notAfter 2029-07-12, exactly
      # 1095 days) — so a leaf issued at any moment after the CA was
      # minted would outlive it. certgen 0.4.5 never checked; 0.4.8,
      # which arrives with Cilium 1.20, does:
      #
      #   CA certificate "Cilium CA" expires at 2029-07-12T07:17:00Z,
      #   which is before the requested validity of 26280h0m0s
      #
      # It refuses rather than re-minting the CA, so the existing CA
      # and a live hubble-relay were never at risk — the cronJob
      # method held, exactly as the note above intends. The upgrade
      # surfaced this early; the next quarterly rotation (1st of the
      # month, every 3rd month) would have failed the same way and
      # left stale leaves behind without anything obviously breaking.
      #
      # 365 is generous given leaves rotate quarterly, and leaves room
      # as the CA ages. When the CA itself is renewed, this ceiling
      # moves with it.
      certValidityDuration: 365
      schedule: "0 0 1 */3 *"   # rotate leaves quarterly; CA persists
  metrics:
    # Served on every agent at :9965 since install. Until 2026-09-14
    # nothing collected them: the chart's `hubble` ServiceMonitor had
    # no `release: kube-prometheus-stack` label, so Prometheus ignored
    # it (the cilium-agent :9962 scrape only exists because
    # observability/prometheus/cilium-podmonitor.yaml was hand-written
    # on 2026-07-18). And `drop`/`flow` carried no source/destination
    # context, so even scraped they could not answer "which namespace".
    #
    # Why this matters: an agent's Hubble ring buffer is 4,095 flows,
    # ~5 s on a worker at 800-900 flows/s; the flow-to-Loki sidecar
    # (hl-0125) has been out since 2026-05-23. These counters are the
    # only memory of AUDIT/DROPPED verdicts longer than that.
    # `namespace|reserved-identity`: namespace when the peer is a pod,
    # else `reserved:world` / `reserved:host` / ... (first non-empty,
    # docs.cilium.io/en/v1.20/observability/metrics/ "Context Options").
    # Labels come out as `source` and `destination`.
    enabled:
    - dns:query;ignoreAAAA
    - drop:sourceContext=namespace|reserved-identity;destinationContext=namespace|reserved-identity
    - tcp
    - flow:sourceContext=namespace|reserved-identity;destinationContext=namespace|reserved-identity
    - icmp
    - http
    serviceMonitor:
      enabled: true
      trustCRDsExist: true
      # The Prometheus CR selects monitors by this label only.
      labels:
        release: kube-prometheus-stack
  # L7 redaction (hl-0315, 2026-09-14). HTTP records from L7-policed
  # endpoints carry request headers in clear — Authorization, Cookie and
  # Set-Cookie values were seen in Hubble flows (header names checked,
  # never values) — and the export allowList below ships every L7 record
  # to Loki for 90 days. With `headers.allow`, every header NOT listed is
  # replaced by HUBBLE_REDACTED before the flow reaches the ring buffer,
  # the metrics, the export and `hubble observe` alike; urlQuery strips
  # GET parameters (tokens in query strings), userInfo the basic-auth
  # part of URLs. `allow` and `deny` are mutually exclusive in the chart.
  redact:
    enabled: true
    http:
      urlQuery: true
      userInfo: true
      headers:
        allow:
          - Accept
          - Content-Type
          - Content-Length
          - User-Agent
          - X-Request-Id
  # Static flow export → the hubble-flow-exporter sidecar (extraContainers
  # below; consumer side in observability/hubble-flow-exporter). Declared
  # here since 2026-09-14: the export had been running on bootstrap-era
  # ConfigMap keys that neither repo declared, written for a sidecar that
  # was removed on 2026-05-23 (hl-0125).
  #
  # allowList is the volume decision (ADR 0021 D5 wants the exfiltration
  # signal, not every packet): the cluster emits ~2,500 flows/s, two thirds
  # of them Longhorn replication traces. Entries are ORed; each is a JSON
  # FlowFilter (api/v1/flow/flow.proto). Kept: DROPPED/ERROR/AUDIT
  # verdicts; every L7 record (event_type 129 — DNS, HTTP); any flow with
  # `reserved:world` on either side — CIDR identities carry that label
  # too, so allowlisted egress is included. Not kept: intra-cluster
  # FORWARDED traces and policy-verdict events (event_type 4 and 5);
  # Prometheus counts those via hubble.metrics. ~120 flows/s measured.
  # Field names are the proto's (`Type`, `IP`, `is_reply`, `event_type`).
  export:
    static:
      enabled: true
      filePath: /var/run/cilium/hubble/events.log
      fileMaxSizeMb: 10
      fileMaxBackups: 5
      fileCompress: true
      fieldMask:
        - time
        - verdict
        - drop_reason_desc
        - traffic_direction
        - is_reply
        - Type
        - event_type
        - IP
        - l4
        - l7
        - source
        - destination
        - node_name
      allowList:
        - '{"verdict":["DROPPED","ERROR","AUDIT"]}'
        - '{"event_type":[{"type":129}]}'
        - '{"source_label":["reserved:world"]}'
        - '{"destination_label":["reserved:world"]}'
  # Hubble L7 flows carried Authorization, Cookie and Set-Cookie VALUES in
  # clear (measured 2026-09-14, header names counted only), and the static
  # export above ships L7 records to Loki through the hubble-flow-exporter
  # sidecar. Redaction happens in Hubble's L7 parser, before any consumer
  # (observe, relay, metrics, export). Allow-list, not deny-list: a header
  # nobody thought of is redacted by default. TODO hl-0315.
  relay:
    enabled: true
  ui:
    enabled: true
ingressController:
  enabled: false
ipam:
  mode: kubernetes
  operator:
    clusterPoolIPv4MaskSize: 24
    clusterPoolIPv4PodCIDRList:
    - 10.244.0.0/16
ipv4NativeRoutingCIDR: 10.244.0.0/16
k8sServiceHost: 10.10.30.11
k8sServicePort: 6443
kubeProxyReplacement: true

# L2 announcement — broadcasts LoadBalancer IPs onto the local
# VLAN via ARP so external clients can reach Gateway/Service
# VIPs without BGP. Required for CiliumL2AnnouncementPolicy to
# actually do anything (without these flags the policy CR is
# parsed but inert).
l2announcements:
  enabled: true
  leaseDuration: "15s"
  leaseRenewDeadline: "5s"
  leaseRetryPeriod: "2s"

# Enables neighbor discovery / ARP-resolution path on host —
# precondition for L2 announcer to install ARP entries.
l2NeighDiscovery:
  enabled: true

# Allow LoadBalancer Services to share IPs with externalIPs in
# the IPPool — required when LB-IPAM is the IP source.
externalIPs:
  enabled: true

# Supplementary cilium-config keys that have no first-class Helm value.
extraConfig:
  # Identity-relevant labels — EXCLUSIONS ONLY. pkg/labelsfilter appends
  # user patterns to Cilium's defaults, matches each as a start-anchored
  # regex against the label key, and keeps the default include set as
  # long as no positive pattern is given. So this narrows nothing but
  # the six keys named.
  #
  # Every CronJob run and every trivy scan job used to mint a
  # permanent-until-GC identity, because these keys are NOT in the
  # default exclusion list (only `controller-uid` and
  # `job-completion-index` are). Measured 2026-09-14: 209 distinct
  # `job-name` values across live identities, 200 identities created
  # before noon, the every-minute openbao-seal-watchdog alone ~60/h;
  # the cluster held 697 identities during the 2026-09-11 roll (TODO
  # hl-0269). Each identity costs the Prometheus endpoint 36
  # policy-map entries and every policied endpoint a regeneration
  # (355k on worker1 in a week).
  #
  # KEEP `woodpecker-ci.org/step` and `woodpecker-ci.org/repo-full-name`:
  # two ci-woodpecker CNPs select on them. `!woodpecker-ci\.org/task-uuid`
  # is start-anchored and cannot touch them. Verified 2026-09-14 that no
  # live CNP/CCNP/NetworkPolicy selects on any key excluded here.
  #
  # Takes effect for identities allocated after the agents restart (the
  # chart's config checksum rolls the DaemonSet); pods keep their current
  # identity until they restart. `!` MUST stay quoted — bare, it is a
  # YAML tag. Same value in homelab-infra/ansible/files/cilium-values.yaml.
  labels: '!job-name !batch\.kubernetes\.io/job-name !resource-spec-hash !trivy-operator\.resource\.name !trivy-operator\.resource\.namespace !woodpecker-ci\.org/task-uuid'

operator:
  replicas: 2
  # See rollOutCiliumPods below — same mechanism for the operator.
  rollOutPods: true
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi
routingMode: native
# Stamp the cilium-config checksum onto the agent DaemonSet (and, via
# operator.rollOutPods, the operator Deployment) so a config change ROLLS
# the pods. Without it a values change edits the ConfigMap and nothing
# else: on 2026-09-14 `labels` + `bpf-policy-map-max` landed in
# cilium-config while every agent kept running the old config, and Argo
# reported Synced/Healthy because the DaemonSet template had not changed.
# The chart default is false; the alternative is `kubectl rollout restart`,
# a manual edit to the running system (the 2026-07-13 restartedAt
# annotation is one such). Rolling on every config change is the point —
# the agent reads cilium-config only at start.
rollOutCiliumPods: true
securityContext:
  capabilities:
    ciliumAgent:
    - CHOWN
    - KILL
    - NET_ADMIN
    - NET_RAW
    - IPC_LOCK
    - SYS_ADMIN
    - SYS_RESOURCE
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    cleanCiliumState:
    - NET_ADMIN
    - SYS_ADMIN
    - SYS_RESOURCE

# hubble-flow-exporter sidecar (hl-0125, re-added 2026-09-14): Vector in
# the cilium-agent pod, reading the node's static export file and shipping
# to Loki. Pipeline, labels and alerts are owned by
# observability/hubble-flow-exporter; this block only says WHERE it runs.
# The 2026-05-23 removal was because the ConfigMap did not exist when the
# DaemonSet rolled; it has existed since, and the volume stays `optional`
# on purpose — a required ConfigMap would block the cilium-agent container
# itself on a fresh bootstrap (the bootstrap override in homelab-infra
# sets extraContainers: [] for that phase). Image pinned by digest;
# Renovate does not track this string (hl-0253).
extraContainers:
  - name: hubble-flow-exporter
    image: timberio/vector:0.58.0-distroless-libc@sha256:6c93dfe2554cc7e38316d618961cd657d5271c7a7aa727e0007502b28cb82c2e
    imagePullPolicy: IfNotPresent
    args:
      - --config-yaml
      - /etc/hubble-flow-exporter/vector.yaml
    env:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: VECTOR_LOG
        value: warn
    ports:
      - containerPort: 9598
        name: hubble-export
        protocol: TCP
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
      # events.log is 0600 root (written by cilium-agent); see the layer
      # README, caveat 1.
      runAsUser: 0
    volumeMounts:
      - mountPath: /var/run/cilium
        name: cilium-run
        readOnly: true
      - mountPath: /etc/hubble-flow-exporter
        name: hubble-flow-exporter-config
        readOnly: true
      - mountPath: /var/lib/vector
        name: hubble-flow-exporter-data
extraVolumes:
  - name: hubble-flow-exporter-config
    configMap:
      name: hubble-flow-exporter-config
      optional: true
      items:
        - key: vector.yaml
          path: vector.yaml
  - name: hubble-flow-exporter-data
    hostPath:
      path: /var/lib/vector/hubble-flow-exporter
      type: DirectoryOrCreate
