# Cilium values — Argo-managed (matches the live helm release
# captured 2026-05-23). Bootstrap install in
# homelab-infra/ansible/files/cilium-{values,overrides}.yaml
# produces the SAME effective config; check-values-drift.sh
# verifies they stay in sync.
#
# Chart version pinned in kustomization.yaml. Renovate watches
# both the chart version + image tags. Per network.md (Cilium
# NetPol + Hubble + Gateway API) + ADR 0021 (observability).

autoDirectNodeRoutes: true
bandwidthManager:
  bbr: true
  enabled: true
bpf:
  hostLegacyRouting: false
  masquerade: true
cluster:
  id: 1
  name: homelab
cni:
  binPath: /opt/cni/bin
  confPath: /etc/cni/net.d
  install: true
encryption:
  enabled: false
extraContainers:
- args:
  - --config-yaml
  - /etc/hubble-flow-exporter/vector.yaml
  env:
  - name: NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  - name: VECTOR_LOG
    value: warn
  image: timberio/vector:0.43.1-distroless-libc
  imagePullPolicy: IfNotPresent
  name: hubble-flow-exporter
  ports:
  - containerPort: 9598
    name: hubble-export
    protocol: TCP
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 64Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsUser: 0
  volumeMounts:
  - mountPath: /var/run/cilium
    name: cilium-run
    readOnly: true
  - mountPath: /etc/hubble-flow-exporter
    name: hubble-flow-exporter-config
    readOnly: true
  - mountPath: /var/lib/vector
    name: hubble-flow-exporter-data
extraVolumes:
- configMap:
    items:
    - key: vector.yaml
      path: vector.yaml
    name: hubble-flow-exporter-config
    optional: true
  name: hubble-flow-exporter-config
- hostPath:
    path: /var/lib/vector/hubble-flow-exporter
    type: DirectoryOrCreate
  name: hubble-flow-exporter-data
gatewayAPI:
  enableAlpn: true
  enabled: true
hubble:
  enabled: true
  export:
    fileCompress: true
    fileMaxBackups: 5
    fileMaxSizeMb: 10
    static:
      enabled: true
      fieldMask:
      - time
      - source
      - destination
      - verdict
      - drop_reason_desc
      - traffic_direction
      - l4
      - l7
      filePath: /var/run/cilium/hubble/events.log
  metrics:
    enabled:
    - dns:query;ignoreAAAA
    - drop
    - tcp
    - flow
    - icmp
    - http
    serviceMonitor:
      enabled: true
      trustCRDsExist: true
  relay:
    enabled: true
  ui:
    enabled: true
ingressController:
  enabled: false
ipam:
  mode: kubernetes
  operator:
    clusterPoolIPv4MaskSize: 24
    clusterPoolIPv4PodCIDRList:
    - 10.244.0.0/16
ipv4NativeRoutingCIDR: 10.244.0.0/16
k8sServiceHost: 10.10.30.11
k8sServicePort: 6443
kubeProxyReplacement: true
operator:
  replicas: 2
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi
routingMode: native
securityContext:
  capabilities:
    ciliumAgent:
    - CHOWN
    - KILL
    - NET_ADMIN
    - NET_RAW
    - IPC_LOCK
    - SYS_ADMIN
    - SYS_RESOURCE
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    cleanCiliumState:
    - NET_ADMIN
    - SYS_ADMIN
    - SYS_RESOURCE
