# Cilium runtime config — post-bootstrap.
# Cilium itself is INSTALLED by ansible/playbooks/09b-argocd-bootstrap.yml
# in homelab-infra (sync-wave -10 from Argo's perspective is
# "Argo takes over an already-installed component").
#
# This kustomization re-applies the Helm release with values
# matching the bootstrap install. Once Argo owns it, all
# future changes go through git.
#
# Drift check: `helm get values cilium -n kube-system` should
# match values.yaml here.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: cilium
    # ADR 0052 D3: chart from the Forgejo Packages mirror (was https://helm.cilium.io).
    #
    # Converted last of the tier-0 group, 2026-08-19. The circularity is real and
    # accepted (plan A5 G4): Cilium is the CNI, so if it is down the registry is
    # unreachable and this layer cannot be rendered from the mirror. Running
    # state persists regardless, and the break-glass is a commit repointing this
    # line at upstream or the bundle — the same shape as ADR 0037 for git, and
    # the same one platform/forgejo needed on 2026-08-19.
    repo: oci://registry.homelab.internal/homelab
    version: "1.20.0"  # OPERATOR PINS via Renovate
    releaseName: cilium
    namespace: kube-system
    valuesFile: values.yaml
    includeCRDs: true
