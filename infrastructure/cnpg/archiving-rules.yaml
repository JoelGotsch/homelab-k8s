# PrometheusRules for the CNPG operator's per-cluster barman WAL
# archive path.
#
# Closes the deferred follow-up in
# 99-journal/2026-06-09-cluster-state-survey.md
# §CrowdSec barman-cloud archive audit → "Follow-ups":
#   "The pre-flight failure was visible in the cluster condition for
#    4 days without paging — ContinuousArchivingFailing should be
#    an alertmanager rule."
#
# Metric source: the CNPG instance manager's metrics endpoint at
# :9187, scraped via the cnpg-cloudnative-pg PodMonitor (operator
# values.yaml monitoring.podMonitorEnabled=true). Per-cluster
# instance-level metrics are surfaced because the per-Cluster
# `monitoring.enablePodMonitor: true` is the convention in
# `infrastructure/cnpg/README.md` skeleton (and every existing
# Cluster CRD in the repo sets it).
#
# Metric names verified on 2026-06-09 against `crowdsec-lapi-1`
# (CNPG 1.25.0 / chart 0.23.0). No `cnpg_collector_continuous_-
# archiving_failing` gauge exists at this version; the operative
# signals are the `cnpg_pg_stat_archiver_*` family, which mirror
# PostgreSQL's own `pg_stat_archiver` view. The rule below uses
# `last_failed_time > last_archived_time` as the canonical
# "most recent archive attempt failed" condition — exactly what
# the cluster `ContinuousArchivingFailing` condition tracks.
#
# Routing (per kube-prometheus-stack alertmanager-config.yaml):
#   severity: warning  → ntfy only
#   severity: critical → ntfy AND approval-channel (Signal bridge)
# `component: cnpg` is an operator-side filter only; not matched
# by AM routes today.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-continuous-archiving
  namespace: cnpg-system
  labels:
    app.kubernetes.io/name: cloudnative-pg
    release: kube-prometheus-stack
spec:
  groups:
    - name: cnpg-continuous-archiving
      interval: 1m
      rules:
        # Most recent archive attempt failed AND the failure is more
        # recent than the most recent success — i.e. the archive
        # path is broken right now, not just intermittently flapping.
        #
        # `for: 15m` is the gate the operator-facing audit
        # explicitly named ("more than 15 minutes" follow-up). It
        # absorbs:
        #   - The ~60s barman retry cycle on a single transient
        #     network blip.
        #   - The post-pod-restart window where the archiver hasn't
        #     yet recorded a fresh success.
        #   - MinIO endpoint flaps during minio-on-nas pod restarts.
        # And it still fires well inside the operator's normal
        # response window, so a real `Expected empty archive` /
        # credential / endpoint failure pages on the same workday.
        #
        # warning (not critical) per convention with the existing
        # CrowdSec + Trivy rules: the LAPI / app keeps serving live
        # traffic, only WAL backup is stalled. RPO degradation is
        # serious but not service-down. Operator triages via
        # cluster-rebuild.md when the failure is the
        # stale-barman-prefix class observed 2026-06-09.
        - alert: CNPGContinuousArchivingFailing
          expr: |
            cnpg_pg_stat_archiver_last_failed_time
              > cnpg_pg_stat_archiver_last_archived_time
          for: 15m
          labels:
            severity: warning
            component: cnpg
            # Escalate to Signal after 55m (alert-routing.md
            # opt-in). Stalled WAL archiving → PV fills → Postgres
            # refuses to start; page before it becomes an outage.
            escalate_after: "1h"
          annotations:
            summary: "CNPG WAL archive failing for cluster {{ $labels.namespace }}/{{ $labels.cluster }}"
            description: |
              The CNPG instance manager reports that the most recent
              `archive_command` invocation failed AND no successful
              archive has happened since. WAL is accumulating on the
              local PV; if this continues for hours the PV will fill
              and Postgres will refuse to start
              (`Detected low-disk space condition`), per the
              2026-06-09 CrowdSec cascade.

              Triage:
                kubectl -n {{ $labels.namespace }} get cluster.postgresql.cnpg.io \
                  -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.conditions[?(@.type=="ContinuousArchiving")].message}{"\n"}{end}'
                kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c postgres --tail=50 \
                  | grep -i 'barman\|archive'

              Common causes (in observed order):
                1. Stale barman prefix from a prior Cluster instance
                   sharing the same `serverName` + `destinationPath`
                   — fix via runbook
                   homelab-docs/03-runbooks/cnpg/cluster-rebuild.md.
                2. ExternalSecret/<app>-cnpg-s3 desynced — check
                   `kubectl -n {{ $labels.namespace }} get externalsecret`.
                3. MinIO endpoint unreachable — check
                   `kubectl -n minio-on-nas get pods`.
                4. S3 credentials rotated without reseeding OpenBao
                   `kv/cnpg/<app>/s3-creds`.
            runbook_url: "https://github.com/JoelGotsch/homelab-docs/blob/phase_1_bring_up/03-runbooks/cnpg/cluster-rebuild.md"

        # ---------------------------------------------------------------
        # Base-backup lane. The rule above only sees WAL archiving; a
        # cluster whose base backups stopped keeps archiving happily
        # while its recoverability point ages out of the retention
        # window. That is exactly what happened to librechat-vectordb
        # between 2026-08-07 and 2026-08-14: WAL was fine once the
        # credentials landed, but a Backup object wedged in a
        # non-terminal phase blocked its ScheduledBackup for eight days
        # ("The system is already taking a backup for this
        # ScheduledBackup", every 60s, no self-recovery) and nothing
        # alerted.
        #
        # Metric names differ before and after the barman-cloud plugin
        # migration, so both are matched: `or` unions by label set and
        # prefers the left-hand series where both exist.
        #
        # `> 0` matters: replicas export these gauges as 0, so an
        # unfiltered max() would report every cluster as never-backed-up.
        - alert: CNPGBaseBackupStale
          expr: |
            time() - max by (namespace, cluster) (
              (cnpg_collector_last_available_backup_timestamp > 0)
              or
              (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp > 0)
            ) > 129600
          for: 2h
          labels:
            severity: warning
            component: cnpg
          annotations:
            summary: "CNPG base backup is stale for {{ $labels.namespace }}/{{ $labels.cluster }}"
            description: |
              No successful base backup in more than 36 hours, against a
              nightly ScheduledBackup. WAL archiving may still be healthy —
              this is about the recoverability POINT, not the WAL stream.

              Triage (note the fully-qualified resource: plain `backup`
              resolves to longhorn.io on this cluster and silently reports
              nothing):
                kubectl -n {{ $labels.namespace }} get backups.postgresql.cnpg.io \
                  --sort-by=.metadata.creationTimestamp
                kubectl -n {{ $labels.namespace }} get scheduledbackup

              The common cause is a Backup stuck in a non-terminal phase:
              the ScheduledBackup will not create another until it
              finishes, and it does not recover on its own. Delete the
              wedged Backup object, then confirm the next run completes.

        - alert: CNPGBackupFailing
          expr: |
            max by (namespace, cluster) (
              (cnpg_collector_last_failed_backup_timestamp)
              or
              (barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp)
            )
            >
            max by (namespace, cluster) (
              (cnpg_collector_last_available_backup_timestamp)
              or
              (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
            )
          for: 30m
          labels:
            severity: warning
            component: cnpg
          annotations:
            summary: "CNPG base backup failing for {{ $labels.namespace }}/{{ $labels.cluster }}"
            description: |
              The most recent base backup attempt failed and no successful
              one has happened since. Same triage as CNPGBaseBackupStale;
              check the backup object's `.status.error` and the barman
              sidecar's logs:
                kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} \
                  -c plugin-barman-cloud --tail=50

        # A cluster that has NEVER been backed up reports 0 on every
        # instance, so the staleness rule above (which filters `> 0`)
        # cannot see it. conversation-history-pg was exactly this on
        # 2026-08-14: bootstrapped with no spec.backup, no ObjectStore,
        # no ScheduledBackup, and no signal anywhere.
        - alert: CNPGClusterHasNoBackup
          expr: |
            count by (namespace, cluster) (
              cnpg_collector_last_available_backup_timestamp == 0
            )
            unless
            count by (namespace, cluster) (
              (cnpg_collector_last_available_backup_timestamp > 0)
              or
              (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp > 0)
            )
          for: 6h
          labels:
            severity: warning
            component: cnpg
          annotations:
            summary: "CNPG cluster {{ $labels.namespace }}/{{ $labels.cluster }} has no backup at all"
            description: |
              No instance of this cluster reports a successful base backup.
              Either the cluster was created without a backup lane, or its
              first backup has never completed.

              A new CNPG cluster needs: an ObjectStore in its namespace, a
              `plugins:` entry with isWALArchiver on the Cluster, a
              ScheduledBackup with `method: plugin`, and the MinIO service
              account seeded into OpenBao (provision-minio-svcacct.sh).
              See homelab-docs/03-runbooks/cnpg/barman-plugin-migration.md.
              `for: 6h` tolerates the gap between creating a cluster and
              its first `immediate: true` backup completing.
