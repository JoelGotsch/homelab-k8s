# Spegel — peer-to-peer OCI image cache DaemonSet per ADR 0019 D4.
#
# Chart is published as an OCI artifact at
# `oci://ghcr.io/spegel-org/helm-charts/spegel`. kustomize 5+'s
# `helmCharts:` generator handles `oci://` repos out of the box
# since Helm 3.10.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: spegel

resources:
  - namespace.yaml
  - networkpolicy.yaml

helmCharts:
  - name: spegel
    repo: oci://ghcr.io/spegel-org/helm-charts
    version: "0.7.4"  # OPERATOR PINS via Renovate (helmv3 manager)
    releaseName: spegel
    namespace: spegel
    valuesFile: values.yaml
    includeCRDs: false
