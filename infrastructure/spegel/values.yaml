# Spegel — peer-to-peer container image cache.
# Per ADR 0019 D4. Mitigates the homelab's 1 GbE WAN-link
# during mass-restart / image-pull bursts: first node to pull
# an image serves it to peers over cluster network instead of
# every node racing back to the upstream registry.
#
# Talos-specific configuration (CRITICAL):
# ----------------------------------------
# Talos exposes containerd's CRI registry-config dir at
#   /etc/cri/conf.d/hosts
# rather than the chart-default `/etc/containerd/certs.d`.
# Talos's containerd is rendered from
#   /etc/cri/conf.d/{00-base,01-registries,20-customization}.part
# and the merged `/etc/cri/conf.d/cri.toml` pins
#   [plugins.'io.containerd.cri.v1.images'.registry]
#     config_path = '/etc/cri/conf.d/hosts'
# (verified on Talos v1.13.0 / containerd 2.2.3 — see README).
#
# Spegel writes one subdir per mirrored registry into that path
# (e.g. `/etc/cri/conf.d/hosts/docker.io/hosts.toml`) and
# containerd picks the mirror up without restart.
#
# NO machine-config patch is required on Talos for this path
# to be writable: `/etc/cri/conf.d/hosts` is a tmpfs-backed
# directory that Spegel's initContainer creates entries in via
# the hostPath mount; the chart-default DirectoryOrCreate
# volume type handles the bootstrap.

image:
  repository: ghcr.io/spegel-org/spegel
  pullPolicy: IfNotPresent
  # Pinned by digest via Renovate per ADR 0019 update-policy.
  # Chart pins its own image digest in Chart's values; allow the
  # chart-managed digest to flow through.

# Run on every node — control-plane included — so CP-pulled
# images (cilium, kube-prometheus-stack, openbao …) participate
# in the peer cache too. The chart's default tolerations
# already include NoSchedule/NoExecute/CriticalAddonsOnly, so
# CP-tainted nodes are tolerated out of the box.
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - effect: NoExecute
    operator: Exists
  - effect: NoSchedule
    operator: Exists

nodeSelector:
  kubernetes.io/os: linux

# Pod resource budget. 128Mi is the upstream default and has
# been adequate at 6-node, ~100-image homelab scale per
# upstream guidance.
resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    memory: 256Mi

priorityClassName: system-node-critical

# ServiceMonitor — scraped by kube-prometheus-stack which
# selects via `release: kube-prometheus-stack` (observability
# layer convention). Chart-managed SM keeps endpoint/port
# wiring in sync with chart upgrades.
serviceMonitor:
  enabled: true
  interval: 60s
  scrapeTimeout: 30s
  labels:
    release: kube-prometheus-stack

# Grafana dashboard via sidecar discovery (kube-prometheus-stack
# Grafana runs the dashboards sidecar with label selector
# `grafana_dashboard: "1"`).
grafanaDashboard:
  enabled: true
  sidecarLabel: grafana_dashboard
  sidecarLabelValue: "1"

spegel:
  logLevel: INFO

  # ---- Talos-specific path overrides ----
  # See header for the Talos containerd path lineage.
  containerdSock: /run/containerd/containerd.sock
  containerdNamespace: k8s.io
  containerdRegistryConfigPath: /etc/cri/conf.d/hosts
  containerdContentPath: /var/lib/containerd/io.containerd.content.v1.content

  # Spegel writes only the explicitly listed third-party registry subdirs.
  # Talos machine.registries owns the two first-party subdirs; the scopes
  # must remain disjoint because Spegel moves pre-existing entries it owns
  # under `_backup` during initialization.
  containerdMirrorAdd: true

  # THIRD-PARTY registries only (2026-07-19). The earlier "mirror all"
  # setting rested on the false assumption that no Talos
  # machine.registries config existed. The containerd-registry patch was
  # applied to all 6 nodes on 2026-07-13, and Spegel's _default
  # wildcard displaced the Talos per-registry hosts.toml
  # (server fallback + CA) into _backup/ on every node. Every FRESH
  # first-party pull then dead-ended at Spegel's 404 (containerd
  # NotFound -> ImagePullBackOff; approval-channel down 27h after its
  # failover reschedule). First-party images are in-cluster via the
  # ADR 0038 direct path — P2P caching buys nothing there; scoping
  # Spegel to the big third-party registries restores the Talos config
  # for everything first-party.
  mirroredRegistries:
    - https://docker.io
    - https://ghcr.io
    - https://quay.io
    - https://registry.k8s.io
    - https://gcr.io

  # Resolve tags to digests so peer cache hits work even when
  # the upstream registry's tag→digest mapping is unavailable.
  resolveTags: true
  resolveLatestTag: true

  # Keep Spegel's mirror config additive. If a Talos
  # machine.registries.mirrors block is ever added (e.g. to
  # point a registry through a corporate proxy), Spegel will
  # prepend rather than replace.
  prependExisting: true

  # Mirror-resolve budget: 3 retries × 20ms is enough at LAN
  # latency. If a peer doesn't have the layer in <60ms total,
  # fall through to upstream — sub-second pull-failure is the
  # goal here.
  mirrorResolveRetries: 3
  mirrorResolveTimeout: "20ms"

  # Debug web UI on the registry port — useful for manual
  # cache inspection (`kubectl port-forward ds/spegel 29020`).
  debugWebEnabled: true

# Liveness probe (/livez on the registry port) — 2026-07-20
# reboot-cascade hardening. A mesh-broken Spegel (routing table
# empty after a PEER's reboot) hangs containerd pulls and never
# self-heals, though a pod restart fixes it in <1s; without a
# liveness probe nothing ever restarts it. Chart 0.7.4 top-level
# key, verified against the pulled chart template (adds httpGet
# /livez). The reboot-cascade janitor covers whatever /livez
# doesn't (known-caveats 2026-07-20).
livenessProbe:
  enabled: true

service:
  registry:
    port: 5000
    nodePort: 30021
    # hostPort must NOT fall inside the NodePort range
    # (30000-32767). Cilium kube-proxy-replacement explicitly
    # refuses to program hostPort entries colliding with
    # NodePort, logging "The requested hostPort is colliding
    # with the configured NodePort range. Ignoring." The
    # original `30020` had been silently dark cluster-wide
    # since chart install (5d12h before discovery 2026-06-10);
    # containerd's mirror fallback to NodePort 30021 + upstream
    # masked it until pr-agent's upstream 404 forced both legs
    # to fail. Diagnosis at 99-journal/2026-06-10-spegel-worker1-down.md.
    hostPort: 29020
    topologyAwareHintsEnabled: true
  router:
    port: 5001
  metrics:
    port: 9090
  cleanup:
    port: 8080

# VPA off — 128-256Mi static budget is well-bounded and Spegel
# is on the critical path of every image pull; predictable
# resource shape is preferable to autotuned shape here.
verticalPodAutoscaler:
  enabled: false
