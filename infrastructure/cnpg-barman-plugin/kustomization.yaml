# Barman Cloud CNPG-I plugin — the backup path for every CNPG
# database once the in-core `spec.backup.barmanObjectStore` support is
# gone.
#
# In-core barman is deprecated since CloudNativePG 1.26 and REMOVED in
# 1.31.0. This cluster runs 1.30.0 (chart 0.29.0 in
# ../cnpg/kustomization.yaml), so the removal arrives as an ordinary
# Renovate chart bump. The operator chart is held in renovate.json5
# until every Cluster is migrated onto this plugin; the migration
# procedure is
# homelab-docs/03-runbooks/cnpg/barman-plugin-migration.md.
#
# Installed from the chart rather than the release manifest.yaml on
# purpose: the manifest ships the sidecar image reference in a Secret,
# and `cnpg-system` is a first-party namespace, so Kyverno
# `homelab-disallow-inline-secrets` would demand an ESO-owned Secret or
# a waiver annotation for a value that is not secret at all. The chart
# puts the same value in a ConfigMap, and it fits the repo's
# helmCharts + Renovate pattern.
#
# A chart bump here is a FLEET-WIDE DATABASE RESTART, not a
# control-plane change: the chart's ConfigMap carries SIDECAR_IMAGE,
# the operator rebuilds every instance pod spec with the new native
# sidecar, recreates the replicas and restarts the primaries in place
# (default primaryUpdateMethod: restart). Observed 2026-09-10 on the
# 0.7.1 -> 0.8.0 bump: 14 clusters, 28 UpgradingInstance events,
# starting four minutes after the new plugin pod took leadership --
# after Argo had reported this Application Healthy. Schedule it,
# snapshot `kubectl get clusters.postgresql.cnpg.io -A` before, and
# treat "every Cluster healthy with the new sidecar image on a
# primary" as the completion signal (lessons.md, CloudNativePG).
#
# Prerequisites (both satisfied here): CloudNativePG >= 1.26 in this
# same namespace, and cert-manager — the chart issues the plugin's
# gRPC client/server certificates through a namespace-local
# self-signed Issuer, which is why nothing here touches the homelab
# PKI.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: plugin-barman-cloud
    # ADR 0052 D3: chart from the Forgejo Packages mirror (was https://cloudnative-pg.github.io/charts).
    repo: oci://registry.homelab.internal/homelab

    version: "0.8.0"  # → plugin v0.15.0. OPERATOR PINS via Renovate.
    releaseName: barman-cloud
    namespace: cnpg-system
    valuesFile: values.yaml
    includeCRDs: true
