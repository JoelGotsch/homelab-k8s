# nas-crypt-internal-archive — TWO tenants, both declared as
# static PVs in persistentvolumes.yaml:
#   conversation-history/vault      → conversation-history/vault
#   nextcloud/internal-archive      → nextcloud/internal-archive
# This is the share where the shared-root default did real damage
# (see the header). Two tenants is fine; two tenants *at the same
# path* was not.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nas-crypt-internal-archive
  annotations:
    # `parameters` and `mountOptions` are immutable — Argo must delete and
    # recreate this class to change them, not patch it. Without this, every
    # edit below wedges the csi-rclone Application in a permanent sync error.
    # Safe: bound PVs hold their own copy; a class is read only at provision.
# vfs-cache-mode=writes is LOAD-BEARING on this share, not tuning.
# An rclone mount without a VFS cache cannot append to an existing
# file. Measured 2026-08-15, same driver / node / minute:
#   this class (no cache)          → open(path,"a") failed 8/8, PermissionError [Errno 1]
#   personal-photos (cache=full)   → succeeded 8/8
# That broke conversation-history's nightly `seal` and
# `contacts-sync` from the moment its archive landed in-cluster,
# leaving half-written state each time (files copied, ledger not
# updated).
#
# `writes` not `full`: the writers here need a write cache; `full`
# would additionally cache reads of a 14 GiB archive that is read
# rarely. Cost is bounded and measured — 512 MiB written through a
# cached mount moved the node plugin's RSS by under 1 MB (the VFS
# stages to disk, not memory), and the cache lives on the node root
# filesystem (workers: 1.9 TB, 1.2 TB free).
#
# The cache is per-REMOTE, not per-PVC, so vfs-cache-max-size is a
# budget shared by every mount of this share on a node.
mountOptions:
  - allow-other=true
  - file-perms=0666
  - dir-perms=0777
  - vfs-cache-mode=writes
  - vfs-cache-max-size=10G
  - vfs-cache-max-age=6h
provisioner: rclone.csi.veloxpack.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  remote: "nas-crypt-internal-archive"
  # Parking path — see the header. NOT the share root, and NOT where any
  # real dataset lives. Real datasets are static PVs in persistentvolumes.yaml.
  remotePath: "_unallocated/${pvc.metadata.namespace}/${pvc.metadata.name}"
  allow_other: "true"
  uid: "0"
  gid: "0"
  csi.storage.k8s.io/node-publish-secret-name: "nas-crypt-internal-archive-config"
  csi.storage.k8s.io/node-publish-secret-namespace: "csi-rclone"
---
