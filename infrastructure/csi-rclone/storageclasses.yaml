# StorageClasses backed by csi-rclone — one per `personal+`
# share per ADR 0030 §D1. Each maps to a chained
# `crypt:` over `smb:` remote whose config sits in the matching
# Secret (see externalsecret.yaml).
#
# ══════════════════════════════════════════════════════════════
# READ THIS BEFORE CLAIMING ONE OF THESE CLASSES — ADR 0051
# ══════════════════════════════════════════════════════════════
#
# **Every real dataset on these shares is a STATIC PV declared in
# persistentvolumes.yaml.** Claim one by name:
#
#   spec:
#     storageClassName: nas-crypt-<share>
#     volumeName: nas-<share>-<namespace>-<component>   # <- required
#
# Dynamic provisioning against these classes is NOT the supported
# path and never allocates you a dataset. Until 2026-08-15 it was
# actively dangerous: every class carried `remotePath: ""`, so a
# freshly provisioned PVC mounted the ROOT of the share — the same
# directory tree every other claimant already had. That is how a
# scratch PVC ended up inside `conversation-history`'s live L0
# vault, and a routine cleanup `rm` deleted its ledger files. The
# mistake was reasonable: nothing here said a PVC meant anything
# other than what a PVC normally means.
#
# So `remotePath` below is now a PARKING PATH, not the share root.
# A PVC provisioned dynamically by accident lands in an empty,
# isolated `_unallocated/<namespace>/<pvc-name>` directory where it
# can do no harm — while still sitting inside the share, so the
# offsite backup covers it and it shows up in a listing rather than
# vanishing. Template substitution is supported by the pinned
# driver (v0.4.11, `pkg/rclone/rclone.go:38-40`, applied in
# `controllerserver.go:122`); the provisioner runs with
# `--extra-create-metadata=true`, which is what supplies the PVC
# name and namespace.
#
# The parking path is a backstop, not an allocation mechanism. If
# you find a PVC living in `_unallocated/`, that is a bug to fix by
# declaring a proper PV — not a working configuration.
#
# NOTE: BOTH `mountOptions` AND `parameters` are IMMUTABLE on a
# StorageClass. Verified by server dry-run 2026-08-15, which is how
# this was caught rather than discovered during a sync:
#
#   StorageClass "nas-crypt-internal-archive" is invalid:
#   parameters: Invalid value: {...}: field is immutable
#
# So editing `remotePath` here is a delete-and-recreate, not a patch.
# The one-time recreate these classes needed was done 2026-08-15. Any FUTURE
# immutable edit must be a deliberate delete/recreate, not a standing
# Force=true,Replace=true — which would let Argo silently recreate a
# StorageClass (and orphan its PVs) on any accidental immutable change.
# Historically each class carried those sync options
# so Argo performs that recreate itself instead of failing every sync
# forever. Deleting a StorageClass is safe for existing data: a class
# is consulted only at provisioning time, and every bound PV carries
# its own copy of these values.
#
# Adding a new share at consumer-onboarding time:
#   1. Operator generates the per-share crypt key +
#      offline-recovery archive update per
#      `03-runbooks/nas/rclone-crypt-key-bootstrap.md`.
#   2. Add an ExternalSecret in this layer pulling
#      `kv/prod/nas-encryption/<share>/rclone_config`.
#   3. Add the matching StorageClass below pointing at the
#      Secret name.
#   4. Add the dataset's static PV to persistentvolumes.yaml.
#   5. Add the share to the offsite backup source list in
#      `infrastructure/backup-cronjobs/nas-personal-pvcs.yaml`,
#      or record why not.
#   6. Cold-start.md Step 13c gets a row for the new share.

# nas-crypt-personal-photos — Immich library backend.
# Per ADR 0030 §D2 only the *originals* sub-tree of Immich's
# UPLOAD_LOCATION lives here; thumbs/encoded-video/profile
# stay on Longhorn.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nas-crypt-personal-photos
  annotations:
    # `parameters` and `mountOptions` are immutable — Argo must delete and
    # recreate this class to change them, not patch it. Without this, every
    # edit below wedges the csi-rclone Application in a permanent sync error.
    # Safe: bound PVs hold their own copy; a class is read only at provision.
# 2026-08-07: vfs-cache-mode=full is LOAD-BEARING for Immich. Without a
# write cache rclone can't seek on writes, so Node's fs.copyFile (the
# storage-template hot→cold move) fails EBADF and strands originals on the
# hot tier; cache-off also RAM-buffers writes and OOMs the mounter. Format
# is `key=value` (no leading --) — the driver's only mount-flag lever
# (values.yaml defaultMountOptions is dead config; see there). The live
# immich-originals PV was patched with these same options, and as of ADR 0051
# they are written out on the static PV that replaces it — which is now the
# only thing that mounts this share for real. These options remain here so a
# parked `_unallocated/` volume behaves sanely, not because Immich depends on
# them. (The old note about needing a manual SC delete+recreate is handled by
# a deliberate delete/recreate; the standing sync option was removed 2026-08-18.)
mountOptions:
  - allow-other=true
  - file-perms=0666
  - dir-perms=0777
  - vfs-cache-mode=full
  - vfs-cache-max-size=50G
  - vfs-cache-max-age=24h
provisioner: rclone.csi.veloxpack.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  # Top-level remote name as defined in the rclone INI in the
  # referenced Secret. Driver mounts `<remote>:<remotePath>`.
  remote: "nas-crypt-personal-photos"
  # Parking path — see the header. NOT the share root, and NOT where any
  # real dataset lives. Real datasets are static PVs in persistentvolumes.yaml.
  remotePath: "_unallocated/${pvc.metadata.namespace}/${pvc.metadata.name}"
  allow_other: "true"
  uid: "0"
  gid: "0"

  # Secret holding the rclone INI (configData key). Per-share
  # so that key compromise of one share doesn't expose
  # another.
  csi.storage.k8s.io/node-publish-secret-name: "nas-crypt-personal-photos-config"
  csi.storage.k8s.io/node-publish-secret-namespace: "csi-rclone"
---
