# csi-rclone storage-class conformance probe — ADR 0058 D4.
#
# WHY
#
# A storage class is an interface with a contract. Until 2026-08-31 this
# workspace tested none of them, and the contract was discovered to be broken by
# an application losing a 45 MB ledger twice in three days.
#
# Application CI could not have caught that. `open(path, "a")` is guaranteed to
# append on a POSIX filesystem, the code was correct, and every unit test on
# tmpfs passed. The defect lived in the assumption that the production
# filesystem honours the contract the test filesystem honours. So the thing that
# has to be tested is the SUBSTRATE.
#
# WHAT IT DOES
#
# Two volumes, identical except for `vfs-cache-mode` (see persistentvolumes.yaml
# — both are on a deliberately tiny 16Mi/60s cache so that an eviction happens
# in minutes rather than the fortnight the real 10G/6h mounts took). On each, the
# probe writes a ~45 MB file whole, appends ONE record, forces that object out of
# the cache, appends a SECOND record, and then checks that every byte survived.
#
# The gap is the entire test. The failure needs a RE-FETCH — the object has to
# leave the cache and be pulled back before it can fail to come back whole — so
# the probe forces the entry cold two ways at once: it sleeps past
# `vfs-cache-max-age`, and it pushes 48 MiB of unrelated bytes through the same
# mount to provoke a size eviction against a 16Mi cache. Note that the 45 MB
# subject file already exceeds that cache on its own, which is the pressure the
# real 10 GiB cache only reached when Immich, Nextcloud and the registry were
# competing for it.
#
# The interesting output is the DIFFERENCE between the two mounts. Each mount
# returns one of THREE states, not two:
#
#   PASS          bytes intact AND a cold re-fetch was demonstrably forced
#   FAIL          bytes corrupted -- meaningful whether or not we forced it
#   INCONCLUSIVE  bytes intact but the object never went cold. The run tested
#                 NOTHING. Not a pass, not evidence that `writes` is safe.
#
#   writes FAIL, full PASS   → the calibrated case. The probe discriminates
#                              between modes; ADR 0058's mechanism is REPRODUCED
#                              rather than inferred. This is the goal.
#   full FAIL                → exit 1, incident. Every real volume uses `full`.
#   either INCONCLUSIVE      → the experiment did not run. Say so; change a knob.
#   both PASS                → control uncalibrated. `full` is not broken, but
#                              this run cannot show it is BETTER than `writes`.
#
# HISTORY — TWO PREVIOUS VERSIONS COULD NOT FAIL. THAT IS THE POINT OF v3.
#
# **v1** wrote 6,000 records in a tight loop; both mounts passed byte-identically.
# A tight loop keeps the file continuously hot, so nothing is ever re-fetched and
# nothing can fail to re-fetch. It reproduced the access pattern (many opens) but
# not the timing (long gaps), and the timing is what matters: production appended
# once per blob across hours against `vfs-cache-max-age=6h`.
#
# **v2** replaced the loop with two appends separated by a forced-cold gap. Both
# mounts passed again — 47,202,304 bytes, 0 NUL, identical to the byte. The CSI
# driver log explains why, and it invalidates the whole experiment:
#
#   * ZERO eviction, download or re-fetch lines across the entire 5m39s window.
#   * Mount-to-unmount was 339s, of which 330s was the probe's own `sleep` —
#     leaving ~9s for ~276 MB of I/O. That is local-disk speed, not a 45 MB
#     re-materialisation over SMB-behind-crypt.
#   * At unmount the driver still logged `Waiting for VFS cache uploads
#     (in progress: 0, queued: 1, retry: 1/5)` — an upload was STILL QUEUED after
#     the probe had already read the file back and declared PASS.
#
# So v2 wrote into the local cache and read back out of the local cache. The
# bytes never round-tripped to the remote, and a probe that never reaches the
# remote cannot observe remote corruption. **v2 asserted an eviction it never
# measured**, which is exactly what rule 2 of the workspace's infra-apply
# discipline forbids: verification of assumptions belongs INSIDE the script, and
# a wrong assumption must fail loudly rather than silently no-op.
#
# **v3 measures its own precondition.** It drains the write-back queue before
# trying to evict (you cannot evict what was never uploaded), times every phase,
# and requires append #2 to take at least `PROBE_MIN_COLD_SECONDS` — because
# materialising 45 MiB from the remote cannot be instant. Below that floor it
# exits INCONCLUSIVE instead of PASS. A green result now means the experiment
# ran; it no longer merely means nothing went wrong while nothing happened.
#
# What v1 DID establish, from the driver logs: per-PV `mountOptions` reach the
# driver as distinct `mount_flags` per volume, and the vault's flip to `full`
# took effect on its next mount (11:22 `writes` → 11:37 `full`). The mechanism by
# which a PV asks for a cache mode works.
#
# STILL OPEN, and NOT settled by any of this: the driver logs "Waiting for VFS
# cache sync (remote: nas-crypt-internal-archive)" — cache state is accounted PER
# REMOTE. If one VFS instance serves every mount of a remote, two volumes on one
# remote cannot really run different cache modes whatever their mount_flags say,
# and this probe compares a mount against itself. That would also mean the vault
# (`full`) and nextcloud (`writes`) share one effective mode, making the vault's
# fix contingent on nextcloud's setting. Reproducing the corruption would NOT
# falsify this — both can be true. Only two volumes on DIFFERENT remotes
# distinguish them. See ADR 0058 Q1/Q2, plan §14.7, and ticket T11.
#
# A LATENT RACE, seen 2026-08-31 and not yet ticketed anywhere else: unmounting
# `conformance-full` logged `Deleted 2 remotes from config` while the `writes`
# mount was still live and still flushing a queued upload. It survived, but two
# mounts of one remote tearing down concurrently is worth its own investigation.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: conformance-writes
  namespace: csi-rclone
  annotations:
    retention.homelab.internal/reason: "Conformance probe scratch. Holds no data; truncated every run."
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nas-crypt-internal-archive
  volumeName: nas-internal-archive-conformance-writes
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: conformance-full
  namespace: csi-rclone
  annotations:
    retention.homelab.internal/reason: "Conformance probe scratch. Holds no data; truncated every run."
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nas-crypt-internal-archive
  volumeName: nas-internal-archive-conformance-full
  resources:
    requests:
      storage: 1Gi
---
# The cross-remote control. See the PV comment in persistentvolumes.yaml: this is
# the only volume that can distinguish a per-remote VFS from a per-volume one,
# because it declares `writes` on a remote the other two probes never touch.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: conformance-writes-alt-remote
  namespace: csi-rclone
  annotations:
    retention.homelab.internal/reason: "Conformance probe scratch. Holds no data; truncated every run."
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nas-crypt-registry-blobs
  volumeName: nas-registry-blobs-conformance-writes
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rclone-conformance-probe
  namespace: csi-rclone
data:
  probe.py: |
    """Append-integrity probe for a csi-rclone mount. See conformance.yaml.

    Two phases, so every mount ages for the SAME wall-clock duration:

        prepare <mount> <label>   bulk write, drain write-back, append #1,
                                  apply cache pressure, record state to a sidecar
        (run.sh sleeps ONCE, for all mounts together)
        verify  <mount> <label>   append #2, TIMED READ-BACK, classify

    WHY THE READ-BACK IS THE TIMED OPERATION (v4, and the v3 bug it fixes)

    v3 timed append #2 and required it to exceed a floor, reasoning that rclone
    must materialise the whole object before appending to it. That is wrong: an
    append at EOF is satisfied WITHOUT the preceding bytes resident, so the write
    never blocks on materialisation and the floor can never be crossed. v3 would
    therefore report INCONCLUSIVE forever -- and did so on a run where the eviction
    had demonstrably happened (the node's cache subtree was observed empty 2.5
    minutes before the append). v2 asserted an eviction that never occurred; v3
    denied one that did. Both were confidently wrong in opposite directions.

    A read-back cannot be faked: pulling ~45 MiB back through crypt-over-SMB has to
    block. So that is the precondition -- and it is also the operation through which
    the real failure surfaced, since the ledger was being READ when the NULs were
    found.

    WHY TWO PHASES

    v3 ran each mount to completion in turn, so the last mount was sampled seconds
    after its write while the first had minutes for the 60s cache cleaner. Run order
    was confounded with remote, which manufactured a per-remote-looking signal out
    of pure ordering. Preparing all mounts, sleeping once, then verifying all mounts
    removes that.

    Deliberately does NOT hold one long-lived handle: a single open() with many
    writes is the pattern that never broke.
    """
    import json
    import os
    import sys
    import time

    PHASE, MOUNT, LABEL = sys.argv[1], sys.argv[2], sys.argv[3]

    RECSIZE = int(os.environ.get("PROBE_RECORD_BYTES", "8192"))
    BULK_MB = int(os.environ.get("PROBE_BULK_MB", "45"))
    EVICT_MB = int(os.environ.get("PROBE_EVICT_MB", "48"))
    WRITEBACK = int(os.environ.get("PROBE_WRITEBACK_SETTLE", "45"))
    # Reading BULK_MB back through crypt-over-SMB cannot be instant. Below this the
    # object was still resident and no re-fetch was exercised.
    MIN_COLD_SECONDS = float(os.environ.get("PROBE_MIN_COLD_SECONDS", "0.40"))

    EXIT_PASS, EXIT_FAIL, EXIT_INCONCLUSIVE = 0, 1, 2

    path = os.path.join(MOUNT, "append-probe.dat")
    evict_path = os.path.join(MOUNT, "cache-pressure.tmp")
    state_path = "/tmp/probe-state-" + LABEL + ".json"
    filler = b"F" * RECSIZE


    def record(n):
        head = ("REC%09d" % n).encode()
        return head + b"." * (RECSIZE - len(head) - 1) + b"\n"


    def emit(msg):
        print("[%s] %s" % (LABEL, msg), flush=True)


    def timed(what, fn):
        t0 = time.monotonic()
        out = fn()
        dt = time.monotonic() - t0
        emit("%s: %.3fs" % (what, dt))
        return out, dt


    if PHASE == "prepare":
        def _bulk():
            with open(path, "wb") as fh:
                for _ in range(BULK_MB * 1024 * 1024 // RECSIZE):
                    fh.write(filler)
            return os.path.getsize(path)

        base, t_bulk = timed("bulk write (%d MiB, whole)" % BULK_MB, _bulk)
        emit("  -> %d bytes at %.1f MiB/s" % (base, (base / 1048576) / max(t_bulk, 1e-9)))

        # Drain the write-back queue before evicting: you cannot evict what has not
        # been uploaded. v2 skipped this and read back its own un-uploaded cache.
        emit("draining write-back for %ds" % WRITEBACK)
        time.sleep(WRITEBACK)

        def _a1():
            with open(path, "ab") as fh:
                fh.write(record(0))
        _, t_hot = timed("append #1 (hot)", _a1)

        def _pressure():
            with open(evict_path, "wb") as fh:
                for _ in range(EVICT_MB * 1024 * 1024 // RECSIZE):
                    fh.write(filler)
            os.unlink(evict_path)
        timed("cache pressure (%d MiB, same mount)" % EVICT_MB, _pressure)

        with open(state_path, "w") as fh:
            json.dump({"base": base, "t_hot": t_hot}, fh)
        emit("prepared; waiting for the shared cold gap")
        sys.exit(EXIT_PASS)

    elif PHASE == "verify":
        with open(state_path) as fh:
            st = json.load(fh)
        base, t_hot = st["base"], st["t_hot"]

        def _a2():
            with open(path, "ab") as fh:
                fh.write(record(1))
        _, t_append = timed("append #2 (cold; does NOT block on materialise)", _a2)

        # THE measurement. This must pull the whole object back.
        def _read():
            with open(path, "rb") as fh:
                return fh.read()
        data, t_read = timed("read-back (%d MiB, must materialise)" % BULK_MB, _read)

        expected = base + 2 * RECSIZE
        nul = data.count(0)
        emit("expected %d / read %d bytes / %d NUL" % (expected, len(data), nul))
        emit("timing: hot_append=%.3fs cold_append=%.3fs read_back=%.3fs (%.1f MiB/s)"
             % (t_hot, t_append, t_read,
                (len(data) / 1048576) / max(t_read, 1e-9)))

        problems = []
        if nul:
            problems.append("%d NUL bytes, first at offset %d" % (nul, data.index(0)))
        if len(data) != expected:
            problems.append("size %d != expected %d" % (len(data), expected))
        for off in (0, base // 2, base - RECSIZE):
            if data[off:off + 64] != filler[:64]:
                problems.append("bulk region corrupt at offset %d" % off)
        for n in (0, 1):
            off = base + n * RECSIZE
            if data[off:off + 12] != record(n)[:12]:
                problems.append("record %d corrupt at offset %d" % (n, off))

        if problems:
            emit("FAIL: " + "; ".join(problems))
            sys.exit(EXIT_FAIL)

        if t_read < MIN_COLD_SECONDS:
            emit("INCONCLUSIVE: read-back of %d MiB took %.3fs, under the %.2fs floor. "
                 "The object was still resident, so no re-fetch was exercised and "
                 "nothing could fail to re-fetch. Data is intact but this run tested "
                 "NOTHING. Not a pass." % (BULK_MB, t_read, MIN_COLD_SECONDS))
            sys.exit(EXIT_INCONCLUSIVE)

        emit("PASS: materialised %d MiB from cold (%.3fs) and every byte survived"
             % (BULK_MB, t_read))
        sys.exit(EXIT_PASS)

    else:
        emit("unknown phase %r; expected 'prepare' or 'verify'" % PHASE)
        sys.exit(EXIT_FAIL)

  run.sh: |
    #!/bin/sh
    # Prepares all three mounts, sleeps ONCE, then verifies all three, so every
    # mount ages the same. v3 ran each mount to completion in turn, confounding run
    # order with remote and manufacturing a per-remote-looking signal from ordering.
    #
    # Three outcomes per mount:
    #   0 PASS          bytes intact AND a cold materialisation was demonstrated
    #   1 FAIL          bytes corrupted (meaningful regardless)
    #   2 INCONCLUSIVE  bytes intact but never went cold -- tested nothing
    set -u
    SETTLE="${PROBE_SETTLE_SECONDS:-150}"

    python3 /probe/probe.py prepare /probe-full       full       || exit 1
    python3 /probe/probe.py prepare /probe-writes     writes     || exit 1
    python3 /probe/probe.py prepare /probe-writes-alt writes-alt || exit 1

    echo "=== shared cold gap: ${SETTLE}s, all mounts aging together ==="
    sleep "$SETTLE"

    python3 /probe/probe.py verify /probe-full       full       ; RC_FULL=$?
    python3 /probe/probe.py verify /probe-writes     writes     ; RC_WRITES=$?
    python3 /probe/probe.py verify /probe-writes-alt writes-alt ; RC_ALT=$?

    name() {
      case "$1" in
        0) echo PASS ;; 1) echo FAIL ;; 2) echo INCONCLUSIVE ;; *) echo "ERROR(rc=$1)" ;;
      esac
    }

    echo
    echo "=== conformance verdict (ADR 0058) ==="
    echo "A  full   @ internal-archive  -> $(name $RC_FULL)"
    echo "B  writes @ internal-archive  -> $(name $RC_WRITES)"
    echo "C  writes @ registry-blobs    -> $(name $RC_ALT)   <- different remote"
    echo

    if [ $RC_FULL -eq 1 ]; then
      echo 'VERDICT: FAIL - vfs-cache-mode=full lost data. Every real volume uses this'
      echo 'mode. Treat as an incident: read ADR 0058 and assume no nas-crypt volume'
      echo 'is safe to append to.'
      exit 1
    fi

    if [ $RC_WRITES -eq 1 ] && [ $RC_FULL -eq 0 ]; then
      echo 'VERDICT: PASS - full intact, writes corrupted as ADR 0058 predicts.'
      echo 'The control is calibrated and the mechanism is REPRODUCED, not inferred.'
      echo 'Record this: three earlier probe versions failed to get here.'
      exit 0
    fi

    if [ $RC_FULL -eq 2 ] || [ $RC_WRITES -eq 2 ] || [ $RC_ALT -eq 2 ]; then
      echo 'VERDICT: INCONCLUSIVE - a mount never went cold, so it tested nothing.'
      echo
      echo 'NOT a regression pass, and NOT evidence that writes mode is safe.'
      echo
      echo 'Read the read_back timing before touching any knob:'
      echo '  read-back FAST  -> the object was still resident; eviction pressure is'
      echo '                     too weak. Raise PROBE_EVICT_MB, or lower'
      echo '                     vfs-cache-max-age on the conformance PVs.'
      echo '  read-back SLOW  -> the floor is mis-set for this link speed. Raise'
      echo '                     PROBE_MIN_COLD_SECONDS to match observed throughput.'
      echo '                     Do NOT lower it to force a green.'
      echo
      echo 'History: v2 asserted an eviction that never happened; v3 timed the append,'
      echo 'which never blocks on materialisation, and so denied evictions that did.'
      exit 0
    fi

    echo 'VERDICT: PASS (control uncalibrated).'
    echo
    echo 'All mounts materialised from cold and all kept every byte, so unlike an'
    echo 'INCONCLUSIVE run this one genuinely tested something.'
    echo
    echo 'But writes survived a cold re-fetch too, so this does not reproduce the'
    echo '2026-08-29/30 failure and cannot show full is BETTER than writes.'
    echo 'Caveat: the conformance PVs run 16M/60s against the vault-class 10G/6h, so'
    echo 'eviction here is far more eager and a result may not transfer to a real'
    echo 'volume. ADR 0058 Q2 is settled (per-volume VFS, confirmed from source and'
    echo 'from the on-disk cache layout), so a symmetric result can no longer be'
    echo 'explained by the probe comparing a mount against itself.'
    exit 0
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rclone-conformance
  namespace: csi-rclone
spec:
  # 03:10 — after the 00:xx enrichment lanes and well before the 04:30 offsite
  # backup, so the probe's scratch writes are not mid-flight when restic walks
  # the share.
  schedule: "10 3 * * *"
  # Explicitly false, not absent: removing the field leaves Argo reporting
  # Synced while the live CronJob keeps whatever it had.
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 0
      # v2 sleeps 150s + 15s per mount and moves ~93 MB per mount over SMB, so a
      # normal run is minutes, not seconds. The deadline exists to bound a mount
      # that has gone catatonic — the 2026-08-07 registry incident produced
      # "transport endpoint is not connected", which hangs rather than errors.
      activeDeadlineSeconds: 2700
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rclone-conformance
            app.kubernetes.io/part-of: csi-rclone
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: probe
              image: python:3.12-slim
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { memory: 512Mi }
              command: ["/bin/sh", "/probe/run.sh"]
              volumeMounts:
                - { name: probe, mountPath: /probe }
                - { name: conformance-writes, mountPath: /probe-writes }
                - { name: conformance-full, mountPath: /probe-full }
                - { name: conformance-alt, mountPath: /probe-writes-alt }
          volumes:
            - name: probe
              configMap:
                name: rclone-conformance-probe
                defaultMode: 493
            - name: conformance-writes
              persistentVolumeClaim: { claimName: conformance-writes }
            - name: conformance-full
              persistentVolumeClaim: { claimName: conformance-full }
            - name: conformance-alt
              persistentVolumeClaim: { claimName: conformance-writes-alt-remote }
