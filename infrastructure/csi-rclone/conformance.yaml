# csi-rclone storage-class conformance probe — ADR 0058 D4.
#
# WHY
#
# A storage class is an interface with a contract. Until 2026-08-31 this
# workspace tested none of them, and the contract was discovered to be broken by
# an application losing a 45 MB ledger twice in three days.
#
# Application CI could not have caught that. `open(path, "a")` is guaranteed to
# append on a POSIX filesystem, the code was correct, and every unit test on
# tmpfs passed. The defect lived in the assumption that the production
# filesystem honours the contract the test filesystem honours. So the thing that
# has to be tested is the SUBSTRATE.
#
# WHAT IT DOES
#
# Two volumes, identical except for `vfs-cache-mode` (see persistentvolumes.yaml
# — both are on a deliberately tiny 16Mi/60s cache so that an eviction happens
# in minutes rather than the fortnight the real 10G/6h mounts took). On each, the
# probe writes a ~45 MB file whole, appends ONE record, forces that object out of
# the cache, appends a SECOND record, and then checks that every byte survived.
#
# The gap is the entire test. The failure needs a RE-FETCH — the object has to
# leave the cache and be pulled back before it can fail to come back whole — so
# the probe forces the entry cold two ways at once: it sleeps past
# `vfs-cache-max-age`, and it pushes 48 MiB of unrelated bytes through the same
# mount to provoke a size eviction against a 16Mi cache. Note that the 45 MB
# subject file already exceeds that cache on its own, which is the pressure the
# real 10 GiB cache only reached when Immich, Nextcloud and the registry were
# competing for it.
#
# The interesting output is the DIFFERENCE between the two mounts. Each mount
# returns one of THREE states, not two:
#
#   PASS          bytes intact AND a cold re-fetch was demonstrably forced
#   FAIL          bytes corrupted -- meaningful whether or not we forced it
#   INCONCLUSIVE  bytes intact but the object never went cold. The run tested
#                 NOTHING. Not a pass, not evidence that `writes` is safe.
#
#   writes FAIL, full PASS   → the calibrated case. The probe discriminates
#                              between modes; ADR 0058's mechanism is REPRODUCED
#                              rather than inferred. This is the goal.
#   full FAIL                → exit 1, incident. Every real volume uses `full`.
#   either INCONCLUSIVE      → the experiment did not run. Say so; change a knob.
#   both PASS                → control uncalibrated. `full` is not broken, but
#                              this run cannot show it is BETTER than `writes`.
#
# HISTORY — TWO PREVIOUS VERSIONS COULD NOT FAIL. THAT IS THE POINT OF v3.
#
# **v1** wrote 6,000 records in a tight loop; both mounts passed byte-identically.
# A tight loop keeps the file continuously hot, so nothing is ever re-fetched and
# nothing can fail to re-fetch. It reproduced the access pattern (many opens) but
# not the timing (long gaps), and the timing is what matters: production appended
# once per blob across hours against `vfs-cache-max-age=6h`.
#
# **v2** replaced the loop with two appends separated by a forced-cold gap. Both
# mounts passed again — 47,202,304 bytes, 0 NUL, identical to the byte. The CSI
# driver log explains why, and it invalidates the whole experiment:
#
#   * ZERO eviction, download or re-fetch lines across the entire 5m39s window.
#   * Mount-to-unmount was 339s, of which 330s was the probe's own `sleep` —
#     leaving ~9s for ~276 MB of I/O. That is local-disk speed, not a 45 MB
#     re-materialisation over SMB-behind-crypt.
#   * At unmount the driver still logged `Waiting for VFS cache uploads
#     (in progress: 0, queued: 1, retry: 1/5)` — an upload was STILL QUEUED after
#     the probe had already read the file back and declared PASS.
#
# So v2 wrote into the local cache and read back out of the local cache. The
# bytes never round-tripped to the remote, and a probe that never reaches the
# remote cannot observe remote corruption. **v2 asserted an eviction it never
# measured**, which is exactly what rule 2 of the workspace's infra-apply
# discipline forbids: verification of assumptions belongs INSIDE the script, and
# a wrong assumption must fail loudly rather than silently no-op.
#
# **v3 measures its own precondition.** It drains the write-back queue before
# trying to evict (you cannot evict what was never uploaded), times every phase,
# and requires append #2 to take at least `PROBE_MIN_COLD_SECONDS` — because
# materialising 45 MiB from the remote cannot be instant. Below that floor it
# exits INCONCLUSIVE instead of PASS. A green result now means the experiment
# ran; it no longer merely means nothing went wrong while nothing happened.
#
# What v1 DID establish, from the driver logs: per-PV `mountOptions` reach the
# driver as distinct `mount_flags` per volume, and the vault's flip to `full`
# took effect on its next mount (11:22 `writes` → 11:37 `full`). The mechanism by
# which a PV asks for a cache mode works.
#
# STILL OPEN, and NOT settled by any of this: the driver logs "Waiting for VFS
# cache sync (remote: nas-crypt-internal-archive)" — cache state is accounted PER
# REMOTE. If one VFS instance serves every mount of a remote, two volumes on one
# remote cannot really run different cache modes whatever their mount_flags say,
# and this probe compares a mount against itself. That would also mean the vault
# (`full`) and nextcloud (`writes`) share one effective mode, making the vault's
# fix contingent on nextcloud's setting. Reproducing the corruption would NOT
# falsify this — both can be true. Only two volumes on DIFFERENT remotes
# distinguish them. See ADR 0058 Q1/Q2, plan §14.7, and ticket T11.
#
# A LATENT RACE, seen 2026-08-31 and not yet ticketed anywhere else: unmounting
# `conformance-full` logged `Deleted 2 remotes from config` while the `writes`
# mount was still live and still flushing a queued upload. It survived, but two
# mounts of one remote tearing down concurrently is worth its own investigation.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: conformance-writes
  namespace: csi-rclone
  annotations:
    retention.homelab.internal/reason: "Conformance probe scratch. Holds no data; truncated every run."
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nas-crypt-internal-archive
  volumeName: nas-internal-archive-conformance-writes
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: conformance-full
  namespace: csi-rclone
  annotations:
    retention.homelab.internal/reason: "Conformance probe scratch. Holds no data; truncated every run."
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nas-crypt-internal-archive
  volumeName: nas-internal-archive-conformance-full
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rclone-conformance-probe
  namespace: csi-rclone
data:
  probe.py: |
    """Append-integrity probe for a csi-rclone mount. See conformance.yaml.

    WHAT THIS TESTS, precisely: reopening a LARGE, COLD remote object for append.

    The failure needs a RE-FETCH. The object must leave the VFS cache and be
    pulled back before it can fail to come back whole. So the probe is shaped
    around the gap, not around volume:

        1. write a bulk file of BULK_MB in one open()      (never itself at risk)
        2. append ONE record                                (cache now hot)
        3. force the entry cold -- age it out AND evict by size pressure
        4. append a SECOND record                           (this is the re-fetch)
        5. read back; assert zero NULs and every region intact

    The v1 probe (2026-08-31) wrote 6,000 records in a tight loop and BOTH mounts
    passed. A tight loop keeps the file continuously hot: nothing is ever
    re-fetched, so nothing can fail to re-fetch. It reproduced the access pattern
    (many opens) but not the timing (long gaps), and the timing is the part that
    matters -- production appended once per blob across hours, against
    vfs-cache-max-age=6h. Two writes separated by a real gap test more than six
    thousand back-to-back ones do.

    Deliberately does NOT hold one long-lived handle: a single open() with many
    writes is the pattern that never broke.
    """
    import os
    import sys
    import time

    MOUNT = sys.argv[1]
    LABEL = sys.argv[2]
    RECSIZE = int(os.environ.get("PROBE_RECORD_BYTES", "8192"))
    BULK_MB = int(os.environ.get("PROBE_BULK_MB", "45"))
    SETTLE = int(os.environ.get("PROBE_SETTLE_SECONDS", "150"))
    EVICT_MB = int(os.environ.get("PROBE_EVICT_MB", "48"))
    WRITEBACK = int(os.environ.get("PROBE_WRITEBACK_SETTLE", "45"))
    # A cold re-materialisation of BULK_MB over SMB-behind-crypt cannot be instant.
    # If append #2 returns faster than this, the object was still cached and the
    # experiment did not happen. The local cache answers in sub-milliseconds; the
    # remote runs at tens of MiB/s, so 45 MiB cannot come back in under ~0.4s.
    MIN_COLD_SECONDS = float(os.environ.get("PROBE_MIN_COLD_SECONDS", "0.40"))

    EXIT_PASS, EXIT_FAIL, EXIT_INCONCLUSIVE = 0, 1, 2

    path = os.path.join(MOUNT, "append-probe.dat")
    evict_path = os.path.join(MOUNT, "cache-pressure.tmp")
    bulk_bytes = BULK_MB * 1024 * 1024


    def record(n: int) -> bytes:
        # Self-describing: the sequence number is recoverable from the record, so a
        # survivor can be told from a duplicate or a shifted read.
        head = f"REC{n:09d}".encode()
        return head + b"." * (RECSIZE - len(head) - 1) + b"\n"


    def emit(msg):
        print(f"[{LABEL}] {msg}", flush=True)


    def timed(what, fn):
        t0 = time.monotonic()
        out = fn()
        dt = time.monotonic() - t0
        emit(f"{what}: {dt:.3f}s")
        return out, dt


    filler = b"F" * RECSIZE

    # --- 1. bulk file, written whole. This write is never the thing at risk.
    def _bulk():
        with open(path, "wb") as fh:
            for _ in range(bulk_bytes // RECSIZE):
                fh.write(filler)
        return os.path.getsize(path)


    base, t_bulk = timed(f"bulk write ({BULK_MB} MiB, whole)", _bulk)
    emit(f"  -> {base:,} bytes at {(base / 1048576) / max(t_bulk, 1e-9):,.1f} MiB/s")

    # --- 1b. Drain the write-back queue BEFORE trying to evict. v2 skipped this and
    # it was fatal: at unmount the driver still logged "Waiting for VFS cache
    # uploads (queued: 1)" AFTER the probe had read the file back and declared PASS.
    # The bytes had never reached the remote, so the read-back came from local cache
    # and could not possibly have observed remote corruption. You cannot evict what
    # has not been uploaded.
    emit(f"waiting {WRITEBACK}s for the write-back queue to drain")
    time.sleep(WRITEBACK)

    # --- 2. first append, object hot. Also the baseline for "what does an append
    # cost when no re-fetch is needed".
    def _a1():
        with open(path, "ab") as fh:
            fh.write(record(0))


    _, t_hot = timed("append #1 (hot, no re-fetch expected)", _a1)

    # --- 3. force the entry COLD two ways at once: age it past vfs-cache-max-age,
    # and push more than vfs-cache-max-size of unrelated bytes through the SAME
    # mount to provoke a size eviction.
    emit(f"sleeping {SETTLE}s to age the entry past vfs-cache-max-age")
    time.sleep(SETTLE)


    def _pressure():
        with open(evict_path, "wb") as fh:
            for _ in range(EVICT_MB * 1024 * 1024 // RECSIZE):
                fh.write(filler)
        os.unlink(evict_path)


    _, t_press = timed(f"cache pressure ({EVICT_MB} MiB through the same mount)", _pressure)
    time.sleep(15)   # let the cache cleaner act on the pressure


    # --- 4. second append. THIS is the operation under test: rclone must
    # re-materialise the whole object before it can append to it.
    def _a2():
        with open(path, "ab") as fh:
            fh.write(record(1))


    _, t_cold = timed("append #2 (cold, re-fetch REQUIRED)", _a2)

    emit(f"timing: hot={t_hot:.3f}s cold={t_cold:.3f}s "
         f"(need cold >= {MIN_COLD_SECONDS}s for a real re-fetch)")

    # --- 5. verify the bytes. A FAIL is meaningful whether or not we forced the
    # eviction; a PASS is not, which is what step 6 is for.
    expected = base + 2 * RECSIZE
    with open(path, "rb") as fh:
        data = fh.read()
    nul = data.count(0)
    emit(f"expected {expected:,} bytes / read {len(data):,} bytes / {nul:,} NUL bytes")

    problems = []
    if nul:
        problems.append(f"{nul:,} NUL bytes, first at offset {data.index(0):,}")
    if len(data) != expected:
        problems.append(f"size {len(data):,} != expected {expected:,}")
    # The bulk region must still be filler. A zeroed prefix with an intact tail is
    # exactly the shape the vault ledger died in, and a size-only check misses it
    # entirely -- the corrupt ledger was very nearly the right size.
    for off in (0, base // 2, base - RECSIZE):
        if data[off:off + 64] != filler[:64]:
            problems.append(f"bulk region corrupt at offset {off:,}")
    for n in (0, 1):
        off = base + n * RECSIZE
        if data[off:off + 12] != record(n)[:12]:
            problems.append(f"record {n} corrupt at offset {off:,}")

    if problems:
        emit("FAIL: " + "; ".join(problems))
        sys.exit(EXIT_FAIL)

    # --- 6. Did the experiment actually happen? Assert the precondition before
    # reporting a verdict. This is the whole difference between v3 and v2: v2
    # asserted an eviction it never measured, so a green result was
    # indistinguishable from an experiment that never ran.
    if t_cold < MIN_COLD_SECONDS:
        emit(f"INCONCLUSIVE: append #2 took {t_cold:.3f}s, under the "
             f"{MIN_COLD_SECONDS}s floor for materialising {BULK_MB} MiB from the "
             f"remote. The object was still cached, so no re-fetch happened and "
             f"nothing could fail to re-fetch. The data is intact but this run "
             f"tested NOTHING. Do not record it as a pass.")
        sys.exit(EXIT_INCONCLUSIVE)

    emit(f"PASS: forced a cold re-fetch ({t_cold:.3f}s) and every byte survived")
    sys.exit(EXIT_PASS)

  run.sh: |
    #!/bin/sh
    # Runs the probe against both mounts and interprets the PAIR of results.
    # See the header of conformance.yaml for the decision table.
    #
    # Three outcomes per mount, not two:
    #   0 PASS          bytes intact AND a cold re-fetch was demonstrably forced
    #   1 FAIL          bytes corrupted (meaningful regardless of the re-fetch)
    #   2 INCONCLUSIVE  bytes intact but the object never went cold -- the run
    #                   tested nothing. v2 had no such state, which is why a run
    #                   that proved nothing was reported as a pass.
    set -u
    python3 /probe/probe.py /probe-full   full   ; RC_FULL=$?
    python3 /probe/probe.py /probe-writes writes ; RC_WRITES=$?

    name() {
      case "$1" in
        0) echo PASS ;;
        1) echo FAIL ;;
        2) echo INCONCLUSIVE ;;
        *) echo "ERROR(rc=$1)" ;;
      esac
    }

    echo
    echo "=== conformance verdict (ADR 0058) ==="
    echo "vfs-cache-mode=full   -> $(name $RC_FULL)"
    echo "vfs-cache-mode=writes -> $(name $RC_WRITES)"
    echo

    # 1. Corruption on `full` is an incident: every real volume uses it.
    if [ $RC_FULL -eq 1 ]; then
      echo 'VERDICT: FAIL - vfs-cache-mode=full lost data. This is the mode every real'
      echo 'volume now uses. Treat as an incident: read ADR 0058 and do not assume any'
      echo 'nas-crypt volume is safe to append to.'
      exit 1
    fi

    # 2. The calibrated case the suite exists to produce.
    if [ $RC_WRITES -eq 1 ] && [ $RC_FULL -eq 0 ]; then
      echo 'VERDICT: PASS - full intact, writes corrupted as ADR 0058 predicts.'
      echo 'The control is calibrated: this run genuinely discriminates between modes,'
      echo 'and the ADR 0058 mechanism is REPRODUCED rather than inferred. Record this.'
      exit 0
    fi

    # 3. Neither mount went cold: the experiment did not run.
    if [ $RC_WRITES -eq 2 ] || [ $RC_FULL -eq 2 ]; then
      echo 'VERDICT: INCONCLUSIVE - the probe could not force a cold re-fetch.'
      echo
      echo 'The data is intact, but the object never left the VFS cache, so nothing'
      echo 'was ever re-fetched and nothing could fail to re-fetch. This run tested'
      echo 'NOTHING about the ADR 0058 mechanism. It is NOT evidence that'
      echo 'vfs-cache-mode=writes is safe, and it is NOT a regression pass.'
      echo
      echo 'This is the failure v2 could not report: it had no inconclusive state, so'
      echo 'an experiment that never happened came back green. Both mounts passed'
      echo 'byte-identically on 2026-08-31 while the driver logged zero evictions and'
      echo 'still had a queued upload at unmount -- the read-back was served from'
      echo 'local cache and had never round-tripped to the remote.'
      echo
      echo 'What to try next, cheapest first:'
      echo '  - raise PROBE_EVICT_MB well above vfs-cache-max-size'
      echo '  - raise PROBE_WRITEBACK_SETTLE so the upload demonstrably drains'
      echo '  - lower vfs-cache-max-age on the two conformance PVs'
      echo '  - if none of these ever force an eviction, the combination may be'
      echo '    untestable from inside a pod; escalate to T11 (two volumes on'
      echo '    DIFFERENT remotes), which tests the per-remote question instead.'
      exit 0
    fi

    # 4. Both genuinely cold, both intact.
    echo 'VERDICT: PASS (control uncalibrated).'
    echo
    echo 'Both mounts forced a cold re-fetch and both kept every byte. The regression'
    echo 'test passed and the eviction precondition was met -- so unlike an'
    echo 'INCONCLUSIVE run, this one did test something.'
    echo
    echo 'But `writes` survived a cold re-fetch too, so this run does not reproduce'
    echo 'the 2026-08-29/30 failure and cannot show `full` is BETTER than `writes`.'
    echo 'Do NOT read a passing control as evidence that vfs-cache-mode=writes is'
    echo 'safe. The remaining hypothesis is that the driver accounts the VFS cache'
    echo 'PER REMOTE ("Waiting for VFS cache sync (remote: ...)"), so two volumes on'
    echo 'one remote share a single VFS instance and one mode wins regardless of'
    echo 'per-volume mount_flags -- meaning this probe compared a mount against'
    echo 'itself, and the vault fix is contingent on the nextcloud PV. Distinguishing'
    echo 'that needs two volumes on DIFFERENT remotes. See ADR 0058 Q2, ticket T11.'
    exit 0
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rclone-conformance
  namespace: csi-rclone
spec:
  # 03:10 — after the 00:xx enrichment lanes and well before the 04:30 offsite
  # backup, so the probe's scratch writes are not mid-flight when restic walks
  # the share.
  schedule: "10 3 * * *"
  # Explicitly false, not absent: removing the field leaves Argo reporting
  # Synced while the live CronJob keeps whatever it had.
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 0
      # v2 sleeps 150s + 15s per mount and moves ~93 MB per mount over SMB, so a
      # normal run is minutes, not seconds. The deadline exists to bound a mount
      # that has gone catatonic — the 2026-08-07 registry incident produced
      # "transport endpoint is not connected", which hangs rather than errors.
      activeDeadlineSeconds: 2700
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rclone-conformance
            app.kubernetes.io/part-of: csi-rclone
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: probe
              image: python:3.12-slim
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { memory: 512Mi }
              command: ["/bin/sh", "/probe/run.sh"]
              volumeMounts:
                - { name: probe, mountPath: /probe }
                - { name: conformance-writes, mountPath: /probe-writes }
                - { name: conformance-full, mountPath: /probe-full }
          volumes:
            - name: probe
              configMap:
                name: rclone-conformance-probe
                defaultMode: 493
            - name: conformance-writes
              persistentVolumeClaim: { claimName: conformance-writes }
            - name: conformance-full
              persistentVolumeClaim: { claimName: conformance-full }
