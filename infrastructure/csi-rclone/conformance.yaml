# csi-rclone storage-class conformance probe — ADR 0058 D4.
#
# WHY
#
# A storage class is an interface with a contract. Until 2026-08-31 this
# workspace tested none of them, and the contract was discovered to be broken by
# an application losing a 45 MB ledger twice in three days.
#
# Application CI could not have caught that. `open(path, "a")` is guaranteed to
# append on a POSIX filesystem, the code was correct, and every unit test on
# tmpfs passed. The defect lived in the assumption that the production
# filesystem honours the contract the test filesystem honours. So the thing that
# has to be tested is the SUBSTRATE.
#
# WHAT IT DOES
#
# Two volumes, identical except for `vfs-cache-mode` (see persistentvolumes.yaml
# — both are on a deliberately tiny 16Mi/60s cache so that an eviction happens
# in minutes rather than the fortnight the real 10G/6h mounts took). On each, the
# probe writes a ~45 MB file whole, appends ONE record, forces that object out of
# the cache, appends a SECOND record, and then checks that every byte survived.
#
# The gap is the entire test. The failure needs a RE-FETCH — the object has to
# leave the cache and be pulled back before it can fail to come back whole — so
# the probe forces the entry cold two ways at once: it sleeps past
# `vfs-cache-max-age`, and it pushes 48 MiB of unrelated bytes through the same
# mount to provoke a size eviction against a 16Mi cache. Note that the 45 MB
# subject file already exceeds that cache on its own, which is the pressure the
# real 10 GiB cache only reached when Immich, Nextcloud and the registry were
# competing for it.
#
# The interesting output is the DIFFERENCE between the two mounts:
#
#   writes fails, full passes   → the calibrated case. The probe discriminates
#                                 between modes and ADR 0058 D2 is confirmed.
#   both pass                   → PASS, control uncalibrated. `full` is not
#                                 broken, but this run cannot show it is BETTER
#                                 than `writes`. Not evidence that `writes` is
#                                 safe. **This is what the first run returned,
#                                 2026-08-31 — see below.**
#   full fails                  → FAIL, exit 1. Every real volume uses `full`.
#   writes passes, full fails   → something changed upstream; read the release
#                                 notes before touching any PV.
#
# HISTORY — v1 (2026-08-31) COULD NOT FAIL, AND THAT IS WHY THIS IS v2
#
# v1 wrote 6,000 records in a tight loop and both mounts passed cleanly —
# 49,152,000 bytes, 0 NUL, on `full` AND on `writes`. It did not reproduce the
# failure that motivated it. Recorded rather than quietly tuned away, because a
# conformance suite that cannot fail is the thing this incident was about.
#
# The reason, identified in peer review the same day: **a tight loop keeps the
# file continuously hot, so nothing is ever re-fetched and nothing can fail to
# re-fetch.** v1 reproduced the access pattern (many opens) but not the timing
# (long gaps) — and the timing is the part that matters. Production appended
# once per blob across hours, against `vfs-cache-max-age=6h`. Hence v2's shape:
# two writes with a forced-cold gap beat six thousand back-to-back ones.
#
# What v1 DID establish, from the CSI driver logs: per-PV `mountOptions` reach
# the driver as distinct `mount_flags` per volume, and the vault's flip to
# `full` took effect on its next mount (11:22 `writes` → 11:37 `full`). The
# mechanism by which a PV asks for a cache mode works.
#
# STILL OPEN, and NOT settled by v2 reproducing: the driver logs "Waiting for
# VFS cache sync (remote: nas-crypt-internal-archive)" — cache state is
# accounted PER REMOTE. If a single VFS instance is shared by every mount of a
# remote, two volumes on one remote cannot really run different cache modes
# whatever their mount_flags say, and this probe compares a mount against
# itself. That would also mean the vault (`full`) and nextcloud (`writes`) share
# one effective mode, making the vault's fix contingent on nextcloud's setting.
# A v2 reproduction does not falsify this — both can be true. Only two volumes
# on DIFFERENT remotes distinguish them. See ADR 0058 open questions, plan
# §14.7, and ticket T11.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: conformance-writes
  namespace: csi-rclone
  annotations:
    retention.homelab.internal/reason: "Conformance probe scratch. Holds no data; truncated every run."
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nas-crypt-internal-archive
  volumeName: nas-internal-archive-conformance-writes
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: conformance-full
  namespace: csi-rclone
  annotations:
    retention.homelab.internal/reason: "Conformance probe scratch. Holds no data; truncated every run."
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nas-crypt-internal-archive
  volumeName: nas-internal-archive-conformance-full
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rclone-conformance-probe
  namespace: csi-rclone
data:
  probe.py: |
    """Append-integrity probe for a csi-rclone mount. See conformance.yaml.

    WHAT THIS TESTS, precisely: reopening a LARGE, COLD remote object for append.

    The failure needs a RE-FETCH. The object must leave the VFS cache and be
    pulled back before it can fail to come back whole. So the probe is shaped
    around the gap, not around volume:

        1. write a bulk file of BULK_MB in one open()      (never itself at risk)
        2. append ONE record                                (cache now hot)
        3. force the entry cold -- age it out AND evict by size pressure
        4. append a SECOND record                           (this is the re-fetch)
        5. read back; assert zero NULs and every region intact

    The v1 probe (2026-08-31) wrote 6,000 records in a tight loop and BOTH mounts
    passed. A tight loop keeps the file continuously hot: nothing is ever
    re-fetched, so nothing can fail to re-fetch. It reproduced the access pattern
    (many opens) but not the timing (long gaps), and the timing is the part that
    matters -- production appended once per blob across hours, against
    vfs-cache-max-age=6h. Two writes separated by a real gap test more than six
    thousand back-to-back ones do.

    Deliberately does NOT hold one long-lived handle: a single open() with many
    writes is the pattern that never broke.
    """
    import os
    import sys
    import time

    MOUNT = sys.argv[1]
    LABEL = sys.argv[2]
    RECSIZE = int(os.environ.get("PROBE_RECORD_BYTES", "8192"))
    BULK_MB = int(os.environ.get("PROBE_BULK_MB", "45"))
    SETTLE = int(os.environ.get("PROBE_SETTLE_SECONDS", "150"))
    EVICT_MB = int(os.environ.get("PROBE_EVICT_MB", "48"))

    path = os.path.join(MOUNT, "append-probe.dat")
    evict_path = os.path.join(MOUNT, "cache-pressure.tmp")
    bulk_bytes = BULK_MB * 1024 * 1024

    def record(n: int) -> bytes:
        # Self-describing: the sequence number is recoverable from the record,
        # so a survivor can be told from a duplicate or a shifted read.
        head = f"REC{n:09d}".encode()
        return head + b"." * (RECSIZE - len(head) - 1) + b"\n"

    def emit(msg):
        print(f"[{LABEL}] {msg}", flush=True)

    filler = b"F" * RECSIZE

    # --- 1. bulk file, written whole. This write is never the thing at risk.
    with open(path, "wb") as fh:
        for _ in range(bulk_bytes // RECSIZE):
            fh.write(filler)
    base = os.path.getsize(path)
    emit(f"bulk file written whole: {base:,} bytes")

    # --- 2. first append. Object is hot in cache; this one is expected to work.
    with open(path, "ab") as fh:
        fh.write(record(0))
    emit(f"append #1 (hot): {os.path.getsize(path):,} bytes")

    # --- 3. force the entry COLD. Age alone is not enough if the cache is under
    # its size limit and the cleaner has not run, so do both: sleep past
    # vfs-cache-max-age, then push more than vfs-cache-max-size of unrelated
    # bytes through the SAME mount to provoke a size-based eviction. The scratch
    # file is deleted afterwards; the bytes only have to pass through the cache.
    emit(f"sleeping {SETTLE}s to age the entry past vfs-cache-max-age")
    time.sleep(SETTLE)

    emit(f"pushing {EVICT_MB} MiB through the cache to force a size eviction")
    with open(evict_path, "wb") as fh:
        for _ in range(EVICT_MB * 1024 * 1024 // RECSIZE):
            fh.write(filler)
    os.unlink(evict_path)
    time.sleep(15)   # let the cache cleaner act on the pressure

    # --- 4. second append. THIS is the operation under test: rclone must
    # re-materialise a ~45 MB object it no longer holds before it can append.
    with open(path, "ab") as fh:
        fh.write(record(1))
    emit(f"append #2 (cold, re-fetch required): {os.path.getsize(path):,} bytes")

    # --- 5. verify.
    expected = base + 2 * RECSIZE
    with open(path, "rb") as fh:
        data = fh.read()
    nul = data.count(0)

    emit(f"expected {expected:,} bytes")
    emit(f"read     {len(data):,} bytes / {nul:,} NUL bytes")

    problems = []
    if nul:
        problems.append(f"{nul:,} NUL bytes, first at offset {data.index(0):,}")
    if len(data) != expected:
        problems.append(f"size {len(data):,} != expected {expected:,}")
    # The bulk region must still be filler. A zeroed prefix with an intact tail
    # is exactly the shape the vault ledger died in, and a size-only check
    # misses it entirely -- the corrupt ledger was very nearly the right size.
    for off in (0, base // 2, base - RECSIZE):
        if data[off:off + 64] != filler[:64]:
            problems.append(f"bulk region corrupt at offset {off:,}")
    for n in (0, 1):
        off = base + n * RECSIZE
        if data[off:off + 12] != record(n)[:12]:
            problems.append(f"record {n} corrupt at offset {off:,}")

    if problems:
        emit("FAIL: " + "; ".join(problems))
        sys.exit(1)
    emit("PASS: cold re-fetch preserved every byte")
    sys.exit(0)

  run.sh: |
    #!/bin/sh
    # Runs the probe against both mounts and interprets the PAIR of results.
    # See the header of conformance.yaml for the decision table.
    set -u
    python3 /probe/probe.py /probe-full   full   ; RC_FULL=$?
    python3 /probe/probe.py /probe-writes writes ; RC_WRITES=$?

    echo
    echo "=== conformance verdict (ADR 0058) ==="
    echo "vfs-cache-mode=full   -> $([ $RC_FULL   -eq 0 ] && echo PASS || echo FAIL)"
    echo "vfs-cache-mode=writes -> $([ $RC_WRITES -eq 0 ] && echo PASS || echo FAIL)"
    echo

    if [ $RC_FULL -ne 0 ]; then
      echo 'VERDICT: FAIL - vfs-cache-mode=full lost data. This is the mode every real'
      echo 'volume now uses. Treat as an incident: read ADR 0058 and do not assume'
      echo 'any nas-crypt volume is safe to append to.'
      exit 1
    fi
    if [ $RC_WRITES -eq 0 ]; then
      echo 'VERDICT: PASS (control uncalibrated).'
      echo
      echo 'The regression test passed: vfs-cache-mode=full kept every byte.'
      echo
      echo 'But the vfs-cache-mode=writes control ALSO passed, so this probe is not'
      echo 'reproducing the 2026-08-29/30 failure and cannot currently prove that'
      echo '`full` is better than `writes` - only that `full` is not broken today.'
      echo 'Do NOT read a passing control as evidence that writes mode is safe.'
      echo
      echo 'v1 of this probe failed to reproduce because it wrote 6,000 records in'
      echo 'a tight loop, keeping the file hot: nothing was re-fetched, so nothing'
      echo 'could fail to re-fetch. v2 forces the object cold between two appends.'
      echo 'If v2 ALSO shows a symmetric result, the remaining hypothesis is that'
      echo 'the driver accounts the VFS cache PER REMOTE ("Waiting for VFS cache'
      echo 'sync (remote: ...)"), so two volumes on one remote share a single VFS'
      echo 'instance and one cache mode wins regardless of per-volume mount_flags -'
      echo 'meaning this probe compared a mount against itself, and the vault fix'
      echo 'is contingent on the nextcloud PV. Distinguishing that needs two'
      echo 'volumes on DIFFERENT remotes. See ADR 0058 open questions, T11.'
      exit 0
    fi
    echo 'VERDICT: PASS - full intact, writes corrupted as ADR 0058 predicts.'
    echo 'The control is calibrated: this run genuinely discriminates between modes.'
    exit 0
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rclone-conformance
  namespace: csi-rclone
spec:
  # 03:10 — after the 00:xx enrichment lanes and well before the 04:30 offsite
  # backup, so the probe's scratch writes are not mid-flight when restic walks
  # the share.
  schedule: "10 3 * * *"
  # Explicitly false, not absent: removing the field leaves Argo reporting
  # Synced while the live CronJob keeps whatever it had.
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 0
      # v2 sleeps 150s + 15s per mount and moves ~93 MB per mount over SMB, so a
      # normal run is minutes, not seconds. The deadline exists to bound a mount
      # that has gone catatonic — the 2026-08-07 registry incident produced
      # "transport endpoint is not connected", which hangs rather than errors.
      activeDeadlineSeconds: 2700
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rclone-conformance
            app.kubernetes.io/part-of: csi-rclone
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: probe
              image: python:3.12-slim
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { memory: 512Mi }
              command: ["/bin/sh", "/probe/run.sh"]
              volumeMounts:
                - { name: probe, mountPath: /probe }
                - { name: conformance-writes, mountPath: /probe-writes }
                - { name: conformance-full, mountPath: /probe-full }
          volumes:
            - name: probe
              configMap:
                name: rclone-conformance-probe
                defaultMode: 493
            - name: conformance-writes
              persistentVolumeClaim: { claimName: conformance-writes }
            - name: conformance-full
              persistentVolumeClaim: { claimName: conformance-full }
