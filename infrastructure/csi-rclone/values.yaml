# csi-driver-rclone helm values (veloxpack chart).
#
# Per ADR 0030 §D1. The driver embeds rclone as a Go library —
# no external binary to manage. Node DaemonSet uses /dev/fuse;
# controller is a single Deployment.
#
# We keep the chart's defaults narrow:
#   - VFS cache: --vfs-cache-mode full + --vfs-cache-max-size
#     5G + --vfs-cache-max-age 1h. Per ADR 0030 §D4 — sized for
#     the cold-bucket working set after the storage split. Lives
#     on each node's root disk; node-SSD purchase deferred.
#   - Metrics enabled so the cluster-wide Prometheus scrapes
#     the driver's cache-hit / cache-eviction counters.

# Image pinning. OPERATOR replaces the tag with a digest
# pin via Renovate before first sync per ADR 0030 §D5.
image:
  pullPolicy: IfNotPresent

# Node DaemonSet — runs on every node that schedules consumer
# pods. /dev/fuse + mount propagation Bidirectional are the
# privileges that make this PSA-privileged.
node:
  # FUSE-related flags are baked into the driver's Pod spec
  # by the chart; values exposed below are the operator-tunable
  # subset.
  metrics:
    enabled: true
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  # PER-CONTAINER resources (chart 0.4.x uses node.resources.<container>,
  # NOT a flat requests/limits — the old flat block was silently ignored,
  # leaving the rclone mounter on the chart-default 300Mi). The rclone
  # container holds every FUSE mount's VFS dir cache; a Nextcloud
  # files:scan over a 253k-file tree OOMKilled it at 300Mi → dead mount →
  # nextcloud CrashLoop (2026-08-05). 1Gi gave recursive-scan headroom.
  #
  # 2026-08-07 → 3Gi: 1Gi was still insufficient under WRITE bursts. A
  # ~1GB Forgejo registry image push (vfs-cache-mode=full buffers the
  # whole write + per-mount --buffer-size/--vfs-read-ahead across every
  # FUSE mount sharing this one cgroup) killed the forgejo-packages mount
  # ("transport endpoint is not connected" / blob-write "bad file
  # descriptor" → registry 500), reproducibly, even with Immich idle —
  # while PID 1 survived (restarts=0), the signature of a child FUSE mount
  # process cgroup-OOM-killed under the 1Gi cap. Node has ~30GB free; 3Gi
  # gives write-burst headroom. No CPU limit (ADR 0042: FUSE latency).
  resources:
    rclone:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 3Gi
    livenessProbe:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        memory: 100Mi
    nodeDriverRegistrar:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        memory: 100Mi

# Controller — single Deployment, leader-elects.
controller:
  replicas: 1
  # Same per-container shape as node (chart 0.4.x schema).
  resources:
    rclone:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 400Mi
    csiProvisioner:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        memory: 200Mi
    livenessProbe:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        memory: 100Mi

# NOTE (2026-08-07): a `rclone.defaultMountOptions` block used to live
# here (--vfs-cache-mode=full etc.). It was DEAD CONFIG — the chart's
# node plugin does not apply it: the driver reads mount flags ONLY from
# each volume's mount options (PV.spec.mountOptions, populated from the
# StorageClass `mountOptions:` field) merged with SC `parameters`, per
# `pkg/rclone/nodeserver.go` (GetMountFlags → extractVFSOptions).
# `kustomize build --enable-helm` confirmed the block rendered to nothing,
# so every crypt mount ran vfs-cache-mode=OFF, which broke Immich's
# storage-template copyFile (EBADF) and RAM-buffered writes into a mounter
# OOM (2026-08-07 journal). vfs-cache-mode now lives on the per-share
# StorageClass mountOptions in storageclasses.yaml — that is the ONLY
# lever the driver honours. Do not re-add a defaultMountOptions block.
