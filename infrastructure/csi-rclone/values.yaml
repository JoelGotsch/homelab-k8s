# csi-driver-rclone helm values (veloxpack chart).
#
# Per ADR 0030 §D1. The driver embeds rclone as a Go library —
# no external binary to manage. Node DaemonSet uses /dev/fuse;
# controller is a single Deployment.
#
# We keep the chart's defaults narrow:
#   - VFS cache: --vfs-cache-mode full + --vfs-cache-max-size
#     5G + --vfs-cache-max-age 1h. Per ADR 0030 §D4 — sized for
#     the cold-bucket working set after the storage split. Lives
#     on each node's root disk; node-SSD purchase deferred.
#   - Metrics enabled so the cluster-wide Prometheus scrapes
#     the driver's cache-hit / cache-eviction counters.

# Image pinning. OPERATOR replaces the tag with a digest
# pin via Renovate before first sync per ADR 0030 §D5.
image:
  pullPolicy: IfNotPresent

# Node DaemonSet — runs on every node that schedules consumer
# pods. /dev/fuse + mount propagation Bidirectional are the
# privileges that make this PSA-privileged.
node:
  # FUSE-related flags are baked into the driver's Pod spec
  # by the chart; values exposed below are the operator-tunable
  # subset.
  metrics:
    enabled: true
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  # PER-CONTAINER resources (chart 0.4.x uses node.resources.<container>,
  # NOT a flat requests/limits — the old flat block was silently ignored,
  # leaving the rclone mounter on the chart-default 300Mi). The rclone
  # container holds every FUSE mount's VFS dir cache; a Nextcloud
  # files:scan over a 253k-file tree OOMKilled it at 300Mi → dead mount →
  # nextcloud CrashLoop (2026-08-05). 1Gi gives large recursive scans
  # headroom. No CPU limit (ADR 0042: FUSE mount latency-critical).
  resources:
    rclone:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        # 2026-08-07: raised 1Gi→2Gi. The 1Gi bump (from 300Mi) after the
        # 2026-08-05 nextcloud files:scan OOM was not enough: the mounter
        # OOMKilled again on worker2 during the immich bulk-import backfill
        # (the immich-originals mount ran vfs-cache-mode=off → buffered large
        # writes in RAM), which left nextcloud's personal-files mount stale →
        # subPath prep failed → nextcloud CrashLoop 23h → "maintenance mode".
        # This container holds EVERY crypt mount's VFS cache on the node;
        # 2Gi covers a heavy consumer (immich migration) sharing a node with
        # nextcloud/others. See task #12 for the vfs-cache-mode root fix.
        memory: 2Gi
    livenessProbe:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        memory: 100Mi
    nodeDriverRegistrar:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        memory: 100Mi

# Controller — single Deployment, leader-elects.
controller:
  replicas: 1
  # Same per-container shape as node (chart 0.4.x schema).
  resources:
    rclone:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 400Mi
    csiProvisioner:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        memory: 200Mi
    livenessProbe:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        memory: 100Mi

# rclone-side default flags. Each StorageClass can override
# via parameters.mountOptions; defaults set sensible behaviour
# for the cold-originals workload.
rclone:
  # Default mount options applied when a StorageClass doesn't
  # override. Tuned for cold-originals access (full-screen
  # views + ML-index sequential scans) per ADR 0030 §D4.
  defaultMountOptions:
    - "--vfs-cache-mode=full"
    - "--vfs-cache-max-size=5G"
    - "--vfs-cache-max-age=1h"
    - "--vfs-read-ahead=128M"
    - "--buffer-size=32M"
    - "--dir-cache-time=1h"
    - "--allow-other"
