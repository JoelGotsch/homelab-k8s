# ─────────────────────────────────────────────────────────────────────────────
# share: forgejo-lfs
# ─────────────────────────────────────────────────────────────────────────────
#
# PREVENTIVE, not diagnosed. No LFS push has been observed to fail — but this
# is the same driver, the same NAS, the same missing write cache and the same
# shape of write (one large object, streamed) as the registry blobs below,
# where it failed four times out of five on 2026-08-25. The two volumes are
# mounted into the same pod and remount together, so fixing this one costs
# nothing beyond the restart that one already needs. Left alone it would be a
# known-broken mount waiting to be rediscovered by whoever next pushes a big
# LFS object.
#
# 10G rather than the registry's 20G: LFS objects here are individually large
# but pushed one at a time, and this share is quiet.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-forgejo-lfs-forgejo
  labels:
    homelab.internal/nas-share: forgejo-lfs
    homelab.internal/data-class: internal
  annotations:
    homelab.internal/dataset: "Forgejo Git LFS objects (content-addressed, WORM-shape)"
spec:
  capacity:
    storage: 200Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nas-crypt-forgejo-lfs
  mountOptions:
    - vfs-cache-mode=writes
    - vfs-cache-max-size=10G
    - vfs-cache-max-age=6h
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: forgejo
    name: forgejo-lfs
  csi:
    driver: rclone.csi.veloxpack.io
    volumeHandle: nas-crypt-forgejo-lfs#forgejo-lfs
    volumeAttributes:
      remote: "nas-crypt-forgejo-lfs"
      remotePath: "forgejo/lfs"
    nodePublishSecretRef:
      name: nas-crypt-forgejo-lfs-config
      namespace: csi-rclone
---
# ─────────────────────────────────────────────────────────────────────────────
# share: registry-blobs
# ─────────────────────────────────────────────────────────────────────────────
#
# NOT covered by the NAS→Hetzner restic lane, deliberately: the blobs are
# regenerable container images. See nas-personal-pvcs.yaml. That decision is
# re-affirmed rather than inherited — ADR 0051 §Consequences.
#
# vfs-cache-mode=writes is load-bearing here too, for the same reason as the
# vault above and with a different symptom. Without a VFS cache a write streams
# straight at the remote and the file handle is only valid for an uninterrupted
# sequential write; a stall on the NAS invalidates it and the next write(2)
# returns EBADF. Forgejo surfaces that as
#   Error saving package blob in content store:
#   write /data/packages/tmp/upload-…: bad file descriptor
# and answers the push with a 500, which buildx reports to CI as the bare word
# `unknown`. Measured on 2026-08-25, when four of five image pushes failed:
#
#   144 blob PUTs succeeded — median 77ms, slowest 10.9s
#    17 blob PUTs returned 500 — spanning 1.4s to 9.2s
#
# The ranges overlap and the slowest write of the day SUCCEEDED, which is what
# rules out a gateway or proxy timeout: a timeout cuts at a duration, and this
# cuts at none. Long writes are at risk and some of them survive, which is a
# dropped FUSE handle. The 500 is raised writing Forgejo's own temporary file,
# before any response is sent, so no client disconnect can explain it either.
#
# An earlier diagnosis cleared the content store by running `df` and `touch`
# against /data — which is gitea-shared-storage on Longhorn. The blobs are on
# /data/packages, which is THIS volume. A mount point inside a mounted path is
# a different filesystem and `df /data` will not say so unless asked about the
# child. Recorded because the wrong answer cost two release tags.
#
# 20G rather than the vault's 10G: the working set is one multi-arch image push
# (~2-4 GB) and there is no reason to run it close. The node-local cache dir is
# not under an ephemeral-storage limit, and worker3 had 823G free when this was
# sized. Same durability note as the vault — a node lost inside the
# --vfs-write-back window loses an acknowledged write — and it is easier to
# accept here than anywhere else on this cluster: these blobs are content
# addressed, verifiable, deliberately not backed up, and re-pushed by CI.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-registry-blobs-forgejo-packages
  labels:
    homelab.internal/nas-share: registry-blobs
    homelab.internal/data-class: internal
  annotations:
    homelab.internal/dataset: "Forgejo Packages blobs (OCI / PyPI / Helm artefacts)"
    homelab.internal/offsite-backup: "none — regenerable, snapshot-only (deliberate)"
spec:
  capacity:
    storage: 200Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nas-crypt-registry-blobs
  mountOptions:
    - vfs-cache-mode=writes
    - vfs-cache-max-size=20G
    - vfs-cache-max-age=6h
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: forgejo
    name: forgejo-packages
  csi:
    driver: rclone.csi.veloxpack.io
    volumeHandle: nas-crypt-registry-blobs#forgejo-packages
    volumeAttributes:
      remote: "nas-crypt-registry-blobs"
      remotePath: "forgejo/packages"
    nodePublishSecretRef:
      name: nas-crypt-registry-blobs-config
      namespace: csi-rclone
---
# ═════════════════════════════════════════════════════════════════════════════
# BACKUP SOURCE VOLUMES — these stay at the share ROOT, ON PURPOSE
# ═════════════════════════════════════════════════════════════════════════════
#
# Everything above pins an application to one subdirectory. These six do the
# opposite and mount `remotePath: ""` — the whole share — because that is what
# makes the offsite lane correct: `restic-nas-personal-to-hetzner` backs up by
# path, so a share-root mount covers every dataset on that share, including
# datasets added after the backup job was last edited.
#
# This is the single most important thing to NOT "clean up" for consistency.
# Give these per-dataset subpaths and the restic job keeps completing
# successfully while backing up empty directories — a silent failure that stays
# invisible until a restore. It is also why ADR 0051 rejected templated
# per-PVC paths (`${pvc.metadata.namespace}/${pvc.metadata.name}`) as the
# cluster-wide default even though the driver supports them: the template would
# have hit these six too.
#
# The CronJob mounts every one of these `readOnly: true`, so this share-wide
# view can never write. csi-rclone decrypts on the node; the backup pod reads
# plaintext and restic re-encrypts to Hetzner (operator decision 2026-07-16).
#
# registry-blobs is deliberately absent — see that PV above.

apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-personal-photos-backup-root
  labels:
    homelab.internal/nas-share: personal-photos
    homelab.internal/component: backup-source
  annotations:
    homelab.internal/dataset: "SHARE ROOT — deliberate. Offsite backup source; see header."
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nas-crypt-personal-photos
  mountOptions:
    - allow-other=true
    - file-perms=0666
    - dir-perms=0777
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: backup-cronjobs
    name: backup-src-personal-photos
  csi:
    driver: rclone.csi.veloxpack.io
    volumeHandle: nas-crypt-personal-photos#backup-src
    volumeAttributes:
      remote: "nas-crypt-personal-photos"
      remotePath: ""
      allow_other: "true"
      uid: "0"
      gid: "0"
    nodePublishSecretRef:
      name: nas-crypt-personal-photos-config
      namespace: csi-rclone
---
