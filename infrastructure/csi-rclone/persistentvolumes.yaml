    driver: rclone.csi.veloxpack.io
    volumeHandle: nas-crypt-forgejo-lfs#backup-src
    volumeAttributes:
      remote: "nas-crypt-forgejo-lfs"
      remotePath: ""
      allow_other: "true"
      uid: "0"
      gid: "0"
    nodePublishSecretRef:
      name: nas-crypt-forgejo-lfs-config
      namespace: csi-rclone
---
# registry-blobs SHARE ROOT.
#
# Added 2026-08-19 for the ADR 0051 migration of the registry-blobs dataset,
# which is the ONE dataset migrate-nas-dataset.sh could not move: it renames
# through a share-root mount, and this share had none — it is deliberately
# outside the offsite lane (Forgejo Packages blobs are regenerable,
# re-pushable images; decision 2026-07-16, re-affirmed 2026-08-15). The
# migration runbook §7 offers exactly two ways to close that, and this is the
# first: give it a share-root mount and run the standard procedure.
#
# It is BOTH a migration mount handle and a real offsite backup source: since
# 2026-08-19 nas-personal-cronjob.yaml mounts it and calls
# `backup_share /nas/registry-blobs internal`, implementing what ADR 0051's
# Consequences already required. An earlier version of this comment said the
# opposite; the manifests had been contradicting the ADR.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-registry-blobs-backup-root
  labels:
    homelab.internal/nas-share: registry-blobs
    homelab.internal/component: backup-source
  annotations:
    homelab.internal/dataset: "SHARE ROOT — deliberate. Migration mount handle AND offsite backup source."
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nas-crypt-registry-blobs
  mountOptions:
    - allow-other=true
    - file-perms=0666
    - dir-perms=0777
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: backup-cronjobs
    name: backup-src-registry-blobs
  csi:
    driver: rclone.csi.veloxpack.io
    volumeHandle: nas-crypt-registry-blobs#backup-src
    volumeAttributes:
      remote: "nas-crypt-registry-blobs"
      remotePath: ""
      allow_other: "true"
      uid: "0"
      gid: "0"
    nodePublishSecretRef:
      name: nas-crypt-registry-blobs-config
      namespace: csi-rclone
