# csi-rclone driver namespace.
#
# PSA `privileged` because the driver's node DaemonSet needs
# /dev/fuse + mount propagation to expose decrypted mounts to
# consumer pods. The privileged surface is bounded to THIS
# namespace; consumer apps (Immich, Nextcloud, Paperless, …)
# stay in PSA `restricted` namespaces and only see a normal
# CSI volume mount with no caps and no host paths.
#
# Per ADR 0030 §D1.

apiVersion: v1
kind: Namespace
metadata:
  name: csi-rclone
  annotations:
    # Opt out of the Kyverno-generated 16Gi default-quota: the rclone
    # node mounter runs at 3Gi × 6 nodes (write-burst headroom, see
    # values.yaml) which totals ~20Gi and exceeds the fleet default.
    # Replaced by the explicit, DaemonSet-sized resourcequota.yaml.
    bypass.homelab.internal/homelab-generate-default-resourcequota: "csi-rclone node DaemonSet (3Gi × 6) exceeds the 16Gi default; explicit quota in-layer"
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    # ADR 0036 D4 — infrastructure-tier CSI driver namespace.
    # Data-class `internal` (metadata only — the encrypted
    # backing store's data-class is a per-consumer property).
    homelab.internal/first-party: "true"
    homelab.internal/data-class: internal
