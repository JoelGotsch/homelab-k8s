# ExternalSecrets for csi-rclone.
#
# One Secret per `nas-crypt-*` StorageClass. The Secret holds
# a key `configData` containing the rclone INI for that share's
# chained crypt-over-NFS remote. The StorageClass references
# this Secret via `csi.storage.k8s.io/node-publish-secret-name`
# so the driver picks up the config at PVC mount time.
#
# OpenBao path layout (per ADR 0025 D8 + ADR 0030 §D1):
#   kv/prod/nas-encryption/<share>/rclone_config
#     The full rclone INI as a single string. Operator generates
#     it during the bootstrap ceremony per
#     `03-runbooks/nas/rclone-crypt-key-bootstrap.md`. Includes
#     the obscured crypt password + salt (`rclone obscure`),
#     the NAS IP, and the ciphertext share path.
#
# Why one big string vs templated fields: the rclone INI's
# password obscuring is rclone-specific; templating it cluster-
# side would require an in-pod `rclone obscure` step at every
# bootstrap. Storing the pre-rendered config keeps secrets out
# of templates and matches the offline-recovery archive shape
# (the operator only has to back up the OpenBao snapshot, not
# a separate "what does the assembled config look like" doc).

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nas-crypt-personal-photos-config
  namespace: csi-rclone
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nas-crypt-personal-photos-config
    creationPolicy: Owner
  data:
    - secretKey: configData
      remoteRef:
        key: prod/nas-encryption/personal-photos
        property: rclone_config
