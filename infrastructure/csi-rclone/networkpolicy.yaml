# Network policy for the csi-rclone driver — ADR 0064 D2.
#
# HISTORY, because the previous version of this file misled for four
# months. Until 2026-09-10 it held a NetworkPolicy and a
# CiliumNetworkPolicy that selected NOTHING: both driver pods ran
# hostNetwork=true (hardcoded in the chart's templates), Cilium mints
# no endpoint for a host-network pod, and a policy with no endpoint is
# never consulted. Its NAS port list said NFS 2049/111; the driver
# speaks SMB on 445 (measured 2026-09-09 from /proc/net/tcp in the
# rclone container). The two errors hid each other — an allowlist
# that is never enforced cannot be contradicted by reality.
#
# ADR 0064 D1 takes both pods off the host network (kustomization.yaml
# patches; the chart offers no value for it), which makes them Cilium
# endpoints and makes THIS policy bite. The order of the two commits
# is the safety argument: this file landed first, inert, and was
# validated against a scratch pod carrying the driver's label before
# the flip. Anyone changing the ports below must repeat that check —
# a wrong port here severs every nas-crypt mount in the cluster.
#
# What the driver needs, and nothing else:
#
#   ingress  monitoring/prometheus -> 5572   (metrics; ServiceMonitor)
#   egress   kube-dns 53                     (UDP + TCP)
#   egress   kube-apiserver 443 + 6443       (node plugin lists PVs, PVCs,
#                                            nodes, CSINodes; provisioner
#                                            + its lease; BOTH ports —
#                                            socket-LB DNATs :443 -> :6443
#                                            before policy evaluation)
#   egress   10.10.40.2:445 TCP              (the NAS, SMB — crypt is
#                                            in-process, the wire sees
#                                            ciphertext)
#
# Not needed: kubelet (CSI + registrar are unix sockets on hostPath),
# any other node, the internet (rclone is a library; nothing is
# fetched). The kubelet's liveness httpGet arrives from the `host`
# entity, which Cilium admits without a rule.
#
# Verified live 2026-09-09 (not from this comment): the blackbox
# exporter's NAS probe targets 10.10.40.2:445 continuously
# (NasUnreachable / NasUnreachableSustained).

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: csi-rclone
  namespace: csi-rclone
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: csi-driver-rclone
  ingress:
    # Prometheus scrape of the node plugin's metrics port. The
    # ServiceMonitor names the port `metrics`; CNP ports are numeric.
    # 5572 is also in prometheus-allow's port allowlist (rule 17) —
    # once the pods have pod IPs the scrape no longer rides on the
    # host/remote-node entities.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "5572"
              protocol: TCP
  egress:
    # kube-DNS. No L7 DNS rule on purpose: nothing here uses toFQDNs
    # (the NAS is addressed by IP in every share's rclone INI), so the
    # DNS proxy would add a failure mode and nothing else.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # kube-apiserver — reserved entity; both ports, see header.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # The NAS, SMB only. Same rule shape as
    # observability/blackbox-exporter/ciliumnetworkpolicy.yaml.
    - toCIDR:
        - "10.10.40.2/32"
      toPorts:
        - ports:
            - port: "445"
              protocol: TCP
