# csi-rclone — cluster-wide encryption layer for `personal+`
# data on the NAS. Per ADR 0030.
#
# Helm chart: veloxpack/csi-driver-rclone (OCI). Driver runs
# privileged in this namespace; consumer apps claim a PVC
# against the `nas-crypt-*` StorageClasses defined in
# storageclasses.yaml and stay PSA-restricted.
#
# OPERATOR PINS the chart version + image digest via Renovate.
# Image-digest pin (not just tag) per ADR 0030 §D5 maturity
# hedge — veloxpack is pre-1.0; explicit human review on bumps.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: csi-rclone

helmCharts:
  - name: csi-driver-rclone
    # ADR 0052 D3: chart from the Forgejo Packages mirror (was oci://ghcr.io/veloxpack/charts).
    repo: oci://registry.homelab.internal/homelab

    version: "0.5.0"  # OPERATOR PINS via Renovate
    releaseName: csi-rclone
    namespace: csi-rclone
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - namespace.yaml
  - resourcequota.yaml
  - externalsecret.yaml
  - storageclasses.yaml
  # Static PVs — one per named dataset, ADR 0051. These are the
  # supported way to get storage on a nas-crypt share; the classes
  # above no longer hand out the share root.
  - persistentvolumes.yaml
  - networkpolicy.yaml
  # Storage-class conformance probe — ADR 0058 D4. Two probe datasets and a
  # nightly job that asserts the append contract these classes are relied on
  # for. Lands here rather than in observability because the thing under test
  # is this layer's own storage classes.
  - conformance.yaml

# Post-render patches.
#
# 1. hostNetwork: false on BOTH driver workloads — ADR 0064 D1. The chart
#    hardcodes `hostNetwork: true` in its templates (csi-rclone-node.yaml:22,
#    csi-rclone-controller.yaml:21) and exposes only dnsPolicy as a value.
#    Nothing in the driver needs the host network: the kubelet CSI socket,
#    the registrar socket and /var/lib/kubelet/pods are hostPath mounts, and
#    hostPath does not depend on the network namespace. Off the host network
#    the pods are Cilium endpoints, so networkpolicy.yaml is ENFORCED —
#    read its header before touching either. NAS traffic still leaves
#    masqueraded to the node IP (bpf masquerade), so the NAS sees no change.
#    dnsPolicy moves to ClusterFirst in values.yaml (both copies) with it.
#
# 2. Liveness probes must NOT say `host: localhost` once the pods are off the
#    host network. The chart's probe is `httpGet: {host: localhost, port: N}`
#    and its liveness-probe sidecar listens on `localhost:N`. The kubelet runs
#    the httpGet from the NODE's network namespace, so `host: localhost` means
#    the node's loopback — which only worked while the sidecar shared it.
#    2026-09-10 08:07–08:10 UTC, first roll after D1: every rclone container
#    (six nodes + controller) was killed on `dial tcp [::1]:29655: connection
#    refused` every ~3 min, and each kill severed every mount on that node —
#    exactly the outage the policy ordering was meant to avoid. Fix: drop
#    `host` (kubelet then dials the pod IP; the local host reaches its own
#    endpoints without a policy rule — Cilium `--allow-localhost=auto`) and
#    bind the sidecar to `:N`. BOTH workloads, BOTH halves, or it loops again.
#
# 3. Liveness endpoint on 29655 (since 2026-05-27). When both this DaemonSet
#    and nfs-csi's csi-nfs-node were hostNetwork, the chart-default
#    localhost:29653 collided on every node ("bind: address already in use",
#    both crashlooping). Off the host network the collision is gone, but a
#    distinct port costs nothing and keeps this patch stable across future
#    flips, so it stays. The controller keeps the chart's 29652.
patches:
  - target:
      kind: DaemonSet
      name: csi-rclone-node
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: csi-rclone-node
      spec:
        template:
          spec:
            hostNetwork: false
            containers:
              - name: liveness-probe
                args:
                  - --csi-address=/csi/csi.sock
                  - --probe-timeout=3s
                  - --http-endpoint=:29655
                  - --v=5
              - name: rclone
                livenessProbe:
                  httpGet:
                    host: null   # see header §2 — pod IP, not the node's loopback
                    port: 29655
  - target:
      kind: Deployment
      name: csi-rclone-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: csi-rclone-controller
      spec:
        template:
          spec:
            hostNetwork: false
            containers:
              - name: liveness-probe
                args:
                  - --csi-address=/csi/csi.sock
                  - --probe-timeout=3s
                  - --http-endpoint=:29652
                  - --v=5
              - name: rclone
                livenessProbe:
                  httpGet:
                    host: null   # see header §2
