# Root credentials for MinIO. Projected from OpenBao
# kv/data/minio-on-nas/root-creds. The Helm chart references
# the resulting Secret via existingSecret in values.yaml.
#
# OpenBao path layout:
#   kv/data/minio-on-nas/root-creds:
#     rootUser:     <root user, ~16 chars from openssl rand>
#     rootPassword: <root password, ~32 chars from openssl rand>
#
# Bootstrap: operator generates the credentials before first
# sync and writes them to OpenBao. The chart's first install
# uses them to seed MinIO; subsequent installs reuse the same
# Secret (idempotent — MinIO writes the root creds to its on-
# disk metadata at first start, then validates on subsequent
# starts).
#
# Rotation: write new values to the OpenBao path; the
# ExternalSecret refresh picks them up; restart MinIO. MinIO
# accepts the new root creds and rewrites its metadata.
# Retention of old creds is not needed (root is the operator's
# break-glass; per-app keys are issued separately).

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: minio-root
  namespace: minio-on-nas
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: minio-root
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Match the chart's expected key names (rootUser /
        # rootPassword) — see values.yaml `existingSecret`.
        rootUser: "{{ .rootUser }}"
        rootPassword: "{{ .rootPassword }}"
  data:
    - secretKey: rootUser
      remoteRef:
        key: minio-on-nas/root-creds
        property: rootUser
    - secretKey: rootPassword
      remoteRef:
        key: minio-on-nas/root-creds
        property: rootPassword
