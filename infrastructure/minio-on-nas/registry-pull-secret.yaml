# Image-pull credentials for registry.homelab.internal (Forgejo
# Packages OCI registry). Per platform/forgejo/README.md
# §"First-party image pulls". Required because the MinIO server
# image is now pulled from the Forgejo mirror per ADR 0035 D2,
# not anonymously from quay.io.
#
# Source: kv/shared/forgejo-packages/ci   {username, token}
# Bot:    ci-packages   (dual-use push+pull; rationale in
#                        the platform/forgejo README)

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: registry-homelab-internal-pull
  namespace: minio-on-nas
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: registry-homelab-internal-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "registry.homelab.internal": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: shared/forgejo-packages/ci
        property: username
    - secretKey: password
      remoteRef:
        key: shared/forgejo-packages/ci
        property: token
