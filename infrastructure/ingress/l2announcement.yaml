# Cilium L2 announcement — ARP-broadcasts the LB IP onto the
# servers VLAN so clients on that L2 can find the Gateway pod.
#
# Without this, the LB-IPAM-allocated IP exists in Cilium's
# service map but no ARP responder advertises it. ARP requests
# from clients (operator's WiFi → flint3 → servers VLAN)
# timeout, browser shows "no route to host".
#
# `nodeSelector: {}` = all nodes participate. Cilium elects
# one node per service to own the announcement; if that node
# goes down, election re-runs.
#
# `interfaces` matches the physical NIC on cluster nodes —
# Talos nodes use `enpNs0` naming where N varies by hardware:
# cp1/cp2/cp3/worker1-3 all sit on the `enp[0-9]+s0` interface
# carrying their servers-VLAN address. Regex matches any
# enpXs0 to stay portable across node hardware mixes.
#
# An overly-narrow regex (e.g. `^enp4s0$`) silently no-ops:
# the policy is accepted, the announcer lease is taken, but
# no node ARP-responds on the actual NIC — Gateway IP
# unreachable on the VLAN.

apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: homelab-ingress
spec:
  serviceSelector:
    matchLabels:
      io.cilium.gateway/owning-gateway: homelab-gateway
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  interfaces:
    - "^enp[0-9]+s0$"
  externalIPs: true
  loadBalancerIPs: true
---
# Secondary policy: announce any LoadBalancer Service that
# opts in via the `homelab.io/l2-announce: "true"` label.
# Cannot extend `homelab-ingress` above with `matchExpressions`
# OR-semantics — Kubernetes label selectors are AND-only. The
# Cilium Gateway auto-Service carries `io.cilium.gateway/...`
# and is owned by the gateway controller (we can't add labels
# to it), so dedicated services like `forgejo-ssh` get a
# label of their own + this companion policy.
#
# Same node/interface/IP settings as homelab-ingress —
# any deviation just means the announcement happens on the
# wrong NIC or wrong nodes, hence kept identical on purpose.
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: homelab-labeled
spec:
  serviceSelector:
    matchLabels:
      homelab.io/l2-announce: "true"
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  interfaces:
    - "^enp[0-9]+s0$"
  externalIPs: true
  loadBalancerIPs: true
