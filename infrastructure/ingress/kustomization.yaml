# Cluster-wide Cilium Gateway API resources.
# Cilium itself enables Gateway API via values; this dir
# defines the GatewayClass + default Gateway that apps then
# bind their HTTPRoute resources to.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# gatewayclass.yaml is intentionally NOT listed here — the
# Cilium chart ships its own GatewayClass `cilium` with
# controllerName: io.cilium/gateway-controller (gated by
# infrastructure/cilium/values.yaml gatewayAPI.enabled: true).
# Declaring it from this directory created a SharedResourceWarning
# in Argo: the live object's tracking-id is infra-cilium, so
# infra-ingress always saw the resource as OutOfSync.
resources:
  - gateway.yaml
  - loadbalancer-ippool.yaml
  - l2announcement.yaml

# Site-config phase 2: wildcard hostnames + cert names resolve from the single
# site-config. Listener indices 0/1 are the stable wildcard listeners; the
# registry listeners (2/3) are AFTER them and slated for removal at ADR 0038
# D4 — removing them does not shift these indices.
components:
  - ../../components/site-config

replacements:
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.fqdn_suffix }
    targets:
      - select: { kind: Gateway, name: homelab-gateway }
        # INDEX-BASED, so it must be kept in step with the listener order in
        # gateway.yaml. Inserting the tls-openbao listener at index 1 on
        # 2026-08-16 shifted `http` from 1 to 2, which would have left it with
        # a literal `*.FQDN_SUFFIX` hostname — a placeholder that renders and
        # syncs perfectly happily while matching no request.
        #   0 https        *.FQDN_SUFFIX
        #   1 tls-openbao  openbao.FQDN_SUFFIX
        #   2 http         *.FQDN_SUFFIX
        #   3 https-registry / 4 http-registry — registry.homelab.internal,
        #     deliberately NOT listed: they carry no FQDN_SUFFIX, and a
        #     replacement here would mangle them into
        #     registry.lab.<domain>.internal.
        fieldPaths:
          - spec.listeners.0.hostname
          - spec.listeners.1.hostname
          - spec.listeners.2.hostname
        options: { delimiter: '.', index: 1 }
      - select: { kind: Certificate, name: homelab-wildcard-tls }
        fieldPaths:
          - spec.dnsNames.1
        options: { delimiter: '.', index: 1 }
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.fqdn_suffix }
    targets:
      - select: { kind: Certificate, name: homelab-wildcard-tls }
        fieldPaths:
          - spec.commonName
          - spec.dnsNames.0
