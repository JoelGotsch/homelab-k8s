# Default Gateway — apps' HTTPRoutes attach to this.
# One Gateway listens for HTTPS on the cluster ingress IP;
# cert-manager-issued wildcard cert covers *.lab.<homelab-domain>.
#
# Per network.md ingress + storage.md / identity.md app paths.
#
# OPERATOR FILLS the hostname template at first commit per
# the homelab domain.

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-gateway
  namespace: ingress
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.FQDN_SUFFIX"
      tls:
        mode: Terminate
        certificateRefs:
          # `group: ""` is the Gateway API CRD default; the
          # apiserver stamps it on write, so leaving it out here
          # produces persistent Argo OutOfSync (drift = "" vs
          # missing). Writing it explicitly matches persisted
          # state and clears the selfHeal loop.
          - group: ""
            kind: Secret
            name: homelab-wildcard-tls
            namespace: ingress
      allowedRoutes:
        namespaces:
          from: All
    # HTTP listener for ACME http-01 challenges (cert-manager
    # uses DNS-01 by default once DNS provider configured;
    # http-01 listed here as fallback).
    - name: http
      port: 80
      protocol: HTTP
      hostname: "*.FQDN_SUFFIX"
      allowedRoutes:
        namespaces:
          from: All
    # HTTPS + HTTP listeners for `registry.homelab.internal` —
    # the alias under which Forgejo Packages OCI registry is
    # reached from inside the homelab (per ADR 0019 D1; operator
    # option (b): keep the hardcoded hostname in every
    # .woodpecker.yml + image: ref, make DNS+TLS resolve to
    # Forgejo's HTTP host on this Gateway).
    #
    # `.homelab.internal` is not Let's-Encrypt-issuable, so this
    # listener uses a cert from the homelab-internal-issuer
    # (OpenBao PKI) — see `registry-homelab-internal-tls`
    # Certificate below. trust-manager distributes the root CA
    # cluster-wide; Talos nodes get it via the machine-config
    # patch in homelab-infra/talos/patches/common.yaml.
    #
    # DNS: registry.homelab.internal A <cluster_ingress_ip>
    # served by OpenWrt unbound — see
    # homelab-infra/ansible/roles/openwrt-config/templates/unbound.conf.j2.
    - name: https-registry
      port: 443
      protocol: HTTPS
      hostname: registry.homelab.internal
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: registry-homelab-internal-tls
            namespace: ingress
      allowedRoutes:
        namespaces:
          from: All
    - name: http-registry
      port: 80
      protocol: HTTP
      hostname: registry.homelab.internal
      allowedRoutes:
        namespaces:
          from: All
---
# Wildcard cert for *.lab.<homelab-domain>, issued by
# Let's Encrypt via cert-manager (Cloudflare DNS-01 solver).
# Per ADR 0034: operator-facing certs MUST be browser-trusted,
# so this listener uses LE — the homelab-internal-issuer (OpenBao
# PKI) is reserved for cluster-internal mTLS / service-to-service
# where the homelab.internal CA bundle is mounted via trust-manager.
#
# A browser-trusted cert is also a hard prerequisite for WebAuthn
# enrollment + login: the WebAuthn API refuses to register
# credentials when the page's TLS chain is not in the OS trust
# store. (Tested 2026-05-25: enrollment fails silently with
# "Failed to register" on internal-CA cert.)
#
# Letsencrypt-issued certs land in the public Certificate
# Transparency log; that's the explicit ADR 0034 trade-off.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-wildcard-tls
  namespace: ingress
spec:
  secretName: homelab-wildcard-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "FQDN_SUFFIX"
  dnsNames:
    - "FQDN_SUFFIX"
    - "*.FQDN_SUFFIX"
  # LE certs are 90-day; renew at 30 days remaining (default cert-
  # manager behavior, but pin explicitly so it's not opaque).
  duration: 2160h     # 90 days
  renewBefore: 720h   # 30 days remaining
---
# Leaf cert for `registry.homelab.internal`, signed by the
# homelab-internal CA (OpenBao PKI → cert-manager via the
# `homelab-internal-issuer` ClusterIssuer).
#
# `*.homelab.internal` is unreachable on the public internet
# so LE / ACME cannot validate it. The homelab CA cert is
# distributed in-cluster via trust-manager
# (infrastructure/trust-manager/bundles.yaml) and to Talos
# containerd via the machine-config patch in
# homelab-infra/talos/patches/common.yaml.
#
# Per ADR 0019 D1 (Forgejo = registry) + D5 (Talos trusts the
# homelab CA); identity.md.
#
# Prerequisite: the OpenBao PKI role `homelab-internal-issuer`
# allowed_domains list must include `homelab.internal`. Patch
# applied to homelab-infra/ansible/playbooks/09b-argocd-bootstrap.yml.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: registry-homelab-internal-tls
  namespace: ingress
spec:
  secretName: registry-homelab-internal-tls
  issuerRef:
    name: homelab-internal-issuer
    kind: ClusterIssuer
  commonName: registry.homelab.internal
  dnsNames:
    - registry.homelab.internal
  # OpenBao PKI role caps max_ttl=2160h with default ttl=720h
  # per 09b-argocd-bootstrap.yml. cert-manager auto-renews.
  duration: 720h     # 30 days
  renewBefore: 240h  # 10 days remaining
  privateKey:
    # RSA-2048, not ECDSA: the OpenBao PKI role
    # `homelab-internal-issuer` is configured `key_type=rsa` per
    # 09b-argocd-bootstrap.yml. A Certificate that asks for
    # `ECDSA` here fails at sign time with `role requires keys
    # of type rsa` (see 2026-06-06 journal). RSA-2048 is the
    # GitOps-side fix; no OpenBao role rewrite needed.
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
