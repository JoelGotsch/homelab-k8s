# One-time infrastructure check; no app state, credentials, network or provider calls.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller-bootstrap
  namespace: argo-rollouts
automountServiceAccountToken: false
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisRun
metadata:
  name: controller-bootstrap-v1
  namespace: argo-rollouts
spec:
  metrics:
  - name: synthetic-job
    count: 1
    failureLimit: 0
    provider:
      job:
        spec:
          backoffLimit: 0
          activeDeadlineSeconds: 180
          template:
            metadata:
              labels:
                homelab.internal/release-check: controller-bootstrap
            spec:
              serviceAccountName: controller-bootstrap
              automountServiceAccountToken: false
              restartPolicy: Never
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                seccompProfile:
                  type: RuntimeDefault
              containers:
              - name: check
                image: python:3.12-slim-bookworm@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e
                command:
                - python
                - -I
                - -c
                - import hashlib,pathlib; assert not pathlib.Path('/var/run/secrets/kubernetes.io/serviceaccount/token').exists();
                  assert hashlib.sha256(b'synthetic-release-controller-check').hexdigest()
                  == '44cf90686aad9e2d9ca240e035e16c4612cb77cddca807f1f7b6767b38b03d1c';
                  print('synthetic verification passed')
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    cpu: 100m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
