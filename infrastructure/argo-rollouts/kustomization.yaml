apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo-rollouts
components:
  - ../../components/first-party-namespace
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - verification.yaml
helmCharts:
  - name: argo-rollouts
    repo: oci://registry.homelab.internal/homelab
    version: 2.43.2
    releaseName: argo-rollouts
    namespace: argo-rollouts
    valuesFile: values.yaml
    includeCRDs: true
