# NFS CSI driver — RWX storage for cluster apps that mount
# NAS shares (Nextcloud, Jellyfin, etc.).
# Per storage.md + ADR 0025.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: csi-driver-nfs
    repo: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
    version: "v4.9.0"  # OPERATOR PINS via Renovate
    releaseName: csi-driver-nfs
    namespace: nfs-csi
    valuesFile: values.yaml

resources:
  - storageclasses.yaml
