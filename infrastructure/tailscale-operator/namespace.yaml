apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    # PRIVILEGED, not restricted: the operator's subnet-router (Connector)
    # pods run tailscaled with elevated networking (NET_ADMIN / tun) for
    # kernel-mode subnet forwarding — a documented exception, same class as
    # cilium/longhorn. ADR 0044.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    # ADR 0036 D4 — infrastructure-tier; classified `internal`.
    homelab.internal/first-party: "true"
    homelab.internal/data-class: internal
