# Egress/ingress for the operator + its dynamically-created subnet-router
# pods (ADR 0044). Deliberately PERMISSIVE for this special namespace:
# the connector pods are created by the operator (labels we don't own)
# and must reach arbitrary DERP relays + WireGuard peers (world) AND
# forward tailnet traffic to the whole servers VLAN + cluster services
# (cluster/host/remote-node). Scoped to the namespace, not the fleet.
#
# Only egress + ingress lists are set (no policyTypes gap): return
# traffic for tailscaled's outbound flows is allowed by Cilium conntrack.
#
# The `world` egress is DECLARED, not fixable (2026-09-14): a direct
# WireGuard peer is UDP to whatever public address:port the peer's NAT
# hands out, and DERP relays are added and moved without notice —
# Tailscale's own firewall guidance is "UDP to *:*" and "TCP to *:443"
# (tailscale.com/kb/1082). The bypass annotation below waives Kyverno's
# homelab-disallow-open-egress-cnp for exactly that; the rule is still
# narrowed to what tailscaled uses (TCP 443 + 80, UDP any) instead of
# every port and protocol, and the servers VLAN the router advertises
# is its own toCIDR rule rather than riding on `world`.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tailscale-operator
  namespace: tailscale
  annotations:
    bypass.homelab.internal/homelab-disallow-open-egress-cnp: "tailscale subnet router: direct WireGuard peers are UDP to any address:port and DERP relays rotate (tailscale.com/kb/1082), so no destination allowlist can exist; world is narrowed to TCP 443+80 and UDP, the advertised VLAN is a toCIDR rule"
spec:
  # All pods in the namespace (operator + connector proxies).
  endpointSelector: {}
  egress:
    # Cluster services, nodes (10.10.30.x nodes are host/remote-node to
    # Cilium, not world) and the Kubernetes API (operator reconcile).
    - toEntities:
        - cluster
        - host
        - remote-node
        - kube-apiserver
    # Tailnet, per tailscale.com/kb/1082: coordination server + DERP
    # relays over TCP 443 (coordination prefers 80, falls back to 443;
    # captive-portal probes use 80); STUN is UDP 3478 and direct
    # WireGuard peers are UDP to any port, so UDP is the full range.
    - toEntities:
        - world
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
            - { port: "80", protocol: TCP }
            - { port: "1", endPort: 65535, protocol: UDP }
    # Subnet forwarding to the VLAN the Connector advertises
    # (connector.yaml `advertiseRoutes`). Hosts there that are not
    # cluster nodes are `world` to Cilium, hence the explicit CIDR; all
    # ports, because this is routed tailnet traffic, not tailscaled's.
    - toCIDR:
        - 10.10.30.0/24
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
  ingress:
    # kubelet health/readiness probes arrive as node identities; return
    # traffic for tailscaled's own outbound flows is conntrack-allowed.
    - fromEntities:
        - host
        - remote-node
