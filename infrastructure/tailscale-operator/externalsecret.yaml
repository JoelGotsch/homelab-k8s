# Tailscale OAuth client for the operator (ADR 0044).
#
# The operator authenticates to the tailnet with an OAuth client (NOT a
# static auth key) and, when the Helm `oauth` block is unset, reads a
# Secret named `operator-oauth` in its own namespace with keys
# `client_id` / `client_secret`. This ESO projects those from OpenBao.
#
# Seed (operator, one-time) — see README "OpenBao paths to seed":
#   kv/shared/tailscale-operator  { client_id, client_secret }
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: shared/tailscale-operator
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: shared/tailscale-operator
        property: client_secret
