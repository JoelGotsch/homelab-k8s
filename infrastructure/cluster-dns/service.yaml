# LoadBalancer VIP for the split-horizon resolver (ADR 0044).
# 10.10.30.53 = next free in the homelab-ingress pool (.50 gateway,
# .51 forgejo-ssh, .52 registry-direct). L2-announced on the servers
# VLAN, so it is reachable via EITHER subnet router (in-cluster or the
# Flint3 fallback). The tailnet MagicDNS split-DNS points
# `<fqdn_suffix>` here at the phase-4 cutover.
apiVersion: v1
kind: Service
metadata:
  name: cluster-dns
  labels:
    app.kubernetes.io/name: cluster-dns
    # Opt into the companion L2 policy (infrastructure/ingress/l2announcement.yaml
    # — the primary policy only covers the gateway auto-Service).
    homelab.io/l2-announce: "true"
  annotations:
    lbipam.cilium.io/ips: "10.10.30.53"
spec:
  type: LoadBalancer
  loadBalancerIP: 10.10.30.53
  selector:
    app.kubernetes.io/name: cluster-dns
  ports:
    - { name: dns, port: 53, targetPort: 53, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: 53, protocol: TCP }
