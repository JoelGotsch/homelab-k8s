# Default-deny both directions for the resolver pods (ADR 0036).
# Ingress on :53 is granted by the companion CiliumNetworkPolicy
# (ciliumnetworkpolicy.yaml) because LoadBalancer traffic arrives
# SNAT'd as a node identity (`remote-node`/`host`), which a standard
# NetworkPolicy cannot express.
#
# Egress: the `.:53 forward` block (ADR 0044 D4, 2026-08-20) needs DoT to
# Quad9 — exactly the two anycast IPs on 853/tcp, nothing wider. kube-dns
# is allowed solely so the pod can resolve should any plugin need it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cluster-dns-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cluster-dns
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # DoT upstreams for the global-resolver block (configmap.yaml). Keep in
    # lockstep with the `forward` line: an upstream added there without an
    # allow here fails closed, and a CNP drop looks like a blackhole
    # (lessons.md, "A CNP drop looks like a blackhole, not a refusal").
    - to:
        - ipBlock: { cidr: 9.9.9.9/32 }
        - ipBlock: { cidr: 149.112.112.112/32 }
      ports:
        - { port: 853, protocol: TCP }
