# CoreDNS as the in-cluster split-horizon resolver (ADR 0044).
# Distinct from kube-system/coredns (which serves cluster.local) — this
# instance is authoritative ONLY for the internal zone and is fronted by
# a LoadBalancer VIP (service.yaml, 10.10.30.53) reachable via the
# Tailscale subnet route. Reuses the cluster's already-trusted CoreDNS
# image (pinned by digest to satisfy the image-digest policy).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-dns
  labels:
    app.kubernetes.io/name: cluster-dns
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-dns
    spec:
      # HA: keep the two replicas on different nodes so an L2-announcer
      # node drain never takes the whole resolver down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cluster-dns
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.14.2@sha256:e7e6440cfd1e919280958f5b5a6ab2b184d385bba774c12ad2a9e1e4183f90d9
          args: ["-conf", "/etc/coredns/Corefile"]
          env:
            # Filled at build time by the site-config replacement in
            # kustomization.yaml. `unset` is a placeholder (never shipped).
            - name: FQDN_SUFFIX
              value: "unset"
          ports:
            - { name: dns, containerPort: 53, protocol: UDP }
            - { name: dns-tcp, containerPort: 53, protocol: TCP }
            - { name: metrics, containerPort: 9153, protocol: TCP }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: 8181 }
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # ADR 0042: requests always, memory limit always, no CPU limit.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # The one capability restricted-PSS permits — lets CoreDNS
              # bind :53 as a non-root user.
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cluster-dns-corefile
            items:
              - key: Corefile
                path: Corefile
