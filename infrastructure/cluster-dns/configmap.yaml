# CoreDNS config for the in-cluster resolver (ADR 0044): the split-horizon
# AUTHORITY for the internal zone (ports Flint3's Unbound: a wildcard to
# the gateway VIP plus per-host overrides for router/switch/nodes) AND,
# since 2026-08-20, the tailnet's GLOBAL resolver (ADR 0044 D4): a second
# `.:53` server block forwards everything outside the zone over DoT.
#
# Implemented as an authoritative ZONE FILE (the `file` plugin), NOT
# hosts+template: CoreDNS runs the `template` plugin BEFORE `hosts` in
# its fixed plugin chain, so a wildcard `template` would shadow every
# specific host. A zone file gets proper RFC 4592 wildcard precedence —
# an explicit record (cp1) always wins over `*` — for free.
#
# No domain literal is committed: the server-block zone is CoreDNS's
# `{$FQDN_SUFFIX}` env substitution (filled by the site-config
# replacement in kustomization.yaml), and the zone file uses only
# RELATIVE names, so its $ORIGIN is that same substituted zone.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-dns-corefile
data:
  Corefile: |
    {$FQDN_SUFFIX}:53 {
        errors
        log
        reload
        health   :8080
        ready    :8181
        prometheus :9153
        file /etc/coredns/db.zone
    }
    # Global resolver (ADR 0044 D4). Everything that is not the internal
    # zone is forwarded over DNS-over-TLS. One provider per forward block
    # is a CoreDNS constraint — `tls_servername` is global to the block, so
    # two providers cannot share one — and Quad9 is the one kept (Swiss
    # foundation; EU-first tie-breaker), a deliberate drift from Flint3's
    # Unbound, which forwards to 1.1.1.1 AND 9.9.9.9 (and verifies neither
    # name). health/ready/prometheus are process-wide and already declared
    # in the zone block above; declaring them twice fails the config.
    #
    # No `log` here on purpose: this block sees every name every tailnet
    # device resolves — `personal` data under ADR 0003 — and the zone block
    # above is the one worth logging. Flint3's Unbound does not log queries
    # either.
    .:53 {
        errors
        cache 300 {
            serve_stale 1h
        }
        forward . tls://9.9.9.9 tls://149.112.112.112 {
            tls_servername dns.quad9.net
            health_check 10s
        }
    }
  # Relative-name zone (origin = the server-block zone = {$FQDN_SUFFIX}).
  # `*` = Unbound's redirect wildcard -> gateway VIP; explicit records
  # (more specific) win per RFC 4592.
  db.zone: |
    $TTL 60
    @   IN SOA ns hostmaster ( 1 7200 3600 1209600 60 )
    @   IN NS  ns
    ns      IN A 10.10.30.50
    @       IN A 10.10.30.50
    *       IN A 10.10.30.50
    cluster IN A 10.10.30.10
    cp1     IN A 10.10.30.11
    cp2     IN A 10.10.30.12
    cp3     IN A 10.10.30.13
    worker1 IN A 10.10.30.21
    worker2 IN A 10.10.30.22
    worker3 IN A 10.10.30.23
    flint3  IN A 10.10.10.1
    crs312  IN A 10.10.10.2
