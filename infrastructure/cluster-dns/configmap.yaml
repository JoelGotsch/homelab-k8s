# CoreDNS config for the in-cluster split-horizon authority (ADR 0044).
# Ports Flint3's Unbound: a wildcard to the gateway VIP plus per-host
# overrides for router/switch/nodes.
#
# Implemented as an authoritative ZONE FILE (the `file` plugin), NOT
# hosts+template: CoreDNS runs the `template` plugin BEFORE `hosts` in
# its fixed plugin chain, so a wildcard `template` would shadow every
# specific host. A zone file gets proper RFC 4592 wildcard precedence —
# an explicit record (cp1) always wins over `*` — for free.
#
# No domain literal is committed: the server-block zone is CoreDNS's
# `{$FQDN_SUFFIX}` env substitution (filled by the site-config
# replacement in kustomization.yaml), and the zone file uses only
# RELATIVE names, so its $ORIGIN is that same substituted zone.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-dns-corefile
data:
  Corefile: |
    {$FQDN_SUFFIX}:53 {
        errors
        log
        reload
        health   :8080
        ready    :8181
        prometheus :9153
        file /etc/coredns/db.zone
    }
  # Relative-name zone (origin = the server-block zone = {$FQDN_SUFFIX}).
  # `*` = Unbound's redirect wildcard -> gateway VIP; explicit records
  # (more specific) win per RFC 4592.
  db.zone: |
    $TTL 60
    @   IN SOA ns hostmaster ( 1 7200 3600 1209600 60 )
    @   IN NS  ns
    ns      IN A 10.10.30.50
    @       IN A 10.10.30.50
    *       IN A 10.10.30.50
    cluster IN A 10.10.30.10
    cp1     IN A 10.10.30.11
    cp2     IN A 10.10.30.12
    cp3     IN A 10.10.30.13
    worker1 IN A 10.10.30.21
    worker2 IN A 10.10.30.22
    worker3 IN A 10.10.30.23
    flint3  IN A 10.10.10.1
    crs312  IN A 10.10.10.2
