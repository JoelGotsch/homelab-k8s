# Three secrets feeding the Restic-to-Hetzner CronJob:
#
# 1. restic-tier-3-password — Restic repo password. Generated
#    once at first install (`openssl rand -base64 32`) and
#    persisted to OpenBao + the offline-recovery archive (per
#    backup-and-dr.md: "Restic password per repository in
#    OpenBao at kv/prod/restic/<repo-name>/password"). Loss of
#    this password = loss of decrypt capability for every
#    snapshot in the repo. Do not rotate without first
#    `restic key add` + verify.
#
# 2. hetzner-sb-creds — SSH host/user/key for the Hetzner
#    Storage Box SFTP target. Reused from the OpenBao raft-
#    snapshot pipeline at kv/prod/backup/hetzner-storage-box.
#    Note: SSH key MUST be ed25519 — Hetzner Storage Box
#    supports ed25519 + rsa-3072+; ed25519 is the operator's
#    standard.
#
# 3. minio-reader-creds — MinIO service-account scoped read-only
#    on the source buckets. Provisioned post-MinIO-Healthy via
#    `mc admin user svcacct add` per
#    minio-on-nas/README §OpenBao paths to seed.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: restic-tier-3-password
  namespace: backup-cronjobs
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: restic-tier-3-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: prod/restic/cluster-tier-3/password
        property: value
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hetzner-sb-creds
  namespace: backup-cronjobs
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: hetzner-sb-creds
    creationPolicy: Owner
  data:
    - secretKey: HSB_HOST
      remoteRef:
        key: prod/backup/hetzner-storage-box
        property: host
    - secretKey: HSB_USER
      remoteRef:
        key: prod/backup/hetzner-storage-box
        property: user
    - secretKey: HSB_PORT
      remoteRef:
        key: prod/backup/hetzner-storage-box
        property: port
    - secretKey: SSH_KEY
      remoteRef:
        key: prod/backup/hetzner-storage-box
        property: ssh_key
    # SSH_KNOWN_HOST projection REMOVED 2026-07-15: host-key trust is now
    # pinned via the restic-known-hosts ConfigMap (public host keys belong
    # in versioned config, and the OpenBao value was stale/port-specific —
    # it lacked the ed25519 key and the port-22 form the box actually uses).
    # The kv field prod/backup/hetzner-storage-box#ssh_known_host is now
    # unused; the operator may delete it at leisure.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: minio-reader-creds
  namespace: backup-cronjobs
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: minio-reader-creds
    creationPolicy: Owner
  data:
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: prod/backup/minio-reader/s3-creds
        property: access_key_id
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: prod/backup/minio-reader/s3-creds
        property: secret_access_key
