# Pinned SSH host keys for the Hetzner Storage Box (restic sftp backend).
#
# These are PUBLIC host keys (not secrets) — verified via `ssh-keyscan -p 23`
# on 2026-07-15 and cross-checked by fingerprint. Pinning them here in git
# supersedes the OpenBao `SSH_KNOWN_HOST` value, which was stale/incomplete:
# it did not match the ed25519 key the server actually presents (modern ssh
# prefers ed25519), so restic's ssh failed "Host key verification failed"
# and tier-3 repo init never completed. Both key types are pinned; bracketed
# [host]:23 form because the box uses SSH port 23.
# Fingerprints: RSA SHA256:EMlfI8GsRIfpVkoW1H2u0zYVpFGKkIMKHFZIRkf2ioI
#               ED25519 SHA256:XqONwb1S0zuj5A1CDxpOSuD2hnAArV1A3wKY7Z3sdgM
apiVersion: v1
kind: ConfigMap
metadata:
  name: restic-known-hosts
  namespace: backup-cronjobs
data:
  known_hosts: |
    [u609156.your-storagebox.de]:23 ssh-rsa 
    [u609156.your-storagebox.de]:23 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICf9svRenC/PLKIL9nk6K/pxQgoiFC41wTNvoIncOxs
