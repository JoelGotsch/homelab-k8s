# Pinned SSH host keys for the Hetzner Storage Box (restic sftp backend).
#
# PUBLIC host keys (not secrets) — verified via ssh-keyscan + fingerprint on
# 2026-07-15 and confirmed to verify against ports 22 AND 23. Pinning them
# here supersedes the OpenBao SSH_KNOWN_HOST value (stale/port-specific).
#
# Port-agnostic on purpose: the box's SFTP port (HSB_PORT) may be 22 or 23,
# and ssh looks up the host under a DIFFERENT known_hosts key per port
# (plain "host" for the default port, "[host]:N" otherwise). Earlier a
# :23-only pin failed "Host key verification failed" because the container
# connects on port 22, where ssh looks up the bare hostname. Each key line
# therefore lists host,[host]:22,[host]:23. NB: port 22 serves ONLY the RSA
# key; port 23 serves RSA + ed25519 (same RSA fingerprint).
# Fingerprints: RSA SHA256:EMlfI8GsRIfpVkoW1H2u0zYVpFGKkIMKHFZIRkf2ioI
#               ED25519 SHA256:XqONwb1S0zuj5A1CDxpOSuD2hnAArV1A3wKY7Z3sdgM
apiVersion: v1
kind: ConfigMap
metadata:
  name: restic-known-hosts
  namespace: backup-cronjobs
data:
  known_hosts: |
    u609156.your-storagebox.de,[u609156.your-storagebox.de]:22,[u609156.your-storagebox.de]:23 ssh-rsa 
    u609156.your-storagebox.de,[u609156.your-storagebox.de]:22,[u609156.your-storagebox.de]:23 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICf9svRenC/PLKIL9nk6K/pxQgoiFC41wTNvoIncOxs
