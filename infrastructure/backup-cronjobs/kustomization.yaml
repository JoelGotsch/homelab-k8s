# Restic CronJob: MinIO buckets → Hetzner Storage Box (tier-3).
# Per backup-and-dr.md §Cluster Longhorn volumes (PVCs)
# and §Postgres databases (CNPG). Companion to
# infrastructure/minio-on-nas/.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pvc.yaml
  - externalsecret.yaml
  - cronjob.yaml
  # Workstream C — NAS personal+ shares → Hetzner (offsite for bulk data).
  - nas-personal-pvcs.yaml
  - nas-personal-cronjob.yaml
  - networkpolicy.yaml
  - prometheusrule.yaml
  - prometheusrule-footprint.yaml   # Workstream F — backup-size/pileup alerts
  # ADR 0035 D2 — image-pull cred for the Forgejo Packages
  # mirror of the pinned `mc` image. See registry-pull-secret.yaml.
  - registry-pull-secret.yaml
  - sa-default.yaml
  - restic-passwd-configmap.yaml
  - restic-known-hosts-configmap.yaml

# Build-only ConfigMap for the runbook_url replacements below.
components:
  - ../../components/site-config

# Resolve the runbook owner from the single site-config (no hardcoded GitHub
# user): `https://github.com/OPERATOR_GITHUB_USER/homelab-k8s/blob/main/...` ->
# `.../<operator_github_user>/...`. Provenance: this rule ->
# ConfigMap/site-config.data.operator_github_user ->
# components/site-config/site-config.env.
#
# Every alert is addressed BY NAME (`[name=…]` / `[alert=…]`), never by list
# index: rules get inserted into these groups (BackupCronJobMissing24h and
# ResticSnapshotStale both arrived after the first two), and an index-based
# path would silently retarget onto a neighbouring alert. A name selector that
# stops matching is a hard `kustomize build` error, not a silent no-op — so
# renaming an alert without updating this list fails the build instead of
# shipping a literal `OPERATOR_GITHUB_USER` in a page.
replacements:
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.operator_github_user }
    targets:
      - select: { kind: PrometheusRule, name: backup-cronjobs }
        fieldPaths:
          - spec.groups.[name=backup-cronjobs.staging-pvc].rules.[alert=ResticStagingPVCNearFull].annotations.runbook_url
          - spec.groups.[name=backup-cronjobs.staging-pvc].rules.[alert=ResticStagingPVCCritical].annotations.runbook_url
          - spec.groups.[name=backup-cronjobs.job-failed].rules.[alert=BackupCronJobFailed].annotations.runbook_url
          - spec.groups.[name=backup-cronjobs.job-failed].rules.[alert=BackupCronJobMissing24h].annotations.runbook_url
          - spec.groups.[name=backup-cronjobs.staleness].rules.[alert=ResticSnapshotStale].annotations.runbook_url
        options: { delimiter: '/', index: 3 }
