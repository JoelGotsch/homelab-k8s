# Restic CronJob: MinIO buckets → Hetzner Storage Box (tier-3).
#
# Per backup-and-dr.md §Cluster Longhorn volumes (PVCs) and
# §Postgres databases (CNPG): MinIO is the staging area;
# Restic replicates the bucket out to off-cluster storage with
# client-side encryption (operator's age-derived password,
# stored in OpenBao at kv/prod/restic/cluster-tier-3/password
# AND in the offline-recovery archive per ADR 0011).
#
# Sources mirrored: homelab-backups-cluster (CNPG WAL+base) +
# longhorn-backups (Longhorn snapshots). NOT loki-chunks —
# Loki retention is configured in its own values; loss of Loki
# history is acceptable per [ADR 0021].
#
# Tier-2 (friend's NAS) is a sibling CronJob, not a step in
# this one — friend's NAS hardware ship is the trigger to add
# `cronjob-friends-nas.yaml`. Independent failure modes; one
# can run without the other.
#
# Schedule: 02:00 UTC daily. After Longhorn nightly snapshot
# (~01:00 UTC), before OpenBao raft snapshot (03:00 UTC) — no
# hard ordering, but spreads I/O.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-minio-to-hetzner
  namespace: backup-cronjobs
  labels:
    app.kubernetes.io/name: restic-tier-3
    app.kubernetes.io/component: backup-pipeline
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid  # never overlap; missed run skipped
  startingDeadlineSeconds: 3600  # if scheduler is late >1h, skip
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1  # one retry on failure; alert fires past that
      activeDeadlineSeconds: 21600  # 6h hard cap
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restic-tier-3
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          # InitContainer mirrors MinIO buckets to the staging
          # PVC. Splits cleanly from the backup step so a mirror
          # failure surfaces in init, not as a confused "Restic
          # backed up an empty dir."
          initContainers:
            - name: mirror-minio
              image: minio/mc:RELEASE.2025-04-08T15-39-49Z  # OPERATOR PINS via Renovate
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # Configure mc against in-cluster MinIO.
                  mc alias set src \
                    http://minio.minio.svc.cluster.local:9000 \
                    "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"

                  # Mirror in incremental mode — `mc mirror`
                  # compares object metadata and skips
                  # unchanged. --remove syncs deletions so the
                  # staging tree matches the bucket exactly.
                  for bucket in homelab-backups-cluster longhorn-backups; do
                    echo "=== mirror src/$bucket → /staging/$bucket ==="
                    mkdir -p "/staging/$bucket"
                    mc mirror --remove --overwrite \
                      "src/$bucket" "/staging/$bucket"
                  done
                  echo "=== mirror complete: $(du -sh /staging | cut -f1) staged ==="
              envFrom:
                - secretRef:
                    name: minio-reader-creds
              volumeMounts:
                - name: staging
                  mountPath: /staging
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          containers:
            - name: restic
              image: restic/restic:0.17.3  # OPERATOR PINS via Renovate
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # Stage SSH key + known_hosts for the SFTP backend.
                  mkdir -p /tmp/.ssh
                  echo "$SSH_KEY" > /tmp/.ssh/id_ed25519
                  chmod 600 /tmp/.ssh/id_ed25519

                  # Host-key trust path:
                  #
                  # If SSH_KNOWN_HOST is set (operator captured
                  # the fingerprint at first SSH + wrote it to
                  # OpenBao at kv/prod/backup/hetzner-storage-box
                  # ssh_known_host), pin it. This is the
                  # preferred (post-TOFU) posture per
                  # 99-journal/2026-04-29-restic-tier-3-cronjob.md
                  # D5.
                  #
                  # If unset (first install / pre-pin), fall back
                  # to ssh-keyscan. Brief TOFU window.
                  if [ -n "${SSH_KNOWN_HOST:-}" ]; then
                    echo "$SSH_KNOWN_HOST" > /tmp/.ssh/known_hosts
                  else
                    ssh-keyscan -p "${HSB_PORT:-23}" -H "$HSB_HOST" \
                      > /tmp/.ssh/known_hosts 2>/dev/null
                  fi
                  chmod 600 /tmp/.ssh/known_hosts

                  export RESTIC_REPOSITORY="sftp:${HSB_USER}@${HSB_HOST}:/cluster-backups-tier-3"
                  export RESTIC_PASSWORD_FILE=/restic-secrets/password
                  export RESTIC_PROGRESS_FPS=0
                  # Restic invokes ssh internally; point it at our keypair.
                  export RESTIC_SFTP_COMMAND="ssh -i /tmp/.ssh/id_ed25519 -o UserKnownHostsFile=/tmp/.ssh/known_hosts -o BatchMode=yes -p ${HSB_PORT:-23} ${HSB_USER}@${HSB_HOST} -s sftp"

                  # Initialize on first run; idempotent on
                  # existing repo (returns "already initialized").
                  if ! restic snapshots --no-lock --quiet >/dev/null 2>&1; then
                    echo "=== initializing restic repo ==="
                    restic init
                  fi

                  echo "=== restic backup /staging ==="
                  restic backup /staging \
                    --tag "tier-3" \
                    --tag "automated" \
                    --host "k8s-${HOSTNAME}"

                  echo "=== restic forget --prune ==="
                  # Per backup-and-dr.md tier-3: 365d + monthly-
                  # forever for personal+. Restic doesn't have a
                  # true "forever" knob; --keep-monthly 120 covers
                  # 10 years which is well past any retention
                  # commitment we'd realistically honor.
                  restic forget \
                    --prune \
                    --keep-daily 30 \
                    --keep-weekly 12 \
                    --keep-monthly 120 \
                    --keep-yearly 10 \
                    --keep-tag preserve

                  echo "=== restic snapshots (last 5) ==="
                  restic snapshots --compact | tail -10
              env:
                - name: HOME
                  value: /tmp  # restic uses ~/.cache; readOnlyRootFilesystem requires writable HOME
              envFrom:
                - secretRef:
                    name: hetzner-sb-creds
              volumeMounts:
                - name: staging
                  mountPath: /staging
                  readOnly: true
                - name: restic-secrets
                  mountPath: /restic-secrets
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 2Gi
          volumes:
            - name: staging
              persistentVolumeClaim:
                claimName: restic-staging
            - name: restic-secrets
              secret:
                secretName: restic-tier-3-password
                defaultMode: 0400
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
