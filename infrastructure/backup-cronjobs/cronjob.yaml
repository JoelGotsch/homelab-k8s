# Restic CronJob: MinIO buckets → Hetzner Storage Box (tier-3).
#
# Per backup-and-dr.md §Cluster Longhorn volumes (PVCs) and
# §Postgres databases (CNPG): MinIO is the staging area;
# Restic replicates the bucket out to off-cluster storage with
# client-side encryption (operator's age-derived password,
# stored in OpenBao at kv/prod/restic/cluster-tier-3/password
# AND in the offline-recovery archive per ADR 0011).
#
# Sources mirrored: homelab-backups-cluster (CNPG WAL+base, ~120 MiB) +
# longhorn-backups (the SELECTIVE Longhorn volume backups).
#
# longhorn-backups was REMOVED on 2026-07-15 because it held ~7.8 TB (the old
# blanket backup-daily backed up ALL ~54 volumes at retain 90) — impossible to
# stage into the 50 GB restic-staging PVC. RE-ADDED 2026-07-16 (A6): once
# backup-daily was made opt-in (infrastructure/longhorn/recurring-jobs.yaml,
# `backup` group, 6 unique-data volumes, retain 14) and the old backups were
# pruned (A5), the bucket holds only ~a few GB — well within the staging PVC.
# So the bucket is now selective by construction: mirroring the whole thing =
# mirroring exactly the offsite-worthy set (vaultwarden-data, gitea repos,
# signal session, paperless-data, ntfy, nextcloud datadirectory+config).
# DEPENDS ON A5 having drained — if the prune isn't complete, the bucket is
# still large and staging will fill; A5 finishes hours before this 02:15 run.
# NOT loki-chunks — Loki retention is its own concern; loss of Loki history is
# acceptable per [ADR 0021].
#
# Tier-2 (friend's NAS) is a sibling CronJob, not a step in
# this one — friend's NAS hardware ship is the trigger to add
# `cronjob-friends-nas.yaml`. Independent failure modes; one
# can run without the other.
#
# Schedule: 02:00 UTC daily. After Longhorn nightly snapshot
# (~01:00 UTC), before OpenBao raft snapshot (03:00 UTC) — no
# hard ordering, but spreads I/O.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-minio-to-hetzner
  namespace: backup-cronjobs
  labels:
    app.kubernetes.io/name: restic-tier-3
    app.kubernetes.io/component: backup-pipeline
spec:
  # Schedule: 02:15 UTC daily. Per 2026-06-09 OOM-cascade RCA
  # §"Recommended fixes" #3 (commit 1b405df) the backup-cronjob slot
  # within the staggered hour-offset allocation is `:15`. Original
  # `0 2 * * *` collided with every other on-the-hour job.
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid  # never overlap; missed run skipped
  startingDeadlineSeconds: 3600  # if scheduler is late >1h, skip
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1  # one retry on failure; alert fires past that
      activeDeadlineSeconds: 21600  # 6h hard cap
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restic-tier-3
            # backup-cronjobs-allow NetPol matches pods by
            # `app.kubernetes.io/component: backup-pipeline`.
            # Without this label the restic pod falls through to
            # the namespace-wide default-deny — verified 2026-07-11:
            # mc init container timed out on
            # `dial tcp: lookup minio.minio-on-nas...: i/o timeout`.
            app.kubernetes.io/component: backup-pipeline
        spec:
          restartPolicy: Never
          # ndots:1 for the musl resolver in the restic image. restic's sftp
          # backend shells out to `ssh` (a C/musl binary, unlike the Go
          # binaries mc/restic which have their own resolver). Under the
          # default ndots:5, musl prepends the cluster search domains to the
          # external storage-box FQDN and returns EAI_AGAIN
          # ("Could not resolve hostname ...: Try again"), so repo init
          # never reached Hetzner. ndots:1 makes the 2-dot FQDN resolve
          # directly. CLAUDE.md rule 27 / known-caveat 2026-06-06. Fixed
          # 2026-07-15. (mc still resolves the cluster FQDN fine — Go
          # resolver, and the FQDN has >=1 dot so ndots:1 is a no-op for it.)
          dnsConfig:
            options:
              - name: ndots
                value: "1"
              - name: single-request-reopen
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          # InitContainer mirrors MinIO buckets to the staging
          # PVC. Splits cleanly from the backup step so a mirror
          # failure surfaces in init, not as a confused "Restic
          # backed up an empty dir."
          initContainers:
            - name: mirror-minio
              # Pulled from the Forgejo Packages mirror (ADR 0035 D2)
              # rather than docker.io to close the upstream-registry
              # single-point-of-failure for the tier-2/3 replication
              # path. See platform/forgejo/README.md §"First-party
              # image pulls" for the registry-homelab-internal-pull
              # Secret + default-SA pull-cred wiring.
              # Tag preserved for Renovate tracking; @sha256 digest
              # appended for kubelet integrity check + Kyverno enforce
              # allowlist on this namespace (see 04-guides/digest-pin-
              # enforce-allowlist.md). Renovate bumps both tag AND
              # digest atomically via `pinDigests: true`.
              # FORGEJO-served digest (NOT upstream). Forgejo
              # Packages re-wraps manifests on push; the served
              # digest differs from quay/dockerhub. See
              # minio-on-nas/values.yaml for the curl recipe.
              # Digest UPDATED 2026-06-27 — fresh `crane copy` mirror
              # preserves upstream digest (was previously re-wrapped by
              # `mc mirror`). See minio-on-nas/values.yaml comment.
              image: registry.homelab.internal/ci-packages/mc:RELEASE.2025-04-08T15-39-49Z@sha256:7e3efb09c22c0882fbf341b9d99f61f94ae6c4c20a06f2f1a2b20ea8993d8952
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # Configure mc against in-cluster MinIO.
                  mc alias set src \
                    http://minio.minio-on-nas.svc.cluster.local:9000 \
                    "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"

                  BUCKETS="homelab-backups-cluster longhorn-backups"
                  # Prune staging dirs for buckets no longer mirrored, so
                  # restic never ships stale data and the PVC can't fill
                  # with an orphaned tree. `mc mirror --remove` only syncs
                  # deletions WITHIN each mirrored bucket, not across
                  # removed buckets — so when longhorn-backups was dropped
                  # (2026-07-15) its ~partial staging tree would otherwise
                  # linger. Self-healing: rm any /staging/<dir> not in
                  # $BUCKETS (frees space before the mirror runs).
                  for d in /staging/*/; do
                    [ -e "$d" ] || continue
                    b=$(basename "$d")
                    case " $BUCKETS " in
                      *" $b "*) ;;
                      *) echo "=== pruning orphaned staging dir: $b ==="; rm -rf "$d" ;;
                    esac
                  done
                  # Mirror in incremental mode — `mc mirror` compares object
                  # metadata and skips unchanged. --remove syncs deletions
                  # so the staging tree matches the bucket exactly.
                  for bucket in $BUCKETS; do
                    echo "=== mirror src/$bucket → /staging/$bucket ==="
                    mkdir -p "/staging/$bucket"
                    mc mirror --remove --overwrite \
                      "src/$bucket" "/staging/$bucket"
                  done
                  echo "=== mirror complete: $(du -sh /staging | cut -f1) staged ==="
              env:
                # `mc` writes its config on first `alias set`. With
                # readOnlyRootFilesystem it can't create the default
                # $HOME/.mc (HOME unset → /.mc) and died every run with
                # "mkdir /.mc: read-only file system" — so this init
                # NEVER succeeded and tier-3 has never backed up in 45d
                # (status.lastSuccessfulTime empty). Point mc at the
                # writable in-memory `tmp` volume instead. (CLAUDE.md /
                # misc.md: "mc in PSS-restricted pods needs a writable
                # config dir".) Fixed 2026-07-09.
                - name: MC_CONFIG_DIR
                  value: /tmp/mc
              envFrom:
                - secretRef:
                    name: minio-reader-creds
              volumeMounts:
                - name: staging
                  mountPath: /staging
                # Shared with the restic container; the only writable
                # path under readOnlyRootFilesystem. Holds mc's config.
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          containers:
            - name: restic
              # NOTE: restic/restic is pulled from Docker Hub (not
              # mirrored to first-party yet — see #69 / journal
              # 2026-04-29-restic-tier-3-cronjob.md). Digest pin
              # gives us integrity even without the mirror.
              image: restic/restic:0.17.3@sha256:8f5a62b422a2cb1277ea0dd6e826fe1acf649e5b9f02d60e5268d5fd1976255a
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # Stage SSH key + known_hosts for the SFTP backend.
                  mkdir -p /tmp/.ssh
                  echo "$SSH_KEY" > /tmp/.ssh/id_ed25519
                  chmod 600 /tmp/.ssh/id_ed25519

                  # Host-key trust: pinned from the restic-known-hosts
                  # ConfigMap — PUBLIC host keys verified by ssh-keyscan +
                  # fingerprint on 2026-07-15. This SUPERSEDES the OpenBao
                  # SSH_KNOWN_HOST env (still projected but unused): that
                  # value was stale/incomplete and did not include the
                  # ed25519 key the box presents, so ssh failed "Host key
                  # verification failed" and tier-3 repo init never
                  # completed. Public host keys belong in versioned config,
                  # not the secret store. Copied to a writable path so ssh
                  # (which may append on key rotation) doesn't hit the RO
                  # mount. To rotate: re-keyscan the box, update the
                  # ConfigMap.
                  cp /etc/restic-ssh/known_hosts /tmp/.ssh/known_hosts
                  chmod 600 /tmp/.ssh/known_hosts

                  export RESTIC_REPOSITORY="sftp:${HSB_USER}@${HSB_HOST}:/cluster-backups-tier-3"
                  export RESTIC_PASSWORD_FILE=/restic-secrets/password
                  export RESTIC_PROGRESS_FPS=0
                  # Restic invokes ssh internally; point it at our keypair.
                  export RESTIC_SFTP_COMMAND="ssh -i /tmp/.ssh/id_ed25519 -o UserKnownHostsFile=/tmp/.ssh/known_hosts -o BatchMode=yes -p ${HSB_PORT:-23} ${HSB_USER}@${HSB_HOST} -s sftp"

                  # SINGLE SFTP connection. Hetzner Storage Boxes corrupt
                  # data under concurrent SFTP (restic's default is 5
                  # connections) — the symptom was intermittent
                  # "config or key ... damaged: ciphertext verification
                  # failed" on small files, with the failure point moving
                  # between runs (a full 6.3 GiB backup succeeded once, then
                  # the next run failed opening the repo). Serializing to
                  # sftp.connections=1 is the documented fix; slower but the
                  # nightly window tolerates it. Applied to EVERY restic
                  # call. (2026-07-15)
                  RESTIC_OPTS="-o sftp.connections=1"

                  # Initialize on first run; idempotent on
                  # existing repo (returns "already initialized").
                  if ! restic $RESTIC_OPTS snapshots --no-lock --quiet >/dev/null 2>&1; then
                    echo "=== initializing restic repo ==="
                    restic $RESTIC_OPTS init
                  fi

                  # Clear stale locks before touching the repo. A one-off verify
                  # pod deleted mid-run left a stale lock that failed BOTH lanes'
                  # forget/prune on 2026-07-17. Safe against the other lane: a
                  # live restic process refreshes its lock every ~5 min, and
                  # `unlock` only removes locks older than 30 min (stale).
                  echo "=== restic unlock (stale locks only) ==="
                  restic $RESTIC_OPTS unlock

                  echo "=== restic backup /staging ==="
                  # STABLE --host (was k8s-${HOSTNAME} = the per-run pod name).
                  # A unique host per snapshot meant (a) no parent snapshot was
                  # ever found, so every run rescanned everything, and (b) the
                  # forget below — default grouping host+paths — put each
                  # snapshot in its own group and kept it as "most recent
                  # daily" FOREVER: GFS retention was a silent no-op for this
                  # lane (found 2026-07-17).
                  restic $RESTIC_OPTS backup /staging \
                    --tag "tier-3" \
                    --tag "automated" \
                    --host "k8s-restic-tier-3"

                  echo "=== restic forget --prune (cluster lane only) ==="
                  # --tag tier-3 SCOPES this forget to the cluster lane. The
                  # repo is now shared with the NAS-personal job (Workstream C,
                  # one-repo class-tagged design), whose snapshots carry
                  # `nas-personal` (not `tier-3`). Without this filter, forget
                  # groups by host+paths across the WHOLE repo and would prune
                  # the NAS lane with this policy, fighting that job's per-class
                  # retention. `--prune` is still repo-global (safe: it only
                  # drops data unreferenced by ANY surviving snapshot).
                  # BOUNDED GFS for the whole cluster lane (Workstream E,
                  # 2026-07-16). Was 30/12/120/10 — the keep-monthly 120 kept
                  # 10 YEARS of monthly whole-/staging snapshots ("monthly
                  # forever"). Replaced with the `secret`-class GFS (14/8/12/3)
                  # applied to the ENTIRE lane.
                  #
                  # Why one policy, not true per-class: the /staging tree mixes
                  # classes WITHIN each daily snapshot (cnpg/<app> spans
                  # secret/personal/internal; longhorn-backups are hash-named
                  # PVCs). Per-class would require splitting the backup into
                  # per-app/per-volume calls with a class map maintained in this
                  # shell — fragile, and duplicating the data-class labels +
                  # label-backup-volumes.sh. The lane is tiny (~120 MiB + 8
                  # small volumes) and dedup'd, so retention DEPTH has
                  # negligible space cost; using the MOST-conservative class
                  # (secret) means nothing here is under-retained. The
                  # NAS-personal lane, whose shares ARE cleanly class-separated,
                  # keeps true per-class GFS. Revisit at the Sept backup review
                  # if the cluster-lane footprint ever justifies the split.
                  # --group-by paths: ignore host when grouping, so the legacy
                  # k8s-<pod-name> snapshots land in the same GFS group as new
                  # k8s-restic-tier-3 ones and retention finally applies to
                  # them (everything in this lane shares the /staging path).
                  #
                  # sftp.connections=2 (NOT $RESTIC_OPTS): restic 0.17 refuses
                  # the prune phase with a connection limit of one ("prune
                  # requires a backend connection limit of at least two").
                  # This lane never tripped it only because the old per-pod
                  # --host made forget a no-op, so prune was always skipped.
                  # 2 is restic's minimum; backup keeps sftp.connections=1
                  # where the Hetzner concurrent-SFTP corruption was observed.
                  restic -o sftp.connections=2 forget \
                    --prune \
                    --tag tier-3 \
                    --group-by paths \
                    --keep-daily 14 \
                    --keep-weekly 8 \
                    --keep-monthly 12 \
                    --keep-yearly 3 \
                    --keep-tag preserve

                  echo "=== restic snapshots (last 5) ==="
                  restic $RESTIC_OPTS snapshots --compact | tail -10
              env:
                - name: HOME
                  value: /tmp  # restic uses ~/.cache; readOnlyRootFilesystem requires writable HOME
              envFrom:
                - secretRef:
                    name: hetzner-sb-creds
              volumeMounts:
                - name: staging
                  mountPath: /staging
                  readOnly: true
                - name: restic-secrets
                  mountPath: /restic-secrets
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                # Give ssh (restic's sftp backend) a passwd/group entry for
                # uid 1000 — see restic-passwd-configmap.yaml.
                - name: restic-passwd
                  mountPath: /etc/passwd
                  subPath: passwd
                  readOnly: true
                - name: restic-passwd
                  mountPath: /etc/group
                  subPath: group
                  readOnly: true
                # Pinned Hetzner Storage Box host keys — restic-known-hosts-configmap.yaml
                - name: restic-known-hosts
                  mountPath: /etc/restic-ssh
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 2Gi
          volumes:
            - name: staging
              persistentVolumeClaim:
                claimName: restic-staging
            - name: restic-secrets
              secret:
                secretName: restic-tier-3-password
                defaultMode: 0400
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
            - name: restic-passwd
              configMap:
                name: restic-passwd
            - name: restic-known-hosts
              configMap:
                name: restic-known-hosts
