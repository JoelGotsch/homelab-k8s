# Staging PVC for Restic mirror+backup pipeline.
#
# `mc mirror` copies the MinIO bucket(s) here; Restic then
# backs up the directory tree. PVC persists across CronJob
# runs — `mc mirror` (default mode) compares destination
# state to skip re-copying unchanged objects, so only new /
# changed bucket content is transferred each run. Without
# persistence, every run would re-mirror the entire bucket.
#
# Sizing: starts conservative. Operator resizes (Longhorn
# allows online resize) as cluster backup volume grows. The
# alert in cronjob.yaml fires if `mc mirror` cannot complete
# within the timeout — surface for size review.
#
# 50Gi→80Gi 2026-07-30: ENOSPC broke the tier-3 lane. The
# backup-group store's steady state is base (~30Gi, dominated
# by Langfuse ClickHouse's ~24Gi volume) + 14-day retention ×
# ~2Gi/day block churn (ClickHouse part merges rewrite blocks
# daily even when logical growth is small) ≈ 55-60Gi. 80Gi
# gives mirror headroom; the >80% PrometheusRule stays the
# early-warning signal (it is %-based, no threshold edit).
#
# 80Gi→150Gi 2026-08-29: ENOSPC again, three consecutive
# nights. The 2026-07-30 model sized this volume from the
# longhorn-backups lane ALONE and carried cronjob.yaml's
# "~120 MiB" figure for CNPG. That figure is wrong by three
# orders of magnitude: CNPG is 61Gi of the 79Gi in use, and
# the longhorn lane came in UNDER budget at 19Gi. So the lane
# that was modelled is fine and the lane that was assumed
# negligible is the whole problem.
#
# Barman retention is NOT the fault and was verified healthy:
# the 30d clusters prune exactly on time (forgejo, crowdsec,
# llm-gateway all hold oldest base = 2026-07-30). The 90d
# clusters are only ~45 days old, so they are at roughly HALF
# their eventual footprint and this volume would have filled
# on the current design with no new app added.
#
# Measured daily accrual (per-cluster base size × 1/day, plus
# WAL rate) and the resulting 90d steady state:
#   conversation-history  1249 MiB/d  → ~110Gi   (see below)
#   immich                 652 MiB/d  →  ~57Gi
#   authentik              291 MiB/d  →  ~26Gi
#   nextcloud              118 MiB/d  →  ~10Gi
#   all other CNPG          ~40 MiB/d →   ~6Gi
#   longhorn-backups (retain 14, at steady state) ~19Gi
# True steady state is therefore ~230Gi, NOT 150Gi. 150Gi is
# a deliberate ~4-week unblock, not the end state, because two
# open decisions can each remove a large share of that number:
#   1. conversation-history emits 1016 MiB/day of WAL against
#      a 233 MiB base — ~4x its own size, daily. That is a
#      churn defect to diagnose, not capacity to buy. It is
#      48% of the projected total.
#   2. Whether `personal`/`secret` need 90-day PITR at tier-1
#      at all, given tier-2/3 already hold GFS copies out to
#      years (backup-and-dr.md §Retention schedules). 90d→30d
#      on the WAL-heavy clusters takes ~230Gi to ~75Gi. That
#      is a posture call and is the operator's, not a resize.
# Revisit this number once both are settled; do not keep
# growing the volume in place of answering them.
#
# Storage class: longhorn-replica1 — this PVC's contents are
# disposable (re-derivable from MinIO). Replica1 keeps cluster
# storage usage tight.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restic-staging
  namespace: backup-cronjobs
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-replica1
  resources:
    requests:
      storage: 150Gi
