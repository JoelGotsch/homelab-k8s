# Read-only source PVCs for the NAS personal+ offsite backup (Workstream C).
#
# THESE MOUNT THE SHARE ROOT ON PURPOSE. That is the whole design: restic backs
# up by path, so a root mount covers every dataset on the share — including
# datasets added after this file was last edited. Do not "fix" them to match the
# per-dataset subpaths used everywhere else. Give these six their own
# subdirectories and the restic job keeps completing successfully while backing
# up empty directories: a silent failure that stays invisible until a restore.
#
# ── 2026-08-15, ADR 0051 ─────────────────────────────────────────────────────
# Share-root mounting used to be the behaviour of EVERY PVC on a `nas-crypt-*`
# class, because every class carried remotePath="" (verified 2026-07-16 via the
# immich PV volumeHandle). That was a trap for everyone else — a scratch PVC on
# `nas-crypt-internal-archive` landed inside conversation-history's live vault
# and a cleanup `rm` deleted its ledger files. Applications are now pinned to
# named subdirectories by static PVs in `infrastructure/csi-rclone/
# persistentvolumes.yaml`, and the classes park accidental dynamic provisions in
# `_unallocated/`.
#
# So what used to be the default is now a DELIBERATE, DECLARED EXCEPTION held by
# exactly these six volumes. Each is a static PV labelled
# `homelab.internal/component: backup-source` — the label is what
# `scripts/check-nas-crypt-dataset-paths.sh` accepts as "this empty remotePath
# is intentional". An unlabelled share-root PV now fails pre-commit.
#
# csi-rclone decrypts on the node (crypt key stays on the node, not in this
# pod); the backup pod reads PLAINTEXT and restic re-encrypts to Hetzner
# (operator decision 2026-07-16).
#
# accessMode ReadWriteMany matches the proven SC behaviour (the apps bind RWX;
# ROX provisioning on csi-rclone is unproven and would risk failing at Argo).
# The CronJob mounts every one of these `readOnly: true`, so the backup can
# never write to the NAS — RWX here is a provisioning detail, not write intent.
#
# reclaimPolicy Retain is harmless: these are mount handles over a pre-existing
# share, so a deleted PVC leaves only a Released PV with no underlying storage
# to leak. Nominal 1Gi request — rclone ignores capacity entirely (the mount
# shows the whole share, 56 TB of it).
#
# NOT included: nas-crypt-registry-blobs (Forgejo container registry — the
# blobs are regenerable/re-pushable images; snapshot-only). Add here if that
# assumption changes. Re-affirmed rather than inherited on 2026-08-15, and now
# annotated on the PV itself so the omission is visible at the object rather
# than only in this header.
#
# MIGRATION NOTE (ADR 0051): these six still bind dynamically. Their cutover is
# the cheapest of the eight — the new static PV mounts the same share root, so
# there is no data to move, only a delete-and-recreate of the PVC with
# `volumeName` set. See the runbook.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-src-personal-photos
  namespace: backup-cronjobs
  labels: { app.kubernetes.io/component: backup-pipeline, homelab.internal/data-class: personal }
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nas-crypt-personal-photos
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-src-personal-files
  namespace: backup-cronjobs
  labels: { app.kubernetes.io/component: backup-pipeline, homelab.internal/data-class: personal }
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nas-crypt-personal-files
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-src-family-shared
  namespace: backup-cronjobs
  labels: { app.kubernetes.io/component: backup-pipeline, homelab.internal/data-class: personal }
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nas-crypt-family-shared
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-src-personal-documents
  namespace: backup-cronjobs
  labels: { app.kubernetes.io/component: backup-pipeline, homelab.internal/data-class: personal }
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nas-crypt-personal-documents
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-src-internal-archive
  namespace: backup-cronjobs
  labels: { app.kubernetes.io/component: backup-pipeline, homelab.internal/data-class: internal }
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nas-crypt-internal-archive
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-src-forgejo-lfs
  namespace: backup-cronjobs
  labels: { app.kubernetes.io/component: backup-pipeline, homelab.internal/data-class: internal }
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nas-crypt-forgejo-lfs
  resources: { requests: { storage: 1Gi } }
# NOTE: jellyfin media (internal-media) is NOT here. Verification (2026-07-16)
# found the library is 7.8 TB — too big for the tier-3 Hetzner repo — so its
# offsite backup is DEFERRED to the September review and will likely be a
# separate rclone→cold-storage lane (restic is broken on Glacier tiers), not an
# NFS PVC in this job. See TODO "jellyfin media (7.8 TB) offsite". Its static NFS
# PV would live at /volume1/docker/media-center/media (server 10.10.40.2) if
# ever revived here.
