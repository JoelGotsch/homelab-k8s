# NetworkPolicies for cloudflared.
#
# Ingress: ONLY Prometheus scrape on metrics port. cloudflared
# is an outbound-connect-only daemon; no cluster workload
# reaches it inbound.
#
# Egress: kube-DNS + upstream Services named in configmap.yaml.
# The Cloudflare-edge egress (entities: world) is intentionally
# NOT in this manifest — `toEntities` is a Cilium-only field
# and was rejected by the standard NetworkPolicy schema
# (kube-api: ".spec.egress[1].toEntities: field not declared
# in schema"). Argo wedged here for ~9 days. The edge egress
# now lives in ciliumnetworkpolicy.yaml as a CiliumNetworkPolicy
# (additive — Cilium ORs the allow set across both policies).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared
  namespace: cloudflare-tunnel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  policyTypes: [Ingress, Egress]
  ingress:
    # Prometheus scrape on metrics port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 2000
          protocol: TCP
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Cloudflare edge egress now lives in ciliumnetworkpolicy.yaml
    # (the toEntities rule that was here violated the K8s NP schema).
    # Upstream Services routed by config.yaml's ingress
    # rules. Each one needs an explicit allow.
    # IMPORTANT (per feedback_gateway_500_503_triage):
    # Cilium evaluates NetworkPolicy `ports` against POD ports
    # (post-DNAT), not Service ports. For each upstream below,
    # the value here MUST be the targetPort (container port),
    # NOT the Service port that configmap.yaml routes to. Use
    # `kubectl get svc -o jsonpath` to read targetPort if unsure.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vaultwarden
      ports:
        - port: 8080      # vaultwarden Service :80 → pod :8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jellyfin
      ports:
        - port: 8096      # jellyfin Service :8096 → pod :8096
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: immich-public-proxy
      ports:
        - port: 3000      # immich-public-proxy Service :3000 → pod :3000
          protocol: TCP
    # When new tunnel-routed services land:
    #  1. Add an `ingress:` rule in configmap.yaml
    #  2. Add an egress rule here matching the upstream ns + port
    #  3. Add an ingress allow in the upstream service's NP
    # - to:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: ntfy-e2ee-relay
    #   ports:
    #     - port: 80
    #       protocol: TCP
