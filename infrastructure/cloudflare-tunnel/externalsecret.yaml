# Tunnel credentials from OpenBao.
#
# `cloudflared tunnel create <name>` (run by operator on Tier
# A workstation, one-time pre-bring-up) produces:
#   ~/.cloudflared/<TUNNEL-UUID>.json
# containing AccountTag + TunnelID + TunnelSecret.
#
# That file's contents — verbatim JSON — go into OpenBao at
# kv/cloudflare/tunnel/credentials.json. The ESO below
# projects it as a Secret which the cloudflared pod mounts
# at /etc/cloudflared/credentials.json.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflared-credentials
  namespace: cloudflare-tunnel
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cloudflared-credentials
    creationPolicy: Owner
  data:
    - secretKey: credentials.json
      remoteRef:
        key: cloudflare/tunnel
        property: credentials_json
