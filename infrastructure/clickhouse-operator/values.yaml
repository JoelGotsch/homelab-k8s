# Altinity ClickHouse Operator chart values.
# Per ADR 0028.

# Operator runs cluster-wide (watches ClickHouseInstallation
# CRs in any namespace). Same pattern as CNPG.
operator:
  image:
    repository: altinity/clickhouse-operator
    tag: "0.26.3"  # OPERATOR PINS via Renovate
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # Namespaces the operator watches for ClickHouseInstallation CRs.
  # EMPIRICALLY (2026-05-29): with no WATCH_NAMESPACES and an empty config
  # `watch.namespaces: []`, this operator (0.26.3) watched ONLY its own
  # namespace — a CHI in clickhouse-operator was reconciled in 5s, but the
  # `langfuse` CHI sat untouched for 5 days (no finalizer, 0 operator-log
  # mentions). The docs claim "empty = all namespaces" but that did not hold
  # here. So we set WATCH_NAMESPACES explicitly. `operator.env` is the chart's
  # supported passthrough to the operator container.
  # NOTE: any FUTURE app that ships a ClickHouseInstallation must add its
  # namespace to this comma-separated list (until all-namespace watch is sorted).
  env:
    - name: WATCH_NAMESPACES
      value: "langfuse,clickhouse-operator"

# metrics-exporter sidecar — ships ClickHouse cluster metrics
# to Prometheus. ServiceMonitor wired separately if needed;
# operator itself runs in clickhouse-operator ns and per-app
# ServiceMonitor lives in the consumer's layer.
metrics:
  image:
    repository: altinity/metrics-exporter
    tag: "0.26.3"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

# RBAC — cluster-level Roles/Bindings so the operator can act on CHIs in
# OTHER namespaces (e.g. langfuse). The chart key is `rbac.namespaceScoped`
# (bool; false = cluster-level). The previous `rbac.scope:
# namespace_clusterwide` was NOT a chart key → silently ignored (it happened
# to still render ClusterRole via the default, but the value was dead). Watch
# SCOPE is controlled by WATCH_NAMESPACES under operator.env above, not here.
rbac:
  create: true
  namespaceScoped: false

# Pod security — operator + metrics-exporter both run as
# non-root.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
