# Dedicated namespace for the Altinity ClickHouse Operator.
#
# The operator watches ClickHouseInstallation CRs cluster-wide
# but its own pods + RBAC live here.

apiVersion: v1
kind: Namespace
metadata:
  name: clickhouse-operator
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # ADR 0036 D4 — infrastructure-tier operator; classified as
    # `internal`. Per-app ClickHouseInstallation CRs land in the
    # consuming app's own namespace.
    homelab.internal/first-party: "true"
    homelab.internal/data-class: internal
