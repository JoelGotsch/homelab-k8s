apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
- name: longhorn
  # ADR 0052 D3: chart from the Forgejo Packages mirror (was https://charts.longhorn.io).
  repo: oci://registry.homelab.internal/homelab

  version: 1.11.3
  releaseName: longhorn
  namespace: longhorn-system
  valuesFile: values.yaml
  includeCRDs: true
resources:
- namespace.yaml
- storageclasses.yaml
- externalsecret.yaml
- recurring-jobs.yaml

# Post-render patch: Longhorn chart 1.7.2 does not expose a
# `longhornManager.resources` values key (only `log`, `priorityClass`,
# `tolerations`, `nodeSelector`, `serviceAnnotations`). The longhorn-
# manager DaemonSet ships with `resources: {}` — no requests, no
# limits — which makes it the largest cgroup victim for Talos's node
# OOM-controller under memory pressure. Cascade #1–#4 in
# 99-journal/2026-06-09-recurring-worker-cascades.md (commit 1b405df)
# all start with the manager dying mid-reconcile, taking VAs with it.
#
# Targets — limit bumped 2026-06-25 after a separate failure mode
# from cascade #1-#4. Original #34 fix targeted Talos OOMController
# kills under node-wide pressure (largest cgroup victim). New failure
# mode 2026-06-25: per-pod cgroup OOMKilled (exit 137) on worker2
# (89 replicas) + worker3 (47 replicas) every ~2-3 min, while worker1
# (70 replicas) is stable. Manager memory profile correlates loosely
# with on-node replica count + concurrent reconcile work; the 1 GiB
# cap from #34 was tuned to steady-state RSS (~80 MB) but doesn't
# tolerate the worst-case reconcile spike actually observed on the
# higher-replica nodes.
#
# 2026-06-26 #35 baseline showed dfb4q (worker2, 89 replicas) at
# 1916 MB out of the 2 GiB cap — within 6% of the ceiling at
# steady state. By 2026-06-28 the OOM-loop got worse: worker2's
# longhorn-manager at 545 restarts in 3d, worker3's at 537.
# Side-effect: volumes stuck in mid-attach state, blocking
# Woodpecker step PVCs and breaking CI rolls.
#
# Bumping to 4Gi based on:
#   - Worker2's working-set was 1916 MB steady state + spikes;
#     4 GiB doubles the headroom and rides through the spike
#     plus snapshot-purge bursts.
#   - 4 GiB is 12.7% of a 31 GB worker — well under any node-
#     OOM threshold. Talos OOMController triggers at ~85%
#     node-mem; longhorn-manager would have to misbehave a
#     LOT to threaten that.
#   - Request unchanged at 256 MiB — base load is small; the
#     larger limit only matters during reconcile spikes.
patches:
- target:
    kind: DaemonSet
    name: longhorn-manager
  patch: |-
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: longhorn-manager
    spec:
      template:
        spec:
          containers:
            - name: longhorn-manager
              resources:
                requests:
                  memory: 256Mi
                  cpu: 100m
                limits:
                  memory: 4Gi
# NOTE on fresh-install bootstrap:
# Earlier this dir carried `bootstrap-sa.yaml` to pre-create
# `longhorn-service-account` (+ ClusterRole/Binding) so the
# chart's pre-install hook Job could find the SA before the
# chart's own resources rendered. That worked for the initial
# install but caused kustomize 5+ to fail manifest generation
# with "id … exists; can not use behavior: unspecified" because
# the chart ALSO renders an SA + CR of the same name (resource
# collision between `helmCharts:` generator output and
# `resources:`). Argo went Sync=Unknown/Degraded as a result.
#
# Since the cluster is past first-install, the bootstrap is no
# longer required and has been removed. For a future fresh
# install, re-introduce the bootstrap via a SEPARATE Argo
# Application (sync-wave < -10) instead of bundling it here,
# so the kustomize generators never collide.
