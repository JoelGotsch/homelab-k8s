# Longhorn values per ADR 0016.

defaultSettings:
  defaultDataPath: /var/lib/longhorn
  defaultReplicaCount: 2  # ADR 0016 default
  storageMinimalAvailablePercentage: 10
  # ADR 0036 D7 — loosen from upstream default of 100 to 200.
  # Tripwire is the Prometheus 80%-of-ceiling alert (160% ratio),
  # not the ceiling itself. Prevents the accounting-axis stop-
  # bind failure mode that triggered the 2026-07-09 incident
  # (99.6% of schedulable capacity → SecretSyncedError cascade).
  storageOverProvisioningPercentage: 200
  # Prometheus scrape
  upgradeChecker: false
  # Engines do NOT auto-upgrade after a manager upgrade when this is
  # 0 (the 1.7.2-era live value) — every volume would stay on the old
  # engine image and the NEXT hop's pre-upgrade check would fail.
  # Docs-recommended value 3. Required for the 1.7.2→1.12.0 staged
  # chain (2026-07-17); harmless steady-state (only acts when a new
  # default engine image lands). Live upgrade of attached healthy v1
  # volumes is non-disruptive.
  concurrentAutomaticEngineUpgradePerNodeLimit: 3
  # 2026-07-21 worker1 hot-pull test: with the upstream default
  # (do-nothing), Kubernetes never force-deletes pods on an
  # unreachable node — StatefulSet pods (openbao-2, loki-0,
  # prometheus, *-pg-2, …) are never recreated and Deployment
  # replacements hang in ContainerCreating on Multi-Attach until
  # an operator applies the out-of-service taint. Longhorn only
  # acts here after its own node controller confirms the node
  # down AND the pod already has a deletionTimestamp, so this is
  # the guarded automated equivalent of the manual taint flow.
  # Drain-path safety is separately guarded by
  # nodeDrainPolicy=block-if-contains-last-replica (live default
  # we rely on; not overridden here) TOGETHER WITH the setting
  # below — see it for why the pair is required.
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  # 2026-08-31 worker2 drain: `kubectl drain` hung forever on
  #   Cannot evict pod as it would violate the pod's disruption budget
  # for instance-manager-c6333079c4a6a3743989dbb9574e3e84 (worker2's).
  #
  # Cause is the interaction of two things, neither wrong alone.
  # (1) Longhorn's backup-controller leaks one attachmentTicket per
  # backup and never reclaims it: measured 1182 orphaned tickets over
  # 40 volumes, ALL referencing a Backup CR that no longer exists. A
  # ticket holds its volume `attached`, which keeps a running engine
  # on that node. (2) syncInstanceManagerPDB
  # (instance_manager_controller.go:1032) removes a node's
  # instance-manager PDB ONLY when that node has zero running
  # engines — otherwise it logs "removing <node> PDB is blocked:
  # some volumes are still attached InstanceEngines count N …". A
  # drain normally reaches zero by evicting workload pods, which
  # detaches their volumes. A volume held by an orphaned ticket has
  # NO pod to evict, so its engine never stops and the PDB is never
  # released. backup-cronjobs/restic-staging was exactly that: a
  # disposable longhorn-replica1 volume nothing was reading, holding
  # the drain open indefinitely.
  #
  # NOTE: disruptionsAllowed=0 is NOT the signal — it is the steady
  # state (minAvailable:1 over a single pod) on every healthy worker.
  #
  # This setting is upstream's answer to exactly that: "Longhorn will
  # automatically detach volumes that are manually attached to the
  # nodes which are cordoned", whose stated purpose is to "prevent the
  # draining process stuck by the PDB of instance-manager which still
  # has running engine on the node" (longhorn.io/docs/1.11.3 settings
  # reference). "Manually attached" covers exactly our case: attached
  # with no csi-attacher ticket.
  #
  # It does NOT loosen nodeDrainPolicy — a volume with a live consumer
  # is untouched, and last-replica protection still blocks a drain that
  # would strand real data. It only releases volumes nothing is using,
  # on a node the operator has already cordoned. Keep both keys.
  detachManuallyAttachedVolumesWhenCordoned: true

# Backup target: MinIO-on-NAS `longhorn-backups` bucket per
# ADR 0016 D4 + ADR 0006 (warm tier). Restic CronJob at
# `infrastructure/backup-cronjobs/` mirrors this bucket
# nightly to tier-2 (friend's NAS) + tier-3 (Hetzner SB).
# Credentials supplied via ESO — see externalsecret.yaml
# (Secret keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# AWS_ENDPOINTS). MinIO is path-style, default region
# us-east-1.
#
# Chart ≥1.8 removed defaultSettings.backupTarget/
# backupTargetCredentialSecret in favor of this top-level block
# (multi-backupstore support; renders into the
# longhorn-default-resource ConfigMap feeding the default
# BackupTarget CR — the live CR already carries these exact
# values, so this is a handover, not a change).
defaultBackupStore:
  backupTarget: "s3://longhorn-backups@us-east-1/"
  backupTargetCredentialSecret: "longhorn-minio-credentials"

persistence:
  defaultClass: false  # we install non-default classes per ADR 0016
  defaultClassReplicaCount: 2

# ADR 0036 D7 — enable Prometheus scrape of Longhorn metrics so
# the schedulable-headroom alert (80% of storageOverProvisioning-
# Percentage) has a metric to fire against.
metrics:
  serviceMonitor:
    enabled: true
    # REQUIRED for the scrape to actually happen: the
    # kube-prometheus-stack Prometheus selects ServiceMonitors
    # by `release: kube-prometheus-stack` (serviceMonitorSelector,
    # verified against the live Prometheus CR 2026-07-22). The
    # chart-rendered ServiceMonitor carries only chart-default
    # labels, so despite `enabled: true` Longhorn-native metrics
    # were never scraped and every `METRIC SOURCE: longhorn` rule
    # in observability/kube-prometheus-stack/rules-longhorn.yaml
    # was silently dead (empty vector, no error).
    additionalLabels:
      release: kube-prometheus-stack

# Resource limits — Longhorn is per-node DaemonSet.
# CSI sidecars: chart 1.7.2 does NOT expose per-container
# resource keys under `csi:` (only replica counts). CSI-plugin
# sidecar resources are patched via `kustomization.yaml`
# strategic-merge patches (see below) to satisfy ADR 0036 D3
# `homelab-container-resources-required`.
csi:
  attacherReplicaCount: 2
  provisionerReplicaCount: 2
  resizerReplicaCount: 2
  snapshotterReplicaCount: 2

# Per 2026-06-09 OOM-cascade RCA
# (homelab-docs/99-journal/2026-06-09-recurring-worker-cascades.md, commit
# 1b405df): elevate longhorn-manager from the chart's `longhorn-critical`
# PriorityClass to the built-in `system-node-critical`. Even when a worker
# crosses Talos's node-OOM threshold, the controller should pick
# instance-managers or app pods first — never the per-node manager whose
# loss tears down every VolumeAttachment on the node.
#
# Resource requests + limits for the longhorn-manager DaemonSet are NOT
# exposed by chart 1.7.2's `longhornManager` values key (only `log`,
# `priorityClass`, `tolerations`, `nodeSelector`, `serviceAnnotations`);
# they are applied via a kustomize JSON-strategic-merge patch in
# `kustomization.yaml`.
longhornManager:
  priorityClass: system-node-critical
