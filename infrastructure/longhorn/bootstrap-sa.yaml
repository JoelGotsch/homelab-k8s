# Chicken-and-egg workaround: the chart's pre-install hook
# (`longhorn-pre-upgrade` Job) runs BEFORE the chart applies
# its main resources, but it requires the
# `longhorn-service-account` ServiceAccount which IS one of
# the chart's main resources. On a fresh install this loops
# forever ("serviceaccount not found"); Argo CD then never
# proceeds past the hook.
#
# Pre-create the SA + minimal RBAC the hook needs (it inspects
# nodes/pods for compatibility checks — read-only). The chart
# will adopt these on its first sync since they have matching
# names + namespace; Argo's server-side-apply merges field
# ownership without conflict.
#
# Reference: https://github.com/longhorn/longhorn/issues — same
# pattern hit by every GitOps-driven first-install.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-service-account
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "-11"   # before chart sync-wave -10
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-service-account
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["longhorn.io"]
    resources: ["*"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-service-account-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
subjects:
  - kind: ServiceAccount
    name: longhorn-service-account
    namespace: longhorn-system
roleRef:
  kind: ClusterRole
  name: longhorn-service-account
  apiGroup: rbac.authorization.k8s.io
