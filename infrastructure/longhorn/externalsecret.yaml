# Longhorn → MinIO-on-NAS backup-target credentials.
# ESO projects `kv/longhorn/s3-creds` (MinIO svc-account scoped
# to the `longhorn-backups` bucket per minio-on-nas/README) into
# a Secret matching Longhorn's expected env-var keys.
#
# Per ADR 0016 D4 + backup-and-dr.md §"Cluster Longhorn volumes".
# values.yaml's `defaultSettings.backupTargetCredentialSecret`
# references this Secret by name.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: longhorn-minio-credentials
  namespace: longhorn-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: longhorn-minio-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        AWS_ACCESS_KEY_ID: "{{ .access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_access_key }}"
        AWS_ENDPOINTS: "http://minio.minio-on-nas.svc.cluster.local:9000"
  data:
    - secretKey: access_key_id
      remoteRef:
        key: longhorn/s3-creds
        property: access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: longhorn/s3-creds
        property: secret_access_key
