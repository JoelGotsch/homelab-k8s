# Longhorn RecurringJob CRs — class-aligned snapshot + backup
# cadence per backup-and-dr.md §"Retention schedules" + ADR 0016
# D4. Closes the snapshot-CR gap surfaced by
# 99-journal/2026-05-02-backup-topology-gap-check.md item 1.
#
# Volume opt-in: each PVC selects a class group via the label
# `recurring-job-group.longhorn.io/<group>: enabled`. Volumes
# without any recurring-job label join `default` (catch-all,
# conservative cadence). Volumes where a local snapshot cannot
# help a restore join `no-snapshot` instead and get none — see
# that group at the bottom of this file for who belongs there and
# how an existing volume moves. Every group, snapshot or not, is
# trimmed weekly.

# ─── default group: catch-all conservative ─────────────────
# Matches the `secret`/`personal` cadence (hourly × 7d). Volumes
# under this default get the strictest scheduled retention by
# default; class-aware groups below let internal / internal-media
# volumes reduce snapshot churn at the cost of fewer rollback
# points.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-default
  namespace: longhorn-system
spec:
  # `spec.name` is required by the Longhorn 1.7 admission validator
  # on CREATE (it's not auto-mutated from metadata.name pre-validation).
  # Existing CRs in-cluster have it filled by the mutator on the
  # post-validation path; new creates need it explicit. Same value
  # as metadata.name.
  name: snapshot-default
  # Hourly at :35 (offset within the hour per 2026-06-09 OOM-cascade
  # RCA §"Recommended fixes" #3 / commit 1b405df: Longhorn snapshot slot
  # of the staggered allocation, kept distinct from openbao :05,
  # backups :15 and snapshot-secret-personal :25). Spreads memory spikes
  # across the hour so no single minute trips the Talos node-OOM
  # threshold.
  cron: "35 * * * *"
  task: snapshot
  groups: [default]
  # ADR 0036 D6 — tighten default group to retain: 6 (6h rolling
  # window) from the previous 20. The `default` group is the
  # catch-all for un-labelled PVCs (mostly transient / rebuild-
  # able state); the 90-day daily backup below is the fallback
  # floor. Labelled workloads that need more history opt into an
  # explicit named group (`secret-personal` at 20, `internal` at
  # 42, `internal-media` at 7).
  #
  # Historical: reduced 2026-06-26 from 100 → 20 after #73/#74
  # CNPG-bloat incident. ADR 0036 tightens further — see the
  # ADR's D6 rationale.
  retain: 6
  concurrency: 4
  labels:
    homelab-class: catch-all
---
# ─── secret + personal explicit group ──────────────────────
# Same cadence as `default`, but explicit so an app can label
# its PVC `recurring-job-group.longhorn.io/secret-personal: enabled`
# to opt in deliberately rather than relying on the default
# (e.g., if a future class-default change shifts the catch-all).
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-secret-personal
  namespace: longhorn-system
spec:
  # `spec.name` required on create by Longhorn 1.7 validator — see
  # snapshot-default above for the explanation.
  name: snapshot-secret-personal
  # Hourly at :25 (offset within the hour per 2026-06-09 OOM-cascade
  # RCA §"Recommended fixes" #3 / commit 1b405df: snapshot-secret slot
  # of the staggered allocation, distinct from openbao :05, backups
  # :15 and snapshot-default :35).
  cron: "25 * * * *"
  task: snapshot
  groups: [secret-personal]
  # Mirrors snapshot-default's 2026-06-26 reduction (100 → 20)
  # so the secret-personal-class volumes follow the same retention
  # policy. See snapshot-default above for the full rationale.
  retain: 20
  concurrency: 4
  labels:
    homelab-class: secret-personal
---
# ─── internal class ────────────────────────────────────────
# 4-hourly snapshots × 7 days = 42 retain. Forgejo git data,
# CrowdSec metadata, llm-gateway budget tracking. Lower
# snapshot churn than secret/personal because RPO 4h is
# acceptable for these classes per backup-and-dr.md.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-internal
  namespace: longhorn-system
spec:
  # `spec.name` mirrors metadata.name (Longhorn 1.7 validator
  # requires it on create — see snapshot-default).
  name: snapshot-internal
  # Every 4 hours at :35 (offset within the hour per 2026-06-09 OOM-
  # cascade RCA §"Recommended fixes" #3 / commit 1b405df: Longhorn
  # slot of the staggered allocation; frequency unchanged).
  cron: "35 */4 * * *"
  task: snapshot
  groups: [internal]
  retain: 42                   # 6/day × 7 days
  concurrency: 4
  labels:
    homelab-class: internal
---
# ─── internal-media class ──────────────────────────────────
# Daily snapshots × 7 days. Jellyfin media libraries can be
# multi-TB; hourly snapshots would amplify storage pressure
# substantially. RPO 24h acceptable per backup-and-dr.md.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-internal-media
  namespace: longhorn-system
spec:
  # `spec.name` mirrors metadata.name (Longhorn 1.7 validator
  # requires it on create — see snapshot-default).
  name: snapshot-internal-media
  # Daily at 02:35 (off-peak, Longhorn slot of the staggered hour
  # allocation per 2026-06-09 OOM-cascade RCA §"Recommended fixes" #3
  # / commit 1b405df). Frequency unchanged.
  cron: "35 2 * * *"
  task: snapshot
  groups: [internal-media]
  retain: 7                    # 7 daily snapshots
  concurrency: 2
  labels:
    homelab-class: internal-media
---
# ─── volume-level backup to MinIO-on-NAS — OPT-IN ──────────
# Per ADR 0016 D4 + backup-and-dr.md §"Cluster Longhorn volumes":
# daily volume backup to NAS-MinIO `longhorn-backups` bucket; the
# Restic CronJob at `infrastructure/backup-cronjobs/` mirrors the
# backup-worthy prefixes to tier-3 (Hetzner Storage Box) offsite.
#
# ⚠ THIS JOB IS OPT-IN, NOT BLANKET (changed 2026-07-16). It targets
# the dedicated `backup` group, NOT `default`. Reason: it previously
# ran `groups: [default]` retain 90, which backed up ALL ~54 volumes
# daily and kept 90 copies each. That over-retention (a) bloated the
# NAS `longhorn-backups` bucket and (b) — when ephemeral volumes
# (ci-woodpecker CI PVCs, etc.) were deleted mid-backup — left
# thousands of orphaned `Pending` Backup CRs that OOM-crashlooped
# longhorn-manager (2026-07-16 incident; see TODO "Longhorn control-
# plane hygiene" + memory reference-longhorn-manager-oom-orphaned-
# backups). Making backup opt-in means only unique-data volumes are
# backed up, so deleting a regenerable/CI volume no longer orphans a
# backup CR.
#
# Membership: a volume joins via the label
# `recurring-job-group.longhorn.io/backup: enabled` (applied to the
# Longhorn Volume CR by scripts/label-backup-volumes.sh — Volume CRs
# are runtime objects, not GitOps). Snapshots are separate: a backup
# volume keeps its snapshot group for local CoW snapshots (the two
# groups coexist on a volume — verified 2026-07-16). A backup volume
# may NOT join `no-snapshot` — see that group below.
#
# CURRENT backup set (see scripts/label-backup-volumes.sh for the
# authoritative list + rationale):
#   vaultwarden/vaultwarden-data       (secret: attachments + org keys)
#   forgejo/gitea-shared-storage       (internal: git repos + LFS)
#   signal-bridge/signal-bridge-data   (secret: Signal session/keys)
#   paperless/paperless-data           (personal: insurance copy)
#   ntfy/ntfy-data                     (internal: default-offsite)
#   nextcloud/nextcloud-hot            (personal: datadirectory versions/
#                                       trashbin + config.php instance secret)
#   langfuse/data-volume-chi-…-0-0-0   (personal: ClickHouse trace store —
#                                       raw-volume, re-eval Sept vs logical)
# Everything else = snapshot-only (CNPG DBs → barman incl. langfuse-pg;
# openbao → raft
# snapshot; telemetry/caches → regenerable). NB: nextcloud/paperless BULK
# user data lives on NAS-crypt shares → offsite via Workstream C, not here.
#
# retain 14: this is the tier-1 NAS-local depth for fast restore; the
# deep GFS tail (weekly/monthly/yearly) lives on restic→Hetzner
# (backup plan Workstream E), NOT on the NAS. Was 90 (over-retained).
#
# Backup target + credentials configured in values.yaml
# (`defaultSettings.backupTarget` + `backupTargetCredentialSecret`).
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
  namespace: longhorn-system
spec:
  # `spec.name` mirrors metadata.name (Longhorn 1.7 validator
  # requires it on create — see snapshot-default).
  name: backup-daily
  # Daily at 03:35 (Longhorn slot of the staggered hour-offset
  # allocation per 2026-06-09 OOM-cascade RCA §"Recommended fixes" #3
  # / commit 1b405df: keeps Longhorn out of the same minute as the
  # 03:05 openbao daily snapshot). Frequency + destination unchanged.
  cron: "35 3 * * *"
  task: backup
  groups: [backup]             # OPT-IN group, not [default] — see header
  retain: 14                   # NAS-local depth; GFS tail on restic→Hetzner
  concurrency: 2
  labels:
    homelab-purpose: tier1-to-nas-minio
---
# ─── weekly filesystem trim, every snapshot-keeping group ───
#
# Reclaims dead blocks: filesystems delete data but never
# discard the blocks, so Longhorn keeps treating them as used
# — they inflate snapshot deltas AND every NAS/Hetzner backup
# forever. Found 2026-07-30: the Langfuse ClickHouse volume
# carried ~21 GiB of dead blocks vs 3.2 GiB of live filesystem
# data (system-log churn), making its daily backup 24 GiB.
# The `discard` mount-option alternative is explicitly
# discouraged by Longhorn docs (frequent snapshot removal
# interrupts backup creation) — a scheduled trim is the
# supported mechanism. Trim frees blocks in the volume head and in
# a continuous chain of system or already-removed snapshots behind
# it; a valid snapshot is immutable, so blocks it captured free up
# as it rotates out (≤6h for `default`, ≤7d for the deeper groups).
# The global remove-snapshots-during-filesystem-trim stays false:
# it makes trim "mark the latest snapshot and its ancestors as
# removed" (settings reference, 1.12.1) — it would delete the very
# snapshots these groups exist to keep.
#
# Groups: every group that keeps snapshots, including `backup`
# and `personal` (no RecurringJob of its own; a volume there
# holds only snapshots left by a group it used to be in). Was
# `[default]` alone until 2026-09-11. A volume in two of these
# groups is trimmed once — StartVolumeJobs skips duplicates
# (app/recurringjob/util.go filterVolumesForJob, v1.12.1).
# Detached volumes are skipped (allow-recurring-job-while-
# volume-detached=false). `no-snapshot` has its own trim below.
#
# Sunday 05:35 — keeps the :35 stagger slot, after the 03:35
# backup run so trims never race backup creation.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: filesystem-trim-weekly
  namespace: longhorn-system
spec:
  name: filesystem-trim-weekly
  cron: "35 5 * * 0"
  task: filesystem-trim
  groups: [default, secret-personal, internal, internal-media, personal, backup]
  retain: 0
  concurrency: 2
  labels:
    homelab-class: hygiene
---
# ─── no-snapshot group: volumes that get NO Longhorn snapshot ─
#
# Who belongs here (decided 2026-09-11, homelab-docs
# 01-architecture/backup-and-dr.md §"Tier 1"): volumes where an
# on-node snapshot cannot help a restore and only costs disk.
#   - CNPG Postgres PGDATA. Barman base backups + the WAL archive
#     give point-in-time recovery; the streaming standby covers a
#     lost volume. Postgres rewrites its files constantly, so an
#     hourly snapshot pinned ~200 MiB per hour per volume — 961 GiB
#     of replicas for 33 GiB of data on 2026-09-11.
#   - Telemetry, caches, scratch: Prometheus, Loki, Tempo,
#     restic-staging, model caches, Redis used as cache or queue.
# Unique data keeps its snapshot group.
#
# HOW A VOLUME OPTS OUT: label its PVC
#   recurring-job-group.longhorn.io/no-snapshot: "enabled"
# (a CNPG Cluster sets it in spec.inheritedMetadata.labels). Any
# recurring-job label keeps Longhorn from adding `default`
# (datastore.labelRecurringJobDefault, v1.12.1), and no job in
# this group takes a snapshot.
#   - NEW volume: nothing else to do. The Kyverno
#     longhorn-volume-label-propagation policy copies the PVC label
#     onto the Volume when it is created.
#   - EXISTING volume, or a PVC whose manifest cannot carry the
#     label (StatefulSet volumeClaimTemplates are immutable): run
#     scripts/sync-longhorn-no-snapshot.sh, which also holds the
#     declared list for the second case. Kyverno and the label sync
#     only ever ADD labels, so the old snapshot group would stay
#     and keep snapshotting; the script removes it from the PVC and
#     the Volume, and sets spec.unmapMarkSnapChainRemoved: enabled
#     on the Volume (see the trim job below).
#
# A snapshot taken by hand on a no-snapshot volume does not survive
# the next delete run or trim. Before risky work on such a volume
# take a CNPG backup or a Longhorn backup instead.
#
# NOT COMBINABLE with `backup`: backup-daily keeps the snapshot of
# the last backup for the next incremental one, and the delete job
# below would remove it every night. The script refuses the pair.
#
# Daily: delete every snapshot a no-snapshot volume still has.
# `snapshot-delete` lists ALL snapshot CRs of the volume — any
# job's, system snapshots, manual ones — and deletes all but
# `retain` newest (app/recurringjob/volume.go filterExpiredSnapshots,
# v1.12.1). The webhook keeps retain 0 for this task (it forces 1
# only for snapshot/backup tasks; server dry-run 2026-09-11). Steady
# state is nothing to delete; the job catches what a volume brought
# with it when it joined, system snapshots left by a replica
# rebuild, and anything taken by hand. 04:35 keeps the :35 slot,
# an hour after backup-daily.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-delete-no-snapshot
  namespace: longhorn-system
spec:
  name: snapshot-delete-no-snapshot
  cron: "35 4 * * *"
  task: snapshot-delete
  groups: [no-snapshot]
  retain: 0
  concurrency: 2
  labels:
    homelab-class: no-snapshot
---
# Weekly: trim no-snapshot volumes. spec.unmapMarkSnapChainRemoved:
# enabled overrides the global for these volumes only: trim marks
# the latest snapshot and its ancestors removed ("stops at the
# snapshot containing multiple children") and frees their blocks
# together with the head's, then purges (doRecurringFilesystemTrim
# -> purgeSnapshots). That reaches the one snapshot a delete cannot
# purge — the parent of the volume head stays behind, marked
# removed (controller/snapshot_controller.go, v1.12.1). Measured on
# todo-agents 2026-09-12: the delete run freed 1.74 and 1.83 GiB per
# replica, the trim a further 26 and 52 MB from inside that snapshot,
# which itself remained. Each no-snapshot volume therefore keeps
# exactly one snapshot CR, terminating behind its finalizer. A separate
# job from the Sunday trim so this group can be trimmed on its own
# (kubectl -n longhorn-system create job
# --from=cronjob/filesystem-trim-no-snapshot <name>), and Saturday
# so the two trims never share a night.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: filesystem-trim-no-snapshot
  namespace: longhorn-system
spec:
  name: filesystem-trim-no-snapshot
  cron: "35 5 * * 6"
  task: filesystem-trim
  groups: [no-snapshot]
  retain: 0
  concurrency: 2
  labels:
    homelab-class: no-snapshot
