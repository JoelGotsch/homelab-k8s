# Longhorn RecurringJob CRs — class-aligned snapshot + backup
# cadence per backup-and-dr.md §"Retention schedules" + ADR 0016
# D4. Closes the snapshot-CR gap surfaced by
# 99-journal/2026-05-02-backup-topology-gap-check.md item 1.
#
# Volume opt-in: each PVC selects a class group via the label
# `recurring-job-group.longhorn.io/<group>: enabled`. Volumes
# without an explicit group join `default` (catch-all,
# conservative cadence). Per-app PVC labelling retrofit is
# tracked separately in TODO §"Backup-topology sub-items".

# ─── default group: catch-all conservative ─────────────────
# Matches the `secret`/`personal` cadence (hourly × 7d). Volumes
# under this default get the strictest scheduled retention by
# default; class-aware groups below let internal / internal-media
# volumes reduce snapshot churn at the cost of fewer rollback
# points.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-default
  namespace: longhorn-system
spec:
  # `spec.name` is required by the Longhorn 1.7 admission validator
  # on CREATE (it's not auto-mutated from metadata.name pre-validation).
  # Existing CRs in-cluster have it filled by the mutator on the
  # post-validation path; new creates need it explicit. Same value
  # as metadata.name.
  name: snapshot-default
  # Hourly at :35 (offset within the hour per 2026-06-09 OOM-cascade
  # RCA §"Recommended fixes" #3 / commit 1b405df: Longhorn snapshot slot
  # of the staggered allocation, kept distinct from openbao :05,
  # backups :15 and snapshot-secret-personal :25). Spreads memory spikes
  # across the hour so no single minute trips the Talos node-OOM
  # threshold.
  cron: "35 * * * *"
  task: snapshot
  groups: [default]
  # Longhorn 1.7 admission validator caps retain at 100 per
  # RecurringJob (rejects 168 with "retain value should be less than
  # or equal to 100"). Original 168 = 7 days at hourly cadence was
  # admitted under earlier chart versions; the 2026-06-09 Argo
  # force-sync (per worker-OOM RCA staggering) revealed the new
  # validator rule. Reduced to 100 hourly snapshots ≈ 4d 4h. Down-
  # stream impact: longest scheduled-snapshot rollback window
  # shortens from 7d to ~4d; tier-2/tier-3 restic backups still
  # cover the 30-day-and-beyond restore.
  retain: 100
  concurrency: 4
  labels:
    homelab-class: catch-all
---
# ─── secret + personal explicit group ──────────────────────
# Same cadence as `default`, but explicit so an app can label
# its PVC `recurring-job-group.longhorn.io/secret-personal: enabled`
# to opt in deliberately rather than relying on the default
# (e.g., if a future class-default change shifts the catch-all).
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-secret-personal
  namespace: longhorn-system
spec:
  # `spec.name` required on create by Longhorn 1.7 validator — see
  # snapshot-default above for the explanation.
  name: snapshot-secret-personal
  # Hourly at :25 (offset within the hour per 2026-06-09 OOM-cascade
  # RCA §"Recommended fixes" #3 / commit 1b405df: snapshot-secret slot
  # of the staggered allocation, distinct from openbao :05, backups
  # :15 and snapshot-default :35).
  cron: "25 * * * *"
  task: snapshot
  groups: [secret-personal]
  # Same Longhorn-1.7 retain<=100 validator constraint as
  # snapshot-default above. Reduced from 168 to 100 (≈ 4d 4h hourly
  # rollback window). Tier-2/tier-3 restic backups cover longer.
  retain: 100
  concurrency: 4
  labels:
    homelab-class: secret-personal
---
# ─── internal class ────────────────────────────────────────
# 4-hourly snapshots × 7 days = 42 retain. Forgejo git data,
# CrowdSec metadata, llm-gateway budget tracking. Lower
# snapshot churn than secret/personal because RPO 4h is
# acceptable for these classes per backup-and-dr.md.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-internal
  namespace: longhorn-system
spec:
  # `spec.name` mirrors metadata.name (Longhorn 1.7 validator
  # requires it on create — see snapshot-default).
  name: snapshot-internal
  # Every 4 hours at :35 (offset within the hour per 2026-06-09 OOM-
  # cascade RCA §"Recommended fixes" #3 / commit 1b405df: Longhorn
  # slot of the staggered allocation; frequency unchanged).
  cron: "35 */4 * * *"
  task: snapshot
  groups: [internal]
  retain: 42                   # 6/day × 7 days
  concurrency: 4
  labels:
    homelab-class: internal
---
# ─── internal-media class ──────────────────────────────────
# Daily snapshots × 7 days. Jellyfin media libraries can be
# multi-TB; hourly snapshots would amplify storage pressure
# substantially. RPO 24h acceptable per backup-and-dr.md.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-internal-media
  namespace: longhorn-system
spec:
  # `spec.name` mirrors metadata.name (Longhorn 1.7 validator
  # requires it on create — see snapshot-default).
  name: snapshot-internal-media
  # Daily at 02:35 (off-peak, Longhorn slot of the staggered hour
  # allocation per 2026-06-09 OOM-cascade RCA §"Recommended fixes" #3
  # / commit 1b405df). Frequency unchanged.
  cron: "35 2 * * *"
  task: snapshot
  groups: [internal-media]
  retain: 7                    # 7 daily snapshots
  concurrency: 2
  labels:
    homelab-class: internal-media
---
# ─── volume-level backup to MinIO-on-NAS ───────────────────
# Per ADR 0016 D4 + backup-and-dr.md §"Cluster Longhorn volumes":
# daily volume backup to NAS-MinIO `longhorn-backups` bucket,
# retained 90d locally; the Restic CronJob at
# `infrastructure/backup-cronjobs/` mirrors the bucket nightly
# to tier-2 (friend's NAS) + tier-3 (Hetzner Storage Box).
#
# Backup target + credentials configured in values.yaml
# (`defaultSettings.backupTarget` + `backupTargetCredentialSecret`).
# Without those filled, `task: backup` fails per-volume — the
# snapshot tasks above keep working regardless.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
  namespace: longhorn-system
spec:
  # `spec.name` mirrors metadata.name (Longhorn 1.7 validator
  # requires it on create — see snapshot-default).
  name: backup-daily
  # Daily at 03:35 (Longhorn slot of the staggered hour-offset
  # allocation per 2026-06-09 OOM-cascade RCA §"Recommended fixes" #3
  # / commit 1b405df: keeps Longhorn out of the same minute as the
  # 03:05 openbao daily snapshot). Frequency + destination unchanged.
  cron: "35 3 * * *"
  task: backup
  groups: [default]
  retain: 90                   # 90 daily backups
  concurrency: 2
  labels:
    homelab-purpose: tier1-to-nas-minio
