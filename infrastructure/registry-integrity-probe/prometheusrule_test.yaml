# promtool unit tests for prometheusrule.yaml.
#
# Run via `scripts/check-prometheusrule-tests.sh` (pre-commit), which extracts
# `.spec.groups` from the sibling PrometheusRule CR into a `rules.yaml` beside a
# copy of this file — hence the bare `rule_files:` reference below.
#
# Added with the 2026-09-09 staleness retune (48 h + `for: 1h` -> 27 h +
# `for: 30m`). The threshold is now tight enough that getting the boundary wrong
# means either a nightly false page or exactly the ~25 h of silence the retune
# set out to remove, so the boundary is asserted rather than reasoned about.
#
# NOTE ON TIMESTAMPS: promtool's clock starts at the Unix epoch, so `eval_time:
# 50m` means `time() == 3000`. The `*_time` series below carry NEGATIVE values
# so that `time() - series` crosses 97200 within the first hour of the test
# clock; every use in these rules is `time() - x`, so only the difference
# matters and the suite stays fast enough for a pre-commit hook.
#
# With last_successful = -96200 and the group's `interval: 1m`: expr true from
# t > 1000 s (first evaluation at 17m), `for: 30m` satisfied at 47m. Hence
# "45m -> []" and "50m -> firing".
rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  # (a) Probe ran within the window -> silent. Also pins the near-boundary
  #     behaviour: at 45m the age is 96900 s, 300 s short of the threshold.
  - interval: 1m
    name: "probe succeeded inside the 27h window - nothing fires"
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="registry-integrity-probe", cronjob="registry-blob-validate"}'
        values: "-96200+0x60"
      - series: 'kube_cronjob_created{namespace="registry-integrity-probe", cronjob="registry-blob-validate"}'
        values: "-500000+0x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: RegistryBlobValidateStale
        exp_alerts: []

  # (b) Same series, half an hour later: 27 h exceeded and `for: 30m` satisfied.
  - interval: 1m
    name: "probe has not succeeded in 27h - fires"
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="registry-integrity-probe", cronjob="registry-blob-validate"}'
        values: "-96200+0x60"
      - series: 'kube_cronjob_created{namespace="registry-integrity-probe", cronjob="registry-blob-validate"}'
        values: "-500000+0x60"
    alert_rule_test:
      - eval_time: 50m
        alertname: RegistryBlobValidateStale
        exp_alerts:
          - exp_labels:
              cronjob: registry-blob-validate
              severity: warning
              component: registry-integrity-probe
            exp_annotations: &stale_ann
              summary: "Registry blob validation has not succeeded in 27 hours"
              description: "No successful registry-blob-validate run for 27+ h against a\ndaily schedule (or the CronJob was suspended / deleted / has\nnever succeeded). The integrity probe is not running — blob loss\nwould go undetected.\nInspect:\n  kubectl -n registry-integrity-probe get cronjob,jobs\n"
              runbook_url: https://github.com/JoelGotsch/homelab-k8s/blob/main/infrastructure/registry-integrity-probe/README.md

  # (c) Never succeeded: kube-state-metrics emits no
  #     `last_successful_time` until `.status.lastSuccessfulTime` is set, so
  #     clause 1 has no series at all and the `unless` clause has to carry it.
  #     Note the label set differs from (b) — `max by (cronjob)` drops
  #     `namespace`, which is why neither exp_labels block lists it.
  - interval: 1m
    name: "CronJob older than 27h that has never succeeded - fires"
    input_series:
      - series: 'kube_cronjob_created{namespace="registry-integrity-probe", cronjob="registry-blob-validate"}'
        values: "-96200+0x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: RegistryBlobValidateStale
        exp_alerts: []
      - eval_time: 50m
        alertname: RegistryBlobValidateStale
        exp_alerts:
          - exp_labels:
              cronjob: registry-blob-validate
              severity: warning
              component: registry-integrity-probe
            exp_annotations: *stale_ann

  # (d) CronJob object deleted outright: every series stops and only `absent()`
  #     can speak. Unlike the two-lane backup-cronjobs case, a regex here would
  #     be equivalent — there is one lane — so this asserts the clause still
  #     works after the sibling manifest's per-lane rewrite, and that the
  #     `absent()` branch carries `namespace` where the `max by` branches do not.
  - interval: 1m
    name: "CronJob deleted - absent() fires and carries the namespace label"
    input_series:
      - series: 'kube_cronjob_created{namespace="registry-integrity-probe", cronjob="registry-blob-validate"}'
        values: "-500000+0x5 _x60"
      - series: 'kube_cronjob_status_last_successful_time{namespace="registry-integrity-probe", cronjob="registry-blob-validate"}'
        values: "0+0x5 _x60"
    alert_rule_test:
      # Series go stale 5 min after the last sample, so `absent()` activates
      # around 10m and `for: 30m` lands it at ~41m.
      - eval_time: 35m
        alertname: RegistryBlobValidateStale
        exp_alerts: []
      - eval_time: 45m
        alertname: RegistryBlobValidateStale
        exp_alerts:
          - exp_labels:
              namespace: registry-integrity-probe
              cronjob: registry-blob-validate
              severity: warning
              component: registry-integrity-probe
            exp_annotations: *stale_ann
