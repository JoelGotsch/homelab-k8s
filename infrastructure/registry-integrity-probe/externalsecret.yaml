# Registry credentials for pulling first-party images from
# registry.homelab.internal (Forgejo Packages) during validation.
#
# Reuses the SAME OpenBao path + bot as the backup-cronjobs pull
# secret (kv/shared/forgejo-packages/ci — dual-use push+pull, already
# declared in the homelab-infra inventory). No new secret to seed.
#
# Materialised as a dockerconfigjson keyed to registry.homelab.internal
# so crane's default keychain (DOCKER_CONFIG) picks it up. crane reaches
# the registry via a pod hostAlias (registry.homelab.internal ->
# 10.10.30.52, the registry-direct LB), so the host string here matches
# what crane sees on the wire.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: registry-homelab-internal-pull
  namespace: registry-integrity-probe
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: registry-homelab-internal-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "registry.homelab.internal": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: shared/forgejo-packages/ci
        property: username
    - secretKey: password
      remoteRef:
        key: shared/forgejo-packages/ci
        property: token
