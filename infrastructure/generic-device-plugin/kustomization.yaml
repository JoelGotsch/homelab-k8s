# generic-device-plugin — host device nodes as extended resources, so that
# PSS-`restricted` namespaces can use a GPU render node without hostPath.
# First consumer: Jellyfin VA-API (homelab/plans/jellyfin-gpu-transcoding.md).
#
# Raw manifests, deliberately not the upstream Helm chart: chart 0.1.2
# (oci://ghcr.io/squat/charts/generic-device-plugin) hard-codes its
# --device list (serial/video0/fuse/snd) in templates/daemonset.yaml and
# exposes no values key for devices, so it cannot express this layer.
#
# Argo CD picks this up via the infrastructure ApplicationSet
# (bootstrap/applicationsets/infrastructure.yaml, `path: infrastructure/*`,
# automated sync, prune + selfHeal). The `default-deny` NetworkPolicy is
# generated by Kyverno for every first-party namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: generic-device-plugin

resources:
  - namespace.yaml
  - daemonset.yaml

# ADR 0036 baseline (LimitRange + ResourceQuota) so the first-party Kyverno
# audits stay quiet; same component platform/pr-agent uses.
components:
  - ../../components/first-party-namespace
