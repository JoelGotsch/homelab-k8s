# Kyverno ClusterPolicy — require a LimitRange in every first-party namespace
#
# Purpose:   Every first-party namespace must have at least one LimitRange, so
#            containers that ship without explicit resources.* still land at a
#            sane default and cannot silently starve the node.
# ADR:       0036 D1
# Rollout:   Audit -> Enforce after 2 weeks of clean PolicyReports
#
# Rationale: The 2026-07-08 Longhorn incident showed that resource-governance
#            was applied only to ci-woodpecker (per ADR 0023 D5). Across the
#            other 20+ first-party namespaces there is no admission-time
#            guarantee that a LimitRange exists at all. When a chart ships a
#            Deployment without resources.*, the pod is admitted with
#            unlimited CPU/mem and can knock out node-critical daemons
#            (kubelet, longhorn-manager, cilium-agent). A per-namespace
#            LimitRange is the last-mile default; this policy makes its
#            absence visible cluster-wide and (eventually) blocks namespaces
#            that omit one.
#
# Bypass:    Annotate the Namespace with
#              bypass.homelab.internal/homelab-require-namespace-limitrange: "<reason>"
#            (non-empty value). Kyverno emits a Loki-visible audit event on
#            skip via the emitWarning path.

# CEL form (ValidatingPolicy), migrated 2026-09-14 (hl-0284). The context
# apiCall became `resource.List` — same API path, same reports-controller RBAC.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: homelab-require-namespace-limitrange
  annotations:
    policies.kyverno.io/title: "Namespace: LimitRange required"
    policies.kyverno.io/category: "Resource Governance"
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: |
      Every Namespace labelled `homelab.internal/first-party: "true"` must
      have at least one LimitRange defined within it. Bypass with the
      annotation `bypass.homelab.internal/homelab-require-namespace-limitrange`.
spec:
  validationActions: [Audit, Warn]
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    objectSelector:
      matchLabels:
        homelab.internal/first-party: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  matchConditions:
    - name: no-policy-bypass
      expression: >-
        object.metadata.?annotations['bypass.homelab.internal/homelab-require-namespace-limitrange'].orValue('') == ''
  variables:
    - name: matchingCount
      expression: >-
        resource.List("v1", "limitranges", object.metadata.name).items.size()
  validations:
    - expression: variables.matchingCount >= 1
      # Static fallback: reported when messageExpression itself fails to evaluate
      # (a messageExpression error must not turn into an empty report row).
      message: >-
        Namespace is labelled `homelab.internal/first-party: "true"` but has no LimitRange. Add one (see platform/kyverno/policies/README.md for the default shape) or annotate the Namespace with bypass.homelab.internal/homelab-require-namespace-limitrange: "<reason>" to waive.
      messageExpression: >-
        'Namespace `' + object.metadata.name + '` is labelled `homelab.internal/first-party: "true"` but has no
        LimitRange. Add one (see platform/kyverno/policies/README.md for the default shape) or
        annotate the Namespace with
        bypass.homelab.internal/homelab-require-namespace-limitrange: "<reason>" to waive.'
