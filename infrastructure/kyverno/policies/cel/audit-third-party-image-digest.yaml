# Third-party digest-pinning visibility (Audit only). CEL form
# (ValidatingPolicy), migrated 2026-09-14 (hl-0284) out of clusterpolicies.yaml;
# the two-tier rationale (first-party Enforce, third-party Audit) is in
# require-first-party-image-digest.yaml's header. kube-* excluded via
# namespaceSelector so autogen stays on.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: audit-third-party-image-digest
  annotations:
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: |
      Audit (non-blocking) Pod images that are NOT
      digest-pinned. Generates PolicyReport entries visible
      via `kubectl get policyreport -A`. Operator promotes
      individual third-party images to digest-required as
      the ecosystem matures.
spec:
  validationActions: [Audit]
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          # System namespaces have their own upgrade cadence (kubelet pulls,
          # Talos system extensions); excluding reduces audit noise.
          values: [kube-system, kube-public, kube-node-lease]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: object.spec.containers.all(c, c.image.contains('@sha256:'))
      message: >-
        Image SHOULD be referenced by digest (sha256:...). Audit-only — operator review via
        PolicyReport.
