# Kyverno ClusterPolicy — Secrets in first-party namespaces must originate
# from ExternalSecrets / OpenBao, not inline manifests
#
# Purpose:   Secrets created in namespaces labelled
#            `homelab.internal/first-party: "true"` must be tagged
#            `external-secrets.io/backend: openbao` (the label ESO writes
#            when it materialises a secret from OpenBao) OR carry the
#            explicit inline-secret waiver annotation
#            `bypass.homelab.internal/inline-secret`.
# ADR:       0036 D7
# Rollout:   Admission Audit -> Enforce after clean admission evidence. A
#            background scan would require the reports controller to read
#            every Secret value cluster-wide, so this policy intentionally
#            remains admission-only. Promotion to Enforce stays blocked until
#            SEC-01 lands the repository scanner and a one-time metadata-only
#            live audit covers pre-existing Secrets.
#
# Rationale: CLAUDE.md rule 1 (never print secrets) + rules 28-30 (OpenBao
#            is the source of truth for cluster secrets, ESO the delivery
#            mechanism). Inline Secret manifests in the k8s repo defeat
#            this: the value ends up in git history, in Argo diffs, in
#            operator terminals during troubleshooting. This policy makes
#            the "did someone commit a Secret literal" question loud at
#            admission time.
#
#            The label `external-secrets.io/backend` is set by ESO on
#            secrets it owns; the `bypass.homelab.internal/inline-secret`
#            annotation is the explicit inline waiver (for bootstrap
#            secrets, ephemeral helm-hook secrets that shouldn't be in
#            OpenBao, etc.).
#
#            Kyverno's own webhook-signing Secrets and cert-manager /
#            reflector helper Secrets are excluded via
#            `type: kubernetes.io/service-account-token` etc. — those are
#            controller-managed and not human-authored.
#
# Bypass:    Two-tier:
#              - `bypass.homelab.internal/inline-secret` — semantic: "yes
#                this is intentionally inline"
#              - `bypass.homelab.internal/homelab-disallow-inline-secrets`
#                — mechanistic: uniform per-policy bypass. Either works.

# CEL form (ValidatingPolicy), migrated 2026-09-14 (hl-0284). The old rule
# fetched the Namespace's labels with a context apiCall; the CEL engine hands
# them over as `namespaceObject`, so no API call and no extra RBAC. `emitWarning`
# maps to the `Warn` validation action (kyverno.io migration guide). Background
# evaluation stays OFF: scripts/check-known-argocd-drift.sh pins
# `.spec.evaluation.background.enabled == false` so reporting never requires
# cluster-wide Secret reads.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: homelab-disallow-inline-secrets
  annotations:
    policies.kyverno.io/title: "Secret: must come from ExternalSecrets or be waived"
    policies.kyverno.io/category: "Secrets Management"
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/description: |
      Secrets in `homelab.internal/first-party: "true"` namespaces must
      carry `external-secrets.io/backend: openbao` label OR annotation
      `bypass.homelab.internal/inline-secret`. Bypass this policy check
      itself with `bypass.homelab.internal/homelab-disallow-inline-secrets`.
spec:
  validationActions: [Audit, Warn]
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
  matchConditions:
    - name: no-policy-bypass
      expression: >-
        object.metadata.?annotations['bypass.homelab.internal/homelab-disallow-inline-secrets'].orValue('') == ''
    - name: namespaced
      expression: >-
        object.metadata.?namespace.orValue('') != ''
    - name: not-a-system-managed-type
      expression: >-
        !(object.?type.orValue('') in [
          'kubernetes.io/service-account-token',
          'kubernetes.io/tls',
          'kubernetes.io/dockerconfigjson',
          'helm.sh/release.v1'])
  variables:
    - name: nsFirstParty
      expression: >-
        namespaceObject.metadata.?labels['homelab.internal/first-party'].orValue('') == 'true'
  validations:
    - expression: >-
        !variables.nsFirstParty ||
        object.metadata.?labels['external-secrets.io/backend'].orValue('') == 'openbao' ||
        object.metadata.?annotations['bypass.homelab.internal/inline-secret'].orValue('') != ''
      messageExpression: >-
        'Secret `' + object.metadata.namespace + '/' + object.metadata.name + '` was created in a
        first-party namespace but is neither owned by ExternalSecrets (label
        `external-secrets.io/backend: openbao`) nor carries the inline-secret waiver annotation
        (`bypass.homelab.internal/inline-secret: <reason>`). Move the secret material into OpenBao
        and add an ExternalSecret referencing it, or annotate with
        bypass.homelab.internal/inline-secret: "<reason>" (or
        bypass.homelab.internal/homelab-disallow-inline-secrets: "<reason>") if the inline form
        is intentional.'
      message: >-
        Secret was created in a first-party namespace but is neither owned by
        ExternalSecrets (label `external-secrets.io/backend: openbao`) nor carries the
        inline-secret waiver annotation (`bypass.homelab.internal/inline-secret: <reason>`).
        Move the secret material into OpenBao and add an ExternalSecret referencing it, or
        annotate with bypass.homelab.internal/inline-secret: "<reason>" (or
        bypass.homelab.internal/homelab-disallow-inline-secrets: "<reason>") if the inline
        form is intentional.
