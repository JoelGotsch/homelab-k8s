# Kyverno ClusterPolicy — auto-generate a default ResourceQuota into every
# first-party namespace
#
# Purpose:   When a Namespace with `homelab.internal/first-party: "true"`
#            is created/reconciled, generate a namespace-scoped
#            ResourceQuota named `default-quota` if it does not exist.
# ADR:       0036 D9
# Rollout:   Audit -> Enforce after 2 weeks of clean PolicyReports
#
# Rationale: Paired with `homelab-require-namespace-resourcequota`
#            (the validator). The default is deliberately generous — it
#            exists to catch *runaway* consumption (a controller stuck
#            spawning), not to right-size each app. Right-sizing per-app
#            comes via an explicit ResourceQuota in the namespace's own
#            manifest, which this policy leaves alone (only manages
#            `default-quota`).
#
#            Default budget:
#              requests.cpu:     4       (≈ half of a smaller Talos node)
#              requests.memory:  8Gi
#              limits.memory:    16Gi
#              count/pods:       50
#            These numbers are large enough that any existing app fits and
#            small enough that a runaway CronJob spawning 10k pods gets
#            blocked. Namespaces with heavier expected footprints should
#            ship their own ResourceQuota (any name other than
#            `default-quota`) — quotas are additive: the strictest one
#            wins.
#
# Bypass:    Annotate the Namespace with
#              bypass.homelab.internal/homelab-generate-default-resourcequota: "<reason>"

# CEL form (GeneratingPolicy), migrated 2026-09-14 (hl-0284) — see the
# limitrange generator's header for the shape notes.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: homelab-generate-default-resourcequota
  annotations:
    policies.kyverno.io/title: "Namespace: auto-generate default ResourceQuota"
    policies.kyverno.io/category: "Resource Governance"
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: ResourceQuota
    policies.kyverno.io/description: |
      When a Namespace with `homelab.internal/first-party: "true"` is
      created/updated, generate a default ResourceQuota named
      `default-quota`. `synchronize: true`. Bypass with
      `bypass.homelab.internal/homelab-generate-default-resourcequota`.
spec:
  evaluation:
    synchronize:
      enabled: true
    generateExisting:
      enabled: true
    orphanDownstreamOnPolicyDelete:
      enabled: false
  matchConstraints:
    objectSelector:
      matchLabels:
        homelab.internal/first-party: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  matchConditions:
    - name: no-policy-bypass
      expression: >-
        object.metadata.?annotations['bypass.homelab.internal/homelab-generate-default-resourcequota'].orValue('') == ''
    - name: not-an-excluded-namespace
      expression: >-
        !(object.metadata.name in [
          "kyverno", "longhorn-system", "longhorn-va-janitor", "cnpg-system", "cert-manager",
          "external-secrets", "trust-manager", "trivy-system", "clickhouse-operator",
          "cloudflare-tunnel", "csi-rclone-system", "minio-on-nas", "nfs-csi", "spegel",
          "backup-cronjobs", "monitoring", "observability-crowdsec", "observability-benchmarks",
          "observability-tempo", "kube-system", "argocd", "openbao", "approval-channel",
          "authentik", "forgejo", "immich", "langfuse", "llm-gateway", "nextcloud", "paperless",
          "vaultwarden"
        ])
  variables:
    - name: nsName
      expression: object.metadata.name
    - name: downstream
      expression: >-
        [{
          "apiVersion": dyn("v1"),
          "kind": dyn("ResourceQuota"),
          "metadata": dyn({
            "name": "default-quota",
            "namespace": string(variables.nsName),
            "labels": {
              "homelab.internal/generated-by": "kyverno",
              "homelab.internal/component": "default-quota"
            },
            "annotations": {
              "policies.kyverno.io/managed-by": "homelab-generate-default-resourcequota"
            }
          }),
          "spec": dyn({
            "hard": {
              "requests.cpu": "4",
              "requests.memory": "8Gi",
              "limits.memory": "16Gi",
              "count/pods": "50"
            }
          })
        }]
  generate:
    - expression: generator.Apply(variables.nsName, variables.downstream)
