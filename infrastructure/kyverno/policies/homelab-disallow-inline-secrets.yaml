# Kyverno ClusterPolicy — Secrets in first-party namespaces must originate
# from ExternalSecrets / OpenBao, not inline manifests
#
# Purpose:   Secrets created in namespaces labelled
#            `homelab.internal/first-party: "true"` must be tagged
#            `external-secrets.io/backend: openbao` (the label ESO writes
#            when it materialises a secret from OpenBao) OR carry the
#            explicit inline-secret waiver annotation
#            `bypass.homelab.internal/inline-secret`.
# ADR:       0036 D7
# Rollout:   Audit -> Enforce after 2 weeks of clean PolicyReports
#
# Rationale: CLAUDE.md rule 1 (never print secrets) + rules 28-30 (OpenBao
#            is the source of truth for cluster secrets, ESO the delivery
#            mechanism). Inline Secret manifests in the k8s repo defeat
#            this: the value ends up in git history, in Argo diffs, in
#            operator terminals during troubleshooting. This policy makes
#            the "did someone commit a Secret literal" question loud at
#            admission time.
#
#            The label `external-secrets.io/backend` is set by ESO on
#            secrets it owns; the `bypass.homelab.internal/inline-secret`
#            annotation is the explicit inline waiver (for bootstrap
#            secrets, ephemeral helm-hook secrets that shouldn't be in
#            OpenBao, etc.).
#
#            Kyverno's own webhook-signing Secrets and cert-manager /
#            reflector helper Secrets are excluded via
#            `type: kubernetes.io/service-account-token` etc. — those are
#            controller-managed and not human-authored.
#
# Bypass:    Two-tier:
#              - `bypass.homelab.internal/inline-secret` — semantic: "yes
#                this is intentionally inline"
#              - `bypass.homelab.internal/homelab-disallow-inline-secrets`
#                — mechanistic: uniform per-policy bypass. Either works.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: homelab-disallow-inline-secrets
  annotations:
    policies.kyverno.io/title: "Secret: must come from ExternalSecrets or be waived"
    policies.kyverno.io/category: "Secrets Management"
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/description: |
      Secrets in `homelab.internal/first-party: "true"` namespaces must
      carry `external-secrets.io/backend: openbao` label OR annotation
      `bypass.homelab.internal/inline-secret`. Bypass this policy check
      itself with `bypass.homelab.internal/homelab-disallow-inline-secrets`.
spec:
  validationFailureAction: Audit
  background: true
  emitWarning: true
  rules:
    - name: secret-must-be-eso-owned-or-waived
      match:
        any:
          - resources:
              kinds: [Secret]
      exclude:
        any:
          # Controller-managed secret types are not human-authored.
          - resources:
              selector:
                matchExpressions:
                  - key: type
                    operator: In
                    values:
                      - kubernetes.io/service-account-token
                      - kubernetes.io/tls
                      - kubernetes.io/dockerconfigjson
                      - helm.sh/release.v1
      preconditions:
        all:
          - key: "{{ request.object.metadata.annotations.\"bypass.homelab.internal/homelab-disallow-inline-secrets\" || '' }}"
            operator: Equals
            value: ""
          # Only enforce inside first-party namespaces. Query the
          # Namespace label live (secrets don't inherit the label).
          - key: "{{ request.namespace }}"
            operator: NotEquals
            value: ""
      context:
        - name: nsLabels
          apiCall:
            urlPath: "/api/v1/namespaces/{{ request.namespace }}"
            jmesPath: "metadata.labels || `{}`"
      validate:
        allowExistingViolations: true
        message: |
          Secret `{{ request.namespace }}/{{ request.object.metadata.name }}`
          was created in a first-party namespace but is neither owned by
          ExternalSecrets (label `external-secrets.io/backend: openbao`)
          nor carries the inline-secret waiver annotation
          (`bypass.homelab.internal/inline-secret: <reason>`). Move the
          secret material into OpenBao and add an ExternalSecret
          referencing it, or annotate with
            bypass.homelab.internal/inline-secret: "<reason>"
          (or
            bypass.homelab.internal/homelab-disallow-inline-secrets: "<reason>"
          ) if the inline form is intentional.
        deny:
          conditions:
            all:
              # First-party ns AND missing ESO label AND missing
              # inline-secret annotation ⇒ deny.
              - key: "{{ nsLabels.\"homelab.internal/first-party\" || '' }}"
                operator: Equals
                value: "true"
              - key: "{{ request.object.metadata.labels.\"external-secrets.io/backend\" || '' }}"
                operator: NotEquals
                value: "openbao"
              - key: "{{ request.object.metadata.annotations.\"bypass.homelab.internal/inline-secret\" || '' }}"
                operator: Equals
                value: ""
