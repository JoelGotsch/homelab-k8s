    woodpecker-ci.org/repo-id: '35'
    woodpecker-ci.org/repo-forge-id: '141'
spec:
  containers:
  - name: step
    image: example.invalid/synthetic:only
---
apiVersion: v1
kind: Pod
metadata:
  name: injected
  namespace: ci-woodpecker
  labels:
    woodpecker-ci.org/repo-id: '35'
    woodpecker-ci.org/repo-forge-id: '141'
spec:
  containers:
  - name: step
    image: example.invalid/synthetic:only
    volumeMounts:
    - name: workspace
      mountPath: /woodpecker
    - name: kube-api-access-proof
      mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      readOnly: true
  serviceAccountName: default
  automountServiceAccountToken: true
  volumes:
  - name: workspace
    emptyDir: {}
  - name: kube-api-access-proof
    projected:
      sources:
      - serviceAccountToken:
          path: token
          expirationSeconds: 3600
      - configMap:
          name: kube-root-ca.crt
  initContainers:
  - name: init
    image: example.invalid/synthetic:only
    volumeMounts:
    - name: workspace
      mountPath: /woodpecker
    - name: kube-api-access-proof
      mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      readOnly: true
---
