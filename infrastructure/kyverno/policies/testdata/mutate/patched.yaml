apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cel-proof-openbao-retain
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao
  annotations:
    retention.homelab.internal/reason: "OpenBao raft cluster state + audit log \u2014\
      \ irreplaceable\nwithout a full restore-from-tier-3-backup ceremony\n(ADR 0018;\
      \ runbook openbao/routine-unseal.md). Stamped\nby Kyverno policy homelab-mutate-openbao-pvc-retention\n\
      because the OpenBao Helm chart does not expose\nper-PVC annotations under server.{dataStorage,auditStorage}."
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn-replica2-retain
  resources:
    requests:
      storage: 1Gi
