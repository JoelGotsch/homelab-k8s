- isMutatingPolicy: true
  kind: Volume
  policy: longhorn-volume-label-propagation
  resources:
  - longhorn-system/pvc-04e32124-836c-45e1-929f-db9218a882f5
  patchedResources: patched.yaml
  result: pass
- isMutatingPolicy: true
  kind: Volume
  policy: longhorn-volume-label-propagation
  resources:
  - longhorn-system/pvc-00000000-0000-0000-0000-000000000000
  result: skip
