  name: kyverno-cel-migration-mutate
policies:
- ../../cel/ci-woodpecker-dns-ndots.yaml
- ../../cel/homelab-mutate-openbao-pvc-retention.yaml
- ../../cel/longhorn-volume-label-propagation.yaml
resources:
- resources.yaml
clusterResources:
- clusterresources.yaml
variables: values.yaml
results:
