# Kyverno ClusterPolicy — warn (audit only) when a container omits
# `resources.limits.cpu`.
#
# Purpose:   Surface containers missing CPU limits. No enforcement path —
#            audit-only forever, per the CPU-throttling caveat below.
# ADR:       0036 D5 (split from homelab-disallow-unlimited-containers)
# Rollout:   Audit ONLY. No Enforce migration planned. Reasoning below.
#
# Rationale: Unlike memory, CPU limits have a real downside: the Linux CFS
#            quota mechanism accounts on 100ms slices per-cpu and can
#            starve multi-threaded processes even under low overall load.
#            Node.js, JVM, Go runtimes with GOMAXPROCS>1 are all sensitive
#            to CFS-quota throttling. Enforcing CPU limits cluster-wide
#            would cause more incidents (mysterious latency spikes) than
#            it prevents (a truly runaway CPU consumer is a bug worth
#            fixing individually, not policy-blocking).
#
#            But we want visibility: the 2026-06-26 memory baseline sweep
#            observed ~87% of first-party containers omit CPU limits. This
#            policy lets operators grep PolicyReports for CPU-limitless
#            workloads and decide per-app whether to add a limit; it does
#            NOT force the choice.
#
# Bypass:    Same uniform annotation pattern.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: homelab-warn-unlimited-cpu
  annotations:
    policies.kyverno.io/title: "Containers: CPU limit (audit-only)"
    policies.kyverno.io/category: "Resource Governance"
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: |
      Audit-only surface for containers missing `resources.limits.cpu`.
      No enforcement is planned (CFS-quota throttling is a real hazard);
      use this to grep for CPU-limitless workloads and decide per-app.
spec:
  # AUDIT ONLY — no migration to Enforce planned. See file header.
  validationFailureAction: Audit
  background: true
  emitWarning: true
  rules:
    - name: containers-should-declare-cpu-limit
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
      preconditions:
        all:
          - key: "{{ request.object.metadata.annotations.\"bypass.homelab.internal/homelab-warn-unlimited-cpu\" || '' }}"
            operator: Equals
            value: ""
      validate:
        allowExistingViolations: true
        message: |
          Container `{{ element.name }}` in
          `{{ request.object.metadata.namespace }}/{{ request.object.metadata.name }}`
          has no `resources.limits.cpu`. This is audit-only (CFS-quota
          throttling makes cluster-wide CPU limits risky); consider a
          limit for this specific workload if it has bursty CPU behaviour.
          Annotate the workload with
            bypass.homelab.internal/homelab-warn-unlimited-cpu: "<reason>"
          to silence this report.
        foreach:
          - list: "request.object.spec.containers || `[]`"
            pattern:
              resources:
                limits:
                  cpu: "?*"
          - list: "request.object.spec.initContainers || `[]`"
            pattern:
              resources:
                limits:
                  cpu: "?*"
