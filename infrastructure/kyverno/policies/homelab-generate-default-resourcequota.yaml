# Kyverno ClusterPolicy — auto-generate a default ResourceQuota into every
# first-party namespace
#
# Purpose:   When a Namespace with `homelab.internal/first-party: "true"`
#            is created/reconciled, generate a namespace-scoped
#            ResourceQuota named `default-quota` if it does not exist.
# ADR:       0036 D9
# Rollout:   Audit -> Enforce after 2 weeks of clean PolicyReports
#
# Rationale: Paired with `homelab-require-namespace-resourcequota`
#            (the validator). The default is deliberately generous — it
#            exists to catch *runaway* consumption (a controller stuck
#            spawning), not to right-size each app. Right-sizing per-app
#            comes via an explicit ResourceQuota in the namespace's own
#            manifest, which this policy leaves alone (only manages
#            `default-quota`).
#
#            Default budget:
#              requests.cpu:     4       (≈ half of a smaller Talos node)
#              requests.memory:  8Gi
#              limits.memory:    16Gi
#              count/pods:       50
#            These numbers are large enough that any existing app fits and
#            small enough that a runaway CronJob spawning 10k pods gets
#            blocked. Namespaces with heavier expected footprints should
#            ship their own ResourceQuota (any name other than
#            `default-quota`) — quotas are additive: the strictest one
#            wins.
#
# Bypass:    Annotate the Namespace with
#              bypass.homelab.internal/homelab-generate-default-resourcequota: "<reason>"

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: homelab-generate-default-resourcequota
  annotations:
    policies.kyverno.io/title: "Namespace: auto-generate default ResourceQuota"
    policies.kyverno.io/category: "Resource Governance"
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: ResourceQuota
    policies.kyverno.io/description: |
      When a Namespace with `homelab.internal/first-party: "true"` is
      created/updated, generate a default ResourceQuota named
      `default-quota`. `synchronize: true`. Bypass with
      `bypass.homelab.internal/homelab-generate-default-resourcequota`.
spec:
  validationFailureAction: Audit
  background: true
  emitWarning: true
  generateExisting: true
  rules:
    - name: generate-default-resourcequota
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels:
                  homelab.internal/first-party: "true"
      preconditions:
        all:
          - key: "{{ request.object.metadata.annotations.\"bypass.homelab.internal/homelab-generate-default-resourcequota\" || '' }}"
            operator: Equals
            value: ""
          # Exclude infrastructure-tier namespaces where the default
          # 4-CPU / 8Gi budget is too small for the real footprint
          # of the workload (Longhorn managers + instance-managers,
          # cnpg operator, monitoring/prometheus, etc). Verified
          # 2026-07-11: longhorn-system's `default-quota` blocked
          # longhorn-manager pod recreation on worker1 (already at
          # 4028m requests.cpu). Same exclusion set as
          # [[homelab-generate-default-deny-netpol]] for consistency.
          - key: "{{ request.object.metadata.name }}"
            operator: AnyNotIn
            value:
              - kyverno
              - longhorn-system
              - longhorn-va-janitor
              - cnpg-system
              - cert-manager
              - external-secrets
              - trust-manager
              - trivy-system
              - clickhouse-operator
              - cloudflare-tunnel
              - csi-rclone-system
              - minio-on-nas
              - nfs-csi
              - spegel
              - backup-cronjobs
              - monitoring
              - observability-crowdsec
              - observability-benchmarks
              - observability-tempo
              - kube-system
              - argocd
              - openbao
              # Application namespaces are deliberately no longer listed here
              # (2026-08-27). Being named above is not a decision about a
              # workload's memory — it is a decision to skip the default and let
              # whatever else exists become the cap. What existed was the ADR-0036
              # component's `homelab-namespace-quota`: 32Gi, byte-identical in all
              # 21 namespaces that carry it, tuned for none of them. Nine apps were
              # governed by an untuned number nobody chose for them.
              #
              # An app that genuinely needs more than the default now says so in
              # its own repo, with the bypass annotation above and a quota sized
              # from `.status.used`. Two do: `immich` (24Gi — immich-server is 8Gi
              # by itself) and `conversation-history` (20Gi — two 4Gi CNPG pods
              # plus a 3Gi video lane).
              #
              # The seven removed were measured against the default first: all fit
              # on all four dimensions, the largest being authentik at 9Gi of 16Gi
              # and 1200m of 4 CPU. `langfuse` went with them — no such namespace
              # exists.
              #
              # `immich` stays for one more cycle, until its bypass annotation has
              # been observed live. The annotation is what protects it; this entry
              # only stops the two changes having to land in the same instant.
              - immich
      generate:
        apiVersion: v1
        kind: ResourceQuota
        name: default-quota
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          metadata:
            labels:
              homelab.internal/generated-by: kyverno
              homelab.internal/component: default-quota
            annotations:
              policies.kyverno.io/managed-by: homelab-generate-default-resourcequota
          spec:
            hard:
              requests.cpu: "4"
              requests.memory: 8Gi
              limits.memory: 16Gi
              count/pods: "50"
