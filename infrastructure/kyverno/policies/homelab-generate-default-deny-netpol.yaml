# Kyverno ClusterPolicy — auto-generate a default-deny NetworkPolicy into
# every first-party namespace
#
# Purpose:   When a Namespace with `homelab.internal/first-party: "true"`
#            is created/reconciled, generate a namespace-scoped
#            NetworkPolicy named `default-deny` if it does not exist.
# ADR:       0036 D10
# Rollout:   Audit -> Enforce after 2 weeks of clean PolicyReports
#
# Rationale: Paired with `homelab-require-namespace-default-deny-netpol`.
#            The K8s NetworkPolicy shape below denies ALL ingress and
#            egress by default; namespaces overlay named CNPs (or K8s
#            NetPols) on top to explicitly allow the traffic each pod
#            needs. Because Cilium CNPs are additive/OR (CLAUDE.md rule
#            15), the K8s deny below stays authoritative for "traffic
#            not covered by any allow" — it's the safety net when a CNP
#            is deleted or misapplied.
#
#            The `podSelector: {}` matches every pod in the namespace;
#            `policyTypes: [Ingress, Egress]` with empty `ingress`/
#            `egress` blocks means "deny both directions". This is the
#            canonical shape called out in K8s NetworkPolicy docs.
#
#            Egress will normally be re-opened for kube-dns / apiserver /
#            first-party dependencies via the namespace's shipped CNPs.
#            First-boot of a new namespace may see brief DNS failures
#            until the accompanying CNP arrives — this is intentional
#            (fail-closed) and matches the homelab's default-deny posture.
#
# Bypass:    Annotate the Namespace with
#              bypass.homelab.internal/homelab-generate-default-deny-netpol: "<reason>"

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: homelab-generate-default-deny-netpol
  annotations:
    policies.kyverno.io/title: "Namespace: auto-generate default-deny NetworkPolicy"
    policies.kyverno.io/category: "Network Security"
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: NetworkPolicy
    policies.kyverno.io/description: |
      When a Namespace with `homelab.internal/first-party: "true"` is
      created/updated, generate a default-deny NetworkPolicy named
      `default-deny`. `synchronize: true`. Bypass with
      `bypass.homelab.internal/homelab-generate-default-deny-netpol`.
spec:
  validationFailureAction: Audit
  background: true
  emitWarning: true
  generateExisting: true
  rules:
    - name: generate-default-deny-netpol
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels:
                  homelab.internal/first-party: "true"
      preconditions:
        all:
          - key: "{{ request.object.metadata.annotations.\"bypass.homelab.internal/homelab-generate-default-deny-netpol\" || '' }}"
            operator: Equals
            value: ""
          # Skip infrastructure-tier namespaces — they don't have the
          # Cilium CNPs that would re-open the required egress paths
          # (Kyverno-in-kyverno needs apiserver egress; longhorn needs
          # inter-worker etcd + iSCSI). Generating default-deny into
          # these breaks the cluster (verified 2026-07-10 — Kyverno's
          # own admission-controller couldn't reach the apiserver,
          # cascading admission failures to every ns). Infra tier gets
          # labels for classification but not the default-deny gate.
          # App-tier apps have their own Cilium CNP shipped alongside
          # each app manifest; those are the safe ns for this policy.
          - key: "{{ request.object.metadata.name }}"
            operator: AnyNotIn
            value:
              # Infrastructure tier — kernel/CSI/network dependencies,
              # no Cilium CNP layer to re-permit their egress.
              - kyverno
              - longhorn-system
              - longhorn-va-janitor
              - cnpg-system
              - cert-manager
              - external-secrets
              - trust-manager
              - trivy-system
              - clickhouse-operator
              - cloudflare-tunnel
              - csi-rclone-system
              - minio-on-nas
              - nfs-csi
              - spegel
              - backup-cronjobs
              - monitoring
              - observability-crowdsec
              - observability-benchmarks
              - observability-tempo
              - kube-system
              - argocd
              # App-tier but no complete Cilium CNP allowlist yet —
              # adding default-deny cuts off DNS + peer traffic and
              # cascades. Verified 2026-07-10:
              # - openbao-1/2 couldn't reach kube-DNS post-merge,
              #   quorum broke, ESO stalled.
              # - forgejo-pg entered "Failing over" and stuck as a
              #   split-brain (both pods self-promoted, no
              #   replication, ~2MB LSN divergence) — cnpg-system
              #   couldn't reach the instance status-probe port.
              # - nextcloud-pg + vaultwarden-pg reported
              #   "Instance Status Extraction Error" for the same
              #   cnpg-system-to-instance HTTP path.
              # CLAUDE.md rule 14: a namespace-wide podSelector:{}
              # policy conscripts operator pods (cnpg-system status
              # probes need :8000 ingress).
              # Opt these back in once each namespace ships a full
              # Cilium CNP allowlist that permits cnpg-system :8000
              # ingress + apiserver egress (443+6443) + kube-DNS.
              - openbao
              - approval-channel
              # CNPG-hosting namespaces (until per-ns CNPs cover the
              # cnpg-system operator paths):
              - authentik
              - forgejo
              - immich
              - langfuse
              - llm-gateway
              - nextcloud
              - observability-crowdsec
              - paperless
              - vaultwarden
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: default-deny
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          metadata:
            labels:
              homelab.internal/generated-by: kyverno
              homelab.internal/component: default-deny
            annotations:
              policies.kyverno.io/managed-by: homelab-generate-default-deny-netpol
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
              - Egress
