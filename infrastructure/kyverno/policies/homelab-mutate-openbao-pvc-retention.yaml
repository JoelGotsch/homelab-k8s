# Kyverno ClusterPolicy — stamp retention.homelab.internal/reason on
# OpenBao StatefulSet-owned PVCs
#
# Purpose:   OpenBao's Helm chart (`server.dataStorage` /
#            `server.auditStorage`) does not expose PVC-level
#            annotations. The Kyverno policy
#            `homelab-disallow-retain-reclaim-without-annotation` (ADR
#            0036 D1) requires PVCs on `longhorn-replica*-retain` to
#            carry `retention.homelab.internal/reason`. Every other
#            first-party app either sets the annotation via chart
#            values (Vaultwarden, Forgejo) or via CNPG inheritedMetadata
#            (CNPG clusters). OpenBao is the exception. This policy
#            fills the gap by mutating the annotation onto OpenBao's
#            PVCs at admission time.
# ADR:       0036 D1
# Rollout:   Ships Enforce-ready — mutations are idempotent and
#            non-blocking; unlike validators, there's no operator-
#            visible disruption on flip.
#
# Rationale: OpenBao raft data (`server.dataStorage`) + audit log
#            (`server.auditStorage`) are the highest-consequence
#            volumes in the cluster. Delete-on-PVC-delete would be
#            catastrophic; Retain is correct. The retention reason is
#            "OpenBao raft cluster state + audit log — irreplaceable
#            without a full restore-from-tier-3-backup ceremony (ADR
#            0018, runbook `openbao/routine-unseal.md`)." Documented
#            here rather than a values.yaml chart-schema patch because
#            the chart upstream doesn't own this concept.
#
# Bypass:    Set `bypass.homelab.internal/homelab-mutate-openbao-pvc-retention`
#            on the PVC — the mutation skips. (Practically never
#            needed; noted for uniform pattern with the other
#            homelab-* policies.)

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: homelab-mutate-openbao-pvc-retention
  annotations:
    policies.kyverno.io/title: "Stamp retention reason on OpenBao PVCs"
    policies.kyverno.io/category: "Storage / Longhorn"
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: PersistentVolumeClaim
    policies.kyverno.io/description: |
      Kyverno mutation: stamps
      `retention.homelab.internal/reason` on OpenBao raft-data and
      audit-log PVCs, since the Helm chart's `server.dataStorage` /
      `server.auditStorage` blocks don't expose PVC annotations.
      Matches PVCs in the `openbao` namespace with the
      `app.kubernetes.io/name: openbao` label. Idempotent.
spec:
  # Mutations don't validate — they patch. Admission-time only
  # (see the `mutate:` block for why background/targets is off).
  background: true
  rules:
    - name: stamp-openbao-pvc-retention-annotation
      match:
        any:
          - resources:
              kinds: [PersistentVolumeClaim]
              namespaces: [openbao]
              selector:
                matchLabels:
                  app.kubernetes.io/name: openbao
      preconditions:
        all:
          # Waiver escape hatch — matches the uniform bypass pattern.
          - key: "{{ request.object.metadata.annotations.\"bypass.homelab.internal/homelab-mutate-openbao-pvc-retention\" || '' }}"
            operator: Equals
            value: ""
          # Only mutate PVCs bound to a *-retain SC. Storage on
          # non-retain classes doesn't need this annotation.
          - key: "{{ request.object.spec.storageClassName || '' }}"
            operator: AnyIn
            value:
              - longhorn-replica2-retain
              - longhorn-replica3-retain
          # Don't overwrite an existing operator-set value.
          - key: "{{ request.object.metadata.annotations.\"retention.homelab.internal/reason\" || '' }}"
            operator: Equals
            value: ""
      mutate:
        # Admission-time mutation only: no `targets:` block.
        #
        # A `targets:` block asks Kyverno's background controller
        # to update objects OTHER THAN the admission request,
        # which needs `update` permission on v1/PersistentVolumeClaim
        # in `{{ns}}` that the chart's default RBAC does NOT grant.
        # Kyverno's admission webhook rejects the policy if the
        # background SA lacks the permission it advertises.
        #
        # Skipping `targets:` means:
        #  - New OpenBao PVCs get the retention annotation stamped
        #    at admission (the common case: chart bump, disaster
        #    recovery, node rebuild).
        #  - Already-created PVCs (30d+ old at time of first apply)
        #    are NOT mutated. Manually annotate them once:
        #      kubectl -n openbao annotate pvc data-openbao-0 \
        #        retention.homelab.internal/reason='<reason>'
        #    See runbook `openbao/routine-unseal.md` §"PVC
        #    annotation baseline".
        #
        # If we ever grant the background-controller PVC/update RBAC
        # (via a ClusterRoleBinding shipped from this repo), we can
        # re-add the `targets:` block and get the mutate-existing
        # semantics back.
        patchStrategicMerge:
          metadata:
            annotations:
              retention.homelab.internal/reason: |-
                OpenBao raft cluster state + audit log — irreplaceable
                without a full restore-from-tier-3-backup ceremony
                (ADR 0018; runbook openbao/routine-unseal.md). Stamped
                by Kyverno policy homelab-mutate-openbao-pvc-retention
                because the OpenBao Helm chart does not expose
                per-PVC annotations under server.{dataStorage,auditStorage}.
