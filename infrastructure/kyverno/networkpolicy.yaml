# RESOLVED 2026-07-18 — enforced after a three-layer fix + full audit ceremony.
# The 2026-07-17 rollout found enforcing this policy wedged first-party Pod
# CREATE (fail-closed mutating webhook timed out on cosign network I/O;
# llm-gateway 1/2 twice). Peeling the onion produced four fixes, each masked
# by the previous failure:
#   1. ctlog.ignoreSCT on the verify policy (4d76663) — static-key attestors
#      need no SCT check; without it cosign fetched the PUBLIC sigstore TUF
#      root on every cold cache, which this egress rightly blocks.
#   2. homelab-trust-bundle CA mount (3547d05) — the distroless kyverno image
#      trusted only public CAs, so registry.homelab.internal
#      (homelab-internal-issuer) x509-failed; verification had SILENTLY
#      failed in Audit mode since install.
#   3. registry pull credentials (1c8fe3d) — Forgejo Packages rejects
#      anonymous token grants for private repos; kyverno needs its own
#      dockerconfigjson (imageRegistryCredentials), containerd's node creds
#      don't apply.
#   4. webhookConfiguration.failurePolicy: Ignore (bd6961a) — with
#      failureAction: Audit, the Fail webhook bought zero security and full
#      wedge risk; a hung verification now costs bounded latency, never
#      cluster-wide create blockage. (admission: false would be cleaner but
#      kyverno rejects it for verifyImages rules.)
# NB the 2026-07-18 "registry pull hangs under enforcement" hypothesis was
# WRONG — that re-test ran while Argo selfHeal had reverted the then-
# uncommitted ignoreSCT (CLAUDE.md rule 8), so it was still the TUF fetch.
# Hubble evidence: the registry pull terminates at the gateway envoy
# (registry.homelab.internal -> cluster_ingress_ip; identity = reserved
# `ingress` entity, IDs 1677xxxx), i.e. the toEntities: [ingress] rule below
# is what actually matches it. The toFQDNs registry rule below likely NEVER
# matches (socket-LB DNATs the LB IP before egress policy eval — rule 13's
# egress twin); kept for now as documentation-of-intent, candidate for
# removal in the next netpol sweep.
# Ceremony result: 0 AUDIT with all flows exercised (admission, cold-cache
# registry pulls, background scans, scrape), enforced with 0 steady-state
# DROPPED, cold-cache verification round-trips completing under enforcement
# (PolicyReports fresh across namespaces). Remaining known gap — images are
# UNSIGNED (only cluster-mcp CI signs) — is a signing-rollout workstream,
# orthogonal to this policy.
#
# Default-deny + least-privilege for the kyverno namespace
# (netpol-audit.md MEDIUM-1 residual). Kyverno is the cluster's admission
# engine (ADR 0036) — the apiserver calls its webhooks on every admission, and
# it verifies first-party image signatures (cosign). With no policy it ran
# Cilium DEFAULT-ALLOW. This is a DRAFT.
#
# ROLLOUT IS OPERATOR-ATTENDED via Cilium PolicyAuditMode + Hubble (rules
# 14/35) — and kyverno is the HIGHEST wedge risk of the three MEDIUM-1-residual
# namespaces: if the apiserver->webhook ingress (:9443) is wrong, admission of
# EVERY object breaks (fail-closed webhooks time out); if the cosign registry
# egress is wrong, first-party image verification fails and those Pods are
# denied. Method mirrors platform/openbao/networkpolicy.yaml (openbao-server
# CNP): enable `cilium endpoint config <ep> PolicyAuditMode=Enabled` on the
# kyverno controller endpoints, apply this policy (evaluated-not-enforced),
# watch `hubble observe --namespace kyverno --verdict AUDIT` across admission
# traffic + a first-party image deploy (cosign pull) + report writes +
# Prometheus scrape, confirm ZERO unexpected AUDIT verdicts, then disable audit
# to enforce. Do NOT merge-and-apply blind.
#
# Flow set (chart 3.8.2; ports verified from the rendered Deployments — all four
# controllers share `app.kubernetes.io/part-of: kyverno`):
#   ingress <- kube-apiserver -> pod port 9443  (admission + cleanup webhooks;
#              the apiserver is a reserved entity — a namespaceSelector can NEVER
#              match it, so MUST be fromEntities — CLAUDE.md rule 12)
#   ingress <- monitoring -> :8000              (Prometheus scrape of metrics)
#   egress  -> kube-apiserver 443+6443           (watch policies + resources,
#                                                  write PolicyReports, SA token
#                                                  review, generate/mutate)
#   egress  -> kube-dns:53                        (+ toFQDNs proxy visibility)
#   egress  -> image registries (toFQDNs)         (cosign signature verification
#                                                  of first-party images —
#                                                  registry.homelab.internal +
#                                                  Forgejo Packages, per ADR 0019)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kyverno-default-deny
  namespace: kyverno
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kyverno-allow
  namespace: kyverno
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    # Prometheus scrape of kyverno metrics (:8000 on every controller).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8000
          protocol: TCP
  egress:
    # kube-dns.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# kube-apiserver ingress (to the webhooks, pod port 9443) + egress (all
# controllers), plus the cosign image-verification registry egress. All need
# either the reserved kube-apiserver entity or toFQDNs — native NetworkPolicy
# can't express either (CLAUDE.md rule 12).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kyverno-apiserver-registry
  namespace: kyverno
spec:
  endpointSelector: {}
  ingress:
    # apiserver -> admission/cleanup webhooks on POD port 9443 (socket-LB
    # DNATs the Service port before policy eval — rule 13).
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  egress:
    # All controllers reach the API server. BOTH 443 and 6443 (socket-LB
    # translates ClusterIP:443 -> backend:6443 before policy eval — rule 12).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # kube-dns with DNS-proxy visibility (rules.dns) so Cilium populates its
    # FQDN->IP cache for the toFQDNs rule below (companion rule — rule 15).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Image registries for cosign signature verification of first-party images
    # (ADR 0019 D3). The verify-first-party-image-signature policy pulls the
    # signature artifact from registry.homelab.internal and Forgejo Packages.
    # registry.homelab.internal is expressed as a toFQDNs allow; Forgejo
    # Packages is reached via its cluster Gateway (HTTPRoute on
    # forgejo.lab.<domain>), which arrives as the reserved `ingress` entity —
    # so the FQDN literal stays out of this GitOps file (domain-literal hook).
    # OPERATOR CONFIRMS the exact set via Hubble AUDIT during a first-party
    # image deploy and narrows/extends before enforcing.
    # registry-direct proxy (ADR 0038) — signature pulls go to the
    # dedicated registry path (LB 10.10.30.52 -> registry-direct pod
    # :8443, POD port per rule 13), NOT the gateway. Replaces the old
    # `toFQDNs registry.homelab.internal` rule, which never matched
    # (socket-LB DNATs the LB IP before egress policy eval) — under the
    # gateway path the flow rode the toEntities:[ingress] rule and got
    # 403'd at the Envoy (client-egress evaluated at the proxy upstream
    # hop; the trap that motivated ADR 0038). Inert until the operator's
    # unbound cutover flips DNS to 10.10.30.52.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: forgejo
            app.kubernetes.io/name: registry-direct
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    # Forgejo Packages via the cluster Gateway (reserved `ingress` entity).
    - toEntities:
        - ingress
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
