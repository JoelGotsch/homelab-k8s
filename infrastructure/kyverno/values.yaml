# Kyverno values.

# Kyverno's cleanup jobs (webhooksCleanup, policyReportsCleanup) default to
# bitnami/kubectl, which Bitnami sunset on docker.io (2025) — the old tags
# 404, so kyverno-clean-reports ImagePullBackOffs. Repoint to the
# bitnamilegacy archive (same tag). Added 2026-05-27.
webhooksCleanup:
  image:
    repository: bitnamilegacy/kubectl
policyReportsCleanup:
  image:
    repository: bitnamilegacy/kubectl

# Spread the admission stack across workers. Without this, the chart's
# default `preferred` podAntiAffinity (weight=1) is too weak — in the
# 2026-06-08 OpenBao incident, all 8 Kyverno pods (admission/background/
# cleanup/reports × 2 replicas) had landed on worker1. When worker1
# went briefly NotReady, every cluster write that traverses the
# admission webhook stalled until worker1 recovered, which is what
# wedged longhorn-manager and stuck the OpenBao VolumeAttachments.
# Full incident at 99-journal/2026-06-08-openbao-degradation.md and
# the root-cause analysis in TODO.md §Open incidents.
#
# topologySpreadConstraints with whenUnsatisfiable=ScheduleAnyway is
# soft enough that scheduling never blocks during a worker disruption
# (we keep availability even if only one worker is up), but strong
# enough that under normal conditions the scheduler keeps the
# per-controller replicas on distinct hosts.

# --- homelab CA trust (2026-07-18) ---
# The engine controllers (admission/background/reports) run cosign
# imageVerify, whose TLS client reads the container's system trust store.
# The distroless image ships only public CAs, so pulls from
# registry.homelab.internal (homelab-internal-issuer) x509-fail — signature
# verification silently failed in Audit mode on every cold cache.
# Mount trust-manager's `homelab-trust-bundle` ConfigMap (Mozilla defaults +
# homelab roots; see infrastructure/trust-manager/bundles.yaml) AS the
# /etc/ssl/certs directory: the bundle key is named ca-certificates.crt, so
# Go finds it at the default path. Directory mount (no subPath) => bundle
# rotation propagates to running pods. Replacing the directory is safe ONLY
# because the bundle includes the public defaults (forgejo.lab.<domain>
# serves the Let's Encrypt wildcard and must keep verifying).
# NOT the chart's global.caCertificates knob: its `volume` variant mounts a
# ConfigMap as a DIRECTORY at .../ca-certificates.crt (file path), which Go
# cannot read; its `data` variant would inline the whole Mozilla bundle here.

admissionController:
  replicas: 2
  extraVolumes:
    - name: homelab-trust-bundle
      configMap:
        name: homelab-trust-bundle
  extraVolumeMounts:
    - name: homelab-trust-bundle
      mountPath: /etc/ssl/certs
      readOnly: true
  resources:
    # ADR 0036 rollout raises admission-controller headroom.
    # Kyverno's admission path was previously 512Mi limit; with
    # the ten `homelab-*` ClusterPolicies at Audit + the two
    # ADR 0019 image-signature rules, sustained webhook load
    # can hit that ceiling under Argo sync bursts. 1Gi limit
    # + 100m/256Mi requests aligns with the ADR 0036 subagent
    # brief's "Kyverno admission-controller can hot under load".
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: admission-controller

backgroundController:
  replicas: 2
  # homelab CA trust — see the block comment above admissionController.
  extraVolumes:
    - name: homelab-trust-bundle
      configMap:
        name: homelab-trust-bundle
  extraVolumeMounts:
    - name: homelab-trust-bundle
      mountPath: /etc/ssl/certs
      readOnly: true
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: background-controller

cleanupController:
  replicas: 2
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: cleanup-controller

reportsController:
  replicas: 2
  # homelab CA trust — see the block comment above admissionController.
  # The reports-controller matters most long-term: after the verify policy
  # moves to background-only (admission: false), IT runs the cosign pulls.
  extraVolumes:
    - name: homelab-trust-bundle
      configMap:
        name: homelab-trust-bundle
  extraVolumeMounts:
    - name: homelab-trust-bundle
      mountPath: /etc/ssl/certs
      readOnly: true
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
  # Background reports evaluate Cilium network-policy resources. Kyverno
  # deliberately does not grant arbitrary CRD reads by default, so add only
  # the two exact kinds matched by homelab-disallow-open-egress-cnp.
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: [cilium.io]
          resources:
            - ciliumnetworkpolicies
            - ciliumclusterwidenetworkpolicies
          verbs: [get, list, watch]
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: reports-controller

config:
  resourceFiltersExcludeNamespaces:
    - kube-system
    - kyverno
