# Kyverno values.

# Kyverno's cleanup jobs (webhooksCleanup, policyReportsCleanup) default to
# bitnami/kubectl, which Bitnami sunset on docker.io (2025) — the old tags
# 404, so kyverno-clean-reports ImagePullBackOffs. Repoint to the
# bitnamilegacy archive (same tag). Added 2026-05-27.
webhooksCleanup:
  image:
    repository: bitnamilegacy/kubectl
policyReportsCleanup:
  image:
    repository: bitnamilegacy/kubectl

# Spread the admission stack across workers. Without this, the chart's
# default `preferred` podAntiAffinity (weight=1) is too weak — in the
# 2026-06-08 OpenBao incident, all 8 Kyverno pods (admission/background/
# cleanup/reports × 2 replicas) had landed on worker1. When worker1
# went briefly NotReady, every cluster write that traverses the
# admission webhook stalled until worker1 recovered, which is what
# wedged longhorn-manager and stuck the OpenBao VolumeAttachments.
# Full incident at 99-journal/2026-06-08-openbao-degradation.md and
# the root-cause analysis in TODO.md §Open incidents.
#
# topologySpreadConstraints with whenUnsatisfiable=ScheduleAnyway is
# soft enough that scheduling never blocks during a worker disruption
# (we keep availability even if only one worker is up), but strong
# enough that under normal conditions the scheduler keeps the
# per-controller replicas on distinct hosts.

admissionController:
  replicas: 2
  resources:
    # ADR 0036 rollout raises admission-controller headroom.
    # Kyverno's admission path was previously 512Mi limit; with
    # the ten `homelab-*` ClusterPolicies at Audit + the two
    # ADR 0019 image-signature rules, sustained webhook load
    # can hit that ceiling under Argo sync bursts. 1Gi limit
    # + 100m/256Mi requests aligns with the ADR 0036 subagent
    # brief's "Kyverno admission-controller can hot under load".
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: admission-controller

backgroundController:
  replicas: 2
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: background-controller

cleanupController:
  replicas: 2
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: cleanup-controller

reportsController:
  replicas: 2
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: reports-controller

config:
  resourceFiltersExcludeNamespaces:
    - kube-system
    - kyverno
