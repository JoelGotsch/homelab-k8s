# Kyverno values.

# Kyverno's cleanup jobs (webhooksCleanup, policyReportsCleanup) default to
# bitnami/kubectl, which Bitnami sunset on docker.io (2025) — the old tags
# 404, so kyverno-clean-reports ImagePullBackOffs. Repoint to the
# bitnamilegacy archive (same tag). Added 2026-05-27.
webhooksCleanup:
  image:
    repository: bitnamilegacy/kubectl
policyReportsCleanup:
  image:
    repository: bitnamilegacy/kubectl

admissionController:
  replicas: 2
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

backgroundController:
  replicas: 2
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

cleanupController:
  replicas: 2
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}

reportsController:
  replicas: 2
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}

config:
  resourceFiltersExcludeNamespaces:
    - kube-system
    - kyverno
