# Kyverno values.

# No `webhooksCleanup.image` override. One sat here from 2026-05-27
# (`repository: bitnamilegacy/kubectl`, for a bitnami/kubectl docker.io 404)
# until 2026-09-14. Chart 3.9.x defaults the pre-delete hook Jobs to
# `ghcr.io/kyverno/readiness-checker:<appVersion>`, so the override rendered
# `ghcr.io/bitnamilegacy/kubectl:v1.19.1` — a tag that does not exist. The
# hooks (`kyverno-rm-webhooks`, `kyverno-scale-to-zero`) run only on `helm
# uninstall`, which Argo never issues, so nothing ever pulled it. Verified
# 2026-09-14: the chart default renders `ghcr.io/kyverno/readiness-checker:
# v1.19.1`, which exists (manifest HTTP 200); ghcr.io is already pulled by
# 72 running containers via the Spegel mirror with upstream fallback.
# `policyReportsCleanup:` used to sit here with the same image override. It
# was dead config: neither chart 3.8.2 nor 3.9.0 has any such value (grep of
# both vendored charts, 2026-09-09 — zero references), so it rendered to
# nothing. Removed during the 3.9.0 bump rather than carried forward.

# Spread the admission stack across workers. Without this, the chart's
# default `preferred` podAntiAffinity (weight=1) is too weak — in the
# 2026-06-08 OpenBao incident, all 8 Kyverno pods (admission/background/
# cleanup/reports × 2 replicas) had landed on worker1. When worker1
# went briefly NotReady, every cluster write that traverses the
# admission webhook stalled until worker1 recovered, which is what
# wedged longhorn-manager and stuck the OpenBao VolumeAttachments.
# Full incident at 99-journal/2026-06-08-openbao-degradation.md and
# the root-cause analysis in TODO.md §Open incidents.
#
# topologySpreadConstraints with whenUnsatisfiable=ScheduleAnyway is
# soft enough that scheduling never blocks during a worker disruption
# (we keep availability even if only one worker is up), but strong
# enough that under normal conditions the scheduler keeps the
# per-controller replicas on distinct hosts.

# --- homelab CA trust (2026-07-18) ---
# The engine controllers (admission/background/reports) run cosign
# imageVerify, whose TLS client reads the container's system trust store.
# The distroless image ships only public CAs, so pulls from
# registry.homelab.internal (homelab-internal-issuer) x509-fail — signature
# verification silently failed in Audit mode on every cold cache.
# Mount trust-manager's `homelab-trust-bundle` ConfigMap (Mozilla defaults +
# homelab roots; see infrastructure/trust-manager/bundles.yaml) AS the
# /etc/ssl/certs directory: the bundle key is named ca-certificates.crt, so
# Go finds it at the default path. Directory mount (no subPath) => bundle
# rotation propagates to running pods. Replacing the directory is safe ONLY
# because the bundle includes the public defaults (forgejo.lab.<domain>
# serves the Let's Encrypt wildcard and must keep verifying).
# NOT the chart's global.caCertificates knob: its `volume` variant mounts a
# ConfigMap as a DIRECTORY at .../ca-certificates.crt (file path), which Go
# cannot read; its `data` variant would inline the whole Mozilla bundle here.

# --- Prometheus scrape (2026-09-14) ---
# All four controllers expose metrics on :8000 (`metrics-port`). The kyverno
# NetworkPolicy has admitted monitoring -> 8000 since 2026-07-18 and the
# Prometheus egress allowlist already carries 8000, but no ServiceMonitor
# existed, so nothing was ever scraped: `up{namespace="kyverno"}` returned no
# series. kube-prometheus-stack selects ServiceMonitors by
# `release: kube-prometheus-stack` (live `serviceMonitorSelector`, re-read
# 2026-09-14), hence `additionalLabels` on each controller's block.
admissionController:
  replicas: 2
  extraVolumes:
    - name: homelab-trust-bundle
      configMap:
        name: homelab-trust-bundle
  extraVolumeMounts:
    - name: homelab-trust-bundle
      mountPath: /etc/ssl/certs
      readOnly: true
  # The admission controller is the one controller whose resources live under
  # `container:` (it also has an initContainer), so the chart reads
  # `admissionController.container.resources` — templates/admission-controller/
  # deployment.yaml. A block at `admissionController.resources` sat here from
  # the ADR 0036 rollout until 2026-09-14 and RENDERED TO NOTHING: the live
  # Deployment carried the chart defaults the whole time (384Mi limit / 128Mi
  # request), never the "1Gi" the comment described, and the "previous 512Mi"
  # it cited had never existed live either. The other three controllers use
  # the top-level `<controller>.resources` key, which is why theirs applied.
  # Sizing: 7-day peak working set 183Mi against the 384Mi default; 512Mi is
  # headroom for Argo sync bursts, 256Mi request is what it actually needs
  # scheduled. `.helmcheckignore` now gates this layer so a dead key blocks
  # the commit instead of silently rendering to nothing.
  container:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: admission-controller

backgroundController:
  replicas: 2
  # homelab CA trust — see the block comment above admissionController.
  extraVolumes:
    - name: homelab-trust-bundle
      configMap:
        name: homelab-trust-bundle
  extraVolumeMounts:
    - name: homelab-trust-bundle
      mountPath: /etc/ssl/certs
      readOnly: true
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: background-controller

cleanupController:
  replicas: 2
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: cleanup-controller
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

reportsController:
  replicas: 2
  # homelab CA trust — see the block comment above admissionController.
  # The reports-controller matters most long-term: after the verify policy
  # moves to background-only (admission: false), IT runs the cosign pulls.
  extraVolumes:
    - name: homelab-trust-bundle
      configMap:
        name: homelab-trust-bundle
  extraVolumeMounts:
    - name: homelab-trust-bundle
      mountPath: /etc/ssl/certs
      readOnly: true
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
  # Background reports evaluate Cilium network-policy resources. Kyverno
  # deliberately does not grant arbitrary CRD reads by default, so add only
  # the two exact kinds matched by homelab-disallow-open-egress-cnp.
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: [cilium.io]
          resources:
            - ciliumnetworkpolicies
            - ciliumclusterwidenetworkpolicies
          verbs: [get, list, watch]
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: reports-controller

# --- Engine features (2026-09-14) ---
features:
  omitEvents:
    # Chart default omits PolicyApplied + PolicySkipped. PolicyViolation is
    # added because, measured 2026-09-14, Kyverno emitted 6,170 PolicyViolation
    # events/h = 72% of every Event object in etcd (7,610 of 10,077 at the
    # time of the change), and nothing consumed them: no policy-reporter, no
    # alert rule, no dashboard queries `reason=PolicyViolation`. The
    # PolicyReports / ClusterPolicyReports remain the record of violations
    # (`kubectl get policyreport -A`, `kubectl get clusterpolicyreport`), and
    # they are what policies/README.md's Enforce procedure reads. PolicyError
    # is deliberately kept: it is the one event type that signals the engine
    # itself failing (RBAC, apiCall, image pull), and it is rare.
    eventTypes:
      - PolicyApplied
      - PolicySkipped
      - PolicyViolation
  backgroundScan:
    # Chart default is `true`, i.e. the background scan IGNORES
    # `config.resourceFilters` and reports on everything the policies match.
    # Measured 2026-09-14: 573 of 1,330 PolicyReports were on ReplicaSets, 477
    # of those on zero-replica rollout history — reports about pods that no
    # longer exist, re-evaluated every scan. With `false` the background scan
    # honours the same filter list admission does; the default list excludes
    # ReplicaSet, Event, Node, Binding, TokenReview, the EphemeralReport kinds
    # and Kyverno's own objects, none of which any policy here matches
    # (verified against the live `kyverno` ConfigMap `resourceFilters` before
    # the change). NB the kube-system and kyverno namespaces are NOT in the
    # live list — `resourceFiltersExcludeNamespaces` below strips them — so
    # they stay policed and reported.
    skipResourceFilters: false
  # --- Kubernetes-native admission-policy generation (hl-0284 item 10, 2026-09-14) ---
  # Chart 3.9.1 defaults BOTH of these to true, and until this commit nothing
  # here overrode them: the live admission controller ran
  # `--generateValidatingAdmissionPolicy=true` and the reports controller
  # `--validatingAdmissionPolicyReports=true`. Decision: disable both,
  # deliberately, for the CEL policies this layer now consists of.
  #
  # Why not generate VAPs: generation is per-policy opt-in
  # (`spec.autogen.validatingAdmissionPolicy.enabled`) and mutually exclusive
  # with pod-controller autogen — Kyverno skips the VAP and says so in the
  # policy status. Three validators here (first-party digest, third-party
  # digest, unlimited-containers) rely on autogen to cover Deployments,
  # StatefulSets, CronJobs etc.; the three require-* validators read other
  # objects through `resource.List` and inline-secrets reads namespaceObject
  # labels, none of which the API server's CEL environment can do; the
  # Enforce allowlist policy is the one candidate that could compile to a
  # VAP, and putting one Deny policy on a second engine is not worth a second
  # failure mode. Evidence for the status quo: after 28 days with the flag
  # on, the cluster held exactly one VAP, Cilium's `gateway.cilium.io`, and
  # no Kyverno-generated one.
  #
  # Why not report on VAPs: with the flag on the reports controller also
  # evaluates every ValidatingAdmissionPolicy it can see (Cilium's) against
  # every matching object and writes the rows into the same PolicyReports;
  # nothing here consumes them, and the row source (`ValidatingAdmissionPolicy`)
  # is not something the Enforce procedure in policies/README.md reads.
  #
  # RBAC caveat, stated so nobody expects a shrink: the chart grants the
  # admission controller `validatingadmissionpolicies` /
  # `validatingadmissionpolicybindings` (and the mutating pair) in its
  # ClusterRole UNCONDITIONALLY — templates/admission-controller/clusterrole.yaml
  # carries the comment "Always grant permissions for admission policies to
  # support per-policy generation overrides even when global
  # generateValidatingAdmissionPolicy/generateMutatingAdmissionPolicy flags are
  # disabled". Flipping these flags changes what the controllers DO, not what
  # they MAY do. Removing that RBAC would mean patching the chart's ClusterRole,
  # which is outside this change.
  generateValidatingAdmissionPolicy:
    enabled: false
  validatingAdmissionPolicyReports:
    enabled: false

config:
  # Removes the chart's `[*/*,kube-system,*]` and `[*/*,kyverno,*]` entries
  # from `resourceFilters`, so both namespaces ARE subject to policy (the
  # helper name reads backwards: it excludes the namespace from the filter,
  # not from Kyverno).
  resourceFiltersExcludeNamespaces:
    - kube-system
    - kyverno
