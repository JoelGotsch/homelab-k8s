# Public half of the homelab cosign keypair, projected into
# the kyverno namespace as the Secret `cosign-public-key`.
# Per ADR 0019 D3.
#
# CONSUMED BY
#
#   policies/verify-first-party-image-signature.yaml — the
#   verifyImages rule references this Secret by
#   `attestors[].entries[].keys.secret: {name, namespace}`.
#   Kyverno reads the field `cosign.pub` (Kyverno-canonical
#   key name; not configurable on the policy side) and uses
#   the PEM contents as the verification key.
#
# SOURCE OF TRUTH
#
#   OpenBao kv/shared/cosign/key, field `public`. Seeded by
#   homelab-infra/scripts/seed-cosign-keypair.sh (one-shot
#   ceremony, refuse-if-exists, --rotate to regen).
#
# ROTATION
#
#   1. tier-A: ./scripts/seed-cosign-keypair.sh --rotate
#      (prints OLD public key first — keep it if you need
#      to verify historical signatures.)
#   2. tier-A: ./scripts/provision-woodpecker-repo.sh \
#        --config ansible/inventory/woodpecker-repos.yml
#      (pushes new private+password to Woodpecker repo
#       secrets; CI signs new builds with the new key.)
#   3. ESO syncs this Secret within the 1h refreshInterval,
#      OR force:
#        kubectl -n kyverno annotate externalsecret \
#          cosign-public-key force-sync=$(date +%s)
#   4. New signed images verify; old signed images fail
#      until rebuilt+resigned (matches the cosign rotation
#      story by design — Kyverno verifies against the
#      current trust anchor only).
#
# GOTCHA — KEY NAME
#
#   The Secret data field MUST be named exactly `cosign.pub`
#   (the cosign-canonical filename). Kyverno's
#   `attestors.entries.keys.secret` reads that exact key
#   name; it's not a configurable field on the policy side.
#   See `kubectl explain
#   clusterpolicy.spec.rules.verifyImages.attestors.entries.keys.publicKeys`:
#   "The named Secret must specify a key `cosign.pub`
#   containing the public key used for verification".

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cosign-public-key
  namespace: kyverno
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cosign-public-key
    creationPolicy: Owner
  data:
    # Kyverno expects the field name `cosign.pub`. Don't
    # rename without also editing the verifyImages policy
    # (and Kyverno does NOT let you override this name).
    - secretKey: cosign.pub
      remoteRef:
        key: shared/cosign/key
        property: public
