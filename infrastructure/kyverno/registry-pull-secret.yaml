# Registry credentials for kyverno's imageVerify signature pulls.
#
# NOT an imagePullSecret in the kubelet sense — kyverno's cosign verifier
# fetches the SIGNATURE artifact from registry.homelab.internal itself
# (go-containerregistry inside the engine controllers), and the Forgejo
# Packages registry rejects anonymous token grants for private repos
# (`GET /v2/token ... UNAUTHORIZED`, found 2026-07-18 once the CA mount
# fixed TLS; the failure was previously masked by x509, which was masked
# by the sigstore TUF fetch). Wired into the policy via
# `verifyImages[].imageRegistryCredentials.secrets` — kyverno resolves the
# named Secret in its own namespace.
#
# Source + bot: same as every other first-party pull consumer —
# kv/shared/forgejo-packages/ci {username, token}, the `ci-packages` bot
# (see apps/llm-gateway/registry-pull-secret.yaml for the dual-use
# rationale and the split-bot refactor trigger). Kyverno is a pull-only
# consumer; if the pull/push bot split ever happens, move this to the
# pull-scoped credential.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: registry-homelab-internal-pull
  namespace: kyverno
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: registry-homelab-internal-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "registry.homelab.internal": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: shared/forgejo-packages/ci
        property: username
    - secretKey: password
      remoteRef:
        key: shared/forgejo-packages/ci
        property: token
