# Registry credentials for kyverno's imageVerify signature pulls.
#
# NOT an imagePullSecret in the kubelet sense — kyverno's cosign verifier
# fetches the SIGNATURE artifact from the registry itself
# (go-containerregistry inside the engine controllers), and the Forgejo
# Packages registry rejects anonymous token grants for private repos
# (`GET /v2/token ... UNAUTHORIZED`, found 2026-07-18 once the CA mount
# fixed TLS; the failure was previously masked by x509, which was masked
# by the sigstore TUF fetch). Wired into the policy via
# `verifyImages[].imageRegistryCredentials.secrets` — kyverno resolves the
# named Secret in its own namespace.
#
# TWO `auths` ENTRIES, because the policy matches TWO hosts.
#
# verify-first-party-image-signature's `imageReferences` covers
# `registry.homelab.internal/*` AND `<forgejo_fqdn>/{homelab,forgejo-admin}/*`.
# go-containerregistry looks a credential up by the host in the IMAGE
# REFERENCE, not by the host of the token realm it is eventually sent to. With
# only the alias in this file, an apex-referenced image resolved to no
# credential, went anonymous, and the private-repo token grant refused it —
# measured 2026-08-20 with a server-side dry-run against the live webhook:
#
#   Warning: policy verify-first-party-image-signature.verify-cosign-static-key:
#     failed to verify image forgejo.lab.vyramo.com/homelab/llm-gateway@sha256:9caca03…:
#     .attestors[0].entries[0].keys: GET https://forgejo.lab.vyramo.com/v2/token
#     ?scope=repository%3Ahomelab%2Fllm-gateway%3Apull&service=container_registry:
#     UNAUTHORIZED:
#
# while the SAME image via `registry.homelab.internal` verified silently. That
# is the dangerous shape: with `failureAction: Audit` nothing is blocked, so an
# apex-referenced workload looks covered and is not verified at all. The apex
# glob is kept deliberately as a relapse tripwire — `conversation-history`
# shipped exactly that reference until 2026-08-15 — and a tripwire that cannot
# authenticate reports an auth error where a missing signature should be, which
# is indistinguishable from working policy until someone reads the warning.
#
# Both entries carry the same credential: the alias and the apex are the same
# Forgejo, reached over two paths (ADR 0038 gave the registry a dedicated L4
# path so it never traverses the gateway; the apex still does).
#
# The apex host is NOT typed here. It is the bare token `FORGEJO_FQDN`,
# resolved at build time from ConfigMap/site-config.data.forgejo_fqdn by the
# replacement in ../kyverno/kustomization.yaml (ADR 0045). Keep it the FIRST
# entry in the `auths` object — the replacement addresses it by
# `delimiter: '"'` token index, and that index counts from the start of the
# blob. See the replacement's comment before reordering this JSON.
#
# Source + bot: same as every other first-party pull consumer —
# kv/shared/forgejo-packages/ci {username, token}, the `ci-packages` bot
# (see apps/llm-gateway/registry-pull-secret.yaml for the dual-use
# rationale and the split-bot refactor trigger). Kyverno is a pull-only
# consumer; if the pull/push bot split ever happens, move this to the
# pull-scoped credential.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: registry-homelab-internal-pull
  namespace: kyverno
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: registry-homelab-internal-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "FORGEJO_FQDN": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              },
              "registry.homelab.internal": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: shared/forgejo-packages/ci
        property: username
    - secretKey: password
      remoteRef:
        key: shared/forgejo-packages/ci
        property: token
