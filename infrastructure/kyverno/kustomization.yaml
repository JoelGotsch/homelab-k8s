# Kyverno — admission policies for cosign verification +
# image digest pinning. Per ADR 0019 + ADR 0023.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: kyverno
    repo: https://kyverno.github.io/kyverno
    version: "3.8.2"  # OPERATOR PINS via Renovate
    releaseName: kyverno
    namespace: kyverno
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - clusterpolicies.yaml
  # ADR 0019 D3 — cosign verification.
  - externalsecret-cosign-public-key.yaml
  - policies/verify-first-party-image-signature.yaml
  # Audit-only: workloads with `httpGet path: /` probes that aren't
  # explicitly confirmed via probes.homelab.internal/root-route-confirmed
  # annotation. Surfaces the pr-agent-style silent kill-loop trap.
  - policies/audit-root-route-http-probes.yaml
  # Mutating: propagate `recurring-job-group.longhorn.io/*` labels
  # from PVCs onto the corresponding Longhorn Volume CRs. Fixes CNPG's
  # inheritedMetadata-doesn't-reach-Volume gap that caused the
  # 2026-06-25 PG/ClickHouse snapshot-delta PVC-bloat (#73).
  - policies/longhorn-volume-label-propagation.yaml
  # Enforce: digest-pinning REQUIRED for an operator-managed
  # allowlist of namespaces. Ratchet from audit (cluster-wide,
  # visibility) to enforce (allowlist, blocking). Add new
  # namespaces per 04-guides/digest-pin-enforce-allowlist.md.
  - policies/enforce-digest-pinning-allowlist.yaml
  # ADR 0036 — cluster-wide admission governance. All start in
  # Audit; see policies/ROLLOUT.md for the Enforce migration plan
  # and policies/README.md for the bypass-annotation convention.
  # Validators:
  - policies/homelab-require-namespace-limitrange.yaml
  - policies/homelab-require-namespace-resourcequota.yaml
  - policies/homelab-require-namespace-default-deny-netpol.yaml
  - policies/homelab-disallow-open-egress-cnp.yaml
  - policies/homelab-disallow-unlimited-containers.yaml
  - policies/homelab-warn-unlimited-cpu.yaml
  - policies/homelab-disallow-retain-reclaim-without-annotation.yaml
  - policies/homelab-disallow-inline-secrets.yaml
  # Generators (paired with the require-* validators above):
  - policies/homelab-generate-default-limitrange.yaml
  - policies/homelab-generate-default-resourcequota.yaml
  - policies/homelab-generate-default-deny-netpol.yaml
  # Mutation policies (admission-time only; see the file's `mutate:`
  # comment for why we don't ship `targets:` / mutate-existing —
  # would require background-controller PVC/update RBAC we haven't
  # granted):
  - policies/homelab-mutate-openbao-pvc-retention.yaml
