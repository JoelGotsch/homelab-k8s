# Kyverno — admission policies for cosign verification +
# image digest pinning. Per ADR 0019 + ADR 0023.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: kyverno
    # ADR 0052 D3: chart from the Forgejo Packages mirror (was https://kyverno.github.io/kyverno).
    repo: oci://registry.homelab.internal/homelab
    version: "3.9.0"  # OPERATOR PINS via Renovate
    releaseName: kyverno
    namespace: kyverno
    valuesFile: values.yaml
    includeCRDs: true

resources:
  # netpol-audit.md MEDIUM-1 residual: default-deny + least-privilege.
  # RE-WIRED 2026-07-18 after the three verification-path fixes landed
  # (ctlog.ignoreSCT, homelab-trust-bundle CA mount, registry pull creds +
  # webhook failurePolicy: Ignore) and a full PolicyAuditMode ceremony passed:
  # 0 AUDIT with all flows exercised, then enforced with 0 steady-state drops
  # and cold-cache verification round-trips completing. Resolution record in
  # networkpolicy.yaml's header.
  - networkpolicy.yaml
  - clusterpolicies.yaml
  # ADR 0019 D3 — cosign verification.
  - externalsecret-cosign-public-key.yaml
  # Registry creds for imageVerify signature pulls — private Forgejo
  # Packages repos reject anonymous token grants (2026-07-18).
  - registry-pull-secret.yaml
  - policies/verify-first-party-image-signature.yaml
  # Audit-only: workloads with `httpGet path: /` probes that aren't
  # explicitly confirmed via probes.homelab.internal/root-route-confirmed
  # annotation. Surfaces the pr-agent-style silent kill-loop trap.
  - policies/audit-root-route-http-probes.yaml
  # Mutating: propagate `recurring-job-group.longhorn.io/*` labels
  # from PVCs onto the corresponding Longhorn Volume CRs. Fixes CNPG's
  # inheritedMetadata-doesn't-reach-Volume gap that caused the
  # 2026-06-25 PG/ClickHouse snapshot-delta PVC-bloat (#73).
  - policies/longhorn-volume-label-propagation.yaml
  # Enforce: digest-pinning REQUIRED for an operator-managed
  # allowlist of namespaces. Ratchet from audit (cluster-wide,
  # visibility) to enforce (allowlist, blocking). Add new
  # namespaces per 04-guides/digest-pin-enforce-allowlist.md.
  - policies/enforce-digest-pinning-allowlist.yaml
  # ADR 0036 — cluster-wide admission governance. All start in
  # Audit; see policies/ROLLOUT.md for the Enforce migration plan
  # and policies/README.md for the bypass-annotation convention.
  # Validators:
  - policies/homelab-require-namespace-limitrange.yaml
  - policies/homelab-require-namespace-resourcequota.yaml
  - policies/homelab-require-namespace-default-deny-netpol.yaml
  - policies/homelab-disallow-open-egress-cnp.yaml
  - policies/homelab-disallow-unlimited-containers.yaml
  - policies/homelab-disallow-retain-reclaim-without-annotation.yaml
  - policies/homelab-disallow-inline-secrets.yaml
  # Generators (paired with the require-* validators above):
  - policies/homelab-generate-default-limitrange.yaml
  - policies/homelab-generate-default-resourcequota.yaml
  - policies/homelab-generate-default-deny-netpol.yaml
  # Mutation policies (admission-time only; see the file's `mutate:`
  # comment for why we don't ship `targets:` / mutate-existing —
  # would require background-controller PVC/update RBAC we haven't
  # granted):
  - policies/homelab-mutate-openbao-pvc-retention.yaml
  # ADOPTED 2026-09-12 (hl-0282). This policy has been in git since 9c928dd
  # (2026-06-04) and referenced by nothing, so Argo never rendered it and the
  # live object was hand-applied — `managedFields` showed
  # `kubectl-client-side-apply` + `kyverno` and no `argocd-controller`. It is a
  # MUTATE, so it was changing admission on every matching pod from outside
  # git. Adoption is behaviour-neutral: live-vs-file `spec` differs only in
  # Kyverno-defaulted fields (`admission`, `emitWarning`,
  # `skipBackgroundRequests`, `validationFailureAction`).
  #
  # Do NOT delete it as obsolete. Verified firing 2026-09-12 by server dry-run:
  # a pod in ci-woodpecker is admitted with
  # `{"options":[{"name":"ndots","value":"1"}]}` and the identical pod in
  # `default` gets no dnsConfig at all. The namespace had zero pods at the
  # time — absence of pods is not absence of effect.
  #
  # It compensates for the DNS search-list trap (ADR 0061 D2 / hl-0016): all
  # six nodes currently read `search: homelab.internal`, but that value lives
  # in the PLATFORM layer (`talosctl get resolverspecs`), i.e. the DHCP lease,
  # so it is one renewal from changing. Retire this only when D2 makes the
  # resolver declared rather than leased.
  - policies/ci-woodpecker-dns-ndots.yaml

# site-config: build-only ConfigMap for the imageReferences replacement below
# (ADR 0045). Marked local-config, so it is used for substitution and never
# emitted — the render is byte-identical apart from the value it resolves.
components:
  - ../../components/site-config

# Resolve the apex Forgejo host in verify-first-party-image-signature's
# imageReferences globs from the single site-config: `FORGEJO_FQDN/homelab/*`
# -> `<forgejo_fqdn>/homelab/*`. Provenance is one hop: this rule ->
# ConfigMap/site-config.data.forgejo_fqdn -> components/site-config/site-config.env.
#
# Each glob is selected BY ITS OWN VALUE, not by list index, so a later-added
# imageReferences entry cannot silently shift the target: a selector that stops
# matching is a hard `kustomize build` error ("unable to find field ... in
# replacement target"), which is exactly the failure mode a render step lacks.
# `delimiter: '/', index: 0` swaps only the host token, leaving the org and the
# glob in the manifest where a reviewer can see them.
replacements:
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.forgejo_fqdn }
    targets:
      - select: { kind: ClusterPolicy, name: verify-first-party-image-signature }
        fieldPaths:
          - spec.rules.[name=verify-cosign-static-key].verifyImages.0.imageReferences.[=FORGEJO_FQDN/homelab/*]
          - spec.rules.[name=verify-cosign-static-key].verifyImages.0.imageReferences.[=FORGEJO_FQDN/forgejo-admin/*]
        options: { delimiter: '/', index: 0 }

  # Same host into the imageVerify pull credential's `auths` map. Kyverno
  # matches the apex glob above; go-containerregistry then looks the credential
  # up by the host in the IMAGE REFERENCE, so without an entry keyed on the
  # apex it goes anonymous and Forgejo refuses the private-repo token grant
  # (`GET /v2/token …: UNAUTHORIZED`, measured 2026-08-20). Under
  # `failureAction: Audit` that reads as a policy warning rather than an
  # outage, so the apex tripwire silently verified nothing.
  #
  # The target is a JSON blob, and a replacement can substitute a
  # delimiter-token of a blob but never a substring — so this is an INDEX, not
  # a value selector, and it is index-fragile in a way the globs above are not.
  # `delimiter: '"'` splits the whole `.dockerconfigjson` string on the quote
  # character: token 1 is `auths`, token 3 is the first host key. Anything
  # inserted BEFORE that key shifts it. `FORGEJO_FQDN` must therefore stay the
  # FIRST entry in the `auths` object; re-verify the render if you reorder it.
  #
  # Verified by rendering: the emitted ExternalSecret's `auths` object carries
  # `<forgejo_fqdn>` and `registry.homelab.internal`, and the live server-side
  # dry-run of an apex-referenced Pod warns no more.
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.forgejo_fqdn }
    targets:
      - select: { kind: ExternalSecret, name: registry-homelab-internal-pull }
        fieldPaths:
          - spec.target.template.data.[.dockerconfigjson]
        options: { delimiter: '"', index: 3 }
