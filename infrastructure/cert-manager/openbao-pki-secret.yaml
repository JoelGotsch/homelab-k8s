# Token Secret for cert-manager → OpenBao Kubernetes auth.
# The actual token is auto-created by Kubernetes for the
# cert-manager ServiceAccount (we annotate the SA with the
# magic Kubernetes token-creator annotation).
#
# OpenBao auth/kubernetes/role/cert-manager is bound to
# this SA in the openbao namespace per
# 09b-argocd-bootstrap.yml.

apiVersion: v1
kind: Secret
metadata:
  name: cert-manager-token
  namespace: cert-manager
  annotations:
    kubernetes.io/service-account.name: cert-manager
type: kubernetes.io/service-account-token
---
# OpenBao CA cert that signs the OpenBao server's TLS cert.
# Pre-cert-manager-bootstrap: this is the self-signed cert
# from generate-openbao-bootstrap-tls.sh (per D6 in journal).
# Post-rotation: replaced with cert-manager-issued cert.
#
# OPERATOR FILLS the data.ca.crt content post-bootstrap-cert
# generation (or stages via external-secrets ExternalSecret
# pulling from openbao kv/prod/cert-manager/openbao-ca).
apiVersion: v1
kind: Secret
metadata:
  name: openbao-ca-cert
  namespace: cert-manager
type: Opaque
