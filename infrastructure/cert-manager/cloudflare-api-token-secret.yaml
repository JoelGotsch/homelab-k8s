# Placeholder Secret for the Cloudflare DNS-01 API token used
# by the `letsencrypt-production` ClusterIssuer.
#
# DO NOT FILL IN THIS FILE.
#
# This manifest exists so Argo CD's kustomize can render and
# apply it as a known resource. The actual token is seeded at
# bootstrap by:
#
#     homelab-infra/scripts/seed-cloudflare-api-token.sh
#
# which reads the operator's SOPS-encrypted token from
# homelab-infra/secrets/cloudflare-api-token.sops.yaml and
# creates this Secret directly via `kubectl create secret`
# (operator-attended, Nitrokey touch).
#
# Post-bootstrap (once OpenBao + ESO are up): an
# ExternalSecret replaces the manual seed. The Secret keeps
# the same name (`cloudflare-api-token`) and key (`api-token`)
# so cert-manager's reference doesn't change.
#
# To rotate: revoke + recreate in Cloudflare dashboard →
# update OpenBao kv path `secret/shared/cloudflare/api-token`
# → ESO syncs within its refresh interval (default 1h) →
# cert-manager picks up on next reconcile.
#
# Per ADR 0034 D4.

apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
  annotations:
    # Tell Argo CD not to touch existing values on this Secret
    # — the seed-script (and later ESO) own the data. Argo CD
    # asserts only that the Secret exists with the right
    # metadata.
    argocd.argoproj.io/sync-options: ServerSideApply=true,RespectIgnoreDifferences=true
    homelab.local/managed-by: |-
      Pre-OpenBao bootstrap: homelab-infra/scripts/seed-cloudflare-api-token.sh
      Post-OpenBao bootstrap: ExternalSecret in this directory (TODO)
type: Opaque
stringData:
  # Placeholder. The real value is written by the seed script
  # at bootstrap time. If this manifest applies first via Argo
  # CD before the seed-script runs, the Secret will hold this
  # placeholder until the seed-script overwrites it — which
  # will cause cert-manager DNS-01 challenges to fail until
  # then. That's expected during a fresh bootstrap; surface
  # as a known intermediate state in
  # 09b-argocd-bootstrap.yml ordering.
  api-token: <CLOUDFLARE_API_TOKEN_OPERATOR_SEEDS_VIA_SCRIPT>
