# cert-manager — Helm chart + the OpenBao-PKI ClusterIssuer
# for cluster-internal mTLS.
#
# The Let's Encrypt ClusterIssuer (operator-facing certs per
# ADR 0034 D1) lives in homelab-infra/ansible/files/
# letsencrypt-clusterissuer.yaml.j2 and is rendered + applied
# by 09b-argocd-bootstrap.yml — NOT reconciled by Argo CD —
# so the operator's ACME-registration email doesn't land in
# this GitOps repo.
#
# The downstream `cloudflare-api-token` Secret in this
# namespace is Ansible-seeded ONCE at cold-start (via
# homelab-infra/scripts/seed-cloudflare-api-token.sh reading
# homelab_secrets.cloudflare_api_token from secrets.sops.yaml),
# then taken over by ESO from OpenBao path
# kv/shared/cloudflare/api-token via
# externalsecret-cloudflare-api-token.yaml below — same Secret
# name, so the LE ClusterIssuer reference is stable across the
# handoff. Token rotation: edit kv only; ESO re-projects.
#
# Same discipline as cilium-overrides + openbao-overrides:
# bootstrap infrastructure with operator-private values stays
# Ansible-rendered.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: "v1.21.0"  # OPERATOR PINS via Renovate
    releaseName: cert-manager
    namespace: cert-manager
    valuesFile: values.yaml
    includeCRDs: true

resources:
  # OpenBao-PKI ClusterIssuer (cluster-internal mTLS only)
  - clusterissuer.yaml
  - openbao-pki-secret.yaml
  # Cloudflare API token for the Ansible-owned LE ClusterIssuer
  # — ESO takes over from the cold-start seed script.
  - externalsecret-cloudflare-api-token.yaml
  # netpol-audit.md MEDIUM-1 residual: default-deny + least-privilege.
  - networkpolicy.yaml
  # Local CA that issues OpenBao's own server TLS. Independent of OpenBao so
  # renewal can never depend on the cert being renewed.
  - openbao-tls-issuer.yaml
