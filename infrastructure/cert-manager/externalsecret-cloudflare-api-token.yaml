# Cloudflare API token for cert-manager's Let's Encrypt DNS-01
# solver. Consumed by the LE ClusterIssuer's
# `solvers[0].dns01.cloudflare.apiTokenSecretRef` (Secret name
# `cloudflare-api-token`, key `api-token`) — that ClusterIssuer
# is rendered + applied by
# homelab-infra/ansible/playbooks/09b-argocd-bootstrap.yml from
# ansible/files/letsencrypt-clusterissuer.yaml.j2 and stays
# Ansible-owned per ADR 0034 D1 (operator email + ACME state).
#
# Pre-OpenBao bootstrap path (cold-start before OpenBao is up):
#   homelab-infra/scripts/seed-cloudflare-api-token.sh reads
#   homelab_secrets.cloudflare_api_token from secrets.sops.yaml
#   and writes the Secret directly. That ceremony is still
#   needed once at cold-start to unblock LE issuance before
#   OpenBao + ESO exist.
#
# Post-OpenBao steady state (this manifest): ESO projects
# kv/shared/cloudflare/api-token (field `api-token`) into the
# same Secret name, replacing whatever the seed script wrote.
# refreshInterval 1h follows the layer's convention.
#
# Token rotation: `bao kv put kv/shared/cloudflare/api-token
# api-token=<new>`; ESO re-projects within 1h. cert-manager
# re-reads on next renewal attempt.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: shared/cloudflare/api-token
        property: api-token
