apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kargo
  namespace: kargo
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: ingress
      sectionName: https
  hostnames: [kargo.FQDN_SUFFIX]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: kargo-api
          port: 80
