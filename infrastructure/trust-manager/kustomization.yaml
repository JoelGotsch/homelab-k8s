# trust-manager — distributes trust bundles (CA certs) as
# ConfigMaps across namespaces. Lets apps trust the homelab
# Root CA without each one duplicating the cert.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: trust-manager
    # ADR 0052 D3: chart from the Forgejo Packages mirror (was https://charts.jetstack.io).
    repo: oci://registry.homelab.internal/homelab

    version: "v0.24.0"  # OPERATOR PINS via Renovate
    releaseName: trust-manager
    namespace: trust-manager
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - namespace.yaml
  - bundles.yaml
  - openbao-ca-bundle.yaml
  - networkpolicy.yaml
