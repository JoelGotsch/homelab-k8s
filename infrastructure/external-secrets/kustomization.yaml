# external-secrets — bridges OpenBao kv/* to Kubernetes
# Secrets via ExternalSecret CRDs.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: external-secrets
    # ADR 0052 D3: chart from the Forgejo Packages mirror (was https://charts.external-secrets.io).
    repo: oci://registry.homelab.internal/homelab

    version: "0.10.5" # OPERATOR PINS via Renovate
    releaseName: external-secrets
    namespace: external-secrets
    valuesFile: values.yaml
    includeCRDs: true
resources:
  - namespace.yaml
  - clustersecretstore.yaml
  - networkpolicy.yaml
