# ClusterSecretStore — operator's main OpenBao kv backend.
# Per identity.md / ADR 0018.
#
# Apps create ExternalSecret resources referencing this store
# to pull from kv/data/<path>.

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: kv
      version: v2
      caProvider:
        type: Secret
        name: openbao-ca-cert
        namespace: external-secrets
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# OpenBao CA cert (same content as cert-manager's; both
# components verify OpenBao's TLS).
# Pre-cert-manager-rotation: bootstrap self-signed CA.
# Post-rotation: cert-manager-issued.
apiVersion: v1
kind: Secret
metadata:
  name: openbao-ca-cert
  namespace: external-secrets
type: Opaque
stringData:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    <OPERATOR-FILLS-FROM-OPENBAO-BOOTSTRAP-CA>
    -----END CERTIFICATE-----
