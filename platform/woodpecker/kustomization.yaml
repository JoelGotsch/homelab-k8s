# Woodpecker CI — server + agent + step-Pod runner namespace.
# Per ADR 0023 D2 + D5 + D6 + D8 + D9.
#
# Helm chart: woodpeckerci/woodpecker.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: namespace: not set globally because resources span
# `woodpecker` and `ci-woodpecker` namespaces. Each manifest
# declares its own metadata.namespace.

helmCharts:
  - name: woodpecker
    # ADR 0052 D3: chart from the Forgejo Packages mirror (was https://woodpecker-ci.org/).
    repo: oci://registry.homelab.internal/homelab
    version: "3.6.5"  # OPERATOR PINS via Renovate (chart 3.6.5)
    releaseName: woodpecker
    namespace: woodpecker
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - namespace.yaml
  - rbac.yaml
  - quota.yaml
  - externalsecret.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml

# ADR 0036 deferred here: the shared first-party-namespace
# component assumes a single target namespace, but this
# kustomization spans TWO namespaces (`woodpecker` control
# plane + `ci-woodpecker` step-Pod runner) and does not set a
# top-level `namespace:`. Wiring the component in would render
# LimitRange/ResourceQuota with an unspecified namespace,
# colliding with the ci-woodpecker `quota.yaml` reference
# implementation (ADR 0023 D5 authoritative for step Pods).
#
# Follow-up: split into a small overlay that scopes the shared
# component to `woodpecker` (control plane) only. Punch-list
# item — kept out of scope for the initial ADR 0036 sweep to
# avoid unintended cross-ns admission surface.

# Build-only ConfigMap for the HTTPRoute-hostname replacement below.
components:
  - ../../components/site-config

# Resolve the HTTPRoute hostname from the single site-config (no hardcoded
# domain): `woodpecker.FQDN_SUFFIX` -> `woodpecker.<fqdn_suffix>`. Provenance: this
# rule -> ConfigMap/site-config.data.fqdn_suffix -> components/site-config/site-config.env.
replacements:
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.fqdn_suffix }
    targets:
      - select: { kind: HTTPRoute, name: woodpecker }
        fieldPaths: [spec.hostnames.0]
        options: { delimiter: '.', index: 1 }
      # WOODPECKER_HOST, from values.yaml, fixed up in the rendered env. The
      # route and the server's own idea of its public URL now come from one
      # key, so they cannot drift apart into an OAuth callback mismatch.
      - select: { kind: StatefulSet, name: woodpecker-server }
        fieldPaths:
          - spec.template.spec.containers.[name=server].env.[name=WOODPECKER_HOST].value
        options: { delimiter: '.', index: 1 }
  # Forgejo host in the CI step-pod FQDN egress policy. Selected BY VALUE
  # (`[matchName=FORGEJO_FQDN]`), never by index and never by `*` over the
  # toFQDNs list: that list also holds pypi.org, ghcr.io and ~25 more, and a
  # `*` there rewrites every one of them to the Forgejo host — kustomize exits
  # 0 and only a `pip install` timing out 28h later shows it (lessons.md,
  # "A `*` in a `replacements` fieldPath overwrites the whole list").
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.forgejo_fqdn }
    targets:
      - select: { kind: CiliumNetworkPolicy, name: ci-woodpecker-egress-fqdn }
        fieldPaths:
          - spec.egress.*.toFQDNs.[matchName=FORGEJO_FQDN].matchName
      # WOODPECKER_FORGEJO_URL, from values.yaml. Same source key as the egress
      # rule above on purpose: the FQDN the server clones from and the FQDN the
      # step pods are allowed to reach must be the same host, or CI fails with a
      # network timeout that looks like anything but a policy drop.
      - select: { kind: StatefulSet, name: woodpecker-server }
        fieldPaths:
          - spec.template.spec.containers.[name=server].env.[name=WOODPECKER_FORGEJO_URL].value
        options: { delimiter: '/', index: 2 }
