# NetworkPolicies for Woodpecker server + agent + step Pods.
# Per ADR 0023 D5.
#
# Implemented as CiliumNetworkPolicy (not vanilla NetworkPolicy)
# because Cilium Gateway API traffic carries the reserved
# `ingress` identity, NOT the source namespace identity. K8s
# NetPol's `namespaceSelector: kubernetes.io/metadata.name=ingress`
# silently drops Gateway → woodpecker-server traffic (503 / 5s
# timeout). See homelab-k8s/platform/authentik/networkpolicy.yaml
# for the canonical write-up.

# Server: ingress from Cilium Gateway (UI) + Forgejo
# (webhooks). Egress: kube-DNS + Forgejo + agent grpc.
#
# INERT SINCE DAY ONE (found 2026-09-12): this policy and woodpecker-agent
# below select `app.kubernetes.io/name: woodpecker` + `component`, labels the
# chart never renders — it emits name=server|agent + instance=woodpecker. They
# have run default-allow throughout. Evidence is the Cilium agent, NOT the
# CiliumEndpoint: on Cilium 1.20 `kubectl get cep` carries no policy status for
# any endpoint (empty even on woodpecker-pg-1, which enforces both ways);
# `cilium-dbg endpoint get <id>` on the node shows only crowdsec-banned-deny +
# allow-any-ingress for both pods (2026-09-13). Correcting the two
# endpointSelectors enforces, for the first time, rule sets never observed
# under audit — an attended PolicyAuditMode rollout (TODO hl-0291), not a label
# fix. Until then the two are reasoned exemptions in
# scripts/selector-exemptions.yaml.
#
# hl-0291 WINDOW COMMIT: this revision flips both endpointSelectors to the
# rendered labels and drops the exemptions. Merge it ONLY inside the attended
# window, with audit mode already on (scripts/cilium-policy-audit.sh):
#   enable woodpecker woodpecker-server-0 woodpecker-agent-0 -> merge -> Argo
#   Synced -> status (both pods list this policy) -> real pipeline + UI login
#   -> observe woodpecker (expect OK) -> disable -> observe again.
#
# 2026-09-13 (hl-0291 prep, still inert): the IN-RULE selectors are corrected
# to the rendered labels (agent<->server gRPC used the same unrendered labels,
# so fixing only endpointSelector would have dropped the agent), and the rule
# set is checked against a Hubble capture of the live default-allow flows
# (hubble observe -n woodpecker on worker2, 2026-09-13 16:05-16:18Z — two
# server restarts, Forgejo webhooks and API traffic inside it; every SYN seen
# is listed, all FORWARDED):
#   host            -> server :8000   kubelet probes (host is always allowed)
#   ingress entity  -> server :8000   UI through the Gateway
#   forgejo pods    -> server :8000   webhooks
#   agent           -> server :9000   gRPC
#   prometheus      -> server :9001   PodMonitor scrape
#   kube-apiserver  -> server :9001   `kubectl get --raw .../proxy/metrics`
#   server -> woodpecker-pg :5432
#   agent  -> kube-apiserver :6443  step-pod management
#   server -> 10.10.30.50:443 (Gateway VIP, forge API + OAuth token refresh).
#     Hubble shows it as `world` under default-allow; under audit the kyverno
#     rollout proved such a flow matches `toEntities: [ingress]`, and the
#     Gateway then evaluates the CLIENT's egress to the backend Forgejo pod
#     (ADR 0038) — which is why the forgejo :3000 rule stays alongside it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: woodpecker-server
  namespace: woodpecker
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: server
      app.kubernetes.io/instance: woodpecker
  ingress:
    # Cilium Gateway envoy — reserved `ingress` identity.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Forgejo (webhooks).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: forgejo
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "9000"
              protocol: TCP
    # Agent grpc (rendered labels: name=agent + instance=woodpecker).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agent
            app.kubernetes.io/instance: woodpecker
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # Prometheus scrape of the dedicated metrics listener (podmonitor.yaml).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9001"
              protocol: TCP
    # API-server proxy to the same listener — the operator's no-port-forward
    # metrics read (`kubectl get --raw
    # /api/v1/namespaces/woodpecker/pods/woodpecker-server-0:9001/proxy/metrics`),
    # observed in the 2026-09-13 capture. Read-only metrics, 9001 only.
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "9001"
              protocol: TCP
  egress:
    # kube-DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Forgejo for OAuth + git metadata. WOODPECKER_FORGEJO_URL is the
    # Gateway-routed FQDN, so the connection leaves for the Gateway VIP
    # (`ingress` entity, :443) and the Gateway then checks this pod's egress
    # to the Forgejo backend (:3000, ADR 0038) — both rules are needed.
    - toEntities:
        - ingress
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: forgejo
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # woodpecker-pg (CNPG) — the server's datastore since 2026-09-12.
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: woodpecker-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# Agent: ingress only from server (grpc). Egress: kube-DNS +
# server + kube-API (to manage step Pods in ci-woodpecker).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: woodpecker-agent
  namespace: woodpecker
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agent
      app.kubernetes.io/instance: woodpecker
  # No ingress rules — agent receives no inbound traffic.
  egress:
    # kube-DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Server grpc (rendered labels: name=server + instance=woodpecker).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: server
            app.kubernetes.io/instance: woodpecker
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # kube-API — agent talks to it to create/delete step pods.
    # Cilium has a reserved `kube-apiserver` entity for this;
    # cleaner than the vanilla-NetPol "any 443" hack.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
---
# CI step Pods (ci-woodpecker ns): ingress only from sibling
# step Pods of the same pipeline; egress to kube-DNS + Forgejo
# (git clone) + sibling step Pods + curated upstream registries
# (CCNP toFQDNs in the second policy below).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ci-woodpecker-default
  namespace: ci-woodpecker
spec:
  endpointSelector: {}
  ingress:
    # Sibling step Pods in this namespace. A Woodpecker `services:`
    # entry (a database, a broker) runs as its OWN Pod with its own
    # Service, and the step that uses it connects by that name — so
    # "step pods receive no inbound traffic", which this policy said
    # until 2026-08-14, is only true of pipelines without services.
    # conversation-history is the first repo here to declare one: its
    # integration suite needs a real Postgres (no Docker socket on the
    # k8s backend, so testcontainers cannot work). Without this rule
    # the connection is DROPPED, not refused, so the symptom is a
    # bare `psycopg.errors.ConnectionTimeout` with a service whose own
    # logs say "ready to accept connections" — 199 errors and an
    # 11-minute step before anything says "network".
    #
    # Scoped to this namespace, which holds nothing but ephemeral CI
    # step Pods that are already free to run arbitrary pipeline code.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ci-woodpecker
  egress:
    # Sibling step Pods — the other half of the rule above.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ci-woodpecker
    # kube-DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Forgejo for git-clone (HTTPS) + Forgejo Packages push.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: forgejo
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # The internal chart mirror, registry.homelab.internal (ADR 0038/0052),
    # for the A7 `mirror-charts` pipeline. The name resolves to the LB VIP
    # 10.10.30.52 and Cilium's socket-LB DNATs that to the registry-direct
    # pod on :8443 BEFORE egress policy is evaluated, so the destination to
    # allow is that endpoint — the `matchName: registry.homelab.internal`
    # toFQDNs entry this policy carried until 2026-09-11 could never match
    # (lessons.md §Cilium, the same trap Renovate hit on 2026-08-24).
    # Needs the matching ingress rule in platform/forgejo/networkpolicy.yaml.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: forgejo
            app.kubernetes.io/name: registry-direct
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
# todo-agents Windmill deploy: Cilium Gateway traffic is evaluated twice.
# The client-to-Gateway hop carries the reserved `ingress` identity; Envoy's
# upstream hop to windmill-app is then evaluated against the original CI pod's
# identity.  Missing either rule produces Envoy's plaintext HTTP 403 before a
# request reaches Windmill.  Scope this exception to Woodpecker's built-in
# repo + step labels rather than granting every CI pod Windmill access. The
# agent sanitizes `homelab/todo-agents` to `homelab-todo-agents` for the
# Kubernetes label value (v3.18.1 pipeline/backend/kubernetes toLabelValue;
# v3.15 stripped the slash instead, and the 2026-09-12 upgrade left this rule
# selecting nothing — scripts/check-woodpecker-app-egress.py now derives the
# value and pins the agent version). Both the push deploy and nightly
# model-variable drift step need the same two hops.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ci-woodpecker-todo-agents-windmill
  namespace: ci-woodpecker
spec:
  endpointSelector:
    matchLabels:
      woodpecker-ci.org/repo-full-name: homelab-todo-agents
    matchExpressions:
      - key: woodpecker-ci.org/step
        operator: In
        values: [wmill-push, wmill-drift]
  egress:
    - toEntities:
        - ingress
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: windmill
            app.kubernetes.io/name: windmill-app
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
# homelab-skills eval gate: the corpus calls a real model before CI may move a
# skill's Langfuse `production` label (plan §5.10).
#
# ONE hop, not two, unlike the todo-agents rule above. That rule crosses the
# Cilium Gateway, so its traffic is evaluated twice and needs both the
# client-to-Gateway (`ingress` identity) and Envoy-to-backend rules. This one
# goes pod-to-pod to the in-cluster LiteLLM Service, so there is no Gateway in
# the path and a second rule would be dead policy.
#
# That is also the answer to plan §5.10's open question "how CI reaches a
# model", whose premise was wrong: it assumed the Woodpecker runner had to be
# on the tailnet to reach the Mac Studio. It does not. The runner talks to
# llm-gateway, and llm-gateway talks to the Mac Studio — CI never needs a route
# to the Mac at all, and never holds a credential for one. The whole
# requirement collapses to this single in-cluster rule.
#
# Scoped to the `evals` step of one repository, same as the todo-agents
# exception: the agent sanitizes `homelab/homelab-skills` to
# `homelab-homelab-skills` for the label value (v3.18.1 toLabelValue; see the
# todo-agents rule above for the v3.15 difference).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ci-woodpecker-homelab-skills-evals
  namespace: ci-woodpecker
spec:
  endpointSelector:
    matchLabels:
      woodpecker-ci.org/repo-full-name: homelab-homelab-skills
    matchExpressions:
      - key: woodpecker-ci.org/step
        operator: In
        values: [evals]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: llm-gateway
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
---
# CCNP for ci-woodpecker step Pods: FQDN-based egress to
# upstream package registries. Same shape as the renovate
# layer's CCNP — operator extends the toFQDNs list when a
# pipeline references an unlisted registry.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ci-woodpecker-egress-fqdn
  namespace: ci-woodpecker
spec:
  endpointSelector: {}
  egress:
    # kube-DNS — Cilium needs to see the DNS query to
    # populate its FQDN→IP cache for the toFQDNs rules below.
    - toEndpoints:
        - matchLabels:
            "io.kubernetes.pod.namespace": kube-system
            "k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    # Common registries CI step pods consult.
    - toFQDNs:
        # Forgejo (git clone via public hostname).
        # Step pods clone using `WOODPECKER_FORGEJO_URL`
        # (https://forgejo.lab.vyramo.com), which resolves to
        # the Cilium Gateway VIP. Traffic egresses to the
        # gateway and re-enters the cluster to Forgejo.
        # `ci-woodpecker-default` allows the in-cluster
        # forgejo-ns shortcut, but Woodpecker hardcodes the
        # public clone URL from Forgejo's ROOT_URL, so we
        # also need it here for FQDN-based egress to work.
        - matchName: "FORGEJO_FQDN"   # <- site-config replacement (kustomization.yaml)
        # The internal chart mirror (registry.homelab.internal) is NOT listed
        # here: it resolves to a Service VIP, which a toFQDNs rule can never
        # match. It is a toEndpoints rule in ci-woodpecker-default above. A
        # `matchName` for it sat here from ADR 0052 A7 until 2026-09-11 and
        # admitted nothing.
        # ── Upstream Helm chart hosts ────────────────────────────────────
        # Every `upstream:` in a charts.lock.yaml the A7 `mirror-charts`
        # pipeline runs against: this repo's 26 entries plus one per app repo.
        # mirror-chart.sh pulls from these and pushes to the mirror above.
        #
        # RESOLVED, NOT ASSUMED (2026-08-20): for most Helm indexes the host
        # serving index.yaml is NOT the host serving the .tgz, so every index
        # below was actually fetched and its pinned entry's `urls:` read. Three
        # shapes came back.
        #
        # (a) RELATIVE urls — the index host serves the tarball too, and is the
        #     only host needed.
        - matchName: "charts.jetstack.io"        # cert-manager, trust-manager
        - matchName: "helm.cilium.io"            # cilium
        - matchName: "pkgs.tailscale.com"        # tailscale-operator
        - matchName: "charts.min.io"             # minio
        - matchName: "kyverno.github.io"         # kyverno
        #
        # (b) ABSOLUTE github.com urls — the index host is needed for
        #     index.yaml AND github.com for the release asset, which 302s to
        #     release-assets.githubusercontent.com. All three of those GitHub
        #     hosts are already allowed further down; these are the index hosts.
        - matchName: "guerzon.github.io"         # vaultwarden (pilot repo)
        - matchName: "nextcloud.github.io"       # nextcloud-k8s
        - matchName: "jellyfin.github.io"        # jellyfin-k8s
        - matchName: "windmill-labs.github.io"   # windmill-k8s
        - matchName: "docs.altinity.com"         # altinity-clickhouse-operator
        - matchName: "cloudnative-pg.github.io"  # cloudnative-pg, plugin-barman-cloud
        - matchName: "charts.external-secrets.io"
        - matchName: "charts.longhorn.io"        # longhorn
        - matchName: "aquasecurity.github.io"    # trivy-operator
        - matchName: "grafana.github.io"         # alloy, loki, tempo
        - matchName: "crowdsecurity.github.io"   # crowdsec
        - matchName: "prometheus-community.github.io"  # kube-prometheus-stack
        - matchName: "langfuse.github.io"        # langfuse
        - matchName: "open-telemetry.github.io"  # opentelemetry-collector
        - matchName: "charts.goauthentik.io"     # authentik
        - matchName: "openbao.github.io"         # openbao
        - matchName: "woodpecker-ci.org"         # woodpecker
        #
        # (c) OCI — no index at all, just a registry. ghcr.io (csi-rclone,
        #     spegel, immich, paperless-ngx, litellm-helm) and its blob host
        #     pkg-containers.githubusercontent.com are already allowed below.
        - matchName: "code.forgejo.org"          # forgejo chart
        #
        # csi-driver-nfs is the odd one out: its `upstream` already IS
        # raw.githubusercontent.com, allowed below for other reasons.
        #
        # A host missing from this list fails as a TCP TIMEOUT rather than a
        # policy error — the DNS visibility rule above keeps resolution working
        # — so it reads as a slow upstream, not as a firewall. Add a new chart
        # host HERE, in the same commit as the charts.lock.yaml entry.
        # Container registries
        - matchName: "registry-1.docker.io"
        - matchName: "auth.docker.io"
        - matchName: "production.cloudflare.docker.com"
        # Docker Hub migrated buildkit blob serving from Cloudflare
        # to CloudFront in 2026 (verified 2026-06-11 during the
        # pr-agent-build pipeline's first docker-buildx run, which
        # pulled moby/buildkit:buildx-stable-1 fine but failed
        # fetching the layer blob with "dial tcp 99.84.91.38:443:
        # i/o timeout" — that IP is a CloudFront edge node). Keep
        # the cloudflare line too; Docker still uses it for some
        # blob requests during the same build session.
        - matchName: "production.cloudfront.docker.com"
        - matchName: "ghcr.io"
        - matchName: "pkg-containers.githubusercontent.com"
        - matchName: "registry.k8s.io"
        - matchName: "quay.io"
        - matchName: "cdn03.quay.io"
        - matchName: "gcr.io"
        # Language-package registries
        - matchName: "pypi.org"
        - matchName: "files.pythonhosted.org"
        - matchName: "registry.npmjs.org"
        # OSV vulnerability database — conversation-history's `dependency-scan`
        # step POSTs its SBOM's package names and versions to the batch query
        # API (2026-09-20). Public package coordinates only, same class as the
        # indexes above. It had been assumed reachable because its neighbours
        # are, and timed out in pipelines 368 and 374: reaching N named hosts is
        # no evidence of reach to the next one. A plain step pod, so it resolves
        # through kube-dns and needs no CIDR fallback.
        - matchName: "api.osv.dev"
        # Terraform provider index — homelab-infra's `terraform init` step
        # (2026-09-13, TODO hl-0295; it had never run). Only the index: the
        # one provider, hetznercloud/hcloud, downloads from GitHub release
        # assets (allowlisted below). A hashicorp/* provider would also need
        # releases.hashicorp.com.
        - matchName: "registry.terraform.io"
        # Ansible Galaxy — homelab-infra's `render-equality` step runs
        # `ansible-galaxy install -r ansible/requirements.yml` (TODO hl-0299,
        # operator-approved 2026-09-14). Two hops, traced with `curl -L` from
        # the laptop that day: the API and artifact URL on galaxy.ansible.com
        # 302 (via /api/pulp/content/) to a signed S3 URL on the dualstack
        # bucket host below. The `ansible-galaxy.s3.amazonaws.com` a pipeline
        # comment had proposed since July is NOT on that path.
        - matchName: "galaxy.ansible.com"
        - matchName: "ansible-galaxy-ng.s3.dualstack.us-east-1.amazonaws.com"
        # Prisma engine binaries CDN — `prisma generate` downloads
        # platform-specific schema-engine + query-engine from here
        # at build time. Added 2026-06-29 for llm-gateway v0.0.11
        # (Cloudflare-fronted, separate from production.cloudflare
        # which covers Docker Hub).
        - matchName: "binaries.prisma.sh"
        # GitHub (release archives, source for github-tags
        # / github-releases datasources, git+https deps)
        - matchName: "api.github.com"
        - matchName: "objects.githubusercontent.com"
        # GitHub release-asset downloads 302 from github.com to THIS host
        # since GH moved assets off objects.* — found 2026-07-18 when the
        # cosign-sign step's pinned-binary wget silently timed out (the
        # exact "new CDN needs an allowlist edit" class this file warns
        # about). Probe-verified from inside the ns before adding.
        - matchName: "release-assets.githubusercontent.com"
        - matchName: "codeload.github.com"
        - matchName: "github.com"
        - matchName: "raw.githubusercontent.com"
        # OS package mirrors (apt/apk during image build).
        # Operator extends per pipeline image base (Alpine,
        # Debian, etc.).
        - matchName: "deb.debian.org"
        - matchName: "security.debian.org"
        - matchName: "dl-cdn.alpinelinux.org"
        # CDN backends. Build containers spawned by buildkit get
        # `dockerd --dns <pod-IP>` instead of the cluster Service
        # DNS, so Cilium's L7 FQDN proxy doesn't follow CNAME chains
        # — when apt asks for `deb.debian.org` it gets the Fastly
        # CNAME, queries again, and the resolved IPs aren't tagged
        # against the original matchName. Explicit pattern coverage
        # for the Debian mirror CDN (verified 2026-06-11 during
        # pr-agent-build pipeline #6 — "Could not connect to
        # debian.map.fastlydns.net:80"). Same pattern applies to
        # Cloudflare/CloudFront for Alpine + Docker mirrors but
        # those are already covered via the registry block above.
        - matchPattern: "*.fastlydns.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
    # CIDR fallback for Fastly's anycast block. The FQDN
    # matchPattern above SHOULD cover *.fastlydns.net but Cilium's
    # FQDN proxy doesn't track CNAME chains when the build pod's
    # DNS resolution goes through buildkit's embedded dockerd
    # resolver rather than directly through kube-dns — so the
    # resolved IPs never get associated with the matched FQDN.
    # 151.101.0.0/16 is Fastly's main anycast block (covers
    # debian-cdn, alpine, npm-cdn, etc.). 199.232.0.0/16 is its
    # secondary range. Verified 2026-06-11 by pipeline #7 still
    # timing out on 151.101.66.132 even with the matchPattern in
    # place. Narrower than ideal — revisit if Cilium L7 DNS proxy
    # learns CNAME-chain tracking, but it's a small CIDR.
    - toCIDR:
        - "151.101.0.0/16"
        - "199.232.0.0/16"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
---
# CNPG DB-pod lockdown for woodpecker-pg (2026-09-12), the forgejo-pg-cnpg
# quad verbatim with the names swapped — that policy went through the
# attended PolicyAuditMode rollout on 2026-07-17 and the barman-plugin
# migration on 2026-08-15, so this rule set is the observed one, not a
# guess. Unlike the server and agent policies above, this one selects pods
# that exist (`cnpg.io/cluster` is what CNPG stamps) and enforces from the
# cluster's first pod; `hubble observe -n woodpecker --verdict DROPPED` is
# the post-apply check, and the barman lane proof is
# scripts/verify-cnpg-backup-lane.sh woodpecker woodpecker-pg woodpecker.
#
# The quad (netpol-best-practices.md checklist E):
#   ingress  cnpg-system  -> 8000 (instance manager/status) + 9187 (metrics)
#   ingress  monitoring   -> 9187 (Prometheus scrape)
#   ingress  in-ns client -> 5432 (Postgres) + peer 5432 (replication)
#   egress   kube-apiserver 443 AND 6443 (socket-LB pre-translation)
#   egress   kube-dns 53 UDP+TCP
#   egress   minio-on-nas 9000 (barman WAL/base-backup archiving)
#   egress   peer cnpg.io/cluster 5432 + 8000 (replication + coordination)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: woodpecker-pg-cnpg
  namespace: woodpecker
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: woodpecker-pg
  ingress:
    # CNPG operator (cnpg-system) — instance-manager status :8000 + metrics.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "9187"
              protocol: TCP
    # Prometheus scrape of the CNPG metrics exporter.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
    # In-namespace clients (the server, the one-off migration Job) +
    # streaming replication between instances — both hit pod port 5432.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: woodpecker
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Peer instance-manager coordination on :8000 (instance->instance).
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: woodpecker-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    # kube-apiserver — instance manager reads its Cluster CR. BOTH 443 and
    # 6443 (socket-LB DNATs ClusterIP:443 -> :6443 before policy eval).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # kube-dns.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # MinIO (minio-on-nas) — barman WAL + base-backup archiving.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: minio-on-nas
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # Peer instance: streaming replication on 5432 + coordination on 8000.
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: woodpecker-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
