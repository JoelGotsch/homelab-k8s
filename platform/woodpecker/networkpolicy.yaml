# NetworkPolicies for Woodpecker server + agent + step Pods.
# Per ADR 0023 D5.
#
# Implemented as CiliumNetworkPolicy (not vanilla NetworkPolicy)
# because Cilium Gateway API traffic carries the reserved
# `ingress` identity, NOT the source namespace identity. K8s
# NetPol's `namespaceSelector: kubernetes.io/metadata.name=ingress`
# silently drops Gateway → woodpecker-server traffic (503 / 5s
# timeout). See homelab-k8s/platform/authentik/networkpolicy.yaml
# for the canonical write-up.

# Server: ingress from Cilium Gateway (UI) + Forgejo
# (webhooks). Egress: kube-DNS + Forgejo + agent grpc.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: woodpecker-server
  namespace: woodpecker
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: woodpecker
      app.kubernetes.io/component: server
  ingress:
    # Cilium Gateway envoy — reserved `ingress` identity.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Forgejo (webhooks).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: forgejo
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "9000"
              protocol: TCP
    # Agent grpc.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: woodpecker
            app.kubernetes.io/component: agent
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
  egress:
    # kube-DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Forgejo for OAuth + git metadata.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: forgejo
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
# Agent: ingress only from server (grpc). Egress: kube-DNS +
# server + kube-API (to manage step Pods in ci-woodpecker).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: woodpecker-agent
  namespace: woodpecker
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: woodpecker
      app.kubernetes.io/component: agent
  # No ingress rules — agent receives no inbound traffic.
  egress:
    # kube-DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Server grpc.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: woodpecker
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # kube-API — agent talks to it to create/delete step pods.
    # Cilium has a reserved `kube-apiserver` entity for this;
    # cleaner than the vanilla-NetPol "any 443" hack.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
---
# CI step Pods (ci-woodpecker ns): ingress only from sibling
# step Pods of the same pipeline; egress to kube-DNS + Forgejo
# (git clone) + sibling step Pods + curated upstream registries
# (CCNP toFQDNs in the second policy below).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ci-woodpecker-default
  namespace: ci-woodpecker
spec:
  endpointSelector: {}
  ingress:
    # Sibling step Pods in this namespace. A Woodpecker `services:`
    # entry (a database, a broker) runs as its OWN Pod with its own
    # Service, and the step that uses it connects by that name — so
    # "step pods receive no inbound traffic", which this policy said
    # until 2026-08-14, is only true of pipelines without services.
    # conversation-history is the first repo here to declare one: its
    # integration suite needs a real Postgres (no Docker socket on the
    # k8s backend, so testcontainers cannot work). Without this rule
    # the connection is DROPPED, not refused, so the symptom is a
    # bare `psycopg.errors.ConnectionTimeout` with a service whose own
    # logs say "ready to accept connections" — 199 errors and an
    # 11-minute step before anything says "network".
    #
    # Scoped to this namespace, which holds nothing but ephemeral CI
    # step Pods that are already free to run arbitrary pipeline code.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ci-woodpecker
  egress:
    # Sibling step Pods — the other half of the rule above.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ci-woodpecker
    # kube-DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Forgejo for git-clone (HTTPS) + Forgejo Packages push.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: forgejo
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
# todo-agents Windmill deploy: Cilium Gateway traffic is evaluated twice.
# The client-to-Gateway hop carries the reserved `ingress` identity; Envoy's
# upstream hop to windmill-app is then evaluated against the original CI pod's
# identity.  Missing either rule produces Envoy's plaintext HTTP 403 before a
# request reaches Windmill.  Scope this exception to Woodpecker 3.15's built-in
# repo + step labels rather than granting every CI pod Windmill access. The
# backend sanitizes `homelab/todo-agents` to `homelabtodo-agents` for the
# Kubernetes label value (pipeline/backend/kubernetes.toDNSName). Both the
# push deploy and nightly model-variable drift step need the same two hops.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ci-woodpecker-todo-agents-windmill
  namespace: ci-woodpecker
spec:
  endpointSelector:
    matchLabels:
      woodpecker-ci.org/repo-full-name: homelabtodo-agents
    matchExpressions:
      - key: woodpecker-ci.org/step
        operator: In
        values: [wmill-push, wmill-drift]
  egress:
    - toEntities:
        - ingress
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: windmill
            app.kubernetes.io/name: windmill-app
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
# CCNP for ci-woodpecker step Pods: FQDN-based egress to
# upstream package registries. Same shape as the renovate
# layer's CCNP — operator extends the toFQDNs list when a
# pipeline references an unlisted registry.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ci-woodpecker-egress-fqdn
  namespace: ci-woodpecker
spec:
  endpointSelector: {}
  egress:
    # kube-DNS — Cilium needs to see the DNS query to
    # populate its FQDN→IP cache for the toFQDNs rules below.
    - toEndpoints:
        - matchLabels:
            "io.kubernetes.pod.namespace": kube-system
            "k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    # Common registries CI step pods consult.
    - toFQDNs:
        # Forgejo (git clone via public hostname).
        # Step pods clone using `WOODPECKER_FORGEJO_URL`
        # (https://forgejo.lab.vyramo.com), which resolves to
        # the Cilium Gateway VIP. Traffic egresses to the
        # gateway and re-enters the cluster to Forgejo.
        # `ci-woodpecker-default` allows the in-cluster
        # forgejo-ns shortcut, but Woodpecker hardcodes the
        # public clone URL from Forgejo's ROOT_URL, so we
        # also need it here for FQDN-based egress to work.
        - matchName: "FORGEJO_FQDN"   # <- site-config replacement (kustomization.yaml)
        # The internal chart mirror (ADR 0052). Needed by the ADR 0045/0052 A7
        # `mirror-charts` pipeline: on a charts.lock.yaml bump it runs
        # mirror-chart.sh, which pulls from upstream and pushes to the mirror,
        # then check-chart-lock.sh --online resolves every pin against it.
        # Without this the pipeline fails at its first `helm pull` — and it
        # fails as a TCP timeout, not a policy error, because the DNS
        # visibility rule keeps resolution working (see lessons.md).
        - matchName: "registry.homelab.internal"
        # ── Upstream Helm chart hosts ────────────────────────────────────
        # Every `upstream:` in a charts.lock.yaml the A7 `mirror-charts`
        # pipeline runs against: this repo's 26 entries plus one per app repo.
        # mirror-chart.sh pulls from these and pushes to the mirror above.
        #
        # RESOLVED, NOT ASSUMED (2026-08-20): for most Helm indexes the host
        # serving index.yaml is NOT the host serving the .tgz, so every index
        # below was actually fetched and its pinned entry's `urls:` read. Three
        # shapes came back.
        #
        # (a) RELATIVE urls — the index host serves the tarball too, and is the
        #     only host needed.
        - matchName: "charts.jetstack.io"        # cert-manager, trust-manager
        - matchName: "helm.cilium.io"            # cilium
        - matchName: "pkgs.tailscale.com"        # tailscale-operator
        - matchName: "charts.min.io"             # minio
        - matchName: "kyverno.github.io"         # kyverno
        #
        # (b) ABSOLUTE github.com urls — the index host is needed for
        #     index.yaml AND github.com for the release asset, which 302s to
        #     release-assets.githubusercontent.com. All three of those GitHub
        #     hosts are already allowed further down; these are the index hosts.
        - matchName: "guerzon.github.io"         # vaultwarden (pilot repo)
        - matchName: "nextcloud.github.io"       # nextcloud-k8s
        - matchName: "jellyfin.github.io"        # jellyfin-k8s
        - matchName: "docs.altinity.com"         # altinity-clickhouse-operator
        - matchName: "cloudnative-pg.github.io"  # cloudnative-pg, plugin-barman-cloud
        - matchName: "charts.external-secrets.io"
        - matchName: "charts.longhorn.io"        # longhorn
        - matchName: "aquasecurity.github.io"    # trivy-operator
        - matchName: "grafana.github.io"         # alloy, loki, tempo
        - matchName: "crowdsecurity.github.io"   # crowdsec
        - matchName: "prometheus-community.github.io"  # kube-prometheus-stack
        - matchName: "langfuse.github.io"        # langfuse
        - matchName: "open-telemetry.github.io"  # opentelemetry-collector
        - matchName: "charts.goauthentik.io"     # authentik
        - matchName: "openbao.github.io"         # openbao
        - matchName: "woodpecker-ci.org"         # woodpecker
        #
        # (c) OCI — no index at all, just a registry. ghcr.io (csi-rclone,
        #     spegel, immich, paperless-ngx, litellm-helm) and its blob host
        #     pkg-containers.githubusercontent.com are already allowed below.
        - matchName: "code.forgejo.org"          # forgejo chart
        #
        # csi-driver-nfs is the odd one out: its `upstream` already IS
        # raw.githubusercontent.com, allowed below for other reasons.
        #
        # A host missing from this list fails as a TCP TIMEOUT rather than a
        # policy error — the DNS visibility rule above keeps resolution working
        # — so it reads as a slow upstream, not as a firewall. Add a new chart
        # host HERE, in the same commit as the charts.lock.yaml entry.
        # Container registries
        - matchName: "registry-1.docker.io"
        - matchName: "auth.docker.io"
        - matchName: "production.cloudflare.docker.com"
        # Docker Hub migrated buildkit blob serving from Cloudflare
        # to CloudFront in 2026 (verified 2026-06-11 during the
        # pr-agent-build pipeline's first docker-buildx run, which
        # pulled moby/buildkit:buildx-stable-1 fine but failed
        # fetching the layer blob with "dial tcp 99.84.91.38:443:
        # i/o timeout" — that IP is a CloudFront edge node). Keep
        # the cloudflare line too; Docker still uses it for some
        # blob requests during the same build session.
        - matchName: "production.cloudfront.docker.com"
        - matchName: "ghcr.io"
        - matchName: "pkg-containers.githubusercontent.com"
        - matchName: "registry.k8s.io"
        - matchName: "quay.io"
        - matchName: "cdn03.quay.io"
        - matchName: "gcr.io"
        # Language-package registries
        - matchName: "pypi.org"
        - matchName: "files.pythonhosted.org"
        - matchName: "registry.npmjs.org"
        # Prisma engine binaries CDN — `prisma generate` downloads
        # platform-specific schema-engine + query-engine from here
        # at build time. Added 2026-06-29 for llm-gateway v0.0.11
        # (Cloudflare-fronted, separate from production.cloudflare
        # which covers Docker Hub).
        - matchName: "binaries.prisma.sh"
        # GitHub (release archives, source for github-tags
        # / github-releases datasources, git+https deps)
        - matchName: "api.github.com"
        - matchName: "objects.githubusercontent.com"
        # GitHub release-asset downloads 302 from github.com to THIS host
        # since GH moved assets off objects.* — found 2026-07-18 when the
        # cosign-sign step's pinned-binary wget silently timed out (the
        # exact "new CDN needs an allowlist edit" class this file warns
        # about). Probe-verified from inside the ns before adding.
        - matchName: "release-assets.githubusercontent.com"
        - matchName: "codeload.github.com"
        - matchName: "github.com"
        - matchName: "raw.githubusercontent.com"
        # OS package mirrors (apt/apk during image build).
        # Operator extends per pipeline image base (Alpine,
        # Debian, etc.).
        - matchName: "deb.debian.org"
        - matchName: "security.debian.org"
        - matchName: "dl-cdn.alpinelinux.org"
        # CDN backends. Build containers spawned by buildkit get
        # `dockerd --dns <pod-IP>` instead of the cluster Service
        # DNS, so Cilium's L7 FQDN proxy doesn't follow CNAME chains
        # — when apt asks for `deb.debian.org` it gets the Fastly
        # CNAME, queries again, and the resolved IPs aren't tagged
        # against the original matchName. Explicit pattern coverage
        # for the Debian mirror CDN (verified 2026-06-11 during
        # pr-agent-build pipeline #6 — "Could not connect to
        # debian.map.fastlydns.net:80"). Same pattern applies to
        # Cloudflare/CloudFront for Alpine + Docker mirrors but
        # those are already covered via the registry block above.
        - matchPattern: "*.fastlydns.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
    # CIDR fallback for Fastly's anycast block. The FQDN
    # matchPattern above SHOULD cover *.fastlydns.net but Cilium's
    # FQDN proxy doesn't track CNAME chains when the build pod's
    # DNS resolution goes through buildkit's embedded dockerd
    # resolver rather than directly through kube-dns — so the
    # resolved IPs never get associated with the matched FQDN.
    # 151.101.0.0/16 is Fastly's main anycast block (covers
    # debian-cdn, alpine, npm-cdn, etc.). 199.232.0.0/16 is its
    # secondary range. Verified 2026-06-11 by pipeline #7 still
    # timing out on 151.101.66.132 even with the matchPattern in
    # place. Narrower than ideal — revisit if Cilium L7 DNS proxy
    # learns CNAME-chain tracking, but it's a small CIDR.
    - toCIDR:
        - "151.101.0.0/16"
        - "199.232.0.0/16"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
