# NetworkPolicies for Woodpecker server + agent + step Pods.
# Per ADR 0023 D5.
#
# Implemented as CiliumNetworkPolicy (not vanilla NetworkPolicy)
# because Cilium Gateway API traffic carries the reserved
# `ingress` identity, NOT the source namespace identity. K8s
# NetPol's `namespaceSelector: kubernetes.io/metadata.name=ingress`
# silently drops Gateway → woodpecker-server traffic (503 / 5s
# timeout). See homelab-k8s/platform/authentik/networkpolicy.yaml
# for the canonical write-up.

# Server: ingress from Cilium Gateway (UI) + Forgejo
# (webhooks). Egress: kube-DNS + Forgejo + agent grpc.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: woodpecker-server
  namespace: woodpecker
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: woodpecker
      app.kubernetes.io/component: server
  ingress:
    # Cilium Gateway envoy — reserved `ingress` identity.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Forgejo (webhooks).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: forgejo
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "9000"
              protocol: TCP
    # Agent grpc.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: woodpecker
            app.kubernetes.io/component: agent
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
  egress:
    # kube-DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Forgejo for OAuth + git metadata.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: forgejo
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
# Agent: ingress only from server (grpc). Egress: kube-DNS +
# server + kube-API (to manage step Pods in ci-woodpecker).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: woodpecker-agent
  namespace: woodpecker
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: woodpecker
      app.kubernetes.io/component: agent
  # No ingress rules — agent receives no inbound traffic.
  egress:
    # kube-DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Server grpc.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: woodpecker
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # kube-API — agent talks to it to create/delete step pods.
    # Cilium has a reserved `kube-apiserver` entity for this;
    # cleaner than the vanilla-NetPol "any 443" hack.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
---
# CI step Pods (ci-woodpecker ns): default-deny ingress;
# egress to kube-DNS + Forgejo (git clone) + curated
# upstream registries (CCNP toFQDNs in the second policy
# below).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ci-woodpecker-default
  namespace: ci-woodpecker
spec:
  endpointSelector: {}
  # No ingress rules — step pods receive no inbound traffic.
  egress:
    # kube-DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Forgejo for git-clone (HTTPS) + Forgejo Packages push.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: forgejo
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
# CCNP for ci-woodpecker step Pods: FQDN-based egress to
# upstream package registries. Same shape as the renovate
# layer's CCNP — operator extends the toFQDNs list when a
# pipeline references an unlisted registry.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ci-woodpecker-egress-fqdn
  namespace: ci-woodpecker
spec:
  endpointSelector: {}
  egress:
    # kube-DNS — Cilium needs to see the DNS query to
    # populate its FQDN→IP cache for the toFQDNs rules below.
    - toEndpoints:
        - matchLabels:
            "io.kubernetes.pod.namespace": kube-system
            "k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    # Common registries CI step pods consult.
    - toFQDNs:
        # Forgejo (git clone via public hostname).
        # Step pods clone using `WOODPECKER_FORGEJO_URL`
        # (https://forgejo.lab.vyramo.com), which resolves to
        # the Cilium Gateway VIP. Traffic egresses to the
        # gateway and re-enters the cluster to Forgejo.
        # `ci-woodpecker-default` allows the in-cluster
        # forgejo-ns shortcut, but Woodpecker hardcodes the
        # public clone URL from Forgejo's ROOT_URL, so we
        # also need it here for FQDN-based egress to work.
        - matchName: "forgejo.lab.vyramo.com"
        # Container registries
        - matchName: "registry-1.docker.io"
        - matchName: "auth.docker.io"
        - matchName: "production.cloudflare.docker.com"
        # Docker Hub migrated buildkit blob serving from Cloudflare
        # to CloudFront in 2026 (verified 2026-06-11 during the
        # pr-agent-build pipeline's first docker-buildx run, which
        # pulled moby/buildkit:buildx-stable-1 fine but failed
        # fetching the layer blob with "dial tcp 99.84.91.38:443:
        # i/o timeout" — that IP is a CloudFront edge node). Keep
        # the cloudflare line too; Docker still uses it for some
        # blob requests during the same build session.
        - matchName: "production.cloudfront.docker.com"
        - matchName: "ghcr.io"
        - matchName: "pkg-containers.githubusercontent.com"
        - matchName: "registry.k8s.io"
        - matchName: "quay.io"
        - matchName: "cdn03.quay.io"
        - matchName: "gcr.io"
        # Language-package registries
        - matchName: "pypi.org"
        - matchName: "files.pythonhosted.org"
        - matchName: "registry.npmjs.org"
        # Prisma engine binaries CDN — `prisma generate` downloads
        # platform-specific schema-engine + query-engine from here
        # at build time. Added 2026-06-29 for llm-gateway v0.0.11
        # (Cloudflare-fronted, separate from production.cloudflare
        # which covers Docker Hub).
        - matchName: "binaries.prisma.sh"
        # GitHub (release archives, source for github-tags
        # / github-releases datasources, git+https deps)
        - matchName: "api.github.com"
        - matchName: "objects.githubusercontent.com"
        - matchName: "codeload.github.com"
        - matchName: "github.com"
        - matchName: "raw.githubusercontent.com"
        # OS package mirrors (apt/apk during image build).
        # Operator extends per pipeline image base (Alpine,
        # Debian, etc.).
        - matchName: "deb.debian.org"
        - matchName: "security.debian.org"
        - matchName: "dl-cdn.alpinelinux.org"
        # CDN backends. Build containers spawned by buildkit get
        # `dockerd --dns <pod-IP>` instead of the cluster Service
        # DNS, so Cilium's L7 FQDN proxy doesn't follow CNAME chains
        # — when apt asks for `deb.debian.org` it gets the Fastly
        # CNAME, queries again, and the resolved IPs aren't tagged
        # against the original matchName. Explicit pattern coverage
        # for the Debian mirror CDN (verified 2026-06-11 during
        # pr-agent-build pipeline #6 — "Could not connect to
        # debian.map.fastlydns.net:80"). Same pattern applies to
        # Cloudflare/CloudFront for Alpine + Docker mirrors but
        # those are already covered via the registry block above.
        - matchPattern: "*.fastlydns.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
    # CIDR fallback for Fastly's anycast block. The FQDN
    # matchPattern above SHOULD cover *.fastlydns.net but Cilium's
    # FQDN proxy doesn't track CNAME chains when the build pod's
    # DNS resolution goes through buildkit's embedded dockerd
    # resolver rather than directly through kube-dns — so the
    # resolved IPs never get associated with the matched FQDN.
    # 151.101.0.0/16 is Fastly's main anycast block (covers
    # debian-cdn, alpine, npm-cdn, etc.). 199.232.0.0/16 is its
    # secondary range. Verified 2026-06-11 by pipeline #7 still
    # timing out on 151.101.66.132 even with the matchPattern in
    # place. Narrower than ideal — revisit if Cilium L7 DNS proxy
    # learns CNAME-chain tracking, but it's a small CIDR.
    - toCIDR:
        - "151.101.0.0/16"
        - "199.232.0.0/16"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
