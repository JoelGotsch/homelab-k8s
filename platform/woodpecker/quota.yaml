# Per ADR 0023 D5: ResourceQuota + LimitRange on the
# ci-woodpecker namespace. Bounds runaway pipeline steps from
# eating the cluster's capacity.
#
# ─────────────────────────────────────────────────────────────
# THIS IS THE ONLY QUOTA AND THE ONLY LIMITRANGE HERE (2026-09-14)
#
# Until 2026-09-14 Kyverno also generated `default-quota` and
# `default-limits` into this namespace, and when two quotas name a
# resource the TIGHTEST binds: the operative caps were 4 CPU / 8Gi
# requests and 16Gi limits.memory, not what this file said. CI hit
# that 16Gi exactly, and a quota REJECTS a Pod rather than queueing
# it — the step fails at admission and reads like a code failure.
# The namespace now carries both `bypass.homelab.internal/
# homelab-generate-default-*` annotations (namespace.yaml), per
# ADR 0036's "one owner per resource default per namespace".
#
# Sizing rule (2026-09-21): TWO concurrent runs of the heaviest
# workflow at its planned width, plus the measured peak of every
# other tenant together. The earlier rule — WOODPECKER_MAX_WORKFLOWS
# (4, values.yaml) × the heaviest run — stopped being satisfiable
# the day conversation-history planned to fan its tests out to 8–12
# shards: 4 × a 12-shard run is ~57 CPU of requests against a
# worker pool of 48. Two is the honest concurrency: the repo has
# `cancel_previous_pipeline_events: [push, pull_request]`, so a
# third overlapping run of the same branch or PR is cancelled by
# Woodpecker, and overlap only happens across branches. A third
# concurrent run of that width is still REJECTED at admission (a
# quota never queues — see above) and reads as a red step; that is
# the accepted failure mode for the pathological case, not for the
# normal one. Pending is the normal one: the requests below exceed
# what the workers have free (~24 CPU / ~41Gi on 2026-09-21), so
# the second wide run waits for the first to release capacity and
# the repo's 120-minute timeout covers that wait.
#
# Heaviest workflow: conversation-history. Measured 2026-09-21 from
# pipeline 399 (4 shards, 75 min, Prometheus over its window):
# each shard pod peaks at 0.74–0.83 core and 543–848MiB working set
# (its declared 250m/256Mi request is fiction; its 1Gi limit is one
# bad test from OOM), each Postgres service at 0.21–0.35 core and
# 249–401MiB. Nodes were 19–40% busy, CFS throttling 0%, iowait
# ≤1.6%: shard wall time is test content, not contention. One PVC
# per WORKFLOW (`wp-<task>-0-default`), not per step, so shard
# count never touches `persistentvolumeclaims`.
#
# Per-run charge at width N, with the declarations that match the
# measurements (shard 750m/1Gi → 2 CPU/2Gi, Postgres 350m/512Mi →
# 2 CPU/1Gi, minio + the four short stage-2 steps ≈ 1.1 CPU/1.2Gi
# requests, ~10 CPU/5Gi limits):
#
#   resource         8 shards   12 shards   × 2 + tenants   set
#   pods             21         29          70              80
#   requests.cpu     9.9        14.3        31.6            32
#   requests.memory  13.2Gi     19.2Gi      42.4Gi          44Gi
#   limits.cpu       42         58          126             128
#   limits.memory    29Gi       41Gi        86Gi            88Gi
#
# "tenants" = every other repo together: 1.2 CPU / ~2Gi requests at
# their 14-day peak (all 1–10 min pipelines), padded to 3 CPU / 4Gi /
# 12 pods. Sized for 12 so the 8 → 12 step needs no second edit.
# Note that limits.memory could NOT stay at 56Gi even for 8 shards:
# two concurrent 8-shard runs with honest 2Gi shard limits are 58Gi.
#
# Re-measure when a pipeline grows: max over its window of the
# per-task-uuid sum of kube_pod_container_resource_{requests,limits}
# and container_memory_working_set_bytes. Do NOT run that as a
# 30d:1m subquery join casually — it is expensive; a 1–2h range is
# enough to confirm one pipeline.
#
# What this trades away, stated plainly: requests.cpu 32 / 44Gi is
# ~67% / ~47% of the three workers' allocatable (48 CPU / ~93GiB),
# where 9 / 13Gi was ~19% / ~14%. Limits still reserve nothing and
# step Pods stay Burstable, so under node memory pressure the
# kernel still OOM-kills CI before apps — but if a worker is LOST
# while two wide runs hold their requests, the apps from that node
# queue behind CI, because no CI Pod carries a PriorityClass and
# the scheduler cannot preempt a priority-0 Pod for another. The
# fix is a namespace-scoped negative PriorityClass mutated onto
# ci-woodpecker Pods (Kyverno MutatingPolicy, same shape as
# ci-woodpecker-dns-ndots); until that lands, a node loss during a
# wide run means apps wait up to one CI run to reschedule.
# ─────────────────────────────────────────────────────────────

apiVersion: v1
kind: ResourceQuota
metadata:
  name: ci-woodpecker
  namespace: ci-woodpecker
spec:
  hard:
    requests.cpu: "32"
    requests.memory: "44Gi"
    # conversation-history declares per-step CPU limits (up to the
    # LimitRange max of 4) because most of its runtime is CPU-bound and
    # it fans steps out in parallel. limits.cpu throttles, it does not
    # reserve; requests.cpu above bounds what CI can hold.
    limits.cpu: "128"
    limits.memory: "88Gi"
    pods: "80"
    persistentvolumeclaims: "20"
    requests.storage: "200Gi"
---
# LimitRange: per-Pod defaults if a step doesn't set its own
# resources. Forces every step to declare requests/limits
# (or accept these defaults), preventing zero-bound steps
# from squeezing other workloads.
#
# `default.cpu: 500m` is the number that made every pipeline in
# the homelab slow, and it is deliberately NOT being raised here.
# A repo that knows a step is CPU-bound can now say so per step
# (`backend_options.kubernetes.resources`, Woodpecker v3), which
# is bounded by `max` below and affects only that repo.
# Raising the default instead would silently multiply every
# step's quota charge across every pipeline, and the quota above
# would then admit far fewer Pods than the `pods: 20` this file
# advertises. If the per-step approach proves out and every repo
# ends up copying it, revisit — that is the point at which a
# default is the honest place for it.
#
# `max.cpu: 4` is what bounds a per-step declaration, so it is
# load-bearing now in a way it was not before.
apiVersion: v1
kind: LimitRange
metadata:
  name: ci-woodpecker
  namespace: ci-woodpecker
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "4"
        memory: "8Gi"
