# Per ADR 0023 D5: ResourceQuota + LimitRange on the
# ci-woodpecker namespace. Bounds runaway pipeline steps from
# eating the cluster's capacity.
#
# ─────────────────────────────────────────────────────────────
# THIS IS THE ONLY QUOTA AND THE ONLY LIMITRANGE HERE (2026-09-14)
#
# Until 2026-09-14 Kyverno also generated `default-quota` and
# `default-limits` into this namespace, and when two quotas name a
# resource the TIGHTEST binds: the operative caps were 4 CPU / 8Gi
# requests and 16Gi limits.memory, not what this file said. CI hit
# that 16Gi exactly, and a quota REJECTS a Pod rather than queueing
# it — the step fails at admission and reads like a code failure.
# The namespace now carries both `bypass.homelab.internal/
# homelab-generate-default-*` annotations (namespace.yaml), per
# ADR 0036's "one owner per resource default per namespace".
#
# Sizing rule: the agent's WOODPECKER_MAX_WORKFLOWS (4, values.yaml)
# × the heaviest workflow's admission peak, plus ~20%. Concurrency
# is then bounded by Woodpecker's queue, and this quota only fires
# on something genuinely wrong. Change MAX_WORKFLOWS → resize here.
#
# Heaviest workflow, measured 2026-09-14 from kube-state-metrics
# over 30 days (per `woodpecker-ci.org/task-uuid`, concurrent sum):
# conversation-history — every run lands at 9–10Gi limits, so it
# is the norm, not an outlier. The same day its pipeline gained a
# `minio` service (+1 pod, 50m/128Mi requests, 500m/512Mi limits;
# declared by its owner, not yet measured), included below:
#
#   resource         1 workflow   × 4    set    real use (× 4)
#   pods             12           48     58
#   requests.cpu     1.8          7.2    9
#   requests.memory  2.625Gi      10.5Gi 13Gi   2.6GiB (10.3GiB) pre-minio
#   limits.cpu       19           76     92
#   limits.memory    11.5Gi       46Gi   56Gi
#
# Next heaviest: todo-agents / llm-gateway at 4Gi limits.memory.
# Re-measure (max over 30d of the per-task-uuid sum of
# kube_pod_container_resource_{requests,limits}) when a pipeline
# grows. Do NOT run that as a 30d:1m subquery join casually —
# it is expensive; a 1h range is enough to confirm one pipeline.
#
# Why the limits numbers are safe despite being large: limits do
# not reserve anything. requests (13Gi, ~14% of the three workers'
# ~91GiB) are what the scheduler holds for CI, and step Pods are
# Burstable with a 1:4 request:limit ratio, so under node memory
# pressure the kernel OOM-kills CI steps before app workloads.
# ─────────────────────────────────────────────────────────────

apiVersion: v1
kind: ResourceQuota
metadata:
  name: ci-woodpecker
  namespace: ci-woodpecker
spec:
  hard:
    requests.cpu: "9"
    requests.memory: "13Gi"
    # conversation-history declares per-step CPU limits (up to the
    # LimitRange max of 4) because most of its runtime is CPU-bound and
    # it fans steps out in parallel. limits.cpu throttles, it does not
    # reserve; requests.cpu above bounds what CI can hold.
    limits.cpu: "92"
    limits.memory: "56Gi"
    pods: "58"
    persistentvolumeclaims: "20"
    requests.storage: "200Gi"
---
# LimitRange: per-Pod defaults if a step doesn't set its own
# resources. Forces every step to declare requests/limits
# (or accept these defaults), preventing zero-bound steps
# from squeezing other workloads.
#
# `default.cpu: 500m` is the number that made every pipeline in
# the homelab slow, and it is deliberately NOT being raised here.
# A repo that knows a step is CPU-bound can now say so per step
# (`backend_options.kubernetes.resources`, Woodpecker v3), which
# is bounded by `max` below and affects only that repo.
# Raising the default instead would silently multiply every
# step's quota charge across every pipeline, and the quota above
# would then admit far fewer Pods than the `pods: 20` this file
# advertises. If the per-step approach proves out and every repo
# ends up copying it, revisit — that is the point at which a
# default is the honest place for it.
#
# `max.cpu: 4` is what bounds a per-step declaration, so it is
# load-bearing now in a way it was not before.
apiVersion: v1
kind: LimitRange
metadata:
  name: ci-woodpecker
  namespace: ci-woodpecker
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "4"
        memory: "8Gi"
