# Kubelet pull credential for CI step Pods (ADR 0068).
#
# The chart workflows in every lock-carrying repo run the first-party ci-tools
# image, registry.homelab.internal/homelab/ci-tools. Forgejo Packages refuses
# anonymous reads (REQUIRE_SIGNIN_VIEW — see
# bootstrap/argocd/externalsecret-helm-registry.yaml), so a step Pod naming that
# image needs an imagePullSecret. Woodpecker cannot be told per step; the agent
# attaches the Secrets listed in WOODPECKER_BACKEND_K8S_PULL_SECRET_NAMES
# (values.yaml) to every step Pod it creates in ci-woodpecker, and the Secrets
# must live in that namespace (Woodpecker 3.18 Kubernetes backend docs,
# "Private registries").
#
# Credential: kv/argocd/registry-pull — the `argocd-chart-pull` bot, scope
# `read:package` ONLY. Deliberately not kv/shared/forgejo-packages/ci, which the
# chart-mirror step already receives as a Woodpecker secret: that one carries
# `write:package`, and a pull secret sits on EVERY step Pod, including pull
# requests. Reading packages is all a pull needs. Declared as a third consumer
# of that path in homelab-infra/ansible/inventory/openbao-paths.yml.
#
# Only the alias host. Step Pods name the image through
# registry.homelab.internal, and a dockerconfigjson credential is looked up by
# the host in the image reference.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-homelab-internal-pull
  namespace: ci-woodpecker
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: registry-homelab-internal-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "registry.homelab.internal": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: argocd/registry-pull
        property: username
    - secretKey: password
      remoteRef:
        key: argocd/registry-pull
        property: token
