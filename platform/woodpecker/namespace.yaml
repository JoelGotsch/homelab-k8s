# Two namespaces:
#
# - `woodpecker`: server + agent (the CI control plane).
# - `ci-woodpecker`: where step Pods spawn for each pipeline
#   step. Per ADR 0023 D5: separate ns + ResourceQuota +
#   LimitRange + restrictive NetworkPolicy + ServiceAccount
#   with no kube-API access.

apiVersion: v1
kind: Namespace
metadata:
  name: woodpecker
  labels:
    # ADR 0036: first-party namespace enrolment (control plane).
    homelab.internal/first-party: "true"
    # `internal` — CI orchestrator + webhook receiver.
    homelab.internal/data-class: internal
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: ci-woodpecker
  annotations:
    # Opt out of the Kyverno-generated default-quota (16Gi limits.memory,
    # 8Gi / 4 CPU requests): with two quotas the tightest binds, CI hit
    # 16Gi, and a quota rejects step Pods instead of queueing them.
    # quota.yaml is the single, measured quota (two concurrent runs of the
    # heaviest workflow + every other tenant's peak, 2026-09-21). ADR 0036
    # "one owner per resource default per namespace".
    bypass.homelab.internal/homelab-generate-default-resourcequota: "CI bursts to 2 x heaviest workflow at 12 shards (~88Gi limits); explicit measured quota in quota.yaml"
    # Same rule for the LimitRange: two LimitRanges setting a default have
    # no documented tiebreak. quota.yaml's LimitRange (1Gi default) is the
    # one that was observed winning; this makes it the only one.
    bypass.homelab.internal/homelab-generate-default-limitrange: "CI step defaults are owned by the LimitRange in quota.yaml"
  labels:
    # ADR 0036: first-party namespace enrolment (step-Pod runner).
    # quota.yaml is the reference implementation of the shared
    # component (ADR 0023 D5 predates ADR 0036); the values
    # there stay authoritative for ci-woodpecker — the shared
    # component in components/first-party-namespace/ is NOT
    # attached here to avoid ObjectQuota / LimitRange conflicts.
    homelab.internal/first-party: "true"
    homelab.internal/data-class: internal
    # PSS = privileged on this ns. Woodpecker's k8s backend auto-
    # generates step Pod specs without the explicit securityContext
    # fields restricted demands (allowPrivilegeEscalation:false,
    # capabilities.drop:[ALL], seccompProfile.type, runAsNonRoot).
    # Even when step images themselves run as non-root, kube-apiserver
    # rejects admission before the pod starts → clone-stage failure
    # for every pipeline. There's no values.yaml knob on the chart
    # that gets the auto-generated pod spec to restricted-compliance.
    #
    # Trade-off: we already opted-in privileged plugins via
    # WOODPECKER_PLUGINS_PRIVILEGED=woodpeckerci/plugin-docker-buildx
    # (the docker-buildx step needs privileged:true on tag events).
    # ci-woodpecker is mitigated via:
    #   - dedicated ns + ResourceQuota + LimitRange (quota.yaml)
    #   - scoped ServiceAccount with no kube-API access (rbac.yaml)
    #   - default-deny NetworkPolicy + FQDN-allowlist egress
    #     (networkpolicy.yaml)
    #   - per-ADR-0023-D5 isolation
    # Per the homelab threat model this is an acceptable trade — the
    # cluster's most sensitive workloads still run under enforce=restricted
    # in their own namespaces. CI pods are short-lived + restricted-
    # blast-radius.
    #
    # Audit stays at restricted so noncompliant step images surface
    # warnings in the audit log without blocking admission.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    # Tag for Cilium policies that match traffic from the
    # CI ns specifically.
    layer: ci
