# Woodpecker UI exposed via Cilium Gateway API HTTPRoute.
# Tailscale-only, same shape as Forgejo's HTTPRoute.
#
# Hostname resolves from components/site-config (fqdn_suffix) — see the
# replacement in this directory's kustomization.yaml. Nothing to fill.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: woodpecker
  namespace: woodpecker
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: ingress
      sectionName: https
  hostnames:
    - "woodpecker.FQDN_SUFFIX"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: woodpecker-server
          port: 80
