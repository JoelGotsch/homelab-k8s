# ExternalSecrets for Woodpecker server + agent.
# Per ADR 0023 D8.

# Forgejo OAuth app — Woodpecker uses Forgejo as the OIDC
# provider for repo-permissions checks (the operator-typed
# "Login with Forgejo" flow). Operator creates the OAuth app
# in Forgejo's UI: Settings → Applications → OAuth2
# Applications → Create.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: woodpecker-oauth
  namespace: woodpecker
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: woodpecker-oauth
  data:
    - secretKey: WOODPECKER_FORGEJO_CLIENT
      remoteRef:
        key: woodpecker/oauth
        property: client_id
    - secretKey: WOODPECKER_FORGEJO_SECRET
      remoteRef:
        key: woodpecker/oauth
        property: client_secret
---
# Per-agent registration token. Woodpecker 3.x dropped the auto-
# registration-via-global-secret path; agents must exist as records
# in the server DB before they can auth. The 2026-06-06 saga
# rebuilt the server DB; the chart-default `WOODPECKER_AGENT_SECRET`
# is now insufficient — agents fail with "individual agent not
# found by token: sql: no rows in result set".
#
# The operator created `agent-0` via the Woodpecker UI on 2026-06-09
# and seeded the resulting per-agent token to kv/woodpecker/agent-token.
# This ExternalSecret projects it as WOODPECKER_AGENT_TOKEN — the
# env var the agent prefers over WOODPECKER_AGENT_SECRET for
# legacy-fallback behavior — via `agent.extraSecretNamesForEnvFrom`
# in values.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: woodpecker-agent-token
  namespace: woodpecker
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: woodpecker-agent-token
  data:
    # Project the per-agent token as BOTH _TOKEN and _SECRET. Reason:
    # the chart's auto-created `woodpecker-default-agent-secret` injects
    # WOODPECKER_AGENT_SECRET=<global-secret> into the agent envFrom.
    # The Woodpecker agent's auth path appears to send
    # WOODPECKER_AGENT_SECRET (the legacy global) regardless of whether
    # WOODPECKER_AGENT_TOKEN is also present, so the per-agent token
    # never reaches the gRPC Auth call. By emitting both keys from the
    # ES, and listing this Secret AFTER the default in envFrom (per the
    # values.yaml `extraSecretNamesForEnvFrom: [woodpecker-agent-token]`
    # appending after the chart's default envFroms), our value
    # overrides the global on WOODPECKER_AGENT_SECRET — both env vars
    # now carry the per-agent token regardless of which the agent
    # consults. Diagnosed 2026-06-09 after the chart-supplied secret +
    # per-agent token both being present produced "individual agent not
    # found by token" — the lookup was on the global, not on ours.
    - secretKey: WOODPECKER_AGENT_TOKEN
      remoteRef:
        key: woodpecker/agent-token
        property: token
    - secretKey: WOODPECKER_AGENT_SECRET
      remoteRef:
        key: woodpecker/agent-token
        property: token
---
# Server-side shared "system" agent secret (WOODPECKER_AGENT_SECRET on the
# server). Re-introduced 2026-08-16 under a pinned OpenBao value because the
# chart's own woodpecker-default-agent-secret was minted at render time
# (`randAlphaNum 64`; `lookup` is empty under Argo), i.e. rotated on every
# homelab-k8s commit while the running server kept an older value. Per the
# Woodpecker 3.x docs this value only gates registration of NEW agents by
# system token; the running agent authenticates with the per-agent token
# above and never reads it. Consumer: StatefulSet/woodpecker-server via
# server.extraSecretNamesForEnvFrom (OnDelete — a rotation is picked up by
# deleting the server pod in a no-CI window).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: woodpecker-agent-secret
  namespace: woodpecker
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: woodpecker-agent-secret
    creationPolicy: Owner
  data:
    - secretKey: WOODPECKER_AGENT_SECRET
      remoteRef:
        key: woodpecker/agent-secret
        property: token
