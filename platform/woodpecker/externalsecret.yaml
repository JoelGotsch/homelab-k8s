# ExternalSecrets for Woodpecker server + agent.
# Per ADR 0023 D8.

# Woodpecker server-agent shared secret. Both server and agent
# read this; agent presents it on connection. Random; rotate
# via re-seed + helm rollout.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: woodpecker-agent-secret
  namespace: woodpecker
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: woodpecker-agent-secret
  data:
    - secretKey: WOODPECKER_AGENT_SECRET
      remoteRef:
        key: woodpecker/agent-secret
        property: token
---
# Forgejo OAuth app — Woodpecker uses Forgejo as the OIDC
# provider for repo-permissions checks (the operator-typed
# "Login with Forgejo" flow). Operator creates the OAuth app
# in Forgejo's UI: Settings → Applications → OAuth2
# Applications → Create.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: woodpecker-oauth
  namespace: woodpecker
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: woodpecker-oauth
  data:
    - secretKey: WOODPECKER_FORGEJO_CLIENT
      remoteRef:
        key: woodpecker/oauth
        property: client_id
    - secretKey: WOODPECKER_FORGEJO_SECRET
      remoteRef:
        key: woodpecker/oauth
        property: client_secret
