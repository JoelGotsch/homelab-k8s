# ExternalSecrets for PR-Agent.
# Per ADR 0029 D3 + D7.

# Forgejo PAT for the dedicated `pr-agent-bot` service account.
# Scope: read repos + post PR comments + post PR reviews.
# Operator creates the bot user in Forgejo, then issues a PAT
# under that user's Settings → Applications → Tokens.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pr-agent-forgejo
  namespace: pr-agent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: pr-agent-forgejo
  data:
    - secretKey: GITEA__PERSONAL_ACCESS_TOKEN
      remoteRef:
        key: pr-agent/forgejo-pat
        property: token
---
# Webhook shared secret. Forgejo signs incoming webhooks with
# this; PR-Agent verifies before processing. Random; rotate via
# re-seed + Forgejo webhook-edit + ESO refresh.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pr-agent-webhook
  namespace: pr-agent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: pr-agent-webhook
  data:
    - secretKey: GITEA__WEBHOOK_SECRET
      remoteRef:
        key: pr-agent/webhook-secret
        property: secret
---
# LLM gateway per-app virtual key (ADR 0026 D6). PR-Agent's
# LiteLLM client presents this as the OpenAI API key; the
# gateway maps it to the allowed-model + provider list for
# this consumer.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pr-agent-llm-gateway
  namespace: pr-agent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: pr-agent-llm-gateway
  data:
    - secretKey: OPENAI__KEY
      remoteRef:
        key: pr-agent/litellm-virtual-key
        property: key
