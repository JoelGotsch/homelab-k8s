# PR-Agent webhook server (Deployment + Service).
# Per ADR 0029 D2 + D4.
#
# Image is built from qodo-ai/pr-agent's `gitea_app` Dockerfile
# target — no upstream-published image for that target as of
# release tracking. Recipe in README §"Image build". Renovate
# pins via the `<digest>`-shaped tag once a build lands in
# registry.homelab.internal.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr-agent
  namespace: pr-agent
  labels:
    app.kubernetes.io/name: pr-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pr-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pr-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pr-agent
          # OPERATOR PINS via Renovate. Image is built by the
          # `forgejo-admin/pr-agent-build` wrapper repo via
          # Woodpecker on every tag push; tag is
          # `gitea_app-<upstream-tag>`. Forgejo Packages OCI
          # namespaces images by owner and Forgejo only allows the
          # token-holder to push to its own namespace, so the
          # `ci-packages` bot pushes here (its own namespace), NOT
          # to `forgejo-admin/*`. Pull-side is fine because the
          # cluster's registry-pull Secret uses the same bot.
          image: "registry.homelab.internal/ci-packages/pr-agent:gitea_app-0.34"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            # Cap gunicorn worker count. Upstream's gunicorn.conf.py
            # autoscales to nproc*2+1, which on a 16-core worker
            # becomes 33+ workers; each loads litellm/openai/tiktoken
            # + tokenizers at ~50–80 MiB resident, blowing past any
            # sane memory limit (observed OOMKilled at 1 GiB on the
            # first successful pull, 2026-06-11). pr-agent is a
            # webhook handler doing a few PRs/min — 2 workers is
            # plenty and keeps total memory bounded.
            - name: WEB_CONCURRENCY
              value: "2"
          envFrom:
            - configMapRef:
                name: pr-agent-config
            - secretRef:
                name: pr-agent-forgejo
            - secretRef:
                name: pr-agent-webhook
            - secretRef:
                name: pr-agent-llm-gateway
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pr-agent
  namespace: pr-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pr-agent
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
