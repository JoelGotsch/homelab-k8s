# Qodo PR-Agent — LLM-powered PR review bot, webhook-mode.
# Per ADR 0029.
#
# No upstream Helm chart for the gitea_app target; plain
# Deployment + Service + ConfigMap + ExternalSecret. Image is
# operator-built from qodo-ai/pr-agent's `gitea_app` Dockerfile
# target and pushed to registry.homelab.internal — see README
# §"Image build" for the recipe.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - externalsecret.yaml
  - deployment.yaml
  - networkpolicy.yaml
  # Forgejo Packages pull cred + default-SA wiring. Per
  # platform/forgejo/README.md §"First-party image pulls".
  - registry-pull-secret.yaml
  - sa-default.yaml

# ADR 0036: cluster-wide resource-governance baseline.
# site-config: build-only ConfigMap for the GITEA__URL replacement below.
components:
  - ../../components/first-party-namespace
  - ../../components/site-config

# Resolve the Forgejo API host from the single site-config (no hardcoded
# domain): `https://FORGEJO_FQDN` -> `https://<forgejo_fqdn>`. Provenance:
# this rule -> ConfigMap/site-config.data.forgejo_fqdn ->
# components/site-config/site-config.env. Host token, not whole value, so the
# scheme stays in the manifest where it is reviewable.
replacements:
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.forgejo_fqdn }
    targets:
      - select: { kind: ConfigMap, name: pr-agent-config }
        fieldPaths: [data.GITEA__URL]
        options: { delimiter: '/', index: 2 }
