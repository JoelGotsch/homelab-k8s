# registry.homelab.internal read credential for Renovate's `docker`
# datasource.
#
# The Forgejo Packages registry refuses anonymous reads
# (REQUIRE_SIGNIN_VIEW is set deliberately beside DISABLE_REGISTRATION —
# see bootstrap/argocd/externalsecret-helm-registry.yaml). Renovate's
# `kubernetes` manager therefore could never list tags for a first-party
# image under registry.homelab.internal/…: every lookup got a 401 token
# grant, or — before the CA mount in cronjob.yaml — died one step earlier
# with UNABLE_TO_VERIFY_LEAF_SIGNATURE. Either way no first-party image
# had an update proposed, silently.
#
# NOT a kubelet imagePullSecret and NOT a dockerconfigjson: Renovate takes
# registry credentials as a `hostRules` entry in config.js
# (configuration-options.md @ 38.142.7: `matchHost` + `hostType: docker` +
# `username` / `password`), so this projects the two fields as plain keys
# that cronjob.yaml lifts into HOMELAB_REGISTRY_USERNAME / _PASSWORD and
# config.js reads via process.env.
#
# Credential: kv/argocd/registry-pull — the `argocd-chart-pull` bot that
# Argo's repo-server already uses for chart pulls from the same registry.
# Scope is `read:package` only, which is exactly what tag listing needs;
# nothing new was minted, and this layer is declared as a second consumer
# of that path in homelab-infra/ansible/inventory/openbao-paths.yml.
# The kv key is named `token`; it is projected as `password` because that
# is the field name on the Renovate side.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: renovate-registry-pull
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: renovate-registry-pull
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: argocd/registry-pull
        property: username
    - secretKey: password
      remoteRef:
        key: argocd/registry-pull
        property: token
