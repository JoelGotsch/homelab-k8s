# Forgejo PAT for the renovate-bot user.
# Operator seeds kv/platform/renovate/forgejo-token at the
# post-Forgejo activation step (see this layer's README).

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: renovate-forgejo-token
  namespace: renovate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: renovate-forgejo-token
  data:
    - secretKey: token
      remoteRef:
        key: platform/renovate/forgejo-token
        property: token
