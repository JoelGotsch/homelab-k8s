apiVersion: v1
kind: Namespace
metadata:
  name: renovate
  labels:
    # ADR 0036: first-party namespace enrolment.
    homelab.internal/first-party: "true"
    # `internal` — Forgejo PAT + git clones (source content is
    # internal-class per ADR 0003).
    homelab.internal/data-class: internal
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    # Opt into trust-manager's Bundles so the homelab-internal CA
    # (registry.homelab.internal's issuer) lands here as the
    # `homelab-root-ca` ConfigMap — mounted by cronjob.yaml for
    # NODE_EXTRA_CA_CERTS. Without it every first-party image
    # lookup died with UNABLE_TO_VERIFY_LEAF_SIGNATURE.
    homelab.lab/inject-ca: "true"
