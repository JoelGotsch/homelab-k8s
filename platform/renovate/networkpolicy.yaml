# NetworkPolicies for the renovate runner.
#
# - Ingress: NONE. CronJob runs no service.
# - Egress (vanilla NetworkPolicy): kube-DNS + Forgejo
#   (in-cluster Service).
# - Egress (CCNP, FQDN-aware): the common upstream
#   registry hosts Renovate consults to discover latest
#   versions. Operator extends the FQDN list when a new
#   manifest source surfaces (e.g., a new Helm chart repo).
#
# Threat model: the bot's Forgejo PAT is the only secret in
# this layer. NetworkPolicy bounds where the runner can
# send it. Vanilla policy gates cluster-internal traffic;
# CCNP narrows external egress to known registries by
# hostname (Renovate's request shape is HTTPS GET).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: renovate-runner
  namespace: renovate
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: renovate
      app.kubernetes.io/component: runner
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Forgejo API in-cluster. Forgejo Service lives in the
    # `forgejo` namespace per platform/forgejo/. Port 3000
    # is the Forgejo default; operator confirms when
    # forgejo layer scaffolds.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
      ports:
        - port: 3000
          protocol: TCP
        - port: 443
          protocol: TCP
---
# CCNP: external-registry egress narrowed to known
# hostnames. Vanilla NetworkPolicy can't match on FQDN;
# Cilium's FQDN-aware policy is the canonical pattern
# (per crowdsec/ciliumnetworkpolicy-egress.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: renovate-runner-egress-fqdn
  namespace: renovate
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: renovate
      app.kubernetes.io/component: runner
  egress:
    # kube-DNS — Cilium needs to see the DNS query to
    # populate its FQDN→IP cache for the toFQDNs rules
    # below.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    # Common registries Renovate consults.
    # OPERATOR EXTENDS this list when a new manifest source
    # surfaces (chart repo URL, alternate registry, etc.).
    # Add the hostname as a `matchName` line.
    - toFQDNs:
        # Container registries
        - matchName: "registry-1.docker.io"
        - matchName: "index.docker.io"  # Docker Hub tag-list/metadata API — distinct host from the registry-1 pull path; ETIMEDOUT confirmed 2026-07-16 first live run
        - matchName: "auth.docker.io"
        - matchName: "hub.docker.com"  # v2 tag/metadata API for docker.io images; 9 lookups timed out on it 2026-08-24 — distinct again from index.docker.io
        # Docker's blob CDN moves between providers: the list carried only
        # `production.cloudflare.docker.com`, and the 2026-08-24 run spent 6
        # lookups timing out on `production.cloudfront.docker.com`. A pattern
        # covers the next move too. Cilium `*` spans 0+ DNS characters but
        # never the `.` separator, so this cannot widen past one label
        # (docs.cilium.io/en/v1.20/security/policy/layer7/).
        - matchPattern: "production.cloud*.docker.com"
        - matchName: "ghcr.io"
        - matchName: "pkg-containers.githubusercontent.com"
        - matchName: "registry.k8s.io"
        - matchName: "quay.io"
        # Same shard-rotation problem: the list pinned `cdn03` and the run hit
        # `cdn01`. `quay.io` itself stays an explicit matchName — the pattern
        # requires the `cdn` label and does not match the bare apex.
        - matchPattern: "cdn*.quay.io"
        - matchName: "gcr.io"
        # Ansible Galaxy — homelab-infra's collection requirements. 10 lookups
        # timed out on it 2026-08-24; it had never been listed.
        - matchName: "galaxy.ansible.com"
        # Helm chart repos referenced by homelab-k8s
        - matchName: "code.forgejo.org"  # oci://code.forgejo.org/forgejo-helm (platform/forgejo) — ETIMEDOUT confirmed 2026-07-16 first live run
        - matchName: "charts.bitnami.com"
        - matchName: "grafana.github.io"
        - matchName: "openbao.github.io"
        - matchName: "helm.cilium.io"
        - matchName: "argoproj.github.io"
        - matchName: "charts.external-secrets.io"  # actual chart repo host — external-secrets.io (apex) doesn't match, FQDN rules are exact-host; "Failed to look up helm package" confirmed 2026-07-16
        - matchName: "charts.goauthentik.io"  # platform/authentik — same failure mode, was missing entirely
        - matchName: "charts.crowdsec.net"
        - matchName: "charts.jetstack.io"
        - matchName: "kubernetes.github.io"
        - matchName: "kyverno.github.io"
        - matchName: "renovatebot.github.io"
        - matchName: "operator.victoriametrics.com"
        - matchName: "longhorn.io"
        # Full audit against every `repo:` in homelab-k8s
        # kustomization.yaml files 2026-07-16 — the list above had
        # accumulated ad hoc as failures surfaced one Renovate run at
        # a time; cross-checked all actually-referenced hosts at once
        # instead of waiting for each to fail individually.
        - matchName: "charts.longhorn.io"  # distinct host from longhorn.io above
        - matchName: "charts.min.io"
        - matchName: "cloudnative-pg.github.io"
        - matchName: "crowdsecurity.github.io"  # distinct host from charts.crowdsec.net above
        - matchName: "docs.altinity.com"  # infrastructure/clickhouse-operator
        - matchName: "guerzon.github.io"  # apps/vaultwarden
        - matchName: "jellyfin.github.io"
        - matchName: "langfuse.github.io"
        - matchName: "nextcloud.github.io"
        - matchName: "open-telemetry.github.io"
        - matchName: "prometheus-community.github.io"
        - matchName: "aquasecurity.github.io"  # infrastructure/trivy-operator
        - matchName: "falcosecurity.github.io"  # observability/falco-stack
        - matchName: "woodpecker-ci.org"
        # Language-package registries (first-party Python
        # apps' deps)
        - matchName: "pypi.org"
        - matchName: "files.pythonhosted.org"
        # GitHub (release notes, source archives for
        # github-tags / github-releases datasources)
        - matchName: "api.github.com"
        - matchName: "objects.githubusercontent.com"
        - matchName: "codeload.github.com"
        - matchName: "github.com"
        - matchName: "raw.githubusercontent.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
