# Renovate runner — weekly scan against Forgejo.
# Per ADR 0023 (Forgejo as source of truth) +
# update-policy.md (Renovate as the dependency-update bot
# for first-party + homelab-k8s repos).
#
# Status: activated 2026-07-16 (spec.suspend=false). Argo's
# Application does NOT flip suspend back to true on operator
# change — the suspend field is omitted from sync targets so
# Argo leaves the field alone after first apply. Confirmed via
# the syncOptions=RespectIgnoreDifferences pattern below.
#
# Schedule: weekly Saturday 05:00 Europe/Berlin (spec.timeZone),
# inside the central preset's `schedule: before 08:00 on saturday`
# window so PRs land before the operator's review pass.
#
# THE WINDOW HAD NEVER OPENED before 2026-09-09. This comment used
# to claim "before 06:00 Europe/Berlin" while the CronJob carried
# no `timeZone`, so `0 5 * * 6` fired at 05:00 UTC = 07:00 Berlin
# — outside the preset's `before 06:00 on saturday`, which is
# evaluated in Europe/Berlin. Every scheduled run since activation
# scanned all 32 repos and opened nothing, and each run's log
# looked healthy. `timeZone` is GA since Kubernetes 1.27 (cluster
# is 1.36; `kubectl explain cronjob.spec.timeZone` confirms).
# The preset window was widened to 08:00 in the same change: a run
# takes ~13 min across the org, and a 60-minute window that opens
# at the fire time leaves any repo processed late silently out.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/component: runner
  annotations:
    # Keep Argo from re-enabling the CronJob after the
    # operator manually flips suspend=false post-Forgejo.
    # The `suspend` field is excluded from diff/sync once
    # set to false (operator-controlled). See README.
    argocd.argoproj.io/sync-options: "Validate=true"
spec:
  suspend: false
  schedule: "0 5 * * 6"
  # Without this the schedule is kube-controller-manager's zone
  # (UTC) and the preset's Berlin-evaluated window is missed —
  # see the header comment.
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      # Renovate's longest steady-state run is bounded by
      # repo count × manifest count; cap at 4h to release
      # node resources if something wedges.
      activeDeadlineSeconds: 14400
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: renovate
            app.kubernetes.io/component: runner
        spec:
          serviceAccountName: renovate
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 12021     # `ubuntu` user in renovate/renovate image
            runAsGroup: 0
            fsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: renovate
              # OPERATOR PINS via Renovate (self-host: the
              # bot updates its own image pin in this repo).
              image: "renovate/renovate:38"
              imagePullPolicy: IfNotPresent
              env:
                # Renovate's CLI has no --config-file flag (only
                # ever accepted via env var or a default-named
                # file in cwd) — confirmed against
                # docs.renovatebot.com/self-hosted-configuration
                # 2026-07-16 after the first live run crashed
                # with "error: unknown option '--config-file=...'".
                # Never caught earlier because the CronJob had
                # never actually run before (shipped suspended
                # since scaffolding).
                - name: RENOVATE_CONFIG_FILE
                  value: /config/config.js
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-forgejo-token
                      key: token
                # github.com token for the github-releases /
                # github-tags datasources and release-notes
                # fetches. Renovate runs against Forgejo, so
                # nothing else authenticates it to github.com and
                # unauthenticated api.github.com is rate-limited to
                # 60 req/h — which is why `talos_version` and
                # `argocd_version` in homelab-infra's 00-defaults.yml
                # never got a PR. Renovate reads exactly this env
                # name (self-hosted docs @ 38.142.7: "The GitHub.com
                # token as an environment variable is needed to
                # fetch changelogs ... if you're using ... GitLab").
                # `optional: true` because the operator mints the
                # PAT by hand (externalsecret-github-token.yaml):
                # until kv/renovate/github is seeded the Secret does
                # not exist, and a hard reference would leave the
                # whole run stuck in CreateContainerConfigError
                # instead of just the GitHub deps staying dark.
                - name: GITHUB_COM_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-github-token
                      key: token
                      optional: true
                # registry.homelab.internal pull credential, read by
                # config.js into a `hostRules` entry. NOT prefixed
                # RENOVATE_: Renovate parses every RENOVATE_* env var
                # as a config option and would warn on an unknown
                # one. See registry-pull-secret.yaml.
                - name: HOMELAB_REGISTRY_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: renovate-registry-pull
                      key: username
                - name: HOMELAB_REGISTRY_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: renovate-registry-pull
                      key: password
                # registry.homelab.internal serves a certificate from
                # the homelab-internal-issuer (OpenBao PKI root); the
                # image trusts only public CAs, so every lookup there
                # failed with UNABLE_TO_VERIFY_LEAF_SIGNATURE. Node
                # APPENDS this file to its built-in bundle (unlike
                # SSL_CERT_FILE, which replaces it), so the pin-only
                # `homelab-root-ca` Bundle is the right one — public
                # registries keep working. Path per Renovate's
                # self-hosting docs @ 38.142.7 (NODE_EXTRA_CA_CERTS).
                - name: NODE_EXTRA_CA_CERTS
                  value: /etc/ssl/homelab/ca-bundle.pem
                # Log level + format are set in config.js
                # but Renovate also honours these env vars,
                # which is handy for ad-hoc debug runs.
                - name: LOG_LEVEL
                  value: "info"
                - name: RENOVATE_LOG_FORMAT
                  value: "json"
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: home
                  mountPath: /home/ubuntu
                - name: homelab-ca
                  mountPath: /etc/ssl/homelab
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
          volumes:
            - name: config
              configMap:
                name: renovate-config
                items:
                  - key: config.js
                    path: config.js
            # tmp + home are emptyDir — Renovate writes
            # cache + git clones here. Bound at 4Gi each
            # to cap node disk pressure if something runs
            # away.
            - name: tmp
              emptyDir:
                sizeLimit: 4Gi
            - name: home
              emptyDir:
                sizeLimit: 4Gi
            # trust-manager writes the `homelab-root-ca` Bundle
            # (infrastructure/trust-manager/bundles.yaml, key
            # ca-bundle.pem) into every namespace labelled
            # homelab.lab/inject-ca=true — namespace.yaml carries
            # the label. Deliberately NOT optional: a missing
            # ConfigMap must block the pod, because the alternative
            # is the pre-2026-09-09 state where first-party image
            # lookups fail quietly inside an otherwise green run.
            - name: homelab-ca
              configMap:
                name: homelab-root-ca
                items:
                  - key: ca-bundle.pem
                    path: ca-bundle.pem
