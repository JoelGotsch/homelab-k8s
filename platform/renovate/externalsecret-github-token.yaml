# github.com token for Renovate's GitHub-hosted datasources.
#
# Renovate runs against Forgejo, so nothing else authenticates it to
# github.com. The `github-releases` / `github-tags` datasources and the
# changelog fetches for PR bodies go to api.github.com, which caps
# anonymous callers at 60 requests/hour — enough to exhaust in one repo.
# Net effect until 2026-09-09: every `# renovate: datasource=github-releases`
# pin in homelab-infra's group_vars/all/00-defaults.yml (`talos_version`
# v1.13.0 with v1.13.10 upstream, `argocd_version`) was dark, with no
# error louder than "Failed to look up" at debug level.
#
# Renovate reads the token from exactly the env name GITHUB_COM_TOKEN
# (self-hosted docs @ 38.142.7: "The GitHub.com token as an environment
# variable is needed to fetch changelogs that are usually hosted on
# github.com ... you do need to add it if you're using GitHub Enterprise
# Server, GitLab, Azure DevOps, or Bitbucket" — Gitea/Forgejo is the same
# case). cronjob.yaml wires this Secret to that env var.
#
# OPERATOR-MINTED. Nothing in this estate can create a github.com PAT;
# the operator does it at github.com → Settings → Developer settings and
# seeds kv/renovate/github (see this layer's README "OpenBao paths to
# seed" and the homelab-infra inventory entry). Scope: read-only, public
# repositories only — a fine-grained PAT with "Public repositories"
# access and no permissions, or a classic PAT with no scopes. The bot
# never writes to GitHub (the GitHub mirror is a recovery path, ADR 0023).
#
# The CronJob's env reference is `optional: true`: until the path is
# seeded, this ExternalSecret sits in SecretSyncedError and the target
# Secret does not exist. A hard reference would hold the whole weekly run
# in CreateContainerConfigError for one missing token; an optional one
# leaves only the GitHub-hosted deps unlooked-up, which is the status quo.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: renovate-github-token
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: renovate-github-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: renovate/github
        property: token
