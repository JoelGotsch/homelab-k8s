# OpenBao UI exposed via Cilium Gateway API HTTPRoute.
# Internal-only — Tailscale-reachable per network.md (no
# Cloudflare Tunnel for OpenBao; pulls in too much risk per
# ADR 0024).
#
# OPERATOR FILLS hostname domain.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao-ui
  namespace: openbao
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: ingress
      sectionName: https
  hostnames:
    - "openbao.lab.vyramo.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: openbao
          port: 8200
