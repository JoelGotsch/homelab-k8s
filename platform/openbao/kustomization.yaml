# OpenBao day-2 config (post-bootstrap).
# OpenBao itself is INSTALLED by ansible/playbooks/09b-argocd-bootstrap.yml
# (homelab-infra). Argo takes over here for ongoing values
# updates + day-2 resources (snapshots, ingress, etc.).
#
# Per ADR 0018.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Re-apply the same Helm release with values matching the
# bootstrap install. Bootstrap-time values live in
# homelab-infra/ansible/files/openbao-{values,overrides}.yaml
# — operator keeps these in sync.
helmCharts:
  - name: openbao
    repo: https://openbao.github.io/openbao-helm
    version: "0.28.3"  # OPERATOR PINS via Renovate
    releaseName: openbao
    namespace: openbao
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - raft-snapshot-cronjob.yaml
  - raft-snapshot-hourly.yaml
  - httproute.yaml

# Patch the chart-rendered StatefulSet: switch
# podManagementPolicy from the chart's hardcoded OrderedReady
# to Parallel. Per ADR 0018 D11 (amendment 2026-06-24): the
# default OrderedReady policy amplified the 2026-06-22 single-
# pod failure into a 26h cluster-wide outage — openbao-2's pod
# never came back because openbao-0 was sealed, even though
# openbao-2's PVCs were intact. With Parallel, quorum can re-
# establish as soon as any two pods are unsealed regardless of
# ordinal-N-1 readiness.
#
# podManagementPolicy is IMMUTABLE on a live StatefulSet. The
# cutover requires `kubectl delete sts openbao --cascade=orphan`
# to drop the old SS without touching pods/PVCs, then this
# patched SS gets created by Argo and ADOPTS the existing pods
# via label match.
#
# The openbao-helm 0.28.3 chart has no values override for
# this field (verified via `helm template` 2026-06-24), hence
# the patch.
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: openbao
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: openbao
      spec:
        podManagementPolicy: Parallel
