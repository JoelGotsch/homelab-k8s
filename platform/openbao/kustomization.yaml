# OpenBao day-2 config (post-bootstrap).
# OpenBao itself is INSTALLED by ansible/playbooks/09b-argocd-bootstrap.yml
# (homelab-infra). Argo takes over here for ongoing values
# updates + day-2 resources (snapshots, ingress, etc.).
#
# Per ADR 0018.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Re-apply the same Helm release with values matching the
# bootstrap install. Bootstrap-time values live in
# homelab-infra/ansible/files/openbao-{values,overrides}.yaml
# — operator keeps these in sync.
helmCharts:
  - name: openbao
    repo: https://openbao.github.io/openbao-helm
    version: "0.28.4" # OPERATOR PINS via Renovate
    releaseName: openbao
    namespace: openbao
    valuesFile: values.yaml
    includeCRDs: true
resources:
  - snapshot-serviceaccount.yaml
  # Transitional rollback bridge only. Snapshot workloads do not reference it;
  # remove it after the one-off, natural schedules, checksum, and restore gates.
  - snapshot-token-rollback-bridge.yaml
  - raft-snapshot-cronjob.yaml
  - raft-snapshot-hourly.yaml
  - snapshot-uploader-config.yaml
  - snapshot-networkpolicy.yaml
  - snapshot-prometheusrule.yaml
  - httproute.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: openbao-snapshot-scripts
    namespace: openbao
    files:
      - snapshot-auth.sh
      - snapshot-upload.sh
# ADR 0036: cluster-wide resource-governance baseline.
# NOTE: the openbao namespace itself is bootstrapped by
# homelab-k8s/bootstrap/bootstrap-namespaces.yaml (ansible
# creates it during 09b-argocd-bootstrap). The first-party +
# data-class labels there must be added in a separate
# bootstrap-focused pass; this component adds the LimitRange
# + ResourceQuota + default-deny scaffold into the already-
# existing ns.
components:
  - ../../components/site-config   # build-only ConfigMap for the replacement below

# Resolve the HTTPRoute hostname from the single site-config (no hardcoded
# domain): `openbao.FQDN_SUFFIX` -> `openbao.<fqdn_suffix>`. Provenance: this rule
# -> ConfigMap/site-config.data.fqdn_suffix -> components/site-config/site-config.env.
replacements:
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.fqdn_suffix }
    targets:
      - select: { kind: HTTPRoute, name: openbao-ui }
        fieldPaths: [spec.hostnames.0]
        options: { delimiter: '.', index: 1 }
