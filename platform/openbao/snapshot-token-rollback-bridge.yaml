# TEMPORARY ROLLBACK BRIDGE — NOT A WORKLOAD CREDENTIAL.
#
# The snapshot Jobs switch to short-lived Kubernetes-auth tokens in OBA-02, but
# the pre-existing static token is retained, unused, until the one-off hourly
# and daily Jobs, natural schedules, remote checksum, and restore rehearsal all
# pass. This preserves a reviewed rollback path while evidence accrues. The
# token expires on 2026-08-19 and must never be renewed or replaced.
#
# Final cleanup is intentionally a separate, evidence-gated change: revoke the
# accessor, remove kv/prod/openbao/snapshot-token, delete this manifest, and
# tighten scripts/check-openbao-snapshot-auth.sh to forbid the bridge entirely.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openbao-snapshot-token
  namespace: openbao
  annotations:
    migration.homelab.internal/remove-after: "OBA-02 restore rehearsal"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: openbao-snapshot-token
  data:
    - secretKey: token
      remoteRef:
        key: prod/openbao/snapshot-token
        property: token
