# OpenBao values — Argo-managed (matches the live helm release
# captured 2026-05-23). Bootstrap install in
# homelab-infra/ansible/files/openbao-{values,overrides}.yaml
# produces the SAME effective config; check-values-drift.sh
# verifies they stay in sync. Per ADR 0018.

csi:
  enabled: false
global:
  enabled: true
  # Match bootstrap config — chart default tlsDisable=true
  # injects BAO_ADDR=http://127.0.0.1:8200, but our listener
  # is HTTPS. Without this, the readinessProbe (`bao status`)
  # + livenessProbe both fail; pod stays 0/1 + crashloops on
  # liveness. See homelab-infra/ansible/files/openbao-values.yaml
  # for the full rationale.
  tlsDisable: false
injector:
  enabled: false
# seal config: Shamir is the OpenBao default seal type and requires NO
# values.yaml stanza. The chart (openbao-0.28.3) has no `seal.*` key
# at all — a top-level `seal:` block is silently dropped at render
# (audit 2026-06-04, finding #12). Seal parameters (secretShares=3,
# secretThreshold=2) are set at `bao operator init` time by the
# operator (not by Helm) and are stored inside the Raft data volume.
# See homelab-docs/04-guides/cold-start.md §OpenBao init.
server:
  affinity: "podAntiAffinity:\n  requiredDuringSchedulingIgnoredDuringExecution:\n\
    \    - labelSelector:\n        matchLabels:\n          app.kubernetes.io/name:\
    \ openbao\n          app.kubernetes.io/instance: openbao\n          component:\
    \ server\n      topologyKey: kubernetes.io/hostname\n"
  auditStorage:
    accessMode: ReadWriteOnce
    enabled: true
    size: 5Gi
    storageClass: longhorn-replica2
  dataStorage:
    accessMode: ReadWriteOnce
    enabled: true
    size: 10Gi
    storageClass: longhorn-replica2
  extraEnvironmentVars:
    OPENBAO_CLUSTER_NAME: homelab
    # In-pod bao client talks to its own listener over HTTPS;
    # the bootstrap TLS cert is self-signed (not in the pod's
    # CA bundle). Skip-verify keeps readiness probe working.
    BAO_SKIP_VERIFY: "true"
  extraVolumes:
  - name: openbao-tls
    type: secret
  ha:
    enabled: true
    raft:
      config: "cluster_addr = \"https://POD_IP:8201\"\napi_addr = \"https://POD_IP:8200\"\
        \n\nlistener \"tcp\" {\n  tls_disable = 0\n  address = \"[::]:8200\"\n  cluster_address\
        \ = \"[::]:8201\"\n  tls_cert_file = \"/openbao/userconfig/openbao-tls/tls.crt\"\
        \n  tls_key_file  = \"/openbao/userconfig/openbao-tls/tls.key\"\n}\n\nstorage\
        \ \"raft\" {\n  path = \"/openbao/data\"\n\n  retry_join {\n    leader_api_addr\
        \ = \"https://openbao-0.openbao-internal:8200\"\n    leader_ca_cert_file =\
        \ \"/openbao/userconfig/openbao-tls/ca.crt\"\n  }\n  retry_join {\n    leader_api_addr\
        \ = \"https://openbao-1.openbao-internal:8200\"\n    leader_ca_cert_file =\
        \ \"/openbao/userconfig/openbao-tls/ca.crt\"\n  }\n  retry_join {\n    leader_api_addr\
        \ = \"https://openbao-2.openbao-internal:8200\"\n    leader_ca_cert_file =\
        \ \"/openbao/userconfig/openbao-tls/ca.crt\"\n  }\n\n  autopilot {\n    cleanup_dead_servers\
        \ = true\n    last_contact_threshold = \"10s\"\n    min_quorum = 2\n    server_stabilization_time\
        \ = \"10s\"\n  }\n}\n\nservice_registration \"kubernetes\" {}\n\ntelemetry\
        \ {\n  prometheus_retention_time = \"30s\"\n  disable_hostname = true\n}\n"
      enabled: true
      setNodeId: true
    replicas: 3
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    # HTTPS scheme required: our listener has tls_disable=0 (HTTPS),
    # so without `scheme: HTTPS` the kubelet probe hits HTTP against
    # the HTTPS listener → HTTP 400 → probe fails → container killed →
    # crashloop. Matching homelab-infra/ansible/files/openbao-values.yaml
    # (handoff drift fix, audit 2026-06-04).
    scheme: HTTPS
    # Status-code tolerance: chart-default path returns 503 for
    # sealed pods + 501 for uninitialized. Kubelet treats both
    # as failure → kills container → crashloop during the
    # operator-attended unseal window (or before init). Tell
    # OpenBao to return 204 (success) for both. See homelab-
    # infra/ansible/files/openbao-values.yaml for context.
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
  logFormat: json
  logLevel: info
  readinessProbe:
    enabled: true
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  service:
    enabled: true
    type: ClusterIP
  serviceAccount:
    create: true
ui:
  enabled: true
  serviceType: ClusterIP
