# OpenBao values — Argo-managed (matches the live helm release
# captured 2026-05-23). Bootstrap install in
# homelab-infra/ansible/files/openbao-{values,overrides}.yaml
# produces the SAME effective config; check-values-drift.sh
# verifies they stay in sync. Per ADR 0018.

csi:
  enabled: false
global:
  enabled: true
  # Match bootstrap config — chart default tlsDisable=true
  # injects BAO_ADDR=http://127.0.0.1:8200, but our listener
  # is HTTPS. Without this, the readinessProbe (`bao status`)
  # + livenessProbe both fail; pod stays 0/1 + crashloops on
  # liveness. See homelab-infra/ansible/files/openbao-values.yaml
  # for the full rationale.
  tlsDisable: false
injector:
  enabled: false
# seal config: ADR 0018 D10 — migrated to OpenBao `static` seal
# auto-unseal 2026-06-25 per the validated procedure in
# initial-setup.md §C. Empty `seal "static" {}` HCL stanza is the
# wrapper-load trigger (configless mode doesn't work). The key
# material is projected from the openbao-static-seal Secret via
# `extraSecretEnvironmentVars` below — BAO_STATIC_SEAL_CURRENT_KEY
# (44-char base64 of 32 raw bytes) and BAO_STATIC_SEAL_CURRENT_KEY_ID
# (rotation tracker). Read by the OpenBao static wrapper plugin at
# go-kms-wrapping/wrappers/static/v2.1.1/static.go.
#
# Per-restart, pods auto-unseal against the static key — no operator
# touch needed. Shamir shares from the original 2026-04-23 init are
# RETIRED to recovery-key role (per D10 amendment) and only used
# for generate-root or future seal migrations.
#
# IMPORTANT: file:// and env:// URI schemes in the HCL DO NOT work
# on OpenBao 2.5.4 (docs are aspirational; binary doesn't implement
# them — source verification 2026-06-25). Only the env-var pattern
# above + empty HCL stanza work in combination.
server:
  # ADR 0018 D11 (amendment 2026-06-24): Parallel pod management
  # so raft quorum can re-establish as soon as any two pods are
  # unsealed, regardless of ordinal-N-1 readiness (the default
  # OrderedReady amplified the 2026-06-22 single-pod failure into
  # a 26h outage). Chart 0.28.4 exposes this exact value at
  # server.podManagementPolicy, so no Kustomize StatefulSet patch
  # is needed.
  podManagementPolicy: Parallel
  # Digest-pinned image (2026-07-20). The chart otherwise renders a
  # bare `quay.io/openbao/openbao:<appVersion>` TAG. During the 2.5.5
  # rollout, worker3's Spegel P2P mesh had lost connectivity after
  # worker1's reboot, so its containerd blocked on the local Spegel
  # mirror (which cannot resolve TAGS, only digests) and never fell
  # back to quay — openbao-1 hung 30+ min in ContainerCreating while
  # quorum held at 2/3. A DIGEST reference is servable P2P by any peer
  # that has the image (worker1/worker2 did), sidestepping tag
  # resolution entirely, and also satisfies the digest-pinning Kyverno
  # policy that had been warning on every openbao pod. `:2.5.5@sha256`
  # keeps the human-readable tag; containerd uses the digest. Bump BOTH
  # tag and digest together on the next chart appVersion change.
  image:
    registry: "quay.io"
    repository: "openbao/openbao"
    tag: "2.5.5@sha256:6150c4a6b62067db6141c8da7a6a6b5763f4f47c315343d0c848b40fecdfd452"
  affinity: "podAntiAffinity:\n  requiredDuringSchedulingIgnoredDuringExecution:\n\
    \    - labelSelector:\n        matchLabels:\n          app.kubernetes.io/name:\
    \ openbao\n          app.kubernetes.io/instance: openbao\n          component:\
    \ server\n      topologyKey: kubernetes.io/hostname\n"
  # The immutable live claim templates still name longhorn-replica2
  # (StorageClass reclaim=Delete), while every current OpenBao PV was
  # separately verified with reclaimPolicy=Retain. Do not delete or
  # recreate these claims. P0-08/KST owns a reviewed migration to
  # longhorn-replica2-retain; the bootstrap and Argo values remain
  # byte-identical until that migration can change both safely.
  auditStorage:
    accessMode: ReadWriteOnce
    enabled: true
    size: 5Gi
    storageClass: longhorn-replica2
  dataStorage:
    accessMode: ReadWriteOnce
    enabled: true
    size: 10Gi
    storageClass: longhorn-replica2
  extraEnvironmentVars:
    OPENBAO_CLUSTER_NAME: homelab
    # In-pod bao client talks to its own listener over HTTPS;
    # the bootstrap TLS cert is self-signed (not in the pod's
    # CA bundle). Skip-verify keeps readiness probe working.
    BAO_SKIP_VERIFY: "true"
  # ADR 0018 D10: project the static-seal key + key-id from the
  # `openbao-static-seal` Secret as env vars. The OpenBao static
  # wrapper plugin reads these names exactly; do NOT rename.
  extraSecretEnvironmentVars:
    - envName: BAO_STATIC_SEAL_CURRENT_KEY
      secretName: openbao-static-seal
      secretKey: current_key
    - envName: BAO_STATIC_SEAL_CURRENT_KEY_ID
      secretName: openbao-static-seal
      secretKey: current_key_id
  extraVolumes:
  - name: openbao-tls
    type: secret
  ha:
    enabled: true
    raft:
      # Rewritten as YAML literal block scalar 2026-06-25 for
      # readability when adding the empty `seal "static" {}` block.
      # Otherwise semantically identical to the prior escape-encoded
      # form. Bootstrap parity tracked at homelab-infra/ansible/
      # files/openbao-values.yaml.
      config: |
        cluster_addr = "https://POD_IP:8201"
        api_addr = "https://POD_IP:8200"

        listener "tcp" {
          tls_disable = 0
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file = "/openbao/userconfig/openbao-tls/tls.crt"
          tls_key_file  = "/openbao/userconfig/openbao-tls/tls.key"
        }

        storage "raft" {
          path = "/openbao/data"

          retry_join {
            leader_api_addr = "https://openbao-0.openbao-internal:8200"
            leader_ca_cert_file = "/openbao/userconfig/openbao-tls/ca.crt"
          }
          retry_join {
            leader_api_addr = "https://openbao-1.openbao-internal:8200"
            leader_ca_cert_file = "/openbao/userconfig/openbao-tls/ca.crt"
          }
          retry_join {
            leader_api_addr = "https://openbao-2.openbao-internal:8200"
            leader_ca_cert_file = "/openbao/userconfig/openbao-tls/ca.crt"
          }

          autopilot {
            cleanup_dead_servers = true
            last_contact_threshold = "10s"
            min_quorum = 2
            server_stabilization_time = "10s"
          }
        }

        # ADR 0018 D10 — wrapper-load trigger. EMPTY block is correct;
        # current_key + current_key_id are provided via env vars from
        # the openbao-static-seal Secret (see extraSecretEnvironmentVars
        # above). DO NOT put `current_key = "..."` here — the validated
        # working form is empty stanza + env-var injection.
        seal "static" {}

        service_registration "kubernetes" {}

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }
      enabled: true
      setNodeId: true
    replicas: 3
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    scheme: HTTPS
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
  logFormat: json
  logLevel: info
  readinessProbe:
    enabled: true
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  service:
    enabled: true
    type: ClusterIP
  serviceAccount:
    create: true
ui:
  enabled: true
  serviceType: ClusterIP
