# OpenBao values — Argo-managed (matches the live helm release
# captured 2026-05-23). Bootstrap install in
# homelab-infra/ansible/files/openbao-{values,overrides}.yaml
# produces the SAME effective config; check-values-drift.sh
# verifies they stay in sync. Per ADR 0018.

csi:
  enabled: false
global:
  enabled: true
  # Match bootstrap config — chart default tlsDisable=true
  # injects BAO_ADDR=http://127.0.0.1:8200, but our listener
  # is HTTPS. Without this, the readinessProbe (`bao status`)
  # + livenessProbe both fail; pod stays 0/1 + crashloops on
  # liveness. See homelab-infra/ansible/files/openbao-values.yaml
  # for the full rationale.
  tlsDisable: false
injector:
  enabled: false
# seal config: pre-2026-06-24 used the OpenBao default Shamir
# seal type (no values.yaml stanza, init-time parameters). Per
# ADR 0018 D10 amendment 2026-06-24, migrated to `seal "static"`.
# The `seal "static" { ... }` HCL block is embedded INSIDE the
# raft.config string below (alongside listener / storage / etc.),
# because the chart's top-level `seal:` key is silently dropped
# at render (audit 2026-06-04, finding #12). Migration from
# Shamir → static was a one-time `bao operator unseal -migrate`
# operation; current Shamir shares now serve as recovery keys
# only (cannot unseal pods; authorize generate-root and future
# seal-migration only). See:
# - homelab-docs/02-decisions/0018-openbao-deployment-shape.md D10
# - homelab-docs/03-runbooks/openbao/initial-setup.md §Section C
server:
  affinity: "podAntiAffinity:\n  requiredDuringSchedulingIgnoredDuringExecution:\n\
    \    - labelSelector:\n        matchLabels:\n          app.kubernetes.io/name:\
    \ openbao\n          app.kubernetes.io/instance: openbao\n          component:\
    \ server\n      topologyKey: kubernetes.io/hostname\n"
  auditStorage:
    accessMode: ReadWriteOnce
    enabled: true
    size: 5Gi
    storageClass: longhorn-replica2
  dataStorage:
    accessMode: ReadWriteOnce
    enabled: true
    size: 10Gi
    storageClass: longhorn-replica2
  extraEnvironmentVars:
    OPENBAO_CLUSTER_NAME: homelab
    # In-pod bao client talks to its own listener over HTTPS;
    # the bootstrap TLS cert is self-signed (not in the pod's
    # CA bundle). Skip-verify keeps readiness probe working.
    BAO_SKIP_VERIFY: "true"
  extraVolumes:
  - name: openbao-tls
    type: secret
  # ADR 0018 D10: 32-byte static-seal key delivered as K8s Secret,
  # mounted at /openbao/userconfig/openbao-static-seal/unseal.key.
  # The Secret is created ONE-TIME by the operator (see
  # 03-runbooks/openbao/initial-setup.md §C2) — not declared in
  # Git, not Renovate-rotatable. Rotation = re-init seal-type +
  # restart, per the same runbook.
  - name: openbao-static-seal
    type: secret
  ha:
    enabled: true
    raft:
      # Rewritten as a YAML literal block scalar 2026-06-24 for
      # readability when adding the `seal "static"` block per
      # ADR 0018 D10. Semantically identical to the previous
      # escape-encoded form for everything except the new seal
      # block. Bootstrap parity tracked at
      # homelab-infra/ansible/files/openbao-values.yaml.
      config: |
        cluster_addr = "https://POD_IP:8201"
        api_addr = "https://POD_IP:8200"

        listener "tcp" {
          tls_disable = 0
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file = "/openbao/userconfig/openbao-tls/tls.crt"
          tls_key_file  = "/openbao/userconfig/openbao-tls/tls.key"
        }

        storage "raft" {
          path = "/openbao/data"

          retry_join {
            leader_api_addr = "https://openbao-0.openbao-internal:8200"
            leader_ca_cert_file = "/openbao/userconfig/openbao-tls/ca.crt"
          }
          retry_join {
            leader_api_addr = "https://openbao-1.openbao-internal:8200"
            leader_ca_cert_file = "/openbao/userconfig/openbao-tls/ca.crt"
          }
          retry_join {
            leader_api_addr = "https://openbao-2.openbao-internal:8200"
            leader_ca_cert_file = "/openbao/userconfig/openbao-tls/ca.crt"
          }

          autopilot {
            cleanup_dead_servers = true
            last_contact_threshold = "10s"
            min_quorum = 2
            server_stabilization_time = "10s"
          }
        }

        # ADR 0018 D10: static-seal auto-unseal. 32-byte AES-256-GCM
        # key delivered via the openbao-static-seal Secret (see
        # extraVolumes above), mounted at this exact path. Migration
        # from Shamir → static was a one-time `bao operator unseal
        # -migrate` operation on 2026-06-24. current_key_id is
        # rotation-tracking metadata only; OpenBao doesn't use it
        # internally except to distinguish current vs previous keys
        # during a rotation event.
        seal "static" {
          current_key_id = "20260624-1"
          current_key    = "file:///openbao/userconfig/openbao-static-seal/unseal.key"
        }

        service_registration "kubernetes" {}

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }
      enabled: true
      setNodeId: true
    replicas: 3
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    # HTTPS scheme required: our listener has tls_disable=0 (HTTPS),
    # so without `scheme: HTTPS` the kubelet probe hits HTTP against
    # the HTTPS listener → HTTP 400 → probe fails → container killed →
    # crashloop. Matching homelab-infra/ansible/files/openbao-values.yaml
    # (handoff drift fix, audit 2026-06-04).
    scheme: HTTPS
    # Status-code tolerance: chart-default path returns 503 for
    # sealed pods + 501 for uninitialized. Kubelet treats both
    # as failure → kills container → crashloop during the
    # operator-attended unseal window (or before init). Tell
    # OpenBao to return 204 (success) for both. See homelab-
    # infra/ansible/files/openbao-values.yaml for context.
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
  logFormat: json
  logLevel: info
  readinessProbe:
    enabled: true
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  service:
    enabled: true
    type: ClusterIP
  serviceAccount:
    create: true
ui:
  enabled: true
  serviceType: ClusterIP
