# OpenBao values — Argo-managed (matches the live helm release
# captured 2026-05-23). Bootstrap install in
# homelab-infra/ansible/files/openbao-{values,overrides}.yaml
# produces the SAME effective config; check-values-drift.sh
# verifies they stay in sync. Per ADR 0018.

csi:
  enabled: false
global:
  enabled: true
  # Match bootstrap config — chart default tlsDisable=true
  # injects BAO_ADDR=http://127.0.0.1:8200, but our listener
  # is HTTPS. Without this, the readinessProbe (`bao status`)
  # + livenessProbe both fail; pod stays 0/1 + crashloops on
  # liveness. See homelab-infra/ansible/files/openbao-values.yaml
  # for the full rationale.
  tlsDisable: false
injector:
  enabled: false
# seal config: per ADR 0018 D10, migrating to OpenBao 'static' seal
# auto-unseal. The `seal "static" { ... }` HCL block is embedded
# INSIDE the raft.config string below (the chart's top-level
# `seal:` key is silently dropped at render — audit 2026-06-04
# finding #12). Shamir was the pre-2026-06-25 default; after the
# migration, the Shamir shares serve as recovery keys only
# (cannot unseal pods; authorize generate-root + future seal-
# migration only). See:
# - homelab-docs/02-decisions/0018-openbao-deployment-shape.md D10
# - homelab-docs/03-runbooks/openbao/initial-setup.md §Section C
#   (corrected 2026-06-24 after the first failed migration attempt
#   — strict sequential per-pod, loosened liveness probe during
#   the migration window).
server:
  affinity: "podAntiAffinity:\n  requiredDuringSchedulingIgnoredDuringExecution:\n\
    \    - labelSelector:\n        matchLabels:\n          app.kubernetes.io/name:\
    \ openbao\n          app.kubernetes.io/instance: openbao\n          component:\
    \ server\n      topologyKey: kubernetes.io/hostname\n"
  auditStorage:
    accessMode: ReadWriteOnce
    enabled: true
    size: 5Gi
    storageClass: longhorn-replica2
  dataStorage:
    accessMode: ReadWriteOnce
    enabled: true
    size: 10Gi
    storageClass: longhorn-replica2
  extraEnvironmentVars:
    OPENBAO_CLUSTER_NAME: homelab
    # In-pod bao client talks to its own listener over HTTPS;
    # the bootstrap TLS cert is self-signed (not in the pod's
    # CA bundle). Skip-verify keeps readiness probe working.
    BAO_SKIP_VERIFY: "true"
  extraVolumes:
  - name: openbao-tls
    type: secret
  # ADR 0018 D10: 32-byte AES-256-GCM static-seal key, mounted at
  # /openbao/userconfig/openbao-static-seal/unseal.key. Secret is
  # operator-applied one-time (NOT in Git) — created 2026-06-24,
  # see homelab-docs/03-runbooks/openbao/initial-setup.md §C2.
  - name: openbao-static-seal
    type: secret
  ha:
    enabled: true
    raft:
      # Rewritten as a YAML literal block scalar 2026-06-25 for
      # readability when adding the `seal "static"` block per
      # ADR 0018 D10. Semantically identical to the previous
      # escape-encoded form for everything except the new seal
      # block. Bootstrap parity tracked at
      # homelab-infra/ansible/files/openbao-values.yaml.
      config: |
        cluster_addr = "https://POD_IP:8201"
        api_addr = "https://POD_IP:8200"

        listener "tcp" {
          tls_disable = 0
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file = "/openbao/userconfig/openbao-tls/tls.crt"
          tls_key_file  = "/openbao/userconfig/openbao-tls/tls.key"
        }

        storage "raft" {
          path = "/openbao/data"

          retry_join {
            leader_api_addr = "https://openbao-0.openbao-internal:8200"
            leader_ca_cert_file = "/openbao/userconfig/openbao-tls/ca.crt"
          }
          retry_join {
            leader_api_addr = "https://openbao-1.openbao-internal:8200"
            leader_ca_cert_file = "/openbao/userconfig/openbao-tls/ca.crt"
          }
          retry_join {
            leader_api_addr = "https://openbao-2.openbao-internal:8200"
            leader_ca_cert_file = "/openbao/userconfig/openbao-tls/ca.crt"
          }

          autopilot {
            cleanup_dead_servers = true
            last_contact_threshold = "10s"
            min_quorum = 2
            server_stabilization_time = "10s"
          }
        }

        # ADR 0018 D10: static-seal auto-unseal. 32-byte AES-256-GCM
        # key delivered via the openbao-static-seal Secret (see
        # extraVolumes above), mounted at this exact path. Migration
        # from Shamir → static via `bao operator unseal -migrate`
        # per initial-setup.md §C (corrected procedure 2026-06-24).
        # current_key_id is rotation-tracking metadata only.
        seal "static" {
          current_key_id = "20260624-1"
          current_key    = "file:///openbao/userconfig/openbao-static-seal/unseal.key"
        }

        service_registration "kubernetes" {}

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }
      enabled: true
      setNodeId: true
    replicas: 3
  # LOOSENED FOR D10 MIGRATION WINDOW (2026-06-25).
  # The HTTP /v1/sys/health probe doesn't tolerate the transient
  # "Seal Migration in Progress" + "barrier seal type mismatch"
  # state that pods enter while `bao operator unseal -migrate`
  # is rewrapping the master key in raft. Yesterday's first
  # attempt failed because the probe killed pods mid-migration
  # before the rewrap could commit (see journal 2026-06-22
  # postmortem). For the migration window we disable the
  # liveness probe entirely; readinessProbe still gates Service
  # endpoints. RESTORE TO HTTP PROBE AFTER MIGRATION COMPLETES
  # (separate commit, per initial-setup.md §C5b).
  livenessProbe:
    enabled: false
    # Original probe shape preserved here for the restore commit:
    # initialDelaySeconds: 60
    # scheme: HTTPS
    # path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
  logFormat: json
  logLevel: info
  readinessProbe:
    enabled: true
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  service:
    enabled: true
    type: ClusterIP
  serviceAccount:
    create: true
ui:
  enabled: true
  serviceType: ClusterIP
