# Hourly Raft snapshot to the local Longhorn tier. Authentication is a
# bounded-audience projected Kubernetes JWT exchanged for a 15-minute OpenBao
# batch token at run time; no static OpenBao token or Kubernetes Secret exists.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-raft-snapshots
  namespace: openbao
  labels:
    recurring-job-group.longhorn.io/secret-personal: "enabled"
  annotations:
    retention.homelab.internal/reason: "Hourly Raft snapshots — the local tier-1 of the OpenBao backup chain (per ADR 0018 D5)."
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-replica2
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-raft-snapshot-hourly
  namespace: openbao
spec:
  schedule: "5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-raft-snapshot
            app.kubernetes.io/component: hourly-local
            app.kubernetes.io/part-of: openbao
        spec:
          restartPolicy: OnFailure
          serviceAccountName: openbao-raft-snapshot
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: snapshot
              image: quay.io/openbao/openbao:2.5.5@sha256:6150c4a6b62067db6141c8da7a6a6b5763f4f47c315343d0c848b40fecdfd452
              imagePullPolicy: IfNotPresent
              env:
                - name: BAO_ADDR
                  value: https://openbao.openbao.svc:8200
                - name: BAO_CACERT
                  value: /vault/userconfig/openbao-tls/ca.crt
                # The hourly workload has no second container; keep its retained
                # local snapshot and checksum owner-only.
                - name: SNAPSHOT_PUBLISH_MODE
                  value: "0600"
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  SNAPSHOT_OUTPUT="/snapshots/bao-${ts}.snap" /app/snapshot-auth.sh
                  # Seven days at hourly cadence. Remove each checksum with its
                  # snapshot so evidence cannot outlive the file it describes.
                  ls -1t /snapshots/bao-*.snap 2>/dev/null | tail -n +169 |
                    while IFS= read -r old; do rm -f "$old" "${old}.sha256"; done
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
              resources:
                requests: { cpu: 10m, memory: 64Mi }
                limits: { cpu: 100m, memory: 128Mi }
              volumeMounts:
                - { name: tls, mountPath: /vault/userconfig/openbao-tls, readOnly: true }
                - { name: snapshots, mountPath: /snapshots }
                - { name: workload-jwt, mountPath: /var/run/secrets/openbao-auth, readOnly: true }
                - { name: snapshot-scripts, mountPath: /app, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tls
              secret: { secretName: openbao-tls }
            - name: snapshots
              persistentVolumeClaim: { claimName: openbao-raft-snapshots }
            - name: workload-jwt
              projected:
                defaultMode: 0400
                sources:
                  - serviceAccountToken:
                      audience: openbao
                      expirationSeconds: 900
                      path: token
            - name: snapshot-scripts
              configMap:
                name: openbao-snapshot-scripts
                defaultMode: 0555
            - name: tmp
              emptyDir: { medium: Memory, sizeLimit: 4Mi }
