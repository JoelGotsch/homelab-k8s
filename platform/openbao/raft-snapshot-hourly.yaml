# Hourly Raft snapshot to a local Longhorn volume.
# Per ADR 0018 D5 + backup-and-dr.md §"OpenBao":
# "Hourly Raft snapshot via `bao operator raft snapshot save`
# to local Longhorn volume."
#
# Closes the gap surfaced by
# 99-journal/2026-05-02-backup-topology-gap-check.md item 2 —
# the daily-to-Hetzner CronJob (raft-snapshot-cronjob.yaml)
# was the only snapshot path; this scaffolds the architecture-
# documented hourly-local tier.
#
# Snapshot token Secret (`openbao-snapshot-token`) is already
# projected by raft-snapshot-cronjob.yaml's ExternalSecret;
# this CronJob reuses it.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-raft-snapshots
  namespace: openbao
  labels:
    # Per infrastructure/longhorn/recurring-jobs.yaml: opt the
    # snapshot-storage PVC itself into Longhorn's
    # `secret-personal` group so the snapshots-of-the-snapshots
    # PVC also gets hourly Longhorn-volume snapshots. The chain
    # is intentional — Raft-snapshot fidelity at hourly cadence
    # both at file-level (this CronJob) and at block-level
    # (Longhorn).
    recurring-job-group.longhorn.io/secret-personal: "enabled"
  annotations:
    # ADR 0036: -retain SCs require a rationale.
    retention.homelab.internal/reason: "Hourly Raft snapshots — the local tier-1 of the OpenBao backup chain (per ADR 0018 D5)."
spec:
  accessModes: [ReadWriteOnce]
  # 2026-07-09 ADR 0036: migrate to -retain family.
  storageClassName: longhorn-replica2
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-raft-snapshot-hourly
  namespace: openbao
spec:
  schedule: "5 * * * *"  # hourly at :05 (offset within the hour per
  # 2026-06-09 OOM-cascade RCA §"Recommended fixes" #3 / commit 1b405df:
  # openbao bucket of the staggered-snapshot allocation).
  # Hardening per 2026-06-08 + 2026-06-09 OpenBao incidents: a wedged
  # Longhorn VolumeAttachment kept the snapshot pod in ContainerCreating;
  # its finalizer blocked fresh VAs and the operator had to force-delete
  # the pod each time. activeDeadlineSeconds bounds the wedge,
  # ttl + startingDeadlineSeconds prevent pod / missed-run accumulation.
  # concurrencyPolicy is `Forbid` (not Replace) per 2026-06-09 RCA §3:
  # under a cascade, Replace would kill the previous pod mid-snapshot,
  # leaving a half-flushed file on the snapshot PVC and re-triggering
  # the VA churn that started the cascade. Forbid skips overlap instead.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 300
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: openbao
          containers:
            - name: snapshot
              image: quay.io/openbao/openbao:2.5.4  # OPERATOR PINS via Renovate. Match the
              # server image; docker.io/openbao/openbao:0.10.0 doesn't exist → ImagePullBackOff.
              # Fixed 2026-05-29.
              env:
                - name: BAO_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: openbao-snapshot-token
                      key: token
                - name: BAO_ADDR
                  value: https://openbao.openbao.svc:8200
                - name: BAO_CACERT
                  value: /vault/userconfig/openbao-tls/ca.crt
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  bao operator raft snapshot save \
                    /snapshots/bao-${TS}.snap
                  # Prune: keep latest 168 hourly snapshots
                  # (7 days at hourly cadence — matches
                  # backup-and-dr.md §"Retention schedules"
                  # tier-1 row for `secret` class).
                  ls -1t /snapshots/bao-*.snap 2>/dev/null \
                    | tail -n +169 \
                    | xargs -r rm -f
              # Per 2026-06-09 OOM-cascade RCA §"Recommended fixes" #4
              # (commit 1b405df): bound the snapshot pod's anon RSS so
              # it can't drift up alongside an instance-manager spike
              # and push the worker over Talos's node-OOM threshold.
              # 128Mi is enough for `bao operator raft snapshot save`
              # at our raft size; bump if the snapshot file grows past
              # 80MB on disk.
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: tls
                  mountPath: /vault/userconfig/openbao-tls
                  readOnly: true
                - name: snapshots
                  mountPath: /snapshots
          volumes:
            - name: tls
              secret:
                secretName: openbao-tls
            - name: snapshots
              persistentVolumeClaim:
                claimName: openbao-raft-snapshots
