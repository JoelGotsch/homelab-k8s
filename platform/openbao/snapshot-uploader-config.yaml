# Public, independently verified Storage Box host keys plus the minimal uid 1000
# identity files required by the digest-pinned restic image's OpenSSH client.
# `scripts/check-openbao-snapshot-auth.sh` enforces byte equality with the
# backup-cronjobs copies so one key rotation cannot silently leave this lane stale.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-snapshot-uploader-config
  namespace: openbao
data:
  known_hosts: |
    u609156.your-storagebox.de,[u609156.your-storagebox.de]:22,[u609156.your-storagebox.de]:23 ssh-rsa 
    u609156.your-storagebox.de,[u609156.your-storagebox.de]:22,[u609156.your-storagebox.de]:23 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICf9svRenC/PLKIL9nk6K/pxQgoiFC41wTNvoIncOxs
  passwd: |
    root:x:0:0:root:/root:/bin/sh
    backup:x:1000:1000:backup:/tmp:/bin/sh
    nobody:x:65534:65534:nobody:/nonexistent:/sbin/nologin
  group: |
    root:x:0:
    backup:x:1000:
    nobody:x:65534:
