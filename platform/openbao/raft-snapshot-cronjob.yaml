# Daily Raft snapshot to Hetzner Storage Box.
# Per ADR 0018 D5 (daily snapshot to cold tier per ADR 0006).
#
# Operator stages OpenBao snapshot token via:
#   bao policy write snapshot - <<EOF
#     path "sys/storage/raft/snapshot" { capabilities = ["read"] }
#   EOF
#   bao token create -policy=snapshot -ttl=8760h -orphan
# and stores at kv/prod/openbao/snapshot-token (loaded via
# external-secrets into a Secret openbao-snapshot-token).
#
# Hetzner Storage Box credentials staged the same way at
# kv/prod/backup/hetzner-storage-box → Secret hetzner-sb-creds.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openbao-snapshot-token
  namespace: openbao
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: openbao-snapshot-token
  data:
    - secretKey: token
      remoteRef:
        key: prod/openbao/snapshot-token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hetzner-sb-creds
  namespace: openbao
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: hetzner-sb-creds
  data:
    - secretKey: host
      remoteRef:
        key: prod/backup/hetzner-storage-box
        property: host
    - secretKey: user
      remoteRef:
        key: prod/backup/hetzner-storage-box
        property: user
    - secretKey: ssh_key
      remoteRef:
        key: prod/backup/hetzner-storage-box
        property: ssh_key
    - secretKey: ssh_known_host
      remoteRef:
        key: prod/backup/hetzner-storage-box
        property: ssh_known_host
        # Optional. If set, snapshot CronJob skips ssh-keyscan
        # and pins the expected host fingerprint (TOFU → pinned).
        # Captured + written via:
        #   bao kv put kv/prod/backup/hetzner-storage-box \
        #     ssh_known_host="<known_hosts line>"
        # Same path as backup-cronjobs's ssh_known_host —
        # both cronjobs read from the same OpenBao path.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-raft-snapshot
  namespace: openbao
spec:
  schedule: "5 3 * * *"  # 03:05 daily (offset within the hour per
  # 2026-06-09 OOM-cascade RCA §"Recommended fixes" #3 / commit 1b405df).
  # Original `0 3 * * *` collided with every other on-the-hour cronjob.
  # Hardening per 2026-06-08 + 2026-06-09 OpenBao incidents (see sibling
  # raft-snapshot-hourly.yaml): same wedged-Longhorn-VA failure mode
  # applies here, so the same activeDeadlineSeconds / ttl /
  # startingDeadlineSeconds bounds are applied. concurrencyPolicy is
  # `Forbid` (not Replace) per RCA §3: under a cascade Replace would
  # kill the previous pod mid-snapshot-save, leaving a half-flushed file
  # and re-triggering the same VA churn that started the cascade.
  # Forbid skips overlapping runs instead.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 300
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: openbao
          containers:
            - name: snapshot
              image: quay.io/openbao/openbao:2.5.4  # OPERATOR PINS via Renovate. Match the
              # server image (platform/openbao statefulset); docker.io/openbao/openbao:0.10.0
              # doesn't exist → ImagePullBackOff. Fixed 2026-05-29.
              env:
                - name: BAO_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: openbao-snapshot-token
                      key: token
                - name: BAO_ADDR
                  value: https://openbao.openbao.svc:8200
                - name: BAO_CACERT
                  value: /vault/userconfig/openbao-tls/ca.crt
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  bao operator raft snapshot save /tmp/snapshot-${TS}.snap
                  # Upload to Hetzner Storage Box via SFTP
                  mkdir -p ~/.ssh
                  echo "$SSH_KEY" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  # Host-key trust path: pin if SSH_KNOWN_HOST
                  # is set (post-TOFU), else ssh-keyscan
                  # (first-install). Per ntfy/rotation.md +
                  # 99-journal/2026-04-29-restic-tier-3-cronjob.md
                  # D5.
                  if [ -n "${SSH_KNOWN_HOST:-}" ]; then
                    echo "$SSH_KNOWN_HOST" > ~/.ssh/known_hosts
                  else
                    ssh-keyscan -H ${HSB_HOST} > ~/.ssh/known_hosts 2>/dev/null
                  fi
                  chmod 600 ~/.ssh/known_hosts
                  scp -i ~/.ssh/id_ed25519 \
                    /tmp/snapshot-${TS}.snap \
                    ${HSB_USER}@${HSB_HOST}:/openbao-snapshots/
                  rm -f /tmp/snapshot-${TS}.snap
              envFrom:
                - secretRef:
                    name: hetzner-sb-creds
              # Per 2026-06-09 OOM-cascade RCA §"Recommended fixes" #4
              # (commit 1b405df): every cronjob pod whose container
              # execs `bao` / `kubectl` against the cluster gets a
              # 64Mi/128Mi floor+cap so it cannot anonymously pad up
              # a tight worker's memory profile and trigger the
              # Talos OOM-controller. 128Mi is enough for raft
              # snapshot save + scp upload (steady ~25MB RSS).
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: tls
                  mountPath: /vault/userconfig/openbao-tls
                  readOnly: true
          volumes:
            - name: tls
              secret:
                secretName: openbao-tls
