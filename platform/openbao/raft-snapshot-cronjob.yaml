# Daily Raft snapshot to the off-site Hetzner Storage Box tier. An init
# container obtains the short-lived OpenBao workload token and writes a verified
# snapshot; the uploader never receives that token or the projected JWT.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hetzner-sb-creds
  namespace: openbao
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: hetzner-sb-creds
  data:
    - secretKey: SSH_KEY
      remoteRef: { key: prod/backup/hetzner-storage-box, property: ssh_key }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-raft-snapshot
  namespace: openbao
spec:
  # Hourly, at :40 — and hourly is NOT "24 uploads a day". The uploader is a
  # convergence script (ADR 0018 D6, revised 2026-09-06): it asks whether the
  # Storage Box already holds a snapshot younger than 23 h and does nothing else
  # in the ~23 runs a day when it does. Steady state stays at ~1 upload/day of
  # ~211 KiB; what hourly buys is that a transient remote fault costs one hour
  # instead of a whole day. On 2026-09-06 a ~25 min Storage Box outage at 03:05
  # cost this lane 37 h, because a once-daily job that fails has no next attempt
  # until tomorrow. The sibling restic lane hit the same outage and survived only
  # because its retry happened to land 20 min later.
  #
  # Consequence of hourly, accepted deliberately: the lane now overlaps
  # `restic-minio-to-hetzner` (02:15-~04:10) for two or three runs a day, which
  # the 2026-09-06 fix had just moved away from. That is fine *because* the lane
  # converges — those overlapping runs are freshness checks of ~24 KB over two
  # short sequential sessions, not uploads, and a check lost to contention is
  # retried an hour later. Hetzner allows 10 simultaneous connections per
  # account; both restic lanes pin `sftp.connections=1`, so peak concurrency
  # across every lane stays at 3-4.
  #
  # :40 keeps the OpenBao leader to itself: the *local* hourly snapshot runs at
  # :05 and the Longhorn snapshot jobs at :25/:35. Uploads self-stabilise rather
  # than wander — with a 23 h threshold and hourly checks the publishing hour
  # walks ~1 h earlier per day.
  schedule: "40 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # backoffLimit is left at 2 deliberately. It is the wrong instrument for
      # network transients — on 2026-09-06 its three pod attempts were spent
      # inside 4m09s, entirely within a ~25 min Storage Box outage. The upload
      # script now retries internally across ~20 min (see snapshot-upload.sh),
      # so these pod-level retries cover only pod-level faults: a failed image
      # pull, an evicted node, a killed container.
      backoffLimit: 2
      # 1800s, was 600s: the in-script retry budget is ~21 min worst case
      # (~17 min of backoff plus six 30s bounded connect attempts). 600s would
      # have SIGKILLed the pod mid-retry and defeated the whole mechanism.
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-raft-snapshot
            app.kubernetes.io/component: daily-offsite
            app.kubernetes.io/part-of: openbao
        spec:
          restartPolicy: Never
          serviceAccountName: openbao-raft-snapshot
          automountServiceAccountToken: false
          # The restic uploader uses musl's resolver. With Kubernetes' default
          # ndots:5 it walks cluster search suffixes before this external name;
          # the observed uploader failed while the trailing-dot form resolved.
          # Resolve names containing a dot as absolute first. This pod-only
          # override leaves cluster DNS policy and the hourly workload intact.
          dnsConfig:
            options:
              - { name: ndots, value: "1" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            # Deliberately not named `snapshot`: the previous manifest used
            # that name for the main container. A distinct name keeps the
            # SSA migration valid even while another field manager still
            # observes the old list entry during a dry-run.
            - name: create-snapshot
              image: quay.io/openbao/openbao:2.5.5@sha256:6150c4a6b62067db6141c8da7a6a6b5763f4f47c315343d0c848b40fecdfd452
              imagePullPolicy: IfNotPresent
              env:
                - name: BAO_ADDR
                  value: https://openbao.openbao.svc:8200
                - name: BAO_CACERT
                  value: /vault/userconfig/openbao-tls/ca.crt
                # UID 100 produces the verified files; UID 1000 uploads them.
                # Both containers use group/fsGroup 1000, while token scratch
                # stays in the init-only /tmp at mode 0600.
                - name: SNAPSHOT_PUBLISH_MODE
                  value: "0640"
              command:
                - /bin/sh
                - -c
                - |
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  SNAPSHOT_OUTPUT="/work/bao-${ts}.snap" /app/snapshot-auth.sh
              securityContext:
                runAsUser: 100
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
              resources:
                requests: { cpu: 10m, memory: 64Mi }
                limits: { cpu: 100m, memory: 128Mi }
              volumeMounts:
                - { name: tls, mountPath: /vault/userconfig/openbao-tls, readOnly: true }
                - { name: work, mountPath: /work }
                - { name: workload-jwt, mountPath: /var/run/secrets/openbao-auth, readOnly: true }
                - { name: snapshot-scripts, mountPath: /app, readOnly: true }
                # Do not share scratch space with the uploader: a SIGKILL
                # could otherwise leave the short-lived Bao token readable by
                # the following container before the EXIT trap removes it.
                - { name: snapshot-tmp, mountPath: /tmp }
          containers:
            - name: upload
              # This digest-pinned image is already used by backup-cronjobs. A
              # disposable image probe on 2026-07-21 verified ssh/scp/sftp.
              image: restic/restic:0.17.3@sha256:8f5a62b422a2cb1277ea0dd6e826fe1acf649e5b9f02d60e5268d5fd1976255a
              imagePullPolicy: IfNotPresent
              command: [/bin/sh, -c, /app/snapshot-upload.sh]
              env:
                - { name: HOME, value: /tmp }
                # Routing identity is public configuration, not a credential.
                # Keep it in Git and byte-couple it to the CNP/known_hosts gate;
                # only the private SSH key comes from OpenBao.
                - { name: HSB_HOST, value: u609156.your-storagebox.de }
                - { name: HSB_USER, value: u609156 }
                - { name: HSB_PORT, value: "23" }
                # The convergence threshold, stated here rather than left to the
                # script's default so it is reviewable beside the alert that
                # depends on it. 23 h (not 24 h) so the "off-site copy no older
                # than a day" objective keeps an hour of margin. This value and
                # OpenBaoDailyRaftSnapshotStale in snapshot-prometheusrule.yaml
                # are a pair: the alert is only meaningful because a run that
                # cannot establish this invariant exits non-zero.
                - { name: SNAPSHOT_MAX_REMOTE_AGE_SECONDS, value: "82800" }
              envFrom:
                - secretRef: { name: hetzner-sb-creds }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
              resources:
                requests: { cpu: 10m, memory: 64Mi }
                limits: { cpu: 100m, memory: 128Mi }
              volumeMounts:
                - { name: work, mountPath: /work, readOnly: true }
                - { name: snapshot-scripts, mountPath: /app, readOnly: true }
                - { name: uploader-config, mountPath: /etc/openbao-snapshot-ssh, readOnly: true }
                - { name: uploader-config, mountPath: /etc/passwd, subPath: passwd, readOnly: true }
                - { name: uploader-config, mountPath: /etc/group, subPath: group, readOnly: true }
                - { name: upload-tmp, mountPath: /tmp }
          volumes:
            - name: tls
              secret: { secretName: openbao-tls }
            - name: work
              emptyDir: { sizeLimit: 256Mi }
            - name: workload-jwt
              projected:
                defaultMode: 0400
                sources:
                  - serviceAccountToken:
                      audience: openbao
                      expirationSeconds: 900
                      path: token
            - name: snapshot-scripts
              configMap:
                name: openbao-snapshot-scripts
                defaultMode: 0555
            - name: uploader-config
              configMap: { name: openbao-snapshot-uploader-config }
            - name: snapshot-tmp
              emptyDir: { medium: Memory, sizeLimit: 4Mi }
            - name: upload-tmp
              emptyDir: { medium: Memory, sizeLimit: 16Mi }
