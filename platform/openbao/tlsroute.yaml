# OpenBao UI/API via Gateway TLS PASSTHROUGH (2026-08-16).
#
# Replaces httproute.yaml, which could not work. That route attached to an
# HTTPS listener, and an HTTPS listener TERMINATES TLS and forwards plain HTTP
# — but OpenBao's listener sets tls_disable = 0 and requires TLS. The result
# was a hard 400 with the body "Client sent an HTTP request to an HTTPS
# server", served by envoy in ~30ms. It had been that way since the route was
# written; operators reached OpenBao by `kubectl port-forward` instead and the
# manifest kept advertising a hostname that answered an error.
#
# Gateway API's mechanism for re-encrypting to an HTTPS backend is
# BackendTLSPolicy, which Cilium 1.19 does not implement. So the traffic is not
# terminated at all: the Gateway forwards the raw TLS stream and OpenBao
# presents its own certificate. For a secret store that is the better posture
# anyway — the gateway never holds plaintext vault traffic, and there is no
# second key to manage at the edge.
#
# Consequences worth knowing:
#
#   * The client validates OPENBAO's certificate, not the wildcard. That is why
#     openbao.<fqdn> is a SAN on platform/openbao/certificate.yaml, and why the
#     internal CA must be trusted by whoever connects (trust-manager
#     distributes it; on a laptop, --cacert or the system store).
#   * Port 8200, not 443 — see the listener comment in
#     infrastructure/ingress/gateway.yaml. A passthrough listener on 443 would
#     sit next to a Terminate listener carrying 19 attached routes, and no
#     dry-run can tell you whether the implementation accepts that pairing.
#   * TLSRoute matches on SNI only. There is no path routing, so the whole
#     host goes to OpenBao — correct here, since the backend is one service.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: openbao-ui
  namespace: openbao
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: ingress
      sectionName: tls-openbao
  hostnames:
    - "openbao.FQDN_SUFFIX"
  rules:
    - backendRefs:
        - name: openbao
          port: 8200
