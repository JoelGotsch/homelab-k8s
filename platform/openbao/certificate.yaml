# OpenBao server TLS, issued by cert-manager (2026-08-16).
#
# Replaces the hand-generated bootstrap cert from
# homelab-infra/scripts/generate-openbao-bootstrap-tls.sh, which was created
# 2026-05-23 with 90-day validity and was 5 days from expiry when this landed.
# Nothing was watching it — it was not a cert-manager Certificate, so no
# certificate-expiry alerting could see it, and its lapse would have taken out
# ESO, the cert-manager Vault issuer and signal-bridge simultaneously.
#
# Issued by openbao-tls-issuer (a local CA issuer), NOT by
# homelab-internal-issuer. The latter signs through OpenBao itself, which would
# make renewing this cert depend on this cert. See
# infrastructure/cert-manager/openbao-tls-issuer.yaml.
#
# SANs reproduce every name the bootstrap cert carried — verified against the
# live cert, not copied from the script — plus one addition:
#
#   openbao.lab.vyramo.com   the public hostname. httproute.yaml has published
#                            it since it was written, but the Gateway
#                            terminates TLS and forwards plain HTTP while this
#                            listener requires TLS, so the route answered
#                            "Client sent an HTTP request to an HTTPS server".
#                            Cilium 1.19 has no BackendTLSPolicy, so the fix is
#                            TLS passthrough — and passthrough means the client
#                            validates THIS cert directly, so the public name
#                            has to be on it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-tls
  namespace: openbao
spec:
  # PHASE 3 (2026-08-16): cert-manager now owns the live Secret name.
  #
  # Phase 1 issued into `openbao-tls-cm` so the cert could be inspected without
  # touching the running vault; that cert verified correct (22 SANs, chain to
  # openbao-tls-ca), and phase 2 taught every client to trust the new CA. This
  # takes over `openbao-tls` itself.
  #
  # Taking over the existing NAME rather than repointing the Helm values is
  # deliberate. The listener paths (/openbao/userconfig/openbao-tls/...) are
  # identical in the Argo-managed values and the Ansible bootstrap values, and
  # check-values-drift.sh requires them to match. Repointing only the runtime
  # copy would drift the pair; repointing both would make the BOOTSTRAP config
  # reference a Secret that cannot exist before cert-manager does, breaking
  # cold start. Owning the name keeps one path that works in both worlds — and
  # it is exactly the handoff generate-openbao-bootstrap-tls.sh described:
  # "replace the openbao-tls Secret, roll OpenBao pods".
  secretName: openbao-tls
  duration: 2160h     # 90d, matching the bootstrap cert's lifetime
  renewBefore: 720h   # 30d — renews with a third of the life left
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - client auth
  dnsNames:
    # Public hostname FIRST so the site-config replacement below has a stable
    # index. Written as the FQDN_SUFFIX placeholder, not a literal: ADR 0045
    # forbids the domain in a value the cluster consumes, and
    # check-no-bare-domain caught the literal when this was first written.
    - "openbao.FQDN_SUFFIX"
    # Service names
    - openbao
    - openbao.openbao
    - openbao.openbao.svc
    - openbao.openbao.svc.cluster.local
    - openbao-internal
    - openbao-internal.openbao
    - openbao-internal.openbao.svc
    - openbao-internal.openbao.svc.cluster.local
    # Per-pod names (headless service, raft peers)
    - openbao-0
    - openbao-0.openbao-internal
    - openbao-0.openbao-internal.openbao
    - openbao-0.openbao-internal.openbao.svc.cluster.local
    - openbao-1
    - openbao-1.openbao-internal
    - openbao-1.openbao-internal.openbao
    - openbao-1.openbao-internal.openbao.svc.cluster.local
    - openbao-2
    - openbao-2.openbao-internal
    - openbao-2.openbao-internal.openbao
    - openbao-2.openbao-internal.openbao.svc.cluster.local
    # Loopback — `bao status` inside the pod uses BAO_ADDR=https://127.0.0.1:8200
    - localhost
  ipAddresses:
    - 127.0.0.1
    - ::1
  issuerRef:
    name: openbao-tls-issuer
    kind: ClusterIssuer
    group: cert-manager.io
