# Requires the operator-owned Google client and its ExternalSecret environment.
version: 1
metadata:
  name: tridata-google
  labels:
    blueprints.goauthentik.io/instantiate: 'true'
entries:
- model: authentik_blueprints.metaapplyblueprint
  attrs:
    identifiers:
      name: tridata-public
    required: true
- model: authentik_flows.flow
  id: tridata-public-google-enrollment
  identifiers:
    slug: tridata-public-google-enrollment
  attrs:
    name: tridata-public-google-enrollment
    title: "Tridata \u2014 Enrollment"
    designation: enrollment
    authentication: require_unauthenticated
- model: authentik_flows.flow
  id: tridata-public-google-authentication
  identifiers:
    slug: tridata-public-google-authentication
  attrs:
    name: tridata-public-google-authentication
    title: "Tridata \u2014 Authentication"
    designation: authentication
    authentication: none
- model: authentik_policies_expression.expressionpolicy
  id: tridata-public-google-verified
  identifiers:
    name: tridata-public-google-verified
  attrs:
    expression: |-
      from authentik.core.models import User
      from uuid import uuid4
      data = request.context.get("prompt_data", {})
      adult_attested = data.get("attributes_tridata_adult_attested")
      if adult_attested is not True:
          ak_message("You must confirm that you are at least 18 years old to register.")
          return False
      info = request.context.get("oauth_userinfo", {})
      email = info.get("email", "").strip().lower()
      if not email or info.get("email_verified", info.get("verified_email")) is not True:
          return False
      if User.objects.filter(email__iexact=email).exists():
          ak_message("This email already has an account. Sign in with its existing method.")
          return False
      # Stage reevaluation shallow-copies plan.context. Mutate the shared data
      # dictionary so User Write receives the trusted identity and attestation.
      data.clear()
      data.update({"email": email, "name": info.get("name", email),
                   "username": "tridata-" + uuid4().hex,
                   "attributes_tridata_adult_attested": adult_attested})
      return True
- model: authentik_stages_prompt.promptstage
  id: tridata-public-google-legal
  identifiers:
    name: tridata-public-google-legal
  attrs:
    fields:
    - !Find [authentik_stages_prompt.prompt, [name, tridata-public-legal-links]]
    - !Find [authentik_stages_prompt.prompt, [name, tridata-public-adult-attestation]]
    validation_policies:
    - !Find [authentik_policies_expression.expressionpolicy, [name, tridata-public-adult-policy]]
- model: authentik_flows.flowstagebinding
  id: tridata-public-google-enrollment-5
  identifiers:
    target: !KeyOf 'tridata-public-google-enrollment'
    stage: !KeyOf 'tridata-public-google-legal'
    order: 5
  attrs:
    evaluate_on_plan: false
    re_evaluate_policies: true
- model: authentik_stages_user_write.userwritestage
  id: tridata-public-google-create
  identifiers:
    name: tridata-public-google-create
  attrs:
    user_creation_mode: always_create
    create_users_as_inactive: false
    create_users_group: !Find [authentik_core.group, [name, tridata-public-users]]
    user_type: external
    user_path_template: users/tridata-public
- model: authentik_flows.flowstagebinding
  id: tridata-public-google-enrollment-10
  identifiers:
    target: !KeyOf 'tridata-public-google-enrollment'
    stage: !KeyOf 'tridata-public-google-create'
    order: 10
  attrs:
    evaluate_on_plan: false
    re_evaluate_policies: true
- model: authentik_policies.policybinding
  id: tridata-public-google-enrollment-10-policy
  identifiers:
    target: !KeyOf 'tridata-public-google-enrollment-10'
    policy: !KeyOf 'tridata-public-google-verified'
    order: 0
  attrs:
    enabled: true
- model: authentik_flows.flowstagebinding
  id: tridata-public-google-enrollment-100
  identifiers:
    target: !KeyOf 'tridata-public-google-enrollment'
    stage: !Find [authentik_stages_user_login.userloginstage, [name, tridata-public-login]]
    order: 100
  attrs:
    evaluate_on_plan: false
    re_evaluate_policies: true
- model: authentik_flows.flowstagebinding
  id: tridata-public-google-authentication-10
  identifiers:
    target: !KeyOf 'tridata-public-google-authentication'
    stage: !Find [authentik_stages_deny.denystage, [name, tridata-public-deny]]
    order: 10
  attrs:
    evaluate_on_plan: false
    re_evaluate_policies: true
- model: authentik_policies.policybinding
  id: tridata-public-google-authentication-10-policy
  identifiers:
    target: !KeyOf 'tridata-public-google-authentication-10'
    policy: !Find [authentik_policies_expression.expressionpolicy, [name, tridata-public-deny-private-user]]
    order: 0
  attrs:
    enabled: true
- model: authentik_flows.flowstagebinding
  id: tridata-public-google-authentication-100
  identifiers:
    target: !KeyOf 'tridata-public-google-authentication'
    stage: !Find [authentik_stages_user_login.userloginstage, [name, tridata-public-login]]
    order: 100
  attrs:
    evaluate_on_plan: false
    re_evaluate_policies: true
- model: authentik_sources_oauth.oauthsource
  id: tridata-google
  identifiers:
    slug: tridata-google
  attrs:
    name: Google
    enabled: true
    promoted: true
    icon: !Format ["%s/brand/google-g.png", !Env AUTHENTIK_TRIDATA_PUBLIC_APP_URL]
    # The generic OIDC adapter honors source PKCE; the built-in Google adapter
    # in Authentik 2026.8 ignores the source's pkce field.
    provider_type: openidconnect
    oidc_well_known_url: https://accounts.google.com/.well-known/openid-configuration
    authorization_code_auth_method: post_body
    consumer_key: !Env 'AUTHENTIK_TRIDATA_GOOGLE_CLIENT_ID'
    consumer_secret: !Env 'AUTHENTIK_TRIDATA_GOOGLE_CLIENT_SECRET'
    authentication_flow: !KeyOf 'tridata-public-google-authentication'
    enrollment_flow: !KeyOf 'tridata-public-google-enrollment'
    user_matching_mode: email_deny
    group_matching_mode: identifier
    user_path_template: users/tridata-public
    additional_scopes: ''
    pkce: S256
- model: authentik_stages_identification.identificationstage
  id: tridata-public-identify-google
  identifiers:
    name: tridata-public-identify
  attrs:
    sources:
    - !KeyOf 'tridata-google'
- model: authentik_policies_expression.expressionpolicy
  id: tridata-public-google-entry
  identifiers:
    name: tridata-public-google-entry
  attrs:
    expression: |-
      # Route only Tridata's fixed Google entry hint; preserve the original OIDC
      # authorize URL in SESSION_KEY_GET for SourceFlowManager's final redirect.
      import os
      from urllib.parse import parse_qs, urlsplit
      from authentik.flows.views.executor import SESSION_KEY_GET
      http = request.http_request
      plan = request.context.get("flow_plan")
      if not http or not plan or http.get_host() != os.environ.get("AUTHENTIK_TRIDATA_PUBLIC_AUTH_HOST") :
          return True
      destination = http.session.get(SESSION_KEY_GET, {}).get("next", "")
      if not isinstance(destination, str):
          return True
      try:
          parsed = urlsplit(destination)
      except ValueError:
          return True
      if parsed.scheme or parsed.netloc or parsed.fragment or parsed.path != "/application/o/authorize/":
          return True
      params = parse_qs(parsed.query, keep_blank_values=True)
      expected = {
          "tridata_source": ["google"],
          "client_id": ["tridata-public"],
          "redirect_uri": [os.environ.get("AUTHENTIK_TRIDATA_PUBLIC_APP_URL", "") + "/api/v1/auth/callback"],
          "response_type": ["code"],
          "code_challenge_method": ["S256"],
      }
      if any(params.get(key) != value for key, value in expected.items()):
          return True
      if len(params.get("state", [])) != 1 or not params["state"][0]:
          return True
      if len(params.get("code_challenge", [])) != 1 or not params["code_challenge"][0]:
          return True
      plan.redirect("/source/oauth/login/tridata-google/")
      return False
- model: authentik_policies.policybinding
  id: tridata-public-google-entry-binding
  # Target uses a subclass PK which the serializer translates to its inherited
  # PolicyBindingModel PK. Keep it out of ORM identifiers so repeat imports find
  # the existing binding rather than failing its uniqueness validator.
  identifiers:
    policy: !KeyOf 'tridata-public-google-entry'
    order: 0
  attrs:
    target: !Find [authentik_flows.flowstagebinding, [target, !Find [authentik_flows.flow, [slug, tridata-public-authentication]]], [order, 10]]
    enabled: true

# Brand CSS is adopted inside component shadow roots in Authentik 2026.8.
# Keep the native accessible source action; only its public Google artwork changes.
- model: authentik_brands.brand
  id: tridata-public-google-branding
  identifiers:
    domain: !Env AUTHENTIK_TRIDATA_PUBLIC_AUTH_HOST
  attrs:
    branding_custom_css: !Format
    - |
      :host(ak-stage-identification) fieldset[name="login-sources"] button[name="source-google"][part~="source-item-promoted"],
      ak-stage-identification.style-scope fieldset[name="login-sources"] button[name="source-google"][part~="source-item-promoted"] {
        flex: 0 0 180px;
        width: 180px;
        height: 40px;
        min-height: 40px;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: transparent url("%s/brand/google-signin.png") center / 180px 40px no-repeat;
        box-shadow: none;
        font-size: 0;
        color: transparent;
      }
      :host(ak-stage-identification) fieldset[name="login-sources"] button[name="source-google"][part~="source-item-promoted"]::after,
      ak-stage-identification.style-scope fieldset[name="login-sources"] button[name="source-google"][part~="source-item-promoted"]::after {
        border: 0;
      }
      :host(ak-stage-identification) fieldset[name="login-sources"] button[name="source-google"][part~="source-item-promoted"]:focus-visible,
      ak-stage-identification.style-scope fieldset[name="login-sources"] button[name="source-google"][part~="source-item-promoted"]:focus-visible {
        outline: 3px solid #1a73e8;
        outline-offset: 3px;
      }
      @media (forced-colors: active) {
        :host(ak-stage-identification) fieldset[name="login-sources"] button[name="source-google"][part~="source-item-promoted"],
        ak-stage-identification.style-scope fieldset[name="login-sources"] button[name="source-google"][part~="source-item-promoted"] {
          background: ButtonFace;
          color: ButtonText;
          font-size: 14px;
          border: 1px solid ButtonText;
        }
      }
    - !Env AUTHENTIK_TRIDATA_PUBLIC_APP_URL
