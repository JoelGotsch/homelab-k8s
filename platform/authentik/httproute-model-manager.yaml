# models.<domain> → authentik-server: the Authentik EMBEDDED OUTPOST
# host-matches the proxy provider's external_host, enforces the
# operator login, and reverse-proxies to the model-manager Service.
# Lives in platform/authentik because it is authentik plumbing (the
# app itself never receives gateway traffic directly — its CNP only
# admits the authentik namespace).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-model-manager-proxy
  namespace: authentik
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: ingress
      sectionName: https
  hostnames:
    - "models.FQDN_SUFFIX"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-server
          port: 80
