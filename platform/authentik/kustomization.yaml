# Authentik IdP — operator-identity store + OIDC provider for
# all internal services per identity.md + ADR 0024 D3.
#
# Helm chart: goauthentik/authentik.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: authentik

helmCharts:
  - name: authentik
    repo: https://charts.goauthentik.io
    version: "2026.5.4"  # OPERATOR PINS via Renovate
    releaseName: authentik
    namespace: authentik
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - namespace.yaml
  - cnpg-cluster.yaml
  - scheduled-backup.yaml
  - externalsecret.yaml
  - httproute.yaml
  - httproute-model-manager.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml

# ADR 0036: cluster-wide resource-governance baseline.
components:
  - ../../components/first-party-namespace
  - ../../components/site-config   # build-only ConfigMap for the replacement below

# Resolve the HTTPRoute hostname from the single site-config (no hardcoded
# domain): `auth.FQDN_SUFFIX` -> `auth.<fqdn_suffix>`. Provenance: this rule
# -> ConfigMap/site-config.data.fqdn_suffix -> components/site-config/site-config.env.
replacements:
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.fqdn_suffix }
    targets:
      - select: { kind: HTTPRoute, name: authentik }
        fieldPaths: [spec.hostnames.0]
        options: { delimiter: '.', index: 1 }
      - select: { kind: HTTPRoute, name: authentik-model-manager-proxy }
        fieldPaths: [spec.hostnames.0]
        options: { delimiter: '.', index: 1 }

# Custom blueprints — one YAML per app, materialised as a
# ConfigMap that the chart mounts at /blueprints/. Worker
# auto-discovers `*.yaml` keys and applies them on reconcile.
# Idempotent via blueprint `identifiers`; rotating an OIDC
# secret only requires updating OpenBao (env-injected via
# !Env tags in the blueprints).
configMapGenerator:
  - name: authentik-blueprints
    namespace: authentik
    files:
      - blueprints/grafana.yaml
      - blueprints/forgejo.yaml
      - blueprints/langfuse.yaml
      - blueprints/nextcloud.yaml
      - blueprints/jellyfin.yaml
      - blueprints/immich.yaml
      - blueprints/paperless.yaml
      - blueprints/argocd.yaml
      # STATIC (not rendered from _blueprint.yaml.j2) — access binding +
      # email scope mapping; vaultwarden's provider/app are UI-managed
      # (see the file's header).
      - blueprints/vaultwarden.yaml
      # STATIC — full provider/app for the new LibreChat app (2026-07-30);
      # goes into the j2 loop when the render-template reconcile lands.
      - blueprints/librechat.yaml
      # STATIC — model-manager PROXY provider + embedded-outpost
      # assignment (first proxy-outpost app, 2026-08-05).
      - blueprints/model-manager.yaml
    options:
      # Kustomize hash suffix would force ConfigMap rename on
      # every blueprint edit + force chart re-render. Disable
      # so values.yaml's static `blueprints.configMaps:`
      # reference stays valid across edits.
      disableNameSuffixHash: true
