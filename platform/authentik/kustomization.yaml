# Authentik IdP — operator-identity store + OIDC provider for
# all internal services per identity.md + ADR 0024 D3.
#
# Helm chart: goauthentik/authentik.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: authentik

helmCharts:
  - name: authentik
    # ADR 0052 D3: chart from the Forgejo Packages mirror (was https://charts.goauthentik.io).
    repo: oci://registry.homelab.internal/homelab
    version: "2026.5.4"  # OPERATOR PINS via Renovate
    releaseName: authentik
    namespace: authentik
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - namespace.yaml
  - cnpg-cluster.yaml
  - objectstore.yaml
  - scheduled-backup.yaml
  - externalsecret.yaml
  - httproute.yaml
  - httproute-model-manager.yaml
  - httproute-chat-history.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml

# ADR 0036: cluster-wide resource-governance baseline.
components:
  - ../../components/first-party-namespace
  - ../../components/site-config   # build-only ConfigMap for the replacement below

# Resolve the HTTPRoute hostname from the single site-config (no hardcoded
# domain): `auth.FQDN_SUFFIX` -> `auth.<fqdn_suffix>`. Provenance: this rule
# -> ConfigMap/site-config.data.fqdn_suffix -> components/site-config/site-config.env.
replacements:
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.fqdn_suffix }
    targets:
      - select: { kind: HTTPRoute, name: authentik }
        fieldPaths: [spec.hostnames.0]
        options: { delimiter: '.', index: 1 }
      - select: { kind: HTTPRoute, name: authentik-model-manager-proxy }
        fieldPaths: [spec.hostnames.0]
        options: { delimiter: '.', index: 1 }
      - select: { kind: HTTPRoute, name: authentik-chat-history-proxy }
        fieldPaths: [spec.hostnames.0]
        options: { delimiter: '.', index: 1 }
  # AUTHENTIK_HOST — values.yaml carries `https://AUTH_FQDN` and this rewrites
  # it in the RENDERED container env. A replacement cannot reach inside a
  # helmCharts valuesFile, so the placeholder must survive inflation and be
  # fixed on the far side; both Deployments get it because global.env applies
  # to server and worker, and the worker is what renders recovery emails.
  # Container and env are selected by name, never by index — the chart
  # reorders neither today, but a chart bump is exactly what would.
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.auth_fqdn }
    targets:
      - select: { kind: Deployment, name: authentik-server }
        fieldPaths:
          - spec.template.spec.containers.[name=server].env.[name=AUTHENTIK_HOST].value
        options: { delimiter: '/', index: 2 }
      - select: { kind: Deployment, name: authentik-worker }
        fieldPaths:
          - spec.template.spec.containers.[name=worker].env.[name=AUTHENTIK_HOST].value
        options: { delimiter: '/', index: 2 }

# Custom blueprints — one YAML per app, materialised as a
# ConfigMap that the chart mounts at /blueprints/. Worker
# auto-discovers `*.yaml` keys and applies them on reconcile.
# Idempotent via blueprint `identifiers`; rotating an OIDC
# secret only requires updating OpenBao (env-injected via
# !Env tags in the blueprints).
configMapGenerator:
  - name: authentik-blueprints
    namespace: authentik
    files:
      - blueprints/grafana.yaml
      - blueprints/forgejo.yaml
      - blueprints/langfuse.yaml
      - blueprints/nextcloud.yaml
      - blueprints/jellyfin.yaml
      - blueprints/immich.yaml
      - blueprints/paperless.yaml
      - blueprints/argocd.yaml
      - blueprints/windmill.yaml
      - blueprints/todo.yaml
      # STATIC (not rendered from _blueprint.yaml.j2) — access binding +
      # email scope mapping; vaultwarden's provider/app are UI-managed
      # (see the file's header).
      - blueprints/vaultwarden.yaml
      # STATIC — full provider/app for the new LibreChat app (2026-07-30);
      # goes into the j2 loop when the render-template reconcile lands.
      - blueprints/librechat.yaml
      # STATIC — model-manager PROXY provider + embedded-outpost
      # assignment (first proxy-outpost app, 2026-08-05).
      - blueprints/model-manager.yaml
      # STATIC — chat-history PROXY provider (conversation-history's
      # `chist serve`, 2026-08-21). Carries the embedded outpost's FULL
      # providers list, model-manager included — see the file's header.
      - blueprints/chat-history.yaml
      # Recovery / set-password flow (email link) — hand-written, instantiates
      # authentik's bundled recovery example + points the brand's flow_recovery
      # at it. Enables invite-onboarding + self-service password reset (2026-08-06).
      - blueprints/homelab-recovery-flow.yaml
    options:
      # Kustomize hash suffix would force ConfigMap rename on
      # every blueprint edit + force chart re-render. Disable
      # so values.yaml's static `blueprints.configMaps:`
      # reference stays valid across edits.
      disableNameSuffixHash: true

  # Custom email templates, mounted at /templates on BOTH server and worker
  # via global.volumes in values.yaml. Authentik's Django TEMPLATES DIRS is
  # ['/templates'] (confirmed against the running 2026.5.4 instance), so a
  # file here is selectable on an Email stage by bare filename — see
  # blueprints/homelab-recovery-flow.yaml, which points
  # default-recovery-email at homelab_welcome.html instead of the bundled
  # email/password_reset.html.
  #
  # The worker needs this as much as the server: the recovery email is
  # rendered and sent from a worker task, so mounting it server-only would
  # fail at send time rather than at startup.
  - name: authentik-email-templates
    namespace: authentik
    files:
      - email-templates/homelab_welcome.html
    options:
      # Same reasoning as the blueprints ConfigMap above: a hash suffix would
      # rename the ConfigMap on every edit and break the static volume
      # reference in values.yaml.
      disableNameSuffixHash: true

# ---- Effective memory cap: 20Gi, not the component's 32Gi and not the 16Gi default ----
#
# ADR 0036's component ships 32Gi as a uniform runaway guard and documents this override
# route. A strategic merge on `spec.hard` replaces only the key named here; the `count/*`
# fields are the component's real teeth and are deliberately untouched.
#
# This layer references the component by relative path rather than vendoring a copy, so
# the file is shared with forgejo, woodpecker and every other platform/ app. Editing it
# would move all of them at once — hence a per-app patch even though the file is local.
#
# **Why 20Gi and not the 16Gi every other first-party namespace is getting.** Steady
# state is 9Gi, measured from `.status.used` and never added up by hand:
#
#   authentik-pg-1   3Gi    2Gi postgres + a 1Gi always-on barman sidecar
#   authentik-pg-2   3Gi    same
#   authentik-server 2Gi
#   authentik-worker 1Gi
#                    ---
#                    9Gi
#
# A ResourceQuota is checked at ADMISSION, so what has to fit is the peak during a
# rollout, not the steady state. Both Deployments are `RollingUpdate` with
# `maxSurge: 25%` on `replicas: 1`, and maxSurge rounds UP — so each rolls by admitting a
# second pod before terminating the first. Server and worker rolling together is +3Gi;
# a CNPG instance being replaced (a switchover, a minor-version bump, a node drain) is
# another +3Gi. That is a 15Gi worst case.
#
# Against a 16Gi cap that leaves 1Gi, and the failure mode is not a clean error — it is
# a pod that is never admitted while the Deployment reports itself as progressing. This
# cluster has already paid for that once: `enrich-video` in conversation-history sat
# `active` with no pod until `activeDeadlineSeconds` killed it, reporting
# `DeadlineExceeded`, which reads as a slow lane and was a lane that never started.
# 20Gi leaves 5Gi over the worst realistic case.
patches:
  - patch: |-
      apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: homelab-namespace-quota
      spec:
        hard:
          limits.memory: 20Gi
