# Authentik public OIDC client for Kargo's browser authorization-code/PKCE flow.
# Only the operator group is admitted. Registration for the archive grants no
# access here. No client secret, default Kargo admin or CLI callback is enabled.
# Kargo maps the profile's groups claim to a read-only system role; project
# promotion permissions are managed separately in Git.

version: 1
metadata:
  name: kargo-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # OAuth2Provider — issues tokens, defines redirect URI +
  # signing key + scopes Kargo will request.
  - model: authentik_providers_oauth2.oauth2provider
    id: kargo-provider
    identifiers:
      name: kargo
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      client_id: "homelab-kargo"
      # Authentik 2026.5 defaults new providers to an empty grant allowlist.
      # Browser OIDC then fails with `Invalid grant_type for provider` even
      # though the provider, application, client ID, and redirect all exist.
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: "https://kargo.lab.vyramo.com/login"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  # Application — the user-facing tile in Authentik's launcher,
  # bound to the provider above.
  - model: authentik_core.application
    id: kargo-app
    identifiers:
      slug: kargo
    attrs:
      name: Kargo
      provider: !KeyOf kargo-provider
      meta_launch_url: "https://kargo.lab.vyramo.com/"
      meta_description: "Release verification and promotion"
      group: "Platform"
      policy_engine_mode: any

  # Access control — restrict this application to the listed group(s).
  # GitOps-tracks what was previously UI-only: without these, a blueprint
  # rebuild silently reopens every app to ANY authenticated user (incl.
  # family-members) — a regression that would pass unnoticed. Matches the live
  # bindings (2026-07-17): all apps operator-only. To grant family access to an
  # app, set `access_groups: [operator, family-members]` on its oidc-apps.yml
  # entry (defaults to [operator]). NB: akadmin (bootstrap superuser) is
  # intentionally NOT in `operator`, so it stays break-glass-only.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf kargo-app
      group: !Find [authentik_core.group, [name, operator]]
    attrs:
      order: 10
      enabled: true
      negate: false
