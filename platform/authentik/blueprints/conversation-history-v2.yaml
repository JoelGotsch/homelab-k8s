# Dedicated archive owner login. No operator or tester group admission.
version: 1
metadata:
  name: conversation-history-v2-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: conversation-history-v2-provider
    identifiers:
      name: conversation-history-v2
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env AUTHENTIK_CHIST_V2_CLIENT_ID
      client_secret: !Env AUTHENTIK_CHIST_V2_CLIENT_SECRET
      grant_types: [authorization_code]
      redirect_uris:
        - matching_mode: strict
          url: "https://conversation-history-v2.lab.vyramo.com/api/auth/oidc/callback"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - model: authentik_core.application
    id: conversation-history-v2-app
    identifiers:
      slug: conversation-history-v2
    attrs:
      name: Conversation archive v2
      provider: !KeyOf conversation-history-v2-provider
      meta_launch_url: "https://conversation-history-v2.lab.vyramo.com/"
      meta_description: "Private conversation archive"
      group: Personal
      policy_engine_mode: any

  # Only the explicitly selected existing archive owner is admitted.
  # This binds one identity; membership of the operator group conveys no access.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf conversation-history-v2-app
      user: !Find [authentik_core.user, [username, !Env AUTHENTIK_CHIST_V2_OWNER]]
    attrs:
      order: 20
      enabled: true
      negate: false
