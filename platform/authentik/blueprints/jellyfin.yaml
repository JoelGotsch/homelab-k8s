# Authentik blueprint — Jellyfin OIDC client.
#
# Provisions an OAuth2Provider + Application so Jellyfin can
# delegate authn to Authentik via the community SSO-Auth plugin
# (Jellyfin lacks native OIDC; operator installs the plugin
# post-bring-up + wires it to the Secret produced by the
# consumer-side ExternalSecret in apps/jellyfin/).
#
# client_id + client_secret come from OpenBao via the
# authentik-oidc-clients ExternalSecret (kv/jellyfin/oidc),
# projected into the worker pod as env vars by global.envFrom.
# Naming convention: AUTHENTIK_BOOTSTRAP_<APP>_CLIENT_{ID,SECRET}
# matches upstream blueprint examples + makes the env source
# unambiguous (these vars are read by !Env tags below, NOT by
# Authentik itself).
#
# Same client_id/client_secret pair is also read by Jellyfin in
# the jellyfin ns via a separate ExternalSecret pointing at the
# same OpenBao path. Both pull from the same source-of-truth
# so rotation only touches OpenBao.

version: 1
metadata:
  name: jellyfin-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # OAuth2Provider — issues tokens, defines redirect URI +
  # signing key + scopes Jellyfin will request.
  - model: authentik_providers_oauth2.oauth2provider
    id: jellyfin-provider
    identifiers:
      name: jellyfin
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env AUTHENTIK_BOOTSTRAP_JELLYFIN_CLIENT_ID
      client_secret: !Env AUTHENTIK_BOOTSTRAP_JELLYFIN_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: "https://jellyfin.lab.vyramo.com/sso/OID/redirect/authentik"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  # Application — the user-facing tile in Authentik's launcher,
  # bound to the provider above.
  - model: authentik_core.application
    id: jellyfin-app
    identifiers:
      slug: jellyfin
    attrs:
      name: Jellyfin
      provider: !KeyOf jellyfin-provider
      meta_launch_url: "https://jellyfin.lab.vyramo.com/"
      meta_description: "Family media library"
      group: "Media"
      policy_engine_mode: any

  # Access control — restrict this application to the listed group(s).
  # GitOps-tracks what was previously UI-only: without these, a blueprint
  # rebuild silently reopens every app to ANY authenticated user (incl.
  # family-members) — a regression that would pass unnoticed. Matches the live
  # bindings (2026-07-17): all apps operator-only. To grant family access to an
  # app, set `access_groups: [operator, family-members]` on its oidc-apps.yml
  # entry (defaults to [operator]). NB: akadmin (bootstrap superuser) is
  # intentionally NOT in `operator`, so it stays break-glass-only.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf jellyfin-app
      group: !Find [authentik_core.group, [name, operator]]
    attrs:
      order: 10
      enabled: true
      negate: false
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf jellyfin-app
      group: !Find [authentik_core.group, [name, family-members]]
    attrs:
      order: 20
      enabled: true
      negate: false
