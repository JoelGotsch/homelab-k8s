# Authentik blueprint — Windmill OIDC client.
#
# Provisions an OAuth2Provider + Application for the custom Windmill SSO
# client named `authentik`. The callback name must match that provider name:
# /user/login_callback/authentik.
#
# The public client_id is fixed in this inventory so Windmill's declarative
# operator and Authentik share an auditable value. client_secret comes from
# OpenBao via the authentik-oidc-clients ExternalSecret
# (kv/windmill/oidc). Windmill's operator reads the same secret through a
# namespace-local ExternalSecret; no OIDC secret is stored in git.

version: 1
metadata:
  name: windmill-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # OAuth2Provider — issues tokens, defines redirect URI +
  # signing key + scopes Windmill will request.
  - model: authentik_providers_oauth2.oauth2provider
    id: windmill-provider
    identifiers:
      name: windmill
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: "windmill-homelab"
      client_secret: !Env AUTHENTIK_BOOTSTRAP_WINDMILL_CLIENT_SECRET
      # Authentik 2026.5 defaults new providers to an empty grant allowlist.
      # Browser OIDC then fails with `Invalid grant_type for provider` even
      # though the provider, application, client ID, and redirect all exist.
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: "https://windmill.lab.vyramo.com/user/login_callback/authentik"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  # Application — the user-facing tile in Authentik's launcher,
  # bound to the provider above.
  - model: authentik_core.application
    id: windmill-app
    identifiers:
      slug: windmill
    attrs:
      name: Windmill
      provider: !KeyOf windmill-provider
      meta_launch_url: "https://windmill.lab.vyramo.com/"
      meta_description: "Workflow automation"
      group: "Platform"
      policy_engine_mode: any

  # Access control — restrict this application to the listed group(s).
  # GitOps-tracks what was previously UI-only: without these, a blueprint
  # rebuild silently reopens every app to ANY authenticated user (incl.
  # family-members) — a regression that would pass unnoticed. Matches the live
  # bindings (2026-07-17): all apps operator-only. To grant family access to an
  # app, set `access_groups: [operator, family-members]` on its oidc-apps.yml
  # entry (defaults to [operator]). NB: akadmin (bootstrap superuser) is
  # intentionally NOT in `operator`, so it stays break-glass-only.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf windmill-app
      group: !Find [authentik_core.group, [name, operator]]
    attrs:
      order: 10
      enabled: true
      negate: false
