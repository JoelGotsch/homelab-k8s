# Recovery / set-password flow (email link).
#
# Instantiates authentik's bundled example recovery flow
# (blueprints/example/flows-recovery-email-verification.yaml, which ships
# with instantiate:false) for THIS install, and points the default brand's
# flow_recovery at it. Copied VERBATIM from the 2026.5.4 bundled example
# except: instantiate=true, the display name, the email subject, and the
# appended brand binding — so upstream changes stay easy to diff.
#
# TWO uses, one flow:
#   1. Onboarding — provision-authentik-user.sh (homelab-infra/scripts)
#      creates a family user (no password) + calls the recovery_email API,
#      which emails a set-password link. The link restores the flow plan past
#      identification+email, so the user lands directly on the "set password"
#      prompt -> user_write -> login.
#   2. Self-service "forgot password" — the login page's recovery link enters
#      at identification -> email stage sends the link -> same tail.
#
# The email stage uses use_global_settings:true -> the central SMTP
# (kv/shared/smtp, Proton) wired 2026-08-05. Before this blueprint there was
# NO recovery flow and NO email stage in the install (nobody, operator
# included, could reset a password by email). Added 2026-08-06.
version: 1
metadata:
  labels:
    blueprints.goauthentik.io/instantiate: "true"
  name: homelab - Recovery flow (email set-password)
entries:
  - identifiers:
      slug: default-recovery-flow
    id: flow
    model: authentik_flows.flow
    attrs:
      name: Homelab account recovery
      title: Set your password
      designation: recovery
      authentication: require_unauthenticated
  - identifiers:
      name: default-recovery-field-password
    id: prompt-field-password
    model: authentik_stages_prompt.prompt
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      order: 0
      placeholder_expression: false
  - identifiers:
      name: default-recovery-field-password-repeat
    id: prompt-field-password-repeat
    model: authentik_stages_prompt.prompt
    attrs:
      field_key: password_repeat
      label: Password (repeat)
      type: password
      required: true
      placeholder: Password (repeat)
      order: 1
      placeholder_expression: false
  - identifiers:
      name: default-recovery-skip-if-restored
    id: default-recovery-skip-if-restored
    model: authentik_policies_expression.expressionpolicy
    attrs:
      expression: |
        return bool(request.context.get('is_restored', True))
  - identifiers:
      name: default-recovery-email
    id: default-recovery-email
    model: authentik_stages_email.emailstage
    attrs:
      use_global_settings: true
      host: localhost
      port: 25
      username: ""
      use_tls: false
      use_ssl: false
      timeout: 10
      from_address: system@authentik.local
      token_expiry: minutes=30
      subject: "Homelab — set or reset your password"
      # Custom template mounted at /templates from the authentik-email-templates
      # ConfigMap (kustomization.yaml), replacing the bundled
      # email/password_reset.html. Selected by BARE FILENAME because
      # /templates is itself a TEMPLATES DIR — not "email/homelab_welcome.html",
      # which is how the bundled ones are addressed inside their app packages.
      #
      # The bundled template says only "set your password" and nothing else.
      # That left a family member's first contact with the homelab with no
      # mention that the link only resolves on the tailnet, that one account
      # covers every shared app, or that the password manager is separate —
      # every one of which they needed on 2026-08-14.
      #
      # If this filename stops resolving, the stage falls back to rendering
      # nothing useful rather than erroring loudly, so verify after changing:
      #   kubectl exec -n authentik deploy/authentik-worker -- ls /templates
      template: homelab_welcome.html
      activate_user_on_success: true
      recovery_max_attempts: 5
      recovery_cache_timeout: minutes=5
  - identifiers:
      name: default-recovery-user-write
    id: default-recovery-user-write
    model: authentik_stages_user_write.userwritestage
    attrs:
      user_creation_mode: never_create
  - identifiers:
      name: default-recovery-identification
    id: default-recovery-identification
    model: authentik_stages_identification.identificationstage
    attrs:
      user_fields:
        - email
        - username
  - identifiers:
      name: default-recovery-user-login
    id: default-recovery-user-login
    model: authentik_stages_user_login.userloginstage
  - identifiers:
      name: Change your password
    id: stages-prompt-password
    model: authentik_stages_prompt.promptstage
    attrs:
      fields:
        - !KeyOf prompt-field-password
        - !KeyOf prompt-field-password-repeat
      validation_policies: []
  - identifiers:
      target: !KeyOf flow
      stage: !KeyOf default-recovery-identification
      order: 10
    model: authentik_flows.flowstagebinding
    id: flow-binding-identification
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
      policy_engine_mode: any
      invalid_response_action: retry
  - identifiers:
      target: !KeyOf flow
      stage: !KeyOf default-recovery-email
      order: 20
    model: authentik_flows.flowstagebinding
    id: flow-binding-email
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
      policy_engine_mode: any
      invalid_response_action: retry
  - identifiers:
      target: !KeyOf flow
      stage: !KeyOf stages-prompt-password
      order: 30
    model: authentik_flows.flowstagebinding
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
      policy_engine_mode: any
      invalid_response_action: retry
  - identifiers:
      target: !KeyOf flow
      stage: !KeyOf default-recovery-user-write
      order: 40
    model: authentik_flows.flowstagebinding
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
      policy_engine_mode: any
      invalid_response_action: retry
  - identifiers:
      target: !KeyOf flow
      stage: !KeyOf default-recovery-user-login
      order: 100
    model: authentik_flows.flowstagebinding
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
      policy_engine_mode: any
      invalid_response_action: retry
  - identifiers:
      policy: !KeyOf default-recovery-skip-if-restored
      target: !KeyOf flow-binding-identification
      order: 0
    model: authentik_policies.policybinding
    attrs:
      negate: false
      enabled: true
      timeout: 30
  - identifiers:
      policy: !KeyOf default-recovery-skip-if-restored
      target: !KeyOf flow-binding-email
      order: 0
    state: absent
    model: authentik_policies.policybinding
    attrs:
      negate: false
      enabled: true
      timeout: 30
  # --- homelab addition: point the default brand's recovery flow here so the
  # recovery_email API links and the login-page "forgot password" link resolve
  # to this flow. Merge-only on the existing brand (identified by domain) —
  # leaves the Default-Brand blueprint's other flow_* settings untouched.
  - identifiers:
      domain: authentik-default
    model: authentik_brands.brand
    attrs:
      flow_recovery: !KeyOf flow
