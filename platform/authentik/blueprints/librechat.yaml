# STATIC blueprint — hand-maintained, NOT rendered from _blueprint.yaml.j2
# (the render-template reconcile is a parked TODO with a revert HAZARD;
# adding new inputs to the j2 loop before that lands would be worse than a
# second static file — vaultwarden.yaml set the precedent).
#
# Authentik OIDC client for LibreChat (new app 2026-07-30; see
# homelab-docs/99-journal/2026-07-30-chat-ui-research.md). Same shape the
# shared template renders: hashed_user_id sub, openid/email/profile scopes,
# operator-group-only access binding.
#
# client_id + client_secret come from OpenBao kv/librechat/oidc via the
# authentik-oidc-clients ExternalSecret (worker env, read by the !Env tags).
version: 1
metadata:
  name: librechat-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: librechat-provider
    identifiers:
      name: librechat
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env AUTHENTIK_BOOTSTRAP_LIBRECHAT_CLIENT_ID
      client_secret: !Env AUTHENTIK_BOOTSTRAP_LIBRECHAT_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: "https://librechat.lab.vyramo.com/oauth/openid/callback"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        # Default email mapping (email_verified: False since 2026.x) is fine
        # here — LibreChat does not gate on email_verified. If it ever does,
        # swap in the trusted-verified mapping from vaultwarden.yaml.
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - model: authentik_core.application
    id: librechat-app
    identifiers:
      slug: librechat
    attrs:
      name: LibreChat
      provider: !KeyOf librechat-provider
      meta_launch_url: "https://librechat.lab.vyramo.com/"
      meta_description: "Chat UI over llm-gateway (local + cloud models)"
      group: "AI"
      policy_engine_mode: any

  # Operator-only access binding (same rationale as every other app
  # blueprint: without it a rebuild reopens the app to any authenticated
  # user).
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf librechat-app
      group: !Find [authentik_core.group, [name, operator]]
    attrs:
      order: 10
      enabled: true
      negate: false
