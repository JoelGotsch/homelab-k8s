# Authentik blueprint — Vikunja OIDC client.
#
# Provisions an OAuth2Provider + Application for the Vikunja provider key
# `authentik`. The callback path must therefore remain
# /auth/openid/authentik. Both generated client credentials come from
# OpenBao via the authentik-oidc-clients ExternalSecret (kv/todo/oidc),
# while a namespace-local ExternalSecret provides the same pair to
# Vikunja. Authentik admits the operator and family-members; Vikunja
# project membership remains the data-authorisation boundary.

version: 1
metadata:
  name: todo-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # OAuth2Provider — issues tokens, defines redirect URI +
  # signing key + scopes Todo will request.
  - model: authentik_providers_oauth2.oauth2provider
    id: todo-provider
    identifiers:
      name: todo
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env AUTHENTIK_BOOTSTRAP_TODO_CLIENT_ID
      client_secret: !Env AUTHENTIK_BOOTSTRAP_TODO_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: "https://todo.lab.vyramo.com/auth/openid/authentik"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  # Application — the user-facing tile in Authentik's launcher,
  # bound to the provider above.
  - model: authentik_core.application
    id: todo-app
    identifiers:
      slug: todo
    attrs:
      name: Todo
      provider: !KeyOf todo-provider
      meta_launch_url: "https://todo.lab.vyramo.com/"
      meta_description: "Shared todo tracker"
      group: "Productivity"
      policy_engine_mode: any

  # Access control — restrict this application to the listed group(s).
  # GitOps-tracks what was previously UI-only: without these, a blueprint
  # rebuild silently reopens every app to ANY authenticated user (incl.
  # family-members) — a regression that would pass unnoticed. Matches the live
  # bindings (2026-07-17): all apps operator-only. To grant family access to an
  # app, set `access_groups: [operator, family-members]` on its oidc-apps.yml
  # entry (defaults to [operator]). NB: akadmin (bootstrap superuser) is
  # intentionally NOT in `operator`, so it stays break-glass-only.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf todo-app
      group: !Find [authentik_core.group, [name, operator]]
    attrs:
      order: 10
      enabled: true
      negate: false
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf todo-app
      group: !Find [authentik_core.group, [name, family-members]]
    attrs:
      order: 20
      enabled: true
      negate: false
