# Authentik OIDC client inventory.
#
# Each entry expands to a rendered blueprint at
# blueprints/<slug>.yaml via homelab-infra/ansible/playbooks/
# 00-render-static.yml, which loops over this list and feeds
# every record into blueprints/_blueprint.yaml.j2.
#
# This file is the source-of-truth for the per-app OIDC
# parameters. Edit here (not the rendered .yaml outputs) +
# re-run the playbook.
#
# Per-app fields:
#   slug              — app slug; drives filename, provider id,
#                       application slug, AUTHENTIK_BOOTSTRAP_<UPPER>_
#                       CLIENT_{ID,SECRET} env var stem, and the
#                       OpenBao path (kv/<slug>/oidc).
#   name              — human display name shown in Authentik's
#                       launcher tile + the meta_description field's
#                       sibling.
#   redirect_path     — path appended to the internal hostname
#                       (https://<slug>.<internal>.<domain><path>);
#                       value comes from each upstream app's
#                       OAuth2/OIDC integration requirements.
#   meta_description  — one-liner shown on the launcher tile.
#   group             — Authentik launcher category (UI grouping
#                       only; no policy effect).
#   description       — multi-line comment header written into the
#                       rendered .yaml. Carries the per-app
#                       integration notes that previously lived
#                       in each individual .j2's leading comment
#                       block. Preserved verbatim across the
#                       Pick 5 collapse.
#
# Uniform across all entries (hard-coded in _blueprint.yaml.j2,
# NOT exposed here because no app overrides them today):
#   - client_type:          confidential
#   - scopes:               openid, email, profile
#   - sub_mode:             hashed_user_id
#   - include_claims_in_id_token: true
#   - authorization_flow:   default-provider-authorization-implicit-consent
#   - invalidation_flow:    default-provider-invalidation-flow
#   - signing_key:          "authentik Self-signed Certificate"
#   - policy_engine_mode:   any
#
# If a future app needs a non-default value for any of the above,
# promote that field to a per-entry override with a sensible
# default in the template (e.g. `client_type: {{ app.client_type
# | default('confidential') }}`). Don't fork the template.

apps:
  - slug: argocd
    name: ArgoCD
    # `name: ArgoCD` is the slug-style display name Authentik stores;
    # `display_name: "Argo CD"` is the human form used in this
    # blueprint's inline OAuth2Provider comment ("scopes Argo CD will
    # request"). Only argocd needs the two to diverge.
    display_name: "Argo CD"
    redirect_path: /auth/callback
    meta_description: GitOps reconciler
    group: Platform
    # provider_comment OVERRIDES the default 2-line "OAuth2Provider …
    # scopes <name> will request" comment that appears just above
    # the OAuth2Provider entry in the rendered blueprint. ArgoCD is
    # the only app that needs the override: it documents why the
    # `groups` scope is in the requestedIDTokenClaims essential
    # claim in argocd-cm's oidc.config block. Other apps leave this
    # field unset and inherit the default block.
    provider_comment: |
      OAuth2Provider — issues tokens, defines redirect URI +
      signing key + scopes Argo CD will request. `groups` scope
      is required for the requestedIDTokenClaims `groups`
      essential claim in argocd-cm's oidc.config block.
    description: |
      Authentik blueprint — Argo CD OIDC client.

      Provisions an OAuth2Provider + Application so Argo CD can
      delegate operator-login authn to Authentik via the OIDC config
      in bootstrap/argocd/patches/oidc-config.yaml (operator
      un-comments that patch + fills <AUTHENTIK_CLIENT_ID_ARGOCD>
      post-bring-up).

      client_id + client_secret come from OpenBao via the
      authentik-oidc-clients ExternalSecret (kv/argocd/oidc),
      projected into the worker pod as env vars by global.envFrom.
      Naming convention: AUTHENTIK_BOOTSTRAP_<APP>_CLIENT_{ID,SECRET}
      matches upstream blueprint examples + makes the env source
      unambiguous (these vars are read by !Env tags below, NOT by
      Authentik itself).

      Same client_id/client_secret pair is also read by Argo CD in
      the argocd ns via a separate ExternalSecret pointing at the
      same OpenBao path. Both pull from the same source-of-truth
      so rotation only touches OpenBao.

