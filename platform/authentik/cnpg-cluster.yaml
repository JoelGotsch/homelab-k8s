# CNPG Postgres cluster for Authentik. Same shape as
# platform/forgejo/cnpg-cluster.yaml — barman → MinIO → Restic
# tier-3 per ADR 0006. Authentik's user/application/credential
# data is the operator-identity backend; loss = full
# re-enrolment of every service.
#
# Service exposed: authentik-pg-rw.authentik.svc:5432.

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-pg
  namespace: authentik
spec:
  instances: 2
  # CVE remediation 2026-07-13: pin patched postgres image
  # (was inheriting operator default 17.2 / Debian-11 base).
  # 17.6-bookworm = latest patched 17.x, Debian-12 base.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-bookworm

  # Propagate labels to CNPG-managed children. Picked up by
  # infrastructure/longhorn/recurring-jobs.yaml's
  # `secret-personal` group: hourly snapshots × 7d retain.
  # Authentik is `secret`-class (operator-identity backend).
  #
  # 2026-07-09 ADR 0036: CNPG Postgres data volume moves to the
  # -retain family. Authentik DB carries user identities, OAuth
  # clients, policies + flows — loss = full IdP re-enrolment cascade.
  # CNPG propagates inheritedMetadata.annotations to child PVCs at
  # reconcile time (per CNPG docs), satisfying the Kyverno
  # homelab-disallow-retain-reclaim-without-annotation policy.
  inheritedMetadata:
    labels:
      recurring-job-group.longhorn.io/secret-personal: "enabled"
    annotations:
      retention.homelab.internal/reason: "Authentik IdP DB — users, OIDC clients, flows, policies; loss = full re-enrolment cascade."

  # Bumped 10Gi → 35Gi 2026-06-25: actual usage on pg-1 was 22.79 GiB
  # (vs. ~128 MB real DB data) due to Longhorn snapshot delta
  # accumulation under the `default` recurring-job-group at retain=100.
  # CNPG's inheritedMetadata.labels does NOT propagate to Longhorn
  # Volume CRs, so the secret-personal selector silently fell through
  # to default. Kyverno mutation
  # (infrastructure/kyverno/policies/longhorn-volume-label-propagation.yaml)
  # plus a Longhorn-UI snapshot prune are the root-cause fix; this
  # bump is the headroom needed while that lands. Re ADR 0016 / #73.
  storage:
    size: 35Gi
    storageClass: longhorn-replica3-retain

  monitoring:
    enablePodMonitor: true

  # Explicit resources (ADR 0042). Without this block the namespace
  # LimitRange injected cpu:500m — and a CPU limit on a latency-critical
  # identity DB is exactly the throttling hazard ADR 0042 forbids: under
  # authentik's ~29-query-per-flow load postgres hit the 500m CFS quota
  # and throttled 66%, so each cached query's psycopg wait ballooned to
  # ~89ms and a single login step took ~2.6s (→ "Authenticating..." for
  # minutes). Requests for scheduling, memory limited (non-compressible),
  # NO cpu limit. 2026-08-04.
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 2Gi

  postgresql:
    parameters:
      max_connections: "200"
      # 256MB shared_buffers within the 2Gi limit (was 128MB).
      shared_buffers: "256MB"

  bootstrap:
    initdb:
      database: authentik
      owner: authentik

  backup:
    barmanObjectStore:
      destinationPath: s3://homelab-backups-cluster/cnpg/authentik
      endpointURL: http://minio.minio-on-nas.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: authentik-cnpg-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: authentik-cnpg-s3
          key: SECRET_ACCESS_KEY
      wal:
        compression: bzip2
      data:
        compression: bzip2
    # Authentik is `secret`-classified — operator-identity
    # data. Longer retention than the standard 30d to ride
    # out a longer-window-recovery scenario.
    retentionPolicy: "90d"
