# Authentik IdP helm values — server + worker, external CNPG
# Postgres, Tailscale-only HTTPRoute via Cilium Gateway.
#
# Redis note: Authentik 2026.x removed Redis entirely. The app
# uses django_postgres_cache + django_channels_postgres +
# django_dramatiq_postgres — all Postgres-backed. No Redis
# dependency or configuration exists in the 2026.2.0 chart
# (Chart.yaml has no redis subchart; values.yaml has no redis
# key). Any redis:/authentik.redis.* values.yaml keys are
# silently dropped at render. See settings.py in the upstream
# source for confirmation.
#
# Per identity.md (Authentik enforces WebAuthn as primary
# factor for internal services) + ADR 0024 D3 (Tailscale-only
# for internal services).

# Operator-fillable cluster domain — Authentik bakes its
# absolute URLs into emails + OIDC issuer URIs.
global:
  env:
    - name: AUTHENTIK_LOG_LEVEL
      value: info
    # Required by Authentik: canonical hostname for
    # links/emails/issuer URIs.
    - name: AUTHENTIK_HOST
      value: "https://auth.lab.vyramo.com"
    # Disable Authentik's anonymous error reporting +
    # update telemetry — keep operator data in the cluster
    # per principle #2.
    - name: AUTHENTIK_DISABLE_UPDATE_CHECK
      value: "true"
    - name: AUTHENTIK_ERROR_REPORTING__ENABLED
      value: "false"
    - name: AUTHENTIK_DISABLE_STARTUP_ANALYTICS
      value: "true"
    # JSON logging for Loki ingestion per ADR 0021.
    - name: AUTHENTIK_LOG_FORMAT
      value: json
    # SMTP: host/port/username/password/from come from the
    # authentik-smtp ExternalSecret (kv/shared/smtp) via envFrom
    # below. These two are non-secret statics: Proton :587 is
    # STARTTLS. Added 2026-08-05 for invite/reset emails.
    - name: AUTHENTIK_EMAIL__USE_TLS
      value: "true"
    - name: AUTHENTIK_EMAIL__TIMEOUT
      value: "30"
    # Gunicorn workers, default 2 (upstream). Raised 2026-08-06: the
    # model-manager EMBEDDED-outpost proxy added a persistent control
    # websocket + proxy polling; with only 2 workers those starved the
    # health probes (health/ready spiked to 6s, > the 3s liveness
    # timeout) and the outpost ws flapped (unix-socket i/o timeout ->
    # ASGI accept/close race), crashlooping the server and taking ALL
    # SSO down. 4 workers gives headroom until model-manager moves to a
    # DEDICATED outpost. (WEB__ vars are ignored by the worker pod.)
    - name: AUTHENTIK_WEB__WORKERS
      value: "4"

  # Project all operator-managed creds into env vars.
  # ESO writes Secret keys named after the env var; chart's
  # global.envFrom is the only supported per-cred injection
  # point — server.envFrom / worker.envFrom are NOT honored
  # by the chart's deployment templates.
  envFrom:
    - secretRef:
        name: authentik-secret-key
    - secretRef:
        name: authentik-postgres-creds
    - secretRef:
        name: authentik-bootstrap
    # Central SMTP (kv/shared/smtp) — AUTHENTIK_EMAIL__{HOST,PORT,
    # USERNAME,PASSWORD,FROM}. USE_TLS/TIMEOUT are in global.env above.
    - secretRef:
        name: authentik-smtp
    # OIDC client credentials per app — read by !Env tags in
    # blueprints under blueprints/. One key pair per app
    # (AUTHENTIK_BOOTSTRAP_<APP>_CLIENT_{ID,SECRET}).
    - secretRef:
        name: authentik-oidc-clients

# Custom blueprints — declarative OIDC client + flow + policy
# definitions, mounted from the authentik-blueprints ConfigMap
# generated by kustomization.yaml. Worker discovers + applies
# on reconcile. Per app, one YAML key.
blueprints:
  configMaps:
    - authentik-blueprints

# Authentik chart's bundled Postgres dependency is disabled
# in favour of the cluster-pattern CNPG.
postgresql:
  enabled: false

# Server replica count — single replica matches the
# Forgejo posture (HA via backup, not clustering).
authentik:
  # Project the bootstrap creds into Authentik's expected
  # env vars at first-install only. After the first admin
  # flow completes, these are inert.
  bootstrap_password: ""   # populated via env from Secret
  bootstrap_token: ""      # populated via env from Secret
  bootstrap_email: ""      # populated via env from Secret

  # External CNPG. Username, host, name, port via plain
  # values; password via env from Secret below.
  postgresql:
    host: authentik-pg-rw.authentik.svc.cluster.local
    name: authentik
    user: authentik
    port: 5432

  log_level: info

  # Don't expose impersonation by default.
  impersonation: false

  # Email — leave disabled at first install. Operator wires
  # SMTP later if needed (e.g., self-service password reset
  # for family-shared accounts; not on day-1 path).
  email:
    host: ""
    port: 587
    use_tls: false
    use_ssl: false
    timeout: 30
    from: ""

# Server pod settings.
server:
  replicas: 1

  # Chart 2024.2+ relocated serviceMonitor under server.metrics
  # (was prometheus.serviceMonitor). Disable since kube-prometheus-stack
  # discovers via release-label convention.
  metrics:
    serviceMonitor:
      enabled: false

  # Note: env/envFrom for server-only injection NOT supported
  # by this chart — postgres + bootstrap + secret-key all flow
  # through global.envFrom above (applied to both server +
  # worker, which is correct: worker needs DB creds too).

  # Bumped 2026-08-06: the model-manager PROXY provider now runs in the
  # EMBEDDED outpost inside this server pod (blueprints/model-manager.yaml),
  # adding steady internal-API + reverse-proxy load. At 200m CPU / 1Gi the
  # server starved — gunicorn health/ready spiked past the 3s probe timeout
  # (5s+ observed), liveness killed it (exit 0, not OOM), and it crashlooped
  # (127 restarts / 11h), leaving authentik-server with zero ready endpoints
  # so models.<domain> hung on "Server is starting up". No CPU limit on
  # purpose — CFS throttling is what we are avoiding (same as authentik-pg).
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      memory: 2Gi

  # Probe timeouts relaxed 3s -> 10s (2026-08-06). health/ready does a
  # DB round-trip and briefly spiked to 6s under embedded-outpost load;
  # the stock 3s timeout turned a transient spike into a liveness kill
  # and a full crashloop. Deep-merged over chart defaults (httpGet,
  # thresholds preserved); liveness failureThreshold widened to 5.
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 5
  readinessProbe:
    timeoutSeconds: 10
  startupProbe:
    timeoutSeconds: 10

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  service:
    type: ClusterIP

  # No chart-managed ingress — we use Cilium HTTPRoute below.
  ingress:
    enabled: false

# Worker pod (background tasks: outpost provisioning, sending
# notifications, etc.).
worker:
  replicas: 1

  metrics:
    serviceMonitor:
      enabled: false

  # env/envFrom flow through global.envFrom (see top of file).

  # 512Mi limit OOMKilled the worker during blueprint discovery
  # + WebAuthn MDS import at startup — chart 2026.2.0 needs
  # ~750Mi steady-state; 1Gi limit gives headroom for periodic
  # task spikes.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

# PrometheusRules disabled (kube-prometheus-stack owns alerting).
prometheus:
  rules:
    enabled: false
