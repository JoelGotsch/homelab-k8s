# Network policies for the Authentik layer.
#
# Implemented as CiliumNetworkPolicy (not vanilla NetworkPolicy)
# because Cilium Gateway API egress to backends carries a
# special reserved identity `ingress`, not the source namespace.
# K8s NetworkPolicy's `namespaceSelector: kubernetes.io/metadata.name=ingress`
# does NOT match this identity — it would silently drop all
# Gateway → authentik-server traffic with a 5s timeout (envoy
# returns 503 "upstream connect/disconnect or reset before
# headers"). See homelab-docs/04-guides/known-caveats.md.
#
# - Server ingress: Cilium Gateway envoy (HTTPRoute) +
#   Prometheus scrape + every in-cluster OIDC consumer
#   (Forgejo, Woodpecker, Vaultwarden, Grafana, Langfuse,
#   etc.) hitting the OIDC discovery + token endpoints.
# - Server egress: kube-DNS + CNPG + OpenBao (ESO).
# - Worker egress: kube-DNS + CNPG + OpenBao + outbound
#   to OIDC clients (for token refresh + outpost reconciliation).
#
# No Redis egress: Authentik 2026.x removed Redis entirely,
# replacing it with Postgres-backed cache + channel + task
# queue (django_postgres_cache / django_channels_postgres /
# django_dramatiq_postgres).

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-server
  namespace: authentik
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: server
  ingress:
    # Cilium Gateway API traffic — carries reserved `ingress`
    # identity, NOT the ingress namespace identity.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
            - port: "9443"
              protocol: TCP
    # Prometheus scrape.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9300"
              protocol: TCP
    # In-cluster OIDC consumers — every namespace whose pods
    # call the OIDC discovery + token endpoints. Listing each
    # ns explicitly so a future namespace doesn't accidentally
    # gain unauthenticated-discovery access.
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values:
                - forgejo
                - woodpecker
                - vaultwarden
                - monitoring        # Grafana
                - langfuse
                - llm-gateway
                - nextcloud
                - jellyfin
                - argocd
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
  egress:
    # model-manager: EMBEDDED-OUTPOST proxy upstream (first proxy-
    # provider app, 2026-08-05) — the outpost inside authentik-server
    # reverse-proxies models.<domain> to the app Service.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: model-manager
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # kube-DNS.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # CNPG Postgres (same ns).
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: authentik-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # OpenBao for ESO refreshes.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-worker
  namespace: authentik
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: worker
  # No ingress rules — worker exposes no in-cluster services.
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: authentik-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # Outpost / OIDC client reconciliation: worker may push
    # tokens to in-cluster OIDC clients during apply.
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values:
                - forgejo
                - woodpecker
                - vaultwarden
                - monitoring
                - langfuse
                - llm-gateway
                - nextcloud
                - jellyfin
                - argocd
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
---
# CNPG DB-pod lockdown (netpol-audit.md MEDIUM-2). DRAFT — do NOT merge-and-
# apply blind. Until now the authentik-pg instances ran Cilium DEFAULT-ALLOW
# (nothing selected `cnpg.io/cluster`), so the DB had unrestricted ingress
# AND egress incl. the internet — the latent llm-gateway trap: the day this
# ns gains a namespace-wide egress default-deny without the CNPG egress set,
# the DB stalls 1/2 (`dial tcp 10.96.0.1:443: i/o timeout`). This CNP selects
# ONLY the DB pods for BOTH directions, which flips just those pods to
# least-privilege (default-deny + the explicit CNPG quad) while leaving every
# app pod untouched — no namespace-wide default-deny is introduced here.
#
# ROLLOUT IS OPERATOR-ATTENDED via Cilium PolicyAuditMode + Hubble (rule 14 /
# 35). Enable `cilium endpoint config <db-ep-id> PolicyAuditMode=Enabled` on
# the authentik-pg endpoints, apply this policy (evaluated-not-enforced),
# watch `hubble observe --namespace authentik --verdict AUDIT` across a full
# reconcile (operator probe, metrics scrape, replication, WAL archive to
# MinIO, apiserver reads), confirm ZERO unexpected AUDIT verdicts, then
# disable audit to enforce. A missed egress rule wedges the DB silently.
# Template: platform/openbao/networkpolicy.yaml (openbao-server CNP) — same
# audit-mode-first method that locked the vault down with zero DROPPED.
#
# The quad (netpol-best-practices.md checklist E + CLAUDE.md rules 12/14/15):
#   ingress  cnpg-system  -> 8000 (instance manager/status) + 9187 (metrics)
#   ingress  monitoring   -> 9187 (Prometheus scrape)
#   ingress  in-ns client -> 5432 (Postgres) + peer 5432 (replication)
#   egress   kube-apiserver 443 AND 6443 (socket-LB pre-translation, rule 12)
#   egress   kube-dns 53 UDP+TCP
#   egress   minio-on-nas 9000 (barman WAL/base-backup archiving)
#   egress   peer cnpg.io/cluster 5432 (streaming replication)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-pg-cnpg
  namespace: authentik
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: authentik-pg
  ingress:
    # CNPG operator (cnpg-system) — instance-manager status :8000 + metrics.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "9187"
              protocol: TCP
    # Prometheus scrape of the CNPG metrics exporter.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
    # In-namespace clients (authentik server + worker) + streaming
    # replication between the instances — both hit pod port 5432.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Peer instance-manager coordination — CNPG instances query each other's
    # status API on :8000 (instance->instance, distinct from the operator's
    # cnpg-system->instance :8000 rule above). Caught in the audit-mode rollout
    # (2026-07-17): under enforcement this peer flow drops, breaking cluster
    # status/coordination. Scoped to peers (cnpg.io/cluster) so in-namespace
    # app pods still cannot reach the instance manager.
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: authentik-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    # kube-apiserver — instance manager reads its Cluster CR. Reserved
    # entity; BOTH 443 and 6443 (socket-LB DNATs ClusterIP:443 -> :6443
    # before policy eval — CLAUDE.md rule 12).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # kube-dns.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # MinIO (minio-on-nas) — barman WAL + base-backup archiving.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: minio-on-nas
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # Peer instance (the other authentik-pg pod): streaming replication on 5432
    # + instance-manager coordination on 8000 (see the peer :8000 ingress note).
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: authentik-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
