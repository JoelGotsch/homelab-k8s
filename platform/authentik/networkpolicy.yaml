# Network policies for the Authentik layer.
#
# Implemented as CiliumNetworkPolicy (not vanilla NetworkPolicy)
# because Cilium Gateway API egress to backends carries a
# special reserved identity `ingress`, not the source namespace.
# K8s NetworkPolicy's `namespaceSelector: kubernetes.io/metadata.name=ingress`
# does NOT match this identity — it would silently drop all
# Gateway → authentik-server traffic with a 5s timeout (envoy
# returns 503 "upstream connect/disconnect or reset before
# headers"). See homelab-docs/04-guides/known-caveats.md.
#
# - Server ingress: Cilium Gateway envoy (HTTPRoute) +
#   Prometheus scrape + every in-cluster OIDC consumer
#   (Forgejo, Woodpecker, Vaultwarden, Grafana, Langfuse,
#   etc.) hitting the OIDC discovery + token endpoints.
# - Server egress: kube-DNS + CNPG + Redis (same ns) +
#   OpenBao (ESO).
# - Worker egress: kube-DNS + CNPG + Redis (same ns) +
#   OpenBao + outbound to OIDC clients (for token refresh
#   + outpost reconciliation).

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-server
  namespace: authentik
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: server
  ingress:
    # Cilium Gateway API traffic — carries reserved `ingress`
    # identity, NOT the ingress namespace identity.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
            - port: "9443"
              protocol: TCP
    # Prometheus scrape.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9300"
              protocol: TCP
    # In-cluster OIDC consumers — every namespace whose pods
    # call the OIDC discovery + token endpoints. Listing each
    # ns explicitly so a future namespace doesn't accidentally
    # gain unauthenticated-discovery access.
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values:
                - forgejo
                - woodpecker
                - vaultwarden
                - monitoring        # Grafana
                - langfuse
                - llm-gateway
                - nextcloud
                - jellyfin
                - argocd
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
  egress:
    # kube-DNS.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # CNPG Postgres (same ns).
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: authentik-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Bundled Redis (same ns).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # OpenBao for ESO refreshes.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-worker
  namespace: authentik
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: worker
  # No ingress rules — worker exposes no in-cluster services.
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: authentik-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # Outpost / OIDC client reconciliation: worker may push
    # tokens to in-cluster OIDC clients during apply.
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values:
                - forgejo
                - woodpecker
                - vaultwarden
                - monitoring
                - langfuse
                - llm-gateway
                - nextcloud
                - jellyfin
                - argocd
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
