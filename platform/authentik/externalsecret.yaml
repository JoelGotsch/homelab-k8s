# ExternalSecrets for Authentik.
# Per ADR 0023 D8 (cluster-side cred handling via ESO from
# OpenBao). Authentik is the operator-identity store — its
# own secret-management posture must match.

# Authentik's Django SECRET_KEY. Used for signing session
# cookies + CSRF tokens. Random; rotation forces all sessions
# to re-authenticate (expected on rotation events per
# nitrokey/key-compromised.md).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-secret-key
  namespace: authentik
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-secret-key
  data:
    # Chart's `envFrom: secretRef: name: authentik-secret-key`
    # injects every key in the Secret AS-IS into the env. So
    # the key name here IS the env var name Authentik reads —
    # must be AUTHENTIK_SECRET_KEY exactly.
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: authentik/secret-key
        property: value
---
# CNPG-issued postgres password.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-postgres-creds
  namespace: authentik
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-postgres-creds
  data:
    # Key name = env var name; chart's `global.envFrom` injects
    # every Secret key AS-IS as an env var. Authentik reads
    # AUTHENTIK_POSTGRESQL__PASSWORD; key must match exactly.
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: authentik/postgres
        property: password
---
# Bootstrap admin credentials. AUTHENTIK_BOOTSTRAP_TOKEN +
# AUTHENTIK_BOOTSTRAP_PASSWORD let the operator complete the
# first-admin flow at /if/flow/initial-setup/. After that
# flow, the bootstrap creds are no longer used by Authentik;
# operator can rotate them or leave them in OpenBao for
# disaster-recovery re-bootstrap.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-bootstrap
  namespace: authentik
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-bootstrap
  data:
    # Key names = env var names; injected via global.envFrom.
    # Authentik reads AUTHENTIK_BOOTSTRAP_{PASSWORD,TOKEN,EMAIL}.
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: authentik/admin
        property: bootstrap_password
    - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
      remoteRef:
        key: authentik/admin
        property: bootstrap_token
    - secretKey: AUTHENTIK_BOOTSTRAP_EMAIL
      remoteRef:
        key: authentik/admin
        property: bootstrap_email
---
# OIDC client creds, one Secret keyed for !Env consumption by
# blueprints. Each OIDC consumer app gets two keys:
# AUTHENTIK_BOOTSTRAP_<APP>_CLIENT_ID + _CLIENT_SECRET. Keys
# named exactly as the blueprint's !Env references so
# global.envFrom injection works AS-IS.
#
# OpenBao path convention: kv/<app>/oidc with properties
# `client_id` + `client_secret`. The matching consumer-side
# ExternalSecret in each app namespace (e.g.,
# homelab-k8s/observability/grafana/externalsecret.yaml) reads
# the same path so rotation only touches OpenBao.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-oidc-clients
  namespace: authentik
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-oidc-clients
  data:
    - secretKey: AUTHENTIK_BOOTSTRAP_GRAFANA_CLIENT_ID
      remoteRef:
        key: grafana/oidc
        property: client_id
    - secretKey: AUTHENTIK_BOOTSTRAP_GRAFANA_CLIENT_SECRET
      remoteRef:
        key: grafana/oidc
        property: client_secret
    - secretKey: AUTHENTIK_BOOTSTRAP_FORGEJO_CLIENT_ID
      remoteRef:
        key: forgejo/oidc
        property: client_id
    - secretKey: AUTHENTIK_BOOTSTRAP_FORGEJO_CLIENT_SECRET
      remoteRef:
        key: forgejo/oidc
        property: client_secret
    - secretKey: AUTHENTIK_BOOTSTRAP_LANGFUSE_CLIENT_ID
      remoteRef:
        key: langfuse/oidc
        property: client_id
    - secretKey: AUTHENTIK_BOOTSTRAP_LANGFUSE_CLIENT_SECRET
      remoteRef:
        key: langfuse/oidc
        property: client_secret
    - secretKey: AUTHENTIK_BOOTSTRAP_LIBRECHAT_CLIENT_ID
      remoteRef:
        key: librechat/oidc
        property: client_id
    - secretKey: AUTHENTIK_BOOTSTRAP_LIBRECHAT_CLIENT_SECRET
      remoteRef:
        key: librechat/oidc
        property: client_secret
    - secretKey: AUTHENTIK_BOOTSTRAP_NEXTCLOUD_CLIENT_ID
      remoteRef:
        key: nextcloud/oidc
        property: client_id
    - secretKey: AUTHENTIK_BOOTSTRAP_NEXTCLOUD_CLIENT_SECRET
      remoteRef:
        key: nextcloud/oidc
        property: client_secret
    - secretKey: AUTHENTIK_BOOTSTRAP_JELLYFIN_CLIENT_ID
      remoteRef:
        key: jellyfin/oidc
        property: client_id
    - secretKey: AUTHENTIK_BOOTSTRAP_JELLYFIN_CLIENT_SECRET
      remoteRef:
        key: jellyfin/oidc
        property: client_secret
    - secretKey: AUTHENTIK_BOOTSTRAP_IMMICH_CLIENT_ID
      remoteRef:
        key: immich/oidc
        property: client_id
    - secretKey: AUTHENTIK_BOOTSTRAP_IMMICH_CLIENT_SECRET
      remoteRef:
        key: immich/oidc
        property: client_secret
    - secretKey: AUTHENTIK_BOOTSTRAP_PAPERLESS_CLIENT_ID
      remoteRef:
        key: paperless/oidc
        property: client_id
    - secretKey: AUTHENTIK_BOOTSTRAP_PAPERLESS_CLIENT_SECRET
      remoteRef:
        key: paperless/oidc
        property: client_secret
    - secretKey: AUTHENTIK_BOOTSTRAP_ARGOCD_CLIENT_ID
      remoteRef:
        key: argocd/oidc
        property: client_id
    - secretKey: AUTHENTIK_BOOTSTRAP_ARGOCD_CLIENT_SECRET
      remoteRef:
        key: argocd/oidc
        property: client_secret
    - secretKey: AUTHENTIK_BOOTSTRAP_WINDMILL_CLIENT_SECRET
      remoteRef:
        key: windmill/oidc
        property: client_secret
    - secretKey: AUTHENTIK_BOOTSTRAP_TODO_CLIENT_ID
      remoteRef:
        key: todo/oidc
        property: client_id
    - secretKey: AUTHENTIK_BOOTSTRAP_TODO_CLIENT_SECRET
      remoteRef:
        key: todo/oidc
        property: client_secret
---
# CNPG barman backup creds (MinIO svcacct scoped to
# homelab-backups-cluster/cnpg/authentik/).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-cnpg-s3
  namespace: authentik
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-cnpg-s3
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: cnpg/authentik/s3-creds
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: cnpg/authentik/s3-creds
        property: secret_access_key
---
# Central homelab outbound SMTP (Proton submission) — kv/shared/smtp.
# Key names = AUTHENTIK_EMAIL__* env vars, injected AS-IS via
# global.envFrom (see values.yaml). USE_TLS/TIMEOUT are non-secret
# statics set in global.env, not here. Shared across every mail-sending
# app; seed with homelab-infra/scripts/seed-smtp.sh.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-smtp
  namespace: authentik
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-smtp
  data:
    - secretKey: AUTHENTIK_EMAIL__HOST
      remoteRef: {key: shared/smtp, property: host}
    - secretKey: AUTHENTIK_EMAIL__PORT
      remoteRef: {key: shared/smtp, property: port}
    - secretKey: AUTHENTIK_EMAIL__USERNAME
      remoteRef: {key: shared/smtp, property: username}
    - secretKey: AUTHENTIK_EMAIL__PASSWORD
      remoteRef: {key: shared/smtp, property: password}
    - secretKey: AUTHENTIK_EMAIL__FROM
      remoteRef: {key: shared/smtp, property: from}
