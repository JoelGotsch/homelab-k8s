# ExternalSecrets for Authentik.
# Per ADR 0023 D8 (cluster-side cred handling via ESO from
# OpenBao). Authentik is the operator-identity store — its
# own secret-management posture must match.

# Authentik's Django SECRET_KEY. Used for signing session
# cookies + CSRF tokens. Random; rotation forces all sessions
# to re-authenticate (expected on rotation events per
# nitrokey/key-compromised.md).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-secret-key
  namespace: authentik
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-secret-key
  data:
    # Chart's `envFrom: secretRef: name: authentik-secret-key`
    # injects every key in the Secret AS-IS into the env. So
    # the key name here IS the env var name Authentik reads —
    # must be AUTHENTIK_SECRET_KEY exactly.
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: authentik/secret-key
        property: value
---
# CNPG-issued postgres password.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-postgres-creds
  namespace: authentik
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-postgres-creds
  data:
    - secretKey: password
      remoteRef:
        key: authentik/postgres
        property: password
---
# Bootstrap admin credentials. AUTHENTIK_BOOTSTRAP_TOKEN +
# AUTHENTIK_BOOTSTRAP_PASSWORD let the operator complete the
# first-admin flow at /if/flow/initial-setup/. After that
# flow, the bootstrap creds are no longer used by Authentik;
# operator can rotate them or leave them in OpenBao for
# disaster-recovery re-bootstrap.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-bootstrap
  namespace: authentik
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-bootstrap
  data:
    - secretKey: bootstrap_password
      remoteRef:
        key: authentik/admin
        property: bootstrap_password
    - secretKey: bootstrap_token
      remoteRef:
        key: authentik/admin
        property: bootstrap_token
    - secretKey: bootstrap_email
      remoteRef:
        key: authentik/admin
        property: bootstrap_email
---
# CNPG barman backup creds (MinIO svcacct scoped to
# homelab-backups-cluster/cnpg/authentik/).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-cnpg-s3
  namespace: authentik
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-cnpg-s3
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: cnpg/authentik/s3-creds
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: cnpg/authentik/s3-creds
        property: secret_access_key
