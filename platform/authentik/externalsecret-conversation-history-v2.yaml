apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-conversation-history-v2-oidc
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-conversation-history-v2-oidc
  data:
    - secretKey: AUTHENTIK_CHIST_V2_CLIENT_ID
      remoteRef: {key: conversation-history-v2/oidc, property: client_id}
    - secretKey: AUTHENTIK_CHIST_V2_CLIENT_SECRET
      remoteRef: {key: conversation-history-v2/oidc, property: client_secret}
    - secretKey: AUTHENTIK_CHIST_V2_OWNER
      remoteRef: {key: conversation-history-v2/oidc, property: owner_username}
