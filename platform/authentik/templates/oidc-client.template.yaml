# Reusable Authentik OIDC client pattern.
#
# Template, NOT a deployable manifest. Copy + adapt per app.
# Replaces 4 placeholders:
#   {{APP_NAME}}     - lowercase app name (matches namespace)
#   {{APP_DOMAIN}}   - public hostname (e.g., vault.lab.example.com)
#   {{REDIRECT_URI}} - app's OIDC callback URL
#   {{SCOPES}}       - space-separated scopes the app needs
#
# Pattern (per app needing OIDC):
#   1. Operator creates the client in Authentik UI / via terraform
#      (manual; Authentik's API is operator-driven for this).
#   2. Authentik produces a client_id + client_secret.
#   3. Operator stores secret in OpenBao at
#      kv/prod/authentik/clients/{{APP_NAME}}/{client_id, client_secret}.
#   4. Drop a ManifestSecret-shaped ExternalSecret like below
#      into the app's manifest dir; it pulls the secret values
#      into a Kubernetes Secret named {{APP_NAME}}-oidc.
#   5. App's Helm values reference the Secret for its OIDC
#      configuration.

# -----------------------------------------------------------
# 1) ExternalSecret pulling client_id + client_secret from OpenBao
# -----------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{APP_NAME}}-oidc
  namespace: {{APP_NAME}}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: {{APP_NAME}}-oidc
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: prod/authentik/clients/{{APP_NAME}}
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: prod/authentik/clients/{{APP_NAME}}
        property: client_secret

---
# -----------------------------------------------------------
# 2) (Optional) ConfigMap with non-secret OIDC config the app
#    can read; useful if the app's Helm chart consumes OIDC
#    config via separate values.
# -----------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{APP_NAME}}-oidc-config
  namespace: {{APP_NAME}}
data:
  issuer: "https://auth.lab.vyramo.com/application/o/{{APP_NAME}}/"
  authorization_endpoint: "https://auth.lab.vyramo.com/application/o/authorize/"
  token_endpoint: "https://auth.lab.vyramo.com/application/o/token/"
  userinfo_endpoint: "https://auth.lab.vyramo.com/application/o/userinfo/"
  jwks_uri: "https://auth.lab.vyramo.com/application/o/{{APP_NAME}}/jwks/"
  redirect_uri: "{{REDIRECT_URI}}"
  scopes: "{{SCOPES}}"

# -----------------------------------------------------------
# Per-app Authentik-side configuration (operator manual):
#
# 1. Authentik admin UI → Applications → Create
#    - Name: {{APP_NAME}}
#    - Slug: {{APP_NAME}}
#    - Provider: New OAuth2/OpenID Provider
#      - Client type: confidential
#      - Client ID: auto
#      - Client Secret: auto
#      - Redirect URIs: {{REDIRECT_URI}}
#      - Signing key: authentik-self-signed (or operator's
#        cert-manager-issued cert post-PKI bring-up)
#      - Subject mode: based on user email
#      - Include claims in id_token: yes
#      - Property mappings: default authentik claims
#
# 2. Bind to operator's group + family-members group as
#    appropriate:
#    Authentik UI → Applications → {{APP_NAME}} → Bindings →
#    add Group bindings.
#
# 3. Stage client_id + client_secret in OpenBao:
#    kubectl -n openbao exec -it openbao-0 -- bao kv put \
#      kv/prod/authentik/clients/{{APP_NAME}} \
#      client_id=<from-authentik> \
#      client_secret=<from-authentik> \
#      issuer=https://auth.lab.vyramo.com/application/o/{{APP_NAME}}/
#
# 4. Apply this template (rendered) via Argo CD on next sync.
#
# Tracking: each per-app initial-setup runbook in
# homelab-docs/03-runbooks/<app>/ documents the OIDC client
# values it expects + which scopes it requests.
# -----------------------------------------------------------
