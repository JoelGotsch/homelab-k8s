# Forgejo — self-hosted forge, source of truth per ADR 0023.
# Single-replica Forgejo + external CNPG Postgres +
# csi-rclone-NFS-crypt for LFS + Packages (per ADR 0030 §D1
# refining ADR 0025 D7) — `internal` data but cluster-overlay-
# encrypted; per-share keys per ADR 0025 D8. App data
# (config, git repos, runtime state) on Longhorn (LUKS-at-
# rest via ADR 0017). Authentik OIDC, Tailscale-only HTTPRoute.
#
# Helm chart: code.forgejo.org/forgejo-helm/forgejo (OCI).
# Per ADR 0023 D1 + D11 + D12; ADR 0019 D1 + D7; ADR 0024 D4;
# ADR 0030.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: forgejo

helmCharts:
  - name: forgejo
    repo: oci://code.forgejo.org/forgejo-helm
    version: "17.1.3"  # OPERATOR PINS via Renovate (app v15.0.5)
    releaseName: forgejo
    namespace: forgejo
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - namespace.yaml
  - cnpg-cluster.yaml
  - objectstore.yaml
  - scheduled-backup.yaml
  - pvc.yaml
  - externalsecret.yaml
  - httproute.yaml
  - httproute-registry.yaml
  - networkpolicy.yaml
  # ADR 0038 — dedicated registry path (TLS proxy + LB 10.10.30.52).
  - registry-direct.yaml
  - servicemonitor.yaml

# ADR 0036: cluster-wide resource-governance baseline.
components:
  - ../../components/first-party-namespace
  - ../../components/site-config   # build-only ConfigMap for the replacement below

# Resolve the HTTPRoute hostname from the single site-config (no hardcoded
# domain): `forgejo.FQDN_SUFFIX` -> `forgejo.<fqdn_suffix>`. Provenance: this rule
# -> ConfigMap/site-config.data.fqdn_suffix -> components/site-config/site-config.env.
replacements:
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.fqdn_suffix }
    targets:
      - select: { kind: HTTPRoute, name: forgejo }
        fieldPaths: [spec.hostnames.0]
        options: { delimiter: '.', index: 1 }

# The Helm chart creates the main app PVC (Forgejo's data dir
# on Longhorn — git repos + config + runtime state). Patch in
# the recurring-job-group label so it joins
# infrastructure/longhorn/recurring-jobs.yaml's `internal`
# group (4-hourly × 7d retain).
#
# TARGETED BY NAME, not by `app.kubernetes.io/managed-by=Helm`.
# That selector was here from the start and matched NOTHING: the
# Forgejo chart labels its PVC with `app.kubernetes.io/name` +
# `component` and never sets `managed-by`, so kustomize dropped
# the patch silently — exit 0, no stderr, no label in the render,
# Argo green. Found 2026-08-15 by scripts/check-patch-targets-match.sh
# on its first run, which is the failure mode that script exists
# for. Verified against the live cluster: gitea-shared-storage
# carried no recurring-job label at all.
#
# Consequence while it was broken: with no recurring-job label
# Longhorn puts a volume in the `default` group, so the volume
# is snapshotted hourly with 6 retained (~6h of history) rather
# than 4-hourly with 42 retained (~7d).
#
# It is NOT unprotected, and the first reading of this overstated
# it. The volume separately carries a `backup` group label applied
# straight to the Volume CR by scripts/label-backup-volumes.sh, so
# backup-daily has been taking an OFFSITE backup to NAS MinIO
# nightly with 14 retained throughout. What was missing is the
# local-snapshot depth, not the backup.
#
# This commit is the GIT HALF ONLY. A PVC label edit does not fire
# a Volume update, and this cluster deliberately does not use
# Longhorn's native PVC->Volume sync (`recurring-job.longhorn.io/
# source: enabled` would strip the script-applied `backup` label).
# Propagation is the Kyverno `longhorn-volume-label-propagation`
# policy, which mutates on Volume create/update — so the existing
# volume keeps `default` until someone re-triggers it. Same
# operator runtime step already tracked in homelab-docs TODO.md
# for nextcloud-hot and jellyfin-config; gitea-shared-storage is
# now listed there too.
#
# Only this one PVC is chart-created AND Longhorn-backed, so a
# name target is exact. The explicit PVCs in pvc.yaml stay
# untouched — they are csi-rclone on the NAS, where Longhorn
# recurring jobs mean nothing.
patches:
  - target:
      kind: PersistentVolumeClaim
      name: gitea-shared-storage
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: not-used
        labels:
          recurring-job-group.longhorn.io/internal: "enabled"
