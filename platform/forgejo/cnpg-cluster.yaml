# CNPG Postgres cluster for Forgejo. Per ADR 0023 D1 (Forgejo
# is the source of truth) + the cluster's standard CNPG
# pattern (langfuse, llm-gateway, crowdsec all use this shape).
#
# Forgejo's helm chart can deploy a bundled Postgres dependency,
# but routing through CNPG gives us:
# - Continuous WAL backup → MinIO-on-NAS (consistent with the
#   rest of the cluster's backup story per ADR 0006).
# - Restic CronJob mirrors WAL+base to tier-2/3 per
#   backup-and-dr.md.
# - Same operator-runbook surface as every other CNPG-using
#   service (no Forgejo-specific Postgres ops).
#
# Service exposed: forgejo-pg-rw.forgejo.svc:5432.
# Forgejo helm values point at this DSN through the
# forgejo-postgres-creds Secret.

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-pg
  namespace: forgejo
spec:
  instances: 2
  # CVE remediation 2026-07-13: pin patched postgres image
  # (was inheriting operator default 17.2 / Debian-11 base).
  # 17.6-bookworm = latest patched 17.x, Debian-12 base.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-bookworm

  # Propagate labels to CNPG-managed children. Picked up by
  # infrastructure/longhorn/recurring-jobs.yaml's `internal`
  # group: 4-hourly snapshots × 7d retain.
  #
  # 2026-07-09 ADR 0036: CNPG Postgres data volume moves to the
  # -retain family. Forgejo DB is source-of-truth relational
  # metadata (issues, PRs, hooks, users).
  # CNPG propagates inheritedMetadata.annotations to child PVCs at
  # reconcile time (per CNPG docs), satisfying the Kyverno
  # homelab-disallow-retain-reclaim-without-annotation policy.
  inheritedMetadata:
    labels:
      recurring-job-group.longhorn.io/internal: "enabled"
    annotations:
      retention.homelab.internal/reason: "Forgejo DB — issues, PRs, hooks, users; source-of-truth for the forge."

  storage:
    # Forgejo's data churn is bounded — git data lives on
    # Longhorn (handled by the helm chart's PVC); only relational
    # metadata (users, issues, PRs, hooks) goes through Postgres.
    # 10Gi is generous at homelab scale; expand later if needed.
    size: 10Gi
    storageClass: longhorn-replica3-retain

  monitoring:
    enablePodMonitor: true

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"

  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo

  # Backup: WAL+base to MinIO-on-NAS. Restic CronJob mirrors
  # to tier-2/3 per ADR 0006. Forgejo metadata is internal-class
  # data per ADR 0003 (issue text + commit metadata, not
  # secret); backup-encrypt via barmanObjectStore + restic-tier-3
  # password.
  # Backup: WAL+base to MinIO-on-NAS via the Barman Cloud plugin;
  # target, credentials and retention live in objectstore.yaml.
  # Restic mirrors the bucket to tier-2/3 per ADR 0006.
  #
  # Migrated off the in-core `spec.backup.barmanObjectStore` on
  # 2026-08-15: CloudNativePG removes that field in 1.31.0. The two
  # forms cannot coexist — the Cluster CRD refuses
  # `isWALArchiver: true` while a barmanObjectStore block is present —
  # so this is one atomic edit, not a staged cutover.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: forgejo-pg-backups
