# Forgejo UI exposed via Cilium Gateway API HTTPRoute.
# Internal-only — Tailscale-reachable per network.md (no
# Cloudflare Tunnel; ADR 0024 D4 keeps the source-of-truth
# off the public internet).
#
# Hostname resolves from components/site-config (fqdn_suffix) — see the
# replacement in this directory's kustomization.yaml. Nothing to fill.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: forgejo
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: ingress
      sectionName: https
  hostnames:
    - "forgejo.FQDN_SUFFIX"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: forgejo-http
          port: 3000
