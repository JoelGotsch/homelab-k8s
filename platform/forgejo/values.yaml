# RENDERED FILE — DO NOT EDIT. Edit the .j2 sibling and re-run:
#   ansible-playbook ansible/playbooks/00-render-static.yml
# (from the homelab-infra repo root).
# END ANSIBLE-RENDERED HEADER (auto-managed; do not edit)
# Forgejo helm values — single-replica, external CNPG Postgres,
# NFS-backed LFS + Packages, Authentik OIDC, Tailscale-only
# HTTPRoute via Cilium Gateway.
#
# Per ADR 0023 D1 + D11 + D12 (single-replica; HA via backup,
# not clustering; storage split across Longhorn + NFS).
# Per ADR 0019 D1 + D7 (Forgejo Packages as artifact registry,
# storage on NAS).
# Per ADR 0024 (Tailscale-only ingress for source-of-truth).
# Per identity.md (Authentik OIDC for login).

# Single replica — Forgejo at this scale doesn't HA-cluster
# cleanly (its own docs note this). Resilience comes from the
# CNPG Postgres + Longhorn snapshot + Restic tier-3 chain.
replicaCount: 1

strategy:
  type: Recreate

image:
  # OPERATOR PINS via Renovate.
  tag: "15.0.5"
  rootless: true
  pullPolicy: IfNotPresent

# Pod-level env injected into all 4 containers (3 init + main).
# Holds the GITEA_ADMIN_EMAIL placeholder consumed by the
# init Secret's `--email "${GITEA_ADMIN_EMAIL}"` array element
# at configure-gitea startup. See gitea.admin.email below.
deployment:
  env:
    - name: GITEA_ADMIN_EMAIL
      valueFrom:
        secretKeyRef:
          name: forgejo-admin
          key: email

# ndots:1 — external lookups (github.com push-mirror sync) must
# not walk the search list: the node-inherited tail<net>.ts.net
# search domain SERVFAILs (not NXDOMAIN), which hard-stops musl's
# getaddrinfo before the bare name is ever tried ("could not
# resolve host: github.com" while nslookup works). Same trap as
# feedback_immich_public_proxy_dns_search-list-trap; cluster-local
# names in app.ini are already FQDNs so nothing regresses.
dnsConfig:
  options:
    - name: ndots
      value: "1"

# Forgejo's app data (config, repos, runtime state) on
# Longhorn — same shape as the rest of the cluster's stateful
# workloads. Git data is cluster-replicated; NAS is for the
# WORM-shape LFS + Packages content.
#
# 2026-07-09 ADR 0036: migrate to -retain family. Git repos +
# config are source-of-truth for the forge; PVC delete must
# not release the underlying volume. Right-sized 100Gi → 20Gi
# per audit — real usage stays under 10 GiB (LFS + Packages
# are already offloaded to NAS via forgejo-lfs + forgejo-packages
# PVCs in pvc.yaml).
persistence:
  enabled: true
  storageClass: longhorn-replica3
  size: 100Gi
  accessModes:
    - ReadWriteOnce
  annotations:
    retention.homelab.internal/reason: "Forgejo app data — git repos + config + runtime state; source-of-truth for the forge."

# We use the externally-managed CNPG cluster instead of a
# bundled Postgres, and no Redis cache (in-process is enough
# at single-replica scale). Chart v17.x (app v15.0.5+) dropped
# the postgresql/postgresql-ha/redis/redis-cluster subchart
# dependencies entirely (Bitnami free-image discontinuation) —
# there is nothing left to disable via values.

# Service: HTTP is ClusterIP behind the Cilium Gateway
# HTTPRoute; SSH is its own LoadBalancer Service on a
# separate IP in the homelab-ingress pool. Cilium v1.19
# CiliumGatewayClassConfig.spec.service has no `annotations`
# field, so we cannot share the Gateway's LB IP via
# `lbipam.cilium.io/sharing-key` on the auto-Service —
# Cilium would reconcile the annotation away. A dedicated IP
# is the only clean option at this Cilium version.
# IP: 10.10.30.51 (next free in homelab-ingress pool,
# .50 is the Gateway). DNS: `ssh.forgejo.lab.vyramo.com`
# in unbound (homelab-infra/.../unbound.conf.j2) overrides
# the *.lab.vyramo.com wildcard. The `homelab.io/l2-announce`
# label is matched by the relaxed CiliumL2AnnouncementPolicy
# selector in infrastructure/ingress/l2announcement.yaml so
# this IP is ARP-announced on the servers VLAN.
service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: LoadBalancer
    port: 22
    loadBalancerIP: 10.10.30.51
    labels:
      homelab.io/l2-announce: "true"
    annotations:
      lbipam.cilium.io/ips: "10.10.30.51"
      # The pre-existing Service is headless ClusterIP
      # (clusterIP: None); flipping to LoadBalancer cannot be
      # done by apply because clusterIP is an immutable field.
      # Replace=true + Force=true tells Argo to use
      # `kubectl replace --force` for this resource, which
      # deletes + recreates and clears the immutable-field
      # transition. Pattern: observability/crowdsec/bouncer-
      # register-job.yaml. Could be removed once the live
      # Service has been recreated as LoadBalancer, but it
      # is harmless to leave (forgejo-ssh rarely changes).
      argocd.argoproj.io/sync-options: Replace=true,Force=true

# OPERATOR FILLS vyramo.com. Forgejo's full URLs in
# emails, OAuth callbacks, and the UI's clone URLs derive
# from this.
gitea:
  admin:
    existingSecret: forgejo-admin
    # Email is NOT a real value — it's an env-var placeholder.
    # The chart inlines `gitea.admin.email` verbatim into the
    # init-Secret bash array (`--email "<value>"`), which means
    # bash expands ${GITEA_ADMIN_EMAIL} at init-container start
    # from the env var projected via deployment.env below.
    # Real value lives in OpenBao kv/forgejo/admin#email +
    # reaches the pod via the forgejo-admin Secret (templated by
    # the ExternalSecret in externalsecret.yaml). This keeps the
    # PII out of the rendered+committed values.yaml.
    # Idempotent: the init script only consumes --email when
    # creating the admin user on first install; subsequent
    # syncs hit the "user exists, skip" branch.
    email: "${GITEA_ADMIN_EMAIL}"
    username: forgejo-admin

  # Authentik OIDC auth source — DECLARATIVE (2026-07-29; before
  # this the login_source table sat empty for 2 months because the
  # intended "operator configures via admin UI" step never happened).
  # The chart's init script runs `forgejo admin auth add-oauth/
  # update-oauth` from this list on every pod start → self-heals
  # from git. The name `authentik` is LOAD-BEARING: the Authentik
  # provider blueprint pins the redirect URI to
  # /user/oauth2/authentik/callback
  # (platform/authentik/blueprints/forgejo.yaml).
  # existingSecret must carry chart-contract field names key/secret
  # (projected from kv/forgejo/oidc by the ES alongside the original
  # client_id/client_secret names).
  # BREAK-GLASS: local forgejo-admin password login stays enabled
  # deliberately — Authentik-down is cluster-degraded, exactly when
  # the forge must remain reachable; SSH-key git access never
  # touches OIDC.
  oauth:
    - name: 'authentik'
      provider: 'openidConnect'
      existingSecret: forgejo-oidc
      autoDiscoverUrl: https://auth.lab.vyramo.com/application/o/forgejo/.well-known/openid-configuration

  # External Postgres via CNPG — no bundled chart deps to
  # disable (chart v17.x dropped the postgresql/redis subcharts
  # entirely; see the note above `service:`). Connection details
  # go in `gitea.config.database` below (DB_TYPE, HOST, NAME,
  # USER + the security envFrom for DB_PASSWD).

  config:
    APP_NAME: "Forgejo — homelab"
    RUN_MODE: prod

    server:
      DOMAIN: "forgejo.lab.vyramo.com"
      ROOT_URL: "https://forgejo.lab.vyramo.com/"
      HTTP_PORT: "3000"
      SSH_DOMAIN: "forgejo.lab.vyramo.com"
      SSH_PORT: "22"
      DISABLE_SSH: "false"
      START_SSH_SERVER: "true"
      LFS_START_SERVER: "true"
      OFFLINE_MODE: "true"   # don't fetch external Gravatars
      # PQ-first key exchange for the built-in SSH server. Forgejo's
      # own shipped default (curve25519-sha256, ecdh-*, dh-group14-*)
      # has no post-quantum option — golang.org/x/crypto/ssh only
      # gained mlkem768x25519-sha256 support mid-2025, and Forgejo
      # doesn't turn it on by default even on versions whose library
      # supports it (verified 2026-07-16 against forgejo.org's config
      # cheat sheet). Client OpenSSH triggers a "not using a
      # post-quantum key exchange" warning without this. Classical
      # algorithms kept as fallback for older SSH clients.
      SSH_SERVER_KEY_EXCHANGES: "mlkem768x25519-sha256, curve25519-sha256, ecdh-sha2-nistp256, ecdh-sha2-nistp384, ecdh-sha2-nistp521, diffie-hellman-group14-sha256, diffie-hellman-group14-sha1"

    database:
      DB_TYPE: postgres
      HOST: forgejo-pg-rw.forgejo.svc.cluster.local:5432
      NAME: forgejo
      USER: forgejo
      # Password injected via security.envFrom Secret reference
      # (forgejo-postgres-creds → DB_PASSWD env var below).
      LOG_SQL: "false"

    log:
      MODE: console
      LEVEL: info
      ROUTER: console
      ENABLE_ACCESS_LOG: "true"
      # Guarded below (raw block) against Forgejo's own Go-template
      # syntax (dotted Ctx/ResponseWriter fields) being parsed as
      # a Jinja expression — a bare leading dot is a Jinja2 syntax
      # error. This line was previously only correct in the
      # rendered values.yaml (hand-patched there directly, same
      # class of drift as the extraVolumes fix above) — the .j2
      # itself could never have produced it. Fixed 2026-07-16.
      ACCESS_LOG_TEMPLATE: '{"time":"{{.Ctx.Request.Time}}","method":"{{.Ctx.Request.Method}}","url":"{{.Ctx.Request.URL.RequestURI}}","status":{{.ResponseWriter.Status}},"size":{{.ResponseWriter.Size}}}'

    service:
      DISABLE_REGISTRATION: "true"
      ALLOW_ONLY_INTERNAL_REGISTRATION: "false"
      REQUIRE_SIGNIN_VIEW: "true"
      ENABLE_NOTIFY_MAIL: "false"

    # OIDC via Authentik per identity.md — wired declaratively via
    # `gitea.oauth` above (2026-07-29); see that block for the
    # redirect-URI/name contract and the break-glass note.

    # Push-to-create: `git push <remote> <branch>` auto-creates
    # the repo if it doesn't exist (under the pusher's user or
    # org namespace). Operator workflow — local repos init'd
    # without a prior round-trip to the Forgejo UI to click
    # "New repository". Push-created repos default to PRIVATE
    # so an accidental push doesn't publish an unintended repo.
    repository:
      ENABLE_PUSH_CREATE_USER: "true"
      ENABLE_PUSH_CREATE_ORG: "true"
      DEFAULT_PUSH_CREATE_PRIVATE: "true"

    # LFS storage on NFS-backed PVC mounted at /data/lfs.
    lfs:
      STORAGE_TYPE: local
      PATH: /data/lfs

    # Packages storage on NFS-backed PVC mounted at /data/packages.
    packages:
      STORAGE_TYPE: local
      PATH: /data/packages
      ENABLED: "true"

    # Disable mail — operator-internal forge; notifications
    # via Forgejo UI + future Woodpecker → Signal bridge.
    mailer:
      ENABLED: "false"

    # Disable webhooks-to-external by default; Woodpecker is
    # the only consumer at first install, lives in-cluster.
    webhook:
      ALLOWED_HOST_LIST: "private,external"

    # Cron for routine maintenance tasks. Forgejo's bundled
    # crons (repo health, archive cleanup, etc.) run with
    # operator-tunable schedules.
    cron:
      ENABLED: "true"

    # Prometheus metrics on the main HTTP port at /metrics
    # (scraped by servicemonitor.yaml). No TOKEN → unauthenticated,
    # which is fine in-cluster: networkpolicy.yaml restricts /metrics
    # ingress to the prometheus pod only. Without this the endpoint
    # served the web UI HTML and the scrape target failed (rule 17).
    metrics:
      ENABLED: "true"

  # Forgejo reads INI keys from env vars (FORGEJO__<section>__<KEY>)
  # via environment-to-ini. These MUST live under
  # gitea.additionalConfigFromEnvs — the chart (forgejo 10.0.0) has
  # NO top-level `extraEnvVars` key, so the previous placement was
  # silently dropped and the DB password never reached the container
  # → init crashloop "password authentication failed for user
  # forgejo". Fixed 2026-05-27.
  additionalConfigFromEnvs:
    # CNPG generates the DB password and stores it in
    # `forgejo-pg-app` (autocreated, kubernetes.io/basic-auth type).
    # Read directly rather than mirroring through OpenBao (single
    # in-cluster producer + consumer; avoids rotation toil).
    - name: FORGEJO__database__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-pg-app
          key: password
    - name: FORGEJO__security__SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: forgejo-security-keys
          key: secret_key
    - name: FORGEJO__security__INTERNAL_TOKEN
      valueFrom:
        secretKeyRef:
          name: forgejo-security-keys
          key: internal_token
    - name: FORGEJO__oauth2__JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: forgejo-security-keys
          key: jwt_secret
    - name: FORGEJO__server__LFS_JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: forgejo-security-keys
          key: lfs_jwt_secret

# Pod-level security: non-root, readOnlyRootFilesystem true
# (Forgejo writes only to mounted volumes), drop all caps.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 2Gi

# Mount the LFS + Packages NFS PVCs at the paths declared in
# gitea.config.lfs.PATH + gitea.config.packages.PATH above.
#
# Top-level, NOT nested under gitea: — the chart's deployment
# template only ever reads .Values.extraVolumes /
# .Values.extraContainerVolumeMounts (or the deprecated unified
# .Values.extraVolumeMounts as a fallback). A prior gitea.additionalVolumes
# / gitea.additionalVolumeMounts placement here was a silent no-op
# (confirmed against the chart's Go templates — that key is never
# read anywhere) that had drifted from the actually-deployed
# values.yaml, which was hand-patched to the correct top-level form
# without the fix being carried back to this .j2 source. Caught
# 2026-07-16 re-rendering for the v15.0.5 upgrade — re-rendering
# from the stale .j2 would have silently dropped the LFS/Packages
# mounts on the next deploy.
extraVolumes:
  - name: lfs
    persistentVolumeClaim:
      claimName: forgejo-lfs
  - name: packages
    persistentVolumeClaim:
      claimName: forgejo-packages

extraContainerVolumeMounts:
  - name: lfs
    mountPath: /data/lfs
  - name: packages
    mountPath: /data/packages
