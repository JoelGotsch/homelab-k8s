# PVCs for Forgejo's cold buckets per ADR 0030.
#
# Forgejo's storage shape was already split before ADR 0030
# landed: Longhorn for app data (config, repo storage,
# runtime state) via the chart's `persistence` block; NFS for
# LFS objects + Packages blobs (per ADR 0019 D7 + ADR 0023 D12).
# This file replaces the old static NFS-CSI PVs with dynamic
# csi-rclone PVCs against per-share `nas-crypt-*` SCs —
# encryption-at-rest on NAS via the chained `crypt:` over
# `nfs:` remote per ADR 0030 §D1.
#
# Both shares are `internal`-classified but flagged for
# cluster-overlay encryption per ADR 0025 D7 — corp-style
# source artefacts shouldn't be readable in the at-rest case.
# Per-share keys per ADR 0025 D8.

# LFS objects — large binary blobs committed against Git
# repositories. Content-addressed (WORM-shape).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-lfs
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/component: lfs
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nas-crypt-forgejo-lfs
  # ADR 0051: bind the NAMED dataset PV, not a dynamic one at the share root.
  # Nothing to migrate — the share was verified empty on 2026-08-19 with Forgejo
  # quiesced (root ledger files=0 dirs=1 kib=0, and no forgejo/lfs directory on
  # the NAS): no LFS object has ever been pushed to this forge. `plan` reports
  # "already-migrated", which on an empty share means "nothing here", NOT "the
  # data is in place" — so this bind is verified by checking the mount is
  # present and writable, not by a ledger comparison with nothing on either side.
  volumeName: nas-forgejo-lfs-forgejo
  resources:
    requests:
      # Soft cap; NAS share is the actual constraint. LFS
      # grows with binary-blob commits — 200Gi covers the
      # operator's expected scale for several years. Resize
      # PVC (capacity-only edit) when usage approaches.
      storage: 200Gi
---
# Forgejo Packages — OCI / PyPI / Helm / etc. artefacts
# pushed by CI. Content-addressed (WORM-shape).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-packages
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/component: packages
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nas-crypt-registry-blobs
  # ADR 0051: bind the NAMED dataset PV, not a dynamic one at the share root.
  # Moved 2026-08-19 with Forgejo quiesced: 247 top-level entries (the
  # content-addressed 00-ff tree plus tmp), 734 files / 1082 dirs / 7.54 GiB,
  # relocated into forgejo/packages in 13 seconds — a server-side rename.
  # Before/after ledgers identical: files=734 dirs=1082 kib=7908475 either side.
  #
  # This was the last of the eight, and the only one the standard script could
  # not move until 2026-08-19, when the share was finally given a share-root
  # mount (backup-src-registry-blobs — a mount handle, NOT an offsite backup
  # source; see infrastructure/backup-cronjobs/nas-personal-pvcs.yaml).
  volumeName: nas-registry-blobs-forgejo-packages
  resources:
    requests:
      storage: 200Gi
