# ExternalSecrets for Forgejo. Per ADR 0023 D8 (CI/forge
# secrets via ESO from OpenBao, no long-lived tokens in
# Forgejo's own Secret store for `secret`-classified work).
#
# Operator seeds these at cold-start Step 13c. See README
# §OpenBao paths to seed for the canonical command list
# (helper-script-driven where possible).

# Forgejo admin password (initial bootstrap account).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  namespace: forgejo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: forgejo-admin
  data:
    - secretKey: password
      remoteRef:
        key: forgejo/admin
        property: password
---
# Forgejo's internal-cryptography keys: SECRET_KEY (token
# signing), INTERNAL_TOKEN (Forgejo↔internal-tools auth),
# JWT_SECRET (OAuth/OIDC tokens), LFS_JWT_SECRET (LFS auth).
# All random; loss = forced re-login + LFS object re-upload.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forgejo-security-keys
  namespace: forgejo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: forgejo-security-keys
  data:
    - secretKey: secret_key
      remoteRef:
        key: forgejo/security-keys
        property: secret_key
    - secretKey: internal_token
      remoteRef:
        key: forgejo/security-keys
        property: internal_token
    - secretKey: jwt_secret
      remoteRef:
        key: forgejo/security-keys
        property: jwt_secret
    - secretKey: lfs_jwt_secret
      remoteRef:
        key: forgejo/security-keys
        property: lfs_jwt_secret
---
# CNPG-issued postgres password. Forgejo helm values reference
# this Secret for the DSN.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forgejo-postgres-creds
  namespace: forgejo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: forgejo-postgres-creds
  data:
    - secretKey: password
      remoteRef:
        key: forgejo/postgres
        property: password
---
# Authentik OIDC client credentials for Forgejo's "Sign in with
# Authentik" flow.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forgejo-oidc
  namespace: forgejo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: forgejo-oidc
  data:
    - secretKey: client_id
      remoteRef:
        key: forgejo/oidc
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: forgejo/oidc
        property: client_secret
---
# CNPG barman backup creds (MinIO svcacct scoped to
# homelab-backups-cluster/cnpg/forgejo/).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forgejo-cnpg-s3
  namespace: forgejo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: forgejo-cnpg-s3
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: cnpg/forgejo/s3-creds
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: cnpg/forgejo/s3-creds
        property: secret_access_key
