# ExternalSecrets for Forgejo. Per ADR 0023 D8 (CI/forge
# secrets via ESO from OpenBao, no long-lived tokens in
# Forgejo's own Secret store for `secret`-classified work).
#
# Operator seeds these at cold-start Step 13c. See README
# §OpenBao paths to seed for the canonical command list
# (helper-script-driven where possible).

# Forgejo admin bootstrap account.
#
# The Gitea/Forgejo chart's `gitea.admin.existingSecret`
# expects BOTH `username` and `password` keys in the referenced
# Secret. The chart's `gitea.admin.username:` value is just a
# label; the actual init-script reads from the Secret. Missing
# `username` blocks pod startup with "couldn't find key username
# in Secret forgejo/forgejo-admin" — discovered 2026-05-25.
#
# We project a literal `username` from `metadataPolicy: None`
# template + pull `password` from OpenBao. The username is
# operator-stable; no need for a separate OpenBao path.
#
# `email` is also projected here (NOT auto-read by the chart's
# existingSecret path — only username + password are). Instead
# the chart inlines `gitea.admin.email` verbatim into the init
# bash array; we set that to `${GITEA_ADMIN_EMAIL}` in
# values.yaml so bash expands it from the env var that
# deployment.env projects from THIS Secret's `email` key. End
# result: operator PII never lands in any git-committed file,
# only the OpenBao kv/forgejo/admin#email path holds it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  namespace: forgejo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: forgejo-admin
    template:
      data:
        username: "forgejo-admin"
        password: "{{ .password }}"
        email: "{{ .email }}"
  data:
    - secretKey: password
      remoteRef:
        key: forgejo/admin
        property: password
    - secretKey: email
      remoteRef:
        key: forgejo/admin
        property: email
---
# Forgejo's internal-cryptography keys: SECRET_KEY (token
# signing), INTERNAL_TOKEN (Forgejo↔internal-tools auth),
# JWT_SECRET (OAuth/OIDC tokens), LFS_JWT_SECRET (LFS auth).
# All random; loss = forced re-login + LFS object re-upload.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forgejo-security-keys
  namespace: forgejo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: forgejo-security-keys
  data:
    - secretKey: secret_key
      remoteRef:
        key: forgejo/security-keys
        property: secret_key
    - secretKey: internal_token
      remoteRef:
        key: forgejo/security-keys
        property: internal_token
    - secretKey: jwt_secret
      remoteRef:
        key: forgejo/security-keys
        property: jwt_secret
    - secretKey: lfs_jwt_secret
      remoteRef:
        key: forgejo/security-keys
        property: lfs_jwt_secret
---
# DB password is read directly from the CNPG-auto-generated
# `forgejo-pg-app` Secret in values.yaml's extraEnvVars
# (FORGEJO__database__PASSWD). No OpenBao roundtrip — single
# in-cluster producer + consumer; ESO mirroring would just
# require manual `bao kv put` on every CNPG-issued rotation.
---
# Authentik OIDC client credentials for Forgejo's "Sign in with
# Authentik" flow.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forgejo-oidc
  namespace: forgejo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: forgejo-oidc
  data:
    - secretKey: client_id
      remoteRef:
        key: forgejo/oidc
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: forgejo/oidc
        property: client_secret
    # Second projection of the SAME pair under the field names the
    # chart's declarative `gitea.oauth[].existingSecret` contract
    # requires (`key` + `secret`, chart 17.1.3). client_id/
    # client_secret names kept — external tooling reads those.
    - secretKey: key
      remoteRef:
        key: forgejo/oidc
        property: client_id
    - secretKey: secret
      remoteRef:
        key: forgejo/oidc
        property: client_secret
---
# CNPG barman backup creds (MinIO svcacct scoped to
# homelab-backups-cluster/cnpg/forgejo/).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forgejo-cnpg-s3
  namespace: forgejo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: forgejo-cnpg-s3
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: cnpg/forgejo/s3-creds
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: cnpg/forgejo/s3-creds
        property: secret_access_key
