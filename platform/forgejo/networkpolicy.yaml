# NetworkPolicies for the Forgejo layer.
#
# - Forgejo ingress: Cilium Gateway envoy (HTTPRoute) +
#   Prometheus scrape + in-cluster consumers (Woodpecker
#   server + agent for OAuth + git-fetch, Renovate for API).
# - Forgejo egress: kube-DNS + CNPG Postgres (same ns) +
#   OpenBao (for ESO-managed secrets) + NFS server (NAS) +
#   Authentik (OIDC discovery + token validation).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgejo
  namespace: forgejo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  policyTypes: [Ingress, Egress]
  ingress:
    # Cilium Gateway envoy — HTTP(S) ingress for the UI.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - port: 3000
          protocol: TCP
        - port: 22
          protocol: TCP
    # Prometheus scrape.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 3000
          protocol: TCP
    # Woodpecker server + agent (OAuth + git-fetch).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: woodpecker
      ports:
        - port: 3000
          protocol: TCP
        - port: 22
          protocol: TCP
    # Woodpecker CI runner pods clone repos via HTTP.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ci-woodpecker
      ports:
        - port: 3000
          protocol: TCP
    # Renovate runner — autodiscover + PR creation.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: renovate
      ports:
        - port: 3000
          protocol: TCP
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # CNPG Postgres (same ns).
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: forgejo-pg
      ports:
        - port: 5432
          protocol: TCP
    # OpenBao for ESO secret refreshes (ESO operator runs in
    # external-secrets ns; the actual fetch is from the
    # operator pod, not Forgejo's pod — but allow Forgejo
    # to reach OpenBao directly in case of operator-debug
    # `bao` use from inside the pod).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
      ports:
        - port: 8200
          protocol: TCP
    # Authentik OIDC discovery + token endpoint.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - port: 9000
          protocol: TCP
        - port: 9443
          protocol: TCP
# NAS NFS egress is NOT allowed from Forgejo pods — per
# ADR 0030 §D1 the csi-rclone driver in `csi-rclone` ns is
# the only thing that talks to the NAS. Forgejo sees the
# encrypted shares (forgejo-lfs, registry-blobs) as normal
# mounted filesystems via CSI; if a PVC fails to bind, the
# pod fails to start (correct behaviour — fail-closed).
