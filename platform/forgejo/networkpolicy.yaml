# NetworkPolicies for the Forgejo layer.
#
# Implemented as CiliumNetworkPolicy (not vanilla NetworkPolicy)
# because Cilium Gateway API traffic carries the reserved
# `ingress` identity, NOT the source namespace identity. K8s
# NetPol's `namespaceSelector: kubernetes.io/metadata.name=ingress`
# silently drops Gateway → forgejo traffic (503 / 5s timeout).
# See homelab-k8s/platform/authentik/networkpolicy.yaml for the
# canonical write-up.
#
# - Forgejo ingress: Cilium Gateway envoy (HTTPRoute) +
#   Prometheus scrape + in-cluster consumers (Woodpecker
#   server + agent for OAuth + git-fetch, Renovate for API).
# - Forgejo egress: kube-DNS + CNPG Postgres (same ns) +
#   OpenBao (for ESO-managed secrets) + NFS server (NAS) +
#   Authentik (OIDC discovery + token validation) +
#   github.com:443 (push-mirror sync — Forgejo is source of
#   truth, GitHub read-only mirror per ADR 0023 D1).

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo
  namespace: forgejo
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  ingress:
    # Cilium Gateway envoy — HTTP(S) ingress for the UI,
    # reserved `ingress` identity.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "22"
              protocol: TCP
    # Prometheus scrape.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Woodpecker server + agent (OAuth + git-fetch).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: woodpecker
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "22"
              protocol: TCP
    # Woodpecker CI runner pods clone repos via HTTP.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ci-woodpecker
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Renovate runner — autodiscover + PR creation.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: renovate
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # registry-direct proxy (ADR 0038) — the dedicated registry path
    # terminates TLS and forwards /v2/ here pod-to-pod.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: registry-direct
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # llm-gateway's registry-reconcile CronJob — clones + pushes
    # homelab/llm-gateway and homelab/librechat to land the Mac's model
    # inventory. It dials the PUBLIC name, not this Service, but the
    # Cilium Gateway proxies to :3000 carrying the job pod's identity,
    # so the request is policed here too — without this rule Envoy
    # returns a plaintext 403 "Access denied" for every request,
    # including unauthenticated ones (2026-08-14).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: llm-gateway
            app.kubernetes.io/name: registry-reconcile
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # SSH-over-LoadBalancer (forgejo-ssh Service, 10.10.30.51:22):
    # the Service port 22 DNATs to pod port 2222, and with
    # externalTrafficPolicy: Cluster the L2-announcer node SNATs
    # the client IP to its node IP — so the pod observes source
    # identity `remote-node` (the announcer, currently worker2;
    # any cluster node may win the election). Port at the pod
    # is the post-DNAT pod port 2222, NOT the Service port 22
    # (Cilium socket-LB rewrites before policy lookup — see
    # feedback_gateway_500_503_triage). Without this rule, all
    # external SSH clones land as policy-verdict:none DENIED in
    # Hubble, browser/git just hangs to TCP timeout.
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "2222"
              protocol: TCP
    # ADR 0044 in-cluster subnet router (tailscale ns). Tailnet clients
    # now route 10.10.30.0/24 via the cluster Connector, which forwards
    # via normal Cilium egress (ADR 0044 D1) → the pod observes the
    # subnet-router's identity, NOT `remote-node`/`ingress` like the
    # Flint3 path. Without this, git-over-SSH from tailnet clients times
    # out (10.10.30.51:22 → pod :2222 DENIED). Web :3000 also, for direct
    # (non-gateway) reach. Access is authZ'd at the tailnet ACL
    # (tag:k8s-router, ADR 0044 D1). Added 2026-08-09.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
      toPorts:
        - ports:
            - port: "2222"
              protocol: TCP
            - port: "3000"
              protocol: TCP
  egress:
    # kube-DNS — with DNS-proxy visibility (`rules.dns`) so
    # Cilium populates its FQDN→IP cache for the toFQDNs
    # rule below (same shape as renovate-runner-egress-fqdn).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # GitHub push-mirror sync (ADR 0023 D1: GitHub is the
    # read-only downstream mirror; Forgejo pushes over HTTPS).
    # Without this, every push_mirrors sync fails on egress.
    - toFQDNs:
        - matchName: "github.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # CNPG Postgres (same ns).
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: forgejo-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # OpenBao for ESO secret refreshes (ESO operator runs in
    # external-secrets ns; the actual fetch is from the
    # operator pod, not Forgejo's pod — but allow Forgejo
    # to reach OpenBao directly in case of operator-debug
    # `bao` use from inside the pod).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # Authentik OIDC discovery + token endpoint.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
            - port: "9443"
              protocol: TCP
    # Cilium Gateway egress — kept for completeness (Forgejo
    # might reach OUT to its own Gateway for other reasons in
    # future), but webhooks now go cluster-internal via the
    # Service URL below rather than hairpinning through the
    # public Gateway.
    - toEntities:
        - ingress
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Woodpecker server cluster-internal — webhook delivery
    # target. The webhook URL stored in Forgejo points at the
    # Service DNS (woodpecker-server.woodpecker.svc.cluster.local.
    # — trailing dot disables glibc search-list walking; without
    # it, `woodpecker.lab.<domain>.tail<tailnet>.ts.net` NXDOMAIN
    # short-circuits resolution per
    # feedback_immich_public_proxy_dns_search-list-trap).
    # Cilium NP `ports` are post-DNAT pod ports (feedback_gateway_500_503_triage);
    # woodpecker-server Service :80 → pod :8000.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: woodpecker
            app.kubernetes.io/name: server
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
# NAS NFS egress is NOT allowed from Forgejo pods — per
# ADR 0030 §D1 the csi-rclone driver in `csi-rclone` ns is
# the only thing that talks to the NAS. Forgejo sees the
# encrypted shares (forgejo-lfs, registry-blobs) as normal
# mounted filesystems via CSI; if a PVC fails to bind, the
# pod fails to start (correct behaviour — fail-closed).
---
# CNPG DB-pod lockdown (netpol-audit.md MEDIUM-2). DRAFT — do NOT merge-and-
# apply blind. Until now the forgejo-pg instances ran Cilium DEFAULT-ALLOW
# (nothing selected `cnpg.io/cluster`), so the DB had unrestricted ingress
# AND egress incl. the internet — the latent llm-gateway trap: the day this
# ns gains a namespace-wide egress default-deny without the CNPG egress set,
# the DB stalls 1/2 (`dial tcp 10.96.0.1:443: i/o timeout`). This CNP selects
# ONLY the DB pods for BOTH directions, which flips just those pods to
# least-privilege (default-deny + the explicit CNPG quad) while leaving every
# app pod untouched — no namespace-wide default-deny is introduced here.
#
# ROLLOUT IS OPERATOR-ATTENDED via Cilium PolicyAuditMode + Hubble (rule 14 /
# 35). Enable `cilium endpoint config <db-ep-id> PolicyAuditMode=Enabled` on
# the forgejo-pg endpoints, apply this policy (evaluated-not-enforced), watch
# `hubble observe --namespace forgejo --verdict AUDIT` across a full reconcile
# (operator probe, metrics scrape, replication, WAL archive to MinIO,
# apiserver reads), confirm ZERO unexpected AUDIT verdicts, then disable audit
# to enforce. A missed egress rule wedges the DB silently. Template:
# platform/openbao/networkpolicy.yaml (openbao-server CNP) — same audit-mode-
# first method that locked the vault down with zero DROPPED.
#
# The quad (netpol-best-practices.md checklist E + CLAUDE.md rules 12/14/15):
#   ingress  cnpg-system  -> 8000 (instance manager/status) + 9187 (metrics)
#   ingress  monitoring   -> 9187 (Prometheus scrape)
#   ingress  in-ns client -> 5432 (Postgres) + peer 5432 (replication)
#   egress   kube-apiserver 443 AND 6443 (socket-LB pre-translation, rule 12)
#   egress   kube-dns 53 UDP+TCP
#   egress   minio-on-nas 9000 (barman WAL/base-backup archiving)
#   egress   peer cnpg.io/cluster 5432 (streaming replication)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo-pg-cnpg
  namespace: forgejo
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: forgejo-pg
  ingress:
    # CNPG operator (cnpg-system) — instance-manager status :8000 + metrics.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "9187"
              protocol: TCP
    # Prometheus scrape of the CNPG metrics exporter.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
    # In-namespace clients + streaming replication between instances —
    # both hit pod port 5432.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: forgejo
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Peer instance-manager coordination — CNPG instances query each other's
    # status API on :8000 (instance->instance, distinct from the operator's
    # cnpg-system->instance :8000 rule above). Caught in the audit-mode rollout
    # (2026-07-17): under enforcement this peer flow drops, breaking cluster
    # status/coordination. Scoped to peers (cnpg.io/cluster) so in-namespace
    # app pods still cannot reach the instance manager.
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: forgejo-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    # kube-apiserver — instance manager reads its Cluster CR. Reserved
    # entity; BOTH 443 and 6443 (socket-LB DNATs ClusterIP:443 -> :6443
    # before policy eval — CLAUDE.md rule 12).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # kube-dns.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # MinIO (minio-on-nas) — barman WAL + base-backup archiving.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: minio-on-nas
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # Peer instance (the other forgejo-pg pod): streaming replication on 5432
    # + instance-manager coordination on 8000 (see the peer :8000 ingress note).
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: forgejo-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
---
# registry-direct proxy (ADR 0038) — plain-L4 CNP pair, deliberately NOT
# gateway-mediated. Ingress: kubelet/containerd pulls arrive from the host
# netns via the L2 LB (host on the announcer node, remote-node from the
# others), LAN clients arrive as world, kyverno's imageVerify arrives with
# its pod identity. All on POD port 8443 (svc 443 -> 8443; socket-LB DNATs
# before policy eval — rule 13). Egress: forgejo-http + DNS only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: registry-direct
  namespace: forgejo
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: registry-direct
  ingress:
    - fromEntities:
        - host
        - remote-node
        - world
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    # ADR 0044 in-cluster subnet router — tailnet clients reach the
    # direct registry via the cluster Connector (source = subnet-router
    # pod identity, not world/remote-node). Added 2026-08-09.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    # kyverno engine controllers — cosign signature pulls (ADR 0019/0038).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kyverno
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    # trivy-operator scanners — vulnerability scans pull first-party image
    # metadata through the direct path too (observed DROPPED 2026-07-19).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: trivy-system
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    # registry-integrity-probe — daily `crane validate` blob-integrity
    # CronJob (infrastructure/registry-integrity-probe). Its egress CNP
    # was in place but this ingress side was missing at first deploy:
    # smoke-test connects timed out (i/o timeout to 10.10.30.52:443)
    # until this rule landed — the "missing one direction silently
    # hangs" netpol class, found 2026-07-29.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: registry-integrity-probe
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    # argocd-repo-server — Helm chart pulls from the mirror (ADR 0052 D3).
    # Charts are referenced, not vendored, so the reconciler now pulls them
    # from registry.homelab.internal at render time.
    #
    # This was the "unreachable registry" in ADR 0052, and it presented as
    # the same class as the registry-integrity-probe case above: one
    # direction missing, so the connection hangs rather than refusing.
    # Measured from inside the repo-server pod before this rule:
    # `getent hosts` resolved 10.10.30.52, and
    # `openssl s_client -connect registry.homelab.internal:443` returned NO
    # output at all before timing out — while the same command against
    # forgejo's LB (10.10.30.50) from the same pod completed a handshake,
    # and the operator's laptop got a clean 401 from the registry. A
    # silently blackholed destination with a working sibling is a policy
    # drop, not the LB hairpin first suspected.
    #
    # Scoped to the repo-server rather than the whole argocd namespace: it
    # is the only component that renders manifests, so it is the only one
    # that needs the mirror.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            app.kubernetes.io/name: argocd-repo-server
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Upstream: the Forgejo pod, plain pod-to-pod on 3000.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: forgejo
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
