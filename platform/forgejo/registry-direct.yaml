# registry-direct — dedicated L4 path for registry.homelab.internal
# (ADR 0038). TLS-terminating nginx in front of forgejo-http:3000,
# exposed on LB 10.10.30.52, bypassing the Cilium Gateway entirely.
#
# WHY (ADR 0038 context, short form): the gateway path evaluates policy
# at the Envoy with original identities on the upstream hop (client
# egress AND backend ingress), so cluster-critical registry traffic
# (kubelet image pulls, kyverno signature verification) silently broke
# the moment the netpol matrix tightened — masked for an unknown window
# by Spegel's node cache. This path is plain L4: testable with ordinary
# CNPs and the audit-mode ceremony.
#
# REALM REWRITE (ADR 0038 D2): Forgejo hardcodes its OCI token realm to
# AppURL (forgejo.<fqdn_suffix>), bouncing clients to a second host
# mid-dance — the root of the dual-host creds/trust workaround in
# talos/patches/containerd-registry.yaml. nginx rewrites the
# WWW-Authenticate realm so token + manifests + blobs all stay on
# registry.homelab.internal. (The header is added on ALL /v2/ responses
# — clients only read it on 401, harmless elsewhere.)
#
# CUTOVER: inert until the operator moves the unbound A-record
# registry.homelab.internal 10.10.30.50 -> 10.10.30.52 (attended; the
# change is prepared in homelab-infra). Until then everything keeps
# using the gateway path — no regression window. Pre-cutover the path
# is fully testable via `curl --resolve registry.homelab.internal:443:10.10.30.52`.

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: registry-direct-tls
  namespace: forgejo
spec:
  secretName: registry-direct-tls
  issuerRef:
    name: homelab-internal-issuer
    kind: ClusterIssuer
  # OpenBao's PKI role requires a CN ("the common_name field is required"
  # 400 on the first issuance attempt without it — 2026-07-19).
  commonName: registry.homelab.internal
  dnsNames:
    - registry.homelab.internal
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-direct-nginx
  namespace: forgejo
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 256; }
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      # OCI blobs are large; never buffer to disk, stream both ways.
      client_max_body_size 0;
      proxy_buffering off;
      proxy_request_buffering off;
      server {
        listen 8443 ssl;
        http2 on;
        server_name registry.homelab.internal;
        ssl_certificate     /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;
        # Only the OCI surface — this is a registry endpoint, not a
        # general Forgejo mirror. Everything else 404s here.
        location /v2/ {
          # Headless service, trailing dot to skip search-domain walk
          # (ts.net search-domain trap — see forgejo CNP comments).
          proxy_pass http://forgejo-http.forgejo.svc.cluster.local.:3000;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_http_version 1.1;
          # ADR 0038 D2: keep the whole OCI auth dance on THIS host.
          proxy_hide_header WWW-Authenticate;
          add_header WWW-Authenticate 'Bearer realm="https://registry.homelab.internal/v2/token",service="container_registry"' always;
        }
        location = /healthz { return 200 "ok\n"; }
        location / { return 404; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-direct
  namespace: forgejo
  labels:
    app.kubernetes.io/name: registry-direct
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-direct
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-direct
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          # Unprivileged variant — PSS restricted namespace. Third-party
          # image: tag-pinned, Renovate adds the digest pin (audit-
          # third-party-image-digest is Audit).
          image: docker.io/nginxinc/nginx-unprivileged:1.29-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8443
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            httpGet: {path: /healthz, port: 8443, scheme: HTTPS}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 8443, scheme: HTTPS}
            periodSeconds: 15
      volumes:
        - name: conf
          configMap: {name: registry-direct-nginx}
        - name: tls
          secret: {secretName: registry-direct-tls}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry-direct
  namespace: forgejo
  labels:
    app.kubernetes.io/name: registry-direct
    # Opt into the companion L2 policy (see
    # infrastructure/ingress/l2announcement.yaml — the primary policy only
    # covers the gateway's auto-Service; dedicated LBs announce via label).
    homelab.io/l2-announce: "true"
  annotations:
    # Same L2-announced pool as the gateway (10.10.30.50-59); .50 =
    # gateway, .51 = forgejo-ssh, .52 = registry-direct (ADR 0038).
    lbipam.cilium.io/ips: "10.10.30.52"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: registry-direct
  ports:
    - name: https
      port: 443
      targetPort: 8443
