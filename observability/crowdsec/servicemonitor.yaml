# Self-metrics scrape for LAPI + agent. Both expose Prometheus
# format on :6060 (chart default).
#
# Chart's bundled ServiceMonitor uses a different label
# selector than our kube-prometheus-stack release; we ship
# our own with the right `release: kube-prometheus-stack`
# label.
#
# INERT UNTIL 2026-09-13: both monitors selected
# `app.kubernetes.io/component=lapi|agent`, which no Service carries — the
# chart's Services are labelled only `app=crowdsec-service` (LAPI, selects
# type=lapi) and `app=crowdsec-agent-service` (agent, selects type=agent), and
# the `crowdsec-lapi-*` Services are CNPG's. Prometheus had no crowdsec target
# for the layer's whole life. Verified before the fix: both pods serve `cs_*`
# series on 127.0.0.1:6060/metrics, and ciliumnetworkpolicy.yaml already admits
# monitoring/prometheus on 6060 for both. Guarded by
# scripts/check-selectors-match-render.py (TODO hl-0292).

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crowdsec-lapi
  namespace: observability-crowdsec
  labels:
    app.kubernetes.io/name: crowdsec
    app.kubernetes.io/component: lapi
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: crowdsec-service
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crowdsec-agent
  namespace: observability-crowdsec
  labels:
    app.kubernetes.io/name: crowdsec
    app.kubernetes.io/component: agent
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: crowdsec-agent-service
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
