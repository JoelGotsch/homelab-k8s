# NetworkPolicies for the CrowdSec layer.
#
# - LAPI ingress: agent (same ns) + cidrgroup-sync CronJob (same ns)
#                 + Prometheus self-metrics + community Console
#                   bidirectional API (egress to api.crowdsec.net).
# - LAPI egress: kube-DNS + CNPG (same ns) + community Console.
# - Agent ingress: Prometheus.
# - Agent egress: kube-DNS + LAPI (same ns) + Loki (monitoring) +
#                 community Hub fetch (api.crowdsec.net).
# - CronJob ingress: none.
# - CronJob egress: kube-DNS + LAPI + kube-API.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crowdsec-lapi
  namespace: crowdsec
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: lapi
  policyTypes: [Ingress, Egress]
  ingress:
    # Agent in same ns.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: agent
      ports:
        - port: 8080
          protocol: TCP
    # CronJob in same ns.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: cidrgroup-sync
      ports:
        - port: 8080
          protocol: TCP
    # Prometheus scrape.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 6060
          protocol: TCP
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # CNPG Postgres in same ns.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: crowdsec-lapi
      ports:
        - port: 5432
          protocol: TCP
    # CrowdSec Console (community blocklist + telemetry):
    # narrowed to specific FQDNs via the companion
    # CiliumNetworkPolicy in ciliumnetworkpolicy-egress.yaml
    # (toFQDNs: api.crowdsec.net, app.crowdsec.net). The
    # vanilla NetworkPolicy intentionally has NO 443-egress
    # rule for LAPI — Cilium's FQDN-based allow is the
    # gate. Vanilla cannot match on hostname; this is the
    # canonical "use CCNP for L7-aware egress" pattern.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crowdsec-agent
  namespace: crowdsec
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: agent
  policyTypes: [Ingress, Egress]
  ingress:
    # Prometheus scrape.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 6060
          protocol: TCP
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # LAPI (same ns).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: lapi
      ports:
        - port: 8080
          protocol: TCP
    # Loki (acquisition source per decision E).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - port: 3100
          protocol: TCP
    # CrowdSec Hub (parser/scenario fetch): narrowed to the
    # specific FQDN via the companion CiliumNetworkPolicy in
    # ciliumnetworkpolicy-egress.yaml (toFQDNs:
    # hub.crowdsec.net). Vanilla NetworkPolicy cannot match
    # on hostname; the L7-aware gate lives in the CCNP.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crowdsec-cidrgroup-sync
  namespace: crowdsec
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: cidrgroup-sync
  policyTypes: [Ingress, Egress]
  ingress: []   # no inbound; CronJob is initiator-only
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # LAPI (read decisions list).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: lapi
      ports:
        - port: 8080
          protocol: TCP
    # kube-API for `kubectl apply` of the CIDRGroup CR.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              component: kube-apiserver
      ports:
        - port: 6443
          protocol: TCP
        - port: 443
          protocol: TCP
