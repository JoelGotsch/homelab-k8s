# CrowdSec helm chart values. Per ADR 0021 D6 + decisions in
# 99-journal/2026-04-30-crowdsec-cluster-side.md:
#   A: CNPG over chart-default Postgres → external db config below.
#   B: Cilium-native bouncer → not deployed by this chart;
#      lives in cidrgroup-sync-cronjob.yaml + ciliumnetworkpolicy.yaml.
#   E: Loki-API acquisition over file-tail DaemonSet → agent
#      runs as a Deployment, not a DaemonSet.
#   F: ConfigMap-driven allowlist → see allowlist-configmap.yaml
#      mounted at the path the chart's whitelist module expects.

# === Combined LAPI + agent in one release ===
#
# LAPI talks to the CNPG-managed Postgres via env-var-injected
# DSN. Agent talks to LAPI on the in-pod localhost.
agent:
  enabled: true
  # Single-replica Deployment — agent is stateless from the
  # operator's POV; LAPI carries the durable state.
  replicas: 1

  # Loki-API acquisition. Per decision E: clean composability
  # over real-time at this layer; reconsider-trigger if
  # credential-stuffing slips past the auth-layer rate limit.
  #
  # Chart schema in v0.24.0: `acquisition` is reserved for
  # K8s pod-log tail sources (namespace/podName/program
  # tuple). External-source modes (loki, s3, http, kafka, …)
  # live under `additionalAcquisition`. We use Loki only.
  additionalAcquisition:
    - source: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      # Cilium Gateway envoy access logs. The exact selector
      # depends on the Cilium chart's pod-label scheme — at
      # first install, operator verifies via:
      #   logcli labels -q app
      # and tunes if the label scheme differs. Falls back to
      # an empty stream until the gateway is deployed.
      query: '{namespace="cilium-gateway"} |= ""'
      labels:
        type: cilium-envoy-access
      # Replay the last hour at first start; afterwards
      # follows the live tail.
      since: 1h
      delay_for: 10s

  # CrowdSec hub modules to install. The chart pulls from the
  # hub at first start. Pin a specific hub commit via
  # config.hub_commit if reproducibility matters; default is
  # latest.
  hub:
    collections:
      - crowdsecurity/linux
      - crowdsecurity/base-http-scenarios
      - crowdsecurity/http-cve
      # Operator extends as workload-specific scenarios emerge
      # (e.g. crowdsecurity/vaultwarden, crowdsecurity/grafana
      # if Authentik fronts those after landing).
    parsers:
      # Generic envoy access-log parser — written by the
      # operator per the README §Parsers section, since
      # Cilium Gateway emits envoy logs that don't match
      # the chart's nginx default.
      - crowdsecurity/envoy-logs
    scenarios:
      # Pulled in by the collections above; explicit list
      # for documentation. Each scenario fires on a rate-
      # over-window match.

# === LAPI ===
lapi:
  enabled: true

  # External Postgres — CNPG cluster `crowdsec-lapi` in this
  # ns (see cnpg-cluster.yaml).
  database:
    type: postgresql
    host: crowdsec-lapi-rw.crowdsec.svc.cluster.local
    port: 5432
    name: crowdsec
    user: crowdsec
    # Password from the LAPI_POSTGRES_PASSWORD secret key
    # in crowdsec-secrets (ExternalSecret-managed; sourced
    # from kv/crowdsec/lapi). Operator copies the CNPG-
    # issued password from the cluster's own creds Secret
    # at first install.
    existingSecret: crowdsec-secrets
    secretKey: LAPI_POSTGRES_PASSWORD

  # Pre-create the cilium-bouncer at first start using the
  # API key from crowdsec-cilium-bouncer Secret. Without
  # this, operator runs `cscli bouncers add cilium-bouncer`
  # manually after first LAPI start.
  bouncers:
    - name: cilium-bouncer
      key:
        secretName: crowdsec-cilium-bouncer
        secretKey: BOUNCER_API_KEY

  # Disable the LAPI dashboard — Grafana is the cluster's
  # observability UI; LAPI metrics + decisions surface via
  # ServiceMonitor (separate manifest) and via the sync
  # CronJob's logs in Loki.
  dashboard:
    enabled: false

# === Console enrollment for community blocklist ===
config:
  console:
    enrollKey:
      existingSecret: crowdsec-secrets
      secretKey: CONSOLE_ENROLL_KEY
    # Enable just the parts needed for the blocklist
    # subscription — share custom scenarios with the
    # community is opt-in only.
    share_custom: false
    share_manual_decisions: false
    share_tainted: false
    share_context: false

# === Allowlist (operator-managed) ===
# The chart mounts /etc/crowdsec/parsers/s02-enrich/whitelists.yaml
# from the `crowdsec-allowlist` ConfigMap. See
# allowlist-configmap.yaml for the rendered content.
volumeMounts:
  - name: allowlist
    mountPath: /etc/crowdsec/parsers/s02-enrich/whitelists.yaml
    subPath: whitelists.yaml
    readOnly: true
volumes:
  - name: allowlist
    configMap:
      name: crowdsec-allowlist
      items:
        - key: whitelists.yaml
          path: whitelists.yaml

# === Self-metrics ===
# Both LAPI + agent expose Prometheus on :6060. Chart-default
# Service for prometheus is created; ServiceMonitor lives in
# servicemonitor.yaml.
metrics:
  enabled: true
  serviceMonitor:
    enabled: false  # chart's SM doesn't match our release-label
                    # convention; servicemonitor.yaml ships our own.

# === Resources ===
resources:
  agent:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  lapi:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# === Pod security ===
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
