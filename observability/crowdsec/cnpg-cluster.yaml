# CNPG Postgres cluster for the CrowdSec LAPI.
# Per ADR 0021 D6 ("Shared LAPI lives in-cluster, backed by
# Postgres on Longhorn") + decision A in
# 99-journal/2026-04-30-crowdsec-cluster-side.md (CNPG over
# chart-default Postgres, matches the codebase pattern).
#
# Data classification: internal (per ADR 0003) — banned-IP
# decisions + audit metadata. RPO 4h, RTO 24h. CNPG WAL+base
# covers RPO; well within the matrix.
#
# Service exposed: crowdsec-lapi-rw.crowdsec.svc:5432 — the
# CrowdSec helm chart points at this DSN through the
# crowdsec-lapi-db Secret.

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: crowdsec-lapi
  namespace: observability-crowdsec
spec:
  instances: 2

  # Pin the postgres image explicitly (was inheriting the CNPG
  # operator default = postgresql:17.2, a Debian-11/bullseye
  # base with ~21 CRITICAL CVEs flagged by Trivy 2026-07-13).
  # 17.6-bookworm is the latest patched 17.x on a Debian-12
  # base — same PG major (data-compatible rolling update), the
  # newer base clears the deb11 package CVEs.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-bookworm

  # Propagate labels to CNPG-managed children. Picked up by
  # infrastructure/longhorn/recurring-jobs.yaml's `internal`
  # group: 4-hourly snapshots × 7d retain.
  inheritedMetadata:
    labels:
      recurring-job-group.longhorn.io/internal: "enabled"

  # 5Gi → 15Gi 2026-06-09: WAL accumulated locally since 2026-06-05 when
  # S3 archiving started failing; PV hit 6.01 GB actual against the 5 GiB
  # spec, and CNPG's `Detected low-disk space condition` pre-flight
  # blocked postgres from booting — cascade: no postgres → no
  # crowdsec-lapi-rw endpoints → LAPI bootstrap "no route to host" →
  # agent fatals on "performing jwt auth" → ~788 restarts. Longhorn-
  # replica3 supports online expansion + the chart has
  # resizeInUseVolumes: true so this resizes in place. Diagnosis in
  # 99-journal/2026-06-09-cluster-state-survey.md §CrowdSec.
  storage:
    size: 25Gi
    storageClass: longhorn-replica3

  monitoring:
    enablePodMonitor: true

  postgresql:
    parameters:
      max_connections: "50"
      shared_buffers: "64MB"

  bootstrap:
    initdb:
      database: crowdsec
      owner: crowdsec

  # Backup: WAL+base to MinIO-on-NAS. Restic CronJob (separate)
  # replicates the bucket to tier-2/3 per ADR 0006.
  #
  # SEQUENCING: MinIO-on-NAS must be Healthy before this
  # Cluster's first sync. Pre-MinIO, comment the backup: block;
  # CrowdSec carries internal-class data, acceptable to
  # bootstrap without backups. Re-enable once MinIO lands.
  backup:
    barmanObjectStore:
      destinationPath: s3://homelab-backups-cluster/cnpg/crowdsec
      endpointURL: http://minio.minio-on-nas.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: crowdsec-cnpg-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: crowdsec-cnpg-s3
          key: SECRET_ACCESS_KEY
      wal:
        compression: bzip2
      data:
        compression: bzip2
    # 30d per backup-and-dr.md class-aligned rule (internal class —
    # banned-IP / decision metadata; older PITR satisfied via
    # Restic tier-2/3 restore if ever needed).
    retentionPolicy: "30d"
