# CrowdSec console enrollment key + cilium-bouncer API key,
# from OpenBao.
#
# OpenBao path layout:
#   kv/data/crowdsec/console:
#     enroll_key: <token from app.crowdsec.net Console
#                  registration; one-time operator action>
#   kv/data/crowdsec/bouncers:
#     cilium_bouncer_key: <generated by `cscli bouncers add
#                          cilium-bouncer` after first LAPI
#                          start; rotated annually>
#   kv/data/crowdsec/lapi:
#     postgres_password: <CNPG-issued; populated from CNPG's
#                         own Secret via a separate ExternalSecret
#                         flow OR direct copy by operator at
#                         first install>
#
# The chart consumes `crowdsec-secrets` for the LAPI Postgres
# password + console enroll key; the bouncer-key Secret feeds
# the cidrgroup-sync CronJob.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crowdsec-secrets
  namespace: observability-crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: crowdsec-secrets
    creationPolicy: Owner
  data:
    - secretKey: CONSOLE_ENROLL_KEY
      remoteRef:
        key: crowdsec/console
        property: enroll_key
    - secretKey: LAPI_POSTGRES_PASSWORD
      remoteRef:
        key: crowdsec/lapi
        property: postgres_password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crowdsec-cilium-bouncer
  namespace: observability-crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: crowdsec-cilium-bouncer
    creationPolicy: Owner
  data:
    - secretKey: BOUNCER_API_KEY
      remoteRef:
        key: crowdsec/bouncers
        property: cilium_bouncer_key
---
# OpenWrt-side bouncer key. Operator pre-creates the bouncer
# in cluster LAPI via:
#   kubectl -n observability-crowdsec exec deploy/crowdsec -- \
#     cscli bouncers add openwrt-bouncer -k <KEY>
# Key seeded at kv/crowdsec/bouncers field openwrt_bouncer_key.
# Per 99-journal/2026-05-02-crowdsec-router-side.md.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crowdsec-openwrt-bouncer
  namespace: observability-crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: crowdsec-openwrt-bouncer
    creationPolicy: Owner
  data:
    - secretKey: BOUNCER_API_KEY
      remoteRef:
        key: crowdsec/bouncers
        property: openwrt_bouncer_key
---
# OpenWrt-side machine token (the agent-side credential).
# Operator pre-creates the machine in cluster LAPI via:
#   kubectl -n observability-crowdsec exec deploy/crowdsec -- \
#     cscli machines add openwrt --auto
# `--auto` generates a random password; operator captures it +
# seeds at kv/crowdsec/machines field openwrt_machine_password.
# The machine USERNAME is just `openwrt` (operator-typed; not
# secret-classified).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crowdsec-openwrt-machine
  namespace: observability-crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: crowdsec-openwrt-machine
    creationPolicy: Owner
  data:
    - secretKey: MACHINE_PASSWORD
      remoteRef:
        key: crowdsec/machines
        property: openwrt_machine_password
