# CrowdSec console enrollment key + cilium-bouncer API key,
# from OpenBao.
#
# OpenBao path layout:
#   kv/data/crowdsec/console:
#     enroll_key: <token from app.crowdsec.net Console
#                  registration; one-time operator action>
#   kv/data/crowdsec/bouncers:
#     cilium_bouncer_key: <generated by `cscli bouncers add
#                          cilium-bouncer` after first LAPI
#                          start; rotated annually>
#   kv/data/crowdsec/lapi:
#     postgres_password: <CNPG-issued; populated from CNPG's
#                         own Secret via a separate ExternalSecret
#                         flow OR direct copy by operator at
#                         first install>
#
# The chart consumes `crowdsec-secrets` for the LAPI Postgres
# password + console enroll key; the bouncer-key Secret feeds
# the cidrgroup-sync CronJob.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crowdsec-secrets
  namespace: crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: crowdsec-secrets
    creationPolicy: Owner
  data:
    - secretKey: CONSOLE_ENROLL_KEY
      remoteRef:
        key: crowdsec/console
        property: enroll_key
    - secretKey: LAPI_POSTGRES_PASSWORD
      remoteRef:
        key: crowdsec/lapi
        property: postgres_password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crowdsec-cilium-bouncer
  namespace: crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: crowdsec-cilium-bouncer
    creationPolicy: Owner
  data:
    - secretKey: BOUNCER_API_KEY
      remoteRef:
        key: crowdsec/bouncers
        property: cilium_bouncer_key
