# CrowdSec — edge IP-reputation + behavioural detection.
# Per ADR 0021 D6.
#
# Cluster-side only this commit; router-side (OpenWrt CrowdSec
# package, shared LAPI access via Tailscale) tracked separately
# in TODO.md "CrowdSec — router-side remaining scope" with
# named prereqs (OpenWrt UCI export + Tailscale subnet
# exposure for LAPI).
#
# Components:
# - CrowdSec helm release (LAPI + agent in one chart)
# - CNPG Postgres cluster as the LAPI database (decision A)
# - CiliumCIDRGroup + CCNP for Cilium-native bouncer (decision B)
# - cidrgroup-sync CronJob bridging LAPI decisions → CIDR group
# - Loki-based acquisition (decision E)
# - ConfigMap-driven operator allowlist (decision F)

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: crowdsec
    repo: https://crowdsecurity.github.io/helm-charts
    version: "0.24.0"  # OPERATOR PINS via Renovate (chart app v1.7.8)
    releaseName: crowdsec
    namespace: observability-crowdsec 
    valuesFile: values.yaml
    includeCRDs: false

resources:
  - namespace.yaml
  - cnpg-cluster.yaml
  - scheduled-backup.yaml
  - cnpg-s3-externalsecret.yaml
  - externalsecret.yaml
  - allowlist-configmap.yaml
  - ciliumcidrgroup-bootstrap.yaml
  - ciliumnetworkpolicy.yaml
  - ciliumnetworkpolicy-egress.yaml
  - cidrgroup-sync-cronjob.yaml
  - rbac.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  - httproute.yaml
  - bouncer-register-job.yaml

# Build-only ConfigMap for the HTTPRoute-hostname replacement below.
components:
  - ../../components/site-config

# Resolve the HTTPRoute hostname from the single site-config (no hardcoded
# domain): `crowdsec.FQDN_SUFFIX` -> `crowdsec.<fqdn_suffix>`. Provenance: this rule
# -> ConfigMap/site-config.data.fqdn_suffix -> components/site-config/site-config.env.
replacements:
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.fqdn_suffix }
    targets:
      - select: { kind: HTTPRoute, name: crowdsec-lapi }
        fieldPaths: [spec.hostnames.0]
        options: { delimiter: '.', index: 1 }

# Inject ndots:1 into the agent + LAPI pods. The chart's agent
# template has no `dnsConfig` extension point (`tolerations`,
# `affinity`, `nodeSelector` are the only pod-level escape
# hatches it surfaces), so we patch the rendered Deployment.
# Same musl getaddrinfo + Tailscale-search-domain race that the
# cidrgroup-sync CronJob mitigates inline — when ndots:5 is in
# effect, libc resolution of `loki.monitoring.svc.cluster.local`
# tries `…cluster.local.tail824179.ts.net` first, hits SERVFAIL,
# and the agent fatals on "Error checking if Loki is ready:
# context deadline exceeded". Setting ndots:1 forces literal
# resolution of the FQDN.
patches:
  - target:
      kind: Deployment
      name: crowdsec-agent
    patch: |
      - op: add
        path: /spec/template/spec/dnsConfig
        value:
          options:
            - name: ndots
              value: "1"
            - name: single-request
            - name: single-request-reopen
  - target:
      kind: Deployment
      name: crowdsec-lapi
    patch: |
      - op: add
        path: /spec/template/spec/dnsConfig
        value:
          options:
            - name: ndots
              value: "1"
            - name: single-request
            - name: single-request-reopen
