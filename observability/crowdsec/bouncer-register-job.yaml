# CrowdSec bouncer registration — post-install Job.
#
# The crowdsec chart 0.24.0 has no `lapi.bouncers[]` values key
# (audit 2026-06-04 #5). Bouncers are registered through cscli
# against the running LAPI; this Job does that for the
# cilium-bouncer (the cluster-side bouncer that the
# cidrgroup-sync-cronjob authenticates as when fetching new
# decisions to populate the CiliumCIDRGroup).
#
# Idempotent: `cscli bouncers list -o json` is consulted first;
# if `cilium-bouncer` is already registered the Job exits 0
# with no side effect. Safe to re-run on every Argo sync.
#
# Argo CD PostSync hook so the Job runs AFTER the chart's
# LAPI deployment is reconciled. The hook-delete-policy keeps
# the previous-run Job until the next sync starts, so failure
# logs are inspectable; on success the Job is GC'd by Argo.
#
# Bouncer API key source:
#   - ExternalSecret `crowdsec-cilium-bouncer` (see externalsecret.yaml)
#   - kv/data/crowdsec/bouncers field `cilium_bouncer_key`
#   - generated by `cscli bouncers add cilium-bouncer` on first
#     install — the key persists in LAPI Postgres so subsequent
#     re-registrations are no-ops, and the OpenBao value is the
#     same value LAPI verifies against.
#
# Chart-version assumption: LAPI Deployment is named
# `crowdsec-lapi` and labelled `k8s-app=crowdsec, type=lapi`,
# container `crowdsec-lapi` — verified against
# helm-charts crowdsec-0.24.0 lapi-deployment.yaml template.
# If the chart renames either, the wait/exec selectors below
# need updating in lockstep.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crowdsec-bouncer-register
  namespace: observability-crowdsec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crowdsec-bouncer-register
  namespace: observability-crowdsec
rules:
  # wait on the LAPI Deployment / its pods being ready
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # exec cscli inside the LAPI pod
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crowdsec-bouncer-register
  namespace: observability-crowdsec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crowdsec-bouncer-register
subjects:
  - kind: ServiceAccount
    name: crowdsec-bouncer-register
    namespace: observability-crowdsec
---
apiVersion: batch/v1
kind: Job
metadata:
  name: crowdsec-bouncer-register-cilium
  namespace: observability-crowdsec
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdsec-bouncer-register
        app.kubernetes.io/component: cilium-bouncer-registration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: crowdsec-bouncer-register
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: register
          # alpine/k8s carries kubectl + curl + jq in a single small
          # image; same family the sibling cidrgroup-sync CronJob uses
          # (cidrgroup-sync-cronjob.yaml). Tag matches the cluster's
          # Kubernetes minor (1.36). Renovate pins.
          #
          # History: previous bitnami/kubectl:1.36 ImagePullBackOff'd
          # after Bitnami sunset docker.io/bitnami/* in 2025; the
          # bitnamilegacy archive uses Bitnami's compound tag scheme
          # (e.g. 1.33.4-debian-12-r0), not bare upstream-k8s versions,
          # so it has no `:1.36` tag at all. alpine/k8s does.
          image: "alpine/k8s:1.36.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: BOUNCER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: crowdsec-cilium-bouncer
                  key: BOUNCER_API_KEY
            - name: BOUNCER_NAME
              value: cilium-bouncer
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              echo "Waiting up to 5m for LAPI deployment to be Available..."
              kubectl -n observability-crowdsec wait deployment/crowdsec-lapi \
                  --for=condition=Available --timeout=300s

              # Pick the first ready LAPI pod by label.
              POD="$(kubectl -n observability-crowdsec get pod \
                  -l k8s-app=crowdsec,type=lapi \
                  --field-selector=status.phase=Running \
                  -o jsonpath='{.items[0].metadata.name}')"
              if [ -z "${POD}" ]; then
                  echo "ERROR: no Running pod matched k8s-app=crowdsec,type=lapi" >&2
                  exit 1
              fi
              echo "LAPI pod: ${POD}"

              echo "Checking whether '${BOUNCER_NAME}' is already registered..."
              if kubectl -n observability-crowdsec exec "${POD}" -c crowdsec-lapi -- \
                      cscli bouncers list -o json 2>/dev/null \
                  | grep -Eq "\"name\"[[:space:]]*:[[:space:]]*\"${BOUNCER_NAME}\""; then
                  echo "OK: ${BOUNCER_NAME} already registered (no-op)."
                  exit 0
              fi

              echo "Registering ${BOUNCER_NAME} with provided key..."
              # cscli reads the key positionally via -k/--key; the
              # token never appears in argv beyond cscli itself.
              kubectl -n observability-crowdsec exec "${POD}" -c crowdsec-lapi -- \
                  cscli bouncers add "${BOUNCER_NAME}" -k "${BOUNCER_API_KEY}"
              echo "OK: ${BOUNCER_NAME} registered."
