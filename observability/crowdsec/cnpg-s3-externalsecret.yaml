# MinIO-on-NAS credentials for CNPG WAL+base backup of the
# CrowdSec LAPI Postgres cluster. Mirrors the per-app pattern
# at apps/llm-gateway/cnpg-s3-externalsecret.yaml.
#
# OpenBao path layout:
#   kv/data/cnpg/crowdsec/s3-creds:
#     access_key_id:     <minio app key, scoped to homelab-backups-cluster/cnpg/crowdsec>
#     secret_access_key: <minio app secret>

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crowdsec-cnpg-s3
  namespace: observability-crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: crowdsec-cnpg-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: cnpg/crowdsec/s3-creds
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: cnpg/crowdsec/s3-creds
        property: secret_access_key
