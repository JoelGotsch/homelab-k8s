# Single-replica ClickHouse instance backing Langfuse's OLAP
# trace-event analytics. Per ADR 0028.
#
# Operator: Altinity ClickHouse Operator at
# infrastructure/clickhouse-operator/. The CR here is what
# the operator reconciles into ClickHouse pods + Services.
#
# Sizing: single-replica + single-shard. Langfuse at homelab
# scale (~hundreds of MB of trace events; not the millions/sec
# Langfuse SaaS handles) doesn't need multi-shard or
# replication. Scale-trigger: if ClickHouse query latency
# becomes user-visible OR if storage approaches 100 GB,
# add a replica + Keeper.
#
# Storage: 50 GB longhorn-replica2 — generous for the
# expected workload but cheap insurance. ClickHouse
# compression on trace-event data is good (typically 5-10x).
#
# User credentials come from the langfuse-clickhouse-creds
# Secret (ESO-managed; OpenBao kv/langfuse/clickhouse).

apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: langfuse
  namespace: langfuse
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/instance: langfuse
    app.kubernetes.io/part-of: langfuse
spec:
  configuration:
    # Cap ClickHouse's self-telemetry (2026-07-30). With zero Langfuse
    # traces yet, 100% of the volume's data was CH's own system logs —
    # asynchronous_metric_log alone held 3.78 BILLION rows (it samples
    # every metric every second, unbounded by default), and their
    # constant part-merges were the ~2 GiB/day block churn behind the
    # backup-store growth that broke the tier-3 staging PVC. Disable
    # the samplers + text_log (a table copy of the server log that
    # already goes to the log volume) outright; keep query_log /
    # error_log / part_log at defaults — they are KiB-scale here and
    # query_log is the one worth having for debugging (Altinity KB).
    # A first attempt added <ttl> elements to the kept tables; CH 24.8
    # refuses ttl when the effective config specifies an engine for the
    # table ("TTL parameters should be specified directly inside
    # 'engine'") and crash-loops — defaults are fine at this scale.
    # NB: existing system.*_log tables are not auto-dropped on config
    # change — operator drops them once after rollout.
    files:
      config.d/system-logs-retention.xml: |
        <clickhouse>
          <asynchronous_metric_log remove="1"/>
          <metric_log remove="1"/>
          <trace_log remove="1"/>
          <processors_profile_log remove="1"/>
          <query_thread_log remove="1"/>
          <query_views_log remove="1"/>
          <text_log remove="1"/>
        </clickhouse>
    users:
      # User-password reference via the ESO-managed Secret.
      # Operator template-substitutes ${...} from the secret
      # value at reconcile time.
      langfuse/password_sha256_hex:
        valueFrom:
          secretKeyRef:
            name: langfuse-clickhouse-creds
            key: password_sha256_hex
      langfuse/networks/ip:
        - "::/0"   # Cluster-internal NetworkPolicy gates access
      langfuse/profile: default
      langfuse/quota: default
    clusters:
      - name: langfuse
        layout:
          shardsCount: 1
          replicasCount: 1
  defaults:
    templates:
      podTemplate: clickhouse-pod
      dataVolumeClaimTemplate: data-volume
      logVolumeClaimTemplate: log-volume
  templates:
    podTemplates:
      - name: clickhouse-pod
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:24.8.4.13   # OPERATOR PINS via Renovate
              resources:
                requests:
                  cpu: 250m
                  memory: 1Gi
                limits:
                  memory: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                # Cannot be readOnlyRootFilesystem: true here — ClickHouse
                # writes config + temporary files to the rootfs at startup.
                # Volume mounts cover /var/lib/clickhouse + /var/log/clickhouse.
    volumeClaimTemplates:
      # data-volume bumped 50Gi → 90Gi 2026-06-25: actual usage was
      # 56.71 GiB (over declared) — ClickHouse holds ~1.6 GiB of real
      # trace data; the rest is Longhorn snapshot delta accumulation
      # under the `default` recurring-job-group at retain=100. The
      # ClickHouseInstallation CR's volumeClaimTemplates labels do
      # not flow to Longhorn Volume CRs (same as CNPG; Kyverno
      # mutation at infrastructure/kyverno/policies/longhorn-volume-label-propagation.yaml
      # plus UI snapshot prune are the root-cause fix). Re ADR 0028 / #73.
      - name: data-volume
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: longhorn-replica2
          resources:
            requests:
              storage: 90Gi
      - name: log-volume
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: longhorn-replica2
          resources:
            requests:
              storage: 5Gi
