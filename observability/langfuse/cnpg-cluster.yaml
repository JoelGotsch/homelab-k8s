# CNPG Postgres cluster for Langfuse application data
# (projects, datasets, users, prompts, scores, traces metadata).
#
# Same shape as observability/crowdsec/cnpg-cluster.yaml +
# apps/llm-gateway/cnpg-cluster.yaml. Per ADR 0028.
#
# Service exposed: langfuse-pg-rw.langfuse.svc:5432.
# Langfuse helm values point at this DSN through the
# langfuse-postgres-creds Secret.

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: langfuse-pg
  namespace: langfuse
spec:
  instances: 2
  # CVE remediation 2026-07-13: pin patched postgres image
  # (was inheriting operator default 17.2 / Debian-11 base).
  # 17.6-bookworm = latest patched 17.x, Debian-12 base.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-bookworm

  # Propagate labels to CNPG-managed children. Picked up by
  # infrastructure/longhorn/recurring-jobs.yaml's
  # `secret-personal` group: hourly snapshots × 7d retain.
  # Langfuse is `personal`-class (LLM input/output text).
  inheritedMetadata:
    labels:
      recurring-job-group.longhorn.io/secret-personal: "enabled"

  # Bumped 10Gi → 20Gi 2026-06-25: actual usage was 10.56 GiB on pg-2
  # (already over declared) due to Longhorn snapshot delta accumulation
  # under the `default` recurring-job-group at retain=100. CNPG's
  # inheritedMetadata.labels does NOT propagate to Longhorn Volume
  # CRs, so the secret-personal selector silently fell through to
  # default. Kyverno mutation
  # (infrastructure/kyverno/policies/longhorn-volume-label-propagation.yaml)
  # plus a Longhorn-UI snapshot prune are the root-cause fix; this
  # bump is the headroom needed while that lands. Re ADR 0016 / #73.
  storage:
    size: 20Gi
    storageClass: longhorn-replica3

  monitoring:
    enablePodMonitor: true

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"

  bootstrap:
    initdb:
      database: langfuse
      owner: langfuse

  # Backup: WAL+base to MinIO-on-NAS. Restic CronJob mirrors
  # to tier-2/3 per ADR 0006. Langfuse traces are personal-class
  # data per ADR 0003 (LLM input/output text); backup-encrypt
  # via barmanObjectStore + restic-tier-3 password.
  # Backup: WAL+base to MinIO-on-NAS via the Barman Cloud plugin;
  # target, credentials and retention live in objectstore.yaml.
  # Restic mirrors the bucket to tier-2/3 per ADR 0006.
  #
  # Migrated off the in-core `spec.backup.barmanObjectStore` on
  # 2026-08-15: CloudNativePG removes that field in 1.31.0. The two
  # forms cannot coexist — the Cluster CRD refuses
  # `isWALArchiver: true` while a barmanObjectStore block is present —
  # so this is one atomic edit, not a staged cutover.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: langfuse-pg-backups
