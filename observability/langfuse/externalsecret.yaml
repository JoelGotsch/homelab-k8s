# OpenBao paths backing Langfuse's secrets.
#
# Three ExternalSecrets:
# 1. langfuse-clickhouse-creds — ClickHouse user password
#    (referenced by the ClickHouseInstallation CR + Langfuse
#    helm values)
# 2. langfuse-postgres-creds — Postgres connection details
#    (Langfuse points at the CNPG-managed cluster)
# 3. langfuse-app-secrets — Langfuse-internal secrets
#    (NEXTAUTH_SECRET, SALT, ENCRYPTION_KEY, S3 creds for
#    blob storage, etc.)
# 4. langfuse-cnpg-s3 — MinIO creds for CNPG WAL+base backup
#    (separate path, mirrors apps/llm-gateway pattern)
#
# OpenBao path layout:
#   kv/data/langfuse/clickhouse:
#     password:                <plaintext password>
#     password_sha256_hex:      <SHA-256 hex digest of password,
#                                consumed by ClickHouseInstallation>
#   kv/data/langfuse/postgres:
#     password:                <CNPG-issued; copied at first install>
#   kv/data/langfuse/app:
#     nextauth_secret:         32+ random bytes (openssl rand -base64 32)
#     salt:                    32+ random bytes
#     encryption_key:          64-char hex (openssl rand -hex 32)
#     telemetry_enabled:       "false"  (per principle #2: no anonymous telemetry)
#   kv/data/langfuse/s3:
#     access_key_id:           MinIO svc-account scoped to langfuse-blobs
#     secret_access_key:       <minio app secret>
#   kv/data/cnpg/langfuse/s3-creds:
#     access_key_id:           MinIO svc-account scoped to homelab-backups-cluster/cnpg/langfuse
#     secret_access_key:       <minio app secret>

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-clickhouse-creds
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: langfuse-clickhouse-creds
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: langfuse/clickhouse
        property: password
    - secretKey: password_sha256_hex
      remoteRef:
        key: langfuse/clickhouse
        property: password_sha256_hex
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-app-secrets
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: langfuse-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: langfuse/app
        property: nextauth_secret
    - secretKey: SALT
      remoteRef:
        key: langfuse/app
        property: salt
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: langfuse/app
        property: encryption_key
    - secretKey: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
      remoteRef:
        key: langfuse/s3
        property: access_key_id
    - secretKey: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
      remoteRef:
        key: langfuse/s3
        property: secret_access_key
    - secretKey: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
      remoteRef:
        key: langfuse/s3
        property: access_key_id
    - secretKey: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
      remoteRef:
        key: langfuse/s3
        property: secret_access_key
    - secretKey: TELEMETRY_ENABLED
      remoteRef:
        key: langfuse/app
        property: telemetry_enabled
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-cnpg-s3
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: langfuse-cnpg-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: cnpg/langfuse/s3-creds
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: cnpg/langfuse/s3-creds
        property: secret_access_key
