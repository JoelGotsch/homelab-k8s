# NetworkPolicies for the Langfuse layer.
#
# Three pod groups:
# 1. langfuse-web + langfuse-worker — application
# 2. langfuse-pg-* — CNPG Postgres pods
# 3. chi-langfuse-langfuse-* — Altinity-managed ClickHouse pods
# 4. langfuse-redis-* — chart-managed Redis
#
# Plus inbound from OTel Collector gateway (OTLP receiver) +
# Cilium Gateway (HTTPRoute, when ingress lands).

# === Langfuse web + worker ===
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: langfuse-app
  namespace: langfuse
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [web, worker]
  policyTypes: [Ingress, Egress]
  ingress:
    # OTel Collector gateway pushes OTLP to Langfuse's
    # /api/public/otel endpoint on the web pod.
    #
    # The selector is `instance`, not `component`. The
    # opentelemetry-collector chart does not set
    # `app.kubernetes.io/component` at all — its pods carry the
    # unprefixed `component: standalone-collector` (gateway) and
    # `component: agent-collector` (DaemonSet). The original
    # `app.kubernetes.io/component: gateway` matched no pod, so
    # every collector→Langfuse export was silently dropped and
    # surfaced only as `context deadline exceeded` on the exporter.
    # Nothing noticed for 92 days because no workload emitted a
    # span. `instance` is the Helm release name, so this keeps the
    # rule gateway-only (the DaemonSet's instance is
    # `opentelemetry-collector-agent`) and survives chart bumps.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
              app.kubernetes.io/instance: opentelemetry-collector-gateway
      ports:
        - port: 3000
          protocol: TCP
    # Cilium Gateway HTTPRoute (operator-side ingress; lands
    # when langfuse.lab.vyramo.com HTTPRoute is
    # wired). Permits any pod with the gateway-class label.
    # Operator-narrows when Gateway API ingress is concrete.
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: cilium
      ports:
        - port: 3000
          protocol: TCP
    # Prometheus self-metrics scrape.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 3000
          protocol: TCP
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # CNPG Postgres in same ns.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: langfuse-pg
      ports:
        - port: 5432
          protocol: TCP
    # ClickHouse in same ns (Altinity-managed).
    - to:
        - podSelector:
            matchLabels:
              clickhouse.altinity.com/chi: langfuse
      ports:
        - port: 8123
          protocol: TCP   # HTTP interface
        - port: 9000
          protocol: TCP   # Native interface
    # Redis in same ns.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
          protocol: TCP
    # MinIO blob storage (langfuse-blobs bucket).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio-on-nas
      ports:
        - port: 9000
          protocol: TCP
---
# === ClickHouse ingress allow-list ===
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: langfuse-clickhouse
  namespace: langfuse
spec:
  podSelector:
    matchLabels:
      clickhouse.altinity.com/chi: langfuse
  policyTypes: [Ingress, Egress]
  ingress:
    # Langfuse web + worker.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [web, worker]
      ports:
        - port: 8123
          protocol: TCP
        - port: 9000
          protocol: TCP
    # One-shot CREATE DATABASE bootstrap Job
    # (clickhouse-createdb-job.yaml) — ensures the `langfuse`
    # database exists before web/worker run schema migrations.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: clickhouse-init
      ports:
        - port: 8123
          protocol: TCP
        - port: 9000
          protocol: TCP
    # Altinity operator + metrics-exporter for management +
    # metrics scrape.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: clickhouse-operator
      ports:
        - port: 8123
          protocol: TCP
        - port: 9000
          protocol: TCP
        - port: 9363
          protocol: TCP   # ClickHouse self-metrics
    # Prometheus scrape (via metrics-exporter sidecar in
    # ClickHouse pod, exposed by Altinity).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9363
          protocol: TCP
  egress:
    # kube-DNS + S3 (ClickHouse may push backups directly,
    # though our backup story is CNPG-side; conservative
    # allow).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Cilium Gateway → langfuse-web (HTTPRoute traffic).
#
# Implemented as CiliumNetworkPolicy because Cilium Gateway API traffic carries
# the reserved `ingress` identity, NOT the source namespace. A vanilla NetPol
# `namespaceSelector: kubernetes.io/metadata.name=ingress` does NOT match (the
# gateway is the Envoy, a reserved entity). The langfuse-app vanilla NetPol
# above continues to cover OTel/Prometheus/Cilium ingress; K8s+Cilium policies
# are additive within the same direction, so this CNP just ADDS the gateway
# rule without touching the existing ones. Added 2026-05-31 (gateway 404 — no
# HTTPRoute or rule existed; route also created alongside).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: langfuse-gateway-ingress
  namespace: langfuse
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: web
      app.kubernetes.io/name: langfuse
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"   # langfuse-web container port (Service port 3000
              protocol: TCP   # → targetPort 3000 — no DNAT delta here)
---
# CNPG DB-pod lockdown (netpol-audit.md MEDIUM-2). DRAFT — do NOT merge-and-
# apply blind. Until now the langfuse-pg instances ran Cilium DEFAULT-ALLOW
# (nothing selected `cnpg.io/cluster`), so the DB had unrestricted ingress
# AND egress incl. the internet — the latent llm-gateway trap: the day this
# ns gains a namespace-wide egress default-deny without the CNPG egress set,
# the DB stalls 1/2 (`dial tcp 10.96.0.1:443: i/o timeout`). This CNP selects
# ONLY the DB pods for BOTH directions, which flips just those pods to
# least-privilege (default-deny + the explicit CNPG quad) while leaving every
# app pod untouched — no namespace-wide default-deny is introduced here.
#
# ROLLOUT IS OPERATOR-ATTENDED via Cilium PolicyAuditMode + Hubble (rule 14 /
# 35). Enable `cilium endpoint config <db-ep-id> PolicyAuditMode=Enabled` on
# the langfuse-pg endpoints, apply this policy (evaluated-not-enforced), watch
# `hubble observe --namespace langfuse --verdict AUDIT` across a full reconcile
# (operator probe, metrics scrape, replication, WAL archive to MinIO,
# apiserver reads), confirm ZERO unexpected AUDIT verdicts, then disable audit
# to enforce. A missed egress rule wedges the DB silently. Template:
# platform/openbao/networkpolicy.yaml (openbao-server CNP) — same audit-mode-
# first method that locked the vault down with zero DROPPED.
#
# The quad (netpol-best-practices.md checklist E + CLAUDE.md rules 12/14/15):
#   ingress  cnpg-system  -> 8000 (instance manager/status) + 9187 (metrics)
#   ingress  monitoring   -> 9187 (Prometheus scrape)
#   ingress  in-ns client -> 5432 (Postgres) + peer 5432 (replication)
#   ingress  peer         -> 8000 (instance-manager coordination, added 2026-07-17)
#   egress   kube-apiserver 443 AND 6443 (socket-LB pre-translation, rule 12)
#   egress   kube-dns 53 UDP+TCP
#   egress   minio-on-nas 9000 (barman WAL/base-backup archiving)
#   egress   peer cnpg.io/cluster 5432 (replication) + 8000 (instance-mgr coord)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: langfuse-pg-cnpg
  namespace: langfuse
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: langfuse-pg
  ingress:
    # CNPG operator (cnpg-system) — instance-manager status :8000 + metrics.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "9187"
              protocol: TCP
    # Prometheus scrape of the CNPG metrics exporter.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
    # In-namespace clients + streaming replication between instances —
    # both hit pod port 5432.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: langfuse
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Peer instance-manager coordination — CNPG instances query each other's
    # status API on :8000 (instance->instance, distinct from the operator's
    # cnpg-system->instance :8000 rule above). Caught in the audit-mode rollout
    # (2026-07-17): under enforcement this peer flow drops, breaking cluster
    # status/coordination. Scoped to peers (cnpg.io/cluster) so in-namespace
    # app pods still cannot reach the instance manager.
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: langfuse-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    # kube-apiserver — instance manager reads its Cluster CR. Reserved
    # entity; BOTH 443 and 6443 (socket-LB DNATs ClusterIP:443 -> :6443
    # before policy eval — CLAUDE.md rule 12).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # kube-dns.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # MinIO (minio-on-nas) — barman WAL + base-backup archiving.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: minio-on-nas
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # Peer instance (the other langfuse-pg pod): streaming replication on 5432
    # + instance-manager coordination on 8000 (see the peer :8000 ingress note).
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: langfuse-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
