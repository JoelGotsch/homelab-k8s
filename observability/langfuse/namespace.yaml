# Dedicated namespace for Langfuse + its ClickHouse + CNPG +
# Redis dependencies.
#
# PSA: baseline. Web/worker run as non-root; ClickHouse via
# the Altinity operator runs non-root by default.
apiVersion: v1
kind: Namespace
metadata:
  name: langfuse
  annotations:
    # Opts out of the cluster-wide 16Gi `default-quota` that
    # `homelab-generate-default-resourcequota` generates. langfuse is also on that
    # policy's hardcoded exclusion list today, so this is belt-and-braces — but that
    # list is exactly what we want to be able to shrink, and 16Gi would not merely be
    # tight here: the rollout peak is 16,832Mi, so a generated default would refuse
    # the surge pod of any web or worker rollout while reporting the Deployment as
    # progressing.
    bypass.homelab.internal/homelab-generate-default-resourcequota:
      "Sized in kustomization.yaml: 13,632Mi of declared ceilings plus a 3,200Mi
      rollout surge exceeds the 16Gi default."
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # ADR 0036 D4 — LLM observability/traces. Reclassified
    # `internal` → `personal` on 2026-07-16 (operator): even
    # post-Presidio, trace prompt/completion content is private
    # (Presidio masks PII, not business-sensitive content), so it
    # warrants personal-class backup + handling. Was `internal`
    # on the "post-guardrail traces" rationale.
    homelab.internal/first-party: "true"
    homelab.internal/data-class: personal
