# Dedicated namespace for Langfuse + its ClickHouse + CNPG +
# Redis dependencies.
#
# PSA: baseline. Web/worker run as non-root; ClickHouse via
# the Altinity operator runs non-root by default.
apiVersion: v1
kind: Namespace
metadata:
  name: langfuse
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # ADR 0036 D4 — LLM observability/traces. Reclassified
    # `internal` → `personal` on 2026-07-16 (operator): even
    # post-Presidio, trace prompt/completion content is private
    # (Presidio masks PII, not business-sensitive content), so it
    # warrants personal-class backup + handling. Was `internal`
    # on the "post-guardrail traces" rationale.
    homelab.internal/first-party: "true"
    homelab.internal/data-class: personal
