# Cluster overview — single-page dashboard. Uses stock
# kube-state-metrics + node-exporter + cilium + Argo CD
# metrics; nothing app-specific.
#
# Panels (10):
#   1. Ready node count (stat)
#   2. Node Ready condition table (per-node green/red)
#   3. CPU usage cluster-wide (timeseries, % of allocatable)
#   4. Memory usage cluster-wide (timeseries, % of allocatable)
#   5. Pod count by namespace, top 10 (bar gauge)
#   6. PVC fill % top 10 (bar gauge)
#   7. Cilium agent up per node (stat / table)
#   8. Argo CD app sync OutOfSync count (stat)
#   9. Argo CD app health Degraded count (stat)
#   10. Pods not Running by namespace (table)
#
# All queries use chart-default scrape jobs:
#   kube-state-metrics       → kube_*_*
#   node-exporter            → node_*
#   cilium ServiceMonitor    → cilium_*  (chart-shipped via cilium values)
#   argocd-metrics           → argocd_app_info
#
# Dashboard uid is stable so re-imports don't fork. Refresh 30s
# default. Time range last 1h.

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cluster-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana-dashboards
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: observability
  annotations:
    grafana_folder: "Homelab"
data:
  cluster-overview.json: |
    {
      "uid": "homelab-cluster-overview",
      "title": "Homelab — Cluster overview",
      "tags": ["homelab", "cluster"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Ready nodes",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "green", "value": 3 }
                ]
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Total pods",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{phase=\"Running\"})"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Argo apps OutOfSync",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(argocd_app_info{sync_status!=\"Synced\"})"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Argo apps Degraded",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(argocd_app_info{health_status=\"Degraded\"})"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Cilium agents up",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "green", "value": 3 }
                ]
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(up{job=~\".*cilium.*\"})"
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Pods not Running",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"})"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU usage cluster-wide (% of allocatable)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": { "drawStyle": "line", "fillOpacity": 20, "lineWidth": 1 }
            }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "used %",
              "expr": "100 * sum(rate(node_cpu_seconds_total{mode!=\"idle\"}[5m])) / sum(machine_cpu_cores)"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Memory usage cluster-wide (% of allocatable)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": { "drawStyle": "line", "fillOpacity": 20, "lineWidth": 1 }
            }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "used %",
              "expr": "100 * (1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes))"
            }
          ]
        },
        {
          "id": 9,
          "type": "bargauge",
          "title": "Pods by namespace (top 10)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{namespace}}",
              "expr": "topk(10, sum by (namespace) (kube_pod_info))"
            }
          ]
        },
        {
          "id": 10,
          "type": "bargauge",
          "title": "PVC fill % (top 10)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 85 }
                ]
              }
            }
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}",
              "expr": "topk(10, 100 * (1 - kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes))"
            }
          ]
        },
        {
          "id": 11,
          "type": "table",
          "title": "Node Ready condition",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "options": { "showHeader": true },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "custom": { "displayMode": "color-background" }
            }
          },
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "format": "table",
              "expr": "max by (node, condition) (kube_node_status_condition{condition=\"Ready\",status=\"true\"})"
            }
          ]
        },
        {
          "id": 12,
          "type": "table",
          "title": "Pods not Running by namespace",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "options": { "showHeader": true },
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "format": "table",
              "expr": "sum by (namespace, phase) (kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"} > 0)"
            }
          ]
        }
      ],
      "templating": { "list": [] },
      "annotations": { "list": [] }
    }
