# Additional Prometheus scrape configs for the Mac Studio
# inference host (ADR 0005 + ADR 0026).
#
# Wired into the Prometheus CR via:
#   spec.additionalScrapeConfigs:
#     name: prometheus-additional-scrape-configs
#     key: prometheus-additional.yaml
#
# IP filled 2026-07-18 from the homelab-infra inventory (the
# mac_inference host's host_ip on the inference VLAN). Update here
# if the Mac Studio's address ever changes.

apiVersion: v1
kind: Secret
metadata:
  name: prometheus-additional-scrape-configs
  namespace: monitoring
  annotations:
    # Not a credential: static scrape config (internal IPs only).
    # Secret KIND is forced by the Prometheus CR's
    # additionalScrapeConfigs contract, which only accepts a
    # Secret ref. Reviewed 2026-07-18.
    bypass.homelab.internal/homelab-disallow-inline-secrets: >-
      non-secret scrape config; Prometheus CR requires Secret kind
type: Opaque
stringData:
  prometheus-additional.yaml: |
    - job_name: mac-studio-node
      scrape_interval: 30s
      scrape_timeout: 10s
      metrics_path: /metrics
      static_configs:
        - targets:
            - 10.10.50.10:9100
          labels:
            host: mac-studio
            role: inference
            tier: external

    - job_name: mac-studio-mlx
      scrape_interval: 30s
      scrape_timeout: 10s
      metrics_path: /metrics
      static_configs:
        - targets:
            - 10.10.50.10:9101
          labels:
            host: mac-studio
            role: inference
            tier: external
