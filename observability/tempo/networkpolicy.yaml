# Tempo NetworkPolicy.
#
# Ingress: OTel Collector gateway (OTLP push) + Grafana (data
#   source queries) + Prometheus (self-metrics scrape).
# Egress: kube-DNS + MinIO (chunk storage).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-allow
  namespace: observability-tempo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
  policyTypes: [Ingress, Egress]
  ingress:
    # OTel Collector gateway (lives in `monitoring` per
    # kube-prometheus-stack — cross-ns now that tempo moved
    # to observability-tempo).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              # `instance`, not `component`: the opentelemetry-collector
              # chart never sets a component label, so this rule admitted
              # no pod and every span export to Tempo timed out at the
              # TCP level. Found 2026-09-01 by the first span this
              # pipeline ever carried.
              app.kubernetes.io/name: opentelemetry-collector
              app.kubernetes.io/instance: opentelemetry-collector-gateway
      ports:
        - port: 4317   # OTLP gRPC
          protocol: TCP
        - port: 4318   # OTLP HTTP
          protocol: TCP
    # Grafana (data source queries) — lives in `monitoring`.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        # 3200 since chart 1.24.4 (2026-09-09): the chart's
        # `tempo.server.http_listen_port` default moved from 3100 to
        # Tempo's canonical 3200, and the Service port named
        # `tempo-prom-metrics` moved with it. It serves the query API —
        # /api/traces and /api/search both answer there. Under chart
        # 1.10.1 this was 3100 and the datasource in
        # kube-prometheus-stack/values.yaml said 3200, so the read path
        # was broken at both ends and reported "no data" rather than a
        # connection error (corrected 2026-09-01). The three places that
        # name this port — here, the Grafana egress rule in
        # kube-prometheus-stack/networkpolicy.yaml and the datasource
        # URL — move together.
        - port: 3200   # Tempo HTTP query API
          protocol: TCP
    # Prometheus (self-metrics scrape) — lives in `monitoring`.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 3200   # same port; Tempo's self-metrics are on it too
          protocol: TCP
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # MinIO chunk storage (tempo-blocks bucket).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio-on-nas
      ports:
        - port: 9000
          protocol: TCP
