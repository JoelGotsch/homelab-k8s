# Tempo NetworkPolicy.
#
# Ingress: OTel Collector gateway (OTLP push) + Grafana (data
#   source queries) + Prometheus (self-metrics scrape).
# Egress: kube-DNS + MinIO (chunk storage).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-allow
  namespace: observability-tempo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
  policyTypes: [Ingress, Egress]
  ingress:
    # OTel Collector gateway (lives in `monitoring` per
    # kube-prometheus-stack — cross-ns now that tempo moved
    # to observability-tempo).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              # `instance`, not `component`: the opentelemetry-collector
              # chart never sets a component label, so this rule admitted
              # no pod and every span export to Tempo timed out at the
              # TCP level. Found 2026-09-01 by the first span this
              # pipeline ever carried.
              app.kubernetes.io/name: opentelemetry-collector
              app.kubernetes.io/instance: opentelemetry-collector-gateway
      ports:
        - port: 4317   # OTLP gRPC
          protocol: TCP
        - port: 4318   # OTLP HTTP
          protocol: TCP
    # Grafana (data source queries) — lives in `monitoring`.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        # 3100, not 3200. The chart's Service exposes 3100 (named
        # `tempo-prom-metrics`) and it serves the query API — /api/traces
        # and /api/search both answer there — while 3200 is not in the
        # Service at all. Grafana's datasource named 3200 too, so the
        # read path was broken at both ends and reported "no data"
        # rather than a connection error. Corrected 2026-09-01, the
        # first time anyone tried to read a trace.
        - port: 3100   # Tempo HTTP query API
          protocol: TCP
    # Prometheus (self-metrics scrape) — lives in `monitoring`.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 3100   # same port; Tempo's self-metrics are on it too
          protocol: TCP
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # MinIO chunk storage (tempo-blocks bucket).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio-on-nas
      ports:
        - port: 9000
          protocol: TCP
