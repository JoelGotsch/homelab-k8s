# Tempo monolithic-mode values. Per ADR 0021 D3 + D8.
#
# Storage: MinIO `tempo-blocks` bucket (pre-created by
# infrastructure/minio-on-nas/). 14d hot retention on local
# disk + 30d warm in MinIO per ADR 0021 D8 retention table.
#
# Same shape as observability/loki/ — monolithic chart for
# the small-cluster pattern; auth disabled (single-tenant
# cluster, NetworkPolicy gates ingress); cluster-internal
# HTTP only.

# Monolithic deployment — keeps complexity bounded at homelab
# scale; chart-default 1 replica with optional HA via
# replication_factor + memberlist later.
tempo:
  # S3 creds for the storage block's ${ACCESS_KEY_ID}/${SECRET_ACCESS_KEY}
  # substitution. MUST be tempo.extraEnv — a top-level extraEnv: is silently
  # ignored by the grafana/tempo chart (was the bug: empty key → minio
  # "Access Key Id does not exist"). Fixed 2026-05-27.
  extraEnv:
    - name: ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: tempo-s3-creds
          key: ACCESS_KEY_ID
    - name: SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: tempo-s3-creds
          key: SECRET_ACCESS_KEY
  # Tempo lives in /var/tempo when monolithic; PVC backs it.
  # Otherwise the chart writes to emptyDir which is pod-life
  # only. Operator-fillable storageClass per the homelab.
  storage:
    trace:
      backend: s3
      s3:
        bucket: tempo-blocks
        endpoint: minio.minio-on-nas.svc.cluster.local:9000
        access_key: ${ACCESS_KEY_ID}
        secret_key: ${SECRET_ACCESS_KEY}
        insecure: true              # cluster-internal HTTP
        forcepathstyle: true        # MinIO requires path-style
      # WAL on local disk (PVC); chunks shipped to MinIO.
      wal:
        path: /var/tempo/wal
      local:
        path: /var/tempo/blocks

  # Auth — disabled within cluster per the same logic as
  # observability/loki/ (single-tenant; NetworkPolicy gates).
  multitenancy_enabled: false

  # Receivers — what the OTel Collector emits TO Tempo.
  # Tempo accepts OTLP (gRPC + HTTP) directly; no Jaeger /
  # Zipkin compat needed at this scale.
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  # Retention — 14d local hot per ADR 0021 D8; warm tier is
  # MinIO's own retention (30d), tunable in MinIO lifecycle
  # rules (operator-side, not configured at chart-install).
  compactor:
    compaction:
      block_retention: 336h           # 14 days

  # Limits per the hot-tier budget; tune at first install.
  ingester:
    max_block_duration: 5m
  query_frontend:
    search:
      max_duration: 0s                # unlimited query window

# PVC for WAL — Longhorn replica2 matches Loki's pattern.
# Chunks live in MinIO; this is just the WAL window.
persistence:
  enabled: true
  size: 10Gi
  storageClass: longhorn-replica2

# Resource limits — modest for the 6-worker cluster.
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi

# Self-metrics scrape via the kube-prometheus-stack release.
# Chart's bundled ServiceMonitor uses a different label
# selector; we ship our own with the right `release` label
# at servicemonitor.yaml.
serviceMonitor:
  enabled: false

# (S3 cred env moved under tempo.extraEnv above — the chart ignores a
# top-level extraEnv:, which left ${ACCESS_KEY_ID} empty.)

# Container security posture matches the rest of observability/.
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
