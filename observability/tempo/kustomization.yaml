# Tempo — distributed tracing per ADR 0021 D3.
#
# Receives OTLP from observability/otel-collector/ (gateway
# Deployment); chunks live in MinIO `tempo-blocks` bucket;
# Grafana queries via the data source wired in
# kube-prometheus-stack/values.yaml `additionalDataSources`.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability-tempo

helmCharts:
  - name: tempo
    repo: https://grafana.github.io/helm-charts
    version: "1.10.1"  # OPERATOR PINS via Renovate
    releaseName: tempo
    namespace: observability-tempo
    valuesFile: values.yaml
    includeCRDs: false

resources:
  - externalsecret.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
