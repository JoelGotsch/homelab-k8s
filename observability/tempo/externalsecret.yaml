# MinIO credentials for Tempo's `tempo-blocks` bucket access.
# Mirrors the per-app pattern at observability/loki/externalsecret.yaml.
#
# OpenBao path layout:
#   kv/data/tempo/s3-creds:
#     access_key_id:     <minio app key, scoped to tempo-blocks>
#     secret_access_key: <minio app secret>
#
# Operator provisions the MinIO svc-account at first install
# per cold-start.md Step 13c.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tempo-s3-creds
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: tempo-s3-creds
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: tempo/s3-creds
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: tempo/s3-creds
        property: secret_access_key
