# Loki monolithic-mode values. Per ADR 0021 D6 + D8.
#
# Chunks land in MinIO `loki-chunks` bucket (pre-created by
# infrastructure/minio-on-nas/). 90d default retention; per-
# stream retention overrides possible per the upstream
# limits_config.retention_stream pattern (not configured at
# first install; add when a specific stream needs 1y per
# ADR 0021 D8).

# Deployment mode — SingleBinary keeps complexity bounded.
deploymentMode: SingleBinary

# Auth disabled within cluster — single-tenant homelab.
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1  # SingleBinary; would be 3 in distributed
  schemaConfig:
    configs:
      - from: "2026-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  # MinIO backend — chunk storage + ruler config + admin
  # client all use the same bucket via the s3 backend.
  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-chunks
      admin: loki-chunks
    s3:
      endpoint: minio.minio-on-nas.svc.cluster.local:9000
      region: homelab  # arbitrary region label; MinIO accepts anything
      accessKeyId: ${LOKI_S3_ACCESS_KEY_ID}
      secretAccessKey: ${LOKI_S3_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: true  # cluster-internal HTTP — TLS terminates at the relay/gateway boundary, not internal mesh
      http_config:
        idle_conn_timeout: 90s

  limits_config:
    retention_period: 2160h  # 90 days default
    # Per-stream retention overrides for security-forensic
    # streams per ADR 0021 D8 (forensic discovery window
    # spans weeks-to-months for supply-chain compromises).
    # Higher priority wins on overlap; selector is LogQL-shaped.
    retention_stream:
      # Falco runtime-security events — Falcosidekick ships
      # these to Loki via its `loki:` output (per
      # observability/falco-stack/values.yaml).
      - selector: '{job="falcosidekick"}'
        priority: 1
        period: 8760h  # 1y
      # Hubble network flows — security-forensic per ADR 0021
      # D5 ("primary exfiltration signal"). Shipped by the
      # hubble-flow-exporter Vector sidecar in cilium-agent
      # (label `job=hubble` per observability/hubble-flow-
      # exporter/configmap.yaml loki sink labels).
      - selector: '{job="hubble"}'
        priority: 1
        period: 8760h
      # K8s audit-log via journald (Talos audit path) — Alloy's
      # journald source labels these with `unit=kube-apiserver-
      # audit` per ADR 0021 D6. Wildcard match catches related
      # audit units (e.g., kube-controller-manager-audit if
      # Talos audit-log routing widens later).
      - selector: '{unit=~".*audit.*"}'
        priority: 1
        period: 8760h
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    max_query_series: 5000
    max_query_parallelism: 32

  # Compactor config — runs the retention deletes against the
  # S3 backend. Keep enabled; default schedule is fine.
  compactor:
    retention_enabled: true
    delete_request_store: s3

  ruler:
    enable_api: true
    storage:
      type: s3
      s3:
        bucketnames: loki-chunks

# SingleBinary topology — one StatefulSet, no read/write/backend split.
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
    storageClass: longhorn-replica2
  # Pull S3 creds from the ESO-projected Secret as env vars.
  extraEnvFrom:
    - secretRef:
        name: loki-s3-creds
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi

# Disable the read/write/backend pods — SingleBinary mode.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Disable the chunks-cache + results-cache — overkill for
# homelab volume + adds memcached pods.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Disable the gateway nginx-shim — the SingleBinary is its
# own HTTP endpoint at :3100. Saves a pod.
gateway:
  enabled: false

# Self-metrics scrape — ServiceMonitor lives in
# servicemonitor.yaml.
serviceMonitor:
  enabled: false  # we ship our own with the chart-default-selector label

# Test pod (chart's smoke-test) — disable; we have no chart-
# managed namespace for it.
test:
  enabled: false
lokiCanary:
  enabled: false
