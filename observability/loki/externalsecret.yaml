# MinIO S3 service-account credentials for Loki.
# Provisioned post-MinIO-Healthy via `mc admin user svcacct add`
# scoped read+write to the `loki-chunks` bucket — pattern
# documented in
# infrastructure/minio-on-nas/README.md §Per-app credentials.
#
# OpenBao path:
#   kv/data/loki/s3-creds:
#     access_key_id:     <minio svc-account access key>
#     secret_access_key: <minio svc-account secret>

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: loki-s3-creds
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: loki-s3-creds
    creationPolicy: Owner
  data:
    - secretKey: LOKI_S3_ACCESS_KEY_ID
      remoteRef:
        key: loki/s3-creds
        property: access_key_id
    - secretKey: LOKI_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: loki/s3-creds
        property: secret_access_key
