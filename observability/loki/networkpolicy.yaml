# Loki NetworkPolicy.
#
# Ingress: Alloy (log shipper push), Falcosidekick (Loki
# output), Grafana (data source), Prometheus (self-metrics
# scrape via the chart-default-selector ServiceMonitor).
#
# Egress: kube-DNS + MinIO (chunk storage at
# infrastructure/minio-on-nas/), plus a sibling
# CiliumNetworkPolicy for kube-apiserver (bottom of file) —
# the chart's loki-sc-rules sidecar list/watches loki_rule-
# labeled ConfigMaps/Secrets through the API.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-allow
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes: [Ingress, Egress]
  ingress:
    # Alloy DaemonSet (cross-ns log push — alloy lives in
    # observability-alloy per ADR 0036, not monitoring).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-alloy
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - port: 3100
          protocol: TCP
    # Falcosidekick (same ns, Loki output).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: falcosidekick
      ports:
        - port: 3100
          protocol: TCP
    # Grafana (same ns, data source queries).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 3100
          protocol: TCP
    # Prometheus (same ns, self-metrics scrape).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 3100
          protocol: TCP
    # CrowdSec agent (cross-ns, Loki-API acquisition per ADR 0021 D6
    # decision E — agent reads cilium-gateway envoy access logs from
    # Loki and runs scenarios). NetworkPolicy is cross-ns, so we
    # match on the observability-crowdsec namespace label rather than
    # a pod selector.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-crowdsec
          podSelector:
            matchLabels:
              k8s-app: crowdsec
              type: agent
      ports:
        - port: 3100
          protocol: TCP
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # MinIO chunk storage.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio-on-nas
      ports:
        - port: 9000
          protocol: TCP
---
# kube-apiserver egress for the loki-sc-rules sidecar.
#
# The grafana/loki chart runs a k8s-sidecar container in loki-0
# that list/watches loki_rule-labeled ConfigMaps/Secrets via the
# API server. Plain NetworkPolicy can't match that non-pod
# target, so — same pattern as prometheus-apiserver above it in
# this namespace and the openbao-seal-watchdog egress fix
# (commit 8494b91) — a sibling CNP grants the reserved
# kube-apiserver entity, scoped to the loki pods only.
#
# Found 2026-07-21 (worker1 hot-pull follow-up): every sidecar
# API call timed out against 10.96.0.1:443, so the container
# retried ~14 min, exited 1, and restarted — 89 restarts in 22h
# on loki-0 while Loki itself ran fine. This had been mislabeled
# as "Loki instability."
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki-apiserver
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  egress:
    - toEntities:
        - kube-apiserver
