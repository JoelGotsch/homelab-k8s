# Loki NetworkPolicy.
#
# Ingress: Alloy (log shipper push), Falcosidekick (Loki
# output), Grafana (data source), Prometheus (self-metrics
# scrape via the chart-default-selector ServiceMonitor).
#
# Egress: kube-DNS + MinIO (chunk storage at
# infrastructure/minio-on-nas/).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-allow
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes: [Ingress, Egress]
  ingress:
    # Alloy DaemonSet (same ns, log push).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - port: 3100
          protocol: TCP
    # Falcosidekick (same ns, Loki output).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: falcosidekick
      ports:
        - port: 3100
          protocol: TCP
    # Grafana (same ns, data source queries).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 3100
          protocol: TCP
    # Prometheus (same ns, self-metrics scrape).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 3100
          protocol: TCP
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # MinIO chunk storage.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio
      ports:
        - port: 9000
          protocol: TCP
