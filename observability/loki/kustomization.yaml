# Loki — log aggregation per ADR 0021 D6 + D8.
#
# Monolithic mode (single binary, single replica) — homelab
# log volume doesn't justify the simple-scalable / distributed
# topologies. Chunks land in MinIO at the `loki-chunks` bucket
# (already pre-created by infrastructure/minio-on-nas/).

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: loki
    # ADR 0052 D3: chart from the Forgejo Packages mirror (was https://grafana.github.io/helm-charts).
    repo: oci://registry.homelab.internal/homelab
    version: "6.55.0"  # OPERATOR PINS via Renovate
    releaseName: loki
    namespace: monitoring
    valuesFile: values.yaml
    includeCRDs: false

resources:
  - externalsecret.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml

patches:
  # Pin the loki Service's ClusterIP to the address it has carried since
  # install. observability/hubble-flow-exporter's Vector sidecar runs in
  # the host-network cilium-agent pod and cannot resolve cluster.local
  # names (see the endpoint comment in its configmap.yaml), so it pushes
  # to this address. clusterIP is immutable; declaring the live value is
  # a no-op for Argo, and a rebuilt cluster gets the same address as long
  # as the service CIDR (10.96.0.0/12, Talos cluster config) is kept.
  # The chart exposes no clusterIP value for the single-binary Service.
  - target:
      kind: Service
      name: loki
    patch: |
      - op: add
        path: /spec/clusterIP
        value: 10.98.57.58
