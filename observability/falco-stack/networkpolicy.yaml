# NetworkPolicies for Falco DaemonSet + Falcosidekick.
#
# Falco DaemonSet:
# - No ingress (Falco listens on a localhost gRPC socket
#   for plugins; nothing outside the pod talks to it
#   directly).
# - Egress to Falcosidekick (event fanout) + kube-DNS.
#
# Falcosidekick Deployment:
# - Ingress from Falco (event POSTs).
# - Ingress from monitoring's Prometheus (self-metrics
#   scrape).
# - Egress to ntfy-e2ee-relay (webhook output) + kube-DNS.
# - Egress to Loki + Alertmanager when those land
#   (added at observability-layer rollout).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: falco-default-deny
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: falco
  policyTypes: [Ingress, Egress]
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Falcosidekick (same ns).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: falcosidekick
      ports:
        - port: 2801
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: falcosidekick-allow
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
  policyTypes: [Ingress, Egress]
  ingress:
    # Falco DaemonSet (event POSTs).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: falco
      ports:
        - port: 2801
          protocol: TCP
    # Prometheus self-metrics scrape — already in
    # monitoring ns; selector matches the kube-prometheus-
    # stack Prometheus pod label convention.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 2801
          protocol: TCP
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # ntfy-e2ee-relay (the webhook output target). Per the
    # audit TODO: this is the wiring that makes the relay
    # actually receive Falco events.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ntfy-e2ee-relay
      ports:
        - port: 8000
          protocol: TCP
    # Loki + Alertmanager outputs — enabled 2026-04-30 with
    # Loki and kube-prometheus-stack layers landing. Both
    # same-ns (monitoring); podSelector by name.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - port: 3100
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 9093
          protocol: TCP
---
# Falco falcoctl-artifact-install needs to pull `falco-rules:3` from the
# OCI registry at first install (and on every restart since it lives in
# an initContainer). The vanilla netpol above only allows DNS +
# falcosidekick; without this CCNP, falcoctl exits code 1 with no log
# (just "context deadline exceeded" on the HTTPS connect). 8 days of
# falco-* CrashLoopBackOff = this.
#
# Implemented as CiliumNetworkPolicy because vanilla NetworkPolicy can't
# match FQDNs — and ghcr.io / falcosecurity.github.io front through CDN
# IPs that aren't worth enumerating in ipBlock. K8s policies are
# additive within a direction so this just EXTENDS the egress allow-set;
# the falco-default-deny rules above stay in place. Added 2026-06-01.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: falco-outbound-https
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: falco
  egress:
    # kube-DNS, with L7 DNS rules so toFQDNs below resolve correctly.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    # OCI registry + rules index.
    - toFQDNs:
        - matchName: ghcr.io
        - matchName: falcosecurity.github.io
        - matchPattern: "*.githubusercontent.com"
        - matchPattern: "*.actions.githubusercontent.com"
        - matchName: pkg-containers.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
