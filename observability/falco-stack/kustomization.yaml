# Falco + Falcosidekick — runtime HIDS per ADR 0021 D4 + D7.
# Falco DaemonSet on all nodes (CO-RE eBPF probe; kmod
# unavailable on Talos), Falcosidekick fans events to the
# ntfy-e2ee-relay (per the audit TODO closure) + Loki +
# Alertmanager when those layers land.
#
# Per ADR 0013 (Talos): kmod-based Falco probe is unavailable
# on immutable node OS. Modern eBPF (CO-RE) is the only
# option; legacy eBPF deprecated upstream.
#
# Rule source: upstream falcosecurity/rules pinned by chart
# version + local overlay under rules/.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  # Falco — DaemonSet + Falcosidekick subchart enabled inline.
  - name: falco
    repo: https://falcosecurity.github.io/charts
    version: "8.0.5"  # OPERATOR PINS via Renovate.
    # Rolled back 9.0.0 (Falco 0.44.0) → 8.0.5 (Falco 0.43.1) on
    # 2026-06-02 because chart 9.0.0 dropped the legacy `ebpf`
    # driver kind entirely. modern_ebpf is upstream-broken against
    # Talos kernel 6.18.24 in libs ≤0.24.0 with two distinct bugs
    # (bpf_loop SCC verifier limit in <0.24.0; bpf_probe_read
    # helper-not-allowed in 0.24.0). Chart 8.x is the latest line
    # that still exposes `driver.kind: ebpf` (legacy CO-RE-less
    # probe), the only working path on this kernel today.
    # See homelab-docs/99-journal/2026-06-02-falco-driver-fallback.md
    # for the diagnosis chain and revert criterion.
    # Upstream tracking: falcosecurity/falco#3813, libs#2893.
    releaseName: falco
    namespace: monitoring
    valuesFile: values.yaml
    includeCRDs: false  # falco chart ships no CRDs

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
  - rules-configmap.yaml
