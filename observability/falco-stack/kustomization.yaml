# Falco + Falcosidekick — runtime HIDS per ADR 0021 D4 + D7.
# Falco DaemonSet on all nodes (CO-RE eBPF probe; kmod
# unavailable on Talos), Falcosidekick fans events to the
# ntfy-e2ee-relay (per the audit TODO closure) + Loki +
# Alertmanager when those layers land.
#
# Per ADR 0013 (Talos): kmod-based Falco probe is unavailable
# on immutable node OS. Modern eBPF (CO-RE) is the only
# option; legacy eBPF deprecated upstream.
#
# Rule source: upstream falcosecurity/rules pinned by chart
# version + local overlay under rules/.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  # Falco — DaemonSet + Falcosidekick subchart enabled inline.
  - name: falco
    repo: https://falcosecurity.github.io/charts
    version: "9.0.0"  # OPERATOR PINS via Renovate.
    # Bumped from 4.20.0 (Falco 0.40.0) → 9.0.0 (Falco 0.44.0)
    # on 2026-06-02 to clear scap_init crash on Talos kernel
    # 6.18.24. Root cause: libs <0.24.0 BPF verifier blow-out
    # in recvmmsg_x/sendmmsg_x callbacks on kernels with the
    # tightened SCC analysis (kernel 6.18+ in our case).
    # Fix: falcosecurity/libs#2893 → libs 0.24.0 → Falco 0.44.0.
    # Upstream tracking issue: falcosecurity/falco#3813.
    releaseName: falco
    namespace: monitoring
    valuesFile: values.yaml
    includeCRDs: false  # falco chart ships no CRDs

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
  - rules-configmap.yaml
