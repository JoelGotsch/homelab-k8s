# Mirror Secret in `monitoring` ns of the inbound bearer
# tokens that AM uses on its webhook_configs for outbound
# calls to approval-channel + ntfy-e2ee-relay.
#
# Per the 2026-05-02 audit follow-up #4 (HMAC inbound auth on
# approval-channel + ntfy-e2ee-relay): defense-in-depth
# alongside NetworkPolicy. AM is the legitimate caller; this
# Secret holds the tokens AM uses to authenticate to those
# upstream webhook receivers.
#
# Source-of-truth paths in OpenBao (same paths the consumer
# apps' ExternalSecrets pull from — ESO mirroring keeps
# AM-side + app-side in sync without manual coordination):
#   kv/data/approval-channel/inbound-auth-token: token
#   kv/data/ntfy-e2ee-relay/inbound-auth-token: token
#   kv/data/ntfy/am-direct-token: value
#     ^ Added 2026-07-10 for the Tier 2 direct-ntfy sink in
#       alertmanager-config.yaml. The token is what AM
#       presents as `Authorization: Bearer <token>` when
#       publishing to the ntfy server's `homelab-alerts-
#       warning` topic. Field name matches the ntfy family
#       convention (`value`, same as ntfy/relay-token and
#       ntfy/topic-key — see openbao-paths.yml auto_paths).
#       Seeded by `provision-ntfy-relay-token.sh`:
#         homelab-infra/scripts/provision-ntfy-relay-token.sh \
#             --user am-direct \
#             --topic homelab-alerts-warning \
#             --acl-perm wo \
#             --kv-path kv/ntfy/am-direct-token \
#             --token-label am-direct-cluster
#       Until the operator runs the script, the mirror
#       Secret's `ntfy-am-direct` key renders empty and
#       AM's Tier 2 webhook 401s into a benign retry loop
#       (critical alerts still deliver via the E2EE + Signal
#       fan-out).

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: am-inbound-tokens
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: am-inbound-tokens
    creationPolicy: Owner
  data:
    - secretKey: approval-channel
      remoteRef:
        key: approval-channel/inbound-auth-token
        property: token
    - secretKey: ntfy-e2ee-relay
      remoteRef:
        key: ntfy-e2ee-relay/inbound-auth-token
        property: token
    - secretKey: ntfy-am-direct
      remoteRef:
        key: ntfy/am-direct-token
        # `value` matches the ntfy family convention (relay-token,
        # topic-key), and is what provision-ntfy-relay-token.sh
        # writes into OpenBao. Do not change without updating the
        # script + the openbao-paths.yml auto_paths entry together.
        property: value
