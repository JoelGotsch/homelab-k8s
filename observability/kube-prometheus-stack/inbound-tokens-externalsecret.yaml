# Mirror Secret in `monitoring` ns of the inbound bearer
# tokens that AM uses on its webhook_configs for outbound
# calls to approval-channel + ntfy-e2ee-relay.
#
# Per the 2026-05-02 audit follow-up #4 (HMAC inbound auth on
# approval-channel + ntfy-e2ee-relay): defense-in-depth
# alongside NetworkPolicy. AM is the legitimate caller; this
# Secret holds the tokens AM uses to authenticate to those
# upstream webhook receivers.
#
# Source-of-truth paths in OpenBao (same paths the consumer
# apps' ExternalSecrets pull from — ESO mirroring keeps
# AM-side + app-side in sync without manual coordination):
#   kv/data/approval-channel/inbound-auth-token: token
#   kv/data/ntfy-e2ee-relay/inbound-auth-token: token

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: am-inbound-tokens
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: am-inbound-tokens
    creationPolicy: Owner
  data:
    - secretKey: approval-channel
      remoteRef:
        key: approval-channel/inbound-auth-token
        property: token
    - secretKey: ntfy-e2ee-relay
      remoteRef:
        key: ntfy-e2ee-relay/inbound-auth-token
        property: token
