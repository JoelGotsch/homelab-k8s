# NetworkPolicies for kube-prometheus-stack workloads.
#
# Prometheus:
# - Ingress from Alertmanager + Grafana (PromQL queries).
# - Egress to all-namespaces (scrape any ServiceMonitor target).
#   This is wide by design — Prometheus's job is to reach every
#   metrics endpoint in the cluster.
#
# Alertmanager:
# - Ingress from Prometheus (alert delivery).
# - Egress to the same-namespace alert-formatter only. The formatter owns ntfy
#   primary delivery and conditional Signal fallback per ADR 0039.
#
# Grafana:
# - Ingress from cluster Gateway (HTTPRoute) + same-ns workloads.
# - Egress to Prometheus (data source) + Loki (when up).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-allow
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 9090
          protocol: TCP
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Scrape — any pod with a `prometheus.io/scrape: true`
    # annotation OR matching ServiceMonitor selector.
    # namespaceSelector is wide, but this is a PORT ALLOWLIST:
    # a new ServiceMonitor on a port NOT listed here is silently
    # egress-denied (verdict:none SYN drop) and its target fails
    # OPEN as "context deadline exceeded" — no alert (rule 17).
    # ANY new scrape port MUST be added below. This recurred
    # 2026-06-26 (node-exporter), 2026-07-14 (grafana:3000), and
    # 2026-07-15 (loki/alloy/coredns/jellyfin/cloudflared/forgejo).
    # auth-gating happens at the metrics-endpoint level (most
    # metrics endpoints are unauthenticated within cluster —
    # standard Prometheus pattern).
    - to:
        - namespaceSelector: {}
      ports:
        - port: 2000   # cloudflared tunnel metrics
          protocol: TCP
        - port: 3000   # grafana + forgejo /metrics
          protocol: TCP
        - port: 3100   # loki
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 8082
          protocol: TCP
        - port: 8096   # jellyfin
          protocol: TCP
        - port: 9000   # minio-on-nas (backup-bucket footprint metrics, WS-F 2026-07-16)
          protocol: TCP
        - port: 9090
          protocol: TCP
        - port: 9153   # coredns
          protocol: TCP
        - port: 12345  # alloy
          protocol: TCP
        - port: 9100
          protocol: TCP
        - port: 9101
          protocol: TCP
        - port: 9102
          protocol: TCP
        - port: 9103
          protocol: TCP
        - port: 9104
          protocol: TCP
        - port: 9105
          protocol: TCP
        - port: 9093   # Alertmanager API (Prometheus → AM alert
          protocol: TCP   # delivery). Added 2026-06-24 after AM STS
                          # came up (task #54); previously absent.
        - port: 80   # ntfy server
          protocol: TCP
        - port: 8000   # ntfy-e2ee-relay
          protocol: TCP
        - port: 2801   # falcosidekick
          protocol: TCP
        - port: 8443   # kube-state-metrics, prometheus-operator
          protocol: TCP
        # argocd metrics — notifications-controller :9001, server :8083,
        # repo-server :8084. ServiceMonitors landed with the argocd v3.4.5
        # sync (2026-07-18); these ports were never in this allowlist so
        # the new targets went straight to TargetDown (rule 17). 2026-07-19.
        - port: 9001
          protocol: TCP
        - port: 8083
          protocol: TCP
        - port: 8084
          protocol: TCP
        - port: 10250  # kubelet metrics
          protocol: TCP
    # External hosts via additional-scrape-configs (Mac Studio
    # node-exporter on inference VLAN per
    # observability/prometheus/external-hosts/).
    - to:
        - ipBlock:
            cidr: 10.10.50.0/24  # inference VLAN
      ports:
        - port: 9100
          protocol: TCP
        - port: 9101
          protocol: TCP
---
# CiliumNetworkPolicy — Prometheus egress to kube-apiserver +
# every node's host-network endpoints (node-exporter, kubelet
# cAdvisor, anything bound to the node IP).
#
# Originally added 2026-06-25 to fix the `dial tcp 10.96.0.1:443:
# i/o timeout` (#71) — Prometheus couldn't list pods/svcs and had
# 0 active scrape targets.
#
# Extended 2026-06-26 (#35 baseline-snapshot discovery) to add
# `host` + `remote-node` entities. The original kube-apiserver-
# only egress made Prometheus default-deny for everything else
# — control-plane node-exporter scrapes worked accidentally
# because the CP node IPs ARE the apiserver IPs, but worker
# node-exporter (10.10.30.21-23:9100) and kubelet cAdvisor
# (:10250) scrapes all timed out. Result: ~half the cluster's
# memory + container metrics invisible, including the
# longhorn-manager OOMKill loop that drove the worker-cascade
# RCAs.
#
# `host` covers the LOCAL node (Prometheus's own worker);
# `remote-node` covers PEER node IPs. Together they unblock all
# node-exporter/kubelet scrapes. Same pattern as the openbao-
# seal-watchdog egress fix (commit 8494b91).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-apiserver
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  egress:
    - toEntities:
        - kube-apiserver
        - host
        - remote-node
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-allow
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 9093
          protocol: TCP
        - port: 8080   # prometheus-config-reloader sidecar /metrics
          protocol: TCP   # (ServiceMonitor scrapes this separately
                          # from the 9093 web port). Was missing →
                          # the :8080 target failed OPEN (rule 17).
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # alert-formatter (same namespace) — both ntfy tiers now
    # route through the formatter, which extracts a readable
    # summary and re-publishes to ntfy. Per alertmanager-
    # config.yaml receivers ntfy-direct + ntfy-critical
    # (2026-07-13). The formatter's own egress to ntfy is in
    # alert-formatter.yaml.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alert-formatter
      ports:
        - port: 8080
          protocol: TCP
    # Alertmanager peer-mesh (3-replica HA when scaled).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 9094
          protocol: TCP
        - port: 9094
          protocol: UDP
---
# grafana-allow is a CiliumNetworkPolicy (not K8s NetworkPolicy)
# because the Cilium Gateway API carries a reserved `ingress`
# identity that K8s NetPol's `namespaceSelector: kubernetes.io/
# metadata.name=ingress` cannot match. K8s NetPol allowing from
# the ingress namespace silently drops Gateway traffic with a
# 503 / 5s timeout. See homelab-k8s/platform/authentik/networkpolicy.yaml
# for the same fix.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-allow
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    # Cluster Gateway HTTPRoute — operator reaches Grafana UI.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Prometheus scrape — grafana serves /metrics on the same 3000
    # port. This rule was MISSING, so grafana's ServiceMonitor target
    # was policy-denied (Hubble: "Policy denied DROPPED") and grafana
    # self-metrics were uncollected for 3+ days (rule 17: missing
    # metrics fail silent). Added 2026-07-14.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    # kube-DNS.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # kube-apiserver — the grafana-sc-dashboard / -datasources
    # sidecars (k8s-sidecar) watch ConfigMaps/Secrets via the
    # kubernetes.default ClusterIP 10.96.0.1:443, which socket-LB
    # DNATs to the real apiserver :6443 BEFORE policy eval, so
    # BOTH ports are required (rule 12). Was missing → both
    # sidecars crashlooped (ConnectTimeout to 10.96.0.1:443) and
    # dashboards/datasources were not provisioned.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # Prometheus data source.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Alertmanager (silences UI integration).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
    # Loki data source.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    # Authentik OIDC server-to-server (token + userinfo).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
            - port: "9443"
              protocol: TCP
    # Authentik OIDC issuer discovery via public URL — Grafana
    # fetches .well-known/openid-configuration on first auth
    # attempt; the URL resolves to the cluster Gateway VIP
    # (10.10.30.50), so traffic exits through the `ingress`
    # entity.
    - toEntities:
        - ingress
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
