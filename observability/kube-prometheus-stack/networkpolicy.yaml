# NetworkPolicies for kube-prometheus-stack workloads.
#
# Prometheus:
# - Ingress from Alertmanager + Grafana (PromQL queries).
# - Egress to all-namespaces (scrape any ServiceMonitor target).
#   This is wide by design — Prometheus's job is to reach every
#   metrics endpoint in the cluster.
#
# Alertmanager:
# - Ingress from Prometheus (alert delivery).
# - Egress to ntfy-e2ee-relay (webhook receiver per
#   alertmanager-config.yaml).
#
# Grafana:
# - Ingress from cluster Gateway (HTTPRoute) + same-ns workloads.
# - Egress to Prometheus (data source) + Loki (when up).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-allow
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 9090
          protocol: TCP
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Scrape — any pod with a `prometheus.io/scrape: true`
    # annotation OR matching ServiceMonitor selector.
    # Wide allow because the scrape targets are everywhere
    # by design; auth-gating happens at the metrics-endpoint
    # level (most metrics endpoints are unauthenticated within
    # cluster — standard Prometheus pattern).
    - to:
        - namespaceSelector: {}
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 8082
          protocol: TCP
        - port: 9090
          protocol: TCP
        - port: 9100
          protocol: TCP
        - port: 9101
          protocol: TCP
        - port: 9102
          protocol: TCP
        - port: 9103
          protocol: TCP
        - port: 9104
          protocol: TCP
        - port: 9105
          protocol: TCP
        - port: 80   # ntfy server
          protocol: TCP
        - port: 8000   # ntfy-e2ee-relay
          protocol: TCP
        - port: 2801   # falcosidekick
          protocol: TCP
        - port: 8443   # kube-state-metrics, prometheus-operator
          protocol: TCP
        - port: 10250  # kubelet metrics
          protocol: TCP
    # External hosts via additional-scrape-configs (Mac Studio
    # node-exporter on inference VLAN per
    # observability/prometheus/external-hosts/).
    - to:
        - ipBlock:
            cidr: 10.10.50.0/24  # inference VLAN
      ports:
        - port: 9100
          protocol: TCP
        - port: 9101
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-allow
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 9093
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # ntfy-e2ee-relay — webhook receiver per
    # alertmanager-config.yaml.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ntfy-e2ee-relay
      ports:
        - port: 8000
          protocol: TCP
    # Alertmanager peer-mesh (3-replica HA when scaled).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 9094
          protocol: TCP
        - port: 9094
          protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-allow
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes: [Ingress, Egress]
  ingress:
    # Cluster Gateway — operator reaches Grafana UI via
    # HTTPRoute (Tailscale-fronted phase 1; later behind
    # Authentik OIDC).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Prometheus data source.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9090
          protocol: TCP
    # Alertmanager (silences UI integration).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 9093
          protocol: TCP
    # Loki data source — enabled 2026-04-30 with Loki layer.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - port: 3100
          protocol: TCP
    # Authentik OIDC — uncomment when Authentik lands.
    # - to:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: authentik
    #   ports:
    #     - port: 9000
    #       protocol: TCP
