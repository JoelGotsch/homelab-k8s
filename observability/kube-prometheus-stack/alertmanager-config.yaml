# Alertmanager routing config. Per ADR 0039 and the three-tier design in
# 03-runbooks/observability/alert-routing.md:
#
#   Tier 1 (ntfy — urgent): critical severity, operator eyes within minutes.
#     The alert-formatter tries ntfy first and invokes the one-way Signal
#     fallback only when that publish returns an error.
#   Tier 2 (ntfy — attention): warning severity, operator sees
#     within hours. Direct ntfy publish to a dedicated
#     `homelab-alerts-warning` topic. Same shape as Tier 1's
#     ntfy leg, different topic + slower cadence.
#   Tier 3 (silent — logged): info severity + explicitly null-
#     routed. Loki captures the notification-log record; the
#     LLM triage agent surfaces in weekly digests.
#
# Historical note — E2EE removal (2026-07-12):
#   Tier 1 used to route through `ntfy-via-relay` →
#   `ntfy-e2ee-relay` which AES-256-GCM-encrypted the payload
#   client-side per ADR 0024 D1 phase-2 (gating condition for
#   moving ntfy off Tailscale-only onto Cloudflare Tunnel, so
#   CF's TLS terminator wouldn't see alert content). Phase 2
#   never happened; ntfy stayed Tailscale-only. The relay's
#   custom wire format also isn't F-Droid-decryptable, so the
#   phone showed ciphertext. Reverted to direct publish; the
#   relay stays deployed as a safety net for potential
#   phase-2 re-commit. See 99-journal/2026-07-12-alert-
#   pipeline-bringup-audit.md §E2EE removal.
#
# Historical note (pre-2026-07-10):
#   All severities routed through `ntfy-via-relay` (E2EE), and
#   critical additionally fanned to Signal. The 2026-07-09
#   Longhorn near-outage was NOT a routing failure — every
#   defined alert was reaching ntfy — it was a RULE-COVERAGE
#   failure (no Longhorn-scoped warning existed, so no alert
#   ever fired to notice a leak that had been accumulating for
#   4 days). This config extension adds the Tier 2 direct-ntfy
#   sink so the operator can distinguish "attention" from
#   "page" without losing either signal.
#
# Inhibition rules (unchanged):
# - critical inhibits warning for the same alertname (avoid
#   double-paging when both fire).
# - "InstanceDown" / "NodeNotReady" inhibits anything else for
#   that instance (the host being unreachable explains why
#   every other alert is firing).

apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  route:
    # Default receiver = Tier 2 direct-ntfy. Any alert without
    # a more specific match lands here — same failure mode as
    # the pre-2026-07-10 config's ntfy-via-relay default, but
    # cheaper (no E2EE for the high-volume tier).
    receiver: ntfy-direct
    groupBy: [alertname, namespace, severity]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
    routes:
      # ===== Tier 3 silent (severity: info) =====
      # info-tier alerts go to null; still logged via AM's
      # notification log which alloy ships to Loki.
      # Weekly review path per the alert-routing runbook.
      - matchers:
          - name: severity
            value: info
        receiver: 'null'

      # ===== Tier 3 silent — chart-provided Watchdog =====
      # kube-prometheus-stack ships a Watchdog rule that fires
      # perpetually as an alerting-pipeline liveness probe.
      # It should NEVER page — but should still route somewhere
      # measurable so operator can build an alert-on-Watchdog-
      # gone (dead-man's) rule downstream.
      - matchers:
          - name: alertname
            value: Watchdog
        receiver: 'null'

      # ===== Tier 3 silent — quota overcommit is the design (ADR 0042) =====
      # Per-namespace ResourceQuotas deliberately oversubscribe the
      # cluster (guardrails, not capacity promises), so
      # KubeMemoryQuotaOvercommit describes intended state.
      # KubeCPUQuotaOvercommit should stop firing entirely now that
      # limits.cpu is untracked (only ci-woodpecker keeps it, below
      # threshold) — null-routed defensively for the transition.
      - matchers:
          - name: alertname
            matchType: "=~"
            value: "KubeMemoryQuotaOvercommit|KubeCPUQuotaOvercommit"
        receiver: 'null'

      # ===== Trivy CVE alerts — daily digest (alert fatigue) =====
      # Per subagent audit 2026-07-12: 114 Trivy* alerts fire
      # concurrently (one per image scanned). Grouped alone by
      # alertname+severity, the operator gets 2 notifications
      # (one CRITICAL summary, one HIGH summary) instead of 114.
      # `continue: false` — Trivy criticals do NOT fan out to
      # Signal because CVEs have day/week fix horizons (rule 40
      # trained-to-ignore risk). The runbook has Trivy off the
      # escalate-after opt-in list as well.
      - matchers:
          - name: component
            value: trivy
        receiver: ntfy-direct
        groupBy: [alertname, severity]
        groupWait: 5m
        # groupInterval governs re-notification when the group's
        # CONTENTS change (new image with a CVE appears, e.g.
        # during an upgrade sweep). Was 1h → produced hourly
        # re-sends whenever a scan added/removed a member. 6h
        # caps churn-driven digests to ~4/day even mid-upgrade;
        # the anti-flap max_over_time in the trivy PrometheusRule
        # is the primary fix, this is defense-in-depth.
        # 2026-07-13.
        groupInterval: 6h
        repeatInterval: 7d
        continue: false
        # Trivy CVEs are never time-urgent (day/week fix horizons),
        # so suppress notifications overnight — a 06:00 ntfy buzz for
        # accepted base-layer CVEs is pure noise. Muted 00:00–09:00
        # Europe/Berlin; a batch that would fire in that window is
        # held and delivered at 09:00. 2026-07-14 (operator ask).
        muteTimeIntervals:
          - overnight-quiet

      # ===== TargetDown rollup — one notification per outage =====
      # 14 firing right now. Most are ServiceMonitor mis-config
      # (approval-channel ImagePullBackOff by design; signal-bridge
      # /metrics returns 404 because bbernhard image doesn't
      # publish Prometheus metrics; cloudflared / vaultwarden /
      # paperless / loki-headless / jellyfin / forgejo-http /
      # coredns — all real bugs but not per-target actionable).
      # Group by alertname alone so a single monitoring outage
      # rolls up to one notification with N targets in the payload.
      - matchers:
          - name: alertname
            value: TargetDown
        receiver: ntfy-direct
        groupBy: [alertname]
        groupWait: 1m
        groupInterval: 15m
        repeatInterval: 12h
        continue: false

      # ===== Node-outage fallout rollup — one notification per class =====
      # A single NotReady node fans KubePodNotReady / DaemonSetRolloutStuck /
      # StatefulSet* / PDB across many namespaces; with the default groupBy
      # (alertname, namespace, severity) that was 13+ separate groups, each
      # repeating independently (2026-07-19/20 worker1 outage: ~44 of 106
      # daily notifications). Group these by alertname alone — one batch per
      # class, per-namespace detail stays in the payload. They are also
      # inhibited entirely while KubeNodeNotReady fires (see inhibitRules);
      # this route matters for NON-node causes (bad rollouts).
      - matchers:
          - name: alertname
            matchType: "=~"
            value: "KubePodNotReady|KubeDaemonSetRolloutStuck|KubeStatefulSetReplicasMismatch|KubeStatefulSetUpdateNotRolledOut|KubeDeploymentReplicasMismatch|KubePdbNotEnoughHealthyPods"
        receiver: ntfy-direct
        groupBy: [alertname]
        groupWait: 5m
        groupInterval: 30m
        repeatInterval: 12h

      # ===== Node-down page (2026-07-22) =====
      # KubeNodeNotReady / KubeNodeUnreachable ship from
      # kube-prometheus-stack at severity: warning (both with
      # `for: 15m`), so they landed in the Tier 2 attention
      # topic — during the 2026-07-18 worker1 hard-down nobody
      # was paged. A node that has been gone ≥15m is
      # operator-eyes-now regardless of its severity label:
      # route by alertname to the urgent topic. Signal stays
      # conditional — the alert-formatter only invokes the
      # Signal fallback when the ntfy publish itself fails,
      # which matches "Signal is not the normal critical tier".
      # groupBy alertname → one page per outage class;
      # KubeNodeNotReady already inhibits KubeNodeUnreachable
      # (see inhibitRules) so a dead node yields a single page.
      - matchers:
          - name: alertname
            matchType: "=~"
            value: "KubeNodeNotReady|KubeNodeUnreachable"
        receiver: ntfy-critical
        groupBy: [alertname]
        groupWait: 30s
        groupInterval: 5m
        repeatInterval: 6h

      # ===== Deception (ADR 0039) =====
      # Honey-asset hits keep zero-latency grouping and use the urgent ntfy
      # topic. Signal is selected inside alert-formatter only if ntfy fails.
      - matchers:
          - name: component
            value: deception
        receiver: ntfy-critical
        groupWait: 0s
        groupInterval: 30s
        repeatInterval: 30m

      # ===== Tier 1 (severity: critical) =====
      # One receiver: alert-formatter -> ntfy. The formatter owns conditional
      # Signal fallback, so Alertmanager never performs unconditional fan-out.
      #
      # Historical note: this used to go through
      # `ntfy-e2ee-relay` with AES-256-GCM client-side
      # encryption per ADR 0024 D1 phase-2 (Cloudflare-Tunnel
      # migration to keep the ntfy server + CF blind to alert
      # content). Phase 2 never happened; ntfy stayed
      # Tailscale-only. The relay's custom wire format is also
      # not F-Droid-native (the operator couldn't decrypt
      # server-side ciphertext on the phone). Reverted to
      # direct publish 2026-07-12 — see
      # 99-journal/2026-07-12-alert-pipeline-bringup-audit.md
      # §E2EE removal. Relay stays deployed as a
      # reversible-decision safety net until phase 2 is
      # committed / abandoned.
      - matchers:
          - name: severity
            value: critical
        receiver: ntfy-critical
        groupWait: 5s
        groupInterval: 1m
        # 6h, not 1h: a persistent known critical (OpenBaoMissingReplica
        # through the 2026-07 worker1 outage) re-paged both media hourly —
        # ~48 of 106 daily notifications. First page stays immediate
        # (groupWait 5s); repeat is only the nag cadence. 2026-07-20.
        repeatInterval: 6h

      # (no explicit Tier 2 route needed — anything not matched
      # above falls through to the default receiver = ntfy-direct.)

  receivers:
    # ===== Tier 3 sink =====
    - name: 'null'

    # ===== Tier 2 sink — direct ntfy via alert-formatter =====
    # Posts the AM webhook JSON to the alert-formatter service
    # (alert-formatter.yaml), which extracts a readable summary
    # (title = alertname, body = per-alert `severity · namespace:
    # summary` lines, ntfy Priority + emoji Tags by severity) and
    # re-publishes to the ntfy topic. Before 2026-07-13 AM posted
    # the raw JSON straight to the topic URL and the F-Droid app
    # showed unreadable nested JSON.
    #
    # No auth header here: the formatter holds the ntfy publish
    # token (am-inbound-tokens / ntfy-am-direct) and adds the
    # Bearer on the formatter→ntfy leg. AM→formatter is
    # NetPol-gated (alert-formatter-allow ingress from
    # alertmanager pods only).
    #
    # `topic` query param selects the destination topic — one
    # formatter serves both tiers.
    - name: ntfy-direct
      webhookConfigs:
        - url: http://alert-formatter.monitoring.svc.cluster.local:8080/publish?topic=homelab-alerts-warning
          sendResolved: true

    # ===== Tier 1 sink A — direct ntfy (topic homelab-alerts) =====
    # Was: `ntfy-via-relay` routed through ntfy-e2ee-relay
    # for AES-256-GCM encryption. Removed 2026-07-12 because
    # (a) Phase-2 CF-Tunnel-fronted ntfy — the E2EE gating
    # condition — never happened; (b) the relay's custom wire
    # format isn't F-Droid-decryptable, so the phone showed
    # ciphertext. Reverted to direct publish; now via the
    # alert-formatter (same as Tier 2), different topic.
    #
    # No auth header — the formatter holds the ntfy token
    # (am-inbound-tokens / ntfy-am-direct) and adds the Bearer
    # on its ntfy leg. `am-direct` has write-only on both
    # topics (granted 2026-07-12); one user covers both tiers.
    - name: ntfy-critical
      webhookConfigs:
        - url: http://alert-formatter.monitoring.svc.cluster.local:8080/publish?topic=homelab-alerts
          sendResolved: true

  inhibitRules:
    # critical inhibits warning for the same (alertname,
    # namespace) — avoid double-paging.
    - sourceMatch:
        - name: severity
          value: critical
      targetMatch:
        - name: severity
          value: warning
      equal: [alertname, namespace]

    # ===== Node-outage cascade suppression (2026-07-20) =====
    # While a node is NotReady, its mechanical fallout (unschedulable pods,
    # stuck DaemonSet/StatefulSet rollouts, PDB shortfall, capacity math)
    # carries no extra information — the 2026-07 worker1 outage produced a
    # ~25-alert storm describing one fact. KubeNodeNotReady is the canonical
    # page; the fallout classes are suppressed while it fires. Deliberately
    # NOT suppressed: TargetDown (it caught the unrelated argocd scrape gap
    # DURING this outage), OpenBaoMissingReplica (service-level critical),
    # and anything unlisted. Trade-off: a genuinely new pod failure
    # elsewhere is also muted during a node outage — accepted; the operator
    # is engaged during outages, and criticals still page.
    - sourceMatch:
        - name: alertname
          value: KubeNodeNotReady
      targetMatch:
        - name: alertname
          matchType: "=~"
          value: "KubePodNotReady|KubeDaemonSetRolloutStuck|KubeStatefulSetReplicasMismatch|KubeStatefulSetUpdateNotRolledOut|KubeDeploymentReplicasMismatch|KubePdbNotEnoughHealthyPods|KubeCPUQuotaOvercommit|KubeMemoryQuotaOvercommit|KubeletInstanceUnreachable|KubeNodeUnreachable"

    # InstanceDown / NodeNotReady inhibit other alerts for
    # that instance — the instance being down explains the
    # secondaries.
    - sourceMatch:
        - name: alertname
          value: InstanceDown
      targetMatch: []
      equal: [instance]
    - sourceMatch:
        - name: alertname
          value: NodeNotReady
      targetMatch: []
      equal: [node]

  # Named time intervals referenced by routes' muteTimeIntervals.
  # `overnight-quiet` silences low-urgency digests (Trivy CVEs)
  # between midnight and 09:00 local — a held batch delivers at
  # 09:00. Urgent ntfy/deception routes bypass this by
  # not referencing it. 2026-07-14.
  muteTimeIntervals:
    - name: overnight-quiet
      # NOTE: this AlertmanagerConfig CRD's TimeInterval has NO
      # `location` field (operator v0.92.1 v1alpha1 schema), so times
      # are UTC. To guarantee no delivery before 09:00 Europe/Berlin
      # YEAR-ROUND (CET=UTC+1, CEST=UTC+2) the window ends at 08:00
      # UTC (= 09:00 CET / 10:00 CEST) and starts at 21:00 UTC; the
      # midnight wrap needs two ranges. A held digest delivers at the
      # window's end. Revisit if the CRD gains `location`.
      timeIntervals:
        - times:
            - startTime: "21:00"
              endTime: "24:00"
            - startTime: "00:00"
              endTime: "08:00"
