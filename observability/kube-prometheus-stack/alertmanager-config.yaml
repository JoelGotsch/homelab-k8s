# Alertmanager routing config. Per ADR 0021 D7:
# "Alertmanager + Falcosidekick → ntfy + Signal."
#
# Two parallel delivery paths, both active:
# - All severities → webhook → ntfy-e2ee-relay → ntfy
#   (cluster-hosted ntfy server; baseline notification stream).
# - Critical severity + deception events → approval-channel
#   → signal-bridge → operator's Signal account
#   (per ADR 0009 + ADR 0021 D7+D10 + the signal-webhook
#   runbook). Activated 2026-04-30 with the signal-bridge +
#   approval-channel layers landing.
#
# The two paths fan out via `continue: true` on the relevant
# routes so a critical alert reaches BOTH ntfy and Signal.
# Independence is deliberate: ntfy is the default low-friction
# stream, Signal is the high-attention stream — operator reads
# both, but Signal carries the decisions-required subset.
#
# Inhibition rules:
# - critical inhibits warning for the same alertname (avoid
#   double-paging when both fire).
# - "InstanceDown" inhibits anything else for that instance
#   (the host being unreachable explains why every other
#   alert is firing).

apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  route:
    receiver: ntfy-via-relay
    groupBy: [alertname, namespace, severity]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
    routes:
      # ===== Deception fan-out (ADR 0021 D10) =====
      # Honey-asset hits: zero-latency, dedicated route, BOTH
      # ntfy and the approval-channel /v1/deception path.
      - matchers:
          - name: component
            value: deception
        receiver: ntfy-via-relay
        groupWait: 0s
        groupInterval: 30s
        repeatInterval: 30m
        continue: true     # also evaluate the deception → Signal route below
      - matchers:
          - name: component
            value: deception
        receiver: approval-channel-deception
        groupWait: 0s
        groupInterval: 30s
        repeatInterval: 15m  # tighter than ntfy: deception is the operator-paging case

      # ===== Critical-severity fan-out (ADR 0021 D7) =====
      # Critical alerts go to BOTH ntfy and Signal via approval-
      # channel. Two independent streams; operator reads both.
      - matchers:
          - name: severity
            value: critical
        receiver: ntfy-via-relay
        groupWait: 5s
        groupInterval: 1m
        repeatInterval: 1h
        continue: true     # also evaluate the critical → Signal route below
      - matchers:
          - name: severity
            value: critical
        receiver: approval-channel-alert
        groupWait: 5s
        groupInterval: 1m
        repeatInterval: 1h

  receivers:
    - name: ntfy-via-relay
      webhookConfigs:
        - url: http://ntfy-e2ee-relay.ntfy-e2ee-relay.svc.cluster.local:8000/webhook
          # Alertmanager webhook output sends a JSON body with
          # `alerts[]` containing summary + description.
          # The relay's _extract_message in
          # ntfy-e2ee-relay/ntfy_relay/server.py prefers this
          # shape — Alertmanager v4 alerts[].annotations.summary
          # is the second branch after Falcosidekick's `output`.
          sendResolved: true
          # Alertmanager retries internally on transient
          # failures; the relay returns 502 → Alertmanager
          # backs off + retries. Acceptable.
          httpConfig:
            # If the relay ever moves to TLS-terminated
            # internal traffic (cluster mTLS), set tlsConfig
            # here. Today: cluster-internal HTTP.

    # approval-channel receivers (per ADR 0009 + ADR 0021 D7+D10).
    # approval-channel formats the AM v4 webhook batch as a
    # terse Signal-readable message and forwards via signal-
    # bridge. Two separate receivers — one for ordinary
    # critical-severity alerts, one for deception events —
    # so retry / repeat-interval / formatter framing stay
    # independent.
    - name: approval-channel-alert
      webhookConfigs:
        - url: http://approval-channel.approval-channel.svc.cluster.local:8000/v1/alert
          sendResolved: true
          # Alertmanager retries on 5xx; approval-channel
          # returns 502 if signal-bridge is unreachable.
          # That gives the durability layer.
          httpConfig: {}

    - name: approval-channel-deception
      webhookConfigs:
        - url: http://approval-channel.approval-channel.svc.cluster.local:8000/v1/deception
          sendResolved: true
          # `sendResolved` for deception is debatable — a
          # deception hit doesn't really "resolve" — but
          # leaving it on means the operator sees the
          # entire interaction window. Tighten if signal
          # noise materialises.
          httpConfig: {}

  inhibitRules:
    # critical inhibits warning for the same (alertname,
    # namespace) — avoid double-paging.
    - sourceMatch:
        - name: severity
          value: critical
      targetMatch:
        - name: severity
          value: warning
      equal: [alertname, namespace]

    # InstanceDown / NodeNotReady inhibit other alerts for
    # that instance — the instance being down explains the
    # secondaries.
    - sourceMatch:
        - name: alertname
          value: InstanceDown
      targetMatch: []
      equal: [instance]
    - sourceMatch:
        - name: alertname
          value: NodeNotReady
      targetMatch: []
      equal: [node]
