# Alertmanager routing config. Per ADR 0021 D7 and the
# three-tier design in
# 03-runbooks/observability/alert-routing.md (2026-07-10):
#
#   Tier 1 (Signal — page): critical severity, operator eyes
#     within minutes. Fans out to BOTH direct ntfy (topic
#     `homelab-alerts`) AND approval-channel (Signal via
#     signal-bridge). Neither leg is E2EE — the ntfy server
#     is Tailscale-only, so its plaintext view is inside the
#     trust boundary; approval-channel talks to signal-bridge
#     inside the cluster.
#   Tier 2 (ntfy — attention): warning severity, operator sees
#     within hours. Direct ntfy publish to a dedicated
#     `homelab-alerts-warning` topic. Same shape as Tier 1's
#     ntfy leg, different topic + slower cadence.
#   Tier 3 (silent — logged): info severity + explicitly null-
#     routed. Loki captures the notification-log record; the
#     LLM triage agent surfaces in weekly digests.
#
# Historical note — E2EE removal (2026-07-12):
#   Tier 1 used to route through `ntfy-via-relay` →
#   `ntfy-e2ee-relay` which AES-256-GCM-encrypted the payload
#   client-side per ADR 0024 D1 phase-2 (gating condition for
#   moving ntfy off Tailscale-only onto Cloudflare Tunnel, so
#   CF's TLS terminator wouldn't see alert content). Phase 2
#   never happened; ntfy stayed Tailscale-only. The relay's
#   custom wire format also isn't F-Droid-decryptable, so the
#   phone showed ciphertext. Reverted to direct publish; the
#   relay stays deployed as a safety net for potential
#   phase-2 re-commit. See 99-journal/2026-07-12-alert-
#   pipeline-bringup-audit.md §E2EE removal.
#
# Historical note (pre-2026-07-10):
#   All severities routed through `ntfy-via-relay` (E2EE), and
#   critical additionally fanned to Signal. The 2026-07-09
#   Longhorn near-outage was NOT a routing failure — every
#   defined alert was reaching ntfy — it was a RULE-COVERAGE
#   failure (no Longhorn-scoped warning existed, so no alert
#   ever fired to notice a leak that had been accumulating for
#   4 days). This config extension adds the Tier 2 direct-ntfy
#   sink so the operator can distinguish "attention" from
#   "page" without losing either signal.
#
# Inhibition rules (unchanged):
# - critical inhibits warning for the same alertname (avoid
#   double-paging when both fire).
# - "InstanceDown" / "NodeNotReady" inhibits anything else for
#   that instance (the host being unreachable explains why
#   every other alert is firing).

apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  route:
    # Default receiver = Tier 2 direct-ntfy. Any alert without
    # a more specific match lands here — same failure mode as
    # the pre-2026-07-10 config's ntfy-via-relay default, but
    # cheaper (no E2EE for the high-volume tier).
    receiver: ntfy-direct
    groupBy: [alertname, namespace, severity]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
    routes:
      # ===== Tier 3 silent (severity: info) =====
      # info-tier alerts go to null; still logged via AM's
      # notification log which alloy ships to Loki.
      # Weekly review path per the alert-routing runbook.
      - matchers:
          - name: severity
            value: info
        receiver: 'null'

      # ===== Tier 3 silent — chart-provided Watchdog =====
      # kube-prometheus-stack ships a Watchdog rule that fires
      # perpetually as an alerting-pipeline liveness probe.
      # It should NEVER page — but should still route somewhere
      # measurable so operator can build an alert-on-Watchdog-
      # gone (dead-man's) rule downstream.
      - matchers:
          - name: alertname
            value: Watchdog
        receiver: 'null'

      # ===== Trivy CVE alerts — daily digest (alert fatigue) =====
      # Per subagent audit 2026-07-12: 114 Trivy* alerts fire
      # concurrently (one per image scanned). Grouped alone by
      # alertname+severity, the operator gets 2 notifications
      # (one CRITICAL summary, one HIGH summary) instead of 114.
      # `continue: false` — Trivy criticals do NOT fan out to
      # Signal because CVEs have day/week fix horizons (rule 40
      # trained-to-ignore risk). The runbook has Trivy off the
      # escalate-after opt-in list as well.
      - matchers:
          - name: component
            value: trivy
        receiver: ntfy-direct
        groupBy: [alertname, severity]
        groupWait: 5m
        groupInterval: 1h
        repeatInterval: 7d
        continue: false

      # ===== TargetDown rollup — one notification per outage =====
      # 14 firing right now. Most are ServiceMonitor mis-config
      # (approval-channel ImagePullBackOff by design; signal-bridge
      # /metrics returns 404 because bbernhard image doesn't
      # publish Prometheus metrics; cloudflared / vaultwarden /
      # paperless / loki-headless / jellyfin / forgejo-http /
      # coredns — all real bugs but not per-target actionable).
      # Group by alertname alone so a single monitoring outage
      # rolls up to one notification with N targets in the payload.
      - matchers:
          - name: alertname
            value: TargetDown
        receiver: ntfy-direct
        groupBy: [alertname]
        groupWait: 1m
        groupInterval: 15m
        repeatInterval: 12h
        continue: false

      # ===== Deception fan-out (ADR 0021 D10) =====
      # Honey-asset hits: zero-latency dedicated route to the
      # direct-ntfy Tier-1 topic AND approval-channel /v1/
      # deception path (Signal buzz).
      - matchers:
          - name: component
            value: deception
        receiver: ntfy-critical
        groupWait: 0s
        groupInterval: 30s
        repeatInterval: 30m
        continue: true
      - matchers:
          - name: component
            value: deception
        receiver: approval-channel-deception
        groupWait: 0s
        groupInterval: 30s
        repeatInterval: 15m

      # ===== Tier 1 (severity: critical) =====
      # Two-branch fan-out: direct ntfy (topic `homelab-alerts`,
      # non-E2EE) AND Signal via approval-channel. Both fire;
      # operator gets one push per medium.
      #
      # Historical note: this used to go through
      # `ntfy-e2ee-relay` with AES-256-GCM client-side
      # encryption per ADR 0024 D1 phase-2 (Cloudflare-Tunnel
      # migration to keep the ntfy server + CF blind to alert
      # content). Phase 2 never happened; ntfy stayed
      # Tailscale-only. The relay's custom wire format is also
      # not F-Droid-native (the operator couldn't decrypt
      # server-side ciphertext on the phone). Reverted to
      # direct publish 2026-07-12 — see
      # 99-journal/2026-07-12-alert-pipeline-bringup-audit.md
      # §E2EE removal. Relay stays deployed as a
      # reversible-decision safety net until phase 2 is
      # committed / abandoned.
      - matchers:
          - name: severity
            value: critical
        receiver: ntfy-critical
        groupWait: 5s
        groupInterval: 1m
        repeatInterval: 1h
        continue: true
      - matchers:
          - name: severity
            value: critical
        receiver: approval-channel-alert
        groupWait: 5s
        groupInterval: 1m
        repeatInterval: 1h

      # ===== Tier 2 escalate-after opt-in =====
      # Per the alert-routing runbook "escalate-after"
      # mechanism: alerts labeled `escalate_after: "1h"` at the
      # PrometheusRule level get an additional Signal fan-out
      # after 55 minutes of continuous firing. Opt-in per rule
      # (see the runbook for the candidate list); default
      # warnings stay Tier 2 only.
      - matchers:
          - name: severity
            value: warning
          - name: escalate_after
            value: "1h"
        receiver: approval-channel-alert
        groupWait: 55m       # give the operator a chance to see + ack the ntfy first
        groupInterval: 15m
        repeatInterval: 4h
        continue: true       # also fall through to ntfy-direct via default

      # (no explicit Tier 2 route needed — anything not matched
      # above falls through to the default receiver = ntfy-direct.)

  receivers:
    # ===== Tier 3 sink =====
    - name: 'null'

    # ===== Tier 2 sink — direct ntfy (non-E2EE) =====
    # POSTs Alertmanager's webhook JSON to the cluster ntfy
    # server's topic URL. ntfy accepts arbitrary JSON as the
    # message body when Content-Type: application/json is set
    # (per docs.ntfy.sh/publish); we let the summary string
    # surface via the ntfy `X-Title` / `X-Priority` header
    # mechanism if a future value bump wires that in. For now
    # the raw AM JSON is what lands — parseable in the F-Droid
    # app's message view.
    #
    # Auth: bearer token seeded by the operator per the
    # alert-routing runbook §"Ntfy topic setup". Not the same
    # token as ntfy-e2ee-relay's inbound-auth (which the
    # relay uses to talk to *this* AM's webhook path).
    #
    # If the operator has NOT yet seeded kv/ntfy/am-direct-token,
    # ExternalSecret in inbound-tokens-externalsecret.yaml
    # renders `ntfy-am-direct` empty and AM's webhook 401s
    # into a retry loop. Not damaging (retries are cheap;
    # critical alerts still deliver via ntfy-via-relay +
    # approval-channel), but the AM logs will complain.
    # TODO(operator): seed kv/ntfy/am-direct-token per the
    # alert-routing runbook before merging this file.
    - name: ntfy-direct
      webhookConfigs:
        - url: http://ntfy.ntfy.svc.cluster.local/homelab-alerts-warning
          sendResolved: true
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: am-inbound-tokens
                key: ntfy-am-direct

    # ===== Tier 1 sink A — direct ntfy (topic homelab-alerts) =====
    # Was: `ntfy-via-relay` routed through ntfy-e2ee-relay
    # for AES-256-GCM encryption. Removed 2026-07-12 because
    # (a) Phase-2 CF-Tunnel-fronted ntfy — the E2EE gating
    # condition — never happened; (b) the relay's custom wire
    # format isn't F-Droid-decryptable, so the phone showed
    # ciphertext. Reverted to direct publish; same shape as
    # the Tier-2 `ntfy-direct` receiver, different topic.
    #
    # Auth: reuses the `am-direct` ntfy user (same as Tier 2)
    # via the `ntfy-am-direct` key of `am-inbound-tokens`.
    # `am-direct` was granted write-only on both topics
    # 2026-07-12; one user covers both tiers.
    - name: ntfy-critical
      webhookConfigs:
        - url: http://ntfy.ntfy.svc.cluster.local/homelab-alerts
          sendResolved: true
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: am-inbound-tokens
                key: ntfy-am-direct

    # ===== Tier 1 sink B — Signal via approval-channel =====
    - name: approval-channel-alert
      webhookConfigs:
        - url: http://approval-channel.approval-channel.svc.cluster.local:8000/v1/alert
          sendResolved: true
          # Alertmanager retries on 5xx; approval-channel
          # returns 502 if signal-bridge is unreachable.
          # That gives the durability layer.
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: am-inbound-tokens
                key: approval-channel

    # ===== Deception sink — Signal (dedicated) =====
    - name: approval-channel-deception
      webhookConfigs:
        - url: http://approval-channel.approval-channel.svc.cluster.local:8000/v1/deception
          sendResolved: true
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: am-inbound-tokens
                key: approval-channel

  inhibitRules:
    # critical inhibits warning for the same (alertname,
    # namespace) — avoid double-paging.
    - sourceMatch:
        - name: severity
          value: critical
      targetMatch:
        - name: severity
          value: warning
      equal: [alertname, namespace]

    # InstanceDown / NodeNotReady inhibit other alerts for
    # that instance — the instance being down explains the
    # secondaries.
    - sourceMatch:
        - name: alertname
          value: InstanceDown
      targetMatch: []
      equal: [instance]
    - sourceMatch:
        - name: alertname
          value: NodeNotReady
      targetMatch: []
      equal: [node]
