# Grafana admin credentials from OpenBao.
#
# OpenBao path layout:
#   kv/data/grafana/admin:
#     user:     <username, default "admin">
#     password: <strong random, openssl rand -base64 32>
#
# Operator generates at first-install bootstrap; rotation is
# annual (or on suspicion-of-compromise) — TBD runbook
# pattern matches the pre-existing
# `homelab-k8s/apps/ntfy/README §First-install seed` shape.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kube-prometheus-stack-grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: kube-prometheus-stack-grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana/admin
        property: user
    - secretKey: admin-password
      remoteRef:
        key: grafana/admin
        property: password

---
# Grafana OIDC client credentials from Authentik. Operator
# provisions via:
#   homelab-infra/scripts/provision-authentik-oidc-client.sh \
#       --app-name grafana \
#       --redirect-uri "https://grafana.lab.vyramo.com/login/generic_oauth" \
#       --scopes "openid email profile groups" \
#       --kv-path kv/grafana/oidc
#
# Until provisioned: ESO emits the Secret with empty fields;
# Grafana's `auth.generic_oauth.enabled: false` keeps it
# inert. Operator flips `enabled: true` in values.yaml +
# pushes after the OIDC client is created.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-oidc
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: grafana/oidc
        property: client_id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: grafana/oidc
        property: client_secret
