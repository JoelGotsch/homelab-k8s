# Grafana admin credentials from OpenBao.
#
# OpenBao path layout:
#   kv/data/grafana/admin:
#     user:     <username, default "admin">
#     password: <strong random, openssl rand -base64 32>
#
# Operator generates at first-install bootstrap; rotation is
# annual (or on suspicion-of-compromise) — TBD runbook
# pattern matches the pre-existing
# `homelab-k8s/apps/ntfy/README §First-install seed` shape.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kube-prometheus-stack-grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: kube-prometheus-stack-grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana/admin
        property: user
    - secretKey: admin-password
      remoteRef:
        key: grafana/admin
        property: password

# Future: when Authentik OIDC integration enables for
# Grafana per values.yaml's commented-out grafana.ini block,
# add a second ExternalSecret here for the OAuth2 client
# secret at kv/grafana/oauth/client-secret.
