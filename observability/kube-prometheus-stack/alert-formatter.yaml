# alert-formatter is the single operational-alert delivery owner.
# Alertmanager posts one grouped webhook here. The mounted alert_router.py
# formats and publishes to ntfy; only a synchronous ntfy error opens the
# one-way Signal fallback through approval-channel. If both fail, the router
# returns 502 and Alertmanager retains/retries the notification.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-formatter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alert-formatter
spec:
  # First rollout stays at one replica per the minimal-blast-radius rule. Scale
  # only after an uncached-node image pull and a live fallback drill are proven.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-formatter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-formatter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: formatter
          # stdlib-only runtime; digest-pinned for reproducibility. The source
          # and machine-readable channel policy are generated into the mounted
          # ConfigMap by this layer's kustomization.
          image: docker.io/library/python:3.12-slim@sha256:423ed6ab25b1921a477529254bfeeabf5855151dc2c3141699a1bfc852199fbf
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/alert_router.py"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NTFY_BASE_URL
              value: http://ntfy.ntfy.svc.cluster.local
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: am-inbound-tokens
                  key: ntfy-am-direct
            - name: SIGNAL_FALLBACK_BASE_URL
              value: http://approval-channel.approval-channel.svc.cluster.local:8000
            - name: SIGNAL_FALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: am-inbound-tokens
                  key: approval-channel
            - name: NOTIFICATION_CHANNEL_POLICY_PATH
              value: /app/notification-channel-policy.json
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 30
          readinessProbe:
            # Readiness validates that the router process and policy loaded.
            # It deliberately does not require ntfy: ntfy failure is the state
            # in which this pod must remain ready to provide Signal fallback.
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: script
          configMap:
            name: alert-formatter-script
---
apiVersion: v1
kind: Service
metadata:
  name: alert-formatter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alert-formatter
spec:
  selector:
    app.kubernetes.io/name: alert-formatter
  ports:
    - port: 8080
      targetPort: http
      name: http
---
# Only Alertmanager can submit alerts. The router can resolve DNS, publish to
# ntfy, and call approval-channel's one-way fallback endpoint—nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alert-formatter-allow
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alert-formatter
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ntfy
      ports:
        - port: 80
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: approval-channel
          podSelector:
            matchLabels:
              app.kubernetes.io/name: approval-channel
      ports:
        - port: 8000
          protocol: TCP
