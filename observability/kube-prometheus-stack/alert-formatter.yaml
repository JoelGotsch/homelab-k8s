# alert-formatter is the single operational-alert delivery owner.
# Alertmanager posts one grouped webhook here. The mounted alert_router.py
# records and publishes to ntfy; only a synchronous ntfy error opens the
# one-way Signal fallback through approval-channel. Explicit downstream
# rejection returns 502 for Alertmanager retry. Ambiguous outcomes return 503
# and remain pinned in the ledger until operator reconciliation.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-formatter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alert-formatter
  annotations:
    # One-resource transition exception. The live API-defaulted rollingUpdate
    # map cannot be cleared in the same request that selects Recreate through
    # SSA, even with an explicit null deletion signal. Argo CD 3.4 supports
    # overriding application-level SSA per resource, so use client-side apply
    # for this Deployment's three-way merge. Keep rollingUpdate:null below;
    # reassess/remove this exception only after live convergence is proven.
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  # First rollout stays at one replica per the minimal-blast-radius rule. Scale
  # only after an uncached-node image pull and a live fallback drill are proven.
  replicas: 1
  # The SQLite delivery ledger is single-writer state on an RWO PVC. Recreate
  # prevents a rolling update from starting two writers or hitting a Longhorn
  # multi-attach race. Alertmanager retains/retries during the short handoff.
  strategy:
    type: Recreate
    # The live Deployment was created with the default RollingUpdate strategy,
    # so the API stores a non-null rollingUpdate block. Server-side apply does
    # not delete that unowned/defaulted field merely because desired YAML omits
    # it; the resulting Recreate + rollingUpdate combination fails admission.
    # Preserve this explicit null in the apply payload as the SSA deletion
    # signal. The API response then contains Recreate with no rollingUpdate.
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-formatter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-formatter
    spec:
      # The router does not call the Kubernetes API. Do not mount an
      # unnecessary default-ServiceAccount bearer token into a process that
      # legitimately holds both notification-channel credentials.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: formatter
          # stdlib-only runtime; digest-pinned for reproducibility. The source
          # and machine-readable channel policy are generated into the mounted
          # ConfigMap by this layer's kustomization.
          image: docker.io/library/python:3.12-slim@sha256:423ed6ab25b1921a477529254bfeeabf5855151dc2c3141699a1bfc852199fbf
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/alert_router.py"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NTFY_BASE_URL
              value: http://ntfy.ntfy.svc.cluster.local
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: am-inbound-tokens
                  key: ntfy-am-direct
            - name: SIGNAL_FALLBACK_BASE_URL
              value: http://approval-channel.approval-channel.svc.cluster.local:8000
            - name: SIGNAL_FALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: am-inbound-tokens
                  key: approval-channel
            - name: NOTIFICATION_CHANNEL_POLICY_PATH
              value: /app/notification-channel-policy.json
            - name: ALERT_ROUTER_STATE_PATH
              value: /var/lib/alert-router/delivery-ledger.sqlite3
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: state
              mountPath: /var/lib/alert-router
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 30
          readinessProbe:
            # Readiness validates the policy and writable delivery ledger.
            # It deliberately does not require ntfy: ntfy failure is the state
            # in which this pod must remain ready to provide Signal fallback.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: script
          configMap:
            name: alert-formatter-script
        - name: state
          persistentVolumeClaim:
            claimName: alert-formatter-state
---
# Durable attempt/outcome and outage-episode ledger. It contains hashes,
# timestamps and normalized outcomes, never alert bodies or credentials.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alert-formatter-state
  namespace: monitoring
  annotations:
    # Bind durable state before Recreate stops the existing stateless pod.
    argocd.argoproj.io/sync-wave: "-1"
    # A Git rollback must not silently erase unresolved delivery evidence.
    # Require an attended prune decision even though the backing PV is Retain.
    argocd.argoproj.io/sync-options: Prune=confirm
    retention.homelab.internal/reason: >-
      Alert delivery attempt and ambiguity ledger; loss can cause a blind
      duplicate or suppress the only known Signal fallback outcome.
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-replica2-retain
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alert-formatter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alert-formatter
spec:
  selector:
    app.kubernetes.io/name: alert-formatter
  ports:
    - port: 8080
      targetPort: http
      name: http
---
# Only Alertmanager can submit alerts. The router can resolve DNS, publish to
# ntfy, and call approval-channel's one-way fallback endpoint—nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alert-formatter-allow
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alert-formatter
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ntfy
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ntfy
      ports:
        - port: 80
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: approval-channel
          podSelector:
            matchLabels:
              app.kubernetes.io/name: approval-channel
      ports:
        - port: 8000
          protocol: TCP
