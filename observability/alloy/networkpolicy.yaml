# Alloy NetworkPolicy.
#
# Ingress: Prometheus self-metrics scrape (port 12345 by
#   chart default).
# Egress: kube-DNS + Loki + kube-API (for pod discovery).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-allow
  namespace: observability-alloy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes: [Ingress, Egress]
  ingress:
    # Prometheus self-metrics scrape (cross-ns: KPS lives in
    # monitoring, alloy now in observability-alloy per ADR 0036).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 12345
          protocol: TCP
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # kube-API egress is NOT here — a vanilla podSelector can't
    # match the socket-LB-DNAT'd apiserver (rule 12). It lives in
    # ciliumnetworkpolicy-egress.yaml as `toEntities:
    # [kube-apiserver]`. loki.source.kubernetes streams pod logs
    # through the apiserver, so without that CNP alloy ships zero
    # logs even though its pods are healthy.
    # Loki push — cross-ns (Loki in monitoring).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - port: 3100
          protocol: TCP
