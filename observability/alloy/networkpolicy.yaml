# Alloy NetworkPolicy.
#
# Ingress: Prometheus self-metrics scrape (port 12345 by
#   chart default).
# Egress: kube-DNS + Loki + kube-API (pod discovery only — the log
#   bytes are read from the node's /var/log/pods since 2026-09-14).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-allow
  namespace: observability-alloy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes: [Ingress, Egress]
  ingress:
    # Prometheus self-metrics scrape (cross-ns: KPS lives in
    # monitoring, alloy now in observability-alloy per ADR 0036).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 12345
          protocol: TCP
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # kube-API egress is NOT here — a vanilla podSelector can't
    # match the socket-LB-DNAT'd apiserver (rule 12). It lives in
    # ciliumnetworkpolicy-egress.yaml as `toEntities:
    # [kube-apiserver]`. discovery.kubernetes needs it for pod
    # metadata (namespace/pod/container/node labels and the log
    # file path); without that CNP alloy discovers no targets and
    # ships zero logs even though its pods are healthy. Since
    # 2026-09-14 the log bytes themselves are tailed from
    # /var/log/pods, not streamed through the apiserver.
    # Loki push — cross-ns (Loki in monitoring).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - port: 3100
          protocol: TCP
