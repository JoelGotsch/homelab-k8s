# Alloy DaemonSet values. Per ADR 0021 D2.
#
# Ships:
# - Pod logs, tailed from the node's /var/log/pods (Kubernetes-discovered,
#   this node only), CRI-parsed, to Loki via loki.write.
# - Log-derived Prometheus series for two CronJobs (branches below).
#
# No journald: Talos has none (see the Node/system logs NOTE below).

# DaemonSet — one Alloy pod per node, including CP nodes
# (so the audit-log path is captured everywhere).
controller:
  type: daemonset
  tolerations:
    - effect: NoSchedule
      operator: Exists
    - effect: NoExecute
      operator: Exists
  # readOnlyRootFilesystem: true (securityContext below) makes the
  # image root FS read-only, but alloy writes its remotecfg cache +
  # storagePath (/tmp/alloy) under /tmp. Back /tmp with a writable
  # emptyDir so `mkdir /tmp/alloy` succeeds without loosening the
  # hardened root FS.
  volumes:
    extra:
      - name: tmp
        emptyDir: {}

alloy:
  # Alloy config — flow-language (River syntax). Inline here
  # rather than a separate file because the config is
  # compact + the values.yaml is the single GitOps source.
  configMap:
    create: true
    content: |-
      // ---------- Discovery ----------

      // Discover Kubernetes pods on this node. The apiserver is still
      // needed for THIS (pod metadata -> Loki labels); it is no longer
      // the path the log bytes take.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      // Standard k8s pod-log relabeling: namespace + pod + container (+
      // node, app, component) become Loki stream labels, and __path__
      // names the CRI log file the kubelet writes for that container.
      //
      // The pod role emits one target per declared container PORT (and one
      // for a port-less container), so a container with two ports appears
      // twice here with the same __path__ and the same visible labels.
      // loki.source.file keys its tailers on (path, non-__ labels), so the
      // duplicate collapses to one reader — measured 2026-09-14 with two
      // such targets against one file: 3 entries in, 3 out,
      // loki_source_file_files_active_total = 1.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          target_label  = "component"
        }
        // /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log on
        // Talos (verified on worker1, 2026-09-14). The glob is the one the
        // local.file_match reference gives. `<n>` is the container's
        // restart count, so `*.log` matches EVERY incarnation still on
        // disk (0.log, 1.log, ...) and not the kubelet's rotated
        // `0.log.<stamp>[.gz]` files. With `filename` dropped below, the
        // incarnations of one container share one Loki stream and are read
        // in parallel, so on a positions-less start the older file's lines
        // arrive after the newer file's head and Loki refuses them —
        // `entry too far behind, oldest acceptable timestamp is <stream
        // head - max_chunk_age/2>` (400; seen on the 2026-09-14 switch,
        // 18 batches on worker1 in ten minutes, all from files dated
        // before the current incarnation). Those lines predate the running
        // container and never reached Loki under loki.source.kubernetes
        // either, so nothing is lost relative to before; in steady state a
        // restart's new file is newer than the old one's tail and the
        // problem does not arise. Note loki_write_dropped_entries_total
        // counts the whole batch when one entry is refused, while Loki has
        // already stored the batch's valid entries — read the error lines,
        // not that counter, to size the loss.
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      // ---------- Pod log source ----------
      //
      // 2026-09-14: loki.source.file over the node's /var/log/pods replaces
      // loki.source.kubernetes. The latter streamed every container's
      // stdout THROUGH the kube-apiserver (`kubectl logs -f` semantics):
      // ~54 open CONNECT pods/log streams per apiserver, ~160 across the
      // three, reconnecting 2.7 times a second cluster-wide — every log
      // byte crossed the control plane twice. The files are already on the
      // node and already mounted (mounts.varlog below, read-only); Alloy
      // runs as root (securityContext), which the 0640 root:root files
      // require. Same label set as before minus loki.source.kubernetes's
      // own `job`/`instance` (no dashboard or rule read them — grep of
      // observability/grafana-dashboards and every PrometheusRule,
      // 2026-09-14), plus `node` and the CRI `stream`.
      //
      // Positions live under storagePath (/tmp/alloy, an emptyDir), so a
      // restarted Alloy has no positions and re-reads every file from the
      // start. That is the deliberate choice over tail_from_end = true,
      // which would also start NEW files at their end and lose the first
      // ~10 s (one sync_period) of every new pod — the crash-loop start-up
      // lines are the ones worth having, and the reboot-cascade janitor's
      // Job pods live shorter than that window. Loki's query path drops
      // exact duplicates (same stream, timestamp and line), so the re-read
      // costs ingest bandwidth, not correctness; stage.drop older_than in
      // loki.process "pods" keeps re-read lines outside Loki's 168h
      // reject_old_samples window from becoming 400s. Persisting positions
      // on a node hostPath is a separate, privilege-widening decision
      // (TODO hl-0306).
      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        // Every entry goes to Loki AND through the janitor_metrics and
        // backup_metrics branches below. The branches forward nothing, so
        // they cannot change what Loki stores; they only derive metrics.
        forward_to = [loki.write.default.receiver, loki.process.janitor_metrics.receiver, loki.process.backup_metrics.receiver]

        // CRI log lines: `<RFC3339Nano> <stdout|stderr> <F|P> <message>`.
        // Sets the entry timestamp from the first field, joins P (partial)
        // continuations into one entry, promotes `stream` to a label and
        // leaves only the message as the line — so every selector and regex
        // below sees exactly what loki.source.kubernetes used to deliver,
        // minus the trailing newline (see the regex notes in the branches).
        stage.cri {}

        // loki.source.file adds the absolute file path as `filename`. It
        // carries the pod UID, so it adds no stream cardinality beyond
        // `pod`, only index bytes; dropped.
        stage.label_drop {
          values = ["filename"]
        }

        // A re-read after an Alloy restart (positions are on an emptyDir,
        // see above) replays lines up to the kubelet's rotation depth; Loki
        // rejects anything older than reject_old_samples_max_age (168h
        // default, not overridden in observability/loki/values.yaml) with a
        // 400 per batch. Drop them here instead, counted under
        // loki_process_dropped_lines_total{reason="too_old"}.
        stage.drop {
          older_than          = "168h"
          drop_counter_reason = "too_old"
        }

        // Drop k8s probe-noise (kubelet healthcheck pings)
        // — high volume, low signal.
        stage.match {
          selector = "{container=~\".*\"} |~ \"GET /healthz\""
          action   = "drop"
        }
      }

      // ---------- Log-derived metrics: reboot-cascade-janitor ----------
      //
      // The janitor (infrastructure/reboot-cascade-janitor) is a */5
      // CronJob that deletes pods. A Job cannot be scraped, this
      // estate has no Pushgateway by decision (ADR 0062) and Talos has
      // no textfile collector — but Alloy already tails the Job's
      // stdout, so the janitor prints one machine-readable
      //   [metric] <name> k=v ...
      // line per remediation and per run, and this branch turns them
      // into series on Alloy's own /metrics (scraped by the sibling
      // ServiceMonitor). The line format is a contract with the
      // janitor manifest and with its fixture scenarios 15/16.
      //
      // `forward_to = []`: a pure sink. The label_drop stages below
      // rewrite labels for the METRIC only; nothing here reaches Loki,
      // and the parent `loki.process "pods"` still ships the unmodified
      // entry. Dropping the janitor pod's own stream labels is what
      // keeps the series stable across ticks: every tick is a new Job
      // pod, and a counter that restarts at 1 under a new `pod` label
      // every 5 minutes would never increase — Prometheus does not
      // count a series' first sample as an increase from zero.
      //
      // Counter lifetime (max_idle_duration = 1h) is part of the
      // alert semantics in kube-prometheus-stack/janitor-rules.yaml:
      // `janitor_remediation_total` only exists while the janitor is
      // still touching that target, and disappears an hour after the
      // last remediation. The gauges expire the same way, which is
      // what lets JanitorNotRunning use absent().
      loki.process "janitor_metrics" {
        forward_to = []

        stage.match {
          selector = "{namespace=\"reboot-cascade-janitor\"} |= \"[metric] janitor_remediation_total \""

          stage.regex {
            expression = "^\\[metric\\] janitor_remediation_total signature=(?P<signature>\\S+) action=(?P<action>\\S+) target_namespace=(?P<target_namespace>\\S+) target_pod=(?P<target_pod>\\S+) node=(?P<node>\\S+) dry_run=(?P<dry_run>\\S+)$"
          }

          stage.label_drop {
            values = ["namespace", "pod", "container", "node", "stream", "app", "component", "job", "instance"]
          }

          stage.labels {
            values = {
              signature        = "",
              action           = "",
              target_namespace = "",
              target_pod       = "",
              node             = "",
              dry_run          = "",
            }
          }

          stage.metrics {
            metric.counter {
              name              = "remediation_total"
              prefix            = "janitor_"
              description       = "Remediations the reboot-cascade janitor planned (dry_run=true) or executed, by signature, action and target pod."
              // source + no match_all: a line the regex did not parse
              // has no `action` key and is NOT counted, so format drift
              // shows as a missing series rather than an unlabelled one.
              source            = "action"
              action            = "inc"
              max_idle_duration = "1h"
            }
          }
        }

        stage.match {
          selector = "{namespace=\"reboot-cascade-janitor\"} |= \"[metric] janitor_state_streak \""

          stage.regex {
            expression = "^\\[metric\\] janitor_state_streak node=(?P<node>\\S+) value=(?P<value>[0-9]+)$"
          }

          stage.label_drop {
            values = ["namespace", "pod", "container", "node", "stream", "app", "component", "job", "instance"]
          }

          stage.labels {
            values = {
              node = "",
            }
          }

          stage.metrics {
            metric.gauge {
              name              = "state_streak"
              prefix            = "janitor_"
              description       = "Consecutive ticks on which signature B survived the janitor's cheap fix on this node (the escalation-ladder rung); 0 = ladder idle or just reset."
              source            = "value"
              action            = "set"
              // Short: each tick may land on a different node, so the
              // gauge lives in whichever Alloy saw it last. 15m (three
              // ticks) bounds how long a stale reading can outlive the
              // fresh one under `max by (node)`.
              max_idle_duration = "15m"
            }
          }
        }

        stage.match {
          selector = "{namespace=\"reboot-cascade-janitor\"} |= \"[metric] janitor_run_timestamp_seconds \""

          stage.regex {
            expression = "^\\[metric\\] janitor_run_timestamp_seconds value=(?P<value>[0-9]+)$"
          }

          stage.label_drop {
            values = ["namespace", "pod", "container", "node", "stream", "app", "component", "job", "instance"]
          }

          stage.metrics {
            metric.gauge {
              name              = "run_timestamp_seconds"
              prefix            = "janitor_"
              description       = "Unix time at which the reboot-cascade janitor last completed a run."
              source            = "value"
              action            = "set"
              max_idle_duration = "1h"
            }
          }
        }

        stage.match {
          selector = "{namespace=\"reboot-cascade-janitor\"} |= \"[metric] janitor_run_duration_seconds \""

          stage.regex {
            expression = "^\\[metric\\] janitor_run_duration_seconds value=(?P<value>[0-9]+)$"
          }

          stage.label_drop {
            values = ["namespace", "pod", "container", "node", "stream", "app", "component", "job", "instance"]
          }

          stage.metrics {
            metric.gauge {
              name              = "run_duration_seconds"
              prefix            = "janitor_"
              description       = "Wall-clock seconds the last reboot-cascade janitor run took."
              source            = "value"
              action            = "set"
              max_idle_duration = "1h"
            }
          }
        }
      }

      // ---------- Log-derived metrics: backup-cronjobs ----------
      //
      // Same mechanism as janitor_metrics, for the daily Storage Box fill
      // check (infrastructure/backup-cronjobs/storagebox-fill-check-cronjob.yaml),
      // which prints
      //   [metric] storagebox_df size_bytes=N used_bytes=N avail_bytes=N
      // The alerts that read these gauges are in
      // infrastructure/backup-cronjobs/prometheusrule-footprint.yaml.
      //
      // The regex ends in `\\s*$`, not `$`. It was written for
      // loki.source.kubernetes, which handed each entry over WITH its
      // trailing newline (an RE2 `$` does not match before it — replayed
      // through Alloy v1.19.2 on 2026-09-11: `)$` produced no series,
      // `)\\s*$` all three). loki.source.file + stage.cri (2026-09-14)
      // deliver the line without it, so `$` alone now matches too — which
      // is what makes the `$`-anchored janitor stages above work for the
      // first time (TODO hl-0262). `\\s*$` is kept: it is correct for both
      // sources, and a regex that tolerates the newline costs nothing.
      //
      // The selector names the check's app label, so another pod in the
      // namespace printing a similar line cannot set the gauges.
      //
      // max_idle_duration = "1h": a gauge only has to live until Prometheus
      // has scraped it. The alerts read it with last_over_time(...[26h]),
      // which carries one daily reading to the next and across an Alloy
      // restart, while the short expiry keeps yesterday's series (possibly
      // on another node's Alloy) from lingering beside today's.
      loki.process "backup_metrics" {
        forward_to = []

        stage.match {
          selector = "{namespace=\"backup-cronjobs\", app=\"storagebox-fill-check\"} |= \"[metric] storagebox_df \""

          stage.regex {
            expression = "^\\[metric\\] storagebox_df size_bytes=(?P<size>[0-9]+) used_bytes=(?P<used>[0-9]+) avail_bytes=(?P<avail>[0-9]+)\\s*$"
          }

          stage.label_drop {
            values = ["namespace", "pod", "container", "node", "stream", "app", "component", "job", "instance"]
          }

          stage.metrics {
            metric.gauge {
              name              = "size_bytes"
              prefix            = "storagebox_"
              description       = "Hetzner Storage Box quota size in bytes, from the daily df over SSH."
              source            = "size"
              action            = "set"
              max_idle_duration = "1h"
            }
            metric.gauge {
              name              = "used_bytes"
              prefix            = "storagebox_"
              description       = "Hetzner Storage Box bytes used, from the daily df over SSH."
              source            = "used"
              action            = "set"
              max_idle_duration = "1h"
            }
            metric.gauge {
              name              = "avail_bytes"
              prefix            = "storagebox_"
              description       = "Hetzner Storage Box bytes still available under the quota, from the daily df over SSH."
              source            = "avail"
              action            = "set"
              max_idle_duration = "1h"
            }
          }
        }
      }

      // ---------- kube-apiserver audit log (control planes) ----------
      //
      // 2026-09-14. Talos writes the apiserver audit log to
      // /var/log/audit/kube/kube-apiserver.log — one audit.k8s.io/v1 Event
      // per line, rotated by the apiserver itself (--audit-log-maxsize=100
      // --audit-log-maxbackup=10 --audit-log-maxage=30, Talos defaults).
      // Until today nothing read it and, under the Talos default policy,
      // the ring held ~2 h; with homelab-infra's kube-apiserver-audit-policy
      // patch it holds days, and this source makes Loki the archive. The
      // directory exists on every node (empty on workers), so the match is
      // simply empty there.
      //
      // The ACTIVE file only, not `*.log`: the apiserver rotates by renaming
      // to kube-apiserver-<stamp>.log and the tailer follows the renamed
      // inode to EOF before reopening the new one. A glob over the backups
      // would hand every rotated file a second reader from byte 0 on each
      // positions-less restart (see the pods source: positions live on an
      // emptyDir) — 10 × 100 MB of duplicates per control plane.
      //
      // Files are 0600 nobody:nogroup in a 0700 directory. Root with every
      // capability dropped cannot even stat them (verified from the running
      // pods, 2026-09-14: `[ -f …/kube-apiserver.log ]` false, CapPrm all
      // zero), hence CAP_DAC_READ_SEARCH in securityContext below — read
      // and search only, no write bypass, and the mount is read-only anyway.
      //
      // Stream labels are `job` and `node` — nothing else. verb, user,
      // resource, code, stage and level go into STRUCTURED METADATA (Loki
      // 3.x, schema v13 in observability/loki/values.yaml), so
      //   {job="kube-apiserver-audit"} | user="admin" | verb="delete"
      // works without user × resource × verb × code becoming streams: the
      // user set alone is unbounded (every ServiceAccount) and would have
      // been thousands of streams per node.
      local.file_match "apiserver_audit" {
        path_targets = [{
          __path__ = "/var/log/audit/kube/kube-apiserver.log",
          job      = "kube-apiserver-audit",
          node     = sys.env("HOSTNAME"),
        }]
      }

      loki.source.file "apiserver_audit" {
        targets    = local.file_match.apiserver_audit.targets
        forward_to = [loki.process.apiserver_audit.receiver]
      }

      loki.process "apiserver_audit" {
        forward_to = [loki.write.default.receiver]

        // The path is the same on every control plane; `node` names it.
        stage.label_drop {
          values = ["filename"]
        }

        // stageTimestamp is when the apiserver finished the stage. Using it
        // as the entry time puts a re-read after an Alloy restart at the
        // right instant instead of "now"; Loki de-duplicates the replay.
        stage.json {
          expressions = {
            ts       = "stageTimestamp",
            stage    = "stage",
            level    = "level",
            verb     = "verb",
            user     = "user.username",
            resource = "objectRef.resource",
            code     = "responseStatus.code",
          }
        }
        stage.timestamp {
          source = "ts"
          format = "RFC3339Nano"
        }
        stage.structured_metadata {
          values = {
            stage    = "",
            level    = "",
            verb     = "",
            user     = "",
            resource = "",
            code     = "",
          }
        }

        // Same reason as loki.process "pods": a positions-less restart can
        // replay the whole 100 MB active file, and anything older than
        // Loki's reject_old_samples window would be a 400 per batch. Dropped
        // here instead, counted under
        // loki_process_dropped_lines_total{reason="too_old"}.
        stage.drop {
          older_than          = "168h"
          drop_counter_reason = "too_old"
        }
      }

      // ---------- Node/system logs ----------
      // NOTE: no `loki.source.journal` here. Talos does not run
      // systemd-journald and has no /var/log/journal — the block
      // that used to live here hard-crashed alloy on startup
      // ("failed to open journal in directory /var/log/journal:
      // no such file or directory"), which is why alloy never ran
      // after the ADR-0036 move to observability-alloy. Talos
      // node/machine logs are captured node-locally by the
      // talos-log-sink Vector DaemonSet (machine.logging.
      // destinations → hostPath /var/log/talos-log-sink/), a
      // reboot-resilient store independent of Loki/Longhorn.
      // FOLLOW-UP (needs operator decision): if node logs should
      // also land in Loki, add a `local.file_match` +
      // `loki.source.file` over /var/log/talos-log-sink/*.log
      // instead of resurrecting journald — the pod-log source above
      // is the pattern to copy.

      // ---------- Loki client ----------

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
        // No authentication — single-tenant cluster,
        // NetworkPolicy gates ingress.
      }

  # Alloy tails /var/log/pods on each node and, on control planes,
  # /var/log/audit/kube (loki.source.file above). Read-only hostPath at
  # /var/log; the pod-log files are 0640 root:root, hence runAsUser: 0
  # below, and the audit files 0600 nobody:nogroup in a 0700 directory,
  # hence CAP_DAC_READ_SEARCH.
  mounts:
    varlog: true       # /var/log
    dockercontainers: false
    extra:
      - name: tmp
        mountPath: /tmp

  # Self-metrics — scraped by the chart-default-selector
  # ServiceMonitor (separate manifest).
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

  securityContext:
    runAsUser: 0  # /var/log/pods/*/*/*.log are 0640 root:root on Talos
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
      # Read + directory-search bypass only (no DAC_OVERRIDE: that would
      # also bypass write checks). Needed for /var/log/audit/kube, which is
      # 0700 nobody:nogroup with 0600 files; root without it gets EACCES
      # (verified 2026-09-14). The namespace is PSA `privileged`, so the
      # added capability is admitted; the hostPath is read-only regardless.
      add: [DAC_READ_SEARCH]

# Disable the chart's default ServiceMonitor — we ship our
# own with the right label.
serviceMonitor:
  enabled: false

# Disable the chart's CRDs subchart if it tries — we don't
# need them for log-shipping use case.
crds:
  create: false
