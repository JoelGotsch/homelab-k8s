# Alloy — log/metric/trace shipper. Per ADR 0021 D6.
#
# Replaces the older Promtail + Grafana Agent agents. DaemonSet
# scrapes pod logs from /var/log/pods + journald from each
# node, ships to Loki at observability/loki/.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: alloy
    # ADR 0052 D3: chart from the Forgejo Packages mirror (was https://grafana.github.io/helm-charts).
    repo: oci://registry.homelab.internal/homelab
    version: "1.10.1"  # OPERATOR PINS via Renovate
    releaseName: alloy
    namespace: observability-alloy
    valuesFile: values.yaml
    includeCRDs: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - ciliumnetworkpolicy-egress.yaml
  - servicemonitor.yaml
