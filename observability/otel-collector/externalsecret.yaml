# Langfuse OTel-ingest auth credentials for the gateway's
# basicauth extension. Per ADR 0028 D5.
#
# OpenBao path layout:
#   kv/data/langfuse/otel-ingest:
#     public_key:  Langfuse project's public key (operator
#                  generates at first Langfuse install via UI)
#     secret_key:  Langfuse project's secret key (paired)
#
# Operator-action at first install:
#   1. Langfuse web UI → Project → Settings → API Keys
#   2. Create a new API key pair (label e.g. "otel-collector
#      gateway")
#   3. Copy public + secret keys; write to OpenBao via:
#        bao kv put kv/langfuse/otel-ingest \
#          public_key=pk-lf-... secret_key=sk-lf-...
#   4. ESO syncs; gateway picks up via extraEnvsFrom.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-otel-ingest
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: langfuse-otel-ingest
    creationPolicy: Owner
  data:
    - secretKey: LANGFUSE_OTEL_PUBLIC_KEY
      remoteRef:
        key: langfuse/otel-ingest
        property: public_key
    - secretKey: LANGFUSE_OTEL_SECRET_KEY
      remoteRef:
        key: langfuse/otel-ingest
        property: secret_key
