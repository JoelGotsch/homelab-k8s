# OTel Collector — gateway Deployment.
# Per ADR 0021 D3: "OTel Collector DaemonSet+Deployment pair
# (agent mode on each node + gateway mode centrally)."
#
# This is the gateway. It receives OTLP from the per-node
# DaemonSet agents (values-agent.yaml) and forwards to Tempo
# today, plus Langfuse later (commented-with-TODO).

mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.111.0   # OPERATOR PINS via Renovate

replicaCount: 2  # HA on the gateway tier; agents fail-soft to either

# Inject Langfuse OTel-ingest credentials from the
# langfuse-otel-ingest Secret (ESO-managed; ExternalSecret
# in this layer pulls from kv/langfuse/otel-ingest).
extraEnvsFrom:
  - secretRef:
      name: langfuse-otel-ingest

# OpenTelemetry Collector configuration. Receives OTLP from
# agents, processes (batch + memory_limiter), exports to Tempo
# (and Langfuse when that lands).
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  processors:
    # Memory_limiter prevents the collector from OOMing under
    # spike load by dropping data when memory pressure rises.
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 25
    # Batch processor amortizes export overhead. 200ms timeout
    # is the standard balance between latency + throughput.
    batch:
      timeout: 200ms
      send_batch_size: 8192
    # Keep only LLM-shaped spans on the LANGFUSE path.
    #
    # Langfuse is an LLM-observability store, not a general trace store
    # — that is Tempo's job, and Tempo keeps everything. Without this
    # filter every span the gateway emits becomes a Langfuse
    # observation, and most of them are not about a model at all.
    # Measured 2026-09-01, an hour after the pipeline first carried a
    # span: ~1020 spans/hour, dominated by `auth` spans from LiteLLM's
    # MCP tool-list polling (`call_type: /mcp-rest/tools/list`, one per
    # server per poll, no LLM call involved) plus `postgres`,
    # `batch_write_to_db`, `router`, `self` and `proxy_pre_call`. That
    # is ~24k observations a day of pure infrastructure noise in the
    # store meant for reading prompts.
    #
    # The filter processor DROPS a span when a condition is true, so
    # this reads as "drop unless". What survives:
    #
    #   * anything carrying a `gen_ai.*` model attribute — today the
    #     `litellm_request` GENERATION, tomorrow Pydantic-AI's
    #     `model.request` spans from todo-agents, without an edit here;
    #   * `litellm_request` by name as well, so a call that failed
    #     before a model was chosen still shows up rather than
    #     vanishing (a silent drop of the error case would be the worst
    #     possible filter bug);
    #   * the proxy's root span, but ONLY for `/v1/…` routes, so a
    #     Langfuse trace keeps its name, route and HTTP status while the
    #     `/mcp-rest/…` polls — the actual volume — are dropped whole.
    #
    # `raw_gen_ai_request` is deliberately NOT kept: it is a second copy
    # of the same prompt and completion, and the generation already
    # carries both as its input/output.
    filter/langfuse-llm-only:
      error_mode: ignore
      traces:
        span:
          - >-
            attributes["gen_ai.request.model"] == nil
            and attributes["gen_ai.response.model"] == nil
            and name != "litellm_request"
            and not (name == "Received Proxy Server Request"
                     and IsMatch(attributes["url.path"], "^/v1/"))
    # Strip LLM message content on the TEMPO path only.
    #
    # ADR 0003 gates location by classification, and the namespace
    # labels are explicit: `langfuse` is `personal`, while
    # `observability-tempo` and `monitoring` are `internal`. A
    # gateway span carries the full prompt and completion —
    # `llm.openai.messages` held a verbatim user prompt in the first
    # traced request on 2026-09-01 — so exporting the same span to
    # both backends would put `personal` content into an `internal`
    # store, and Tempo persists to its own object storage with its
    # own retention and DR path.
    #
    # So the fan-out is asymmetric by design: Langfuse gets the
    # content (that is what it is for, and its namespace is
    # classified for it), Tempo gets the shape — service, model,
    # latency, token counts, status — and none of the text. This is
    # exactly the backend-specific shaping ADR 0028 D5 says belongs
    # in the COLLECTOR rather than in workload config.
    #
    # Denylist, not allowlist, because the attribute set grows with
    # every LiteLLM release; it covers today's `llm.openai.*` names,
    # the `gen_ai.*` semantic conventions LiteLLM emits once the
    # StandardLoggingPayload is intact, and the span EVENTS used by
    # the collector-convention capture mode (`EVENT_ONLY` /
    # `SPAN_AND_EVENT`), which carry the same text somewhere else.
    transform/strip-llm-content:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            - delete_matching_keys(attributes, "^(gen_ai\\.(prompt|completion|input|output|system_instructions)|llm\\.(openai\\.(messages|choices|extra_body)|prompts|completions)|input|output)")
        - context: spanevent
          statements:
            - delete_matching_keys(attributes, "^(gen_ai\\.(prompt|completion|input|output|system_instructions)|llm\\.(openai\\.(messages|choices|extra_body)|prompts|completions)|input|output)")
  exporters:
    # Tempo receives OTLP gRPC on 4317.
    otlp/tempo:
      # Tempo runs in `observability-tempo`, not `monitoring`. The
      # original `tempo.monitoring.svc.cluster.local` resolved to
      # nothing; gRPC reported it as "name resolver error: produced
      # zero addresses" only once a span actually arrived
      # (2026-09-01 preflight).
      endpoint: tempo.observability-tempo.svc.cluster.local:4317
      tls:
        insecure: true   # cluster-internal HTTP
    # Langfuse OTLP — receives spans at /api/public/otel.
    # Per ADR 0028: workloads emit OTel-standard spans
    # (NOT the Langfuse-specific SDK); Langfuse maps GenAI
    # semantic conventions (gen_ai.*) to its data model.
    # Auth via basicauth extension; creds ESO-projected from
    # kv/langfuse/otel-ingest at first install.
    otlphttp/langfuse:
      endpoint: http://langfuse-web.langfuse.svc.cluster.local:3000/api/public/otel
      # Langfuse ingests in real time only when the request declares
      # the ingestion version; without it the span is accepted and
      # processed on the slower legacy path. The exporter appends
      # the signal path, so the effective URL is
      # …/api/public/otel/v1/traces.
      headers:
        x-langfuse-ingestion-version: "4"
      auth:
        authenticator: basicauth/langfuse
  extensions:
    # Required by the chart since 0.110.x — without it,
    # `helm template` fails with "The opentelemetry-collector
    # chart requires that the health_check extension to be
    # included in the extension list." The chart's bundled
    # liveness/readiness probes hit this endpoint.
    health_check:
      endpoint: 0.0.0.0:13133
    basicauth/langfuse:
      client_auth:
        username: ${env:LANGFUSE_OTEL_PUBLIC_KEY}
        password: ${env:LANGFUSE_OTEL_SECRET_KEY}
  service:
    extensions: [health_check, basicauth/langfuse]
    pipelines:
      # Two pipelines over one receiver, because the two backends are
      # classified differently (see transform/strip-llm-content).
      # Splitting here rather than at the workload keeps the emitter
      # unaware of either backend, per ADR 0028 D5.
      #
      # The Tempo path keeps the plain `traces` name deliberately: the
      # chart ships its OWN `traces` pipeline (otlp+jaeger+zipkin ->
      # `debug`) and values merge key-by-key, so a pipeline map named
      # anything else leaves that default in place — which would print
      # every span, prompt text included, to the collector's stdout and
      # from there to Loki in the `internal` monitoring namespace.
      # Naming one of ours `traces` replaces it outright.
      traces:
        receivers: [otlp]
        processors: [memory_limiter, transform/strip-llm-content, batch]
        exporters: [otlp/tempo]
      traces/langfuse:
        receivers: [otlp]
        processors: [memory_limiter, filter/langfuse-llm-only, batch]
        exporters: [otlphttp/langfuse]
    telemetry:
      metrics:
        address: 0.0.0.0:8888

# Self-metrics scrape — chart's bundled ServiceMonitor doesn't
# match our release-label convention; ship our own at
# servicemonitor.yaml.
serviceMonitor:
  enabled: false

# Ports exposed by the chart's Service. Match what the agent
# DaemonSet sends to.
ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true

# Disable chart-default NetworkPolicy; we ship explicit ones
# in networkpolicy.yaml.
networkPolicy:
  enabled: false
