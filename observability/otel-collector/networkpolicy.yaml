# OTel Collector NetworkPolicies.
#
# Two policies — gateway and agent — selecting on the chart's
# `app.kubernetes.io/instance` label (the Helm release name).
#
# NOT `app.kubernetes.io/component`: the opentelemetry-collector
# chart never sets it. Its pods carry `app.kubernetes.io/name:
# opentelemetry-collector`, `app.kubernetes.io/instance: <release>`
# and an unprefixed `component: standalone-collector` (gateway) or
# `component: agent-collector` (DaemonSet). Every selector here
# used to name a label that does not exist, so BOTH policies
# selected zero pods and enforced nothing, while reading as if the
# collectors were confined. Found 2026-09-01, when the first span
# ever pushed through this pipeline was dropped by Langfuse's
# ingress rule — which had the same defect and did apply.
#
# Gateway:
#   Ingress: from agents (4317/4318); from Prometheus (metrics).
#   Egress: kube-DNS + Tempo (4317).
#
# Agent (DaemonSet, one per node):
#   Ingress: from workloads in any namespace (workloads emit
#     OTLP via the local node's agent). Prometheus scrape too.
#   Egress: kube-DNS + gateway (4317).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-gateway
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: opentelemetry-collector-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    # OTel agents (DaemonSet) push OTLP to gateway.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
              app.kubernetes.io/instance: opentelemetry-collector-agent
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
    # Prometheus self-metrics scrape.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8888
          protocol: TCP
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Tempo (OTLP gRPC + HTTP). It runs in `observability-tempo`;
    # this rule had no namespaceSelector, which means "same
    # namespace", so it permitted nothing that exists. The
    # exporter endpoint carried the same wrong namespace.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-tempo
          podSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
    # Langfuse web (OTLP HTTP at /api/public/otel) in
    # langfuse ns. Per ADR 0028; LLM-specific tracing fans
    # out alongside Tempo.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: langfuse
          podSelector:
            matchLabels:
              app.kubernetes.io/name: langfuse
              app.kubernetes.io/component: web
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-agent
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: opentelemetry-collector-agent
  policyTypes: [Ingress, Egress]
  ingress:
    # Workloads in any namespace can push OTLP to the local
    # agent. Wildcard namespaceSelector — operator narrows
    # if a specific workload-set should be the only emitter.
    - from:
        - namespaceSelector: {}
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
    # Prometheus self-metrics scrape.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8888
          protocol: TCP
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Gateway in same ns.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
              app.kubernetes.io/instance: opentelemetry-collector-gateway
      ports:
        - port: 4317
          protocol: TCP
