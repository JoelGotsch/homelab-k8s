# Vector DaemonSet receiving Talos machine.logging.destinations
# output. One pod per node so node-local TCP writes (from the
# Talos config endpoint resolving to <service>:6514) land on
# the same-node pod via hostPort short-circuit.
#
# Tolerations: every taint, because we need a pod on every
# node — including control planes — to receive their kernel/
# machined streams.
#
# Image: Vector official, pinned. Renovate will bump.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: talos-log-sink
  namespace: monitoring
  labels:
    app.kubernetes.io/name: talos-log-sink
    app.kubernetes.io/component: receiver
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: talos-log-sink
  updateStrategy:
    # RollingUpdate with one-at-a-time so we don't lose all
    # node receivers simultaneously during an upgrade — at
    # least 5 of 6 nodes can still ship logs.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: talos-log-sink
        app.kubernetes.io/component: receiver
    spec:
      # Schedule on every node including CPs.
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      # No host networking — hostPort is enough and keeps the
      # blast radius bounded.
      containers:
        # Retention sidecar — tiered retention (2026-06-26
        # redesign):
        #
        #   recent-YYYY-MM-DD.log:   gzip after 1d, delete after 7d
        #   signal-YYYY-MM-DD.log:   gzip after 7d, delete after 90d
        #
        # Plus a size guard: if /sink > 20 GB on a node, drop the
        # oldest gzipped files first (defense against an amplification
        # event like the cp1 dead-endpoint loop discovered in #60).
        #
        # Daily loop. One pod per node via the DS — each pod prunes
        # the node-local hostPath its Vector peer writes to.
        - name: retention
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              SINK=/sink
              SIZE_CAP_BYTES=21474836480   # 20 GiB
              sleep 60
              while :; do
                # Tier 1 — recent (full fidelity, short retention).
                find $SINK -maxdepth 1 -name 'recent-*.log' -type f -mtime +1 -exec gzip -q {} \;
                find $SINK -maxdepth 1 -name 'recent-*.log.gz' -type f -mtime +7 -delete

                # Tier 2 — signal (warn+, long retention).
                find $SINK -maxdepth 1 -name 'signal-*.log' -type f -mtime +7 -exec gzip -q {} \;
                find $SINK -maxdepth 1 -name 'signal-*.log.gz' -type f -mtime +90 -delete

                # Legacy (pre-tiered) cleanup — files from the
                # original `talos-YYYY-MM-DD.log` naming.
                # Keep this loop body for ~30d after the redesign
                # then remove the line.
                find $SINK -maxdepth 1 -name 'talos-*.log' -type f -mtime +30 -delete 2>/dev/null || true

                # Size guard — defense against future amplification
                # events. Drop oldest gzipped files until under the
                # cap. Skips active .log files (Vector writes).
                while [ $(du -sb $SINK 2>/dev/null | cut -f1) -gt $SIZE_CAP_BYTES ]; do
                  OLDEST=$(ls -1tr $SINK/*.gz 2>/dev/null | head -1)
                  [ -z "$OLDEST" ] && break
                  rm -f "$OLDEST"
                  echo "$(date -Iseconds) talos-log-sink size-cap prune: $OLDEST"
                done

                TOTAL=$(du -sh $SINK 2>/dev/null | cut -f1)
                COUNTS=$(ls $SINK 2>/dev/null | wc -l)
                echo "$(date -Iseconds) talos-log-sink retention: $COUNTS files, $TOTAL total"
                sleep 86400
              done
          volumeMounts:
            - name: sink
              mountPath: /sink
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            # find -delete needs write to /sink (hostPath); Talos
            # creates /var/log/* as root-owned. Same root-with-no-
            # privileges shape as the vector container below.
            runAsNonRoot: false
            runAsUser: 0
        - name: vector
          image: timberio/vector:0.51.0-distroless-libc
          args: ["--config-dir", "/etc/vector"]
          ports:
            - name: talos-tcp
              containerPort: 6514
              hostPort: 6514
              protocol: TCP
          env:
            # Tag forensic lines with the receiving node, so
            # we can tell which peer caught them when reading
            # the merged PVC files later.
            - name: VECTOR_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/vector
            - name: sink
              mountPath: /sink
            - name: data
              mountPath: /var/lib/vector
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # Generous-ish ceiling; under steady-state
              # Vector idles around ~20 MiB on a 6-node feed.
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 6514
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6514
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            # Run as root so hostPath /var/log/talos-log-sink
            # creation works regardless of host-side
            # ownership. The container has no write access
            # to anything else (read-only rootfs, dropped
            # caps) so the blast radius is bounded.
            runAsNonRoot: false
            runAsUser: 0
      volumes:
        - name: config
          configMap:
            name: talos-log-sink
        # Sink writes to a node-local hostPath under
        # /var/log/talos-log-sink — Talos's ephemeral
        # partition persists across reboots and is
        # independent of Longhorn (which depends on the
        # CP being healthy to attach volumes — exactly the
        # failure mode we're trying to be resilient to).
        # Each node has its own log file, lost only if
        # the node's disk dies. Acceptable: a node losing
        # its own crash logs is no worse than today's
        # in-memory-only state.
        - name: sink
          hostPath:
            path: /var/log/talos-log-sink
            type: DirectoryOrCreate
        # Vector's internal state dir (no checkpoints
        # in this config, but Vector wants the path).
        - name: data
          emptyDir: {}
