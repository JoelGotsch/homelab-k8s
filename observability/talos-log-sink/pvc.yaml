# Storage for the Talos log sink.
#
# Longhorn replica-2 — same SC as Loki + Tempo per the
# observability stack convention. Replicated so a single
# Longhorn node losing its disk doesn't lose evidence.
#
# 20 Gi is generous for ~MB/day per node × 6 nodes; gives
# months of retention without a rotation policy. Manual
# `rm /sink/talos-<old>.log` during housekeeping.
#
# RWX so the DaemonSet can write from every node (Vector
# instances are per-node and each writes to its own daily
# file; concurrent open of the same file across nodes works
# under Longhorn RWX backed by the NFS provisioner).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: talos-log-sink
  namespace: monitoring
  labels:
    app.kubernetes.io/name: talos-log-sink
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn-replica2
  resources:
    requests:
      storage: 20Gi
