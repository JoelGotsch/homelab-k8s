# PodMonitor for the hubble-flow-exporter sidecar's self-metrics.
#
# Why PodMonitor (not ServiceMonitor): the sidecar lives inside
# the cilium-agent pod and has no dedicated Service. PodMonitor
# selects pods directly and scrapes the named container port.
#
# The `release` label matches kube-prometheus-stack's
# Prometheus-CR `serviceMonitorSelector` / `podMonitorSelector`
# — without it Prometheus ignores the resource.

apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: hubble-flow-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: hubble-flow-exporter
    app.kubernetes.io/component: podmonitor
    app.kubernetes.io/part-of: observability
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      k8s-app: cilium
  podMetricsEndpoints:
    - port: hubble-export
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
      honorLabels: false
