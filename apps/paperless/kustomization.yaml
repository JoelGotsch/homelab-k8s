# Paperless-ngx — document archive (scanned receipts,
# statements, IDs, etc.). Per `personal-documents` share in
# storage.md.
#
# Storage: hot bucket (data + consume + export + Redis)
# on Longhorn (LUKS-at-rest via ADR 0017); cold bucket
# (media — originals + thumbnails + archive variants) on
# csi-rclone-NFS-crypt per ADR 0030 §D2. Authentik OIDC for
# operator (and family members granted document access);
# Tailscale-only HTTPRoute on `paperless.lab.vyramo.com`
# per ADR 0024 (Personal data — no Cloudflare TLS termination).
#
# Helm chart: gabe565/charts/paperless-ngx (OCI). Bundled
# Redis kept; bundled Postgres OFF (CNPG cluster in
# cnpg-cluster.yaml). Gotenberg + Tika kept OFF at first
# install — operator enables via env vars + sibling
# Deployments if Office-document conversion becomes a need.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: paperless

helmCharts:
  - name: paperless-ngx
    repo: oci://ghcr.io/gabe565/charts
    version: "0.24.1"  # OPERATOR PINS via Renovate
    releaseName: paperless
    namespace: paperless
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - namespace.yaml
  - cnpg-cluster.yaml
  - pvc.yaml
  - externalsecret.yaml
  - httproute.yaml
  - networkpolicy.yaml

# ADR 0036: cluster-wide resource-governance baseline.
# NOTE: mirror this addition in the sibling .j2 template so
# the next ansible re-render doesn't strip it (rendered file
# header disclaims edits; the block is pinned so operators
# see the drift on the next re-render pass).
components:
  - ../../components/first-party-namespace
  - ../../components/site-config   # build-only ConfigMap for the replacement below

# Resolve the HTTPRoute hostname from the single site-config (no hardcoded
# domain): <prefix>.FQDN_SUFFIX -> <prefix>.<fqdn_suffix>. Provenance: this rule
# -> ConfigMap/site-config.data.fqdn_suffix -> components/site-config/site-config.env.
replacements:
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.fqdn_suffix }
    targets:
      - select: { kind: HTTPRoute, name: paperless }
        fieldPaths: [spec.hostnames.0]
        options: { delimiter: '.', index: 1 }
