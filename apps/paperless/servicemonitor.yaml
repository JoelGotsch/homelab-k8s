# Paperless-ngx exposes Prometheus metrics via the
# django-prometheus middleware (enabled by default in recent
# versions). Scrape on the same port as the web UI; metrics
# at /metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: paperless
  namespace: paperless
  labels:
    app.kubernetes.io/name: paperless-ngx
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-ngx
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
