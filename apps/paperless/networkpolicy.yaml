# NetworkPolicies for Paperless-ngx.
#
# Pod fan-out:
#   - paperless         (web + task worker — Django on port 8000)
#   - paperless-redis-master (chart-bundled redis)
#   - paperless-pg-rw / -ro  (CNPG)
#
# Same-namespace traffic is allowed broadly; cross-namespace
# is narrow per the established homelab pattern.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless-allow-same-ns
  namespace: paperless
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: paperless-ngx
  policyTypes: [Ingress, Egress]
  ingress:
    # Cilium Gateway envoy.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - port: 8000
          protocol: TCP
    # Prometheus scrape.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Authentik OIDC.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - port: 9000
          protocol: TCP
---
# CCNP for cluster-internal external dependencies.
# NAS NFS egress is NOT here — per ADR 0030 §D1 csi-rclone
# is the only NAS-talking pod; Paperless sees the encrypted
# share via CSI.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperless-egress
  namespace: paperless
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    # MinIO (cluster-internal — for CNPG WAL).
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # Paperless's first-run downloads NLTK data + spacy
    # models from upstream. Operator extends if other
    # Paperless-side fetches show up in logs (e.g., new
    # tessdata language pack).
    - toFQDNs:
        - matchName: "raw.githubusercontent.com"
        - matchName: "github.com"
        - matchName: "objects.githubusercontent.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
