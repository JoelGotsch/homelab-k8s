# NetworkPolicies for Paperless-ngx.
#
# Implemented as CiliumNetworkPolicy (not vanilla NetworkPolicy)
# because Cilium Gateway API traffic carries the reserved
# `ingress` identity, NOT the source namespace identity. K8s
# NetPol's `namespaceSelector: kubernetes.io/metadata.name=ingress`
# silently drops Gateway → Paperless traffic (503 / 5s timeout).
# See homelab-k8s/platform/authentik/networkpolicy.yaml for the
# canonical write-up.
#
# Pod fan-out:
#   - paperless         (web + task worker — Django on port 8000)
#   - paperless-redis-master (chart-bundled redis)
#   - paperless-pg-rw / -ro  (CNPG)
#
# Same-namespace traffic is allowed broadly; cross-namespace
# is narrow per the established homelab pattern.

# Same-ns allow remains a vanilla NetworkPolicy: it has no
# rules referencing the ingress namespace, so it doesn't
# trip the Cilium Gateway identity mismatch.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless-allow-same-ns
  namespace: paperless
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperless
  namespace: paperless
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: paperless-ngx
  ingress:
    # Cilium Gateway envoy — reserved `ingress` identity.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Prometheus scrape.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Authentik OIDC.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
# CCNP for cluster-internal external dependencies.
# NAS NFS egress is NOT here — per ADR 0030 §D1 csi-rclone
# is the only NAS-talking pod; Paperless sees the encrypted
# share via CSI.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperless-egress
  namespace: paperless
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    # MinIO (cluster-internal — for CNPG WAL).
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # Paperless's first-run downloads NLTK data + spacy
    # models from upstream. Operator extends if other
    # Paperless-side fetches show up in logs (e.g., new
    # tessdata language pack).
    - toFQDNs:
        - matchName: "raw.githubusercontent.com"
        - matchName: "github.com"
        - matchName: "objects.githubusercontent.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
