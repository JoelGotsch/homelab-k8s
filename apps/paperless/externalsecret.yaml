# ExternalSecrets for Paperless-ngx.
#
# Four OpenBao paths:
#   - kv/paperless/admin       Initial admin creds (operator
#                              rotates to OIDC-only post-bring-up)
#   - kv/paperless/oidc        Authentik OIDC client (ships
#                              dormant; operator activates via
#                              admin UI Settings → Auth)
#   - kv/paperless/cnpg-s3     MinIO creds for CNPG WAL archival
#   - kv/paperless/redis       Bitnami redis subchart AUTH password.
#                              Materialized as Secret `paperless-redis`
#                              with key `redis-password` (the name +
#                              key both the bitnami redis pods AND
#                              the paperless-ngx chart's
#                              hardcoded A_REDIS_PASSWORD env
#                              expect — see values.yaml).
#
# DB credentials are NOT in OpenBao — CNPG generates the
# `paperless-pg-app` Secret in-namespace at cluster bootstrap
# with host/username/password/dbname for the `paperless` role.
# values.yaml wires the env vars from there directly.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: paperless-admin
  namespace: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: paperless-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: paperless/admin
        property: username
    - secretKey: password
      remoteRef:
        key: paperless/admin
        property: password
    - secretKey: email
      remoteRef:
        key: paperless/admin
        property: email
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: paperless-oidc
  namespace: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: paperless-oidc
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: paperless/oidc
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: paperless/oidc
        property: client_secret
    - secretKey: issuer
      remoteRef:
        key: paperless/oidc
        property: issuer
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: paperless-cnpg-s3
  namespace: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: paperless-cnpg-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: paperless/cnpg-s3
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: paperless/cnpg-s3
        property: secret_access_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: paperless-redis
  namespace: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: paperless-redis
    creationPolicy: Owner
  data:
    # Bitnami redis subchart reads `redis-password`; the paperless-ngx
    # chart's auto-injected A_REDIS_PASSWORD env reads the same key
    # (see values.yaml redis.auth.existingSecretPasswordKey).
    - secretKey: redis-password
      remoteRef:
        key: paperless/redis
        property: password
