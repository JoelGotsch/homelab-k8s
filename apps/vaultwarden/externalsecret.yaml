# ExternalSecrets for Vaultwarden.
# Per ADR 0024 D1 (Cloudflare Tunnel front + Authentik OIDC
# for operator) + audit follow-up "1.33.0+ pin + admin panel
# locked behind OIDC".

# ADMIN_TOKEN: Vaultwarden 1.32+ requires the Argon2 hash form
# (Vaultwarden hashes operator-supplied secrets server-side
# pre-1.32; post-1.32 expects the hash directly to avoid
# weak-password risk). Operator generates via:
#   vaultwarden hash --preset bitwarden    # from inside any
#                                          # vaultwarden image
# or:
#   echo -n "$PLAINTEXT" | argon2 \
#       "$(openssl rand -hex 32)" -id -t 3 -m 16 -p 4 -e
# Stores the resulting `$argon2id$...` string at the kv path.
# Plaintext form is operator-side only — never lands in
# OpenBao.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vaultwarden-admin
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: vaultwarden-admin
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_TOKEN
      remoteRef:
        key: vaultwarden/admin
        property: admin_token_argon2
---
# Authentik OIDC client credentials. Ships dormant (the
# OAuth2 provider is configured via Vaultwarden's admin UI
# at first install — see README); ESO emits empty fields
# until operator runs provision-authentik-oidc-client.sh +
# operator follows the README step.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vaultwarden-oidc
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: vaultwarden-oidc
    creationPolicy: Owner
  data:
    - secretKey: SSO_CLIENT_ID
      remoteRef:
        key: vaultwarden/oidc
        property: client_id
    - secretKey: SSO_CLIENT_SECRET
      remoteRef:
        key: vaultwarden/oidc
        property: client_secret
    - secretKey: SSO_AUTHORITY
      remoteRef:
        key: vaultwarden/oidc
        property: issuer
---
# CNPG-issued postgres password.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vaultwarden-postgres-creds
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: vaultwarden-postgres-creds
  data:
    - secretKey: password
      remoteRef:
        key: vaultwarden/postgres
        property: password
---
# CNPG barman backup creds (MinIO svcacct scoped to
# homelab-backups-cluster/cnpg/vaultwarden/).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vaultwarden-cnpg-s3
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: vaultwarden-cnpg-s3
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: cnpg/vaultwarden/s3-creds
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: cnpg/vaultwarden/s3-creds
        property: secret_access_key
---
# (Optional) SMTP for email notifications + invites. Ships
# empty; operator populates if family-sharing requires email
# invites. Vaultwarden refuses to send if any field is empty —
# safe-by-default.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vaultwarden-smtp
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: vaultwarden-smtp
    creationPolicy: Owner
  data:
    - secretKey: SMTP_HOST
      remoteRef:
        key: vaultwarden/smtp
        property: host
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: vaultwarden/smtp
        property: username
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: vaultwarden/smtp
        property: password
