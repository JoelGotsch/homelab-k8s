# NetworkPolicies for Vaultwarden.
#
# Implemented as CiliumNetworkPolicy (not vanilla NetworkPolicy)
# because Cilium Gateway API traffic carries the reserved
# `ingress` identity, NOT the source namespace identity. K8s
# NetPol's `namespaceSelector: kubernetes.io/metadata.name=ingress`
# silently drops Gateway → Vaultwarden traffic (503 / 5s timeout).
# See homelab-k8s/platform/authentik/networkpolicy.yaml for the
# canonical write-up.
#
# - Ingress: Cilium Gateway envoy (HTTPRoute) + Prometheus
#   scrape + cloudflare-tunnel ingress (Phase 2 public).
# - Egress: kube-DNS + Authentik (for OIDC discovery + token
#   validation) + (when SMTP enabled) external SMTP relay.

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  ingress:
    # Cilium Gateway envoy — reserved `ingress` identity.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"   # vaultwarden container port; Cilium DNATs Service
              protocol: TCP   # :80 -> pod :8080 before ingress policy eval, so
                              # the policy must match the pod port (was "80" -> 503/500)
    # Prometheus scrape.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"   # vaultwarden container port; Cilium DNATs Service
              protocol: TCP   # :80 -> pod :8080 before ingress policy eval, so
                              # the policy must match the pod port (was "80" -> 503/500)
    # cloudflare-tunnel namespace (Phase 2 public ingress
    # per ADR 0024 D1).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloudflare-tunnel
      toPorts:
        - ports:
            - port: "8080"   # vaultwarden container port; Cilium DNATs Service
              protocol: TCP   # :80 -> pod :8080 before ingress policy eval, so
                              # the policy must match the pod port (was "80" -> 503/500)
  egress:
    # kube-DNS.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # CNPG Postgres (same ns).
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: vaultwarden-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Authentik for OIDC discovery + token validation.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
# CCNP for SMTP egress — vanilla NetworkPolicy can't match
# off-cluster IPs by hostname. SMTP relay is operator-typed
# (e.g., smtp.fastmail.com); maintained as toFQDNs.
# Ships dormant — Vaultwarden won't send SMTP until the
# vaultwarden-smtp Secret has populated fields.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vaultwarden-smtp-egress
  namespace: vaultwarden
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  egress:
    # kube-DNS for FQDN resolution.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    # SMTP relay — OPERATOR FILLS the actual provider's
    # FQDN(s) when SMTP is activated.
    - toFQDNs:
        - matchName: "smtp.example.invalid"   # placeholder
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
            - port: "465"
              protocol: TCP
---
# CNPG DB-pod lockdown (netpol-audit.md MEDIUM-2). DRAFT — do NOT merge-and-
# apply blind. Until now the vaultwarden-pg instances ran Cilium DEFAULT-ALLOW
# (nothing selected `cnpg.io/cluster`), so the DB had unrestricted ingress
# AND egress incl. the internet — the latent llm-gateway trap: the day this
# ns gains a namespace-wide egress default-deny without the CNPG egress set,
# the DB stalls 1/2 (`dial tcp 10.96.0.1:443: i/o timeout`). This CNP selects
# ONLY the DB pods for BOTH directions, which flips just those pods to
# least-privilege (default-deny + the explicit CNPG quad) while leaving every
# app pod untouched — no namespace-wide default-deny is introduced here.
#
# ROLLOUT IS OPERATOR-ATTENDED via Cilium PolicyAuditMode + Hubble (rule 14 /
# 35). Enable `cilium endpoint config <db-ep-id> PolicyAuditMode=Enabled` on
# the vaultwarden-pg endpoints, apply this policy (evaluated-not-enforced), watch
# `hubble observe --namespace vaultwarden --verdict AUDIT` across a full reconcile
# (operator probe, metrics scrape, replication, WAL archive to MinIO,
# apiserver reads), confirm ZERO unexpected AUDIT verdicts, then disable audit
# to enforce. A missed egress rule wedges the DB silently. Template:
# platform/openbao/networkpolicy.yaml (openbao-server CNP) — same audit-mode-
# first method that locked the vault down with zero DROPPED.
#
# The quad (netpol-best-practices.md checklist E + CLAUDE.md rules 12/14/15):
#   ingress  cnpg-system  -> 8000 (instance manager/status) + 9187 (metrics)
#   ingress  monitoring   -> 9187 (Prometheus scrape)
#   ingress  in-ns client -> 5432 (Postgres) + peer 5432 (replication)
#   egress   kube-apiserver 443 AND 6443 (socket-LB pre-translation, rule 12)
#   egress   kube-dns 53 UDP+TCP
#   egress   minio-on-nas 9000 (barman WAL/base-backup archiving)
#   egress   peer cnpg.io/cluster 5432 (streaming replication)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vaultwarden-pg-cnpg
  namespace: vaultwarden
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: vaultwarden-pg
  ingress:
    # CNPG operator (cnpg-system) — instance-manager status :8000 + metrics.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "9187"
              protocol: TCP
    # Prometheus scrape of the CNPG metrics exporter.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
    # In-namespace clients + streaming replication between instances —
    # both hit pod port 5432.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: vaultwarden
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  egress:
    # kube-apiserver — instance manager reads its Cluster CR. Reserved
    # entity; BOTH 443 and 6443 (socket-LB DNATs ClusterIP:443 -> :6443
    # before policy eval — CLAUDE.md rule 12).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # kube-dns.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # MinIO (minio-on-nas) — barman WAL + base-backup archiving.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: minio-on-nas
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # Replication peer (the other vaultwarden-pg instance) on 5432.
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: vaultwarden-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
