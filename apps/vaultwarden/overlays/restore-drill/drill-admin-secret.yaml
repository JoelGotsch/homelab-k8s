# One-shot admin token for the drill instance. NOT
# ESO-projected — operator hand-fills the Argon2 hash before
# applying the overlay. Drill instance is teardown-bound;
# the token doesn't need to survive.
#
# Generate locally per the same recipe as production:
#   PLAINTEXT="$(openssl rand -base64 48)"
#   HASH="$(echo -n "$PLAINTEXT" | argon2 \
#       "$(openssl rand -hex 32)" -id -t 3 -m 16 -p 4 -e)"
# Operator memorizes PLAINTEXT for /admin login; replaces
# <DRILL_ADMIN_TOKEN_ARGON2> with HASH below.

apiVersion: v1
kind: Secret
metadata:
  name: vaultwarden-admin   # name matches what values.yaml expects
type: Opaque
stringData:
  ADMIN_TOKEN: "<DRILL_ADMIN_TOKEN_ARGON2>"
