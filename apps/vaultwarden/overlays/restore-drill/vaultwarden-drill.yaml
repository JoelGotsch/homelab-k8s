# Vaultwarden Deployment for the drill — uses the helm
# chart's straight values via a HelmChartInflationGenerator.
# Reuses production values.yaml so what-we-test matches
# what's-in-prod, but overrides:
# - DATABASE_URL → vw-pg-drill-app (the recovered cluster's
#   auto-generated Secret)
# - sso.enabled stays false (no Authentik for drill)
# - storage size 1Gi (drill is ephemeral; no real attachments)
# - replicaCount 1
# - persistent volume optional (drill data thrown away with
#   namespace teardown)
#
# This file uses the chart's outputs directly via static
# manifest (no helm). At drill time it's simpler than
# inflating the chart.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden-drill
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/instance: drill
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
      app.kubernetes.io/instance: drill
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultwarden
        app.kubernetes.io/instance: drill
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.33.0   # matches production
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vw-pg-drill-app
                  key: uri
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-admin
                  key: ADMIN_TOKEN
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: DOMAIN
              value: "http://localhost:8081"
            - name: ROCKET_PORT
              value: "80"
          ports:
            - name: http
              containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden-drill
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/instance: drill
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/instance: drill
  ports:
    - name: http
      port: 80
      targetPort: http
