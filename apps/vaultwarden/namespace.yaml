apiVersion: v1
kind: Namespace
metadata:
  name: vaultwarden
  labels:
    # ADR 0036: first-party namespace enrolment.
    homelab.internal/first-party: "true"
    # `secret` — password vault (zero-knowledge encrypted, but
    # still the daily-driver credential store).
    homelab.internal/data-class: secret
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
