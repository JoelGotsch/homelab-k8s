# Image-pull credentials for registry.homelab.internal (Forgejo
# Packages OCI registry). Per platform/forgejo/README.md
# §"First-party image pulls".
#
# Source: kv/shared/forgejo-packages/ci   {username, token}
# Bot:    ci-packages   (Forgejo bot account; PAT scopes:
#                        read:package + write:package)
#
# Dual-use rationale (single-bot vs per-app pull bot, deferred
# 2026-06-09): only one Woodpecker push pipeline and one cluster
# consume this registry today. A compromised pull-side pod
# theoretically gains write access, but the same Forgejo PAT
# would already be revoked + rotated under any incident-response
# flow. Refactor trigger = the first multi-tenant pull consumer
# whose trust profile differs from the Woodpecker pusher; then
# split into `ci-packages-push` + `ci-packages-pull` with
# narrower scopes.
#
# The rendered Secret type is kubernetes.io/dockerconfigjson;
# attached to the ns's `default` ServiceAccount via the
# sa-default-patch.yaml — every pod that uses the default SA
# (i.e., all of them in this ns) inherits the pull cred for
# the registry.homelab.internal host. Presidio's
# mcr.microsoft.com images are unaffected: kubelet only
# presents this cred to matching registry hosts.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: registry-homelab-internal-pull
  namespace: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: registry-homelab-internal-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        # `.username` + `.password` resolve from the `data` block
        # below. b64enc is the standard helm-style filter; ESO's
        # v2 template engine ships the sprig set incl. b64enc.
        # The rendered Secret never leaves the cluster.
        .dockerconfigjson: |
          {
            "auths": {
              "registry.homelab.internal": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: shared/forgejo-packages/ci
        property: username
    - secretKey: password
      remoteRef:
        key: shared/forgejo-packages/ci
        property: token
