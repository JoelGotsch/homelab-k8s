# LiteLLM Helm values overrides.
# Chart: oci://ghcr.io/berriai/litellm-helm
# Pinned in kustomization.yaml; bumped via Renovate.
#
# Image is overridden to the homelab-built variant which
# pip-installs the `llm-gateway` Python package — that's how
# the proxy_config's `llm_gateway.hooks.*` callback paths
# resolve at runtime.

replicaCount: 2

image:
  repository: registry.homelab.internal/llm-gateway
  tag: "0.1.0"  # OPERATOR PINS via Renovate
  pullPolicy: IfNotPresent

# The chart consumes a Secret with key `masterkey`. We point it
# at our ExternalSecret-managed llm-gateway-secrets, which has
# both the `masterkey` key (for the chart) and a
# LITELLM_MASTER_KEY env var (for proxy_config's os.environ
# resolution).
masterkeySecretName: llm-gateway-secrets

# Postgres for budget/spend tracking. The chart ships its own
# Bitnami postgresql subchart — disabled here in favor of the
# cluster's CloudNativePG (cnpg-cluster.yaml).
#
# CNPG auto-generates the `llm-gateway-app` Secret with keys
# {user, password, host, port, dbname, uri}. We add that Secret
# to environmentSecrets below; LiteLLM reads `uri` directly via
# proxy_config.general_settings.database_url: os.environ/uri.
#
# We deliberately do NOT use the chart's `db.url: "$(VAR)"`
# field — the chart-template substitution + Kubernetes env
# expansion is two layers of indirection that has surprised us
# before (see initial-setup.md caveats). Direct os.environ/uri
# is one layer.
db:
  deployStandalone: false
  useStackgresOperator: false
  useExisting: true
  endpoint: "postgresql://llm-gateway-rw.llm-gateway.svc:5432/litellm"
  database: litellm

# Inline LiteLLM proxy config. Mirrors
# llm-gateway/policies/proxy_config.example.yaml — operator
# keeps this in sync (Renovate cannot — semantic drift).
# MAC_STUDIO_INFERENCE_IP must be replaced with the actual
# inference-VLAN address.
proxy_config:
  model_list:
    - model_name: claude-sonnet
      litellm_params:
        model: claude-3-5-sonnet-20241022
        api_key: os.environ/ANTHROPIC_API_KEY
    - model_name: claude-opus
      litellm_params:
        model: claude-3-opus-20240229
        api_key: os.environ/ANTHROPIC_API_KEY
    - model_name: gpt-4o
      litellm_params:
        model: gpt-4o
        api_key: os.environ/OPENAI_API_KEY
    - model_name: gpt-4o-mini
      litellm_params:
        model: gpt-4o-mini
        api_key: os.environ/OPENAI_API_KEY
    - model_name: mac-qwen-14b
      litellm_params:
        model: openai/Qwen2.5-14B-Instruct-4bit
        api_base: http://MAC_STUDIO_INFERENCE_IP:8080/v1
        api_key: dummy
    - model_name: mac-deepseek-coder-lite
      litellm_params:
        model: openai/DeepSeek-Coder-V2-Lite-Instruct-4bit
        api_base: http://MAC_STUDIO_INFERENCE_IP:8080/v1
        api_key: dummy
    - model_name: mac-llama-8b
      litellm_params:
        model: openai/Llama-3.1-8B-Instruct-4bit
        api_base: http://MAC_STUDIO_INFERENCE_IP:8080/v1
        api_key: dummy
    - model_name: mac-embed
      litellm_params:
        model: ollama/nomic-embed-text
        api_base: http://MAC_STUDIO_INFERENCE_IP:11434
  litellm_settings:
    drop_params: true
    callbacks:
      - llm_gateway.hooks.pre_call.handler
      - llm_gateway.hooks.post_call.handler
    set_verbose: false
  general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY
    # CNPG's app Secret exposes the full DSN under env var `uri`.
    database_url: os.environ/uri

# Two Secrets envFrom'd into the pod:
# - llm-gateway-secrets: ESO pull from OpenBao (provider keys
#   + master key). See externalsecret.yaml.
# - llm-gateway-app: CNPG-auto-generated from the Cluster CRD.
#   Provides {user, password, host, port, dbname, uri}. The
#   `uri` key is the full postgres:// DSN.
environmentSecrets:
  - llm-gateway-secrets
  - llm-gateway-app

# Mount the rendered allowlist ConfigMap at /etc/litellm/policies.
volumes:
  - name: policies
    configMap:
      name: llm-gateway-policies
volumeMounts:
  - name: policies
    mountPath: /etc/litellm/policies
    readOnly: true

service:
  type: ClusterIP
  port: 4000

# Use HTTPRoute (Cilium Gateway API) instead of the chart's
# Ingress.
ingress:
  enabled: false

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 30s

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
