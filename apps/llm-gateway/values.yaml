# LiteLLM Helm values overrides.
# Chart: oci://ghcr.io/berriai/litellm-helm
# Pinned in kustomization.yaml; bumped via Renovate.
#
# Image is overridden to the homelab-built variant which
# pip-installs the `llm-gateway` Python package — that's how
# the proxy_config's `llm_gateway.hooks.*` callback paths
# resolve at runtime.

replicaCount: 2

image:
  repository: registry.homelab.internal/llm-gateway
  tag: "0.1.0"  # OPERATOR PINS via Renovate
  pullPolicy: IfNotPresent

masterkey: ""           # populated via envFrom -> ExternalSecret
masterkeySecretName: llm-gateway-secrets
masterkeySecretKey: master-key

# Postgres for budget/spend tracking. The chart ships its own
# Bitnami postgresql subchart — disabled here in favor of the
# cluster's CloudNativePG. Operator points at a CNPG cluster
# via the database URL secret.
db:
  deployStandalone: false
  useStackgresCluster: false
  useExisting: true
  endpoint: "postgresql://llm-gateway-rw.cnpg.svc:5432/litellm"
  database: litellm
  url: ""               # populated via envFrom

# Inline LiteLLM proxy config. Mirrors
# llm-gateway/policies/proxy_config.example.yaml — operator
# keeps this in sync (Renovate cannot — semantic drift).
# MAC_STUDIO_INFERENCE_IP must be replaced with the actual
# inference-VLAN address.
proxy_config:
  model_list:
    - model_name: claude-sonnet
      litellm_params:
        model: claude-3-5-sonnet-20241022
        api_key: os.environ/ANTHROPIC_API_KEY
    - model_name: claude-opus
      litellm_params:
        model: claude-3-opus-20240229
        api_key: os.environ/ANTHROPIC_API_KEY
    - model_name: gpt-4o
      litellm_params:
        model: gpt-4o
        api_key: os.environ/OPENAI_API_KEY
    - model_name: gpt-4o-mini
      litellm_params:
        model: gpt-4o-mini
        api_key: os.environ/OPENAI_API_KEY
    - model_name: mac-qwen-14b
      litellm_params:
        model: openai/Qwen2.5-14B-Instruct-4bit
        api_base: http://MAC_STUDIO_INFERENCE_IP:8080/v1
        api_key: dummy
    - model_name: mac-deepseek-coder-lite
      litellm_params:
        model: openai/DeepSeek-Coder-V2-Lite-Instruct-4bit
        api_base: http://MAC_STUDIO_INFERENCE_IP:8080/v1
        api_key: dummy
    - model_name: mac-llama-8b
      litellm_params:
        model: openai/Llama-3.1-8B-Instruct-4bit
        api_base: http://MAC_STUDIO_INFERENCE_IP:8080/v1
        api_key: dummy
    - model_name: mac-embed
      litellm_params:
        model: ollama/nomic-embed-text
        api_base: http://MAC_STUDIO_INFERENCE_IP:11434
  litellm_settings:
    drop_params: true
    callbacks:
      - llm_gateway.hooks.pre_call.handler
      - llm_gateway.hooks.post_call.handler
    set_verbose: false
  general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY
    database_url: os.environ/DATABASE_URL

envFrom:
  - secretRef:
      name: llm-gateway-secrets

# Mount the operator-managed allowlists.
extraVolumes:
  - name: policies
    configMap:
      name: llm-gateway-policies
extraVolumeMounts:
  - name: policies
    mountPath: /etc/litellm/policies
    readOnly: true

service:
  type: ClusterIP
  port: 4000

# Use HTTPRoute (Cilium Gateway API) instead of the chart's
# Ingress.
ingress:
  enabled: false

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 30s

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
