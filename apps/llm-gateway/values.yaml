# LiteLLM Helm values overrides.
# Chart: oci://ghcr.io/berriai/litellm-helm
# Pinned in kustomization.yaml; bumped via Renovate.
#
# Image is overridden to the homelab-built variant which
# pip-installs the `llm-gateway` Python package — that's how
# the proxy_config's `llm_gateway.hooks.*` callback paths
# resolve at runtime.

replicaCount: 2

# Soft anti-affinity against worker1. Same workaround as
# infrastructure/minio-on-nas/values.yaml — kubelet pulls of
# registry.homelab.internal/* images intermittently fail with
# "could not fetch content descriptor … not found" when the
# pulling pod is co-located with Forgejo (which writes to the
# same csi-rclone-crypt mount the kubelet reads from). The
# litellm-helm chart's affinity is shared by the main
# Deployment AND the migrationJob — both pull from
# registry.homelab.internal, both benefit.
#
# Remove when Forgejo migrates off worker1 OR csi-rclone vfs
# concurrent-IO is fixed.
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values: [worker1]

image:
  # Forgejo Packages OCI registry namespaces images by owner. The bot
  # `ci-packages` is in the `forgejo-admin` user namespace, so its
  # `llm-gateway` package lives at `forgejo-admin/llm-gateway`. The
  # leading `forgejo-admin/` was missing 2026-06-09 and caused
  # kubelet auth-but-404 against `/v2/llm-gateway/manifests/0.1.0`;
  # confirmed via registry catalog showing only
  # `forgejo-admin/llm-gateway` with tags [latest, v0.0.1].
  # Tag bumped 0.1.0 → v0.0.1 to match what CI actually published
  # at the time of 2026-06-04 (operator wired Renovate after; the
  # 0.1.0 tag never existed). Renovate digest-pin lands per ADR 0019
  # D3 + Kyverno require-first-party-image-digest enforce mode on
  # the next CI push.
  repository: registry.homelab.internal/forgejo-admin/llm-gateway
  # Bumped 2026-06-28 to v0.0.4 — the v0.0.2 image worked for
  # the Deployment but litellm's get_instance_fn() couldn't find
  # the hook callback module (FILE-PATH lookup at
  # /etc/litellm/llm_gateway/...). v0.0.4 Dockerfile adds a
  # second symlink (/etc/litellm/llm_gateway → site-packages/
  # llm_gateway) on top of v0.0.3's /app/litellm symlink so both
  # LiteLLM's PreSync migrations command AND the proxy's callback
  # resolver find what they expect. Per task #75.
  #
  # History: v0.0.1 was lost during #43 (registry-blobs crypt
  # rotation). v0.0.2 first rebuild + mypy 1.11 floor.
  # v0.0.3 added /app/litellm symlink. v0.0.4 adds the second
  # symlink for the proxy callback resolver.
  #
  # Digest pinned per Kyverno policy require-first-party-image-
  # digest; fetch via the curl-against-/v2/.../manifests/<tag>
  # recipe in the digest-pin-enforce-allowlist guide.
  tag: "v0.0.11@sha256:2ae2c125cfca394e0aad3ec796c713d9ebc6667d6f7d91c71d490a280ded1695"  # OPERATOR PINS via Renovate
  pullPolicy: IfNotPresent

# The chart consumes a Secret with key `masterkey`. We point it
# at our ExternalSecret-managed llm-gateway-secrets, which has
# both the `masterkey` key (for the chart) and a
# LITELLM_MASTER_KEY env var (for proxy_config's os.environ
# resolution).
masterkeySecretName: llm-gateway-secrets

# Postgres for budget/spend tracking. The chart ships its own
# Bitnami postgresql subchart — disabled here in favor of the
# cluster's CloudNativePG (cnpg-cluster.yaml).
#
# CNPG auto-generates the `llm-gateway-app` Secret with keys
# {user, password, host, port, dbname, uri}. We add that Secret
# to environmentSecrets below; LiteLLM reads `uri` directly via
# proxy_config.general_settings.database_url: os.environ/uri.
#
# We deliberately do NOT use the chart's `db.url: "$(VAR)"`
# field — the chart-template substitution + Kubernetes env
# expansion is two layers of indirection that has surprised us
# before (see initial-setup.md caveats). Direct os.environ/uri
# is one layer.
db:
  deployStandalone: false
  useStackgresOperator: false
  useExisting: true
  endpoint: "postgresql://llm-gateway-rw.llm-gateway.svc:5432/litellm"
  database: litellm
  # Wire chart's migrationJob (which reads DATABASE_{USERNAME,
  # PASSWORD,HOST} via secretKeyRef) at CNPG's auto-generated
  # `llm-gateway-app` Secret. CNPG names the keys `user` +
  # `password` + `host` (NOT the chart's `username`+`password`
  # defaults). Without this override the Job's pod fails
  # CreateContainerConfigError on "secret 'postgres' not found".
  # Added 2026-06-27 during #43 close-out — the migration Job
  # has been broken since the chart was wired to CNPG but the
  # break was masked by the v0.0.1 ImagePullBackOff (also from
  # #43).
  secret:
    name: llm-gateway-app
    usernameKey: user
    passwordKey: password
    endpointKey: host

# migrationJob hook ordering (#75 fix). Chart default makes the
# Job an Argo PreSync hook, which runs BEFORE the CNPG cluster
# is applied → chicken-and-egg ("secret 'llm-gateway-app' not
# found"). Disabling the argocd hook annotation makes the Job a
# regular resource Argo applies in the normal wave, after the
# CNPG cluster is up. The Job's own retry+backoff handles any
# transient CNPG-not-ready-yet on the first sync.
#
# backoffLimit + ttl bumped so we can inspect a failed pod's
# logs without job-controller's BackoffLimitExceeded sweep
# deleting it immediately. Once #75 is closed, can drop ttl
# back to chart default (120s).
migrationJob:
  hooks:
    argocd:
      enabled: false   # no PreSync hook
    helm:
      enabled: false   # no Helm hook either
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600

# Inline LiteLLM proxy config. Mirrors
# llm-gateway/policies/proxy_config.example.yaml — operator
# keeps this in sync (Renovate cannot — semantic drift).
# <MAC_STUDIO_INFERENCE_IP> must be replaced with the actual
# inference-VLAN address.
proxy_config:
  model_list:
    # 2026-06-28: routed through OpenRouter (single upstream
    # account) rather than direct Anthropic + OpenAI APIs.
    # LiteLLM provider slug `openrouter/<provider>/<model>`
    # tells the proxy to dial https://openrouter.ai/api/v1 with
    # OPENROUTER_API_KEY. Per-model spend tracking still works
    # — LiteLLM logs the resolved model.
    - model_name: claude-sonnet
      litellm_params:
        model: openrouter/anthropic/claude-3.5-sonnet
        api_key: os.environ/OPENROUTER_API_KEY
    - model_name: claude-opus
      litellm_params:
        model: openrouter/anthropic/claude-3-opus
        api_key: os.environ/OPENROUTER_API_KEY
    - model_name: gpt-4o
      litellm_params:
        model: openrouter/openai/gpt-4o
        api_key: os.environ/OPENROUTER_API_KEY
    - model_name: gpt-4o-mini
      litellm_params:
        model: openrouter/openai/gpt-4o-mini
        api_key: os.environ/OPENROUTER_API_KEY
    - model_name: mac-qwen-14b
      litellm_params:
        model: openai/Qwen2.5-14B-Instruct-4bit
        api_base: http://<MAC_STUDIO_INFERENCE_IP>:8080/v1
        api_key: dummy
    - model_name: mac-deepseek-coder-lite
      litellm_params:
        model: openai/DeepSeek-Coder-V2-Lite-Instruct-4bit
        api_base: http://<MAC_STUDIO_INFERENCE_IP>:8080/v1
        api_key: dummy
    - model_name: mac-llama-8b
      litellm_params:
        model: openai/Llama-3.1-8B-Instruct-4bit
        api_base: http://<MAC_STUDIO_INFERENCE_IP>:8080/v1
        api_key: dummy
    - model_name: mac-embed
      litellm_params:
        model: ollama/nomic-embed-text
        api_base: http://<MAC_STUDIO_INFERENCE_IP>:11434
  litellm_settings:
    drop_params: true
    callbacks:
      - llm_gateway.hooks.pre_call.handler
      - llm_gateway.hooks.post_call.handler
    set_verbose: false
  # Presidio guardrail — defense-in-depth on top of ADR 0007
  # D2's classification gate (the existing pre_call hook). The
  # classification gate is the structural enforcement
  # ("personal-tagged calls cannot leave the local Mac
  # Studio"); Presidio catches operator-side mistakes that
  # slip past tagging — e.g., a public-tagged prompt that
  # nevertheless contains a credit-card number or API key.
  # Per 99-journal/2026-05-02-presidio-litellm-integration.md.
  guardrails:
    - guardrail_name: presidio-pii-mask
      litellm_params:
        guardrail: presidio
        # `pre_call` mode: scan prompt before sending to the
        # model. `presidio_filter_scope: both` also scans
        # model output (catches LLM-hallucinated PII).
        mode: pre_call
        presidio_filter_scope: both
        # Per-entity confidence thresholds. Higher = stricter
        # detection. 0.7 is upstream's "balanced" default;
        # tune per-class as false-positives surface.
        presidio_score_thresholds:
          ALL: 0.7
          CREDIT_CARD: 0.8
          IBAN_CODE: 0.8
          US_SSN: 0.85
          API_KEY: 0.7
          EMAIL_ADDRESS: 0.6
          IP_ADDRESS: 0.5    # noisy at homelab scale (lots
                             # of legitimate cluster IPs in
                             # prompts); operator tunes if
                             # false-positives surface
        # Per-entity actions. MASK replaces with placeholder;
        # BLOCK rejects the request entirely (prompt never
        # reaches the model). Financial + secret-shaped
        # entities block; everything else masks.
        pii_entities_config:
          CREDIT_CARD: BLOCK
          IBAN_CODE: BLOCK
          US_SSN: BLOCK
          API_KEY: BLOCK
          EMAIL_ADDRESS: MASK
          PHONE_NUMBER: MASK
          PERSON: MASK
          LOCATION: MASK
          IP_ADDRESS: MASK
  general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY
    # CNPG's app Secret exposes the full DSN under env var `uri`.
    database_url: os.environ/uri

# Two Secrets envFrom'd into the pod:
# - llm-gateway-secrets: ESO pull from OpenBao (provider keys
#   + master key). See externalsecret.yaml.
# - llm-gateway-app: CNPG-auto-generated from the Cluster CRD.
#   Provides {user, password, host, port, dbname, uri}. The
#   `uri` key is the full postgres:// DSN.
environmentSecrets:
  - llm-gateway-secrets
  - llm-gateway-app

# Mount the policy ConfigMap into /etc/litellm/policies/ so the
# llm_gateway.hooks.pre_call.TagEnforcer + load_provider_policy /
# load_mcp_policy can read provider-allowlist.yaml + mcp-allowlist
# .yaml at the paths they default to. Without this the hook's
# constructor raises at module import time and LiteLLM reports
# "Could not import handler from llm_gateway.hooks.pre_call".
# Added 2026-06-28 during #75 close-out.
volumes:
  - name: policies
    configMap:
      name: llm-gateway-policies
volumeMounts:
  - name: policies
    mountPath: /etc/litellm/policies
    readOnly: true

# Presidio service URLs — LiteLLM reads these to know where
# the analyzer + anonymizer live. Per
# litellm-docs/proxy/guardrails/pii_masking_v2: env names
# are PRESIDIO_ANALYZER_API_BASE + PRESIDIO_ANONYMIZER_API_BASE.
# Both Services are in the same namespace as LiteLLM (per
# presidio-deployment.yaml).
# Chart's key is `envVars` (map), not `env`. Discovered 2026-06-28
# during #75 close-out — using `env:` silently drops the values.
envVars:
  PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer.llm-gateway.svc.cluster.local:3000
  PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer.llm-gateway.svc.cluster.local:3000

# Mount the rendered allowlist ConfigMap at /etc/litellm/policies.
volumes:
  - name: policies
    configMap:
      name: llm-gateway-policies
volumeMounts:
  - name: policies
    mountPath: /etc/litellm/policies
    readOnly: true

service:
  type: ClusterIP
  port: 4000

# Use HTTPRoute (Cilium Gateway API) instead of the chart's
# Ingress.
ingress:
  enabled: false

resources:
  requests:
    cpu: 200m
    memory: 768Mi
  limits:
    cpu: "1"
    # Bumped 2026-06-29 from 1Gi — v0.0.11 image has the prisma
    # engine binaries + bundled node (419MB image). Boot-time
    # memory peaks crossed the 1Gi ceiling, OOMKilled the pod
    # before startup probe could pass.
    memory: 2Gi

serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 30s

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
