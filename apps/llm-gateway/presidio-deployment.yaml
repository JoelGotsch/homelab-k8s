# Microsoft Presidio — Analyzer + Anonymizer.
# Defense-in-depth on top of ADR 0007 D2's classification
# gate per 99-journal/2026-05-02-presidio-litellm-integration.md.
#
# Two services:
# - Analyzer detects PII patterns (28+ entity types in 2026:
#   credit cards, SSNs, emails, phone, IBAN, IP addresses,
#   API keys, etc.) using NER + regex + custom recognizers.
# - Anonymizer replaces detected entities with placeholders
#   (e.g., <EMAIL_ADDRESS>, <CREDIT_CARD>).
#
# LiteLLM's built-in presidio guardrail (per
# litellm-docs/proxy/guardrails/pii_masking_v2) calls both
# in `pre_call` mode: scan prompt → block if BLOCK action,
# mask if MASK action, otherwise pass through. Output also
# scanned (post-call hook) to catch model-emitted PII.
#
# No upstream Helm chart in 2026 (community feature-request
# at github.com/microsoft/presidio/issues/1971 still open);
# direct manifests are the canonical Kubernetes deployment
# pattern per microsoft.github.io/presidio/samples/deployments/k8s/.

# ─── Analyzer ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presidio-analyzer
  namespace: llm-gateway
  labels:
    app.kubernetes.io/name: presidio-analyzer
    app.kubernetes.io/component: pii-detection
    app.kubernetes.io/part-of: llm-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: presidio-analyzer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: presidio-analyzer
        app.kubernetes.io/component: pii-detection
        app.kubernetes.io/part-of: llm-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analyzer
          # OPERATOR PINS via Renovate.
          image: mcr.microsoft.com/presidio-analyzer:2.2.362@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            # Default: NLP engine = spacy with en_core_web_lg
            # model (~750MB; included in image).
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              # NLP model + concurrent-request buffers; the
              # analyzer holds the spacy model in memory.
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: presidio-analyzer
  namespace: llm-gateway
  labels:
    app.kubernetes.io/name: presidio-analyzer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: presidio-analyzer
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
---
# ─── Anonymizer ────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presidio-anonymizer
  namespace: llm-gateway
  labels:
    app.kubernetes.io/name: presidio-anonymizer
    app.kubernetes.io/component: pii-redaction
    app.kubernetes.io/part-of: llm-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: presidio-anonymizer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: presidio-anonymizer
        app.kubernetes.io/component: pii-redaction
        app.kubernetes.io/part-of: llm-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anonymizer
          image: mcr.microsoft.com/presidio-anonymizer:2.2.362@sha256:a10a12a2a613d13cf29d3ad3641e3258444dd8c90403dd644a0a114c472c2483
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: presidio-anonymizer
  namespace: llm-gateway
  labels:
    app.kubernetes.io/name: presidio-anonymizer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: presidio-anonymizer
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
