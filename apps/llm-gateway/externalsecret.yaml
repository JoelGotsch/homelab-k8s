# Pulls the OpenRouter API key + LiteLLM master key from
# OpenBao kv/data/llm-gateway. Mounted into the pod via
# envFrom (see values.yaml — environmentSecrets list).
#
# Architecture (chosen 2026-06-28): a single OpenRouter API
# key replaces the per-provider Anthropic + OpenAI keys. One
# upstream account, one bill, one rotation point; LiteLLM
# routes per-model via `openrouter/<provider>/<model>` slugs
# in proxy_config (see values.yaml model_list).
#
# Postgres DSN is NOT here. CNPG auto-generates the
# `llm-gateway-app` Secret from the Cluster CRD with keys
# {user, password, host, port, dbname, uri}; values.yaml
# adds that Secret to environmentSecrets so the proxy reads
# `uri` directly from the env, no OpenBao round-trip.
#
# OpenBao paths: kv/data/llm-gateway/{openrouter,master-key}
# Legacy paths kv/data/llm-gateway/{anthropic,openai} have
# been retired (this Secret no longer references them).

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-gateway-secrets
  namespace: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: llm-gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: llm-gateway/openrouter
        property: api_key
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: llm-gateway/master-key
        property: value
    # Chart's masterkeySecretName looks up key `masterkey` (no
    # hyphen) — provide it from the same OpenBao path.
    - secretKey: masterkey
      remoteRef:
        key: llm-gateway/master-key
        property: value
