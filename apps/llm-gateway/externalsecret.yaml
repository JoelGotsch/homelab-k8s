# Pulls upstream provider keys + LiteLLM master key + Postgres
# DSN from OpenBao kv/data/llm-gateway. Mounted into the pod
# via envFrom (see values.yaml).
#
# OpenBao path: kv/data/llm-gateway/{anthropic,openai,master-key,db-url}

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-gateway-secrets
  namespace: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: llm-gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: llm-gateway/anthropic
        property: api_key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: llm-gateway/openai
        property: api_key
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: llm-gateway/master-key
        property: value
    - secretKey: master-key
      remoteRef:
        key: llm-gateway/master-key
        property: value
    - secretKey: DATABASE_URL
      remoteRef:
        key: llm-gateway/db-url
        property: dsn
