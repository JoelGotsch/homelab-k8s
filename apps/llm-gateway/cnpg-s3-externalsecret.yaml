# MinIO-on-NAS credentials for CNPG WAL+base backup, projected
# from OpenBao kv/data/cnpg/llm-gateway/s3-creds into the
# llm-gateway namespace as Secret `llm-gateway-cnpg-s3`. The
# Cluster CRD (cnpg-cluster.yaml) references this secret in
# barmanObjectStore.s3Credentials.
#
# OpenBao path layout:
#   kv/data/cnpg/llm-gateway/s3-creds:
#     access_key_id:     <minio app key>
#     secret_access_key: <minio app secret>

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-gateway-cnpg-s3
  namespace: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: llm-gateway-cnpg-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: cnpg/llm-gateway/s3-creds
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: cnpg/llm-gateway/s3-creds
        property: secret_access_key
