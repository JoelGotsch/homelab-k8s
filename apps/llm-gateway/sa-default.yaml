# Declare the default ServiceAccount with imagePullSecrets so
# every pod in this ns (LiteLLM Deployment, migrations Job,
# Presidio sidecars) inherits the Forgejo Packages pull cred.
# Per platform/forgejo/README.md §"First-party image pulls".
#
# Why we re-declare instead of patching: kustomize patches
# against the auto-created default SA are fragile (the SA
# isn't in the rendered manifest list — kustomize can't see
# it pre-apply). Re-declaring is the canonical pattern;
# `kubectl apply` merges with the auto-created object by
# name/ns. The Argo Server-Side Apply diff treats this as
# field ownership only — no churn on the SA's
# auto-generated token references.
#
# Mixed-image safety: the registry-homelab-internal-pull
# Secret only carries creds for `registry.homelab.internal`.
# Kubelet scopes dockerconfigjson lookups by registry host,
# so Presidio's mcr.microsoft.com pulls remain anonymous
# and unaffected.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: llm-gateway
imagePullSecrets:
  - name: registry-homelab-internal-pull
