apiVersion: v1
kind: Namespace
metadata:
  name: llm-gateway
  labels:
    # ADR 0036: first-party namespace enrolment.
    homelab.internal/first-party: "true"
    # `internal` — LiteLLM budget/spend + provider key metadata
    # (Presidio strips PII from prompts before external egress).
    homelab.internal/data-class: internal
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
