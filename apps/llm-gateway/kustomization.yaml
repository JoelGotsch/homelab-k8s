# llm-gateway — LiteLLM proxy + homelab tag-enforcement hooks.
# Per ADR 0026 + journal 2026-04-28-mlx-litellm-mac-inference.md.
#
# The image is a homelab-built variant of LiteLLM (sibling
# repo `llm-gateway/`) which pip-installs the `llm_gateway`
# Python package — that's what makes the proxy_config's
# `llm_gateway.hooks.*` callback paths importable.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm-gateway

helmCharts:
  # OCI chart pull composes URL as `{repo}/{name}` — if repo
  # already includes the chart name as a path suffix, helm
  # tries `…/litellm-helm/litellm-helm/manifests/<ver>`
  # which 404s. The published OCI artifact lives at
  # `oci://ghcr.io/berriai/litellm-helm` (the repo IS the
  # artifact, no name segment), so we drop the `name` field
  # to `litellm-helm` and the repo to its parent.
  # Chart version mirrors the LiteLLM PyPI version (per
  # BerriAI's release workflow) — but the appVersion is inert
  # for THIS deployment: values.yaml digest-pins the homelab-
  # built llm-gateway image, so chart bumps change templates/
  # labels only, never running app code. The real LiteLLM
  # version moves when that image is rebuilt (and THAT is the
  # event that runs new Prisma migrations — base-backup the
  # llm-gateway CNPG cluster first; first-ever base backup
  # taken 2026-07-17, see journal).
  - name: litellm-helm
    repo: oci://ghcr.io/berriai
    version: "1.92.0"  # OPERATOR PINS via Renovate
    releaseName: llm-gateway
    namespace: llm-gateway
    valuesFile: values.yaml

resources:
  - namespace.yaml
  - policies-configmap.yaml
  - externalsecret.yaml
  - cnpg-cluster.yaml
  - cnpg-s3-externalsecret.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - presidio-deployment.yaml
  # Forgejo Packages pull cred + default-SA wiring. Per
  # platform/forgejo/README.md §"First-party image pulls".
  - registry-pull-secret.yaml
  - sa-default.yaml

# ADR 0036: cluster-wide resource-governance baseline
# (LimitRange + ResourceQuota + default-deny NetPol scaffold).
components:
  - ../../components/first-party-namespace

# Two patches on the chart-rendered migrations Job:
#   (1) Strategic-merge — add the PSA-restricted-compliant
#       pod-level securityContext fields (see patch file).
#   (2) JSON-6902 — strip the policies ConfigMap mount that
#       the chart attaches by default. The migration container
#       only runs Prisma schema deltas, never reads the policies
#       file; and the ConfigMap is in the regular Sync wave while
#       the Job is a PreSync hook, so kubelet loops on
#       "MountVolume.SetUp failed: configmap llm-gateway-policies
#       not found" forever. Strategic-merge can't reliably zero
#       a list (would inherit), so a JSON patch with explicit
#       `op: remove` is the cleanest way.
patches:
  - path: migrations-job-psa-patch.yaml
    target:
      kind: Job
      name: llm-gateway-litellm-migrations
  - target:
      kind: Job
      name: llm-gateway-litellm-migrations
    patch: |
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts
      - op: remove
        path: /spec/template/spec/volumes
