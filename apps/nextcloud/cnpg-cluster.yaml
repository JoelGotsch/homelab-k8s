# CNPG Postgres for Nextcloud. Same shape as Forgejo +
# Authentik. Per ADR 0006 backup chain.

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-pg
  namespace: nextcloud
spec:
  instances: 2

  # Propagate labels to CNPG-managed children. Picked up by
  # infrastructure/longhorn/recurring-jobs.yaml's
  # `secret-personal` group: hourly snapshots × 7d retain.
  # Nextcloud is `personal`-class (user files + calendar).
  #
  # 2026-07-09 ADR 0036: CNPG Postgres data volume moves to the
  # -retain family. Default longhorn-replica3 is now reclaim=Delete;
  # Nextcloud DB carries user accounts, file metadata, calendar,
  # contacts — must not be released on a stray PVC delete.
  # CNPG propagates inheritedMetadata.annotations to child PVCs at
  # reconcile time (per CNPG docs), satisfying the Kyverno
  # homelab-disallow-retain-reclaim-without-annotation policy.
  inheritedMetadata:
    labels:
      recurring-job-group.longhorn.io/secret-personal: "enabled"
    annotations:
      retention.homelab.internal/reason: "Nextcloud DB — user accounts, file metadata, calendar, contacts."

  storage:
    size: 10Gi
    storageClass: longhorn-replica3-retain

  monitoring:
    enablePodMonitor: true

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "128MB"

  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud

  backup:
    barmanObjectStore:
      destinationPath: s3://homelab-backups-cluster/cnpg/nextcloud
      endpointURL: http://minio.minio-on-nas.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: nextcloud-cnpg-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: nextcloud-cnpg-s3
          key: SECRET_ACCESS_KEY
      wal:
        compression: bzip2
      data:
        compression: bzip2
    # Family + operator personal data; longer retention than
    # the 30d default, similar to Authentik.
    retentionPolicy: "90d"
