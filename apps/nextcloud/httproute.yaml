# Nextcloud HTTPRoute via Cilium Gateway.
# Tailscale-only per ADR 0024 D5 — non-E2EE files /
# calendar / contacts don't qualify for Cloudflare TLS
# termination. Phase 2 reconsider only if Nextcloud E2EE
# app investigation surfaces a viable encrypted-at-rest
# story (per TODO.md "Investigate Nextcloud E2EE").
#
# OPERATOR FILLS vyramo.com.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: ingress
      sectionName: https
  hostnames:
    - "nextcloud.lab.vyramo.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nextcloud
          port: 8080
