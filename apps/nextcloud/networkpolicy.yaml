# NetworkPolicies for Nextcloud.
#
# Implemented as CiliumNetworkPolicy (not vanilla NetworkPolicy)
# because Cilium Gateway API traffic carries the reserved
# `ingress` identity, NOT the source namespace identity. K8s
# NetPol's `namespaceSelector: kubernetes.io/metadata.name=ingress`
# silently drops Gateway → Nextcloud traffic (503 / 5s timeout).
# See homelab-k8s/platform/authentik/networkpolicy.yaml for the
# canonical write-up.

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
  ingress:
    # Cilium Gateway envoy — reserved `ingress` identity.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Prometheus scrape.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9205"
              protocol: TCP
  egress:
    # kube-DNS.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # CNPG Postgres (same ns).
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: nextcloud-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Bundled Redis (same ns).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # Authentik OIDC discovery + token validation.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
# NAS NFS egress is NOT allowed from Nextcloud pods — per
# ADR 0030 §D1 the csi-rclone driver in `csi-rclone` ns is
# the only thing that talks to the NAS. Nextcloud sees the
# encrypted shares as normal mounted filesystems via CSI;
# if a PVC fails to bind, the pod fails to start (correct
# behaviour — fail-closed).
