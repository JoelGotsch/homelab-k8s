# NetworkPolicies for Nextcloud.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
  policyTypes: [Ingress, Egress]
  ingress:
    # Cilium Gateway envoy.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - port: 8080
          protocol: TCP
    # Prometheus scrape.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9205
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # CNPG Postgres (same ns).
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: nextcloud-pg
      ports:
        - port: 5432
          protocol: TCP
    # Bundled Redis (same ns).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
          protocol: TCP
    # Authentik OIDC discovery + token validation.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - port: 9000
          protocol: TCP
# NAS NFS egress is NOT allowed from Nextcloud pods — per
# ADR 0030 §D1 the csi-rclone driver in `csi-rclone` ns is
# the only thing that talks to the NAS. Nextcloud sees the
# encrypted shares as normal mounted filesystems via CSI;
# if a PVC fails to bind, the pod fails to start (correct
# behaviour — fail-closed).
