# ExternalSecrets for Nextcloud.

# Admin user credentials. Operator creates the first admin
# during chart install via env (NEXTCLOUD_ADMIN_USER +
# NEXTCLOUD_ADMIN_PASSWORD); subsequent admin login uses the
# password set here. Family members are added via the
# Nextcloud admin UI post-bring-up (or via Authentik OIDC
# once that lands).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nextcloud-admin
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nextcloud-admin
    creationPolicy: Owner
  data:
    - secretKey: NEXTCLOUD_ADMIN_USER
      remoteRef:
        key: nextcloud/admin
        property: username
    - secretKey: NEXTCLOUD_ADMIN_PASSWORD
      remoteRef:
        key: nextcloud/admin
        property: password
---
# CNPG-issued postgres password.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nextcloud-postgres-creds
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nextcloud-postgres-creds
  data:
    - secretKey: password
      remoteRef:
        key: nextcloud/postgres
        property: password
---
# Authentik OIDC ships dormant. Operator runs
# provision-authentik-oidc-client.sh post-Authentik-bring-up;
# then enables Nextcloud's user_oidc app via occ.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nextcloud-oidc
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nextcloud-oidc
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: nextcloud/oidc
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: nextcloud/oidc
        property: client_secret
    - secretKey: issuer
      remoteRef:
        key: nextcloud/oidc
        property: issuer
---
# CNPG barman backup creds.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nextcloud-cnpg-s3
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nextcloud-cnpg-s3
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: cnpg/nextcloud/s3-creds
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: cnpg/nextcloud/s3-creds
        property: secret_access_key
