apiVersion: v1
kind: Namespace
metadata:
  name: nextcloud
  labels:
    # ADR 0036: first-party namespace enrolment.
    homelab.internal/first-party: "true"
    # `personal` — operator + family files, calendars, contacts.
    homelab.internal/data-class: personal
    # `baseline` exception (2026-05-29 decision). The official nextcloud
    # apache image's entrypoint must start as root — writes PHP conf.d,
    # chowns data, binds :80 — then drops to www-data. restricted PSS
    # (runAsNonRoot) breaks that, and the chart's non-root path (fpm +
    # unprivileged-nginx + custom config + writable conf.d) is a heavy
    # multi-override rework, deferred as a hardening TODO. Access isolation
    # for this `personal`-class data is enforced by NetworkPolicies +
    # Authentik OIDC, not the root-vs-nonroot bit. baseline still blocks
    # privileged / host namespaces / hostPath / dangerous caps.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
