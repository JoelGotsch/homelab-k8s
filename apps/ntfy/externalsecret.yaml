# Admin credentials for ntfy. Used by the first-install
# bootstrap (operator runs `ntfy user add admin --role=admin`
# inside the pod) and by operator's break-glass access via
# the ntfy CLI.
#
# OpenBao path layout:
#   kv/data/ntfy/admin-password:
#     value: <strong random password, openssl rand -base64 32>
#   kv/data/ntfy/relay-token:
#     value: <bearer token issued for the relay's publish-only user>
#
# The relay-token here is the SAME value the relay reads at
# kv/ntfy/publish-auth (in its own ExternalSecret as
# NTFY_AUTH_HEADER, formatted as `Bearer <token>`). Operator
# writes to both paths at first install.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ntfy-admin-creds
  namespace: ntfy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ntfy-admin-creds
    creationPolicy: Owner
  data:
    - secretKey: admin_password
      remoteRef:
        key: ntfy/admin-password
        property: value
    - secretKey: relay_token
      remoteRef:
        key: ntfy/relay-token
        property: value
