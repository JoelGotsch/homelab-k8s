# HTTPRoute for ntfy server.
#
# Phase 1 (current): cluster-internal only. The Cilium
# Gateway routes `ntfy.lab.vyramo.com` to the ntfy
# Service. Operator subscribes via the F-Droid app over
# Tailscale (Tailscale → cluster Ingress) per
# ADR 0024 D1 phase-1.
#
# Phase 2 (when relay + end-to-end-verify are complete):
# Cloudflare Tunnel fronts `ntfy.vyramo.com`,
# fanning out to subscribers regardless of network. The
# E2EE relay's existence is the gate per ADR 0024 D1.
# Phase-2 cutover doesn't change this manifest — only
# the Cloudflare-side tunnel config + DNS records flip.
#
# OPERATOR FILLS vyramo.com at first commit; caught
# by scripts/check-placeholders.sh.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ntfy
  namespace: ntfy
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: ingress
      sectionName: https
  hostnames:
    - "ntfy.lab.vyramo.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ntfy
          port: 80
