# ntfy server — message broker for the operator's alert path.
# Per ADR 0024 D1 phase-2.
#
# Companion to apps/ntfy-e2ee-relay/ which encrypts upstream
# webhook payloads before publishing here.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - pvc.yaml
  - configmap.yaml
  - externalsecret.yaml
  - deployment.yaml
  - httproute.yaml
  - networkpolicy.yaml
