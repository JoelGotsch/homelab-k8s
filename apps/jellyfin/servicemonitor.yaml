# Jellyfin's BUILT-IN Prometheus metrics on /metrics (port 8096), gated by
# <EnableMetrics> in system.xml. Enabled via the enable-metrics initContainer
# (values.yaml) — there is NO metrics plugin in the official Jellyfin repo
# (the old "jellyfin-plugin-metrics" note was wrong). Corrected 2026-07-16.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
