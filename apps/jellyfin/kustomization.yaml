# Jellyfin — family-shared media streaming. Per ADR 0024 D1
# (Cloudflare Tunnel for E2EE / `internal-media` services).
#
# Helm chart: jellyfin/jellyfin community chart.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jellyfin

helmCharts:
  - name: jellyfin
    repo: https://jellyfin.github.io/jellyfin-helm
    version: "2.7.0"  # OPERATOR PINS via Renovate
    releaseName: jellyfin
    namespace: jellyfin
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - namespace.yaml
  - priorityclass.yaml
  - nfs-pv.yaml
  - externalsecret.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml

# ADR 0036: cluster-wide resource-governance baseline
# (LimitRange + ResourceQuota + default-deny NetPol scaffold).
components:
  - ../../components/first-party-namespace
  - ../../components/site-config   # build-only ConfigMap for the replacement below

# The Helm chart creates the config PVC on Longhorn (Jellyfin's
# config + cache + library DB). Patch in the recurring-job-group
# label so it joins infrastructure/longhorn/recurring-jobs.yaml's
# `internal-media` group (daily × 7d retain — appropriate for
# multi-TB-class workloads where hourly snapshots would amplify
# disk pressure). Targets only Helm-managed PVCs; the NFS media
# PV in nfs-pv.yaml is not touched (it's not Longhorn anyway).
patches:
  - target:
      kind: PersistentVolumeClaim
      labelSelector: "app.kubernetes.io/managed-by=Helm"
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: not-used
        labels:
          recurring-job-group.longhorn.io/internal-media: "enabled"

  # Argo CD `Replace=true` on the Deployment. The chart sets
  # strategy.type=Recreate (single-replica + RWO Longhorn config
  # PVC; rolling deadlocks PVC attachment). Server-side apply
  # cannot atomically remove the `rollingUpdate` block when
  # flipping `type: RollingUpdate → Recreate` on an existing
  # Deployment whose previous reconciler (helm pre-Argo, or an
  # older chart render that produced rollingUpdate defaults)
  # left those fields populated — k8s API rejects with
  # `spec.strategy.rollingUpdate: Forbidden: may not be
  # specified when strategy type is 'Recreate'`. The
  # Replace=true sync-option tells Argo to recreate the
  # Deployment instead of patching it, clearing the residual
  # rollingUpdate block in one apply. Safe because the
  # Deployment owns no persistent state directly — config + media
  # live on PVCs that survive the recreate.
  - target:
      kind: Deployment
      name: jellyfin
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: jellyfin
        annotations:
          argocd.argoproj.io/sync-options: Replace=true

# Resolve the HTTPRoute hostname from the single site-config (no hardcoded
# domain): <prefix>.FQDN_SUFFIX -> <prefix>.<fqdn_suffix>. Provenance: this rule
# -> ConfigMap/site-config.data.fqdn_suffix -> components/site-config/site-config.env.
replacements:
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.fqdn_suffix }
    targets:
      - select: { kind: HTTPRoute, name: jellyfin }
        fieldPaths: [spec.hostnames.0]
        options: { delimiter: '.', index: 1 }
