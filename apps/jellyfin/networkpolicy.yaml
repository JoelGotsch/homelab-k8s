# NetworkPolicies for Jellyfin.
#
# Implemented as CiliumNetworkPolicy (not vanilla NetworkPolicy)
# because Cilium Gateway API traffic carries the reserved
# `ingress` identity, NOT the source namespace identity. K8s
# NetPol's `namespaceSelector: kubernetes.io/metadata.name=ingress`
# silently drops Gateway → Jellyfin traffic (503 / 5s timeout).
# See homelab-k8s/platform/authentik/networkpolicy.yaml for the
# canonical write-up.

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  ingress:
    # Cilium Gateway envoy — reserved `ingress` identity.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
            - port: "8920"
              protocol: TCP   # HTTPS upstream (rarely used in
                              # this topology)
    # Prometheus scrape (Jellyfin doesn't ship native metrics;
    # community plugin exposes them).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    # cloudflare-tunnel namespace (Phase 2 public ingress
    # per ADR 0024 D1; jellyfin's `internal-media` class
    # qualifies for CF TLS termination).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloudflare-tunnel
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Authentik OIDC (when SSO plugin installed).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
# CCNP for NFS egress to NAS + plugin-fetch (Jellyfin pulls
# plugins from its repository at first install; subsequent
# updates).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: jellyfin-egress
  namespace: jellyfin
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    # NFS to NAS.
    - toCIDR:
        - "10.10.40.2/32"
      toPorts:
        - ports:
            - port: "2049"
              protocol: TCP
            - port: "111"
              protocol: TCP
    # Jellyfin plugin repo + metadata sources (TheTVDB,
    # TheMovieDB, MusicBrainz). Operator extends if plugins
    # demand more.
    - toFQDNs:
        - matchName: "repo.jellyfin.org"
        - matchName: "api.themoviedb.org"
        - matchName: "image.tmdb.org"
        - matchName: "thetvdb.com"
        - matchName: "api.thetvdb.com"
        - matchName: "musicbrainz.org"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
