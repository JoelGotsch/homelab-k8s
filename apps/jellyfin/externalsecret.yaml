# ExternalSecrets for Jellyfin.
#
# Authentik OIDC ships dormant. Operator activates by:
# 1. provision-authentik-oidc-client.sh seeds OpenBao
# 2. Operator installs the LDAP/SSO Jellyfin plugin
#    (Jellyfin doesn't natively support OIDC; a community
#    plugin bridges Authentik OIDC → Jellyfin user provisioning)
# 3. Plugin pulls config from kv/jellyfin/oidc via the
#    Secret env-projected below.

# OIDC client creds (consumed by the SSO plugin once installed).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jellyfin-oidc
  namespace: jellyfin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: jellyfin-oidc
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: jellyfin/oidc
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: jellyfin/oidc
        property: client_secret
    - secretKey: issuer
      remoteRef:
        key: jellyfin/oidc
        property: issuer
