# Jellyfin HTTPRoute via Cilium Gateway.
#
# Phase 1 (today): Tailscale-only on
#   jellyfin.lab.vyramo.com
# Phase 2 (when infrastructure/cloudflare-tunnel/ lands per
# ADR 0024 D1): public-facing on
#   jellyfin.vyramo.com
# via Cloudflare Tunnel. Per ADR 0024 D1, Jellyfin's
# `internal-media` content classification permits CF TLS
# termination.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: ingress
      sectionName: https
  hostnames:
    - "jellyfin.FQDN_SUFFIX"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jellyfin
          port: 8096
