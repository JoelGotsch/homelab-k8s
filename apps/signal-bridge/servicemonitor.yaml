# Self-metrics scrape via kube-prometheus-stack.
#
# bbernhard/signal-cli-rest-api with ENABLE_METRICS=1 (set in
# signal-bridge-config ConfigMap) exposes Prometheus-format
# metrics at /v1/metrics on the API port.

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: signal-bridge
  namespace: signal-bridge
  labels:
    app.kubernetes.io/name: signal-bridge
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: signal-bridge
  endpoints:
    - port: http
      path: /v1/metrics
      interval: 60s
      scrapeTimeout: 30s
