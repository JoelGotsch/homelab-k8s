# Signal-cli durable state.
#
# bbernhard/signal-cli-rest-api stores registration data,
# session state, and the local message database under
# /home/.local/share/signal-cli/. Loss of this PVC means
# re-registering the Signal account (operator action;
# requires SMS to the registered phone).
#
# Backup path: Longhorn replica2 snapshot → restic tier-3
# (per ADR 0006 + infrastructure/backup-cronjobs/). The
# offline-recovery archive (ADR 0011) is the second copy.
#
# Sizing: registration + session state is a few MiB; the
# message database grows with received Signal messages.
# For an alert-only sender (no inbound conversations), 2 GiB
# is comfortable. Bump if the operator starts using Signal-
# cli for two-way conversations.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signal-bridge-data
  namespace: signal-bridge
  labels:
    app.kubernetes.io/name: signal-bridge
    app.kubernetes.io/component: data
  annotations:
    # ADR 0036: -retain SCs require a rationale.
    # signal-cli registration data + private device identity keys —
    # a stray PVC delete forces re-registration (SMS to the operator's
    # phone). The openbao-seal-watchdog escape hatch depends on this
    # bridge staying registered, so retention is load-bearing.
    retention.homelab.internal/reason: "signal-cli registration + private device identity keys; loss forces re-registration (SMS) and breaks the alerting escape hatch."
spec:
  accessModes: [ReadWriteOnce]
  # 2026-07-09 ADR 0036: migrate to -retain family.
  storageClassName: longhorn-replica2
  resources:
    requests:
      storage: 2Gi
