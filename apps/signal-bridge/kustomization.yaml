# signal-bridge — bbernhard/signal-cli-rest-api wrapper around
# signal-cli. Per ADR 0009 (approval channel) + ADR 0021 D7
# (Signal as high-severity alert sink).
#
# This layer owns ONLY the transport: the signal-cli daemon,
# its registration data, and the HTTP wrapper. Higher-level
# alert-formatting + audit-logging + approval-state-machine
# lives at apps/approval-channel/.
#
# No ExternalSecret here: signal-cli registration data lives
# on the PVC (one-time operator-action to register; backup via
# Longhorn snapshot + restic tier-3 + offline-recovery archive
# per ADR 0006 + 0011).

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - networkpolicy.yaml
  - ciliumnetworkpolicy-egress.yaml
  - servicemonitor.yaml
