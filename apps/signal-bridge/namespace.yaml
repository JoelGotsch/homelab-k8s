# Dedicated namespace for the Signal-cli transport layer.
#
# Per ADR 0021 D7 + ADR 0009: signal-bridge is the low-level
# component that owns the signal-cli daemon + its registration
# state. Higher-level routing/formatting/audit lives at
# apps/approval-channel/.
#
# PSA: baseline. Signal-cli runs as a long-lived non-root
# daemon; no privileged access required.
apiVersion: v1
kind: Namespace
metadata:
  name: signal-bridge
  labels:
    # ADR 0036: first-party namespace enrolment.
    homelab.internal/first-party: "true"
    # `secret` — Signal-cli registration data + private device
    # identity keys on the PVC. Loss forces re-registration.
    homelab.internal/data-class: secret
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
