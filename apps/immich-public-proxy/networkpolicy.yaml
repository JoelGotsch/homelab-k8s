# NetworkPolicies for immich-public-proxy.
#
# Ingress: ONLY cloudflare-tunnel (the public entry point) +
# Prometheus scrape if/when the upstream image exposes metrics
# (it doesn't today; placeholder block kept commented).
#
# Egress: kube-DNS + the immich namespace's server Service.
# Nothing else — the proxy is creds-free and doesn't reach
# external services on its own.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-public-proxy
  namespace: immich-public-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: immich-public-proxy
  policyTypes: [Ingress, Egress]
  ingress:
    # cloudflare-tunnel is the only ingress source. The proxy
    # is intentionally NOT exposed via Cilium Gateway / HTTPRoute
    # (operator + family use Immich directly via Tailscale).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - port: 3000
          protocol: TCP
    # If alangrainger/immich-public-proxy adds a metrics endpoint
    # in a future release, uncomment + add a ServiceMonitor.
    # - from:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: monitoring
    #       podSelector:
    #         matchLabels:
    #           app.kubernetes.io/name: prometheus
    #   ports:
    #     - port: 3000
    #       protocol: TCP
  egress:
    # kube-DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Upstream Immich server (cluster-internal).
    #
    # LABEL TRAP: the official immich-app/immich-charts helm chart
    # labels the server pod `app.kubernetes.io/name: server`
    # (+ `app.kubernetes.io/instance: immich`), NOT
    # `app.kubernetes.io/name: immich-server` as the Service name
    # might suggest. Selecting on `immich-server` here matched zero
    # pods → every TCP SYN to immich-server.immich.svc.cluster.local
    # :2283 was DROPPED by Cilium with `policy-verdict:none`, IPP
    # pods crash-looped on the /share/healthcheck probe (which
    # round-trips through Immich). Namespace pin + the chart's two
    # canonical labels is the correct shape; instance pin keeps this
    # rule from over-broadly matching any future `name=server` pod
    # that lands in the `immich` ns.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: immich
          podSelector:
            matchLabels:
              app.kubernetes.io/name: server
              app.kubernetes.io/instance: immich
      ports:
        - port: 2283
          protocol: TCP
