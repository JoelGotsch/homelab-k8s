# Topic AES-256 key + (optional) ntfy publish auth header
# from OpenBao. Per ADR 0024 D1 phase-2.
#
# OpenBao path layout:
#   kv/data/ntfy/topic-key:
#     value: <base64-encoded 32-byte AES-256 key>
#   kv/data/ntfy/publish-auth:        (optional)
#     header: "Bearer tk_xxx"          (or "Basic ...")
#
# Key rotation = annual + manual: generate new 32-byte key,
# `bao kv put kv/ntfy/topic-key value=<new-b64>`, restart the
# relay (ESO refresh + pod restart), update F-Droid app config.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ntfy-e2ee-relay-secrets
  namespace: ntfy-e2ee-relay
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ntfy-e2ee-relay-secrets
    creationPolicy: Owner
  data:
    - secretKey: NTFY_TOPIC_KEY_B64
      remoteRef:
        key: ntfy/topic-key
        property: value
    - secretKey: NTFY_AUTH_HEADER
      remoteRef:
        key: ntfy/publish-auth
        property: header
        # If the optional path doesn't exist, ESO emits an
        # empty string; the relay's config loader treats
        # empty as None (per tests/test_config.py).
