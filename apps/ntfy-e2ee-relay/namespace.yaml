apiVersion: v1
kind: Namespace
metadata:
  name: ntfy-e2ee-relay
  labels:
    # ADR 0036: first-party namespace enrolment.
    homelab.internal/first-party: "true"
    # `internal` — stateless AES-GCM re-encryption sidecar; sees
    # alert plaintext in transit but stores nothing at rest.
    homelab.internal/data-class: internal
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
