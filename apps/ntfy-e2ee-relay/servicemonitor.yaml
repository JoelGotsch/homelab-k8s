# ServiceMonitor for ntfy-e2ee-relay's /metrics endpoint.
# Picked up by the kube-prometheus-stack Prometheus operator
# (matches the operator's `release: kube-prometheus-stack`
# label selector — convention for the chart's serviceMonitorSelector).
#
# The relay exposes:
#   ntfy_relay_publish_total{status,wire_format}      counter
#   ntfy_relay_encrypt_duration_seconds                histogram
#   ntfy_relay_payload_bytes                           histogram
#
# Per ADR 0021 + the ntfy-e2ee-relay journal entry's deferred
# observability follow-up (now closed by this manifest +
# the sibling-repo /metrics endpoint).

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ntfy-e2ee-relay
  namespace: ntfy-e2ee-relay
  labels:
    # The chart-default selector. Operator confirms this matches
    # the actual selector on the Prometheus CR at observability
    # rollout; if the chart was installed with a custom release
    # name, update this label.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy-e2ee-relay
  namespaceSelector:
    matchNames:
      - ntfy-e2ee-relay
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      # Operator can add metricRelabelings if a metric series
      # cardinality blows up; not expected at the homelab's
      # alert volume.
