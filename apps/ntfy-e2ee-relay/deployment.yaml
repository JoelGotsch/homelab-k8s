# Plain Deployment + Service — no Helm chart from upstream
# (the relay is operator-owned code per ADR 0001). Operator
# edits values.yaml; this manifest references the values via
# ConfigMap + Secret env mounts.

apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-e2ee-relay-config
  namespace: ntfy-e2ee-relay
data:
  # Cluster-internal endpoint for the cluster-hosted ntfy.
  # Operator updates if the ntfy server moves namespaces.
  NTFY_BASE_URL: "http://ntfy.ntfy.svc.cluster.local"
  NTFY_TOPIC: "homelab-alerts"
  NTFY_WIRE_FORMAT: "aes-256-gcm.b64"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy-e2ee-relay
  namespace: ntfy-e2ee-relay
  labels:
    app.kubernetes.io/name: ntfy-e2ee-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy-e2ee-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy-e2ee-relay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: "registry.homelab.internal/ntfy-e2ee-relay:0.1.0"  # OPERATOR PINS via Renovate
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: ntfy-e2ee-relay-config
            - secretRef:
                name: ntfy-e2ee-relay-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy-e2ee-relay
  namespace: ntfy-e2ee-relay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ntfy-e2ee-relay
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
