# Plain Deployment + Service — no Helm chart from upstream
# (the relay is operator-owned code per ADR 0001). Operator
# edits values.yaml; this manifest references the values via
# ConfigMap + Secret env mounts.

apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-e2ee-relay-config
  namespace: ntfy-e2ee-relay
data:
  # Cluster-internal endpoint for the cluster-hosted ntfy.
  # Operator updates if the ntfy server moves namespaces.
  NTFY_BASE_URL: "http://ntfy.ntfy.svc.cluster.local"
  NTFY_TOPIC: "homelab-alerts"
  NTFY_WIRE_FORMAT: "aes-256-gcm.b64"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy-e2ee-relay
  namespace: ntfy-e2ee-relay
  labels:
    app.kubernetes.io/name: ntfy-e2ee-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy-e2ee-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy-e2ee-relay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          # Namespace `ci-packages/` (not bare `ntfy-e2ee-relay`)
          # because Forgejo Packages OCI namespaces images by owner
          # and the ci-packages bot can only push to its own
          # namespace — matches the pr-agent + llm-gateway
          # precedent. First successful CI build landed 2026-06-24
          # (Woodpecker pipeline #5 on the source repo
          # forgejo-admin/ntfy-e2ee-relay, tag 0.1.0).
          # Digest pin (ADR 0019 D3 — replaces the stale "OPERATOR PINS via
          # Renovate" note). The digest is also load-bearing: after the
          # 2026-07-18 registry blob loss + CI rebuild, Spegel peers kept
          # advertising the STALE index for the bare `0.1.0` tag from their
          # containerd content stores (manifest metadata survives without
          # blobs), so tag pulls kept resolving to the dead manifest. A
          # digest reference cannot be poisoned by stale tag resolution.
          # Digest = the rebuilt multi-arch index as served by Forgejo.
          image: "registry.homelab.internal/ci-packages/ntfy-e2ee-relay:0.1.0@sha256:f5ef56147681e036559c049ab69c4e9b8a0a106e8d4840ed55a384aa66c5750f"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: ntfy-e2ee-relay-config
            - secretRef:
                name: ntfy-e2ee-relay-secrets
            - secretRef:
                name: ntfy-e2ee-relay-inbound-auth
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy-e2ee-relay
  namespace: ntfy-e2ee-relay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ntfy-e2ee-relay
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
