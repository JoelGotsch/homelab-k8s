# Helm-style values consumed by the relay Deployment manifest.
# Plain kustomize (no Helm chart from upstream — the relay is
# operator-owned code), so this is just operator-edited config
# referenced in the Deployment via configMap or env-var refs.

# Image — built by Woodpecker on tag-push to the source repo
# forgejo-admin/ntfy-e2ee-relay (.woodpecker.yml added 2026-06-24).
#
# Namespace `ci-packages/` (not bare `ntfy-e2ee-relay`) because
# Forgejo Packages OCI namespaces images by owner and the
# ci-packages bot can only push to its own namespace — matches
# the pr-agent + llm-gateway precedent. The bare path didn't
# exist as the Deployment had been ImagePullBackOff for ~31d
# (pre-2026-06-24); the first successful build landed at this
# path via pipeline #5 (commit 7d16e8d6, tag 0.1.0).
image:
  repository: registry.homelab.internal/ci-packages/ntfy-e2ee-relay
  tag: "0.1.1"  # OPERATOR PINS via Renovate
  pullPolicy: IfNotPresent

# Single replica — webhook proxy is stateless but write-once
# per alert; multi-replica adds no value for this load profile.
replicas: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Cluster-internal config. Operator overrides per-environment
# in the relay-config ConfigMap (rendered into the Deployment
# at sync time).
config:
  ntfyBaseUrl: "http://ntfy.ntfy.svc.cluster.local"
  ntfyTopic: "homelab-alerts"
  wireFormat: "aes-256-gcm.b64"
