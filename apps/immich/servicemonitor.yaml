# Immich ships native Prometheus metrics on the server pod.
# Enabled in values.yaml via env IMMICH_METRICS=true (default
# in recent versions). ServiceMonitor here scrapes the server
# Service.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: immich-server
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-server
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  endpoints:
    - port: http
      path: /api/server/metrics
      interval: 60s
