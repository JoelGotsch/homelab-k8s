# Immich HTTPRoute via Cilium Gateway.
#
# Phase 1 (today): Tailscale-only on
#   immich.lab.vyramo.com
# Phase 2: NEVER public on this hostname. Per ADR 0024 D1,
# public album-sharing is delegated to the read-only
# `apps/immich-public-proxy/` layer published at
# `photos.vyramo.com` via Cloudflare Tunnel — Immich's
# admin UI / API / mobile-backup endpoint stay Tailscale-only
# at all times. See `04-guides/photo-management-with-immich.md`
# §"Sharing albums with friends".

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: ingress
      sectionName: https
  hostnames:
    - "immich.lab.vyramo.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: immich-server
          port: 2283
