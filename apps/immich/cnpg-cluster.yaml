# CNPG Postgres for Immich. Same shape as Forgejo / Authentik /
# Nextcloud, with one difference: Immich requires the
# **vectorchord** extension (CLIP embeddings + face vectors) so
# the imageName below points at a VectorChord-enabled Postgres
# build rather than the stock cloudnative-pg image. The image
# also includes pgvector + pgvecto.rs so it can restore from
# pre-v1.133 backups.
#
# Was ghcr.io/corentingiraud/cnpg-pgvector-vectorchord:17-vchord-0.4.3 —
# that personal mirror went stale (its registry now only publishes a
# single `16-migration` tag) → ImagePullBackOff, cluster stuck "Setting
# up primary". Switched 2026-05-27 to the canonical upstream
# ghcr.io/tensorchord/cloudnative-vectorchord at the identical PG major
# (17) + VectorChord version (0.4.3).
#
# See: https://github.com/tensorchord/VectorChord
# + https://docs.immich.app/administration/postgres-standalone/

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-pg
  namespace: immich
spec:
  instances: 2

  # Propagate labels to CNPG-managed children. Picked up by
  # infrastructure/longhorn/recurring-jobs.yaml's
  # `secret-personal` group: hourly snapshots × 7d retain.
  # Immich is `personal`-class (photos + face/embedding metadata).
  inheritedMetadata:
    labels:
      recurring-job-group.longhorn.io/secret-personal: "enabled"

  # OPERATOR PINS via Renovate. The image must include
  # vectorchord (loaded via shared_preload_libraries below).
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17-0.4.3

  storage:
    size: 20Gi
    storageClass: longhorn-replica3

  monitoring:
    enablePodMonitor: true

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
    # `shared_preload_libraries` is a CNPG-managed FIXED parameter
    # — setting it under `parameters:` makes CNPG reject the Cluster
    # with "Can't set fixed configuration parameter". Use the
    # top-level list under `spec.postgresql.shared_preload_libraries`.
    # Required by vectorchord per upstream Immich docs.
    shared_preload_libraries:
      - vchord.so

  bootstrap:
    initdb:
      database: immich
      owner: immich
      # Install required extensions on the freshly created DB.
      # vectorchord depends on pgvector >=0.7,<0.9 — both ship
      # in the image; CNPG runs CREATE EXTENSION at bootstrap.
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;

  backup:
    barmanObjectStore:
      destinationPath: s3://homelab-backups-cluster/cnpg/immich
      endpointURL: http://minio.minio-on-nas.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: immich-cnpg-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: immich-cnpg-s3
          key: SECRET_ACCESS_KEY
      wal:
        compression: bzip2
      data:
        compression: bzip2
    # Photos are personal data, classification `personal` per
    # ADR 0003. 90d retention to match Nextcloud / Authentik.
    retentionPolicy: "90d"
