# ExternalSecrets for Immich.
#
# Two upstream paths in OpenBao:
#   - kv/immich/oidc       Authentik OIDC client (operator + family
#                          login)
#   - kv/immich/cnpg-s3    MinIO creds for CNPG WAL archival
#                          (sibling to nextcloud-cnpg-s3 +
#                          authentik-cnpg-s3)
#
# DB credentials are NOT in OpenBao — CNPG generates the
# `immich-pg-app` Secret in-namespace at cluster bootstrap with
# host/username/password/dbname for the `immich` role. values.yaml
# wires the env vars from there directly.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: immich-oidc
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: immich-oidc
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: immich/oidc
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: immich/oidc
        property: client_secret
    - secretKey: issuer
      remoteRef:
        key: immich/oidc
        property: issuer
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: immich-cnpg-s3
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: immich-cnpg-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: immich/cnpg-s3
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: immich/cnpg-s3
        property: secret_access_key
