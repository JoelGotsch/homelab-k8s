# Immich helm values (immich-app/immich-charts).
# Per ADR 0024 (Tailscale-only Phase 1 + CF Tunnel via
# immich-public-proxy for public album sharing) +
# ADR 0025 D4 (Immich replaces Synology Photos / PhotoPrism) +
# ADR 0030 (csi-rclone + hot/cold storage split) +
# identity.md (Authentik OIDC).
#
# Storage layout per ADR 0030 §D2 (immich v3 paths — the upload
# root moved from /usr/src/app/upload to /data in v3.0.0):
#   /data                       ← Longhorn (immich-hot PVC)
#                                 thumbs, previews, encoded
#                                 video, profile, DB backups,
#                                 upload-staging
#   /data/library               ← csi-rclone (immich-originals
#                                 PVC, StorageClass
#                                 nas-crypt-personal-photos)
#                                 storage-template-organised
#                                 originals, encrypted at NAS
#
# The split keeps thumbs OFF rclone-crypt — every timeline
# scroll is local, no FUSE-decrypt on the hot path. The
# 8-10x read amplification observed on rclone-mounted thumbs
# (Immich discussion #3814) doesn't apply here.
#
# Postgres: EXTERNAL — bundled subchart disabled; uses the
# CNPG cluster from cnpg-cluster.yaml (vectorchord-enabled
# image, required for Immich smart-search + facial-recognition
# vector storage as of v1.133+).
#
# Redis: bundled (chart default; Immich's job queue is
# ephemeral, no need to externalise).
#
# Migration from NAS-Docker PhotoPrism per
# 03-runbooks/immich/migrate-from-photoprism.md.

# NOTE: image version is pinned by the chart appVersion (bumped via
# the kustomization.yaml chart `version:`). A top-level `image:` block
# is NOT a key this bjw-s-based chart reads — the real key is
# controllers.main.containers.main.image. The stale top-level block
# (immich-server:v1.135.0) that used to sit here was a dead no-op AND
# a latent downgrade trap if a future chart ever started reading it,
# so it was removed. Per-component image overrides, if ever needed,
# go under <component>.controllers.main.containers.main.image.

# Bundled Postgres subchart was removed in immich-charts 0.10.0
# (chart enforces this via a checks.yaml template — setting
# `postgresql.enabled: false` is rejected, not no-op'd). We
# use external CNPG (cnpg-cluster.yaml); connection details
# come via the chart's `immich.env` values pointing at the
# Service DNS + ESO-projected creds.

# Persistence — chart-managed PVCs, shared across all components
# (server, microservices, machine-learning). Previously this was
# under `server.persistence` + `microservices.persistence`
# separately; chart moved to a top-level `immich.persistence`
# block that all components mount.
immich:
  persistence:
    # Hot bucket on Longhorn — the chart's shared `library` mount,
    # auto-mounted at /data (immich v3's upload root) across all
    # components. Chart 0.13.1 (bjw-s common 4.x) only accepts
    # `existingClaim` here — enabled/mountPath/accessMode were
    # removed from the schema (the mount path is chart-fixed).
    library:
      existingClaim: immich-hot
    # NOTE: the cold-bucket `originals` mount is no longer a valid
    # `immich.persistence` entry in 0.13.1 (only `library` is
    # allowed here). It moved to `server.persistence.originals`
    # below — the server is the component that does originals file
    # I/O (ML reaches images over HTTP, not the filesystem).

# Server (HTTP API + web frontend).
server:
  enabled: true
  # Cold bucket on csi-rclone (immich-originals, nas-crypt-personal-
  # photos) stacked at the library/ subdir of the shared upload mount
  # (ADR 0030 hot/cold split). On the server only — it does the
  # originals file I/O; ML reaches images over HTTP. bjw-s common
  # persistence schema (existingClaim + globalMounts.path).
  persistence:
    originals:
      existingClaim: immich-originals
      globalMounts:
        # immich v3 moved the upload root from /usr/src/app/upload
        # to /data; storage-template originals live under /data/library.
        - path: /data/library
  # Mounts the immich-hot RWO PVC; replicaCount 1. Force Recreate so
  # a chart bump doesn't deadlock (new pod can't attach the RWO volume
  # while the old holds it). immich-charts uses the bjw-s controllers
  # structure → strategy lives at controllers.main.strategy. Added
  # 2026-05-27 (RWO rollout sweep, known-caveats §"Helm-chart rollouts
  # on RWO PVCs").
  controllers:
    main:
      strategy: Recreate
      # PSS-restricted compliance — pod + container hardening MUST be
      # under controllers.main.{pod,containers.main}.securityContext
      # in the bjw-s common schema, NOT at top-level podSecurityContext/
      # securityContext (those are silently dropped → both deployments
      # got rejected by PSS-restricted enforcement: violates "restricted:
      # latest": allowPrivilegeEscalation != false, drop:[ALL] missing,
      # runAsNonRoot != true, seccompProfile missing). Fixed 2026-06-01
      # (cluster degraded sweep). Same wrong-chart-key class as Langfuse
      # and the clickhouse-operator, just under a different chart schema.
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # immich writes /tmp + upload cache
            capabilities:
              drop: [ALL]
          # Immich-server env. DB_* + REDIS_* + OAUTH_* + vector-extension
          # selector — projected from CNPG-managed Secrets + the langfuse-
          # style external-secret pattern. The bjw-s common-chart schema
          # places ALL container env here, under
          # server.controllers.main.containers.main.env (map form). The
          # previous top-level `env:` + `extraEnv:` blocks at file-root
          # level were NOT chart keys → silently dropped at render → server
          # fell back to the chart-default DB_HOSTNAME="database" and hit
          # `getaddrinfo EAI_AGAIN database` on every startup
          # (CrashLoopBackOff). Same wrong-chart-key class as the PSS fix
          # above. Moved 2026-06-02; see TODO §"NAS-encryption follow-ups".
          resources:
            # Resource budget for the server container.
            # Moved here from root-level `resources:` (audit 2026-06-04,
            # finding #13): the immich chart uses the bjw-s common library;
            # root-level `resources:` is not a chart key → silently dropped.
            # Correct path: server.controllers.main.containers.main.resources.
            # Sized for ~100k photos, 2-3 simultaneous mobile-backup uploads.
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 4Gi
          env:
            # CNPG-issued user creds — Secret name comes from CNPG's
            # role-binding on the immich-pg cluster.
            DB_HOSTNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-pg-app
                  key: host
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-pg-app
                  key: username
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-pg-app
                  key: password
            DB_DATABASE_NAME:
              valueFrom:
                secretKeyRef:
                  name: immich-pg-app
                  key: dbname
            # Vectorchord required for v1.133+ smart-search; CNPG image
            # ships it. Tells Immich's startup probe which vector
            # extension to load.
            DB_VECTOR_EXTENSION: "vectorchord"
            # Valkey (Redis-compatible) bundled by the chart — service name
            # is `<release>-valkey` per bjw-s naming convention, not
            # `<release>-redis-master` (which is the Bitnami-Redis convention
            # we'd previously assumed; the chart actually deploys
            # valkey/valkey, not redis). Discovered 2026-06-02 after the env
            # rewrite — DB connection worked first try, then crash on
            # `getaddrinfo EAI_AGAIN immich-redis-master`.
            REDIS_HOSTNAME: "immich-valkey"
            # OAuth (Authentik OIDC). The immich-oidc Secret is populated
            # by ESO once the operator provisions the Authentik client +
            # seeds kv/immich/oidc (queued in the OIDC seed batch). Until
            # then those secretKeyRefs resolve to empty strings; Immich
            # treats OAUTH_ENABLED=true + empty issuer as configured-but-
            # broken (not configured-not-attempted) so this stays inert
            # until ES is Ready. Acceptable for now.
            OAUTH_ENABLED: "true"
            # optional:true on the OIDC secretKeyRefs so the server can start
            # before the operator provisions the Authentik client + seeds
            # kv/immich/oidc (queued in the OIDC seed batch). Without
            # optional:true the pod is CreateContainerConfigError until the
            # secret exists. With it, OAUTH_* env stays empty until the
            # secret materializes; Immich's OAuth init logs "issuer empty"
            # but the rest of the app runs. Same pattern as langfuse-oidc.
            OAUTH_ISSUER_URL:
              valueFrom:
                secretKeyRef:
                  name: immich-oidc
                  key: issuer
            OAUTH_CLIENT_ID:
              valueFrom:
                secretKeyRef:
                  name: immich-oidc
                  key: client_id
            OAUTH_CLIENT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: immich-oidc
                  key: client_secret
            OAUTH_AUTO_REGISTER: "true"
            OAUTH_BUTTON_TEXT: "Login with Authentik"

# Microservices (background job worker — ingest, thumbnail,
# transcode, smart-search indexing, face detection).
microservices:
  enabled: true
  # ADR 0036: explicit resources on every container. Microservices
  # transcodes video + generates thumbnails; heavier than the API
  # but still bounded — 2 Gi limit covers concurrent ingest of
  # a burst upload without OOMKilling under LimitRange defaults.
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi

# Valkey — bundled cache (Redis-compatible). Chart default is enabled:false,
# so we have to opt in. Service lands at `immich-valkey` and the chart
# image (valkey/valkey:9.1-alpine) ships with no auth, so REDIS_HOSTNAME
# alone is sufficient (no REDIS_PASSWORD needed). Added 2026-06-02.
valkey:
  enabled: true
  # Same PSS fix as server + machine-learning above. The bjw-s schema means
  # securityContext nests under controllers.main.{pod,containers.main}.
  # Valkey container runs as the valkey user (uid 999 by default for the
  # bitnami/valkey image; alpine variant uses 1000); we run as 1000 here
  # since the chart's image override may not match alpine's default uid.
  controllers:
    main:
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # valkey writes its dump/aof
            capabilities:
              drop: [ALL]
          # ADR 0036: explicit resources on every container.
          # Valkey is Immich's ephemeral job queue — 256Mi limit
          # covers queue depth at homelab photo scale.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi

# Machine-learning (CLIP smart search + ArcFace facial
# recognition). Workers do this entirely on-cluster — per
# ADR 0026 photos are `personal` data and never leave the lab.
machine-learning:
  enabled: true
  controllers:
    main:
      # Same PSS fix as server above — bjw-s schema.
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
  # (dead top-level `image:` block removed — see the note at the
  # server/top of file; bjw-s reads controllers.main.containers.main.image.)
  persistence:
    cache:
      enabled: true
      size: 10Gi
      storageClass: longhorn-replica2
      accessMode: ReadWriteOnce
  # Sized for ~100k-asset library on the operator's hardware.
  # CLIP inference + face embedding share this budget; larger
  # libraries may benefit from raising the limit and pinning
  # to a node with GPU later (no cluster GPU today).
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 4Gi

# (Immich env now lives under server.controllers.main.containers.main.env
# above per the bjw-s common-chart schema. The top-level `env:` and
# `extraEnv:` blocks here were NOT chart keys → silently dropped at render,
# so DB_HOSTNAME fell back to the chart-default "database" and the server
# CrashLoopBackOff'd with `getaddrinfo EAI_AGAIN`. Moved + removed 2026-06-02.)

# service.type, ingress.enabled, and resources at root level are NOT chart
# keys for the bjw-s common library (audit 2026-06-04, finding #13):
#   - service.type: the chart hardcodes service.main.type=ClusterIP in
#     immich/templates/server.yaml — root-level `service:` is silently dropped.
#   - ingress.enabled: chart default is disabled — root-level `ingress:` is dropped.
#   - resources: must nest under server.controllers.main.containers.main.resources
#     (now set there above). Root-level `resources:` is silently dropped.
# All three removed 2026-06-04. Service remains ClusterIP (Cilium HTTPRoute
# owns ingress via httproute.yaml). Resources moved to the correct path.

# (Pod- and container-level security context now live nested under
# server.controllers.main.{pod,containers.main}.securityContext +
# machine-learning.controllers.main.{pod,containers.main}.securityContext
# per the bjw-s common-chart schema. The top-level `podSecurityContext:`
# and `securityContext:` blocks here were NOT chart keys → silently
# dropped at render, PSS-restricted enforcement rejected both deployments.
# Moved + removed 2026-06-01.)
