# Immich helm values (immich-app/immich-charts).
# Per ADR 0024 (Tailscale-only Phase 1 + CF Tunnel via
# immich-public-proxy for public album sharing) +
# ADR 0025 D4 (Immich replaces Synology Photos / PhotoPrism) +
# ADR 0030 (csi-rclone + hot/cold storage split) +
# identity.md (Authentik OIDC).
#
# Storage layout per ADR 0030 §D2:
#   /usr/src/app/upload         ← Longhorn (immich-hot PVC)
#                                 thumbs, previews, encoded
#                                 video, profile, DB backups,
#                                 upload-staging
#   /usr/src/app/upload/library ← csi-rclone (immich-originals
#                                 PVC, StorageClass
#                                 nas-crypt-personal-photos)
#                                 storage-template-organised
#                                 originals, encrypted at NAS
#
# The split keeps thumbs OFF rclone-crypt — every timeline
# scroll is local, no FUSE-decrypt on the hot path. The
# 8-10x read amplification observed on rclone-mounted thumbs
# (Immich discussion #3814) doesn't apply here.
#
# Postgres: EXTERNAL — bundled subchart disabled; uses the
# CNPG cluster from cnpg-cluster.yaml (vectorchord-enabled
# image, required for Immich smart-search + facial-recognition
# vector storage as of v1.133+).
#
# Redis: bundled (chart default; Immich's job queue is
# ephemeral, no need to externalise).
#
# Migration from NAS-Docker PhotoPrism per
# 03-runbooks/immich/migrate-from-photoprism.md.

image:
  repository: ghcr.io/immich-app/immich-server
  # OPERATOR PINS via Renovate. Pin server + ml + microservices
  # to the same Immich version — they share the DB schema.
  tag: "v1.135.0"
  pullPolicy: IfNotPresent

# Bundled Postgres subchart was removed in immich-charts 0.10.0
# (chart enforces this via a checks.yaml template — setting
# `postgresql.enabled: false` is rejected, not no-op'd). We
# use external CNPG (cnpg-cluster.yaml); connection details
# come via the chart's `immich.env` values pointing at the
# Service DNS + ESO-projected creds.

# Persistence — chart-managed PVCs, shared across all components
# (server, microservices, machine-learning). Previously this was
# under `server.persistence` + `microservices.persistence`
# separately; chart moved to a top-level `immich.persistence`
# block that all components mount.
immich:
  persistence:
    # Hot bucket on Longhorn — outer mount.
    library:
      enabled: true
      existingClaim: immich-hot
      mountPath: /usr/src/app/upload
      accessMode: ReadWriteOnce
    # Cold bucket on csi-rclone — inner mount stacked on top
    # of the hot bucket at the `library/` subdir. Immich's
    # storage-template moves originals here on first index.
    originals:
      enabled: true
      existingClaim: immich-originals
      mountPath: /usr/src/app/upload/library
      accessMode: ReadWriteOnce

# Server (HTTP API + web frontend).
server:
  enabled: true
  # Mounts the immich-hot RWO PVC; replicaCount 1. Force Recreate so
  # a chart bump doesn't deadlock (new pod can't attach the RWO volume
  # while the old holds it). immich-charts uses the bjw-s controllers
  # structure → strategy lives at controllers.main.strategy. Added
  # 2026-05-27 (RWO rollout sweep, known-caveats §"Helm-chart rollouts
  # on RWO PVCs").
  controllers:
    main:
      strategy: Recreate
      # PSS-restricted compliance — pod + container hardening MUST be
      # under controllers.main.{pod,containers.main}.securityContext
      # in the bjw-s common schema, NOT at top-level podSecurityContext/
      # securityContext (those are silently dropped → both deployments
      # got rejected by PSS-restricted enforcement: violates "restricted:
      # latest": allowPrivilegeEscalation != false, drop:[ALL] missing,
      # runAsNonRoot != true, seccompProfile missing). Fixed 2026-06-01
      # (cluster degraded sweep). Same wrong-chart-key class as Langfuse
      # and the clickhouse-operator, just under a different chart schema.
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # immich writes /tmp + upload cache
            capabilities:
              drop: [ALL]
          # Immich-server env. DB_* + REDIS_* + OAUTH_* + vector-extension
          # selector — projected from CNPG-managed Secrets + the langfuse-
          # style external-secret pattern. The bjw-s common-chart schema
          # places ALL container env here, under
          # server.controllers.main.containers.main.env (map form). The
          # previous top-level `env:` + `extraEnv:` blocks at file-root
          # level were NOT chart keys → silently dropped at render → server
          # fell back to the chart-default DB_HOSTNAME="database" and hit
          # `getaddrinfo EAI_AGAIN database` on every startup
          # (CrashLoopBackOff). Same wrong-chart-key class as the PSS fix
          # above. Moved 2026-06-02; see TODO §"NAS-encryption follow-ups".
          env:
            # CNPG-issued user creds — Secret name comes from CNPG's
            # role-binding on the immich-pg cluster.
            DB_HOSTNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-pg-app
                  key: host
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-pg-app
                  key: username
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-pg-app
                  key: password
            DB_DATABASE_NAME:
              valueFrom:
                secretKeyRef:
                  name: immich-pg-app
                  key: dbname
            # Vectorchord required for v1.133+ smart-search; CNPG image
            # ships it. Tells Immich's startup probe which vector
            # extension to load.
            DB_VECTOR_EXTENSION: "vectorchord"
            # Redis bundled by the chart — points at the chart's Service.
            REDIS_HOSTNAME: "immich-redis-master"
            # OAuth (Authentik OIDC). The immich-oidc Secret is populated
            # by ESO once the operator provisions the Authentik client +
            # seeds kv/immich/oidc (queued in the OIDC seed batch). Until
            # then those secretKeyRefs resolve to empty strings; Immich
            # treats OAUTH_ENABLED=true + empty issuer as configured-but-
            # broken (not configured-not-attempted) so this stays inert
            # until ES is Ready. Acceptable for now.
            OAUTH_ENABLED: "true"
            OAUTH_ISSUER_URL:
              valueFrom:
                secretKeyRef:
                  name: immich-oidc
                  key: issuer
            OAUTH_CLIENT_ID:
              valueFrom:
                secretKeyRef:
                  name: immich-oidc
                  key: client_id
            OAUTH_CLIENT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: immich-oidc
                  key: client_secret
            OAUTH_AUTO_REGISTER: "true"
            OAUTH_BUTTON_TEXT: "Login with Authentik"

# Microservices (background job worker — ingest, thumbnail,
# transcode, smart-search indexing, face detection).
microservices:
  enabled: true

# Machine-learning (CLIP smart search + ArcFace facial
# recognition). Workers do this entirely on-cluster — per
# ADR 0026 photos are `personal` data and never leave the lab.
machine-learning:
  enabled: true
  controllers:
    main:
      # Same PSS fix as server above — bjw-s schema.
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
  image:
    repository: ghcr.io/immich-app/immich-machine-learning
    tag: "v1.135.0"
  persistence:
    cache:
      enabled: true
      size: 10Gi
      storageClass: longhorn-replica2
      accessMode: ReadWriteOnce
  # Sized for ~100k-asset library on the operator's hardware.
  # CLIP inference + face embedding share this budget; larger
  # libraries may benefit from raising the limit and pinning
  # to a node with GPU later (no cluster GPU today).
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 4Gi

# (Immich env now lives under server.controllers.main.containers.main.env
# above per the bjw-s common-chart schema. The top-level `env:` and
# `extraEnv:` blocks here were NOT chart keys → silently dropped at render,
# so DB_HOSTNAME fell back to the chart-default "database" and the server
# CrashLoopBackOff'd with `getaddrinfo EAI_AGAIN`. Moved + removed 2026-06-02.)

# Don't expose Service externally — Cilium HTTPRoute owns
# ingress (httproute.yaml).
service:
  type: ClusterIP

ingress:
  enabled: false

# (Pod- and container-level security context now live nested under
# server.controllers.main.{pod,containers.main}.securityContext +
# machine-learning.controllers.main.{pod,containers.main}.securityContext
# per the bjw-s common-chart schema. The top-level `podSecurityContext:`
# and `securityContext:` blocks here were NOT chart keys → silently
# dropped at render, PSS-restricted enforcement rejected both deployments.
# Moved + removed 2026-06-01.)

# Resource budget for server + microservices. Sized for
# ~100k photos library, 2-3 simultaneous mobile-backup
# uploads, ML jobs running in the background.
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 4Gi
