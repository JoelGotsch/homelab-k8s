# Immich — self-hosted photo library. Replaces PhotoPrism /
# Synology Photos per ADR 0025 D4. Runbook for the migration:
# `03-runbooks/immich/migrate-from-photoprism.md`. Day-to-day
# usage: `04-guides/photo-management-with-immich.md`.
#
# Helm chart: official immich-app/immich-charts (OCI). Bundled
# Redis kept (chart default); Postgres EXTERNAL via CNPG cluster
# in cnpg-cluster.yaml. Storage layout follows ADR 0030 §D2 —
# hot bucket (thumbs, previews, encoded video, profile,
# backups) on Longhorn; cold bucket (originals) on csi-rclone
# (`nas-crypt-personal-photos` StorageClass from
# `infrastructure/csi-rclone/`). Both PVCs declared in
# pvc.yaml.
#
# Public sharing of albums goes through `apps/immich-public-proxy/`
# behind Cloudflare Tunnel per ADR 0024 D1; Immich itself stays
# Tailscale-only.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: immich

helmCharts:
  - name: immich
    repo: oci://ghcr.io/immich-app/immich-charts
    version: "0.13.1"  # OPERATOR PINS via Renovate
    releaseName: immich
    namespace: immich
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - namespace.yaml
  - cnpg-cluster.yaml
  - pvc.yaml
  - externalsecret.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml

# ADR 0036: cluster-wide resource-governance baseline
# (LimitRange + ResourceQuota + default-deny NetPol scaffold).
components:
  - ../../components/first-party-namespace
  - ../../components/site-config   # build-only ConfigMap for the replacement below

# Resolve the HTTPRoute hostname from the single site-config (no hardcoded
# domain): `immich.FQDN_SUFFIX` -> `immich.<fqdn_suffix>`. Provenance: this rule
# -> ConfigMap/site-config.data.fqdn_suffix -> components/site-config/site-config.env.
replacements:
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.fqdn_suffix }
    targets:
      - select: { kind: HTTPRoute, name: immich }
        fieldPaths: [spec.hostnames.0]
        options: { delimiter: '.', index: 1 }
