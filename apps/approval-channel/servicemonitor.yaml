# Self-metrics: app exposes Prometheus format on /metrics
# (prometheus-client library; see approval_channel/app.py).

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: approval-channel
  namespace: approval-channel
  labels:
    app.kubernetes.io/name: approval-channel
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: approval-channel
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
