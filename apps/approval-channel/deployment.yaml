# approval-channel — Alertmanager + deception webhook receiver
# that formats alerts and forwards to signal-bridge for delivery.
#
# Per ADR 0009 (approval channel) + ADR 0021 D7 + D10. Source
# code at /workspaces/homelab/approval-channel/.

apiVersion: v1
kind: ConfigMap
metadata:
  name: approval-channel-config
  namespace: approval-channel
data:
  # signal-bridge cluster-internal DNS. Non-sensitive.
  APPROVAL_CHANNEL_SIGNAL_BRIDGE_URL: "http://signal-bridge.signal-bridge.svc.cluster.local:8080"
  # HTTP timeout for signal-bridge calls. Per-call budget; signal-cli
  # native build is fast (< 1s typical), 10s leaves headroom.
  APPROVAL_CHANNEL_HTTP_TIMEOUT_S: "10"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: approval-channel
  namespace: approval-channel
  labels:
    app.kubernetes.io/name: approval-channel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: approval-channel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: approval-channel
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Namespace `ci-packages/` (not bare `approval-channel`)
          # because Forgejo Packages OCI URLs = <owner>/<package>
          # and the ci-packages bot can only push to its own
          # owner namespace. See apps/ntfy-e2ee-relay/deployment.yaml
          # for the same rationale. `approval-channel` bare-name
          # was the pre-CI scaffold pin from 2026-04-30 — corrected
          # 2026-07-13 to match what the Woodpecker pipeline
          # actually pushes.
          # Tag is `v0.1.0` (the git tag Woodpecker pushes via
          # ${CI_COMMIT_TAG}), NOT `0.1.0` — the bare-number tag
          # 404s. Digest-pinned: Spegel/containerd resolves
          # first-party refs by digest, and Kyverno's
          # require-first-party-image-digest (ADR 0019 D3)
          # mandates it. Bump both via Renovate on new tags.
          image: "registry.homelab.internal/ci-packages/approval-channel:v0.1.0@sha256:d26983948754fa2d595ce632647da20b0e1cbff1bd4eed587f3269a017afc33e"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: approval-channel-config
            - secretRef:
                name: approval-channel-signal
            - secretRef:
                name: approval-channel-inbound-auth
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: approval-channel
  namespace: approval-channel
  labels:
    app.kubernetes.io/name: approval-channel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: approval-channel
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
