# Signal sender + recipient phone numbers from OpenBao.
#
# Per ADR 0003 (data classification): phone numbers are personal
# data — they don't go in ConfigMaps. The signal-bridge in-cluster
# URL is non-sensitive (cluster-internal DNS) and lives in the
# Deployment's ConfigMap.
#
# OpenBao path layout:
#   kv/data/approval-channel/signal:
#     sender: "+<E.164 number>"           the registered signal-cli account
#     recipients: "+<E.164>,+<E.164>,..."  operator's phone(s) — comma-sep
#
# Bootstrap: operator seeds these paths after registering signal-cli
# (per apps/signal-bridge/README.md "First-install operator action").

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: approval-channel-signal
  namespace: approval-channel
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: approval-channel-signal
    creationPolicy: Owner
  data:
    - secretKey: APPROVAL_CHANNEL_SIGNAL_SENDER
      remoteRef:
        key: approval-channel/signal
        property: sender
    - secretKey: APPROVAL_CHANNEL_SIGNAL_RECIPIENTS
      remoteRef:
        key: approval-channel/signal
        property: recipients
