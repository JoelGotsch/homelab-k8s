# Signal sender + recipient phone numbers + inbound bearer token
# from OpenBao.
#
# Per ADR 0003 (data classification): phone numbers + auth tokens
# are sensitive — they don't go in ConfigMaps. The signal-bridge
# in-cluster URL is non-sensitive (cluster-internal DNS) and
# lives in the Deployment's ConfigMap.
#
# OpenBao path layout:
#   kv/data/approval-channel/signal:
#     sender: "+<E.164 number>"           the registered signal-cli account
#     recipients: "+<E.164>,+<E.164>,..."  operator's phone(s) — comma-sep
#   kv/data/approval-channel/inbound-auth-token:
#     token: <random 32+ byte secret>    bearer-token for /v1/* endpoints
#                                         (Alertmanager calls in with this)
#
# Bootstrap: operator seeds the signal path after registering
# signal-cli (per apps/signal-bridge/README.md "First-install
# operator action") + generates the inbound token at first install
# via `openssl rand -hex 32`.
#
# Two ExternalSecrets here:
# 1. approval-channel-signal — Signal config (env vars consumed
#    by the Python app)
# 2. approval-channel-inbound-auth — bearer token (mirror Secret
#    `approval-channel-inbound-token` exists in monitoring ns
#    via a sibling ExternalSecret in kube-prometheus-stack/, so
#    Alertmanager can reference it via bearer_token_secret)

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: approval-channel-signal
  namespace: approval-channel
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: approval-channel-signal
    creationPolicy: Owner
  data:
    - secretKey: APPROVAL_CHANNEL_SIGNAL_SENDER
      remoteRef:
        key: approval-channel/signal
        property: sender
    - secretKey: APPROVAL_CHANNEL_SIGNAL_RECIPIENTS
      remoteRef:
        key: approval-channel/signal
        property: recipients
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: approval-channel-inbound-auth
  namespace: approval-channel
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: approval-channel-inbound-auth
    creationPolicy: Owner
  data:
    - secretKey: APPROVAL_CHANNEL_INBOUND_AUTH_TOKEN
      remoteRef:
        key: approval-channel/inbound-auth-token
        property: token
