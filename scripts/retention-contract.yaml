      document_index: 0
      selector_path: alertmanager.alertmanagerSpec.storage.volumeClaimTemplate.spec.storageClassName
      mirrors:
        - observability/kube-prometheus-stack/values.yaml.j2
    current_storage_class: longhorn-replica2
    target_storage_class: longhorn-replica2
    desired_reclaim_policy: Delete
    state: compliant
    data_class: internal
    data_value: silences and notification log; routing configuration remains in Git
    backup_tier: tier-1 Longhorn snapshots only; no offsite membership declared
    rpo: loss of current silences and notification log is accepted
    rto: hours to recreate and reload routing from Git
