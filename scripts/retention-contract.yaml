    target_storage_class: longhorn-replica2-retain
    desired_reclaim_policy: Retain
    state: known-mismatch
    data_class: personal
    data_value: Langfuse trace history; possible but expensive to regenerate from telemetry
    backup_tier: declared selective Longhorn raw-volume backup to NAS MinIO longhorn-backups, then tier-3 Restic; live membership observed; crash-consistent, not app-consistent; restore evidence pending
    rpo: 1 hour policy target
    rto: 4 to 24 hours
    migration_owner: KST-03 Langfuse ClickHouse migration
    required_restore_test: restore a workload-consistent ClickHouse backup outside the affected Longhorn volume
