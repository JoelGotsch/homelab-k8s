    target_storage_class: longhorn-replica2-retain
    desired_reclaim_policy: Retain
    state: known-mismatch
    data_class: internal
    data_value: user-created dashboards, annotations, and local Grafana state
    backup_tier: tier-1 Longhorn snapshots only; no declared tier-3 membership
    rpo: 4 hours policy target
    rto: 24 hours
    migration_owner: KST-03 Grafana PVC migration
