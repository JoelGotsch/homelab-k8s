# Static Longhorn lifecycle contract owned by homelab-k8s.
#
# Scope boundary: this file inventories only cluster-owned manifests under
# infrastructure/, platform/, observability/, and components/. User apps whose
# ApplicationSet entry points at another Forgejo repository MUST carry the same
# contract and checker in that owning repository. The workspace aggregate is a
# separate check; adding another repository path here would recreate the
# ownership bug this contract replaces.
#
# `known-mismatch` means fresh desired state still selects a Delete-policy class
# although the declared lifecycle requires Retain. It is containment, not an
# exception and not evidence that a live PV is safe. Never edit an immutable
# claim/template merely to make this file green; KST-03 owns attended migration.
version: 1
owner_repository: homelab-k8s
declared_count: 22
declared_implicit_default_count: 1

scope:
  roots:
    - infrastructure
    - platform
    - observability
    - components
  excluded_directory_names:
    - charts
    - templates
    - testdata
  storage_selector_keys:
    - storageClass
    - storageClassName

storage_classes:
  source: infrastructure/longhorn/storageclasses.yaml
  default: longhorn-replica2
  chart_default:
    source: infrastructure/longhorn/values.yaml
    value_path: .persistence.defaultClass
    enabled: false
  delete:
    - longhorn-replica1
    - longhorn-replica2
    - longhorn-replica3
  retain:
    - longhorn-replica2-retain
    - longhorn-replica3-retain

entries:
  - id: restic-staging
    workload: backup-cronjobs/restic-staging
    namespace: backup-cronjobs
    claim: PersistentVolumeClaim/restic-staging
    source:
      file: infrastructure/backup-cronjobs/pvc.yaml
      value_path: 'select(.kind == "PersistentVolumeClaim" and .metadata.name == "restic-staging") | .spec.storageClassName'
      document_index: 0
      selector_path: spec.storageClassName
    current_storage_class: longhorn-replica1
    target_storage_class: longhorn-replica1
    desired_reclaim_policy: Delete
    state: compliant
    data_class: internal
    data_value: transient copy of MinIO objects while Restic mirrors them
    backup_tier: none; source objects remain in MinIO and the completed Restic repository
    rpo: not applicable to staging
    rto: next successful mirror run
    migration_owner: none
    required_restore_test: recreate the staging claim and complete a no-change mirror
    reason: staging is disposable and must not create orphaned Longhorn volumes

  - id: crowdsec-postgres
    workload: crowdsec-lapi CNPG cluster
    namespace: observability-crowdsec
    claim: Cluster/crowdsec-lapi instances
    source:
      file: observability/crowdsec/cnpg-cluster.yaml
      value_path: 'select(.kind == "Cluster" and .metadata.name == "crowdsec-lapi") | .spec.storage.storageClass'
      document_index: 0
      selector_path: spec.storage.storageClass
    current_storage_class: longhorn-replica3
    target_storage_class: longhorn-replica3-retain
    desired_reclaim_policy: Retain
    state: known-mismatch
    data_class: internal
    data_value: CrowdSec LAPI Postgres state and decisions
    backup_tier: declared CNPG WAL/base to tier-1 MinIO, then tier-3 Restic; live evidence pending
    rpo: 4 hours policy target; WAL path should reduce this to minutes when healthy
    rto: 24 hours
    migration_owner: KST-03 crowdsec CNPG migration
    required_restore_test: recover a disposable CNPG cluster from an off-volume base backup plus WAL
    reason: ADR 0036 requires CNPG primary storage to survive claim deletion

  - id: crowdsec-lapi-data
    workload: CrowdSec LAPI local data
    namespace: observability-crowdsec
    claim: PersistentVolumeClaim/crowdsec-db-pvc
    source:
      file: observability/crowdsec/values.yaml
      value_path: '.lapi.persistentVolume.data.storageClassName'
      document_index: 0
      selector_path: lapi.persistentVolume.data.storageClassName
    rendered_claim_id: crowdsec-db-pvc
    current_storage_class: longhorn-replica2
    target_storage_class: longhorn-replica2
    desired_reclaim_policy: Delete
    state: compliant
    data_class: internal
    data_value: registered bouncer API keys and recreatable LAPI-local data
    backup_tier: none; bouncer registration is declaratively scripted and authoritative decisions live in Postgres
    rpo: bouncer keys are rotated by re-registration after loss
    rto: hours to recreate the claim and rerun bouncer registration
    migration_owner: none
    required_restore_test: recreate a disposable data claim and verify scripted bouncer registration
    reason: local LAPI data is reconstructable and must not leave orphaned volumes

  - id: prometheus-tsdb
    workload: kube-prometheus-stack Prometheus
    namespace: monitoring
    claim: Prometheus/kube-prometheus-stack-prometheus storage
    source:
      file: observability/kube-prometheus-stack/values.yaml
      value_path: '.prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.storageClassName'
      document_index: 0
      selector_path: prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.storageClassName
      mirrors:
        - observability/kube-prometheus-stack/values.yaml.j2
    current_storage_class: longhorn-replica2
    target_storage_class: longhorn-replica2
    desired_reclaim_policy: Delete
    state: compliant
    data_class: internal
    data_value: rebuildable local metrics history
    backup_tier: tier-1 Longhorn snapshots only; no offsite membership declared
    rpo: scrape-forward after loss is accepted by ADR 0036
    rto: hours to recreate and resume scraping
    migration_owner: none
    required_restore_test: recreate a disposable Prometheus data claim and verify scrape recovery
    reason: ADR 0036 explicitly classifies Prometheus TSDB as rebuildable

  - id: alertmanager-state
