# Exact, reviewed containment baseline for P0-07.
#
# This file is intentionally data, not an allowlist hidden in the checker. A
# change here is a policy change and must be reviewed together with evidence
# from the removal gates below. The checker discovers routes independently and
# compares them with this baseline; adding a route without changing this file
# fails, while changing this file produces an obvious policy diff.
#
# This baseline does NOT declare these routes desirable steady state. It records
# temporary drift while notification delivery is migrated to the clarified
# contract: operational alerts use ntfy; Signal carries approval items and an
# explicitly conditional ntfy-outage fallback only.

apiVersion: homelab.internal/v1alpha1
kind: TemporaryNotificationRouteBaseline
metadata:
  name: p0-07-notification-route-containment
spec:
  policy:
    state: containment-only
    intendedPrimary: ntfy
    intendedSignalUse:
      - approval-items
      - conditional-ntfy-outage-fallback
    removalGates:
      signalRoutes:
        - readable-ntfy-receipt-from-the-same-source
        - conditional-signal-fallback-proven
      customRelayRoutes:
        - readable-ntfy-receipt-from-the-parallel-supported-path
        - recipient-compatible-wire-format

  reviewedDrift:
    alertmanager:
      config: observability/kube-prometheus-stack/alertmanager-config.yaml

      # These are operational-alert webhook sinks. The `approval-channel`
      # service name does not make /v1/alert or /v1/deception approval flows.
      # Alertmanager cannot originate an approval item.
      operationalSignalReceivers:
        - name: approval-channel-alert
          url: http://approval-channel.approval-channel.svc.cluster.local:8000/v1/alert
          sendResolved: true
        - name: approval-channel-deception
          url: http://approval-channel.approval-channel.svc.cluster.local:8000/v1/deception
          sendResolved: true

      operationalSignalRoutes:
        - id: alertmanager-deception-signal
          file: observability/kube-prometheus-stack/alertmanager-config.yaml
          marker: P0-07-TEMPORARY-DRIFT(alertmanager-deception-signal)
          receiver: approval-channel-deception
          matchers:
            - name: component
              value: deception
          groupWait: 0s
          groupInterval: 30s
          repeatInterval: 15m
          continue: false

        - id: alertmanager-critical-signal
          file: observability/kube-prometheus-stack/alertmanager-config.yaml
          marker: P0-07-TEMPORARY-DRIFT(alertmanager-critical-signal)
          receiver: approval-channel-alert
          matchers:
            - name: severity
              value: critical
          groupWait: 5s
          groupInterval: 1m
          # Match the reviewed 2026-07-20 anti-noise cadence. This baseline
          # records current drift; it does not authorize Signal as the normal
          # critical-alert transport.
          repeatInterval: 6h
          continue: false

        - id: alertmanager-warning-time-escalation-signal
          file: observability/kube-prometheus-stack/alertmanager-config.yaml
          marker: P0-07-TEMPORARY-DRIFT(alertmanager-warning-time-escalation-signal)
          receiver: approval-channel-alert
          matchers:
            - name: severity
              value: warning
            - name: escalate_after
              value: 1h
          groupWait: 55m
          groupInterval: 15m
          repeatInterval: 4h
          continue: true

    customRelayRoutes:
      # The relay emits a custom encrypted payload which the current mobile
      # client cannot read. Falco is currently suspended in kustomization.yaml,
      # so this is dormant resume configuration rather than a live route. Do
      # not activate or retain it after the parallel Falcosidekick ->
      # Alertmanager -> formatter -> ntfy path has produced a readable
      # synthetic-event receipt.
      - id: falcosidekick-custom-ntfy-relay
        file: observability/falco-stack/values.yaml
        marker: P0-07-TEMPORARY-DRIFT(falcosidekick-custom-ntfy-relay)
        url: http://ntfy-e2ee-relay.ntfy-e2ee-relay.svc.cluster.local:8000/webhook

    directOperationalSignalRoutes:
      # This OpenBao circular-dependency watchdog deliberately bypasses
      # Alertmanager, but its unconditional Signal send is still transitional.
      - id: openbao-watchdog-direct-signal
        file: apps/signal-bridge/openbao-seal-watchdog-cronjob.yaml
        marker: P0-07-TEMPORARY-DRIFT(openbao-watchdog-direct-signal)
        expression: '"$SIGNAL_BRIDGE_URL/v2/send")'
