# Exact, reviewed containment baseline for P0-07.
#
# This file is intentionally data, not an allowlist hidden in the checker. A
# change here is a policy change and must be reviewed together with evidence
# from the removal gates below. The checker discovers routes independently and
# compares them with this baseline; adding a route without changing this file
# fails, while changing this file produces an obvious policy diff.
#
# This baseline does NOT declare these routes desirable steady state. It records
# remaining temporary drift while notification delivery is migrated to the
# clarified contract. Alertmanager fan-out and the incompatible Falco relay are
# gone; the app-owned OpenBao watchdog is the final baselined route until its
# ntfy-first implementation lands.

apiVersion: homelab.internal/v1alpha1
kind: TemporaryNotificationRouteBaseline
metadata:
  name: p0-07-notification-route-containment
spec:
  policy:
    state: containment-only
    intendedPrimary: ntfy
    intendedSignalUse:
      - approval-items
      - conditional-ntfy-outage-fallback
    removalGates:
      signalRoutes:
        - readable-ntfy-receipt-from-the-same-source
        - conditional-signal-fallback-proven
      customRelayRoutes:
        - readable-ntfy-receipt-from-the-parallel-supported-path
        - recipient-compatible-wire-format

  reviewedDrift:
    alertmanager:
      config: observability/kube-prometheus-stack/alertmanager-config.yaml

      operationalSignalReceivers: []
      operationalSignalRoutes: []

    customRelayRoutes: []

    directOperationalSignalRoutes:
      # This OpenBao circular-dependency watchdog deliberately bypasses
      # Alertmanager, but its unconditional Signal send is still transitional.
      - id: openbao-watchdog-direct-signal
        file: apps/signal-bridge/openbao-seal-watchdog-cronjob.yaml
        marker: P0-07-TEMPORARY-DRIFT(openbao-watchdog-direct-signal)
        expression: '"$SIGNAL_BRIDGE_URL/v2/send")'
