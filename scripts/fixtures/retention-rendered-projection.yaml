# Narrow, reviewed projection of storage claims and credential references that
# exist only after Helm inflation. The package digest identifies the exact chart
# archive used for the reviewed render; input_digest_sha256 covers every
# render-affecting file in the layer (excluding only docs and chart/test caches).
