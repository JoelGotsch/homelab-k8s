  mode: reviewed-render-projection
  kustomize_version: v5.8.1
  helm_version: v4.2.0
cluster_defaults:
  storage_class:
    name: longhorn-replica2
    reclaim_policy: Delete
    source_file: infrastructure/longhorn/storageclasses.yaml
    chart_default_source_file: infrastructure/longhorn/values.yaml
    chart_default_value_path: .persistence.defaultClass
    chart_default_enabled: false
