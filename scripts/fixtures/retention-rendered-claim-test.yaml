apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-redis-primary
spec:
  selector:
    matchLabels:
      app: valkey
  serviceName: langfuse-redis-headless
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: example.invalid/valkey:test
  volumeClaimTemplates:
    - metadata:
        name: valkey-data
      spec:
        storageClassName: longhorn-replica2
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 8Gi
---
# Explicit non-Longhorn claims remain outside this Longhorn contract. They are
# inventoried by the extractor but are neither rejected nor added to its set.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: explicit-nfs-example
spec:
  storageClassName: nfs-csi
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
