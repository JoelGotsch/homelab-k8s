# mirror-charts — make a chart bump reach the mirror and the layer, or fail.
#
# CANONICAL STUB (homelab-hooks ci-image/stubs/mirror-charts.yml, ADR 0068).
# Everything from `when:` down must stay byte-identical to the canonical copy at
# the ci-tools release named below — check-ci-stubs enforces it inside the
# image, on every run. Above `when:` is this repository's own header.
#
# The logic lives in the image: `mirror-charts-ci` (homelab-hooks
# ci-image/bin/). Read it there; this file only names the image, passes the
# secrets and says when to run.
#
# ── this repository ──────────────────────────────────────────────────────
#
# STEP 3 OF A7 — THE BUNDLE — IS NOT IN THIS FILE, DELIBERATELY.
#   The other staleness half is the offline chart bundle on the Storage Box.
#   That is `homelab-k8s/scripts/publish-chart-bundle.sh` (which calls
#   export-chart-bundle.sh), and it already exists and is already
#   content-triggered: it digests every charts.lock.yaml, compares against the
#   digest stored offsite, and does nothing when they match. Today it runs from
#   a workstation launchd agent installed by
#   `homelab-infra/scripts/install-chart-bundle-publisher.sh`, for the reasons
#   that script's header gives — the in-cluster egress allowlist has no SMTP,
#   no Forgejo and no registry, and no mirrored image in that layer carries
#   helm. Moving it to a merge-to-main workflow here needs those three things
#   first. Until then the bundle tracks merged locks on an interval, not on
#   merge.
#
# EGRESS — THE BIG ONE, AND EVERY HOST BELOW WAS RESOLVED, NOT GUESSED.
#   This repo's charts.lock.yaml carries 26 entries across 21 distinct upstream
#   hosts — an order of magnitude more than an app repo — so
#   `ci-woodpecker-egress-fqdn` (platform/woodpecker/networkpolicy.yaml) grew
#   by 19 names in the same commit that added this file. Nineteen and not
#   twenty-one, because ghcr.io and raw.githubusercontent.com were already
#   there.
#
#   The trap, and why every index was actually fetched on 2026-08-20 instead
#   of allowlisting the `upstream:` host and hoping: for most Helm indexes the
#   host that serves index.yaml is NOT the host that serves the .tgz. Three
#   shapes are present in this lock, and they need different things:
#
#     relative urls -> the index host serves the tarball too. Verified for
#       charts.jetstack.io (`charts/cert-manager-v1.21.0.tgz`),
#       helm.cilium.io (`cilium-1.20.0.tgz`),
#       pkgs.tailscale.com (`tailscale-operator-1.98.9-<build>.tgz`),
#       charts.min.io (`helm-releases/minio-5.4.0.tgz`) and
#       kyverno.github.io (`kyverno/kyverno-3.8.2.tgz`).
#
#     absolute github.com urls -> the index host AND github.com are both
#       needed, github.com 302s to release-assets.githubusercontent.com. This
#       is the majority: altinity, cloudnative-pg (both charts),
#       external-secrets, longhorn, aquasecurity, grafana (alloy/loki/tempo),
#       crowdsec, prometheus-community, langfuse, open-telemetry, goauthentik,
#       openbao and woodpecker-ci.org. github.com,
#       release-assets.githubusercontent.com and
#       objects.githubusercontent.com were already allowed.
#
#     OCI -> no index at all. ghcr.io (csi-rclone, spegel) was already allowed;
#       code.forgejo.org (the forgejo chart) was NOT and is added.
#
#   csi-driver-nfs is the odd one out: its `upstream` is already
#   raw.githubusercontent.com, which was allowed for other reasons.
#
#   A missing FQDN here fails as a TCP TIMEOUT, not as a policy error: the DNS
#   visibility rule keeps resolution working, so the symptom looks like a slow
#   upstream and not like a firewall. See lessons.md.
#
# SCRIPTS — NO LONGER RUN FROM THIS CHECKOUT (ADR 0068).
#   Until 2026-09-14 this was the one copy that ran scripts/mirror-chart.sh and
#   scripts/check-chart-lock.sh from the working tree, so that CI ran the code
#   the PR contained. Both scripts are now canonical in homelab-hooks and baked
#   into ci-tools; the copies under scripts/ here are byte-identical mirrors for
#   operators, policed by check-synced-scripts. An edit to either script is a
#   homelab-hooks change and a ci-tools release, which this stub then picks up
#   through the grouped Renovate bump.

when:
  - event: pull_request
    path:
      include:
        - charts.lock.yaml
        # The workflow itself, so a PR that changes the image this names runs
        # that image. Lock-only, six `alpine/helm -> v4` PRs went green on
        # 2026-09-14 without ever starting it.
        - .woodpecker/**

steps:
  mirror-and-pin:
    # Digest-pinned per ADR 0019/0023. Renovate bumps tag + digest together
    # across every stub in the repository (group `ci-tools`).
    image: registry.homelab.internal/homelab/ci-tools:v1.9.0@sha256:2cb4a648b494c1d9514defe5b28458b64e05aef14e1ca5a65956084df5b70459
    environment:
      # kv/shared/forgejo-packages/ci — package:write. Chart mirror only.
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_TOKEN:
        from_secret: registry_token
      # kv/shared/forgejo-registry-bot — write:repository. Reads the base lock
      # and the trust bundle, pushes the catch-up commit onto the PR branch.
      GIT_BOT_USER:
        from_secret: git_bot_user
      GIT_BOT_TOKEN:
        from_secret: git_bot_token
    commands:
      - mirror-charts-ci
