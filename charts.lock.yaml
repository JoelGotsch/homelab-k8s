# it appears once here, because the lock records the ARTIFACT, not the release.
#
# content_digest is a hash over the EXTRACTED tree, not over the .tgz: artifact
# bytes are not guaranteed to survive a mirror round-trip, while content is what
# determines the render. Both artifact digests are recorded for provenance and
