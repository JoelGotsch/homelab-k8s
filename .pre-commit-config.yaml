# pre-commit hooks for homelab-k8s.
#
# Install: `pip install pre-commit && pre-commit install` (one-
# time per checkout). Then every `git commit` runs the hooks
# below; failures abort the commit.
#
# Run on demand: `pre-commit run --all-files`.
#
# Per the operator's "script everything scriptable now" policy
# (memory feedback_script-don-t-defer.md): all hooks here are
# repo-local scripts, NOT third-party hooks pulled from the
# internet. Local hooks have no supply-chain surface and CI
# wires them later via `pre-commit run --all-files`.

repos:
  - repo: local
    hooks:
      # Note: check-placeholders.sh is intentionally NOT a
      # pre-commit hook. The <PLACEHOLDER> tokens are
      # operator-fill at cold-start.md Step 13a (deploy time),
      # not commit time. Running as pre-commit would block
      # every commit until operator fills values that should
      # only be filled at deploy. Run check-placeholders.sh
      # manually pre-Argo-apply per the bring-up sequence.

      - id: check-bare-tokens
        name: check for bare ALL_CAPS placeholder tokens at value-bearing keys
        entry: scripts/check-bare-tokens.sh
        language: script
        pass_filenames: false
        files: '\.(yaml|yml|j2)$'

      - id: check-nas-crypt-dataset-paths
        name: every nas-crypt dataset has a unique remotePath, a claimRef, and a bound PVC (ADR 0051)
        entry: scripts/check-nas-crypt-dataset-paths.sh
        language: script
        pass_filenames: false
        # Cross-repo: also reads PVCs from sibling app repos, so it cannot be
        # scoped to this repo's changed files alone. Runs whenever the PV
        # declarations, the classes, or any PVC-bearing manifest here changes.
        files: '(infrastructure/csi-rclone/|.*pvc.*\.ya?ml$|scripts/check-nas-crypt-dataset-paths\.sh$)'

      - id: check-eso-readme
        name: every ExternalSecret-using layer has '## OpenBao paths to seed' in its README
        entry: scripts/check-eso-readme.sh
        language: script
        pass_filenames: false
        files: '(externalsecret.*\.ya?ml|README\.md)$'

      - id: check-openbao-snapshot-auth
        name: OpenBao snapshot auth is short-lived, scoped, and static-token-free
        entry: scripts/check-openbao-snapshot-auth.sh
        language: script
        pass_filenames: false
        files: '(platform/openbao/|scripts/check-openbao-snapshot-auth\.sh$)'

      - id: check-hermetic-kustomize
        name: Kustomize Helm renders are isolated and repo-server mounts the wrapper
        entry: scripts/check-hermetic-kustomize.sh
        language: script
        pass_filenames: false
        files: '(bootstrap/argocd/|scripts/(check-|test-)?hermetic-kustomize|scripts/fixtures/fake-kustomize)'

      - id: check-known-argocd-drift
        name: Kyverno and ClickHouse API defaults cannot hide real Argo drift
        entry: scripts/check-known-argocd-drift.sh
        language: script
        pass_filenames: false
        files: '(bootstrap/applicationsets/infrastructure\.yaml|infrastructure/(kyverno|clickhouse-operator)/|scripts/check-known-argocd-drift\.sh$)'

      - id: test-openbao-snapshot-workload
        name: OpenBao snapshot workload failure and credential-hygiene tests
        entry: scripts/test-openbao-snapshot-workload.sh
        language: script
        pass_filenames: false
        files: '(platform/openbao/snapshot-(auth|upload)\.sh|scripts/test-openbao-snapshot-workload\.sh$)'

      - id: test-openbao-snapshot-auth-guard
        name: OpenBao snapshot auth guard rejects scope mutations
        entry: scripts/test-openbao-snapshot-auth-guard.sh
        language: script
        pass_filenames: false
        files: '(platform/openbao/|scripts/(check|test)-openbao-snapshot-auth.*\.sh$)'

      - id: check-temporary-notification-routes
        name: contain temporary operational Signal and incompatible custom-relay routes
        entry: scripts/check-temporary-notification-routes.sh
        language: script
        pass_filenames: false
        files: '(\.ya?ml$|scripts/check-temporary-notification-routes\.sh$)'
        # P0-07 freezes the exact current alert-routing drift without changing
        # active delivery. Any YAML may introduce a direct/custom-relay route,
        # so the hook intentionally runs for all manifest changes. Baseline
        # expansion is an explicit reviewable policy diff, never an implicit
        # exception in this hook.

      - id: test-alert-router
        name: ntfy-primary alert router and conditional Signal fallback tests
        entry: python3 scripts/test-alert-router.py
        language: system
        pass_filenames: false
        files: '(bootstrap/applicationsets/observability\.yaml|observability/kube-prometheus-stack/(alert_router\.py|alert-formatter\.yaml|alertmanager-config\.yaml|notification-channel-policy\.json)|scripts/test-alert-router\.py)$'

      - id: check-broken-links
        name: relative markdown links + #anchor fragments resolve (cross-repo aware)
        entry: scripts/check-broken-links.sh
        language: script
        pass_filenames: false
        files: '\.md$'

      - id: check-no-mac-addresses
        name: no MAC-address-shaped strings in tracked files (per CLAUDE.md cross-cutting rules)
        entry: scripts/check-no-mac-addresses.sh
        language: script
        pass_filenames: false
        # Always-on; runs every commit. Cheap (single git grep over
        # tracked files); allowlist-by-path inside the script.

      - id: check-no-bare-domain
        name: no value hardcodes the site domain (ADR 0045; was Pick 3)
        entry: scripts/check-no-bare-domain.sh
        language: script
        pass_filenames: false
        files: '\.(yaml|yml)$'
        # Prevents regression of the 45-file Pick-3 templating
        # work (2026-06-03 session). Every .yaml containing the
        # operator's homelab_domain literal must have a .yaml.j2
        # sibling — see homelab-docs/04-guides/cold-start.md §9c.1
        # and homelab-infra/ansible/playbooks/00-render-static.yml
        # cross_repo_renders block.

      - id: check-no-operator-email
        name: no hardcoded operator_email literal in tracked files without a .yaml.j2 sibling (Pick 3 D)
        entry: scripts/check-no-operator-email.sh
        language: script
        pass_filenames: false
        # Always-on; runs every commit. Mirror of check-no-bare-
        # domain.sh for the operator_email var. Prevents regression
        # of the 2026-06-03 PII audit (authentik.yml.example +
        # scripts/README.md were leaking the literal). Allowlist
        # lives at the top of the script.

      - id: check-openbao-paths-coverage
        name: every ExternalSecret kv path is declared in homelab-infra inventory
        entry: >-
          bash -c '[ -d ../homelab-infra ]
          || { echo "skip: homelab-infra not checked out"; exit 0; };
          ../homelab-infra/scripts/check-openbao-paths-coverage.sh'
        language: system
        pass_filenames: false
        files: 'externalsecret.*\.ya?ml$'
        # Mirror of the homelab-infra coverage hook (plan B5 step 2):
        # ES-path drift ORIGINATES in this repo, so the guard must
        # block here too. The script is cross-repo aware ($HK8S) and
        # relies on the side-by-side clone convention (CLAUDE.md
        # workspace map); it skips cleanly when homelab-infra isn't
        # checked out (e.g. single-repo CI). Local script, no
        # third-party hook repo — per the header policy above.

      - id: check-synced-scripts
        name: tri-repo synced scripts are byte-identical
        entry: >-
          bash -c 'for f in check-broken-links.sh check-no-mac-addresses.sh
          check-no-operator-email.sh; do
          for r in ../homelab-docs ../homelab-infra ../homelab-k8s; do
          [ -f "$r/scripts/$f" ] && [ -f "scripts/$f" ]
          && ! cmp -s "scripts/$f" "$r/scripts/$f"
          && { echo "DRIFT: $f vs $r"; exit 1; };
          done; done; exit 0'
        language: system
        pass_filenames: false
        # Plan B5 step 3. The canonical copies live in homelab-docs/
        # scripts/ (per each script's own header); editing one copy
        # without re-syncing the siblings silently forks the guard
        # logic across repos. Always-on (cheap byte compares); repos
        # not checked out side-by-side are skipped. Local inline
        # logic, no third-party hook repo — per the header policy.

      - id: check-cnpg-netpol
        name: CNPG namespaces under egress default-deny carry the full DB egress rule set
        entry: scripts/check-cnpg-netpol.sh
        language: system
        pass_filenames: false
        files: '(networkpolicy|cnpg-cluster).*\.ya?ml$'
        # Guards the llm-gateway/paperless CNPG-outage class (netpol-audit
        # MEDIUM-3, checklist E): once a namespace running a CNPG cluster
        # opts into an egress default-deny, its DB pods MUST get egress to
        # kube-apiserver (443+6443), DNS, MinIO, and their replication
        # peer — or the instance manager CrashLoopBackOffs. Local script.

      - id: check-registry-critical-path
        name: first-party registry ownership and dynamic upstream invariants
        entry: scripts/check-registry-critical-path.sh
        language: script
        pass_filenames: false
        files: '(infrastructure/spegel/values\.yaml|platform/forgejo/registry-direct\.yaml|scripts/check-registry-critical-path\.sh)$'
        # A warm Spegel cache masked both failures. This hook keeps Talos in
        # sole ownership of first-party registry hosts and ensures the direct
        # proxy follows headless-Service endpoint changes.

      - id: check-site-config

        name: site-config.env derived keys consistent + placeholders component-backed

        entry: scripts/check-site-config.sh

        language: script

        pass_filenames: false

        files: 'site-config\.env|kustomization\.yaml|\.yaml$'
      - id: check-data-class
        name: Every first-party namespace declares a valid data-class (ADR 0003/0036 D3)
        entry: scripts/check-data-class.sh
        language: system
        pass_filenames: false
        files: 'namespace\.ya?ml$'
        # Rule 31 — ship the lint with the convention. data-class drives PSS/
        # netpol posture AND is the entry point for the backup decision; it
        # is NOT enforced at admission by Kyverno, so this shift-left guard
        # keeps a new namespace from shipping without a classification.

      - id: check-chart-pin-vendored
        name: vendored Helm chart matches the version pinned in kustomization.yaml
        entry: scripts/check-chart-pin-vendored.sh
        language: script
        files: 'kustomization\.yaml$'
        exclude: '/charts/'
        # Precondition for check-helm-values-keys below: that check reads the
        # VENDORED chart to learn the schema. Renovate bumps the pin but
        # cannot re-pull a tarball, so the vendored copy silently desyncs —
        # on 2026-08-13 four layers (longhorn, trivy-operator, cnpg, alloy)
        # pinned a version they vendored no copy of at all, which made the
        # values check fall through to a network fetch that soft-fails to a
        # warning under deny-by-default CI egress. Green, checking nothing.
        #
        # Canonical copy lives in the homelab-hooks repo; mirrored here
        # because this config's policy (above) is repo-local hooks only.

      - id: check-helm-values-keys
        name: every values.yaml key is recognized by its Helm chart (baseline via .helmcheckignore)
        entry: scripts/check-helm-values-keys.sh
        language: script
        files: '(values\.yaml|kustomization\.yaml|\.helmcheckignore)$'
        exclude: '/charts/'   # vendored charts ship their own values.yaml
        # v2 (TODO refinement): pre-commit mode passes the changed file(s); the
        # script walks up to the owning kustomize layer, diffs its values.yaml
        # keys against the (vendored, offline) chart, and suppresses keys
        # acknowledged in that layer's .helmcheckignore baseline — so only NEW
        # unknown keys block. Enforcement is OPT-IN per layer: a layer blocks
        # only once it carries a .helmcheckignore (currently apps/vaultwarden +
        # observability/langfuse); layers not yet triaged warn but don't block,
        # so this hook is wired repo-wide without reding CI on the pre-existing
        # v1 flags most helm layers still have. Soft-skips if no PyYAML-capable
        # python3 or (non-vendored chart) the repo is unreachable: an env/network
        # blip must never wedge a commit. Bypass: SKIP_HELM_VALUES_KEYS_CHECK=1.

      - id: check-retention-contract
        name: cluster-owned Longhorn selectors match the finite lifecycle contract
        entry: scripts/check-retention-contract.sh
        language: script
        pass_filenames: false
        files: '^(infrastructure|platform|observability|components)/.*\.ya?ml(\.j2)?$|^scripts/(check-retention-contract\.sh|retention-contract\.yaml)$'
        # Distributed app ownership is an enforcement boundary: this hook
        # scans only cluster-owned manifests. Each app repo carries the same
        # repository-local contract; a workspace aggregate checks coverage.

      - id: test-retention-contract
        name: retention lifecycle contract rejects inventory and policy mutations
        entry: scripts/test-retention-contract.sh
        language: script
        pass_filenames: false
        files: '^scripts/(check-retention-contract\.sh|test-retention-contract\.sh|retention-contract\.yaml|fixtures/retention-unparseable-default-storageclass\.yaml\.j2)$'

      - id: check-retention-render-fixtures
        name: pinned chart projection matches retention and secret-reference contracts
        entry: scripts/check-retention-render-fixtures.sh
        language: script
        pass_filenames: false
        files: '^(observability/(langfuse|crowdsec)|platform/woodpecker)/|^scripts/(check-rendered-retention-claims\.sh|check-retention-render-fixtures\.sh|retention-contract\.yaml|fixtures/retention-rendered-(projection|claim-test|implicit-claim-test)\.yaml)$'
        # Offline by default. The reviewed package SHA-256 and layer input
        # digest make the narrow projection hermetic; run the same script with
        # --render after a chart bump to verify a fresh downloaded package.

      - id: test-retention-render-fixtures
        name: rendered claim and S3 secret-reference projection rejects mutations
        entry: scripts/test-retention-render-fixtures.sh
        language: script
        pass_filenames: false
        files: '^(observability/(langfuse|crowdsec)|platform/woodpecker)/|^scripts/(check-rendered-retention-claims\.sh|check-retention-render-fixtures\.sh|test-retention-render-fixtures\.sh|retention-contract\.yaml|fixtures/retention-rendered-(projection|claim-test|implicit-claim-test)\.yaml)$'

      - id: check-langfuse-minio-ingress
        name: MinIO admits only rendered Langfuse web and worker pods
        entry: scripts/check-langfuse-minio-ingress.sh
        language: script
        pass_filenames: false
        files: '^(infrastructure/minio-on-nas/networkpolicy\.yaml|scripts/(check-langfuse-minio-ingress\.sh|fixtures/retention-rendered-projection\.yaml))$'

      - id: test-langfuse-minio-ingress
        name: Langfuse MinIO ingress rejects namespace-wide and selector drift
        entry: scripts/test-langfuse-minio-ingress.sh
        language: script
        pass_filenames: false
        files: '^(infrastructure/minio-on-nas/networkpolicy\.yaml|scripts/(check-langfuse-minio-ingress\.sh|test-langfuse-minio-ingress\.sh|fixtures/retention-rendered-projection\.yaml))$'
