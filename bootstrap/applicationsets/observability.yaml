# ApplicationSet for observability/*. Sync wave 5 — after
# platform but parallel-able with most apps.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://forgejo.lab.vyramo.com/forgejo-admin/homelab-k8s
        revision: main
        directories:
          - path: observability/*
  template:
    metadata:
      name: 'obs-{{.path.basename}}'
      labels:
        layer: observability
        component: '{{.path.basename}}'
      annotations:
        argocd.argoproj.io/sync-wave: '5'
    spec:
      project: default
      source:
        repoURL: https://forgejo.lab.vyramo.com/forgejo-admin/homelab-k8s
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'observability-{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
          - RespectIgnoreDifferences=true
      # Suppress drifts on fields kube-apiserver / operators
      # write back or that are immutable-by-design after
      # create — kept obs-* apps permanently OutOfSync (rule 7).
      ignoreDifferences:
        # obs-tempo: `persistence.storageClassName` was corrected
        # 2026-06-09 (was `persistence.storageClass`, silently
        # dropped per rule 5) but StatefulSet VCTs are immutable
        # after create. Live PVC binds `longhorn-replica2` via
        # cluster default SC, so this drift is cosmetic. Fixing
        # for real would require an orphan-delete of the STS;
        # tempo blocks live in MinIO so it's data-safe, but not
        # worth the churn.
        - group: apps
          kind: StatefulSet
          name: tempo
          namespace: observability-tempo
          jsonPointers:
            - /spec/volumeClaimTemplates
