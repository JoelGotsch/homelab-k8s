# ApplicationSet for observability/*. Sync wave 5 — after
# platform but parallel-able with most apps.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://FORGEJO_FQDN/homelab/homelab-k8s
        revision: main
        directories:
          - path: observability/*
  template:
    metadata:
      name: 'obs-{{.path.basename}}'
      labels:
        layer: observability
        component: '{{.path.basename}}'
      annotations:
        argocd.argoproj.io/sync-wave: '5'
    spec:
      project: default
      source:
        repoURL: https://FORGEJO_FQDN/homelab/homelab-k8s
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        # Default: observability-<layer>. Four layers deploy elsewhere
        # (their manifests pin the namespace) — see templatePatch below.
        namespace: 'observability-{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
          - RespectIgnoreDifferences=true
      # Suppress drifts on fields kube-apiserver / operators
      # write back or that are immutable-by-design after
      # create — kept obs-* apps permanently OutOfSync (rule 7).
      ignoreDifferences:
        # obs-tempo: `persistence.storageClassName` was corrected
        # 2026-06-09 (was `persistence.storageClass`, silently
        # dropped per rule 5) but StatefulSet VCTs are immutable
        # after create. Live PVC binds `longhorn-replica2` via
        # cluster default SC, so this drift is cosmetic. Fixing
        # for real would require an orphan-delete of the STS;
        # tempo blocks live in MinIO so it's data-safe, but not
        # worth the churn.
        - group: apps
          kind: StatefulSet
          name: tempo
          namespace: observability-tempo
          jsonPointers:
            - /spec/volumeClaimTemplates
        # obs-crowdsec: `crowdsec-banned` CiliumCIDRGroup.externalCIDRs
        # is written at runtime by the cidrgroup-sync CronJob (live IP
        # bans). git declares it empty, so without this Argo selfHeal
        # WIPES active bans on every sync AND flags it permanently
        # OutOfSync. Ignore the controller-owned field (2026-08-09;
        # operator-state-trap, rule 7).
        - group: cilium.io
          kind: CiliumCIDRGroup
          name: crowdsec-banned
          jsonPointers:
            - /spec/externalCIDRs
  # Destination overrides for layers whose manifests pin a namespace other
  # than observability-<basename>. Before 2026-08-17 the default destination
  # made CreateNamespace=true mint an EMPTY observability-{langfuse,
  # kube-prometheus-stack,falco-stack} next to the real langfuse /
  # monitoring namespaces (85 days), and deleting the empties by hand
  # would have been recreated on the next sync. The destination is only
  # used for namespace creation and un-namespaced resources here, so this
  # is metadata hygiene, not a move. Renaming the real namespaces instead
  # would mean re-creating every PVC-backed workload in them.
  templatePatch: |
    {{- if eq .path.basename "langfuse" }}
    spec:
      destination:
        namespace: langfuse
    {{- else if or (eq .path.basename "kube-prometheus-stack") (eq .path.basename "falco-stack") (eq .path.basename "blackbox-exporter") }}
    spec:
      destination:
        namespace: monitoring
    {{- end }}
