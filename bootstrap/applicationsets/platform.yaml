# ApplicationSet for platform/* — services that other apps
# depend on (Authentik, OpenBao day-2 config, Forgejo,
# Woodpecker). Sync wave 0 — between infrastructure (wave -10)
# and observability/apps (wave 10+).

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://FORGEJO_FQDN/forgejo-admin/homelab-k8s
        revision: main
        directories:
          - path: platform/*
  template:
    metadata:
      name: 'platform-{{.path.basename}}'
      labels:
        layer: platform
        component: '{{.path.basename}}'
      annotations:
        argocd.argoproj.io/sync-wave: '0'
    spec:
      project: default
      source:
        repoURL: https://FORGEJO_FQDN/forgejo-admin/homelab-k8s
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
