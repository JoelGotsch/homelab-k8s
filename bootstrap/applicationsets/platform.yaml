# ApplicationSet for platform/* — services that other apps
# depend on (Authentik, OpenBao day-2 config, Forgejo,
# Woodpecker). Sync wave 0 — between infrastructure (wave -10)
# and observability/apps (wave 10+).

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # Do NOT arm generated Applications for cascading deletion.
  #
  # By default the ApplicationSet controller stamps
  # `resources-finalizer.argocd.argoproj.io` onto every Application it
  # generates, so the moment one stops being generated — a changed path glob, an
  # `exclude`, a renamed directory — deleting that Application PRUNES everything
  # it manages. For platform/forgejo that is the Deployment, the Services and
  # the PVCs of the git server holding this repository, and the template here
  # declares no finalizer, so nothing in git hints that this is what removal
  # means.
  #
  # `preserveResourcesOnDeletion: true` prevents the finalizer being added, so
  # removing an app from this set orphans its resources instead of destroying
  # them. That is the right default for a homelab whose stated principle is
  # "nothing is deleted": an orphaned Deployment is a five-second re-adoption, a
  # pruned one is a restore. The trade is that intentionally retiring a platform
  # component now needs its resources removed deliberately rather than as a side
  # effect — which is the point.
  #
  # Added 2026-08-19 as the prerequisite for moving platform/forgejo out of this
  # set (ADR 0051 migration, plan B7.0). Verify with:
  #   kubectl -n argocd get application platform-forgejo -o jsonpath='{.metadata.finalizers}'
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: https://FORGEJO_FQDN/homelab/homelab-k8s
        revision: main
        directories:
          - path: platform/*
          # platform/forgejo is declared standalone in
          # bootstrap/platform-forgejo.yaml, so it can be pointed at the GitHub
          # push-mirror while Forgejo itself is down — Argo cannot read the
          # layer that restarts Forgejo out of Forgejo (ADR 0051 migration, B7).
          # It cannot live here: this template's site-config replacement swaps
          # only the HOST token of one repoURL shared by six apps, and the
          # mirror's path segment differs (JoelGotsch/... vs homelab/...).
          #
          # Safe only because syncPolicy.preserveResourcesOnDeletion is set
          # above. Without it this exclude would delete the generated
          # Application AND prune the Forgejo Deployment, Services and PVCs.
          - path: platform/forgejo
            exclude: true
  template:
    metadata:
      name: 'platform-{{.path.basename}}'
      labels:
        layer: platform
        component: '{{.path.basename}}'
      annotations:
        argocd.argoproj.io/sync-wave: '0'
    spec:
      project: default
      source:
        repoURL: https://FORGEJO_FQDN/homelab/homelab-k8s
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
