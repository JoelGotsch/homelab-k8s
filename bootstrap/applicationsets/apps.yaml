# ApplicationSet for user applications. The explicit list keeps each existing
# app-<name> Application owned by this one ApplicationSet while individual
# apps move from homelab-k8s/apps/<name> to an app-owned repository. A cutover
# changes only that app's `repo` and `path` entry; the Application object,
# namespace, sync policy, and live workload identity remain unchanged.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # During repository migration, a malformed or accidentally removed list
    # entry must not delete its existing Application (and therefore must not
    # trigger that Application's resource finalizer).
    applicationsSync: create-update
  generators:
    - list:
        elements:
          # `owner` = Forgejo owner of `repo`. All entries flipped to the
          # `homelab` org 2026-07-30 (user→org migration; roborock piloted
          # 2026-07-28). Skeleton entries still point at the central
          # homelab-k8s repo, which now also lives in the org.
          - {name: approval-channel,    owner: homelab,       repo: approval-channel, path: k8s, autoSync: "true"}
          - {name: frigate,             owner: homelab,       repo: homelab-k8s, path: apps/frigate,             autoSync: "true"}
          - {name: immich,              owner: homelab,       repo: immich, path: k8s, autoSync: "true"}
          - {name: immich-public-proxy, owner: homelab,       repo: immich-public-proxy, path: k8s, autoSync: "true"}
          - {name: jellyfin,            owner: homelab,       repo: jellyfin, path: k8s, autoSync: "true"}
          - {name: knowledge-graph,     owner: homelab,       repo: homelab-k8s, path: apps/knowledge-graph,     autoSync: "true"}
          # librechat: seeds + virtual key landed 2026-07-30 (attended session);
          # autoSync live. homelab/librechat pushed with full history.
          - {name: librechat,           owner: homelab,       repo: librechat, path: k8s, autoSync: "true"}
          - {name: llm-gateway,         owner: homelab,       repo: llm-gateway, path: k8s, autoSync: "true"}
          - {name: nextcloud,           owner: homelab,       repo: nextcloud, path: k8s, autoSync: "true"}
          - {name: ntfy,                owner: homelab,       repo: ntfy, path: k8s, autoSync: "true"}
          - {name: ntfy-e2ee-relay,     owner: homelab,       repo: ntfy-e2ee-relay, path: k8s, autoSync: "true"}
          - {name: paperless,           owner: homelab,       repo: paperless, path: k8s, autoSync: "true"}
          - {name: personal-agent,      owner: homelab,       repo: homelab-k8s, path: apps/personal-agent,      autoSync: "true"}
          - {name: roborock,            owner: homelab,       repo: roborock, path: k8s, autoSync: "true"}
          - {name: signal-bridge,       owner: homelab,       repo: signal-bridge, path: k8s, autoSync: "true"}
          - {name: vaultwarden,         owner: homelab,       repo: vaultwarden, path: k8s, autoSync: "true"}
          - {name: website,             owner: homelab,       repo: homelab-k8s, path: apps/website,             autoSync: "true"}
          - {name: whatsapp-bridge,     owner: homelab,       repo: homelab-k8s, path: apps/whatsapp-bridge,     autoSync: "true"}
          - {name: windmill,            owner: homelab,       repo: homelab-k8s, path: apps/windmill,            autoSync: "true"}
  template:
    metadata:
      name: 'app-{{.name}}'
      labels:
        layer: apps
        component: '{{.name}}'
      annotations:
        argocd.argoproj.io/sync-wave: '10'
    spec:
      project: default
      source:
        repoURL: 'https://FORGEJO_FQDN/{{.owner}}/{{.repo}}'
        targetRevision: main
        path: '{{.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.name}}'
      syncPolicy:
        retry:
          limit: 5
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
  # Keep automation explicit per trusted static list entry so one candidate can
  # be source-switched and diffed without a sync racing the inspection gate.
  templatePatch: |
    {{- if eq .autoSync "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
