# ApplicationSet for user applications. The explicit list keeps each existing
# app-<name> Application owned by this one ApplicationSet while individual
# apps move from homelab-k8s/apps/<name> to an app-owned repository. A cutover
# changes only that app's `repo` and `path` entry; the Application object,
# namespace, sync policy, and live workload identity remain unchanged.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # During repository migration, a malformed or accidentally removed list
    # entry must not delete its existing Application (and therefore must not
    # trigger that Application's resource finalizer).
    applicationsSync: create-update
  generators:
    - list:
        elements:
          # `owner` = Forgejo owner of `repo`. All entries flipped to the
          # `homelab` org 2026-07-30 (user→org migration; roborock piloted
          # 2026-07-28). Skeleton entries still point at the central
          # homelab-k8s repo, which now also lives in the org.
          - {name: approval-channel,    owner: homelab,       repo: approval-channel, path: k8s, autoSync: "true"}
          # Exact-revision sync, runtime RBAC and MCP protocol checks passed
          # during the controlled first rollout on 2026-08-28.
          - {name: cluster-mcp,         owner: homelab,       repo: cluster-mcp, path: k8s, autoSync: "true"}
          # P4 read plane: read:issue-only bot, exact two-tool runtime and
          # credential-aware readiness passed before registration.
          - {name: forgejo-mcp,         owner: homelab,       repo: forgejo-mcp, path: k8s, autoSync: "true"}
          # ADR 0048 D1 — a repo whose entire content is deployment manifests
          # carries the -k8s suffix. Renamed 2026-08-20: immich-public-proxy,
          # immich, jellyfin, librechat, model-manager, nextcloud, ntfy,
          # paperless, signal-bridge, vaultwarden.
          #
          # NOT renamed, because they ship code alongside their k8s/ and D2 is
          # explicit that the suffix means "nothing but manifests":
          # llm-gateway, approval-channel, ntfy-e2ee-relay.
          #
          # The Application NAME never takes the suffix — it names the deployed
          # service, not the repository.
          # The message archive. This repo is MANIFESTS ONLY, hence the -k8s
          # suffix (ADR 0048 D1, renamed 2026-08-20). The CODE lives in
          # forgejo-admin/conversation-history and builds the image — deliberately
          # NOT in this org: the app is not core homelab infrastructure and has
          # not earned org membership, unlike llm-gateway which ships code and
          # keeps its bare name (ADR 0048 D2). Pinning the image digest the
          # pipeline produced is this repo's job.
          #
          # The Application NAME stays `conversation-history` (no suffix) — it
          # names the deployed service, not the repository.
          - {name: conversation-history, owner: homelab, repo: conversation-history-k8s, path: k8s, autoSync: "true"}
          - {name: frigate,             owner: homelab,       repo: homelab-k8s, path: apps/frigate,             autoSync: "true"}
          - {name: immich,              owner: homelab,       repo: immich-k8s, path: k8s, autoSync: "true"}
          - {name: immich-public-proxy, owner: homelab,       repo: immich-public-proxy-k8s, path: k8s, autoSync: "true"}
          - {name: jellyfin,            owner: homelab,       repo: jellyfin-k8s, path: k8s, autoSync: "true"}
          - {name: knowledge-graph,     owner: homelab,       repo: homelab-k8s, path: apps/knowledge-graph,     autoSync: "true"}
          # librechat: seeds + virtual key landed 2026-07-30 (attended session);
          # autoSync live. homelab/librechat pushed with full history.
          - {name: librechat,           owner: homelab,       repo: librechat-k8s, path: k8s, autoSync: "true"}
          - {name: llm-gateway,         owner: homelab,       repo: llm-gateway, path: k8s, autoSync: "true"}
          # model-manager: thin nginx UI (no secrets/image/CI) — auth via
          # the Authentik proxy outpost. Added 2026-08-05.
          - {name: model-manager,       owner: homelab,       repo: model-manager-k8s, path: k8s, autoSync: "true"}
          - {name: nextcloud,           owner: homelab,       repo: nextcloud-k8s, path: k8s, autoSync: "true"}
          - {name: ntfy,                owner: homelab,       repo: ntfy-k8s, path: k8s, autoSync: "true"}
          - {name: ntfy-e2ee-relay,     owner: homelab,       repo: ntfy-e2ee-relay, path: k8s, autoSync: "true"}
          - {name: paperless,           owner: homelab,       repo: paperless-k8s, path: k8s, autoSync: "true"}
          - {name: personal-agent,      owner: homelab,       repo: homelab-k8s, path: apps/personal-agent,      autoSync: "true"}
          # roborock removed 2026-08-04: the vacuum server now runs LOCALLY on a
          # GL-MT6000 (Flint 2) at the remote site (Docker). The homelab servers
          # VLAN is hardened against the raw-L4 external access it needed, so the
          # in-cluster deployment was abandoned. See homelab/roborock repo README.
          - {name: signal-bridge,       owner: homelab,       repo: signal-bridge-k8s, path: k8s, autoSync: "true"}
          # Google Sheets MCP for the LibreChat agent (2026-09-03): pinned
          # third-party server behind supergateway; only network client is the
          # LLM gateway. Activation checklist in the repo README.
          - {name: sheets-mcp,          owner: homelab,       repo: sheets-mcp, path: k8s, autoSync: "true"}
          # Phase 4 dark-mode service, signed images, server-side rehearsal and
          # backup credentials passed before registration; runtime replicas are
          # intentionally zero until Phase 5 identities exist.
          - {name: todo-agents,         owner: homelab,       repo: todo-agents, path: k8s, autoSync: "true"}
          - {name: vaultwarden,         owner: homelab,       repo: vaultwarden-k8s, path: k8s, autoSync: "true"}
          # Phase 3 offline render, production SSA admission, Authentik client,
          # and dedicated backup credentials passed before registration.
          - {name: vikunja,             owner: homelab,       repo: vikunja-k8s, path: k8s, autoSync: "true"}
          - {name: website,             owner: homelab,       repo: homelab-k8s, path: apps/website,             autoSync: "true"}
          - {name: whatsapp-bridge,     owner: homelab,       repo: homelab-k8s, path: apps/whatsapp-bridge,     autoSync: "true"}
          # Exact-revision comparison, restricted tagged smoke job, backup-lane
          # proof, and disposable restore all passed on 2026-08-27.
          - {name: windmill,            owner: homelab,       repo: windmill-k8s, path: k8s, autoSync: "true"}
  template:
    metadata:
      name: 'app-{{.name}}'
      labels:
        layer: apps
        component: '{{.name}}'
      annotations:
        argocd.argoproj.io/sync-wave: '10'
    spec:
      project: default
      source:
        repoURL: 'https://FORGEJO_FQDN/{{.owner}}/{{.repo}}'
        targetRevision: main
        path: '{{.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.name}}'
      syncPolicy:
        retry:
          limit: 5
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
  # Keep automation explicit per trusted static list entry so one candidate can
  # be source-switched and diffed without a sync racing the inspection gate.
  templatePatch: |
    {{- if eq .autoSync "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
