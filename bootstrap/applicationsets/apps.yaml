# ApplicationSet for user applications. The explicit list keeps each existing
# app-<name> Application owned by this one ApplicationSet while individual
# apps move from homelab-k8s/apps/<name> to an app-owned repository. A cutover
# changes only that app's `repo` and `path` entry; the Application object,
# namespace, sync policy, and live workload identity remain unchanged.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # During repository migration, a malformed or accidentally removed list
    # entry must not delete its existing Application (and therefore must not
    # trigger that Application's resource finalizer).
    applicationsSync: create-update
  generators:
    - list:
        elements:
          - {name: approval-channel,    repo: approval-channel, path: k8s, autoSync: "true"}
          - {name: frigate,             repo: homelab-k8s, path: apps/frigate,             autoSync: "true"}
          - {name: immich,              repo: immich, path: k8s, autoSync: "true"}
          - {name: immich-public-proxy, repo: immich-public-proxy, path: k8s, autoSync: "true"}
          - {name: jellyfin,            repo: jellyfin, path: k8s, autoSync: "true"}
          - {name: knowledge-graph,     repo: homelab-k8s, path: apps/knowledge-graph,     autoSync: "true"}
          - {name: llm-gateway,         repo: llm-gateway, path: k8s, autoSync: "true"}
          - {name: nextcloud,           repo: nextcloud, path: k8s, autoSync: "true"}
          - {name: ntfy,                repo: ntfy, path: k8s, autoSync: "true"}
          - {name: ntfy-e2ee-relay,     repo: ntfy-e2ee-relay, path: k8s, autoSync: "true"}
          - {name: paperless,           repo: paperless, path: k8s, autoSync: "true"}
          - {name: personal-agent,      repo: homelab-k8s, path: apps/personal-agent,      autoSync: "true"}
          # roborock enters gated (autoSync "false"): its resources are live but
          # owned by a standalone `roborock` Application (applied 2026-07-20 from
          # the app repo's argocd/application.yaml). Adoption order: generate
          # app-roborock without sync -> non-cascade-delete the standalone
          # Application -> flip autoSync to "true" so app-roborock adopts.
          - {name: roborock,            repo: roborock, path: k8s, autoSync: "false"}
          - {name: signal-bridge,       repo: signal-bridge, path: k8s, autoSync: "true"}
          - {name: vaultwarden,         repo: vaultwarden, path: k8s, autoSync: "true"}
          - {name: website,             repo: homelab-k8s, path: apps/website,             autoSync: "true"}
          - {name: whatsapp-bridge,     repo: homelab-k8s, path: apps/whatsapp-bridge,     autoSync: "true"}
          - {name: windmill,            repo: homelab-k8s, path: apps/windmill,            autoSync: "true"}
  template:
    metadata:
      name: 'app-{{.name}}'
      labels:
        layer: apps
        component: '{{.name}}'
      annotations:
        argocd.argoproj.io/sync-wave: '10'
    spec:
      project: default
      source:
        repoURL: 'https://FORGEJO_FQDN/forgejo-admin/{{.repo}}'
        targetRevision: main
        path: '{{.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.name}}'
      syncPolicy:
        retry:
          limit: 5
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
  # Keep automation explicit per trusted static list entry so one candidate can
  # be source-switched and diffed without a sync racing the inspection gate.
  templatePatch: |
    {{- if eq .autoSync "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
