# ApplicationSet for user applications. The explicit list keeps each existing
# app-<name> Application owned by this one ApplicationSet while individual
# apps move from homelab-k8s/apps/<name> to an app-owned repository. A cutover
# changes only that app's `repo` and `path` entry; the Application object,
# namespace, sync policy, and live workload identity remain unchanged.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # During repository migration, a malformed or accidentally removed list
    # entry must not delete its existing Application (and therefore must not
    # trigger that Application's resource finalizer).
    applicationsSync: create-update
  generators:
    - list:
        elements:
          # `owner` = Forgejo owner of `repo`. Flip to `homelab` as each repo
          # transfers user→org (2026-07-28 migration). Skeletons still point at
          # the central homelab-k8s repo (owner stays forgejo-admin until that
          # repo itself transfers). roborock: transferred + adopted first.
          - {name: approval-channel,    owner: forgejo-admin, repo: approval-channel, path: k8s, autoSync: "true"}
          - {name: frigate,             owner: forgejo-admin, repo: homelab-k8s, path: apps/frigate,             autoSync: "true"}
          - {name: immich,              owner: forgejo-admin, repo: immich, path: k8s, autoSync: "true"}
          - {name: immich-public-proxy, owner: forgejo-admin, repo: immich-public-proxy, path: k8s, autoSync: "true"}
          - {name: jellyfin,            owner: forgejo-admin, repo: jellyfin, path: k8s, autoSync: "true"}
          - {name: knowledge-graph,     owner: forgejo-admin, repo: homelab-k8s, path: apps/knowledge-graph,     autoSync: "true"}
          # librechat: autoSync OFF until OpenBao seeds exist (README
          # §"OpenBao paths to seed" + cold-start 13c row) — flip to "true"
          # as first-install step 3. Added 2026-07-30.
          - {name: librechat,           owner: forgejo-admin, repo: librechat, path: k8s, autoSync: "false"}
          - {name: llm-gateway,         owner: forgejo-admin, repo: llm-gateway, path: k8s, autoSync: "true"}
          - {name: nextcloud,           owner: forgejo-admin, repo: nextcloud, path: k8s, autoSync: "true"}
          - {name: ntfy,                owner: forgejo-admin, repo: ntfy, path: k8s, autoSync: "true"}
          - {name: ntfy-e2ee-relay,     owner: forgejo-admin, repo: ntfy-e2ee-relay, path: k8s, autoSync: "true"}
          - {name: paperless,           owner: forgejo-admin, repo: paperless, path: k8s, autoSync: "true"}
          - {name: personal-agent,      owner: forgejo-admin, repo: homelab-k8s, path: apps/personal-agent,      autoSync: "true"}
          - {name: roborock,            owner: homelab,       repo: roborock, path: k8s, autoSync: "true"}
          - {name: signal-bridge,       owner: forgejo-admin, repo: signal-bridge, path: k8s, autoSync: "true"}
          - {name: vaultwarden,         owner: forgejo-admin, repo: vaultwarden, path: k8s, autoSync: "true"}
          - {name: website,             owner: forgejo-admin, repo: homelab-k8s, path: apps/website,             autoSync: "true"}
          - {name: whatsapp-bridge,     owner: forgejo-admin, repo: homelab-k8s, path: apps/whatsapp-bridge,     autoSync: "true"}
          - {name: windmill,            owner: forgejo-admin, repo: homelab-k8s, path: apps/windmill,            autoSync: "true"}
  template:
    metadata:
      name: 'app-{{.name}}'
      labels:
        layer: apps
        component: '{{.name}}'
      annotations:
        argocd.argoproj.io/sync-wave: '10'
    spec:
      project: default
      source:
        repoURL: 'https://FORGEJO_FQDN/{{.owner}}/{{.repo}}'
        targetRevision: main
        path: '{{.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.name}}'
      syncPolicy:
        retry:
          limit: 5
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
  # Keep automation explicit per trusted static list entry so one candidate can
  # be source-switched and diffed without a sync racing the inspection gate.
  templatePatch: |
    {{- if eq .autoSync "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
