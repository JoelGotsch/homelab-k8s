# ApplicationSet for infrastructure/* — one Argo CD Application
# per subdirectory. Sync wave -10 ensures these come up before
# platform / observability / apps.
#
# Per the wave order documented in cluster/argocd-bootstrap.md
# (homelab-docs).

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/JoelGotsch/homelab-k8s           # filled at first apply (operator's homelab-k8s URL)
        revision: main
        directories:
          - path: infrastructure/*
          - path: infrastructure/sops
            exclude: true             # SOPS handled via external-secrets, not as a separate app
  template:
    metadata:
      name: 'infra-{{.path.basename}}'
      labels:
        layer: infrastructure
        component: '{{.path.basename}}'
      annotations:
        # Sync wave per component; Cilium first, OpenBao early
        # since secrets-engine is needed by cert-manager etc.
        argocd.argoproj.io/sync-wave: '-10'
    spec:
      project: default
      source:
        repoURL: https://github.com/JoelGotsch/homelab-k8s
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        # Most infra components have their own namespace already
        # created in bootstrap-namespaces.yaml; ApplicationSet
        # falls back to creating a namespace named after the dir
        # for ones not pre-created (e.g., 'cilium' = kube-system).
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
      # Suppress fields the target admission webhook writes back
      # into every object — they'd otherwise keep every infra-*
      # app permanently OutOfSync and hide real drift (rule 7).
      ignoreDifferences:
        # Kyverno's ClusterPolicy webhook defaults
        # `spec.admission: true` and per-rule
        # `skipBackgroundRequests` on any rule that uses
        # context.apiCall / generate / verifyImages. Verified
        # 2026-07-11 on 6 ClusterPolicies.
        - group: kyverno.io
          kind: ClusterPolicy
          jsonPointers:
            - /spec/admission
          jqPathExpressions:
            - '.spec.rules[].skipBackgroundRequests'
        # Altinity ClickHouse operator patches its own
        # Deployment labels at runtime (`clickhouse.altinity.com/*`).
        # Field manager `clickhouse-operator` (op=Update) owns
        # these keys — verified 2026-07-11 via
        # `--show-managed-fields`.
        - group: apps
          kind: Deployment
          name: clickhouse-operator-altinity-clickhouse-operator
          namespace: clickhouse-operator
          jsonPointers:
            - /metadata/labels/clickhouse.altinity.com~1app
            - /metadata/labels/clickhouse.altinity.com~1chop
            - /metadata/labels/clickhouse.altinity.com~1chop-commit
            - /metadata/labels/clickhouse.altinity.com~1chop-date
        # Longhorn-manager patches
        # `.spec.conversion.webhook.clientConfig.caBundle` on every
        # Longhorn CRD at runtime; the chart ships `""`. Classic
        # operator-writeback (rule 8 corollary).
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /spec/conversion/webhook/clientConfig/caBundle
