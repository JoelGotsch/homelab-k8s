# ApplicationSet for infrastructure/* — one Argo CD Application
# per subdirectory. Sync wave -10 ensures these come up before
# platform / observability / apps.
#
# Per the wave order documented in cluster/argocd-bootstrap.md
# (homelab-docs).

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://FORGEJO_FQDN/homelab/homelab-k8s           # filled at first apply (operator's homelab-k8s URL)
        revision: main
        directories:
          - path: infrastructure/*
          - path: infrastructure/sops
            exclude: true             # SOPS handled via external-secrets, not as a separate app
  template:
    metadata:
      name: 'infra-{{.path.basename}}'
      labels:
        layer: infrastructure
        component: '{{.path.basename}}'
      annotations:
        # Sync wave per component; Cilium first, OpenBao early
        # since secrets-engine is needed by cert-manager etc.
        argocd.argoproj.io/sync-wave: '-10'
    spec:
      project: default
      source:
        repoURL: https://FORGEJO_FQDN/homelab/homelab-k8s
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        # Most infra components have their own namespace already
        # created in bootstrap-namespaces.yaml; ApplicationSet
        # falls back to creating a namespace named after the dir
        # for ones not pre-created (e.g., 'cilium' = kube-system).
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
          # Without this, ignoreDifferences suppresses only the
          # patch-during-sync, not the Sync=OutOfSync status —
          # the app keeps showing OutOfSync even though Argo
          # will never try to reconcile the diff (rule 7 noise
          # multiplier).
          - RespectIgnoreDifferences=true
      # Suppress fields the target admission webhook writes back
      # into every object — they'd otherwise keep every infra-*
      # app permanently OutOfSync and hide real drift (rule 7).
      ignoreDifferences:
        # Until 2026-09-14 this list opened with a kyverno.io/ClusterPolicy
        # entry ignoring `.spec.rules[].skipBackgroundRequests`,
        # `.spec.rules[].validate.allowExistingViolations` and the deprecated
        # `keys.signatureAlgorithm` writeback — fields Kyverno's
        # mutate-policy webhook stamped on every ClusterPolicy. No
        # ClusterPolicy remains (hl-0284: all policies are policies.kyverno.io
        # kinds, and `mutate-policy.kyverno.svc` only has rules for
        # kyverno.io/clusterpolicies,policies), so the entry is gone rather
        # than kept "just in case": an ignore that matches nothing hides the
        # day a real one is needed. infra-kyverno stayed Synced across two
        # hard refreshes after the removal.
        # Altinity ClickHouse operator patches its own
        # Deployment labels at runtime (`clickhouse.altinity.com/*`).
        # Field manager `clickhouse-operator` (op=Update) owns
        # these keys — verified 2026-07-11 via
        # `--show-managed-fields`.
        - group: apps
          kind: Deployment
          name: clickhouse-operator-altinity-clickhouse-operator
          namespace: clickhouse-operator
          jsonPointers:
            - /metadata/labels/clickhouse.altinity.com~1app
            - /metadata/labels/clickhouse.altinity.com~1chop
            - /metadata/labels/clickhouse.altinity.com~1chop-commit
            - /metadata/labels/clickhouse.altinity.com~1chop-date
        # Longhorn CRD drift: chart ships `spec.preserveUnknownFields:
        # false` (v1beta1-era compat field). K8s v1.29+ strips it
        # on v1 CRDs (implied). Chart also ships caBundle: ""
        # which longhorn-manager patches at runtime with a real
        # bundle. Ignore both.
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /spec/preserveUnknownFields
            - /spec/conversion/webhook/clientConfig/caBundle
        # Kubernetes writes `conversion.strategy: None` and omits the chart's
        # empty metadata.labels map on Kyverno 3.8.2's eleven policy-engine
        # CRDs. Ignore exactly those names; never hide these fields globally
        # because a future CRD may legitimately add labels or a webhook.
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: deletingpolicies.policies.kyverno.io
          jsonPointers: [/spec/conversion, /metadata/labels]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: generatingpolicies.policies.kyverno.io
          jsonPointers: [/spec/conversion, /metadata/labels]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: imagevalidatingpolicies.policies.kyverno.io
          jsonPointers: [/spec/conversion, /metadata/labels]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: mutatingpolicies.policies.kyverno.io
          jsonPointers: [/spec/conversion, /metadata/labels]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespaceddeletingpolicies.policies.kyverno.io
          jsonPointers: [/spec/conversion, /metadata/labels]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespacedgeneratingpolicies.policies.kyverno.io
          jsonPointers: [/spec/conversion, /metadata/labels]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespacedimagevalidatingpolicies.policies.kyverno.io
          jsonPointers: [/spec/conversion, /metadata/labels]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespacedmutatingpolicies.policies.kyverno.io
          jsonPointers: [/spec/conversion, /metadata/labels]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespacedvalidatingpolicies.policies.kyverno.io
          jsonPointers: [/spec/conversion, /metadata/labels]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: policyexceptions.policies.kyverno.io
          jsonPointers: [/spec/conversion, /metadata/labels]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: validatingpolicies.policies.kyverno.io
          jsonPointers: [/spec/conversion, /metadata/labels]
  # infra-kyverno only: diff with the SAME pipeline that applies.
  #
  # `controller.diff.server.side: "true"` (argocd-cmd-params, since 2026-07-21)
  # already makes the controller compute diffs by server-side dry-run, but
  # that path then runs `removeWebhookMutation` to strip whatever admission
  # webhooks added — and Kyverno's `mutate-policy.kyverno.svc` webhook mutated
  # every ClusterPolicy on apply. On the kyverno.io/v1 CRD `spec.rules` was an
  # atomic list (no x-kubernetes-list-type) and `spec.rules[].preconditions`
  # `x-kubernetes-preserve-unknown-fields`, so the stripped and re-merged
  # object could differ from what the apply produced while carrying the same
  # bytes Argo just applied. That is the shape of TODO.md hl-0281 (2026-09-12):
  # `serverside-applied` + `Succeeded` on a policy whose `preconditions`
  # change never landed, generation frozen, every other hypothesis falsified.
  # 2026-09-14 (hl-0284): no ClusterPolicy remains and the mutate-policy
  # webhook has no rule for policies.kyverno.io kinds, so the mechanism this
  # compensates for is gone from this layer. The annotations are KEPT for now
  # — removing them is a separate observed change (hl-0281), not a side effect
  # of the migration; the cost is one webhook-inclusive dry-run per refresh.
  # `IncludeMutationWebhook=true` keeps the webhook's result in the predicted
  # live state instead of stripping it (Argo docs, diff-strategies: "Server-
  # Side Diff does not include changes made by mutation webhooks by default").
  # `ServerSideDiff=true` is stated explicitly so the app does not depend on
  # the global param staying set. Both are Application-level
  # `compare-options` annotations — placing them on a managed resource is
  # inert (lessons.md, tempo 2026-09-09). Scoped to this one app because the
  # webhook cost of the dry-run is paid on every refresh; nothing else here
  # sits behind a mutating webhook of its own.
  #
  # Verified after landing (2026-09-14): see the hl-0281 row for the result of
  # two hard refreshes.
  templatePatch: |
    {{- if eq .path.basename "kyverno" }}
    metadata:
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
    {{- end }}
