# Namespaces created at bootstrap time. ApplicationSets target
# these via `destination.namespace` + `CreateNamespace=true`,
# but having them as explicit resources here gives stable
# pod-security labels + early-wave creation.
#
# ADR 0036 D4 note: infrastructure-tier namespaces below carry
# `homelab.internal/first-party: "true"` + `data-class: internal`
# labels for classification, but DO NOT pull the shared
# `components/first-party-namespace/` component. Their workloads
# need privileged capabilities and unbounded resource shapes that
# would immediately violate the LimitRange / PSS-restricted
# policies (Longhorn manager needs privileged, cert-manager
# webhook cannot fit the default LimitRange, etc.). The Kyverno
# policies apply to first-party namespaces that opt in — see
# ADR 0036 D2/D4.

apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    homelab.internal/first-party: "true"
    homelab.internal/data-class: internal
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    homelab.internal/first-party: "true"
    homelab.internal/data-class: internal
---
apiVersion: v1
kind: Namespace
metadata:
  name: openbao
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
    # baseline (not restricted) because OpenBao Raft requires
    # capabilities not in restricted profile (mlock for
    # memory-pinning).
    homelab.internal/first-party: "true"
    homelab.internal/data-class: secret
---
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    # Longhorn requires privileged for its CSI components.
    homelab.internal/first-party: "true"
    homelab.internal/data-class: internal
---
apiVersion: v1
kind: Namespace
metadata:
  name: nfs-csi
  labels:
    pod-security.kubernetes.io/enforce: privileged
    homelab.internal/first-party: "true"
    homelab.internal/data-class: internal
---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    pod-security.kubernetes.io/enforce: restricted
    homelab.internal/first-party: "true"
    homelab.internal/data-class: internal
    # trust-manager injects the homelab-trust-bundle ConfigMap (defaults +
    # homelab CAs) — mounted over /etc/ssl/certs by all kyverno engine
    # controllers so imageVerify can TLS-validate registry.homelab.internal
    # (2026-07-18; see infrastructure/trust-manager/bundles.yaml).
    homelab.lab/inject-ca: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: trust-manager
  labels:
    pod-security.kubernetes.io/enforce: restricted
    homelab.internal/first-party: "true"
    homelab.internal/data-class: internal
---
# Argo CD's own namespace. Created by the installer
# (homelab-infra/argocd/install/), declared here from 2026-08-15 so the
# CA-injection label is in git rather than applied by hand — trust-manager
# writes the homelab-trust-bundle ConfigMap only into namespaces carrying it,
# and argocd-repo-server needs the internal CA to pull charts from the
# Forgejo Packages mirror (ADR 0052 D3).
#
# Labels mirror what the namespace already carries so adopting it changes
# nothing but the one addition. No homelab.internal/first-party or data-class
# label: Argo CD's workloads predate that scheme here and adding them would
# pull the namespace into Kyverno policy scope as a side effect of a TLS fix.
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    homelab.lab/inject-ca: "true"
