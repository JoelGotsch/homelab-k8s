# Argo CD root kustomization.
# Pointed at by homelab-infra/argocd/root-app.yaml
# (path: bootstrap). Argo CD applies what's listed here.
#
# Layout:
#   - applicationsets/<layer>.yaml — one ApplicationSet per
#     architectural layer (infrastructure, platform,
#     observability, apps). Each ApplicationSet uses Argo's
#     git directories generator to fan out one Application
#     per subdirectory of homelab-k8s/<layer>/.
#   - bootstrap-namespaces.yaml — namespaces created at
#     bootstrap time (referenced by sync waves below).
#   - argocd-self.yaml — Argo CD self-management Application
#     per ADR 0027 (supersedes ADR 0004's "does not manage
#     itself" framing). Targets `argocd/` (this directory's
#     sibling) which applies upstream Argo CD manifests +
#     patches via ServerSideApply.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - bootstrap-namespaces.yaml
  - argocd-self.yaml
  - applicationsets/infrastructure.yaml
  - applicationsets/platform.yaml
  - applicationsets/observability.yaml
  - applicationsets/apps.yaml
  # Standalone, NOT generated by applicationsets/platform.yaml, so it can be
  # pointed at the GitHub mirror while Forgejo is down — see the file's header.
  - platform-forgejo.yaml

# ADR 0001 amendment / site-config phase 2: repoURLs resolve from the single
# site-config (no hardcoded forge host). Provenance: replacements below ->
# ConfigMap/site-config.data.forgejo_fqdn -> components/site-config/site-config.env.
components:
  - ../components/site-config

replacements:
  # ApplicationSets: both the git generator and the app template source.
  # Placeholder form in the files: https://FORGEJO_FQDN/homelab/homelab-k8s
  # -> delimiter '/' index 2 is the host token.
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.forgejo_fqdn }
    targets:
      - select: { kind: ApplicationSet, name: infrastructure }
        fieldPaths:
          - spec.generators.0.git.repoURL
          - spec.template.spec.source.repoURL
        options: { delimiter: '/', index: 2 }
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.forgejo_fqdn }
    targets:
      - select: { kind: ApplicationSet, name: platform }
        fieldPaths:
          - spec.generators.0.git.repoURL
          - spec.template.spec.source.repoURL
        options: { delimiter: '/', index: 2 }
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.forgejo_fqdn }
    targets:
      - select: { kind: ApplicationSet, name: observability }
        fieldPaths:
          - spec.generators.0.git.repoURL
          - spec.template.spec.source.repoURL
        options: { delimiter: '/', index: 2 }
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.forgejo_fqdn }
    targets:
      - select: { kind: ApplicationSet, name: apps }
        fieldPaths:
          - spec.template.spec.source.repoURL
        options: { delimiter: '/', index: 2 }
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.forgejo_fqdn }
    targets:
      - select: { kind: Application, name: argocd-self }
        fieldPaths: [spec.source.repoURL]
        options: { delimiter: '/', index: 2 }
  # platform-forgejo: WHOLE-URL replacement, deliberately with no `options`.
  # Every other repoURL here swaps the host token and keeps `/homelab/
  # homelab-k8s`; this one must be able to become
  # https://github.com/<user>/homelab-k8s, whose path segment differs. Swapping
  # only the host would yield https://github.com/homelab/homelab-k8s, which
  # does not exist — and Argo would report a repo error, not a wrong repo.
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.forgejo_layer_repo_url }
    targets:
      - select: { kind: Application, name: platform-forgejo }
        fieldPaths: [spec.source.repoURL]
