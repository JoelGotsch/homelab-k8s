# Argo CD main config.
# MUST match homelab-infra/argocd/install/patches/argocd-cm.yaml.j2
# rendered output at first commit.

apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  url: "https://argocd.FQDN_SUFFIX"

  # Application resync period. The controller reads this from THIS ConfigMap
  # (env ARGOCD_RECONCILIATION_TIMEOUT <- argocd-cm/timeout.reconciliation in
  # upstream install.yaml). Until 2026-08-16 the key lived only in
  # argocd-cmd-params-cm, where nothing reads it, so the effective period was
  # the code default of 120s (+60s default jitter, timeout.reconciliation.jitter).
  # 180s is the operator intent since first commit; on 68 Applications it takes
  # the periodic full-manifest compare rate from ~27/min (120-180s) down to
  # ~19/min (180-240s).
  timeout.reconciliation: "180s"

  # Enable kustomize's Helm chart inflation generator. See
  # homelab-infra/argocd/install/patches/argocd-cm.yaml.j2 for
  # the full rationale — short version: helmCharts-using
  # layers (e.g. infrastructure/cert-manager) need
  # --enable-helm for Argo's repo-server kustomize-build to
  # work. Must stay in sync between bootstrap (this file) and
  # argocd-self take-over (this same file rendered).
  kustomize.buildOptions: --enable-helm

  # Keep the controller's cluster cache to what Argo actually manages or
  # needs for health/resource trees. Measured 2026-08-16 while root-causing
  # the application-controller OOM loop (see homelab-docs TODO.md and
  # homelab/plans/argo-render-nondeterminism.md "Controller memory"):
  # the cache held 8081 objects / ~102 MiB serialized, of which
  # trivy-operator reports were ~60 MiB (SbomReport 46.5 MiB in 153 objects,
  # VulnerabilityReport 11.4 MiB) — held in memory as unstructured maps at
  # several times their JSON size — and the top watch-event churn was
  # kyverno EphemeralReport (~156 events/min), Longhorn Engine/Volume
  # (~55/min each), PolicyReport, BackupVolume, Snapshot. None of these
  # kinds is managed by any Application (checked against every
  # Application's status.resources); Argo re-decoded every update for
  # nothing. Excluding a kind removes it from the cache AND the watch.
  # NOT excluded on purpose: Pods/Jobs/ReplicaSets (resource trees +
  # health), longhorn.io RecurringJob (managed), kyverno.io ClusterPolicy
  # (managed), cilium.io policies/pools/CIDR groups (managed),
  # postgresql.cnpg.io Cluster/ScheduledBackup (managed).
  # A change here needs a controller restart to purge already-cached objects
  # (Argo docs, "Resource Exclusion/Inclusion").
  resource.exclusions: |
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      - CiliumEndpoint
      clusters:
      - "*"
    # trivy-operator: security reports are read by Grafana/alerts via the
    # operator's metrics, never by Argo.
    - apiGroups:
      - aquasecurity.github.io
      kinds:
      - "*"
      clusters:
      - "*"
    # kyverno: policy/ephemeral/admission reports (kyverno.io/ClusterPolicy
    # itself stays — it is managed).
    - apiGroups:
      - wgpolicyk8s.io
      - reports.kyverno.io
      kinds:
      - "*"
      clusters:
      - "*"
    # Longhorn internals: per-volume engine/replica/snapshot/backup objects
    # churn with every snapshot job and are never in git.
    - apiGroups:
      - longhorn.io
      kinds:
      - Engine
      - Replica
      - Snapshot
      - Backup
      - BackupVolume
      - VolumeAttachment
      - Orphan
      - InstanceManager
      - Volume
      clusters:
      - "*"

  # ---------------------------------------------------------
  # Drift handling: SSA-first hybrid.
  # ---------------------------------------------------------
  # Background: ~30 Applications were chronically OutOfSync /
  # Healthy across the cluster (2026-06-03 census: 84 of 114
  # drifting resources were field-default class) because the
  # API server / CRD admission controllers fill defaults the
  # operator never wrote — HTTPRoute parentRefs[].group/kind,
  # ExternalSecret remoteRef.conversionStrategy, StorageClass
  # parameters.{allow_other,uid,gid} from CSI driver writeback,
  # Gateway listeners[].tls.certificateRefs[].group, etc.
  #
  # Three-prong fix, layered:
  #
  #   1. Server-Side Diff (`controller.diff.server.side: "true"`
  #      in argocd-cmd-params-cm). Argo CD asks the API server
  #      to predict the result with server-side apply dry-run,
  #      so validation and defaulting participate in comparison.
  #      Per the pinned Argo CD 3.4 docs:
  #      https://argo-cd.readthedocs.io/en/release-3.4/user-guide/diff-strategies/#server-side-diff
  #
  #   2. Server-Side Apply at sync time (`ServerSideApply=true`
  #      in each ApplicationSet's syncPolicy.syncOptions, see
  #      bootstrap/applicationsets/*.yaml). Without this the
  #      apply path uses client-side three-way-merge, which
  #      strips fields Argo "doesn't own" — racing with the
  #      controllers and re-creating drift.
  #      https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/#server-side-apply
  #
  #   3. Narrow ignoreDifferences (below) for cases SSA can NOT
  #      fix. The key blocker: many CRDs declare list fields as
  #      `x-kubernetes-list-type: atomic` (e.g. ExternalSecret
  #      spec.data, HTTPRoute spec.parentRefs and rules, Gateway
  #      listeners). Atomic-list ownership means whoever wrote
  #      the LIST owns ALL items within, including CRD defaults
  #      the API server added — so SSA's "compare only Argo's
  #      fields" filter does NOT exclude the defaults. Verified
  #      2026-06-03 against immich-cnpg-s3 ExternalSecret:
  #      argocd-controller manages `f:spec.f:data: {}` (empty
  #      = atomic ownership of the whole array), so the
  #      defaulted conversionStrategy/decodingStrategy/
  #      metadataPolicy fields show as drift even with
  #      server-side diff enabled.

  # ignoreDifferences entries below. Each suppresses CRD-default
  # writeback the operator never declared. Validated 2026-06-03
  # against live resources; SSA alone does not eliminate these
  # because of atomic-list ownership semantics.
  #
  #   - HTTPRoute parentRefs[]/rules[].backendRefs[]: gateway-api
  #     atomic-list, API server defaults group/kind/weight.
  #   - Gateway listeners[].tls.certificateRefs[].group:
  #     atomic-list, defaulted to "".
  #   - ExternalSecret data[].remoteRef: atomic-list, ESO
  #     defaults conversionStrategy/decodingStrategy/
  #     metadataPolicy + target.deletionPolicy.
  #   - StorageClass parameters: rclone CSI driver fills
  #     allow_other/uid/gid from install-time values.yaml.
  #   - ClusterPolicy (kyverno): CRD defaults admission/
  #     background/emitWarning/validationFailureAction/
  #     schemaValidation. Autogen rule writeback also conflicts
  #     with SSA (upstream kyverno/kyverno around #11058).
  #   - apps_Deployment: kube-prometheus-stack-grafana subchart
  #     writes its OWN dashboards-json-config /
  #     sc-dashboard-provider-config checksums on every chart bump.
  #     Scoped to those two names only — see the note on that key;
  #     the generic checksum/config must NOT be ignored.
  #   - Namespace tracking-id: kube-prom-stack monitoring ns
  #     carries a legacy obs-falco-stack tracking-id; SSA
  #     respects the existing annotation's owner and won't
  #     overwrite it without manual annotation reset.
  #
  # Tested-NOT-needed (resolved by SSA alone, no entry here):
  #   Service, ConfigMap, CiliumNetworkPolicy non-atomic specs,
  #   StatefulSet (non-checksum drift), ServiceMonitor.
  resource.customizations.ignoreDifferences.gateway.networking.k8s.io_HTTPRoute: |
    jqPathExpressions:
      - '.spec.parentRefs[].group'
      - '.spec.parentRefs[].kind'
      - '.spec.rules[].backendRefs[].group'
      - '.spec.rules[].backendRefs[].kind'
      - '.spec.rules[].backendRefs[].weight'
  resource.customizations.ignoreDifferences.gateway.networking.k8s.io_Gateway: |
    jqPathExpressions:
      - '.spec.listeners[].tls.certificateRefs[].group'
  resource.customizations.health.gateway.networking.k8s.io_Gateway: |
    -- Argo 3.4.x built-in Gateway health waits for a condition Cilium
    -- never sets, leaving the Gateway (and its Application) eternally
    -- Progressing while Accepted+Programmed were True and all listeners
    -- resolved (infra-ingress, stuck since 2026-07-24; fixed 2026-08-01).
    local hs = {}
    hs.status = "Progressing"
    hs.message = "Waiting for Gateway Accepted + Programmed conditions"
    if obj.status ~= nil and obj.status.conditions ~= nil then
      local accepted = false
      local programmed = false
      for _, c in ipairs(obj.status.conditions) do
        if c.type == "Accepted" and c.status == "True" then accepted = true end
        if c.type == "Programmed" and c.status == "True" then programmed = true end
      end
      if accepted and programmed then
        hs.status = "Healthy"
        hs.message = "Gateway Accepted + Programmed"
      end
    end
    return hs
  resource.customizations.ignoreDifferences.external-secrets.io_ExternalSecret: |
    jqPathExpressions:
      - '.spec.data[].remoteRef.conversionStrategy'
      - '.spec.data[].remoteRef.decodingStrategy'
      - '.spec.data[].remoteRef.metadataPolicy'
      - '.spec.target.deletionPolicy'
  # NOTE the generic `checksum/config` is deliberately NOT ignored (removed
  # 2026-08-13). It is the standard Helm idiom — hash the ConfigMap, stamp it on
  # the pod template — so ignoring it broke config rollout for EVERY chart:
  # Argo applied the new ConfigMap, ignored the changed checksum, left the
  # Deployment untouched, and the pod served stale config indefinitely while
  # Argo correctly reported Synced/Healthy. Cost 4h on the vaultwarden DOMAIN
  # flip; 8 Deployments were affected (forgejo, grafana, minio, litellm, otel
  # collector, trivy-operator, cnpg, vaultwarden).
  #
  # The two Grafana-specific names below stay: they are written by the
  # kube-prometheus-stack sidecar/subchart and are unique to it, so ignoring
  # them by name does not affect any other chart.
  resource.customizations.ignoreDifferences.apps_Deployment: |
    jqPathExpressions:
      - '.spec.template.metadata.annotations."checksum/dashboards-json-config"'
      - '.spec.template.metadata.annotations."checksum/sc-dashboard-provider-config"'
  resource.customizations.ignoreDifferences.Namespace: |
    jqPathExpressions:
      - '.metadata.annotations."argocd.argoproj.io/tracking-id"'

  # ssh.knownHosts: filled post-Forgejo-bring-up.
  # ssh.knownHosts: |
