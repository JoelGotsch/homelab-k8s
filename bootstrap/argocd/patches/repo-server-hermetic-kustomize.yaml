apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      containers:
        - name: argocd-repo-server
          env:
            # Keep the stock binary available at /usr/local/bin/kustomize; the
            # wrapper delegates to it after making an isolated Git snapshot.
            - name: PATH
              value: /opt/homelab-kustomize:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          volumeMounts:
            - name: hermetic-kustomize
              mountPath: /opt/homelab-kustomize/kustomize
              subPath: kustomize
              readOnly: true
      volumes:
        - name: hermetic-kustomize
          configMap:
            name: argocd-hermetic-kustomize
            # Decimal representation of executable mode 0555.
            defaultMode: 365
