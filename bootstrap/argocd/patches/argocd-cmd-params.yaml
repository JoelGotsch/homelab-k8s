# Argo CD command-line parameters.
# MUST match homelab-infra/argocd/install/patches/argocd-cmd-params.yaml
# at first commit (otherwise Argo flips behaviour the moment it
# self-syncs). Drift is detected by
# homelab-infra/scripts/check-values-drift.sh (per ADR 0027).

apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
data:
  # Repo-server RPC timeout for the controller.
  controller.repo.server.timeout.seconds: "60"
  # NB: timeout.reconciliation does NOT belong here — the controller reads it
  # from argocd-cm (see patches/argocd-cm.yaml). It sat here as a no-op until
  # 2026-08-16.

  # Use an API-server dry-run to predict live state during comparisons. This
  # is the documented Argo CD 3.4 controller-level switch; changing it
  # requires an application-controller restart.
  controller.diff.server.side: "true"

  # TLS terminates at the Cilium Gateway, which then talks plain HTTP to
  # argocd-server:80. This is the documented Argo CD pattern for running
  # behind an ingress that terminates TLS (operator-manual/ingress). It has
  # to be "true": with "false" the pod serves HTTPS on 8080 and a Gateway
  # API route cannot reach it without a BackendTLSPolicy — the exact reason
  # openbao.lab still answers 503. Flipped 2026-08-13 together with
  # bootstrap/argocd/httproute.yaml.
  server.insecure: "true"

  # Logs in JSON for Loki ingestion (per ADR 0021).
  server.log.format: "json"
  controller.log.format: "json"
  reposerver.log.format: "json"
