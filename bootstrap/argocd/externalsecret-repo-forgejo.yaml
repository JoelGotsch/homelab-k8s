# ExternalSecret for Argo CD's Forgejo repository credential
# (ADR 0037: Argo pulls homelab-k8s from in-cluster Forgejo).
#
# Projects a Secret labeled `argocd.argoproj.io/secret-type:
# repository` — Argo CD discovers repo credentials by that label,
# no argocd-cm entry needed. The credential is the `svc-argocd`
# Forgejo bot (read-only collaborator on forgejo-admin/homelab-k8s,
# PAT scope read:repository), seeded at
# `kv/argocd/forgejo-repo-cred` (see README "OpenBao paths to
# seed").
#
# Cold start: this ESO has nothing to project until OpenBao is
# unsealed + seeded — which is fine, because during cold start the
# bootstrap manifests are rendered with the credential-less public
# GitHub mirror URL (ADR 0037 D3) and this Secret is unused until
# the repoURL flip to Forgejo.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-repo-forgejo
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: repo-homelab-k8s-forgejo
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        name: homelab-k8s
        url: https://FORGEJO_FQDN/forgejo-admin/homelab-k8s.git
        username: "{{ .username }}"
        password: "{{ .token }}"
  data:
    - secretKey: username
      remoteRef:
        key: argocd/forgejo-repo-cred
        property: username
    - secretKey: token
      remoteRef:
        key: argocd/forgejo-repo-cred
        property: token
