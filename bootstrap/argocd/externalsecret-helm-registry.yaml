# Helm registry credential for argocd-repo-server (ADR 0052 D3).
#
# Charts are referenced from the Forgejo Packages mirror instead of vendored,
# so the reconciler authenticates to registry.homelab.internal at render time.
# The mirror refuses anonymous read (401 — REQUIRE_SIGNIN_VIEW is set
# deliberately beside DISABLE_REGISTRATION, and relaxing it would make the
# whole instance anonymously readable).
#
# The credential is NAMED to helm by HELM_REGISTRY_CONFIG rather than
# established by `helm registry login`, and that distinction is the whole
# reason kustomize can stay in the Helm path. Kustomize invokes `helm pull`
# with HELM_CONFIG_HOME/CACHE_HOME/DATA_HOME replaced by a throwaway
# directory — so a login-stored credential is invisible to the child — but it
# passes the rest of the environment through, so a file named by
# HELM_REGISTRY_CONFIG is read. Measured 2026-08-15; see ADR 0052 D3.
#
# Bot: argocd-chart-pull, scope `read:package` ONLY (not the provisioning
# script's broader default), and in no org team — verified that a pull
# succeeds without org membership, so none was granted.
#
# Format is Docker's config.json, which is exactly what helm's registry config
# is, so the dockerconfigjson type serialises it correctly.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-helm-registry
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: argocd-helm-registry
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "registry.homelab.internal": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: argocd/registry-pull
        property: username
    - secretKey: password
      remoteRef:
        key: argocd/registry-pull
        property: token
