# Argo CD repo-creds credential template for repositories below the current
# Forgejo owner prefix. The repositories are personal repositories owned by
# `forgejo-admin` today; this is an owner URL prefix, not a Forgejo
# organization. If the repositories move to an organization, update this URL
# and the ApplicationSet source template in the same reviewed change.
#
# The template uses the existing svc-argocd read-only credential from
# kv/argocd/forgejo-repo-cred. The bot must retain read access to every matched
# repository, either as a read collaborator today or through an organization
# read team after a future ownership migration.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-repo-creds-forgejo-org
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: repo-creds-forgejo-org
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: https://FORGEJO_FQDN/forgejo-admin
        username: "{{ .username }}"
        password: "{{ .token }}"
  data:
    - secretKey: username
      remoteRef:
        key: argocd/forgejo-repo-cred
        property: username
    - secretKey: token
      remoteRef:
        key: argocd/forgejo-repo-cred
        property: token
