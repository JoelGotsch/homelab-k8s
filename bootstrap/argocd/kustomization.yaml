# Argo CD self-managing layer. Per ADR 0027 (supersedes ADR 0004's
# "Argo CD does not manage itself" framing).
#
# Argo CD applies this Kustomize layer through its own root-app
# reconciliation. ServerSideApply is required when Argo manages
# itself — set globally on the root-app
# (homelab-infra/argocd/root-app.yaml.j2). This layer therefore
# runs through SSA without per-resource opt-in.
#
# Bootstrap-time install (homelab-infra/argocd/install/) uses
# the SAME upstream `install.yaml` at the SAME version, with the
# SAME patches. Once Argo is up + the root-app syncs, Argo takes
# ownership of itself and routine upgrades become a version-pin
# bump in this file (PR + Argo reconcile), not an ansible re-run.
#
# Version pin is an OPERATOR placeholder — must match the version
# in homelab-infra/ansible/inventory/group_vars/all.yml
# (argocd_version) at first commit. After bootstrap, this file is
# the source of truth and the ansible side becomes bootstrap-only.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  # Pinned-by-version Argo CD install manifest from the
  # upstream argo-cd repo. kustomize's URL heuristic flags
  # github.com-hosted URLs as git URLs and tries `git fetch`
  # — which fails against raw.githubusercontent.com. We commit
  # the manifest locally instead. Refresh sequence: download
  # the new version, replace this file, bump argocd_version
  # in homelab-infra group_vars/all/main.yml, commit + push.
  # Source URL pattern:
  #   https://raw.githubusercontent.com/argoproj/argo-cd/<vX.Y.Z>/manifests/install.yaml
  # Current pin: v3.4.5 (matches homelab-infra argocd_version).
  - argocd-install.yaml

  # ESO-projected Authentik OIDC client creds. Targets the
  # Secret `oidc.authentik` referenced by `$oidc.authentik.*`
  # in patches/oidc-config.yaml. See externalsecret.yaml.
  - externalsecret.yaml

  # ESO-projected Forgejo repo credential (svc-argocd read-only
  # PAT) so Argo pulls homelab-k8s from in-cluster Forgejo per
  # ADR 0037. Idle until OpenBao is seeded + repoURLs point at
  # Forgejo; harmless (SecretSyncedError) before that.
  - externalsecret-repo-forgejo.yaml

  # Prefix credential for app-owned repositories under the `homelab`
  # org (the sole owner since the 2026-07-30 user→org migration; the
  # forgejo-admin prefix credential was removed 2026-07-31 after a day
  # of stable org-only pulls). Reuses the read-only svc-argocd token.
  - externalsecret-repo-creds-homelab.yaml

  # Helm chart-mirror pull credential (ADR 0052 D3). Consumed by the
  # repo-server patch below via HELM_REGISTRY_CONFIG.
  - externalsecret-helm-registry.yaml

  # Cilium Gateway route for the Argo CD UI/API. Until 2026-08-13 `argocd-cm`
  # advertised a hostname with no route behind it (silent 404 via the DNS
  # wildcard). Requires server.insecure in patches/argocd-cmd-params.yaml.
  - httproute.yaml

patches:
  - path: patches/argocd-cmd-params.yaml
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm

  - path: patches/argocd-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cm

  - path: patches/server-resources.yaml
    target:
      kind: Deployment
      name: argocd-server

  - path: patches/repo-server-resources.yaml
    target:
      kind: Deployment
      name: argocd-repo-server

  - path: patches/repo-server-hermetic-kustomize.yaml
    target:
      kind: Deployment
      name: argocd-repo-server

  # Chart mirror: credential file + internal CA (ADR 0052 D3).
  - path: patches/repo-server-helm-registry.yaml
    target:
      kind: Deployment
      name: argocd-repo-server

  - path: patches/application-controller-resources.yaml
    target:
      kind: StatefulSet
      name: argocd-application-controller

  # OIDC patch is operator-un-commented when Authentik is up + the
  # argocd OIDC client is created. Until then, Argo CD admin
  # password lands as a Secret at first install.
  #
  # UN-COMMENT BOTH HALVES: this entry AND the `oidc.config` replacement at
  # the top of `replacements:` below. The patch supplies a blob containing
  # `AUTH_FQDN`; the replacement is what turns it into the real issuer host.
  # Enabling this alone ships the literal placeholder as the OIDC issuer.
  # (The replacement cannot be left enabled on its own: with the patch off,
  # argocd-cm has no `data.oidc.config` and kustomize hard-fails with
  # "unable to find field ... in replacement target".)
  # - path: patches/oidc-config.yaml
  #   target:
  #     kind: ConfigMap
  #     name: argocd-cm

# Site-config (see bootstrap/kustomization.yaml for the pattern).
#
# This used to say oidc-config.yaml "stays ansible-rendered: the issuer URL
# lives INSIDE the `oidc.config` string blob, which replacements cannot reach
# into". Half right, and the wrong half was load-bearing. A replacement cannot
# substitute a SUBSTRING of a blob, but it can substitute a delimiter-token of
# one — and the issuer host is a clean '/'-token of that blob. Verified
# 2026-08-20 by enabling the patch and rendering. What actually blocks it is
# that the patch is commented out, so `data.oidc.config` does not exist for a
# replacement to target; both halves are therefore staged together below.
components:
  - ../../components/site-config

# KVAL-01: route repo-server Kustomize invocations through a per-build Git
# snapshot so Helm inflation never writes into Argo's shared cached checkout.
# The content-hashed name rolls the Deployment whenever the wrapper changes.
configMapGenerator:
  - name: argocd-hermetic-kustomize
    files:
      - kustomize=scripts/hermetic-kustomize
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-1"

replacements:
  # Authentik OIDC issuer host, inside the `oidc.config` blob the patch above
  # supplies. Verified 2026-08-20 by enabling both halves and rendering:
  # `AUTH_FQDN` -> `auth.lab.vyramo.com` in
  # `issuer: https://AUTH_FQDN/application/o/argocd/`. Un-comment together with
  # patches/oidc-config.yaml; see the note there.
  #
  # `index: 2` counts '/'-separated tokens across the WHOLE blob, which is
  # index-fragile in a way the value selectors elsewhere in this repo are not —
  # a second URL added ABOVE the issuer line shifts it. Kustomize cannot select
  # a substring of a string, so this is the only shape available here. Re-verify
  # the render if you add a line to that blob.
  # - source: { kind: ConfigMap, name: site-config, fieldPath: data.auth_fqdn }
  #   targets:
  #     - select: { kind: ConfigMap, name: argocd-cm }
  #       fieldPaths: [data.oidc\.config]
  #       options: { delimiter: '/', index: 2 }

  # Forgejo repo credential ExternalSecret: url host token.
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.forgejo_fqdn }
    targets:
      - select: { kind: ExternalSecret, name: argocd-repo-forgejo }
        fieldPaths: [spec.target.template.data.url]
        options: { delimiter: '/', index: 2 }
      - select: { kind: ExternalSecret, name: argocd-repo-creds-forgejo-org }
        fieldPaths: [spec.target.template.data.url]
        options: { delimiter: '/', index: 2 }
      - select: { kind: ExternalSecret, name: argocd-repo-creds-homelab }
        fieldPaths: [spec.target.template.data.url]
        options: { delimiter: '/', index: 2 }
  # argocd-cm public URL: https://argocd.FQDN_SUFFIX -> argocd.<fqdn_suffix>.
  - source: { kind: ConfigMap, name: site-config, fieldPath: data.fqdn_suffix }
    targets:
      - select: { kind: ConfigMap, name: argocd-cm }
        fieldPaths: [data.url]
        options: { delimiter: '.', index: 1 }
      # Same suffix into the HTTPRoute hostname: argocd.FQDN_SUFFIX ->
      # argocd.<fqdn_suffix>. Keeps the route and argocd-cm's url in lockstep
      # from one source, so they cannot drift apart again.
      - select: { kind: HTTPRoute, name: argocd-server }
        fieldPaths: [spec.hostnames.0]
        options: { delimiter: '.', index: 1 }
