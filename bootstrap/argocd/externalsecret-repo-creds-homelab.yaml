# Argo CD repo-creds credential template for repositories under the `homelab`
# Forgejo ORGANIZATION. Coexists with externalsecret-repo-creds-forgejo-owner.yaml
# (the `forgejo-admin` user prefix) DURING the incremental user→org migration:
# each app matches its current owner's credential, so a repo can transfer +
# flip its `apps.yaml` owner without waiting for the whole fleet. Remove the
# forgejo-admin credential once every repo has moved and no owner: forgejo-admin
# entries remain in apps.yaml.
#
# Same svc-argocd read-only credential (kv/argocd/forgejo-repo-cred). The bot
# reads org repos via the `homelab-operators` team (org read access).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-repo-creds-homelab
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: repo-creds-homelab
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: https://FORGEJO_FQDN/homelab
        username: "{{ .username }}"
        password: "{{ .token }}"
  data:
    - secretKey: username
      remoteRef:
        key: argocd/forgejo-repo-cred
        property: username
    - secretKey: token
      remoteRef:
        key: argocd/forgejo-repo-cred
        property: token
