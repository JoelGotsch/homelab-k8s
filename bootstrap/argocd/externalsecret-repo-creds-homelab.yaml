# Argo CD repo-creds credential template for repositories under the `homelab`
# Forgejo ORGANIZATION — the sole repo owner since the 2026-07-30 user→org
# migration (the transitional forgejo-admin prefix credential was removed
# 2026-07-31 once no owner: forgejo-admin entries remained anywhere).
#
# Same svc-argocd read-only credential (kv/argocd/forgejo-repo-cred). The bot
# reads org repos via the `homelab-operators` team (org read access).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-repo-creds-homelab
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: repo-creds-homelab
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: https://FORGEJO_FQDN/homelab
        username: "{{ .username }}"
        password: "{{ .token }}"
  data:
    - secretKey: username
      remoteRef:
        key: argocd/forgejo-repo-cred
        property: username
    - secretKey: token
      remoteRef:
        key: argocd/forgejo-repo-cred
        property: token
