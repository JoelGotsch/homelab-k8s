# ExternalSecret for Argo CD's Authentik OIDC client credentials.
#
# The OIDC config patch (patches/oidc-config.yaml) references
# `$oidc.authentik.clientSecret` — Argo CD's `$<secret>:<key>`
# resolution scheme. The Secret name `oidc.authentik` is matched
# in the argocd namespace; the key `clientSecret` is read.
#
# Argo CD's argocd-server discovers OIDC secret Secrets by the
# `app.kubernetes.io/part-of: argocd` label, so the target Secret
# carries that label via the ESO `template.metadata.labels` block.
#
# `clientID` is also projected here (not strictly required since
# argocd-cm carries it as plain text + operator fills
# <AUTHENTIK_CLIENT_ID_ARGOCD> at first commit) — having both
# ID + secret in OpenBao means rotation is bao-only, with the
# argocd-cm clientID swappable to `$oidc.authentik.clientID`
# downstream if the operator wants pure-secret-driven config.
#
# Until Authentik is up + the operator un-comments the OIDC
# patch in kustomization.yaml, this ESO emits an empty Secret;
# Argo CD's admin password (separate path) is the only login.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: oidc.authentik
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # Required for Argo CD to consider this Secret as
          # part of its config-resolution set.
          app.kubernetes.io/part-of: argocd
      data:
        clientID: "{{ .clientID }}"
        clientSecret: "{{ .clientSecret }}"
  data:
    - secretKey: clientID
      remoteRef:
        key: argocd/oidc
        property: client_id
    - secretKey: clientSecret
      remoteRef:
        key: argocd/oidc
        property: client_secret
