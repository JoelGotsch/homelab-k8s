# platform-forgejo — the ONE platform Application that must be able to
# reconcile from somewhere other than Forgejo.
#
# ############################################################################
# ACTIVE since 2026-08-19. Registered in bootstrap/kustomization.yaml, excluded
# from applicationsets/platform.yaml, repoURL replaced whole from
# site-config's `forgejo_layer_repo_url`.
#
# TO USE IT: flip that ONE key between
#   https://forgejo.<fqdn_suffix>/homelab/homelab-k8s     (normal)
#   https://github.com/<operator_github_user>/homelab-k8s (Forgejo is down)
# and push. check-site-config.sh enforces it is one of exactly those two and
# prints a loud NOTE while it is parked on the mirror.
#
# WHY THE EXCLUDE WAS DANGEROUS, since the danger is invisible in git.
# Argo CD's ApplicationSet controller stamps
# `resources-finalizer.argocd.argoproj.io` onto every Application it generates
# unless `.spec.syncPolicy.preserveResourcesOnDeletion` is true. Removing an app
# from a generator therefore deletes the Application and PRUNES everything it
# manages — here, the Deployment, Services and PVCs of the git server holding
# this repository. Nothing in the ApplicationSet template says so; only the live
# object does.
#
# So the ordering was, and must remain for any future generator narrowing:
#   1. set preserveResourcesOnDeletion on the set, sync, and OBSERVE the
#      finalizer is gone (upstream documents the flag as preventing the
#      finalizer being ADDED, and says nothing about stripping an existing one —
#      on Argo CD 3.4.5 it did strip all six, but that was checked, not assumed):
#        kubectl -n argocd get application platform-forgejo -o jsonpath='{.metadata.finalizers}'
#   2. add the `exclude`, ON ITS OWN, and confirm the namespace is unchanged
#      before continuing — the controller's delete and root-app's create
#      otherwise race, and a create that lands first can still be deleted after.
#   3. register this file and the replacement, letting the same-named
#      Application adopt the orphaned resources.
#   4. strip the stale ownerReference the ApplicationSet left behind.
# ############################################################################
#
# WHY IT IS NOT IN THE platform ApplicationSet
#
# Migrating Forgejo's own datasets (ADR 0051, plan step B7) requires scaling
# Forgejo to 0. While it is down, Argo cannot read the git repository that
# describes how to bring it back up: the layer that owns Forgejo is stored in
# Forgejo. The way out is to point THIS Application at the GitHub push-mirror
# for the duration of the window, and back afterwards.
#
# That cannot be done from inside `applicationsets/platform.yaml`, because one
# `repoURL` there serves all six platform apps, and its site-config replacement
# swaps only the HOST token (`delimiter: '/', index: 2`). GitHub's path is
# `JoelGotsch/homelab-k8s`, not `homelab/homelab-k8s`, so a host-only swap
# would produce a URL that does not exist. Hence: excluded from the set, and
# declared here with a WHOLE-URL replacement from `forgejo_layer_repo_url`.
#
# The Application NAME is deliberately identical to the one the ApplicationSet
# generated (`platform-<basename>`), so Argo adopts the existing Application
# instead of deleting and recreating it — no resource churn, no window where
# platform/forgejo is unmanaged.
#
# `syncPolicy`, wave, project and destination below MUST stay identical to
# applicationsets/platform.yaml's template. If that template changes, change
# this too — there is no generator keeping them in step, and `platform-forgejo`
# silently drifting to different sync semantics than its five siblings is
# exactly the failure this comment exists to prevent.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-forgejo
  namespace: argocd
  labels:
    layer: platform
    component: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: default
  source:
    # Replaced WHOLE (not a delimiter token) from
    # ConfigMap/site-config.data.forgejo_layer_repo_url — see
    # bootstrap/kustomization.yaml. Flipping that one key between the Forgejo
    # URL and the GitHub mirror URL is the entire break-glass mechanism.
    repoURL: FORGEJO_LAYER_REPO_URL
    targetRevision: main
    path: platform/forgejo
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
