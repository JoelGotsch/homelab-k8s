# Example: hostname assembled from site-config at build time (no hardcoded domain).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo
  namespace: demo
spec:
  hostnames:
    - demo.FQDN_SUFFIX   # replaced with demo.<fqdn_suffix> by the replacement below
  parentRefs:
    - name: cilium-gateway
      namespace: ingress
  rules:
    - backendRefs:
        - name: demo
          port: 80
