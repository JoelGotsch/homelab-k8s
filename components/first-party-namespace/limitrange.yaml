# Default per-container resource envelope + PVC size floor
# for every first-party namespace (ADR 0036 D2).
#
# The container defaults are the LimitRange side of a two-tier
# strategy:
#
#   - LimitRange fills in default requests/limits when a
#     PodSpec omits them (soft floor — silent, no admission
#     rejection).
#   - The `homelab-container-resources-required` Kyverno
#     ClusterPolicy in Audit-then-Enforce mode rejects
#     PodSpecs missing explicit requests/limits (hard floor —
#     forces app authors to state their numbers).
#
# The LimitRange keeps the workspace safe *today* (Audit mode
# means Kyverno only warns); the Kyverno policy is the long-run
# enforcement (ADR 0036 D5).
#
# PVC capacity is governed by per-StorageClass ResourceQuota entries, not by
# a shared maximum. A LimitRange maximum applies to every StorageClass, so
# the old 100Gi ceiling rejected valid 200Gi-4Ti NAS-backed claims even
# though they consume no Longhorn capacity.

apiVersion: v1
kind: LimitRange
metadata:
  name: homelab-defaults
spec:
  limits:
    - type: Container
      default:
        # Modest ceiling; workloads with real needs override
        # explicitly in their PodSpec (Kyverno then verifies
        # the override was intentional).
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        # Small request floor: apps still need to *declare* what
        # they want; this only catches the "forgot to set it"
        # path.
        cpu: 50m
        memory: 128Mi
    - type: PersistentVolumeClaim
      min:
        # Trivially-small PVCs are almost always a bug (empty
        # `resources.requests.storage` renders as 0/1Mi). Force
        # a floor.
        storage: 100Mi
