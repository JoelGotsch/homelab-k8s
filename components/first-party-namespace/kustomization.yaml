# First-party-namespace baseline component.
#
# Seeds every namespace labelled `homelab.internal/first-party: "true"`
# with the resource-governance floor mandated by ADR 0036 D2:
#
#   - LimitRange           — per-container defaults + a PVC size floor
#   - ResourceQuota        — per-namespace resource + object-count cap
#   - default-deny NetPol  — vanilla K8s NetworkPolicy defence-in-depth
#                             layer alongside Cilium CNPs
#   - CNP egress scaffold  — commented-out template; apps MUST edit
#                             before deploy (kube-DNS, kube-apiserver,
#                             plus per-app FQDN allowlist)
#
# Usage from an app's kustomization.yaml:
#
#   apiVersion: kustomize.config.k8s.io/v1beta1
#   kind: Kustomization
#   namespace: my-app
#   resources:
#     - namespace.yaml
#     - ...
#   components:
#     - ../../components/first-party-namespace
#
# The component is intentionally namespace-agnostic; the calling
# Kustomization's `namespace:` field (or the app's namespace.yaml)
# stays authoritative for the target namespace.
#
# See ../README.md for override fields, waiver annotations, and
# expected app-side edits.

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - limitrange.yaml
  - resourcequota.yaml
  # DEFERRED — this NetPol conscripts operator-spawned pods
  # (cnpg-system status probes, ESO renders) in every consuming
  # namespace. Verified 2026-07-10: rolling it out under Kyverno
  # regen triggered the forgejo-pg split-brain and blocked
  # cnpg-system → nextcloud-pg / vaultwarden-pg status probes.
  # See CLAUDE.md rule 14 and ADR 0036 D2.
  # Re-add per-namespace once each app's Cilium CNP explicitly
  # covers: cnpg-system → instance:8000 ingress, apiserver
  # egress (443 + 6443), and kube-DNS egress.
  # - networkpolicy-default-deny.yaml
  - ciliumnetworkpolicy-egress-scaffold.yaml
